BV1ydMZ6bE8n）（辅助篇 · 英雄逐个讲分 P）。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>技能数值与完整机制<\/li><li>出装与铭文<\/li><li>对位关系（见 <code>B_克制关系/<\/code>）<\/li><\/ul>", "sum": "技能数值与完整机制出装与铭文对位关系（见 B_克制关系/）"}], "b": [{"id": "K-B06", "cat": "B", "title": "对廉颇：机制克——全游戏只有\"压制\"能断霸体", "self": "<h3><a class=\"kref\" href=\"#K-B06\">K-B06<\/a> 对廉颇：机制克——全游戏只有\"压制\"能断霸体<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：廉颇（全身霸体，靠霸体顶控开团）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong>（最稳的一层，改数值也不变）<\/li><li><strong>我该怎么做<\/strong>：廉颇<strong>第三段击飞出来之前<\/strong>把大捏住。捏住之后他的大招直接废，整套开团链断在第一段。<\/li><li><strong>反向反制<\/strong>：廉颇可以故意<strong>拖时间不交第三段<\/strong>，等你大交出去再开；也可以用位移把战场带走，让捏不到人。所以你捏的时机不是\"看见他就捏\"，而是\"数到他要起第三段的那一下\"。<\/li><li><strong>为什么是机制克<\/strong>：霸体挡控制是靠\"免疫控制\"这条规则，而\"压制\"是唯一不被这条规则豁免的控制类型。这是规则层的克制，不是数值层的。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（规则层判断，与版本无关）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：廉颇（全身霸体，靠霸体顶控开团）克制层级：机制克（最稳的一层，改数值也不变）我该怎么做：廉颇第三段击飞出来之前把大捏住。", "opp": "廉颇"}, {"id": "K-B07", "cat": "B", "title": "张良被谁克：拆火、破隐、以及\"让你捏死一条命不成立\"", "self": "<h3><a class=\"kref\" href=\"#K-B07\">K-B07<\/a> 张良被谁克：拆火、破隐、以及\"让你捏死一条命不成立\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：阿古朵 / 武则天（强拆火）、鬼谷子（隐身接近）、太乙真人 / 复活甲（第二条命）<\/li><li><strong>克制层级<\/strong>：<\/li><li>拆火 → <strong>机制克<\/strong>：你的大是\"持续压制\"，能被拆火打断，这是技能类型决定的<\/li><li>鬼谷子 → <strong>机制克<\/strong>：隐身接近时你<strong>捏不住<\/strong>（看不到就没法指向），而且他大招破隐的视野会直接消解你\"藏视野抓边\"的威慑<\/li><li>太乙/复活甲 → <strong>机制克<\/strong>：你的价值是\"捏死一个人\"，他的价值是\"这条命不算数\"<\/li><li><strong>我该怎么做<\/strong>：<\/li><li>对面有强拆火 → <strong>别把大当开团用<\/strong>，改成\"队友已经贴上去之后再捏\"，让他拆不过来的那一秒<\/li><li>对面有鬼谷子 → 别单独去边路藏视野，跟一个能反视野的队友<\/li><li>对面有太乙/已经出复活甲 → 优先捏<strong>没复活的那个<\/strong>，或者捏完立刻撤，别在原地等<\/li><li><strong>反例<\/strong>：「张良是万能抓人点」——上面三种对手，任何一种都让你的核心动作直接作废。这是<strong>被克得最彻底的一类<\/strong>：不是打得难受，是<strong>功能被删掉<\/strong>。<\/li><li><strong>推广<\/strong>：判断自己被不被克，问一句\"我的核心动作在对面这套阵容下还能不能做出来\"。做不出来就是机制克。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>张良对射手位（公孙离、马可这类高机动）的压制关系 —— 无素材<\/li><li>张良 + 一秒爆发组合的具体对位（见 <code>C_BP/03_组合速查表.md<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：阿古朵 / 武则天（强拆火）、鬼谷子（隐身接近）、太乙真人 / 复活甲（第二条命）克制层级：拆火 → 机制克：你的大是\"持续压制\"，能被拆火打断，这是技能类型决定的鬼…", "opp": ""}], "lanes": ["roam"], "tempo": "early", "job": "open", "motto": "藏视野抓边，捏的是那一秒", "n": 5, "b_n": 2, "vs": ["廉颇"], "incoming": [], "lane_names": ["游走"]}, {"name": "大乔", "hue": 245, "a": [{"id": "K-A31", "cat": "A", "title": "大乔的核心连招是\"一三接大招\"，不是单纯保人", "self": "<h3><a class=\"kref\" href=\"#K-A31\">K-A31<\/a> 大乔的核心连招是\"一三接大招\"，不是单纯保人<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要打一波有准备的团<\/li><li><strong>判断依据<\/strong>：队友是否跟得上（在附近、血量健康）<\/li><li><strong>决策分支<\/strong>：一技能 + 三技能打出控制与位移 → <strong>立刻接大招<\/strong>把人拉进战场 → 二技能留给自己或残血队友撤<\/li><li><strong>反例<\/strong>：「大乔就是奶妈，跟着 C 位跑」——她的收益来自调动，不是治疗。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 04:56；BV1M81kYpEPE @ 08:14（\"放一三连招，接大给队友加个盾传过来\"）<\/li><li><strong>可信度<\/strong>：高（两个不同 UP 一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要打一波有准备的团判断依据：队友是否跟得上（在附近、血量健康）决策分支：一技能 + 三技能打出控制与位移 → 立刻接大招把人拉进战场 → 二技能留给自己或残血队友撤反例：「大乔就是奶…"}, {"id": "K-A32", "cat": "A", "title": "逆风局：断兵线拖发育，团战能接就接", "self": "<h3><a class=\"kref\" href=\"#K-A32\">K-A32<\/a> 逆风局：断兵线拖发育，团战能接就接<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方逆风、对面在推塔<\/li><li><strong>判断依据<\/strong>：能否用二技能回家 + 传送反复截掉对面兵线<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面在推 → 断线、拖节奏、等队友复活<\/li><li>队友开团了 → <strong>能接就一定要接<\/strong>（人数差团战是逆风翻盘的唯一机会）<\/li><li><strong>反例<\/strong>：「逆风就守塔」——守塔是等死，断线才是把时间买回来。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 04:40；@ 04:51<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：己方逆风、对面在推塔判断依据：能否用二技能回家 + 传送反复截掉对面兵线决策分支：对面在推 → 断线、拖节奏、等队友复活队友开团了 → 能接就一定要接（人数差团战是逆风翻盘的唯一机会…"}, {"id": "K-A33", "cat": "A", "title": "大招前先\"勾引\"：让对面先上", "self": "<h3><a class=\"kref\" href=\"#K-A33\">K-A33<\/a> 大招前先\"勾引\"：让对面先上<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方人多、对面犹豫<\/li><li><strong>判断依据<\/strong>：对面有没有开团意图/强行进圈<\/li><li><strong>决策分支<\/strong>：先露一个身位把对面引进来 → 圈放好 → 大招把队友拉过来 → 反打<\/li><li><strong>来源<\/strong>：BV1M81kYpEPE @ 04:37（\"这个就是大招的一个勾引节奏\"）；@ 08:49（\"勾引一下再进圈\"）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A34\">K-A34<\/a> 开局：别跟射手，先帮中路抢线 + 做视野<\/h3>\n<p>这条是<strong>游走位的通用开局排序<\/strong>（「野→边→射→中」），不是大乔特有，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>，判据原表在 <code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>。<\/p>", "sum": "这条是游走位的通用开局排序（「野→边→射→中」），不是大乔特有，已迁到 L_分路/02_游走.md 的 K-L12，判据原表在 K-D08。"}, {"id": "K-A35", "cat": "A", "title": "圈要放在身后，靠\"拉扯\"活着", "self": "<h3><a class=\"kref\" href=\"#K-A35\">K-A35<\/a> 圈要放在身后，靠\"拉扯\"活着<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：团战中持续输出阶段<\/li><li><strong>判断依据<\/strong>：自己的身位是否被对面突进够到<\/li><li><strong>决策分支<\/strong>：把圈放到队伍后方 → 边打边退 → 用二技能回血回蓝再进场<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 07:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>4. 最容易崩的地方<\/h2>\n<ol><li><strong>大招当传送门用<\/strong>：开大是为了打团，不是为了\"人到齐了\"。没有后续动作的大招就是白送 CD。<\/li><li><strong>跟射手走<\/strong>：等于把自己的地图影响力砍掉一半。<\/li><li><strong>不看对面绕后位<\/strong>：对面强开团辅助大概率在绕后，大乔必须先把那个人探出来（原话：\"我们把他辅助探出来\"）。<\/li><\/ol>\n<h2>5. 待补<\/h2>\n<ul><li>极影流的适用条件、S45 出装数值调整。<\/li><li>二技能回血/冷却精确数值。<\/li><li>与苏烈的对位思路已有实战片段（BV14VuVzWEBE @ 01:44：站左侧小草帮射手拆火），可整理进 <code>B_克制关系/<\/code>。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>别「大圈套小圈」<\/strong>：传过去满血又被传回家。<\/li><li><strong>回血圈靠墙放防被推出去<\/strong>：但<strong>圈心不能落进墙体<\/strong>，否则会被卡到别的位置。<\/li><li><strong>一三技能打准了再摇大<\/strong>：否则人早跑了。<\/li><li><strong>血量回到约 4/3 时点大招基本满血归位<\/strong>：这是回城的时机阈值。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "触发条件：团战中持续输出阶段判断依据：自己的身位是否被对面突进够到决策分支：把圈放到队伍后方 → 边打边退 → 用二技能回血回蓝再进场来源：BV14VuVzWEBE @ 07:40可信度：中状…"}], "b": [], "lanes": ["roam"], "tempo": "mid", "job": "open", "motto": "摇人不是救人，是把人数差搬到任何一个点", "n": 4, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}, {"name": "孙膑", "hue": 98, "a": [{"id": "", "cat": "", "title": "实战要点", "self": "<h3>实战要点<\/h3>", "html": "<ul><li><strong>一技能实际生效范围比指示器长<\/strong>：要往身后预判。<\/li><li><strong>二技能回血不受梦魇制裁<\/strong>：对面只有孙膑一个回复点时，<strong>别堆重伤<\/strong>。<\/li><li><strong>减 CD 已改为被动<\/strong>：不必再二接大。<\/li><li><strong>大招只有首秒沉默和末段爆炸<\/strong>：中间什么都不做——所以它主要是个「分隔战场」技能。<\/li><\/ul>", "sum": "一技能实际生效范围比指示器长：要往身后预判。"}, {"id": "", "cat": "", "title": "来源", "self": "<h3>来源<\/h3>", "html": "<p>全部要点来自 <code>冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/code>（辅助篇 · 英雄逐个讲分 P）。<\/p>", "sum": "全部要点来自 冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）（辅助篇 · 英雄逐个讲分 P）。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>技能数值与完整机制<\/li><li>出装与铭文<\/li><li>对位关系（见 <code>B_克制关系/<\/code>）<\/li><\/ul>", "sum": "技能数值与完整机制出装与铭文对位关系（见 B_克制关系/）"}], "b": [{"id": "K-B10", "cat": "B", "title": "被老夫子克：大闪捆五秒，二技能的拉扯价值直接归零", "self": "<h3><a class=\"kref\" href=\"#K-B10\">K-B10<\/a> 被老夫子克：大闪捆五秒，二技能的拉扯价值直接归零<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：老夫子（大闪捆人）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong><\/li><li><strong>为什么成立<\/strong>：孙膑的全部价值在\"二技能让队伍拉开、再回来\"——这是<strong>运动战<\/strong>打法。老夫子的大闪把一个人钉在地上五秒，运动战直接变成\"定点挨打\"，你的加速和回血全都用不上，因为你的人根本动不了。<\/li><li><strong>我该怎么做<\/strong>：<\/li><li>站位<strong>不要和自己的 C 位挤在一起<\/strong>，否则老夫子一个大闪捆两个<\/li><li>二技能在<strong>他起手之前<\/strong>就要开（预判），捆住之后再开已经晚了<\/li><li>队友被捆时，你的作用是<strong>把其他人拉走<\/strong>，不是去救被捆的那个<\/li><li><strong>反向反制<\/strong>：孙膑可以靠<strong>移速优势让老夫子摸不到人<\/strong>（这就是为什么这条克制在高分段成立度会下降——会玩的孙膑不会被单点捆到）。属于\"操作能削弱但机制上仍吃亏\"的一类。<\/li><li><strong>同类的次级克制<\/strong>：金蝉理论能克孙膑，但<strong>一技能飘到人身上要时间<\/strong>，实际弱得多 —— 这条被 UP 明确降级，记在这里是为了说明\"理论克制\"和\"实际克制\"的差距。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>孙膑克制谁（对短腿阵容的拉扯压制）—— 文档没给具体对位，暂不写<\/li><li>孙膑体系的版本折旧（养马流只剩一层，见 <code>C_BP/02_组合补缺.md<\/code> 的 <a class=\"kref\" href=\"#K-C10\">K-C10<\/a>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：老夫子（大闪捆人）克制层级：机制克为什么成立：孙膑的全部价值在\"二技能让队伍拉开、再回来\"——这是运动战打法。", "opp": ""}], "lanes": ["roam"], "tempo": "late", "job": "hold", "motto": "二技能让队伍拉开再回来，别让人钉住", "n": 4, "b_n": 1, "vs": [], "incoming": [], "lane_names": ["游走"]}, {"name": "庄周", "hue": 98, "a": [{"id": "", "cat": "", "title": "实战要点", "self": "<h3>实战要点<\/h3>", "html": "<ul><li><strong>一技能可主动进幻影<\/strong>：免伤加霸体。<\/li><li><strong>大招除解控还给盾<\/strong>：队友没被控但快死也能救。<\/li><li><strong>单人被控用一技能解，大招留给团战<\/strong>：满装大招还有 38 秒 CD。<\/li><\/ul>", "sum": "一技能可主动进幻影：免伤加霸体。"}, {"id": "", "cat": "", "title": "来源", "self": "<h3>来源<\/h3>", "html": "<p>全部要点来自 <code>冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/code>（辅助篇 · 英雄逐个讲分 P）。<\/p>", "sum": "全部要点来自 冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）（辅助篇 · 英雄逐个讲分 P）。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>技能数值与完整机制<\/li><li>出装与铭文<\/li><li>对位关系（见 <code>B_克制关系/<\/code>）<\/li><\/ul>", "sum": "技能数值与完整机制出装与铭文对位关系（见 B_克制关系/）"}], "b": [{"id": "K-B09", "cat": "B", "title": "被 Poke 与回复类克：双方都少一个开团点，就只能比谁手长、谁能回血", "self": "<h3><a class=\"kref\" href=\"#K-B09\">K-B09<\/a> 被 Poke 与回复类克：双方都少一个开团点，就只能比谁手长、谁能回血<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嬴政、干将（Poke）与各类回复型英雄<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong>——但方向是反的：<strong>这是庄周被克<\/strong>，而且克他的不是某个技能，是\"整局的结构\"<\/li><li><strong>为什么成立（这是最值得学的一条）<\/strong>：<\/li><li>庄周的解控和大招，本质是<strong>反开团<\/strong>，不是开团<\/li><li>对面拿嬴政/干将，也不需要开团，只需要消耗<\/li><li>于是<strong>双方都不开团<\/strong>，庄周的解控<strong>没有对象可解<\/strong> → 他的核心技能在这局里是空的<\/li><li>剩下能比的就只有：谁手长（Poke 赢）、谁能回血（回复 name": "鲁班大师", "hue": 9, "a": [{"id": "K-A62", "cat": "A", "title": "开局用一二技能快速上线", "self": "<h3><a class=\"kref\" href=\"#K-A62\">K-A62<\/a> 开局用一二技能快速上线<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：开局<\/li><li><strong>判断依据<\/strong>：是否需要抢线/占视野<\/li><li><strong>决策分支<\/strong>：出门就交一二技能位移，尽快到线（<strong>这是鲁班特有的<\/strong>：别的辅助没有两段位移可用）<\/li><li><strong>到线之后去哪<\/strong>：不要直接冲下路，按 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code> 的「野→边→射→中」排序决定<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 07:09、@ 07:15<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：开局判断依据：是否需要抢线/占视野决策分支：出门就交一二技能位移，尽快到线（这是鲁班特有的：别的辅助没有两段位移可用）到线之后去哪：不要直接冲下路，按 K-L12 的「野→边→射→中…"}, {"id": "K-A63", "cat": "A", "title": "大招吟唱 1.25 秒，必须配合控制才拉得到人", "self": "<h3><a class=\"kref\" href=\"#K-A63\">K-A63<\/a> 大招吟唱 1.25 秒，必须配合控制才拉得到人<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要开团<\/li><li><strong>判断依据<\/strong>：队友有没有先手控、对面有没有位移<\/li><li><strong>决策分支<\/strong>：先 E 闪进场/队友先控 → 再交大招；对面有位移且没被控就不要空拉<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 01:56、@ 05:01<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要开团判断依据：队友有没有先手控、对面有没有位移决策分支：先 E 闪进场/队友先控 → 再交大招；"}, {"id": "K-A64", "cat": "A", "title": "打连招型英雄，链子要\"提前给\"", "self": "<h3><a class=\"kref\" href=\"#K-A64\">K-A64<\/a> 打连招型英雄，链子要\"提前给\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：对面有强开团（孙策、盾山这类）<\/li><li><strong>判断依据<\/strong>：对面是否已经进入开团前摇<\/li><li><strong>决策分支<\/strong>：链子提前挂到被开的人身上，让他自己拉出来；没挂上就是白给<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 08:12（孙策开团被控，二技能点不出来直接融化）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 出装与铭文<\/h2>\n<p><strong>未取到干净数据。<\/strong><\/p>\n<p>标题带\"出装铭文\"的三条（BV1E2421Z7fp 2024-07、BV1yA411W7VM 2021-01、BV1LJ411Q7TJ 2019-11）里，前两条没有可用字幕（一条字幕轨是 LoL 局，一条完全无轨），第三条字幕是探店 vlog。原视频的铭文配置画面存在，但<strong>口播没念、简介没写<\/strong>，抓不到。<\/p>\n<p><strong>只能给方向<\/strong>：鲁班大师是功能型辅助，配置优先\"冷却 + 血量/护盾\"，因为他的价值在技能频率（护盾层数、链子 CD、大招 CD），不在伤害。<\/p>\n<ul><li>待补：S45 具体铭文与六件套。可补的方式见文末。<\/li><\/ul>\n<h2>7. 最容易崩的地方<\/h2>\n<ol><li><strong>链子挂错人<\/strong>：不改\"绝对血量\"设置，团战必错。<\/li><li><strong>大招空拉<\/strong>：1.25 秒吟唱期间对面只要走两步就空，所以没有先手控就别开。<\/li><li><strong>不带射手转线<\/strong>：只在中路晃，等于把二技能最强的用法扔了。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>出装铭文（见上）。<\/li><li>弹弓流等组合技的具体搭档与条件。<\/li><li>对位结论（现无 <code>B_克制关系/鲁班大师.md<\/code>）。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>一技能飞行中拖轮盘能多位移一段<\/strong>：多那一段就是过墙/追人的关键。<\/li><li><strong>大招<\/strong>卡「一半距离」拉人****：对面交了闪也跑不掉。<\/li><li><strong>后仰跳投的卡点是头像上的金币条刚过一点<\/strong>：视觉判据，比数秒可靠。<\/li><li><strong>贴墙放三技能可刷盾<\/strong>：CD 约 2 秒。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "未取到干净数据。"}], "b": [], "lanes": ["roam"], "tempo": "mid", "job": "open", "motto": "链子拉回来，让队友敢进也敢出", "n": 3, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}, {"name": "小乔", "hue": 293, "a": [{"id": "K-A21", "cat": "A", "title": "二技能要放到\"他要去的地方\"，不是\"他在的地方\"", "self": "<h3><a class=\"kref\" href=\"#K-A21\">K-A21<\/a> 二技能要放到\"他要去的地方\"，不是\"他在的地方\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何要交二技能的瞬间<\/li><li><strong>判断依据<\/strong>：目标当前是否在朝某个方向移动（追击、后撤、绕塔）<\/li><li><strong>决策分支<\/strong>：<\/li><li>在移动 → 落点放到他行进路线前端一个身位<\/li><li>原地站桩输出 → 直接放脚下<\/li><li><strong>反例<\/strong>：「二技能空放是手残」——多数空放是\"瞄当前位置\"导致的，不是手残。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:51<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：任何要交二技能的瞬间判断依据：目标当前是否在朝某个方向移动（追击、后撤、绕塔）决策分支：在移动 → 落点放到他行进路线前端一个身位原地站桩输出 → 直接放脚下反例：「二技能空放是手残…"}, {"id": "K-A22", "cat": "A", "title": "打野先手开团时，小乔的大招是\"必中\"的", "self": "<h3><a class=\"kref\" href=\"#K-A22\">K-A22<\/a> 打野先手开团时，小乔的大招是\"必中\"的<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方打野先手切入（尤其是有减速/控制的打野）<\/li><li><strong>判断依据<\/strong>：对面是否正在集火己方打野（站位会聚成一团）<\/li><li><strong>决策分支<\/strong>：直接大招进场压伤害 → 接一技能压状态<\/li><li><strong>反例<\/strong>：「法师要站后排安全输出」——这一波对面已经聚在一起，你的大招收益远大于你多站两秒。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 05:13（\"打野如果开先手……我们直接大招跑过去，技能是必中的\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A23\">K-A23<\/a> 中路有没有线权，看的是\"对面清线速度\"，不是你的血线<\/h3>\n<p>这是<strong>中路通用判据<\/strong>，换任何法师都成立，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。<\/p>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A24\">K-A24<\/a> 一技能蹭野怪：中路顺路的经济，别用普攻<\/h3>\n<p>这是<strong>中路通用动作<\/strong>（\"顺路蹭、别站桩\"），已迁到 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>。小乔的特殊点只有\"一技能边缘能摸到野怪\"这种手感层面，不构成独立判断。<\/p>\n<h2>4. 出装与铭文<\/h2>\n<p><strong>具体铭文组合：未取到干净数据。<\/strong><\/p>\n<p>原因写清楚，免得下次重复踩：标题带\"铭文出装\"的视频（BV1vA411v7C5、BV17s411h76U 等）<strong>字幕轨是错的内容<\/strong>——有的是职场访谈，有的是 LoL 局，说明 ASR 对这类视频根本没有可用语音轨；简介里也没写具体搭配。按规矩，没有原文就不写。<\/p>\n<p><strong>能确认的只有思路层面<\/strong>：小乔是标准 AP 消耗型法师，出装要围绕\"法强 + 法术穿透 + 少量移速\"，对面魔抗堆起来之前先做法穿，魔抗堆起来之后再补穿透类装备。<\/p>\n<ul><li>待补：S45 六件套顺序、铭文红蓝绿配置。补法见本文件末尾。<\/li><\/ul>\n<h2>5. 最容易崩的地方<\/h2>\n<ol><li><strong>把二技能当输出<\/strong>：它只有很短的控制，伤害靠一技能和大招。二技能用空了不可怕，用它换掉对面的关键位移才值。<\/li><li><strong>没线权硬推线<\/strong>：被卡在中路，两边都支援不了，这是小乔最常见的死法。<\/li><li><strong>大招当保命<\/strong>：大招位移很短，交出去之后你就是个站桩法师。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li>出装铭文（见上，需要看画面帧或官网核对）。<\/li><li>与具体英雄的对位结论（现无 <code>B_克制关系/小乔.md<\/code>）。<\/li><\/ul>", "sum": "这是中路通用判据，换任何法师都成立，已迁到 L_分路/01_中路.md 的 K-L01。"}], "b": [], "lanes": ["mid"], "tempo": "late", "job": "follow", "motto": "二技能先手，团战里打满那一片", "n": 2, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "盾山", "hue": 59, "a": [{"id": "K-A52", "cat": "A", "title": "修塔是被低估的技能", "self": "<h3><a class=\"kref\" href=\"#K-A52\">K-A52<\/a> 修塔是被低估的技能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方塔被磨、需要拖时间<\/li><li><strong>判断依据<\/strong>：塔的血量与对面推进速度<\/li><li><strong>决策分支<\/strong>：修塔给塔加护盾（约 600 点量级），换取一波兵线时间<\/li><li><strong>来源<\/strong>：BV13E411p7HY @ 07:06<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A53\">K-A53<\/a> 盾山吃\"沟通\"，不吃操作上限<\/h3>\n<p>开团前确认队友跟不跟，是<strong>所有开团型游走的通用纪律<\/strong>，已迁到 <code><a class=\"kref\" href=\"#K-L17\">K-L17<\/a><\/code>。原句里\"盾山胜率不高是因为队友不了解他\"属于英雄普及度问题，不构成判断。<\/p>\n<h2>6. 待补<\/h2>\n<ul><li>S45 攻速阈值是否变化（铭文那套是 2020 年的）。<\/li><li>完整六件套顺序（素材只给了分场景的出装原则，没有完整列表）。<\/li><li>盾山与鲁班/黄忠/嬴政的对位结论，应整理进 <code>B_克制关系/盾山.md<\/code>。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>出塔方向 = 进塔方向的延长线<\/strong>：<strong>绕一点进塔<\/strong>，出塔位置就离对面远很多——这条不用练，只要改习惯。<\/li><li><strong>二技能箭头放在两人中间<\/strong>：有机会<strong>背两个<\/strong>。<\/li><li><strong>极限距离背和贴脸背的位移距离一样<\/strong>：所以没必要贴脸冒险。<\/li><li><strong>被背的队友让他自己取消<\/strong>：否则有「抛起再落地」的僵直。<\/li><li><strong>大招只击飞一次<\/strong>：窄口和龙坑卡角度封飞行物，别指望它开团。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "开团前确认队友跟不跟，是所有开团型游走的通用纪律，已迁到 K-L17。"}], "b": [], "lanes": ["roam"], "tempo": "even", "job": "open", "motto": "绕一点进塔，出塔就离对面远很多", "n": 1, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}], "general": [{"key": "C", "cat": "BP", "title": "选人五查", "file": "01_选人五查.md", "intro": "<blockquote><p>素材来源是用户提供的《冲击巅峰千强·辅助篇》整理稿（原视频 BV1ydMZ6bE8n，UP：吾家李世公侯，6 小时 / 44 个分 P）。这是<strong>方法论<\/strong>，不是版本答案 —— 它不谈\"谁强\"，只谈\"你这套阵容成不成立\"，所以跨版本仍然有效。<\/p>\n<p>用法：五条是<strong>顺序检查<\/strong>，不是清单。第 1 条不过，后面四条不用看了。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 关：前排够不够？        → K-C01（≥1 个前排点，0.5+0.5 也算 1）\n第 2 关：前期会不会五个人一起弱？→ K-C02（吃钱点已经四个了，就别再来软的）\n第 3 关：有没有控？          → K-C03（零控可以六分投；保命技能不算控）\n第 4 关：强度在不在 T1？      → K-C04（T2 只在克对面时拿）\n第 5 关：你会不会？          → K-C05（所有克制都以熟练度为前提）<\/code><\/pre>", "entries": [{"id": "K-C01", "cat": "C", "title": "第一关查前排：软辅能不能选，取决于\"0.5 + 0.5 够不够 1\"", "self": "<h3><a class=\"kref\" href=\"#K-C01\">K-C01<\/a> 第一关查前排：软辅能不能选，取决于\"0.5 + 0.5 够不够 1\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（判据本身跨版本）<\/li><li><strong>触发条件<\/strong>：你在四五楼，己方已有边路 + 打野 + 中路<\/li><li><strong>判断依据<\/strong>：把己方所有位置的\"前排贡献\"加起来，<strong>健康阵容要 ≥ 1 个完整前排点<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>边路是木兰（半前排）+ 打野是半肉铠（半前排）→ 0.5 + 0.5 = 1 → <strong>这时才可以上软辅<\/strong><\/li><li>边路是元歌这种 0 前排 → 软辅<strong>绝对不能选<\/strong>，哪怕对面阵容完美契合<\/li><li>己方已有完整前排（张飞/牛魔/夏侯惇）→ 你可以自由选功能辅<\/li><li><strong>反例<\/strong>：「我这把孙膑特别好发挥」——好发挥的前提是有人替你吃第一波伤害。没有前排时，孙膑的二技能拉不出任何空间，因为队伍根本没人能站住。<\/li><li><strong>为什么用\"点数\"而不是\"有没有坦克\"<\/strong>：因为半肉战士补一半，两个半肉就等于一个坦。用点数算才不会漏掉「木兰 + 铠」这种看起来没坦其实够用的阵容。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高（UP 个人方法论；\"点数相加\"的算法是他自己提出的简化，逻辑自洽但无数据支撑）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（判据本身跨版本）触发条件：你在四五楼，己方已有边路 + 打野 + 中路判断依据：把己方所有位置的\"前排贡献\"加起来，健康阵容要 ≥ 1 个完整前排点决策分支：边路是木兰（半前…"}, {"id": "K-C02", "cat": "C", "title": "第二关查发育点：辅助不吃钱，但\"五个人前期都弱\"会直接崩", "self": "<h3><a class=\"kref\" href=\"#K-C02\">K-C02<\/a> 第二关查发育点：辅助不吃钱，但\"五个人前期都弱\"会直接崩<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方已选三个以上需要发育/需要等级的英雄<\/li><li><strong>判断依据<\/strong>：己方<strong>吃钱点（需要经济和等级才能发力）的数量<\/strong>。四个吃钱点已经是上限<\/li><li><strong>决策分支<\/strong>：<\/li><li>已有四个吃钱点 → 你必须选<strong>前期就能打<\/strong>的（张飞、牛魔、苏烈、东皇）<\/li><li>只有两三个吃钱点 → 可以选孙膑、大乔、明世隐这类\"后期放大器\"<\/li><li><strong>反例<\/strong>：「辅助又不吃钱，多一个发育点没关系」——辅助确实不吃钱，但辅助也<strong>不产生前期强度<\/strong>。四个吃钱点 + 一个软辅 = 前期五个人全是弱的，对面打野第一轮进野区就没有人能拦。<\/li><li><strong>判据来源<\/strong>：<code><a class=\"kref\" href=\"#K-L11\">K-L11<\/a><\/code>（游走的产出是人数差）+ 本条。两条合起来说一件事：<strong>软辅的强度是借来的，借的是队友的前期<\/strong>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方已选三个以上需要发育/需要等级的英雄判断依据：己方吃钱点（需要经济和等级才能发力）的数量。"}, {"id": "K-C03", "cat": "C", "title": "第三关查控制：零控可以六分投，但\"保命技能不算控\"", "self": "<h3><a class=\"kref\" href=\"#K-C03\">K-C03<\/a> 第三关查控制：零控可以六分投，但\"保命技能不算控\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：选人最后一位，己方看起来\"有位移有爆发\"<\/li><li><strong>判断依据<\/strong>：能不能<strong>主动开团<\/strong>。区分标准：这个技能能不能\"我先手按出去，然后队友跟上\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有硬开团（张飞大招、苏烈大闪、盾山二闪、钟馗勾）→ 合格<\/li><li>只有软控（减速、短眩晕）→ 需要配一个有硬控的边路/打野补<\/li><li>零硬控 → 这局只能打反手，BP 上已经输了半局<\/li><li><strong>反例<\/strong>：「鲁班二闪、虞姬一闪也是控」——这两个是<strong>保命技能<\/strong>，开不了团。射手和大法师的位移/闪避类技能一律不算控制点，别自我安慰。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高（\"保命技能不算控\"这个定义是全篇最实用的一句）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：选人最后一位，己方看起来\"有位移有爆发\"判断依据：能不能主动开团。"}, {"id": "K-C04", "cat": "C", "title": "第四关查强度：T2 只在克对面时拿，T3 除非打战力不碰", "self": "<h3><a class=\"kref\" href=\"#K-C04\">K-C04<\/a> 第四关查强度：T2 只在克对面时拿，T3 除非打战力不碰<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（<strong>每条强度榜必须挂日期，本条只给用法不给名单<\/strong>）<\/li><li><strong>触发条件<\/strong>：你想玩的英雄不在当前版本强势区<\/li><li><strong>判断依据<\/strong>：T 度分级 + 对手阵容<\/li><li><strong>决策分支<\/strong>：<\/li><li>T1 及以上 → 直接玩<\/li><li>T2 → <strong>只在明确克制对面某一环时拿<\/strong>，否则换<\/li><li>T3 → 除了打战力/绝活，不碰<\/li><li><strong>为什么不放名单<\/strong>：强度榜 3 周就过时。本库的规矩是「名单类内容必须带统计日期」，所以这里只留判定方法，具体名单看 <code>90_版本变更台账.md<\/code>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中（分级标准是 UP 个人划分，无官方数据）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（每条强度榜必须挂日期，本条只给用法不给名单）触发条件：你想玩的英雄不在当前版本强势区判断依据：T 度分级 + 对手阵容决策分支：T1 及以上 → 直接玩T2 → 只在明确克制…"}, {"id": "K-C05", "cat": "C", "title": "第五关查熟练度：所有克制关系都以\"你会不会打\"为前提", "self": "<h3><a class=\"kref\" href=\"#K-C05\">K-C05<\/a> 第五关查熟练度：所有克制关系都以\"你会不会打\"为前提<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你打算靠\"克制\"来选人<\/li><li><strong>判断依据<\/strong>：这个克制动作需要多长的反应窗口，你练过没有<\/li><li><strong>决策分支<\/strong>：<\/li><li>动作已成本能（盾山二闪、张飞后段喷、钟馗勾前摇）→ 可以用克制关系选人<\/li><li>还需要\"在脑子里走一遍先二再闪\"→ <strong>这个克制对你不存在<\/strong>，对面走位失误只有 0.5 秒，想完就没了<\/li><li><strong>反例<\/strong>：把克制表当护身符。表上写\"钟馗克墨子\"，但你反应不过来墨子二技能的前摇，这条克制就是不成立的 —— 文档里明确写了「这条有分段门槛」。<\/li><li><strong>推广<\/strong>：这一条把 <code>B_克制关系/<\/code> 整类的可信度前提说清楚了：<strong>B 类记录的是\"机制上成不成立\"，不是\"你能不能打出来\"<\/strong>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：高（与 B 类 _说明.md 的「机制克 &gt; 数值克 &gt; 节奏克」分层一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>这五关的排序为什么不能换<\/h2>\n<p>前排决定\"你能不能选软辅\"，前期强度决定\"你会不会被打崩\"，控制决定\"你能不能主动开团\"，强度决定\"数值上亏不亏\"，熟练度决定\"以上四条你能不能兑现\"。<\/p>\n<p>前四条是<strong>阵容层面<\/strong>的，第五条是<strong>人的层面<\/strong>的。文档把熟练度放最后不是因为它最不重要，而是因为它是<strong>否决权<\/strong>：前四条全过，第五条不过，照样别选。<\/p>\n<h2>待补<\/h2>\n<ul><li>版本 T 度名单（需官方/营地数据，且必须带日期）—— 见 <code>90_版本变更台账.md<\/code><\/li><li>对线期的具体克制（B 类负责）<\/li><\/ul>", "sum": "前排决定\"你能不能选软辅\"，前期强度决定\"你会不会被打崩\"，控制决定\"你能不能主动开团\"，强度决定\"数值上亏不亏\"，熟练度决定\"以上四条你能不能兑现\"。"}]}, {"key": "C", "cat": "BP", "title": "组合补缺法", "file": "02_组合补缺.md", "intro": "<blockquote><p>素材来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。原 UP 的原则一句话：<strong>组合只看\"搭配能不能成立\"，先不谈英雄强度<\/strong> —— 这样内容才跨版本。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：先看队友缺什么 → K-C06\n第 2 步：缺口是不是\"一个技能就能补\" → K-C07\n第 3 步：这个组合有没有\"不能配的人\" → K-C08\n第 4 步：对面组合靠哪一环成立 → K-C09（破解）\n第 5 步：这套组合的强度还在不在 → K-C10（版本折旧）<\/code><\/pre>", "entries": [{"id": "K-C06", "cat": "C", "title": "组合成立的唯一判据：它补上了队友的哪个缺口", "self": "<h3><a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 组合成立的唯一判据：它补上了队友的哪个缺口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在配一套\"XX + YY 很强\"的组合<\/li><li><strong>判断依据<\/strong>：把队友的短板说出来，再看这个辅助是不是正好补它。说不出来就别配<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友<strong>缺开团<\/strong>（刘邦、镜、司空震这类\"能进但开不了团\"）→ 配一个能主动开的<\/li><li>队友<strong>缺一秒爆发<\/strong>（张良捏住只有一秒窗口）→ 配干将、安琪拉、李元芳<\/li><li>队友<strong>缺\"再进一次场的能力\"<\/strong>（大招型英雄进场后没有第二个大）→ 配朵莉亚<\/li><li>队友<strong>缺位移/脱手<\/strong>（短手慢速，开技能时被突）→ 配张飞反打<\/li><li><strong>反例<\/strong>：「两个 T1 拼一起肯定强」——强度不叠加。两个都需要开团时机的英雄配在一起，谁都开不出第一波。<\/li><li><strong>为什么这条能跨版本<\/strong>：缺口是<strong>机制层<\/strong>的（缺开团、缺爆发、缺第二次进场），数值怎么改都不影响\"他缺这个\"。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（方法论自洽，且与 B 类「机制克 &gt; 数值克」的分层一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在配一套\"XX + YY 很强\"的组合判断依据：把队友的短板说出来，再看这个辅助是不是正好补它。"}, {"id": "K-C07", "cat": "C", "title": "双向适配比单向适配值钱：刘邦 × 司空震这类\"互救\"组合", "self": "<h3><a class=\"kref\" href=\"#K-C07\">K-C07<\/a> 双向适配比单向适配值钱：刘邦 × 司空震这类\"互救\"组合<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：评估一个组合的稳定性<\/li><li><strong>判断依据<\/strong>：顺风和逆风两个方向，这套组合是不是都成立<\/li><li><strong>决策分支<\/strong>：<\/li><li>只在一个方向成立 → 是\"顺风组合\"，逆风直接废<\/li><li>两个方向都成立 → 才是可以当主体系的组合<\/li><li><strong>例子（文档原例）<\/strong>：刘邦 + 镜/司空震/宫本。顺风时刘邦落点控帮它留人；<strong>逆风时刘邦开大上天能防它\"坠机\"<\/strong>。同一个人，顺风是\"雪球\"，逆风是\"保险\"。<\/li><li><strong>反例<\/strong>：只看顺风的组合最容易骗人。你在匹配里用着很爽，一到逆风局就发现自己没有任何翻盘手段。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：评估一个组合的稳定性判断依据：顺风和逆风两个方向，这套组合是不是都成立决策分支：只在一个方向成立 → 是\"顺风组合\"，逆风直接废两个方向都成立 → 才是可以当主体系的…"}, {"id": "K-C08", "cat": "C", "title": "\"不能配谁\"比\"能配谁\"更该记：朵莉亚 × 马可波罗/海月", "self": "<h3><a class=\"kref\" href=\"#K-C08\">K-C08<\/a> \"不能配谁\"比\"能配谁\"更该记：朵莉亚 × 马可波罗/海月<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你想用\"刷大招\"型辅助（朵莉亚、元辅、太乙）<\/li><li><strong>判断依据<\/strong>：队友<strong>进场后还剩多少血<\/strong>。刷出来的第二个大，他要不要再进一次场<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友开大进场后血量健康 → 刷大成立（吕布、铠、杨玉环、敖隐、后羿、夏侯惇；嬴政、王昭君这类大范围分割）<\/li><li>队友进场后血已经掉一半 → <strong>刷了也不敢再进<\/strong>，这条组合不成立（马可波罗、海月）<\/li><li><strong>反例<\/strong>：「多给一个大总是好的」——多给一个大，但他不敢进场，等于这个技能只缩短了 CD，没有换来第二次入场。辅助的价值全在\"第二次\"上。<\/li><li><strong>推广<\/strong>：这条同样适用于太乙真人的复活、鲁班大师的链子 —— <strong>任何\"再来一次\"型技能，都要问队友敢不敢再来。<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你想用\"刷大招\"型辅助（朵莉亚、元辅、太乙）判断依据：队友进场后还剩多少血。"}, {"id": "K-C09", "cat": "C", "title": "破解对面组合：不看它多强，看它靠哪一环成立，掐那一环", "self": "<h3><a class=\"kref\" href=\"#K-C09\">K-C09<\/a> 破解对面组合：不看它多强，看它靠哪一环成立，掐那一环<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面已经选出一套明显有配合的阵容<\/li><li><strong>判断依据<\/strong>：这套组合的<strong>关键一环<\/strong>是哪个技能/哪一秒<\/li><li><strong>决策分支<\/strong>：<\/li><li>组合靠\"一秒窗口\"成立（张良捏人）→ 拿<strong>能拆火<\/strong>的（阿古朵、武则天），或让被捏的人提前出复活甲<\/li><li>组合靠\"霸体免控\"成立（廉颇）→ 拿<strong>压制<\/strong>（张良），压制能断霸体<\/li><li>组合靠\"拉扯\"成立（孙膑体系）→ 拿<strong>能捆住的<\/strong>（老夫子大闪五秒）<\/li><li>组合靠\"藏视野抓边\"成立（张良、鬼谷子）→ 拿<strong>破隐/反视野<\/strong>的<\/li><li><strong>反例<\/strong>：「对面组合强，我们也堆一套组合」——两套组合对撞，赢的是\"谁的关键一环先被掐\"。先想掐，再想堆。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。具体对位见 <code>B_克制关系/<\/code><\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面已经选出一套明显有配合的阵容判断依据：这套组合的关键一环是哪个技能/哪一秒决策分支：组合靠\"一秒窗口\"成立（张良捏人）→ 拿能拆火的（阿古朵、武则天），或让被捏的…"}, {"id": "K-C10", "cat": "C", "title": "组合会折旧：养马流为什么掉了", "self": "<h3><a class=\"kref\" href=\"#K-C10\">K-C10<\/a> 组合会折旧：养马流为什么掉了<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在用一个\"老版本很强\"的体系<\/li><li><strong>判断依据<\/strong>：这套体系是靠<strong>几个技能叠起来的<\/strong>。叠的层数越多，被砍一层的损失越大<\/li><li><strong>例子（文档原例）<\/strong>：孙膑 + 马超的\"养马流\"。原本是\"阿古朵一技能给队友加速 + 孙膑二技能叠移速\"两层叠加；<strong>阿古朵的一技能加速被取消后，只剩孙膑二技能还能叠移速，体系强度直接掉下来<\/strong>。<\/li><li><strong>决策分支<\/strong>：<\/li><li>体系只依赖一个技能 → 相对稳定<\/li><li>体系依赖两三个技能的叠加 → 每个版本都要重新验证，别当默认答案<\/li><li><strong>推广<\/strong>：这条是本库 <code>90_版本变更台账.md<\/code> 存在的理由 —— 组合类结论必须记\"它是靠几层叠起来的\"，被砍时才知道掉了多少。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>每套组合的\"折旧日期\"（要靠版本公告逐条核，还没做）<\/li><li>对抗路/打野位的组合（本文档只覆盖辅助视角）<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在用一个\"老版本很强\"的体系判断依据：这套体系是靠几个技能叠起来的。"}]}, {"key": "C", "cat": "BP", "title": "组合速查表", "file": "03_组合速查表.md", "intro": "<blockquote><p><strong>用之前先做两件事。<\/strong> 第一，读 <code>02_组合补缺.md<\/code> 的 <a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 到 <a class=\"kref\" href=\"#K-C10\">K-C10<\/a> —— 这张表是判据的<strong>举例<\/strong>，不是命令。 第二，按 <a class=\"kref\" href=\"#K-C10\">K-C10<\/a> 问一句：这套组合靠几层叠起来的？最近有没有被砍？（表是 2026-10 录制时的经验，不是版本答案。）<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>辅助<\/th><th>配谁<\/th><th>补的是什么缺口<\/th><\/tr><\/thead><tbody><tr><td>孙膑<\/td><td>马超<\/td><td>叠移速。<strong>注意：阿古朵一技能加速取消后已折损一层<\/strong>（<a class=\"kref\" href=\"#K-C10\">K-C10<\/a>）<\/td><\/tr><tr><td>刘邦<\/td><td>镜 / 司空震 / 宫本<\/td><td>补\"开团弱、找机会弱\"；逆风开大上天能防\"坠机\"（双向适配，<a class=\"kref\" href=\"#K-C07\">K-C07<\/a>）<\/td><\/tr><tr><td>张良<\/td><td>干将 / 安琪拉 / 李元芳<\/td><td>捏住后只有一秒窗口，必须配一秒能灌死人的爆发<\/td><\/tr><tr><td>朵莉亚<\/td><td>吕布 / 铠 / 杨玉环 / 敖隐 / 后羿 / 夏侯惇 / 嬴政 / 王昭君<\/td><td>补\"第二次进场\"。<strong>不适配马可波罗、海月<\/strong>（进场血掉一半，多刷一个也不敢再进，<a class=\"kref\" href=\"#K-C08\">K-C08<\/a>）<\/td><\/tr><tr><td>张飞<\/td><td>李元芳 / 蒙犽<\/td><td>李元芳挂塔推塔，张飞把塔下人喷走；蒙犽短手慢速开一技能时被突，张飞反打<\/td><\/tr><tr><td>钟馗<\/td><td>小乔 / 安琪拉<\/td><td>钟馗大招有前摇，靠队友补一段控，不用交冰甲也能吸住<\/td><\/tr><tr><td>鲁班大师<\/td><td>李元芳 / 元坦 / 杨戬 / 王昭君 / 大司命 / 公孙离<\/td><td>李元芳滚脸后拉链子回来骗技能；\"有进无出\"的坦度英雄靠链子吃一波再撤<\/td><\/tr><tr><td>元辅（台子）<\/td><td>狄仁杰 / 虞姬 / 敖隐 / 甄姬<\/td><td>台子上走位空间小，靠这几个自己的二技能/霸体下台拉扯；三技能都能吃满台子的距离加成<\/td><\/tr><tr><td>太乙真人<\/td><td>孙尚香 / 成吉思汗<\/td><td>经典\"真香\"；香香强势期被 ban 就换狼狗<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>表怎么读<\/h2>\n<ol><li>在第二列找到你队友的英雄<\/li><li>读第三列\"补的是什么缺口\"<\/li><li>问自己：<strong>这个缺口我现在真的缺吗？<\/strong><\/li><\/ol>\n<ul><li>缺 → 这套成立<\/li><li>不缺（比如队友已经有人能开团）→ 这套对你不成立，换一个<\/li><\/ul>\n<p><strong>举例<\/strong>：队友选了镜，你打算配刘邦。镜缺的是\"开团/找机会\"，刘邦的大招落点控正好补上，顺风留人、逆风防坠机 —— 成立。但如果你的边路已经是张飞、中路是张良（都能开），那刘邦补的这个缺口就是重复的，这时你更需要的是前期强度。<\/p>\n<h2>表里没有的组合怎么办<\/h2>\n<p>用 <a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 的四步自己推：<\/p>\n<ul><li>队友<strong>能进但开不了团<\/strong> → 找能主动开的<\/li><li>队友<strong>控住人但打不死<\/strong> → 找一秒爆发的<\/li><li>队友<strong>开完大就没有第二次<\/strong> → 找能刷大的<\/li><li>队友<strong>手短、开技能时不能动<\/strong> → 找能反打的<\/li><\/ul>\n<p>推不出来就别硬配。<strong>组合的目的是补缺口，不是凑两个 T1。<\/strong><\/p>\n<h2>待补<\/h2>\n<ul><li>每套组合的\"折旧日期\"（要逐条对版本公告核，还没做）<\/li><li>打野位/对抗路位的组合（本文档只覆盖辅助视角）<\/li><li>表中组合的实战录像对照（目前只有口述，没有逐帧验证）<\/li><\/ul>", "entries": []}, {"key": "D", "cat": "对局内", "title": "主线地图", "file": "00_主线地图.md", "intro": "<p>读完这一页，你应该知道<strong>这局该按什么顺序想事<\/strong>，而不是\"有多少个知识点\"。<\/p>\n<h2>决策主线（节间依赖）<\/h2>\n<pre><code>01 选人 ──► 02 开局前90秒 ──► 03 前四分钟 ──► 04 对线期 ──► 05 第一波转线\n                                                              │\n05 ──► 06 中期资源 ──► 07 团战 ──┬──► 08 顺风推进 ──┐\n              ▲                  └──► 09 逆风止损 ──┴──► 10 终结比赛\n              │\n     04 ─(无对线权且持续到4分钟，直接跳 09)─┘<\/code><\/pre>\n<p>实线是正常推进；<strong>04 → 09 这条斜边是\"跳节\"路径<\/strong>——对线期就崩了的话，05、06、07 全部不成立，要直接进止损逻辑。清单式知识库给不出这条边。<\/p>\n<h2>每节回答的问题<\/h2>\n<div class=\"tw\"><table><thead><tr><th>节<\/th><th>只回答这一个决定<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>01 选人<\/td><td>我拿什么英雄，取决于对面已经选了什么<\/td><td>待写（前提\"中野辅版本\"已写进 02）<\/td><\/tr><tr><td><strong>02 开局前90秒<\/strong><\/td><td><strong>第一步我站在哪<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>03 前四分钟<\/strong><\/td><td><strong>第一条龙我争不争<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>04 对线期<\/strong><\/td><td><strong>这波线清完，我该往哪走<\/strong><\/td><td>✅ 已完成<\/td><\/tr><tr><td>05 第一波转线<\/td><td>我动起来之后，先去哪一路<\/td><td>⚠️ 部分覆盖：<code>05_资源点与推进.md<\/code> 解决了「资源怎么排优先级」，转线本身还缺<\/td><\/tr><tr><td><strong>06 中期资源<\/strong><\/td><td><strong>这一整段是在布置 10 分钟那一波<\/strong><\/td><td>✅ 已完成（4 条，<a class=\"kref\" href=\"#K-D25\">K-D25<\/a>~D28）<\/td><\/tr><tr><td>07 团战<\/td><td>这波团我该站在哪、什么时候进<\/td><td>待写<\/td><\/tr><tr><td>08 顺风推进<\/td><td>拿到优势后，先推塔还是先控野<\/td><td>待写<\/td><\/tr><tr><td>09 逆风止损<\/td><td>打不过的时候，损失怎么止住<\/td><td>待写<\/td><\/tr><tr><td>10 终结比赛<\/td><td>怎么把优势变成水晶<\/td><td>待写<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>编号说明<\/strong>：<code>K-Dxx<\/code> 按<strong>入库顺序<\/strong>排，不按节号。所以 04 的条目是 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a>~D08，02 的条目是 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>~D13，03 的是 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>~D18——查条目时不要按节号推编号。<\/p>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<ul><li>经济差只是战斗力差的一种来源，不是唯一来源。<\/li><li>信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。<\/li><li>这条来自 <code>BV1i2n96AEvp @ 02:31<\/code>，原文：\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/li><\/ul>\n<h2>读这套东西的正确姿势<\/h2>\n<ol><li>先看当前局的<strong>时间点<\/strong>，定位到哪一节；<\/li><li>读那节的\"判断树\"，找自己正卡在哪个判据上；<\/li><li>只看那个判据对应的 K 条目，不要通读；<\/li><li>条目里的\"反例\"比\"结论\"更值钱——那是别人踩过的坑。<\/li><\/ol>\n<h2>三条写作硬规矩（新增内容必须遵守）<\/h2>\n<ol><li><strong>文件名是一个\"决定\"，不是话题。<\/strong> 不许出现\"英雄\"\"铭文\"\"出装\"这类名词短语。<\/li><li><strong>每节第一节必须是\"上一节留下的问题\"<\/strong>，且点名上一节哪个分支留下了它。断链的节不许存在。<\/li><li><strong>易错点按环节归位，不单列。<\/strong> 禁止\"本节易错点：①②③\"，错必须挂在它所属的判断节点下。<\/li><\/ol>", "entries": []}, {"key": "D", "cat": "对局内", "title": "02 开局前90秒：第一步我站在哪", "file": "02_开局前90秒.md", "intro": "<blockquote><p><strong>依赖<\/strong>：01 选人（尚未写）——它要交出的是\"这局前期以谁为核心\" <strong>被依赖<\/strong>：03 前四分钟（本节产出的\"第一步站位\"决定了第一波线谁先到、谁先有线权）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>01 选人还没写成条目，但它必须回答的问题是：<strong>这局前期该围绕谁打？<\/strong><\/p>\n<p>这一节不等 01 写完就先给出当前版本的主流答案——素材里的原话是：<\/p>\n<blockquote><p>「双方中路小乔和嫦娥……在这个中野辅的版本，我们这局前期要以野中为合，保证宫本的野区节奏以及小乔的中线权。」<\/p><\/blockquote>\n<p>也就是说，<strong>S45 的默认答案是\"野 + 中\"<\/strong>，不是任何一个单独的人。这个默认值有两个例外（见判断树），例外只看一件事：<strong>我方打野一级能不能动对面野区<\/strong>。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>读条结束那 20 秒，我第一步往哪走？<\/strong><\/p>\n<p>不是\"我要不要反野\"（那是打野的事），是<strong>\"我这一步走出去，会不会让本局的核心（野或中）多出一次机会\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>读条结束前，先答一个问题：我方打野一级能不能动对面野区？\n│\n├─ 能（打野是强反型 / 有惩戒优势 / 对面打野一级弱）\n│   → 本局核心 = 打野的野区节奏\n│   ├─ 我是辅助 → 去对抗路抢线权，抢完直接协同进野区   【K-D10】\n│   ├─ 我是中路 → 兵线交汇立刻清，清完帮看另一片野区   【K-D11】\n│   └─ 我是对抗路 → 一级先上手，把对面边路钉在线上     【K-D13】\n│\n└─ 不能（打野一级弱 / 对面打野压制）\n    → 本局核心 = 中路线权\n    ├─ 我是辅助 → 回中帮清，把中线权保住               【K-D10 分支 B】\n    ├─ 我是中路 → 不硬抢 2v2，改成\"清完就走\"           【K-D11 分支 B】\n    └─ 我是边路 → 只做安全对线，不主动换血             【K-D13】\n\n无论哪支：一级出现击杀窗口（对面边路走位冒进）→ 先拿一血，拿不到立刻转野区 【K-D13】<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>我方打野一级强度<\/td><td>英雄本身（能否强反/双惩戒）<\/td><td>能与不能<\/td><td>根的第一次分叉<\/td><\/tr><tr><td>对面打野一级强度<\/td><td>同上<\/td><td>比我方弱 → 能反<\/td><td>同上<\/td><\/tr><tr><td>中路 2v2 强度<\/td><td>双方中单+辅助的清线速度<\/td><td>明显打不过<\/td><td><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 分支 B<\/td><\/tr><tr><td>对面边路是否\"皮\"（敢出塔）<\/td><td>一级 30 秒内的站位<\/td><td>出塔且我方有控制<\/td><td><a class=\"kref\" href=\"#K-D13\">K-D13<\/a><\/td><\/tr><tr><td>打野是否已出野刀<\/td><td>装备栏<\/td><td>未出 → 尾刀让<\/td><td><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 的细节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D09", "cat": "D", "title": "开局的默认核心是「野 + 中」，不是任何一个人", "self": "<h3><a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 开局的默认核心是「野 + 中」，不是任何一个人<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）；S46 待复核<\/li><li><strong>触发条件<\/strong>：读条结束，全队要定第一步<\/li><li><strong>判断依据<\/strong>：版本节奏（中野辅）+ 双方阵容<\/li><li><strong>决策分支<\/strong>：<\/li><li>默认 → 所有开局动作服务于两件事：<strong>打野的野区节奏 + 中单的中线权<\/strong><\/li><li>只有当打野一级完全动不了野区时（见判断树），核心才切到\"中路线权\"单点<\/li><li><strong>反例<\/strong>：「开局各走各的，辅助跟射手、边路自己发育」——这类打法在\"中野辅\"版本里等于主动放弃前两条资源。素材原话把这条定为<strong>开局分析的第一句<\/strong>，位置在\"谁拿一血\"之前。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D10\">K-D10<\/a>、<a class=\"kref\" href=\"#K-D11\">K-D11<\/a>、<a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:34；BV1yke26fEYB @ 00:38；BV1yke26fEYB @ 00:40<\/li><li><strong>可信度<\/strong>：中高（职业向全局教学的定调句，且后续所有动作都与它自洽）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）；"}, {"id": "K-D10", "cat": "D", "title": "打野要偷野时，辅助去的是对抗路，不是中路也不是发育路", "self": "<h3><a class=\"kref\" href=\"#K-D10\">K-D10<\/a> 打野要偷野时，辅助去的是对抗路，不是中路也不是发育路<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局确认打野要偷对面野区<\/li><li><strong>判断依据<\/strong>：打野进草等对面动向（能不能偷成）；对抗路我方是否有先手<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷 → <strong>去对抗路抢线权<\/strong>，抢完带着边路一起进野区<\/li><li>打野不偷 → 回中帮清（分支 B）<\/li><li><strong>反例<\/strong>：「辅助开局跟射手」——这是四个判据里排第三的一条（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>），不是第一条。开局直接去发育路，等于放弃野区节奏。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>（核心是野区）；与 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code> 是同一条判据的位置级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:52；BV1yke26fEYB @ 00:54；BV1yke26fEYB @ 01:29<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局确认打野要偷对面野区判断依据：打野进草等对面动向（能不能偷成）；"}, {"id": "K-D11", "cat": "D", "title": "中路 2v2 打不过就不要抢，改去帮看野区", "self": "<h3><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 中路 2v2 打不过就不要抢，改去帮看野区<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级中路 2v2，我方清线明显慢<\/li><li><strong>判断依据<\/strong>：双方中单+辅助的清线速度差（一个技能能不能清完一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打不过 → <strong>不硬抢<\/strong>，把中线放掉，转去另一片野区看一眼（对面打野动不动我们的红/蓝）<\/li><li>抢得过 → 立刻清完，清完立刻走（<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢不过还去抢，是把自己钉在中路挨打，同时野区被反了也没人看。素材里这一波的处理就是\"中路抢线 2V2 打不过对面的组合 → 要协同打野的反野，就得去另外一边拿线权\"。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；与 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code> 互为位置级/环节级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:31；BV1yke26fEYB @ 01:33；BV1yke26fEYB @ 01:34<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级中路 2v2，我方清线明显慢判断依据：双方中单+辅助的清线速度差（一个技能能不能清完一波）决策分支：打不过 → 不硬抢，把中线放掉，转去另一片野区看一眼（对面打野…"}, {"id": "K-D12", "cat": "D", "title": "反完野的 30 秒，是给打野提速的窗口", "self": "<h3><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 反完野的 30 秒，是给打野提速的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：我方反野成功、对面野区清完<\/li><li><strong>判断依据<\/strong>：打野野区里还剩几组野；打野有没有出野刀<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野野区里有剩 → <strong>立刻过去帮打<\/strong>（三组小野一起提速），尾刀不抢<\/li><li>打野已清空 → 回中线，不要陪他蹲<\/li><li><strong>反例<\/strong>：「反完野就去帮下路」——反野换来的经济优势只有在他把自家野也吃完时才成立。你走了，他一个人清三组野，优势就摊薄了。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；尾刀细节见 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code><\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:16；BV1yke26fEYB @ 02:25；BV1yke26fEYB @ 02:27；BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：我方反野成功、对面野区清完判断依据：打野野区里还剩几组野；"}, {"id": "K-D13", "cat": "D", "title": "一级的一血窗口只看一件事：对面边路敢不敢出塔", "self": "<h3><a class=\"kref\" href=\"#K-D13\">K-D13<\/a> 一级的一血窗口只看一件事：对面边路敢不敢出塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局 0–60 秒，边路第一次兵线交汇<\/li><li><strong>判断依据<\/strong>：对面边路站位是否越过自家塔前；我方有没有硬控（如带晕眩的边路）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他出塔且我方有控 → <strong>打<\/strong>，这是开局性价比最高的一次击杀<\/li><li>他稳在塔后 → 立刻转\"快速抢线 + 进野区\"，不要在线上磨<\/li><li>偷野被对面发现 → <strong>不打了，直接快速抢线转进野区<\/strong>（原话：被发现了，那就直接快速抢线，带着队友去进对面野区）<\/li><li><strong>反例<\/strong>：「一级要稳」——一级恰恰是唯一\"对面还没有技能\"的窗口，稳到二级，这个机会就永久消失。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；被 <a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖（一血拿不到 → 转反野）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:59；BV1yke26fEYB @ 01:01；BV1yke26fEYB @ 01:40；BV1yke26fEYB @ 01:42<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「核心定给谁」上<\/strong>：人会跳过这一步，直接按自己的习惯走位（辅助跟射手、边路单带），结果前 90 秒全队四条线各打各的，一个资源都没拿到。<\/li><li><strong>在节点「打野能不能动野区」上<\/strong>：人会默认\"我的打野很强\"，不去看双方一级强弱，于是辅助白跑一趟对抗路，野区还是没反成。<\/li><li><strong>在节点「一血窗口」上<\/strong>：人会因为\"这波不一定杀得掉\"而放弃，转而去清兵——但清兵的收益是确定的、随时都有的，一血窗口不是。<\/li><li><strong>在节点「被发现了怎么办」上<\/strong>：人会继续蹲，怕浪费这一趟。原话的处理是立刻转\"抢线 + 进野区\"，把偷换成明抢。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><strong>\"中野辅版本\"这个前提本身没有版本号<\/strong>。素材是 S45 区间录的，但 UP 主说的是\"这个中野辅的版本\"，属于体感表述。S46 若节奏改动，<a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 要重审。<\/li><li><strong>射手视角缺失<\/strong>：本节五路里，发育路的分支（\"边路只做安全对线\"）是从辅助视角反推的，没有射手第一视角素材验证（见 <code>L_分路/03_发育路.md<\/code> 的缺口说明）。<\/li><li>一级一血窗口的判据只有一条边路样本（孙策 vs 关羽），换阵容是否成立未验证。<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局 0–60 秒，边路第一次兵线交汇判断依据：对面边路站位是否越过自家塔前；"}]}, {"key": "D", "cat": "对局内", "title": "03 前四分钟：第一条龙我争不争", "file": "03_前四分钟.md", "intro": "<blockquote><p><strong>依赖<\/strong>：02 开局前90秒（结论：第一步站位由\"本局核心是野还是中\"决定） <strong>被依赖<\/strong>：04 对线期（本节产出的\"我还在不在场上、状态够不够\"是 04 判断树里 A2 分支的输入）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>02 只解决了\"第一步站哪\"，它留下的是：<strong>如果第一步没换到东西（一血没拿到、野没反成），接下来这三分钟怎么过？<\/strong><\/p>\n<p>答案不是\"补回来\"，而是先把一个事实接住：<strong>前四分钟逆风是常态，不是失误。<\/strong> 素材里这一局在 3 分钟就已经 3v4 团灭过一次，原话是\"前期逆风很正常\"。<\/p>\n<p>这一节要回答的，就是逆风之后第一个资源点该怎么处理。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>4 分钟第一个资源点刷新，我这一波是去打，还是放？<\/strong><\/p>\n<p>不是\"怎么打赢这波团\"，是<strong>\"我这波有没有资格站进去\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>资源点（4 分钟）刷新前 15 秒，清点自己这一侧的家底\n│\n├─ 我的\"一次性资源\"还在吗？（被动 / 大招 / 闪现）\n│   ├─ 不在 → 【K-D15】放。别硬接，用这 40 秒去换别的东西\n│   └─ 在 → 进下一判据\n│\n├─ 我方场上人数够吗？（刚复活的人能不能赶上）\n│   ├─ 少人 → 【K-D15】放。少一个人不是\"勉强能打\"，是\"必定打输\"\n│   └─ 齐 → 进下一判据\n│\n├─ 我方站位先到吗？（谁先占住龙坑侧的草）\n│   ├─ 我方先到 → 【K-D16】争。先到的人决定这波团的形状\n│   └─ 对面先到 → 不硬冲，改成\"等他们打完/换另一侧资源\"【K-D17】\n│\n└─ 以上任一条判\"放\"→ 复活/回线后的第一步，不要回自己的线\n    → 【K-D18】先看小地图：谁在哪、谁状态不好<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>一次性资源<\/td><td>被动图标 / 大招 CD / 闪现<\/td><td>有 / 无<\/td><td>第一个分叉<\/td><\/tr><tr><td>场上人数<\/td><td>复活计时 + 小地图<\/td><td>我方 &lt; 对面<\/td><td>第二个分叉<\/td><\/tr><tr><td>龙坑侧草的归属<\/td><td>小地图视野<\/td><td>我方先占<\/td><td>第三个分叉<\/td><\/tr><tr><td>对面清完中线后的转向<\/td><td>兵线位置 + 小地图<\/td><td>大概率转向资源点<\/td><td><a class=\"kref\" href=\"#K-D17\">K-D17<\/a><\/td><\/tr><tr><td>自己复活后的位置<\/td><td>小地图<\/td><td>谁在附近、谁状态差<\/td><td><a class=\"kref\" href=\"#K-D18\">K-D18<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D14", "cat": "D", "title": "前四分钟的逆风是常态，不要在落后时硬接团", "self": "<h3><a class=\"kref\" href=\"#K-D14\">K-D14<\/a> 前四分钟的逆风是常态，不要在落后时硬接团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：前四分钟内我方被团灭过一次 / 经济落后<\/li><li><strong>判断依据<\/strong>：落后量（一个人头以内算正常）+ 我方一次性资源是否还在<\/li><li><strong>决策分支<\/strong>：<\/li><li>落后但资源在 → 只打\"对面先交技能\"的团，不主动开<\/li><li>落后且资源不在 → 完全不打，先发育<\/li><li><strong>反例<\/strong>：「落后就要打回来」——前四分钟的经济差通常不到 500，硬接一次团灭会直接变成 2000，这才是真正拉开差距的地方。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:06；BV1yke26fEYB @ 03:08；BV1yke26fEYB @ 04:17<\/li><li><strong>可信度<\/strong>：中高（UP 主在团灭后立刻给出这句定调，并用自己的后续处理验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：前四分钟内我方被团灭过一次 / 经济落后判断依据：落后量（一个人头以内算正常）+ 我方一次性资源是否还在决策分支：落后但资源在 → 只打\"对面先交技能\"的团，不主动开…"}, {"id": "K-D15", "cat": "D", "title": "资源点争不争，先看自己有没有\"一次性资源\"", "self": "<h3><a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 资源点争不争，先看自己有没有\"一次性资源\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟资源点刷新前<\/li><li><strong>判断依据<\/strong>：被动/大招/闪现是否可用；我方是否有人阵亡<\/li><li><strong>决策分支<\/strong>：<\/li><li>资源在且人齐 → 可以争（见 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>）<\/li><li>资源不在（如苏烈被动没装好）→ <strong>放<\/strong>，原话：\"没被动的时候就不要去硬接\"<\/li><li><strong>反例<\/strong>：「龙不能放」——4 分钟的龙价值约等于一波半兵线，而一次团灭的价值远大于它。<strong>放龙换 40 秒发育，是赚的。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:11；BV1yke26fEYB @ 04:13；BV1yke26fEYB @ 04:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟资源点刷新前判断依据：被动/大招/闪现是否可用；"}, {"id": "K-D16", "cat": "D", "title": "谁先占住龙坑侧的草，谁决定这波团的形状", "self": "<h3><a class=\"kref\" href=\"#K-D16\">K-D16<\/a> 谁先占住龙坑侧的草，谁决定这波团的形状<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要争这个资源点<\/li><li><strong>判断依据<\/strong>：龙坑侧草的视野归属；我方是否有人能先手控<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方先占 → 让对面来冲，我们打反手（先到的人不用先交技能）<\/li><li>对面先占 → 不要正面挤进去，改成拉边/等对面出来<\/li><li><strong>反例<\/strong>：「龙刷了五个人一起上」——五个人挤进一个口，等于把先手权交给对面。<strong>先到不等于先打，先到是为了让别人先打你。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:47；BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 03:51<\/li><li><strong>可信度<\/strong>：中（素材是\"蹲草反打\"的实战，结论方向明确但表述较口语）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要争这个资源点判断依据：龙坑侧草的视野归属；"}, {"id": "K-D17", "cat": "D", "title": "争不到就换：对面全员在龙坑时，另一侧一定空着", "self": "<h3><a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 争不到就换：对面全员在龙坑时，另一侧一定空着<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：资源点被对面先占住，且我方人不齐/资源不在<\/li><li><strong>判断依据<\/strong>：对面几个人在龙坑附近；另一侧兵线在哪<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面 4 人以上在龙坑 → <strong>不争<\/strong>，去另一侧吃线/推塔/反野<\/li><li>对面只有 2–3 人在 → 可以抢视野、逼他们分人<\/li><li><strong>反例<\/strong>：「他们打龙我们就去骚扰」——骚扰的收益是\"可能抢到\"，成本是\"整队站位散在龙坑口\"。换成另一侧的确定收益更划算。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>；与 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>（反方向拿资源）是同一条判据的不同时间尺度<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:13（\"到时候可以看情况选择放龙\"）；BV1yke26fEYB @ 04:33<\/li><li><strong>可信度<\/strong>：中（\"放\"的动作有原话，\"换什么\"是从 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的框架推的，标中）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：资源点被对面先占住，且我方人不齐/资源不在判断依据：对面几个人在龙坑附近；"}, {"id": "K-D18", "cat": "D", "title": "复活后的第一步不是回自己的线，是先读图", "self": "<h3><a class=\"kref\" href=\"#K-D18\">K-D18<\/a> 复活后的第一步不是回自己的线，是先读图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：阵亡后复活（前四分钟内最常发生）<\/li><li><strong>判断依据<\/strong>：小地图上 ① 谁在哪 ② 谁状态不好 ③ 哪条线正在被推<\/li><li><strong>决策分支<\/strong>：<\/li><li>某一路我方有人且对面状态差 → <strong>直接过去<\/strong>，不要先回线<\/li><li>全线都在安全位置 → 回自己的线，路过野区顺一下（不绕路才顺，见 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「复活先回自己线补经济」——复活那 5 秒是你唯一\"能选位置\"的时刻，回线等于把这个选择权浪费掉。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>（放资源点之后的时间怎么用）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:17；BV1yke26fEYB @ 04:20；BV1yke26fEYB @ 04:23；BV1yke26fEYB @ 04:29<\/li><li><strong>可信度<\/strong>：中高（原话给了完整推理：\"小乔在下路、打野在野区、并且他状态不好，这时我们下一步一定是去下路\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「一次性资源」上<\/strong>：人会把\"我血是满的\"当成\"我能打\"，忽略被动/大招是否是这波的前提。苏烈没被动就是普通近战，盾山没能量就是一块木板。<\/li><li><strong>在节点「人数」上<\/strong>：人会用\"他马上复活了\"给自己找理由。差 3 秒也是少一个人。<\/li><li><strong>在节点「先到」上<\/strong>：人以为先到就要先开，于是把反手机会打成了正面硬冲。<\/li><li><strong>在节点「放」上<\/strong>：人放了龙却不知道去换什么，40 秒全队在中路晃——这是\"放\"最常见的执行失败。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<h3>冲突 1：第一个资源点到底是 2 分钟还是 4 分钟<\/h3>\n<p>两条素材对不上，<strong>必须挂在这里，不许挑一条当结论<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>来源<\/th><th>说法<\/th><th>时间<\/th><\/tr><\/thead><tbody><tr><td>BV1yke26fEYB @ 04:17（苏烈全局，S45 区间）<\/td><td>「暴君刷新了」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1X2jV6KEiP @ 03:47（射手教学）<\/td><td>「马上也要来到我们的暴君团……4 分钟这个暴君」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1fp4y1D7Wd @ 02:01（干货教练，五位置节奏）<\/td><td>「2 分钟刷新的两条远古生物」<\/td><td><strong>2 分钟<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>两条 6 月内的实战素材都说 4 分钟，只有那条理论框架视频说 2 分钟。<strong>倾向按 4 分钟用<\/strong>，但那条理论视频可能拍得更早（S44 或之前）。本节的所有判据与\"几分钟\"无关——它问的是\"我有资格站进去吗\"，所以结论不受影响。<\/p>\n<h3>干货教练给的\"前期时间轴\"（未与版本对齐，仅作参照）<\/h3>\n<p>BV1fp4y1D7Wd @ 01:44 起给了一串节点：中路第一波兵 → 30 秒第一轮野区 + 边路河蟹 → 第二波兵 + 1 分钟中路河道之灵 → 第三波兵 → 2 分钟远古生物 + 第四波兵。<\/p>\n<p><strong>这套轴如果按\"远古生物 2 分钟\"成立，那么上文所有\"4 分钟\"的判断都要整体前移 2 分钟。<\/strong> 用之前先在游戏里对一次刷新时间。<\/p>\n<h3>其他<\/h3>\n<ul><li><strong>4 分钟资源点的类型与数值<\/strong>没有素材，本节只处理\"争不争\"的判断，不涉及打龙操作。<\/li><li>素材来自一局逆风局，<strong>顺风局的前四分钟<\/strong>（该不该加速、该不该越塔）没有样本。<\/li><li>\"对面先到就不冲\"这条在强开团阵容下可能不成立（盾山/苏烈可以硬顶进去），需补一条阵容相关的分支。<\/li><\/ul>", "sum": "两条素材对不上，必须挂在这里，不许挑一条当结论："}]}, {"key": "D", "cat": "对局内", "title": "04 对线期：这波线清完，我该往哪走", "file": "04_对线期.md", "intro": "<blockquote><p><strong>依赖<\/strong>：03 前四分钟（结论：线权来自第一波谁先清完） <strong>被依赖<\/strong>：05 第一波转线（本节产出的「可动窗口」是 05 的输入）；09 逆风止损（本节判定\"没线权\"且持续到 4 分钟，直接跳 09）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>03 结尾留下的是：<strong>\"你先到 2 级了，然后呢？\"<\/strong><\/p>\n<p>先到 2 级只说明你<strong>有了一次清线优势<\/strong>，不等于你能走。这一节要回答的，是这次优势能不能换成地图上的东西——换不成，优势会在 90 秒内自己蒸发。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>这一波线清完之后，我是往河道走、往边路走，还是退回塔后等下一波？<\/strong><\/p>\n<p>不是\"怎么打得更好\"，是\"这一步该不该动\"。操作的差距在这个决定面前是次要的。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>中线清完 / 即将清完（判断起点）\n│\n├─ 判据 A：我有没有线权？（看谁的小兵更多、谁先推过去）\n│   ├─ 没有（我方兵线被压回塔前，或我每波都在塔下补刀）\n│   │   ├─ 判据 A1：对面法师是否已经离开中线？（小地图 8 秒内无其视野）\n│   │   │   ├─ 是 → 【K-D01】不尾随，往反方向去拿资源\n│   │   │   └─ 否 → 【K-D02】塔后过线，同时给边路打信号\n│   │   └─ 判据 A2：我这一波掉了多少状态？（血量 &lt;60% 且无闪现）\n│   │       ├─ 是 → 【K-D03】回城，不要为了保线硬撑\n│   │       └─ 否 → 留在塔后等下一波\n│   └─ 有（我方小兵更多，或对面被迫交技能补刀）\n│       ├─ 判据 B：下一波兵到线还需多久？\n│       │   ├─ &gt;8 秒 → 够一次短游，进判据 C\n│       │   └─ ≤8 秒 → 【K-D04】不动，把线再推一波更赚\n│       └─ 判据 C：我方打野在哪？\n│           ├─ 在我方半区/河道 → 【K-D05】跟他走同一侧，去做视野或反野\n│           └─ 位置未知/在对面半区 → 【K-D06】只占中轴草，不深入\n└─ 判据 D：这波我死了或刚复活\n    └─ 【K-D07】先回中线过线，不要先参团<\/code><\/pre>\n<p>每个叶子都对应下面一个 K 条目。<strong>树里没有\"视情况而定\"这种分支<\/strong>——出现这三个字说明判据没写清。<\/p>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>线权<\/td><td>双方小兵数量与位置<\/td><td>我方小兵 ≥ 对方且未进塔<\/td><td>判据 A<\/td><\/tr><tr><td>对面法师视野<\/td><td>小地图<\/td><td>消失 &gt;8 秒<\/td><td>A1<\/td><\/tr><tr><td>自身血量 / 召唤师技能<\/td><td>血条 + 技能栏<\/td><td>血量 &lt;60% 且无闪现<\/td><td>A2<\/td><\/tr><tr><td>下一波兵到线时间<\/td><td>兵线节奏（约 30 秒一波）<\/td><td>&gt;8 秒<\/td><td>B<\/td><\/tr><tr><td>我方打野位置<\/td><td>小地图<\/td><td>己方半区 / 未知<\/td><td>C<\/td><\/tr><tr><td>是否刚复活<\/td><td>复活计时<\/td><td>—<\/td><td>D<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>底层判据（适用于全库）<\/strong>：判断\"能不能打\"看的不是经济差，是<strong>战斗力差 × 能不能及时到达<\/strong>。信息不足时这条压过一切技巧性结论——这条来自 <code>BV1i2n96AEvp<\/code> 的框架，原文是\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/p>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D01", "cat": "D", "title": "没线权，对面法师走了——我不跟，去反方向", "self": "<h3><a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 没线权，对面法师走了——我不跟，去反方向<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（2026-09-23 起）；S46 待复核<\/li><li><strong>触发条件<\/strong>：我方中路无线权（兵线被压回塔前）；对面法师小地图消失 &gt;8 秒<\/li><li><strong>判断依据<\/strong>：对面法师的消失方向（看小地图最后视野朝向哪一路）；我方另一路是否有可拿资源<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面法师去上 → <strong>我去下路<\/strong>，拿河蟹/兵线/野区小资源<\/li><li>对面法师去下 → <strong>我去上路<\/strong>，同理<\/li><li>完全看不出方向 → 不动，塔后过线<\/li><li><strong>反例<\/strong>：「对面法师去支援了，我赶紧跟过去」——你没有线权，走过去比他慢 5 秒以上，到了正好接他一套技能，还把中线白送。<strong>尾随强势法师作用不大，不如反方向拿资源。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a>（先要能安全过线）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:38；BV15EJk6fEwX @ 00:41<\/li><li><strong>可信度<\/strong>：高（全局思路复盘，非剪辑集锦；与《一野二边三射四中》的开局逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（2026-09-23 起）；"}, {"id": "K-D02", "cat": "D", "title": "没线权时的过线方式：塔后过，不打信号就完事", "self": "<h3><a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 没线权时的过线方式：塔后过，不打信号就完事<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：判定为无线权状态，且需要继续吃中线经济<\/li><li><strong>判断依据<\/strong>：对面法师的消耗距离；我方塔的血量<\/li><li><strong>决策分支<\/strong>：<\/li><li>站在<strong>塔后<\/strong>过线（不是塔前补刀），同时观察对面法师动向<\/li><li>给边路打信号，说明\"我这路被压，你们注意对面中单可能来\"<\/li><li><strong>反例<\/strong>：「我打个信号让队友别打就行了」——这条被明确否掉了：对面法师+打野一起进你们野区，或者四包二越你们下路，一个信号拦不住。<strong>打信号不能替代你到场<\/strong>。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:03；BV15EJk6fEwX @ 01:10<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：判定为无线权状态，且需要继续吃中线经济判断依据：对面法师的消耗距离；"}, {"id": "K-D03", "cat": "D", "title": "血线被打到 60% 以下且没闪现——回家，别保线", "self": "<h3><a class=\"kref\" href=\"#K-D03\">K-D03<\/a> 血线被打到 60% 以下且没闪现——回家，别保线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中路对线期，血量 &lt;60%，闪现已交或在冷却<\/li><li><strong>判断依据<\/strong>：对面法师的技能冷却与斩杀线；我方塔下是否安全<\/li><li><strong>决策分支<\/strong>：<\/li><li>直接回城，接受掉 1–2 个兵<\/li><li>若对面法师蓝量也不健康且无法越塔 → 可以再撑一波，但要站在塔后<\/li><li><strong>反例<\/strong>：「我血少但不能掉线，硬吃一波」——<strong>掉状态之后轻则被单杀、丢闪现，重则丢野区<\/strong>。这是\"为了一波兵输掉整条线\"的典型。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:30；BV15EJk6fEwX @ 00:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中路对线期，血量 &lt;60%，闪现已交或在冷却判断依据：对面法师的技能冷却与斩杀线；"}, {"id": "K-D04", "cat": "D", "title": "有线权但下一波兵 8 秒内到——别走，再推一波", "self": "<h3><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 有线权但下一波兵 8 秒内到——别走，再推一波<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有明确线权；下一波兵线到线时间 ≤8 秒<\/li><li><strong>判断依据<\/strong>：兵线节奏（约 30 秒一波）；当前小兵数量<\/li><li><strong>决策分支<\/strong>：留在线上再推一波，把兵线送进对面塔，让对面疲于补塔刀<\/li><li><strong>反例<\/strong>：「有线权就立刻游走」——走到一半兵线回来，你既没拿到资源也没吃到线，两头空。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:53<\/li><li><strong>可信度<\/strong>：中（阈值为 8 秒的推算值，UP 主未给具体秒数，需实战校准）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有明确线权；"}, {"id": "K-D05", "cat": "D", "title": "有线权且打野在同侧——跟他走，别自己单走", "self": "<h3><a class=\"kref\" href=\"#K-D05\">K-D05<\/a> 有线权且打野在同侧——跟他走，别自己单走<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权；我方打野位于己方半区或河道<\/li><li><strong>判断依据<\/strong>：打野位置与行进方向；对面打野是否已在小地图暴露<\/li><li><strong>决策分支<\/strong>：与打野走同一侧，做视野或反野；两人一起才有交换价值<\/li><li><strong>反例<\/strong>：「我自己先去探一下」——单人进野区在无视野情况下大概率被抓，而这次被抓会把刚拿到的线权一起吐出去。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a>（先确认可动窗口）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 02:11；BV15EJk6fEwX @ 02:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权；"}, {"id": "K-D06", "cat": "D", "title": "打野位置不明——只占中轴草，不深入", "self": "<h3><a class=\"kref\" href=\"#K-D06\">K-D06<\/a> 打野位置不明——只占中轴草，不深入<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权，但打野位置未知或在对面上半区<\/li><li><strong>判断依据<\/strong>：小地图打野最后出现位置与时间<\/li><li><strong>决策分支<\/strong>：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场<\/li><li><strong>反例<\/strong>：「反正有线权，去对面野区找个机会」——打野位置不明时进对面野区，等于把命交给概率。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:43；BV15EJk6fEwX @ 01:47<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权，但打野位置未知或在对面上半区判断依据：小地图打野最后出现位置与时间决策分支：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场反例：「…"}, {"id": "K-D07", "cat": "D", "title": "死了刚复活——先回中线过线，不要先参团", "self": "<h3><a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 死了刚复活——先回中线过线，不要先参团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：复活后场上正在发生团战或资源争夺<\/li><li><strong>判断依据<\/strong>：兵线位置；团战距离；自身大招冷却<\/li><li><strong>决策分支<\/strong>：<\/li><li>中线有兵且没人清 → <strong>先过线<\/strong>，再决定是否进场<\/li><li>中线已空 → 直接进场<\/li><li><strong>反例<\/strong>：「团战开始了必须去」——线不过，你到场也是白给经济，而且下一波还要被压。<strong>兵线大于团战<\/strong>这条在低分段尤其反直觉。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 03:24；BV15EJk6fEwX @ 03:26<\/li><li><strong>可信度<\/strong>：中（\"兵线大于团战\"是 UP 主的口号式结论，需在 06/07 用其他来源交叉验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：复活后场上正在发生团战或资源争夺判断依据：兵线位置；"}, {"id": "K-D08", "cat": "D", "title": "对线期的辅助：按「野→边→射→中」的顺序决定第一步", "self": "<h3><a class=\"kref\" href=\"#K-D08\">K-D08<\/a> 对线期的辅助：按「野→边→射→中」的顺序决定第一步<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，辅助决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>反例<\/strong>：「辅助就该跟着射手」——这是四个判据里排第三的一条，不是第一条。开局直接去发育路，等于放弃了野区节奏。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:47；BV1yke26fEYB @ 00:52<\/li><li><strong>可信度<\/strong>：中（该公式为 UP 主自创命名\"一野二边三射四中\"，非官方；顺序逻辑与 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 的反方向拿资源一致，故采信）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂，不单列）<\/h2>\n<ul><li><strong>在节点「判据 A 线权」上<\/strong>：把\"我先到 2 级\"当成\"我有线权\"。到 2 级只是一次，线权是持续状态，看的是<strong>这一波谁的小兵更多<\/strong>。<\/li><li><strong>在节点「判据 A1 对面法师消失」上<\/strong>：把\"小地图没有他\"当成\"他走了\"。消失 8 秒内可能只是在草丛里，直接跟过去会撞脸。<\/li><li><strong>在节点「判据 C 打野位置」上<\/strong>：把\"打野刚露头\"当成\"打野在附近\"。露头的位置决定他能不能到，不能到就等于不在。<\/li><li><strong>在节点「判据 D 刚复活」上<\/strong>：默认\"团战优先级最高\"。低分段最常见的死法就是复活后直奔团战，回来发现自己中线已经掉两波。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 的 8 秒阈值、<a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 的\"兵线大于团战\"均为单一来源，缺第二个 UP 主交叉验证 → <code>30_index/stale.md<\/code> 已登记。<\/li><li>本节的\"线权\"定义在中路成立，<strong>对抗路不适用<\/strong>（对抗路优势要控线，中路优势要推线）→ 对抗路支线待 P2 单独写，不要套用本节。<\/li><li>版本风险：王维为 S45 新英雄，若 S46 调整其一级强度，<a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 的\"塔后过线\"前提需重估。<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，辅助决定第一波去哪判断依据：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清决策分支…"}]}, {"key": "D", "cat": "对局内", "title": "05 资源点与推进", "file": "05_资源点与推进.md", "intro": "<blockquote><p>素材：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。这是<strong>全位置通用<\/strong>的一节 —— 资源刷新时间对五个人都一样，只是谁去争、谁去换不同。 上游是 <code>03_前四分钟.md<\/code>（第一条龙争不争），这一节接在它后面：<strong>第一条龙之后，剩下的资源怎么排优先级<\/strong>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：这局有哪些资源点可用？   → K-D19（先有一张时刻表，才有得选）\n第 2 步：优势时，龙怎么拿才不翻车？→ K-D20（控血线，不拼惩）\n第 3 步：劣势时，龙怎么换才不亏？  → K-D21（换 + 抢仇恨的时机）\n第 4 步：打完团，推还是撤？        → K-D22（看前排还在不在）\n第 5 步：要拆塔了，先拆哪座？      → K-D23（边塔 &gt; 中塔，边路高地 &gt; 中路高地）\n第 6 步：大龙和主宰什么时候放？    → K-D24（把大小龙兵拉开距离）<\/code><\/pre>", "entries": [{"id": "K-D19", "cat": "D", "title": "资源点清单：记不住时间就别去偷", "self": "<h3><a class=\"kref\" href=\"#K-D19\">K-D19<\/a> 资源点清单：记不住时间就别去偷<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何时刻判断\"现在有什么可争的\"<\/li><li><strong>清单（按刷新频率排）<\/strong>：<\/li><li><strong>发育路红隼<\/strong>（开局第一个可争点）<\/li><li><strong>对抗路河灵<\/strong>（正常刷 3 只）<\/li><li><strong>双方赤甲<\/strong><\/li><li><strong>前期野区小野<\/strong>（后期刷新速度不一致，<strong>记不住时间就放弃偷<\/strong>）<\/li><li><strong>Buff<\/strong><\/li><li><strong>2 / 4 / 8 / 10 分钟龙<\/strong>，以及<strong>风暴龙王<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>你能说出下一个资源点<strong>还有多久刷<\/strong> → 可以围绕它打<\/li><li>说不出来 → <strong>放弃偷，去干确定的事<\/strong>（解线、卡位）<\/li><li><strong>反例<\/strong>：「大概快刷了吧，我去看看」——\"去看看\"的成本是 10 秒 + 一次视野暴露，收益是零。资源点的全部价值在<strong>提前 20 秒布置<\/strong>，不在了才去就已经晚了<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（清单本身是客观事实；\"后期小野刷新不一致\"是版本特性，需定期复核）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何时刻判断\"现在有什么可争的\"清单（按刷新频率排）：发育路红隼（开局第一个可争点）对抗路河灵（正常刷 3 只）双方赤甲前期野区小野（后期刷新速度不一致，记不住时间就…"}, {"id": "K-D20", "cat": "D", "title": "优势方控龙：把龙血控在一万以上，别给对面拼惩的机会", "self": "<h3><a class=\"kref\" href=\"#K-D20\">K-D20<\/a> 优势方控龙：把龙血控在一万以上，别给对面拼惩的机会<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方优势，正在打龙<\/li><li><strong>判断依据<\/strong>：龙的血量 vs 对面打野的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li>优势方 → <strong>龙血控在一万以上<\/strong>，慢慢打。<strong>不要一路打到斩杀线<\/strong>，那等于把龙交给一次 50/50 的拼惩<\/li><li>对面打野不在（掉点/在另一侧）→ 可以直接打穿<\/li><li><strong>反例<\/strong>：「打得越快越安全」——快是给对面的机会。你打到 3000 血时，对面打野一个闪进来就是 50% 概率。控住血线，他进来只是送<\/li><li><strong>为什么这条重要<\/strong>：优势局的龙<strong>不是资源，是陷阱<\/strong>。你本来已经赢了，唯一输的方式就是在这里赌一次<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（与\"优势不赌\"的通用原则一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方优势，正在打龙判断依据：龙的血量 vs 对面打野的位置决策分支：优势方 → 龙血控在一万以上，慢慢打。"}, {"id": "K-D21", "cat": "D", "title": "劣势方打龙：换，以及\"抢仇恨\"只在暴君放地震波时不行", "self": "<h3><a class=\"kref\" href=\"#K-D21\">K-D21<\/a> 劣势方打龙：换，以及\"抢仇恨\"只在暴君放地震波时不行<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方劣势，对面在打龙<\/li><li><strong>决策分支<\/strong>：<\/li><li>首选 <strong>换龙<\/strong>（对面打这条，你去打另一条/去拆塔），不硬抢<\/li><li>要抢 → 等<strong>仇恨不转移的窗口过去<\/strong>：<strong>暴君放地震波期间仇恨不转移<\/strong>，等波过完才能抢<\/li><li><strong>反例<\/strong>：「劣势也要抢龙翻盘」——劣势抢龙是 20% 成功率的事，换龙是 100% 拿到等值资源的事。翻盘靠的是<strong>连续三次不亏<\/strong>，不是一次赌赢<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（\"地震波期间仇恨不转移\"是机制细节，需按版本复核）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方劣势，对面在打龙决策分支：首选 换龙（对面打这条，你去打另一条/去拆塔），不硬抢要抢 → 等仇恨不转移的窗口过去：暴君放地震波期间仇恨不转移，等波过完才能抢反例：…"}, {"id": "K-D22", "cat": "D", "title": "团战打完之后：先看前排还在不在，再决定推还是撤", "self": "<h3><a class=\"kref\" href=\"#K-D22\">K-D22<\/a> 团战打完之后：先看前排还在不在，再决定推还是撤<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一波团刚打完，双方都有阵亡<\/li><li><strong>判断依据<\/strong>：<strong>己方前排还在不在<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>杀了对面前排 → <strong>先退，等 CD 再推<\/strong>。这时候推塔等于替对面吸收伤害（他们的后排还有输出，你们的前排已经残了）<\/li><li>自家前排掉点 → <strong>立刻找对面开团<\/strong>。前排一没，你们就再也开不了团了，只能被磨死<\/li><li><strong>反例<\/strong>：「团赢了就推」——赢的是人头，不是站位。前排残血时推塔，塔的伤害 + 对面后排的输出会把人头还回去<\/li><li><strong>推广<\/strong>：这条和第 3 节的\"资源点\"是同一个逻辑：<strong>先看\"我还有没有下一波的能力\"，再决定要不要把这波收益最大化<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一波团刚打完，双方都有阵亡判断依据：己方前排还在不在决策分支：杀了对面前排 → 先退，等 CD 再推。"}, {"id": "K-D23", "cat": "D", "title": "压塔顺序：先边塔，假压高地转中；高地先清边线再清中", "self": "<h3><a class=\"kref\" href=\"#K-D23\">K-D23<\/a> 压塔顺序：先边塔，假压高地转中；高地先清边线再清中<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：优势方要拆塔<\/li><li><strong>判断依据<\/strong>：塔的价值 = 它后面能带出什么（超级兵/视野/进野区路线）<\/li><li><strong>决策分支（按顺序）<\/strong>：<\/li><\/ul>\n<ol><li><strong>先拆边塔<\/strong>，再拆中塔<\/li><li>拆完边塔 → <strong>假压高地，转中<\/strong>（把对面的防守拉过去，再回头拆中）<\/li><li><strong>上高地前先清边线，再清中线<\/strong>，让三线同时到<\/li><li><strong>边路高地优先于中路高地<\/strong>——因为边路高地破了有<strong>超级兵<\/strong><\/li><\/ol>\n<ul><li><strong>反例<\/strong>：「中路是核心，先拆中塔」——中塔拆了只是打开地图，边塔拆了才有超级兵持续给压力。先拆中塔的收益是\"能进野区\"，先拆边塔的收益是\"对面必须一直有人去清线\"<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：优势方要拆塔判断依据：塔的价值 = 它后面能带出什么（超级兵/视野/进野区路线）决策分支（按顺序）：先拆边塔，再拆中塔拆完边塔 → 假压高地，转中（把对面的防守拉过去…"}, {"id": "K-D24", "cat": "D", "title": "主宰之镜的光：等小龙兵过一塔一点再放，把大小龙兵拉开距离", "self": "<h3><a class=\"kref\" href=\"#K-D24\">K-D24<\/a> 主宰之镜的光：等小龙兵过一塔一点再放，把大小龙兵拉开距离<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方拿了主宰之镜，准备放大龙兵<\/li><li><strong>判断依据<\/strong>：大小龙兵的<strong>到达时间差<\/strong><\/li><li><strong>决策分支<\/strong>：<strong>等小龙兵过一塔一点再放<\/strong>大龙兵 → 两条线不会同时到，对面<strong>必须交两轮技能<\/strong>才能清完<\/li><li><strong>反例<\/strong>：「拿到就放，越早越好」——同时到 = 对面一波技能清两条。错开 10 秒 = 对面要交两次，而技能是有 CD 的<\/li><li><strong>为什么这条是本节的收尾<\/strong>：前面的 <a class=\"kref\" href=\"#K-D19\">K-D19<\/a>~D23 都在讲\"什么时候动手\"，这条讲\"<strong>动手的时机差本身就是收益<\/strong>\"。同一个资源，早放和晚放差一轮技能<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中（单来源，且属操作细节，版本改动风险高）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>这一节和其他节的关系<\/h2>\n<div class=\"tw\"><table><thead><tr><th>上游<\/th><th>关系<\/th><\/tr><\/thead><tbody><tr><td><code>03_前四分钟.md<\/code><\/td><td>第一条龙争不争 → 本节处理\"第一条之后的所有资源\"<\/td><\/tr><tr><td><code><a class=\"kref\" href=\"#K-L19\">K-L19<\/a><\/code> 一带的游走纪律<\/td><td>资源点要<strong>提前 20 秒布置<\/strong>，不是刷了才去<\/td><\/tr><tr><td><code>L_分路/05_打野.md<\/code>（<a class=\"kref\" href=\"#K-L41\">K-L41<\/a> 时间差）<\/td><td>打野把资源点当成\"时间差的刻度\"，其他位置把它当成\"目标\"<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>待补<\/h2>\n<ul><li><strong>每个资源点的精确经济值<\/strong>（决定\"换\"划不划算）—— 需官方或营地数据<\/li><li><strong>暴君/主宰的具体增益数值<\/strong>（本文档没提，只有\"争不争\"的判断）<\/li><li><strong>风龙/暗影主宰等特殊机制<\/strong>（版本相关，未覆盖）<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方拿了主宰之镜，准备放大龙兵判断依据：大小龙兵的到达时间差决策分支：等小龙兵过一塔一点再放大龙兵 → 两条线不会同时到，对面必须交两轮技能才能清完反例：「拿到就放，…"}]}, {"key": "D", "cat": "对局内", "title": "06 中期：为 10 分钟强化龙做准备", "file": "06_中期.md", "intro": "<blockquote><p>素材：阿泽×国一铠浩宇 2200 分逆风局（BV1VTdGBaEXg）、445 雅典娜百强局（BV1DSPtz4EM9）。 上一节 <code>05_资源点与推进.md<\/code> 讲\"资源怎么排优先级\"，这一节讲\"<strong>中期这段时间的目标是什么<\/strong>\"。<\/p><\/blockquote>\n<h2>1. 中期只有一个目标：把 10 分钟那一波打好<\/h2>\n<p>4–10 分钟这段，很多人会当成\"继续发育\"，然后到 10 分钟突然发现对面已经站好龙坑了。<\/p>\n<p><strong>正确的理解是：这一整段时间是在\"布置\"10 分钟的那一波。<\/strong><\/p>\n<p>所以中期所有动作都要能回答一句：\"这一步对 10 分钟那波有什么用？\"答不上来，就是在空转。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：4–7 分钟该干什么？      → K-D25（发育 + 推进反野，顺手压边塔）\n第 2 步：7–10 分钟该干什么？      → K-D26（抓掉点 + 带线，为龙团铺路）\n第 3 步：10 分钟那一波，站位怎么排？→ K-D27（藏视野，别打正面）\n第 4 步：什么时候该稳一手？        → K-D28（对面掉了人，反而要慢）<\/code><\/pre>", "entries": [{"id": "K-D25", "cat": "D", "title": "4–7 分钟：加速发育 + 推进反野，有优势先压边塔", "self": "<h3><a class=\"kref\" href=\"#K-D25\">K-D25<\/a> 4–7 分钟：加速发育 + 推进反野，有优势先压边塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一条龙打完，进入 4–7 分钟<\/li><li><strong>判断依据<\/strong>：己方有没有优势<\/li><li><strong>决策分支<\/strong>：<\/li><li>有优势 → <strong>先压边塔<\/strong>。边塔掉了才有更多入侵机会（BV1VTdGBaEXg @ 06:06）<\/li><li>有优势 → 带队友<strong>吃对面野区<\/strong>，把雪球滚起来（@ 07:09）<\/li><li>没优势 → 以发育为绝对优先，一波野区一波线<\/li><li><strong>为什么是\"边塔\"不是\"中塔\"<\/strong>：边塔破了对面必须分人守线，中塔破了只是打开地图。<strong>要的是\"逼对面分人\"，不是\"打开地图\"<\/strong>（详见 <code><a class=\"kref\" href=\"#K-D23\">K-D23<\/a><\/code>）<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 06:06、@ 07:09<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一条龙打完，进入 4–7 分钟判断依据：己方有没有优势决策分支：有优势 → 先压边塔。"}, {"id": "K-D26", "cat": "D", "title": "7–10 分钟：抓掉点 + 加快推进，没机会就去带线", "self": "<h3><a class=\"kref\" href=\"#K-D26\">K-D26<\/a> 7–10 分钟：抓掉点 + 加快推进，没机会就去带线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：7–10 分钟<\/li><li><strong>判断依据<\/strong>：小地图上有没有\"对面少人\"的窗口<\/li><li><strong>决策分支<\/strong>：<\/li><li>有掉点 → 加快推进，优先拔外塔，争取上高地（BV1VTdGBaEXg @ 08:58）<\/li><li>没机会 → <strong>去边路带线<\/strong>。一组兵线 + 一片野，经济高于刷两片野区，耗时还更短（@ 08:10）<\/li><li><strong>反例<\/strong>：「没机会就在野区刷」——野区刷完经济是涨了，但<strong>兵线没动<\/strong>，10 分钟那波你还是没位置<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 07:57、@ 08:10、@ 08:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：7–10 分钟判断依据：小地图上有没有\"对面少人\"的窗口决策分支：有掉点 → 加快推进，优先拔外塔，争取上高地（BV1VTdGBaEXg @ 08:58）没机会 → …"}, {"id": "K-D27", "cat": "D", "title": "10 分钟龙团：先藏视野，等队友开起来再绕后", "self": "<h3><a class=\"kref\" href=\"#K-D27\">K-D27<\/a> 10 分钟龙团：先藏视野，等队友开起来再绕后<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟强化龙即将刷新<\/li><li><strong>判断依据<\/strong>：你的英雄<strong>打不打得了正面<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>不灵活的英雄（铠、大部分战士）→ <strong>必须藏视野 + 绕后<\/strong>。打正面会被对面中射消耗掉状态，之后想参团就进不去了（BV1VTdGBaEXg @ 09:11）<\/li><li>灵活/远程的 → 可以正面，但要站在<strong>能吃到队友控制<\/strong>的位置<\/li><li><strong>标准流程<\/strong>（@ 09:35）：<\/li><\/ul>\n<p>``<code> 先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C → 打掉点形成人数差 → 再稳稳拿龙 <\/code>``<\/p>\n<ul><li><strong>为什么\"绕后\"不是\"偷\"<\/strong>：绕后的目的是<strong>在团开起来之后进场<\/strong>，不是绕过去单杀。你先动手，对面五个人都在，你只是送<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 09:11、@ 09:35<\/li><li><strong>可信度<\/strong>：高（这条对\"不灵活的近战\"是硬约束）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "`` 先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C → 打掉点形成人数差 → 再稳稳拿龙 ``"}, {"id": "K-D28", "cat": "D", "title": "对方掉人时反而要慢：稳一手，先让别人去占视野", "self": "<h3><a class=\"kref\" href=\"#K-D28\">K-D28<\/a> 对方掉人时反而要慢：稳一手，先让别人去占视野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟前后，对面有 1–2 人刚死<\/li><li><strong>判断依据<\/strong>：<strong>对面复活时间 vs 你们拿龙需要的时间<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>稳一手开龙 → 让队友先去<strong>占主宰/暴君视野<\/strong>，没有的话点信号让队友去占（BV1DSPtz4EM9 @ 05:57）<\/li><li>抢节奏 → 只有在\"对面剩下的人来不及到\"时才成立<\/li><li><strong>反例<\/strong>：「对面掉了两个人，赶紧打龙」——对面复活 20 秒，龙要打 30 秒，最后 10 秒就是给对面翻盘的机会<\/li><li><strong>配套<\/strong>：这时候最容易犯的错是<strong>以为自己在打龙，其实在打团<\/strong>。所以开龙前先问一句：<strong>对面剩下的人在哪？<\/strong> 看不到人，就是他们要来了<\/li><li><strong>来源<\/strong>：BV1DSPtz4EM9 @ 05:57<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 这段时间最容易犯的三个错<\/h2>\n<ol><li><strong>把中期当\"发育期\"<\/strong>（<a class=\"kref\" href=\"#K-D25\">K-D25<\/a>）→ 到 10 分钟才发现没位置。<\/li><li><strong>龙团打正面<\/strong>（<a class=\"kref\" href=\"#K-D27\">K-D27<\/a>）→ 不灵活的英雄打正面，等于把状态送给对面中射。<\/li><li><strong>对面掉人就急着开龙<\/strong>（<a class=\"kref\" href=\"#K-D28\">K-D28<\/a>）→ 没算复活时间，最后 10 秒被抢。<\/li><\/ol>\n<h2>4. 交叉<\/h2>\n<div class=\"tw\"><table><thead><tr><th>位置<\/th><th>中期的主要任务<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>反野 + 放野给队友，把对位差做出来<\/td><td><code><a class=\"kref\" href=\"#K-L49\">K-L49<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L50\">K-L50<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>跟\"大哥\"转线，不是跟射手<\/td><td><code><a class=\"kref\" href=\"#K-L56\">K-L56<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>有线权就走，别站桩<\/td><td><code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>4 分半自检线（一件成品装 + 鞋、0-0-0）<\/td><td><code><a class=\"kref\" href=\"#K-L37\">K-L37<\/a><\/code><\/td><\/tr><tr><td>发育路<\/td><td>7 分钟前别转线<\/td><td><code><a class=\"kref\" href=\"#K-L28\">K-L28<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>待补<\/h2>\n<ul><li>中期\"经济差多少算优势\"的阈值（素材里只有\"经济大优\"这种定性说法）<\/li><li>逆风中期的处理（这一节全部是均势/优势视角）<\/li><li>各位置在 10 分钟龙团的具体站位（现在只有\"藏视野绕后\"这一条通用原则）<\/li><\/ul>", "sum": "适用版本：S45触发条件：10 分钟前后，对面有 1–2 人刚死判断依据：对面复活时间 vs 你们拿龙需要的时间决策分支：稳一手开龙 → 让队友先去占主宰/暴君视野，没有的话点信号让队友去占（…"}]}], "lanes": [{"key": "mid", "name": "中路", "icon": "中", "motto": "清完这波线往哪走", "file": "01_中路.md", "title": "中路：清完这波线，我往哪个方向走", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论，不是某个英雄的。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/<\/code>。<\/p><\/blockquote>\n<h2>1. 中路的位置特权：转线成本最低<\/h2>\n<p>中路是地图中心，<strong>到三条路的距离最短<\/strong>。所以中路的产出不是\"我打了多少伤害\"，而是<strong>\"我能在几个地方出现\"<\/strong>。<\/p>\n<p>这条决定了中路的判断顺序：<strong>先算线权（能不能走），再算方向（往哪走），最后才算操作（怎么打）<\/strong>。顺序反了就会出现\"我在中路打得很凶，但地图上什么都没发生\"。<\/p>\n<h2>2. 判断顺序（不能跳步）<\/h2>\n<pre><code>第 1 步：这波线，我有没有线权？        → K-L01\n   ↓ 有\n第 2 步：清完立刻走，还是再推一波？    → K-L02（判据：下一波兵到线时间）\n   ↓ 走\n第 3 步：往哪个方向走？                → K-L03（判据：对面中单消失方向 / 我方打野位置）\n   ↓ 顺路\n第 4 步：路过野区，蹭不蹭？            → K-L05（判据：能不能 3 秒内扫完）\n   ↓\n例外：打野差一级到四 → 中线让给他      → K-L04<\/code><\/pre>", "entries": [{"id": "K-L01", "cat": "L", "title": "线权不是\"我血多\"，是\"对面多快能清完这一波\"", "self": "<h3><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> 线权不是\"我血多\"，是\"对面多快能清完这一波\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每波兵线交汇前（判断自己能不能走）<\/li><li><strong>判断依据<\/strong>：对面中路（含辅助）<strong>一波兵需要几个技能<\/strong>。一个技能清完 = 你无线权；要三个技能以上 = 你有线权<\/li><li><strong>决策分支<\/strong>：<\/li><li>没线权 → 不硬抢，塔前接兵，改走\"反方向拿资源\"或等打野（见 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>）<\/li><li>有线权 → 清完立刻产生一个\"可动窗口\"，详见 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/li><li><strong>反例<\/strong>：「我血比对面多，所以我有线权」——血线是打架结果，不是线权来源。满血但清不动兵，照样是被压在塔下。<\/li><li><strong>分路差异<\/strong>：这条在对抗路也成立（<code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>），但中路的判据要多看一个人——<strong>对面辅助会不会来帮清<\/strong>，辅助一来清线速度直接翻倍。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:19（\"大乔一技能直接秒兵线，我只有一个人……这波没有线权\"）<\/li><li><strong>可信度<\/strong>：高（多英雄素材一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每波兵线交汇前（判断自己能不能走）判断依据：对面中路（含辅助）一波兵需要几个技能。"}, {"id": "K-L02", "cat": "L", "title": "有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口", "self": "<h3><a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：刚清完一波兵，下一波兵还没到<\/li><li><strong>判断依据<\/strong>：下一波兵到线还要多久（正常约 30 秒一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>到线 &gt; 8 秒 → 够一次短游，按 <a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 选方向<\/li><li>到线 ≤ 8 秒 → 不动，把线再推一波更赚（见 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「清完线在中路等下一波，顺便看有没有机会单杀」——单杀是低概率事件，转线是确定收益。<strong>有线权却不走，等于把线权浪费掉。<\/strong><\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:19（\"玩海月这种有线权的中单法师，一定要想办法在四级前多去控一两个中立资源\"）<\/li><li><strong>可信度<\/strong>：高（与 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code> 的 8 秒阈值互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：刚清完一波兵，下一波兵还没到判断依据：下一波兵到线还要多久（正常约 30 秒一波）决策分支：到线 &gt; 8 秒 → 够一次短游，按 K-L03 选方向到线 ≤ 8…"}, {"id": "K-L03", "cat": "L", "title": "方向选\"反方向\"，不是\"跟着走\"", "self": "<h3><a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 方向选\"反方向\"，不是\"跟着走\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要转线了，选往哪一路<\/li><li><strong>判断依据<\/strong>：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面中单往上 → <strong>我往下<\/strong>（拿河蟹、兵线、野区小资源）<\/li><li>对面中单往下 → 我往上<\/li><li>看不出方向 → 只占中轴草，不深入（<code><a class=\"kref\" href=\"#K-D06\">K-D06<\/a><\/code>）<\/li><li>我方打野在同侧 → 跟他走同一侧（<code><a class=\"kref\" href=\"#K-D05\">K-D05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「对面去支援了，我赶紧跟」——你没有线权时跟过去比他慢，有线权时跟过去也是<strong>同向撞车<\/strong>，两边都打不出东西。反方向才有空位。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:38；<code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的判据（BV1i2n96AEvp @ 02:31 底层框架）<\/li><li><strong>可信度<\/strong>：高（D 类已独立验证过同一条）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要转线了，选往哪一路判断依据：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区决策分支：对面中单往上 → 我往下（拿河蟹、兵线、野区小资源）对面中单往下 …"}, {"id": "K-L04", "cat": "L", "title": "中线归谁：打野差一级到四，中线让他", "self": "<h3><a class=\"kref\" href=\"#K-L04\">K-L04<\/a> 中线归谁：打野差一级到四，中线让他<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：打野走到中线想吃这波兵<\/li><li><strong>判断依据<\/strong>：打野当前等级离四级差多少<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野差一级到四 → <strong>让<\/strong>。他升四才有反打/进野区的能力，这一波线的收益远大于你自己多几十块<\/li><li>打野已四级以上 → 不让，按 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 自己清完转线<\/li><li><strong>反例<\/strong>：「我的线凭什么给他」——四级前的打野和四级后是两个英雄，这一波让出去，换的是他接下来 3 分钟的节奏权。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（\"此时一定要先选择速推中线……利用中线升四级，才可能有反打的机会\"）<\/li><li><strong>可信度<\/strong>：中高（打野视角的职业级素材，明确把中线当\"升四资源\"用）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：打野走到中线想吃这波兵判断依据：打野当前等级离四级差多少决策分支：打野差一级到四 → 让。"}, {"id": "K-L05", "cat": "L", "title": "顺路蹭野：用技能边缘扫一下就走，别站野区打完", "self": "<h3><a class=\"kref\" href=\"#K-L05\">K-L05<\/a> 顺路蹭野：用技能边缘扫一下就走，别站野区打完<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：清完线、等下一波兵的间隙，路过野区<\/li><li><strong>判断依据<\/strong>：这组野还剩多少血、你打完要几秒<\/li><li><strong>决策分支<\/strong>：只有一个技能的时间 → 边缘扫一下立刻走；要站桩打完 → 不打，回线<\/li><li><strong>反例<\/strong>：「顺手把野清干净」——你多待 5 秒，中线就丢了，中塔掉一半血。<strong>蹭野的收益上限是\"顺路\"，一旦需要绕路就不成立。<\/strong><\/li><li><strong>分路差异<\/strong>：对抗路也有\"顺路刷野\"，但对抗路可以合法地多待（见 <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>）；中路不行，中塔是全图最重要的塔。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:07（一技能边缘摸小猪，与直接转向相差约 0.3 秒）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：清完线、等下一波兵的间隙，路过野区判断依据：这组野还剩多少血、你打完要几秒决策分支：只有一个技能的时间 → 边缘扫一下立刻走；"}, {"id": "K-L06", "cat": "L", "title": "第一波线遇到钩子类辅助（钟馗），退到塔前接", "self": "<h3><a class=\"kref\" href=\"#K-L06\">K-L06<\/a> 第一波线遇到钩子类辅助（钟馗），退到塔前接<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面辅助是钟馗这类强制位移，且你在第一波线上<\/li><li><strong>判断依据<\/strong>：自己是否站在对方钩子的射程内<\/li><li><strong>决策分支<\/strong>：<strong>退到塔前接兵<\/strong>，不要站在兵线前沿；被勾进塔下等于直接脱节<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢线权的前提是你能安全清完。被钩一次，掉的不只是血，还有整波线的经验。<\/li><li><strong>分路差异<\/strong>：这条对<strong>清线慢的法师<\/strong>尤其致命（抢不动又躲不开），清线快的法师可以用一波技能换掉这个风险。<\/li><li><strong>来源<\/strong>：BV1Fd4y1k7EY @ 00:24；@ 01:09（清线慢所以先拿河蟹）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面辅助是钟馗这类强制位移，且你在第一波线上判断依据：自己是否站在对方钩子的射程内决策分支：退到塔前接兵，不要站在兵线前沿；"}, {"id": "K-L07", "cat": "L", "title": "弱势法师没有线权：不尾随、反方向、塔后过线", "self": "<h3><a class=\"kref\" href=\"#K-L07\">K-L07<\/a> 弱势法师没有线权：不尾随、反方向、塔后过线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：自己的清线速度明显慢于对面中单（弱势法），且第一波线抢不动<\/li><li><strong>判断依据<\/strong>：<strong>我能不能在自己掉状态之前把这波兵清完<\/strong>。不能 → 这条成立；能 → 走 <a class=\"kref\" href=\"#K-L01\">K-L01<\/a> 正常流程<\/li><li><strong>决策分支<\/strong>：<\/li><\/ul>\n<ol><li><strong>清线时只打后排兵<\/strong>，不打人。目的不是消耗，是让对面<strong>卡不住线<\/strong>；被卡线 = 掉状态 = 丢闪现甚至丢野区（BV15EJk6fEwX @ 00:27）<\/li><li><strong>对面去上路支援，你不跟<\/strong>，往<strong>反方向<\/strong>去下路拿资源。理由：弱势法跟过去「作用不大」，留在原地只是多一个人看对面吃线（@ 00:39 / @ 00:40）<\/li><li><strong>没线权就老老实实塔后过线<\/strong>，别站兵线前沿（@ 01:04）<\/li><li><strong>过完线不急着乱跑<\/strong>：先占中轴视野（一般是中路边草），给下路打信号，再决定去哪（@ 01:43）<\/li><\/ol>\n<ul><li><strong>判据一句话<\/strong>：弱势法<strong>能和对面换状态就不算亏，让对面做不了事就是赚<\/strong>（@ 00:47）。这是\"弱势法\"的收益公式，和强势法的\"抢节奏\"公式不一样。<\/li><li><strong>反例<\/strong>：「有线权才配游走」——这条对弱势法反着用：<strong>正因为没线权，才更要往反方向拿资源<\/strong>，否则整局只有挨压。<\/li><li><strong>分路差异<\/strong>：这条只在<strong>中路<\/strong>成立。对抗路的弱势方不能\"反方向拿资源\"，因为对抗路没有第二条资源线可换（对照 <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:25；@ 00:27；@ 00:39；@ 00:40；@ 01:04；@ 01:43；@ 03:37<\/li><li><strong>可信度<\/strong>：中（单来源，全局思路局，非英雄专精）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<blockquote><p>关于来源里的英雄名：原视频字幕写作「王维」，经核对 <strong>S45「月照长安」新英雄王维（中路法师）<\/strong>，字幕没听错。这条按\"弱势法师\"这一类写，王维只是样本之一；他的机制细节见 <code>A_英雄教学/王维.md<\/code>。同一条视频里对手是嫦娥，可作为\"对面有强线权中单\"的样本。<\/p><\/blockquote>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把线权当血量<\/strong>（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>）→ 明明清不动兵还站前面，被压到塔下，然后怪打野不来。<\/li><li><strong>有线权但不走<\/strong>（<a class=\"kref\" href=\"#K-L02\">K-L02<\/a>）→ 全场最贵的资源是\"能动的中单\"，站着等于放弃它。<\/li><li><strong>转线跟着对面走<\/strong>（<a class=\"kref\" href=\"#K-L03\">K-L03<\/a>）→ 同向撞车，两个人的收益都变成零。<\/li><\/ol>\n<h2>4. 交叉：中路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局第一波谁帮清中<\/td><td><code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（游走排序里中线排第四）/ <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>你转线过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>对面辅助一级来帮清中<\/strong>时，中单该不该抢——素材里出现过（BV1xEFGzoEYA 提到大乔一技能秒兵线），但没有明确结论。<\/li><li>中路对\"炮台 vs 法刺\"两类英雄的转线时机差异，只有零散片段。<\/li><li>S46 版本中路兵线节奏是否变化（S45 按 30 秒/波算）。<\/li><\/ul>", "sum": "关于来源里的英雄名：原视频字幕写作「王维」，经核对 S45「月照长安」新英雄王维（中路法师），字幕没听错。"}], "hue": 216, "heroes": ["不知火舞", "王维", "女娲", "小乔"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles":
