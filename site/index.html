w": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "513.json", "ts": null, "q": "婉儿在对线期十分克制短手法师，并且当高渐离找到机会近身开启爆发时，婉儿可以通过大招躲避伤", "url": "https://pvp.qq.com/web201605/herodetail/513.shtml"}]}, "高渐离|不知火舞": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "157.json", "ts": null, "q": "高渐离：不知火舞与高渐离对线，前期可以用扇子无限消耗手短的高渐离。即使4级之后高渐离有一", "url": "https://pvp.qq.com/web201605/herodetail/157.shtml"}]}, "高渐离|小乔": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "106.json", "ts": null, "q": "高渐离：高渐离在团战时想要发挥优势，就必须进到人群中，才能充分利用减伤以及技能的范围伤害", "url": "https://pvp.qq.com/web201605/herodetail/106.shtml"}]}, "高渐离|干将莫邪": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "182.json", "ts": null, "q": "高渐离正好与干将莫邪相反，虽然拥有高额伤害，但需要进场输出，却是被干将莫邪克制", "url": "https://pvp.qq.com/web201605/herodetail/182.shtml"}]}, "高渐离|西施": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "523.json", "ts": null, "q": "需要走进战场中心的高渐离遇见以Poke见长的西施时，非常难以找到入场空间，他甚至会被控制", "url": "https://pvp.qq.com/web201605/herodetail/523.shtml"}]}}}}, "cats": [{"key": "A", "name": "英雄教学", "desc": "这个英雄怎么玩、什么时候强", "n": 31}, {"key": "B", "name": "克制关系", "desc": "打谁舒服、被谁克、为什么", "n": 42}, {"key": "C", "name": "BP", "desc": "选人阶段该怎么定", "n": 10}, {"key": "D", "name": "对局内", "desc": "现在这一刻该干什么", "n": 28}, {"key": "L", "name": "分路", "desc": "这个位置该按什么顺序想事", "n": 58}], "overview": [{"title": "导航：五类内容，五种问法", "file": "00_导航.md", "html": "<p>知识库按<strong>内容类型<\/strong>分五类。先判断你问的是哪一类，再去那一类找。<\/p>\n<div class=\"tw\"><table><thead><tr><th>类<\/th><th>你问的是<\/th><th>目录<\/th><th>编号<\/th><th>规模<\/th><\/tr><\/thead><tbody><tr><td><strong>A 英雄教学<\/strong><\/td><td>\"这个英雄怎么玩\"<\/td><td><code>A_英雄教学/<\/code><\/td><td><code>K-Axx<\/code><\/td><td>54 张卡<\/td><\/tr><tr><td><strong>B 克制关系<\/strong><\/td><td>\"打谁舒服、被谁克\"<\/td><td><code>B_克制关系/<\/code><\/td><td><code>K-Bxx<\/code><\/td><td><strong>129 张卡<\/strong>（全英雄池）/ 42 条实测<\/td><\/tr><tr><td><strong>C BP<\/strong><\/td><td>\"选人阶段该怎么定\"<\/td><td><code>C_BP/<\/code><\/td><td><code>K-Cxx<\/code><\/td><td>骨架，无实证<\/td><\/tr><tr><td><strong>D 对局内<\/strong><\/td><td>\"现在这一刻该干什么\"<\/td><td><code>D_对局内/<\/code><\/td><td><code>K-Dxx<\/code><\/td><td>04 对线期 ✅<\/td><\/tr><tr><td><strong>L 分路<\/strong><\/td><td>\"这个位置该按什么顺序想事\"<\/td><td><code>L_分路/<\/code><\/td><td><code>K-Lxx<\/code><\/td><td>5 条路<\/td><\/tr><\/tbody><\/table><\/div>\n<p>还有两份底表：<code>94_英雄名录.md<\/code>（官方 129 个英雄 + 分路 + 卡缺口）、<code>30_index/relations.json<\/code>（官方 463 条克制边）。<\/p>\n<h2>五类的边界（别混）<\/h2>\n<ul><li><strong>A 讲\"这个英雄\"<\/strong>：机制、连招顺序、强势期、废的时候。<strong>不涉及对面是谁<\/strong>。<\/li><li><strong>B 讲\"两个英雄之间\"<\/strong>：必须有具体对手。同一条结论换个对手就不成立，才叫克制。<\/li><li><strong>C 讲\"选人之前\"<\/strong>：只跟阵容和版本有关，不跟具体对局局势有关。<\/li><li><strong>D 讲\"选人之后\"<\/strong>：必须带时间点（0:45 / 4 分钟 / 10 分钟），不带时间点的不是 D 类。<\/li><li><strong>L 讲\"这个位置\"<\/strong>：同一时间点五个位置该做的决定不一样，跟具体英雄无关。<\/li><\/ul>\n<p><strong>判定口诀<\/strong>：结论里出现\"对面是谁\"→ B；出现\"第几分钟\"→ D；只是\"这英雄\"→ A；只是\"这版本/这阵容\"→ C；只是\"这个位置\"→ L。<\/p>\n<h2>B 类要分两层读（重要）<\/h2>\n<p>B 卡里有两块，<strong>证据强度差一个量级，别混着用<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>层<\/th><th>内容<\/th><th>可信度<\/th><th>怎么用<\/th><\/tr><\/thead><tbody><tr><td><strong>官方口径 L0<\/strong><\/td><td>谁压谁，每个方向 2~6 个例子<\/td><td>低。官方不给条件，双向对账率只有 2%<\/td><td>当线索，知道\"大概怕谁\"<\/td><\/tr><tr><td><strong>实测条目 K-Bxx<\/strong><\/td><td>带 BV+秒数、带条件、带具体动作<\/td><td>中～高<\/td><td>当结论，照着做<\/td><\/tr><\/tbody><\/table><\/div>\n<p>129 张卡都有官方层，但只有 35 个英雄有实测条目。<strong>官方层空白的\"我该怎么打\"就是没素材，不是漏写。<\/strong><\/p>\n<h2>两条跨类的用法<\/h2>\n<ol><li><strong>A 和 B 是配套的<\/strong>：A 告诉你这英雄靠什么强，B 告诉你这个\"靠什么\"在谁面前失效。只看 A 不看 B，会在被克的对局里越打越崩。<\/li><li><strong>C 的输出是 D 的输入<\/strong>：BP 定了你能干什么，D 才谈得上\"这一刻该不该动\"。<\/li><\/ol>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<p>经济差只是战斗力差的一种来源。信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。 来源：<code>BV1i2n96AEvp @ 02:31<\/code>。<\/p>\n<h2>读法<\/h2>\n<ol><li>先按上表定位到类，再看那类的 <code>_说明.md<\/code> 了解它回答什么；<\/li><li>只读命中的那一条，<strong>不要通读<\/strong>；<\/li><li>条目里的「反例」比「结论」值钱——那是别人踩过的坑。<\/li><\/ol>"}, {"title": "教学信源名单（S45 实测，2026-10-31）", "file": "95_信源名单.md", "html": "<blockquote><p>这不是「关注列表」，是<strong>取用列表<\/strong>。按问题去取，不要全订。 名单会随赛季变，每 2 周复核一次（看 S45 更新数与平均时长有没有掉）。<\/p><\/blockquote>\n<hr>\n<h2>一、先定判据：凭什么说一个 UP「值得信任」<\/h2>\n<p>信任不来自粉丝量、也不来自播放量。按下面五条打分，缺两条以上就不进名单。<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>怎么验<\/th><th>反例特征<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>给判据，不给结论<\/strong><\/td><td>句子结构里有没有「如果/只要/除非/当…时」<\/td><td>全程「视情况而定」「看你怎么玩」<\/td><\/tr><tr><td>2<\/td><td><strong>讲机制，不只讲操作<\/strong><\/td><td>有没有「因为…所以」「原因是」，能不能解释<strong>为什么<\/strong>这样打<\/td><td>「记住这个连招就行」<\/td><\/tr><tr><td>3<\/td><td><strong>给可执行的阈值<\/strong><\/td><td>有没有秒数、经济差、码数、身位、次数<\/td><td>「差不多」「差一点」<\/td><\/tr><tr><td>4<\/td><td><strong>版本对得上<\/strong><\/td><td>标题/内容里的赛季号是否为当前 S45；S44 及更早当作过期<\/td><td>「S43 上路必看」今天还挂首页<\/td><\/tr><tr><td>5<\/td><td><strong>自证 + 不夹带<\/strong><\/td><td>有没有段位/国服/职业教练身份；签名里有没有「包标/上星/复盘××元」<\/td><td>全靠嘴说「我是国服」，且每条视频都在卖课<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这五条怎么量化<\/strong>：本次实测是把候选人的视频字幕抓下来，统计 条件句密度、因果句密度、数字密度、机制术语浓度、空话密度（无脑/记住就行）， 用样本内百分位合成质量分。播放量只占 5% 权重。<\/p>\n<p><strong>实测发现（值得记住）<\/strong>：<\/p>\n<ul><li>B 站「王者荣耀教学」关键词下，<strong>结构化解说型账号极少<\/strong>，高播放大多是直播切片、<\/li><\/ul>\n<p>实录、对喷、或流水线卖课。<\/p>\n<ul><li>抓了 26 个候选、约 100 条视频字幕，只有 <strong>10 个<\/strong>满足「至少 2 条字幕是人在讲而不是<\/li><\/ul>\n<p>游戏音效」。很多号的字幕轨全是「技能正在冷却」「请求集合」——那是 ASR 把游戏音效 当成说话转录了。<\/p>\n<ul><li>所以：<strong>字幕干净本身就是个质量信号<\/strong>，说明有旁白、有解说意图。<\/li><\/ul>\n<hr>\n<h2>二、S 档：跟着学「判断依据」（讲得清、还在更）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>为什么进 S<\/th><th>要打折扣的地方<\/th><\/tr><\/thead><tbody><tr><td><strong>王者荣耀晚风风<\/strong><\/td><td>481626368<\/td><td>打野·全局<\/td><td>视野与节奏讲成可执行步骤：「利用视野开节奏的两个关键点」；老虎那期给到 3 分 15 秒刷新交汇、7 分钟两倍经济差。术语浓度全场最高<\/td><td>均长仅 5.8 分钟，信息密度高但要反复看；签名有「wx 上星/商务」，业务与内容分开看<\/td><\/tr><tr><td><strong>白菜打野教学<\/strong><\/td><td>67244546<\/td><td>打野·分段突破<\/td><td>因果句密度全场最高，明确讲「你卡在 1900–2100 是因为前 4 分钟」，直接对着一个分段改动作<\/td><td>营销话术重（封神/反复观看）；卖复盘 88/次，注意把「他的服务」和「他说的方法」分开<\/td><\/tr><tr><td><strong>阿泽干货博主<\/strong><\/td><td>322640745<\/td><td>全英雄·国服共创<\/td><td>请国一/2w1 分玩家共创，给的是节点型判据：4 分钟圣杯、10 分钟三件套、10 分钟分均 6800 经济<\/td><td>他也做英雄联盟内容（样本里混进过 369 兰博），<strong>只取王者分区<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>三、A 档：单点很硬，按需取（不追全部，只取自己那一路）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>取什么<\/th><\/tr><\/thead><tbody><tr><td><strong>益达兄弟辅助教学<\/strong><\/td><td>298590209<\/td><td>辅助<\/td><td>巅峰最高 2667、总榜第五。出装判据实用（极影 vs 近卫按对面强度与阵容选），九大神辅系列可当辅助入门骨架<\/td><\/tr><tr><td><strong>老杨国服嫦娥<\/strong><\/td><td>1866098100<\/td><td>中路·嫦娥<\/td><td>目标置换讲得清楚：「这波不追求杀人，追求打掉状态、拖刘备到四」——这正是中路该有的思路。吐槽类视频跳过<\/td><\/tr><tr><td><strong>奥特曼zz国一刘备凯<\/strong><\/td><td>18909338<\/td><td>打野·刘备<\/td><td>实战细节密度高（记对面闪现、卡视野蹲人）。签名有上分业务，只取内容<\/td><\/tr><tr><td><strong>夜昧<\/strong><\/td><td>49993700<\/td><td>对抗路<\/td><td>粉丝少但讲得实在：对抗路稳线优先、宁可打不过也别被带节奏；马超存枪的版本差异<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>A 档的共同限制：<strong>覆盖窄<\/strong>。他们只对自己那一路负责，别拿打野的节奏逻辑去套中路。<\/p><\/blockquote>\n<h2>四、B 档：直播切片与职业选手（学操作与节奏，不学结论）<\/h2>\n<p>你说了切片也看，那这里要分清<strong>看什么<\/strong>：<\/p>\n<blockquote><p>切片天然删掉前提，只留结果。所以切片能用来<strong>验证你已经有的判断<\/strong>， 不能用来<strong>建立判断<\/strong>。看的时候问自己「他为什么这时候上」，而不是记「他这时候上了」。<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>类型<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td><strong>赖神无所畏惧<\/strong><\/td><td>395931838<\/td><td>大主播·对抗路（230w）<\/td><td>S45 内 21 条但均长 1.7 分钟，是切片形态。适合看对抗路的对线处理与手感，不适合学体系<\/td><\/tr><tr><td><strong>哔哩哔哩王者荣耀赛事<\/strong><\/td><td>392836434<\/td><td>官方赛事（691w）<\/td><td>S45 内 38 条、均长 55 分钟。<strong>这是 BP 与运营的唯一一手素材<\/strong>，也是我们知识库 C 类（BP）目前唯一的可靠来源<\/td><\/tr><tr><td>职业选手本人号（如 AG 超玩会老帅、LGD 教练阿泰）<\/td><td>549922787 / 492870807<\/td><td>职业/教练认证<\/td><td>账号存在且有认证，但按名字检索近期投稿命中为 0，需进空间页确认更新情况；确认后再补进名单<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>切片号的坑<\/strong>：同一选手常有好几个「XX剪辑呺」「XX精彩集锦」。实测其中一个剪辑号 的字幕轨全是歌词和英雄语音，一条讲解都没有——那种号只能当集锦看。 <strong>认准认证标识和署名，不要认名字相似。<\/strong><\/p>\n<h2>五、不进名单的（按行为特征判断，不针对具体人）<\/h2>\n<ol><li><strong>签名 = 卖课目录<\/strong>：「包标」「上星」「加入我们××教」「复盘 ×× 元」，<\/li><\/ol>\n<p>且视频平均时长 &lt; 3 分钟 → 内容被切成钩子，判断链是断的。<\/p>\n<ol><li><strong>纯剪辑号<\/strong>：无旁白、字幕只有歌词/游戏语音。<\/li><li><strong>版本漂移号<\/strong>：标题还挂着 S43/S44，或内容里说「这个版本」但无法对应到 S45。<\/li><li><strong>只讲出装不讲为什么<\/strong>：给一套铭文出装就结束，遇到阵容变化无法迁移。<\/li><\/ol>\n<hr>\n<h2>六、按你的情况排的取用顺序<\/h2>\n<p>你主中辅、在练对抗、目标荣耀。所以不要五个都订，按这个顺序取：<\/p>\n<ol><li><strong>先修判断公式<\/strong>（解决「什么时候该干什么」）<\/li><\/ol>\n<p>→ 哔哩哔哩王者荣耀赛事 的 BP 段 + 晚风风的视野与节奏。 打野视角讲的是资源与到达，中路/游走可以直接迁移。<\/p>\n<ol><li><strong>再补本分路<\/strong>（解决「我这一路怎么打」）<\/li><\/ol>\n<p>→ 益达兄弟（辅助出装判据）→ 老杨（中路目标置换）。<\/p>\n<ol><li><strong>对抗路单练<\/strong>（解决「最近在练的那条路」）<\/li><\/ol>\n<p>→ 赖神切片看对线与手感 → 夜昧看稳线逻辑。<\/p>\n<ol><li><strong>每个新学的点，立刻落成知识库格式<\/strong>：触发条件 → 判据 → 阈值 → 反例。<\/li><\/ol>\n<p>写不成这个格式，说明还没学到手，只是记住了。<\/p>\n<h2>七、复核机制<\/h2>\n<ul><li>每 2 周跑一次 <code>s0_creators.py --stage all<\/code>，看「S45 更新数」和「平均时长」。<\/li><li>更新数掉到 0 或均长掉到 3 分钟以下 → 降档（大概率转成切片/直播形态）。<\/li><li>赛季切换（11-25 切 S46）后，旧名单全部降为「待复核」，重跑一遍再定档。<\/li><\/ul>\n<hr>\n<h2>八、2026-11-01 增补：用户点名的信源<\/h2>\n<blockquote><p>这一节是<strong>用户直接指定<\/strong>的，优先级高于前面按打分排的档位 —— 因为这是他的实际观看习惯。 但\"可信\"仍然按第一节的五条判据查，指定 ≠ 免检。<\/p><\/blockquote>\n<h3>8.1 建议<strong>细看<\/strong>（用户原话：这几个博主都推荐细看）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>怎么用<\/th><th>可信度核查状态<\/th><\/tr><\/thead><tbody><tr><td><strong>益达（益达兄弟辅助教学）<\/strong><\/td><td>298590209<\/td><td><strong>辅助<\/strong><\/td><td>原名单 A 档，本次<strong>升为细看级<\/strong>。巅峰最高 2667、总榜第五；出装判据（极影 vs 近卫按对面强度与阵容选）可直接用；九大神辅系列是辅助位的入门骨架<\/td><td>已入库，字幕质量实测可用<\/td><\/tr><tr><td><strong>欺压ya<\/strong><\/td><td>1160 >\n<p>《冲击巅峰千强·辅助篇》的 UP 在片尾明确声明<strong>与这些博主无合作、无引流<\/strong>，纯属推荐。原话要点：<\/p>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>方向<\/th><th>他的评价<\/th><\/tr><\/thead><tbody><tr><td><strong>气压<\/strong><\/td><td>逐帧教学<\/td><td><strong>UP 最推荐的一个<\/strong><\/td><\/tr><tr><td><strong>鞋头<\/strong><\/td><td>心态与竞技状态<\/td><td>讲\"怎么不打崩自己\"<\/td><\/tr><tr><td><strong>双叶来宝 C<\/strong><\/td><td>全局与片段实战对照<\/td><td>全局思路 + 对应片段<\/td><\/tr><tr><td><strong>大帅训练营<\/strong><\/td><td>高分操作库<\/td><td>操作素材库<\/td><\/tr><tr><td>某辅助教学博主<\/td><td>新手 → 小国标以下<\/td><td>进阶操作<\/td><\/tr><tr><td>张良绝活哥<\/td><td>张良专项<\/td><td>单英雄<\/td><\/tr><tr><td>装备解析<\/td><td>坦克与功能装<\/td><td>装备理解<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>注意<\/strong>：这是\"别人的推荐\"，本库<strong>没有验证过这些账号的内容质量<\/strong>，只作为待查线索记录。入库前要走第一节的五条判据。<\/p>\n<p><strong>UP 自评的能力权重<\/strong>（也记下来，因为它决定你该练什么）：<\/p>\n<blockquote><p>意识 50% / 操作 30% / 心态 20%<\/p><\/blockquote>\n<p>这三个数字没有数据支撑，但它解释了一件事：<strong>为什么这个库把 90% 的篇幅给了\"判断依据\"而不是\"连招\"<\/strong>。<\/p>\n<hr>\n<p>_数据与脚本：<code>40_scripts/s0_creators.py<\/code>（筛选+评分）、<code>40_scripts/subs_browser.py<\/code>（字幕采集）、 <code>40_scripts/bili_api.py<\/code>（接口层）。原始结果：<code>10_sources/creators_scored.json<\/code>。_<\/p>\n<hr>\n<h2>九、2026-11-01 扩充：宽口径扫出的教学 UP 池<\/h2>\n<p><strong>这一节是候选，不是推荐。<\/strong> 判据只有「近期还在稳定做教学」+「标题带具体分路/英雄」。 质量分要跑 <code>s0_creators.py<\/code> 的字幕测评才有，这里没有。<\/p>\n<p>扫法：<code>s15_roster.py<\/code> 用 32 个关键词 × 2 页搜索（通用 12 + 分路 8 + 英雄 12）， 共命中 518 条视频、聚合出 100+ 个 UP。下表取「至少 3 条命中」的前 40 个。<\/p>\n<div class=\"tw\"><table><thead><tr><th>UP 主<\/th><th>mid<\/th><th>命中<\/th><th>S45<\/th><th>教学占比<\/th><th>均长<\/th><th>主攻分路（命中数）<\/th><th>常见英雄<\/th><\/tr><\/thead><tbody><tr><td>阿泽干货博主<\/td><td>322640745<\/td><td>21<\/td><td>3<\/td><td>100%<\/td><td>8.5m<\/td><td>中路1 / 发育路1<\/td><td>狄仁杰、敖隐、百里守约、项羽、孙策<\/td><\/tr><tr><td>公瑾干货教学<\/td><td>328090313<\/td><td>13<\/td><td>3<\/td><td>100%<\/td><td>5.9m<\/td><td>—<\/td><td>虞姬、朵莉亚、公孙离、孙尚香、墨子<\/td><\/tr><tr><td>浅梦-Dream<\/td><td>255842890<\/td><td>11<\/ d>100%<\/td><td>26.6m<\/td><td>打野1<\/td><td>—<\/td><\/tr><tr><td>猫萌大当家<\/td><td>206916906<\/td><td>3<\/td><td>0<\/td><td>100%<\/td><td>7.6m<\/td><td>游走1<\/td><td>—<\/td><\/tr><tr><td>尘奈-射手思路教学<\/td><td>3493258242034336<\/td><td>3<\/td><td>0<\/td><td>100%<\/td><td>10.4m<\/td><td>发育路1<\/td><td>公孙离、伽罗<\/td><\/tr><tr><td>流夜一动不动<\/td><td>190036080<\/td><td>3<\/td><td>3<\/td><td>0%<\/td><td>4.3m<\/td><td>—<\/td><td>孙尚香、伽罗、蒙犽<\/td><\/tr><tr><td>冰水冰qwq<\/td><td>380470506<\/td><td>3<\/td><td>1<\/td><td>100%<\/td><td>10.7m<\/td><td>—<\/td><td>刘备<\/td><\/tr><tr><td>西汪xhope<\/td><td>237356141<\/td><td>3<\/td><td>0<\/td><td>100%<\/td><td>5.0m<\/td><td>发育路1 / 游走1<\/td><td>—<\/td><\/tr><tr><td>玖遇-出装设计师<\/td><td>3494359305554720<\/td><td>3<\/td><td>3<\/td><td>0%<\/td><td>6.3m<\/td><td>—<\/td><td>孙尚香<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>本次实际入库用到的新信源<\/strong>（发育路，2026-11-01）：<\/p>\n<div class=\"tw\"><table><thead><tr><th>UP 主<\/th><th>用了哪条<\/th><th>入了什么<\/th><\/tr><\/thead><tbody><tr><td>小居王者丶<\/td><td>BV1X2jV6KEiP（13 分钟推进公式）、BV1hBut6WE5k（伽罗 10 分钟全局）<\/td><td><code><a class=\"kref\" href=\"#K-L21\">K-L21<\/a><\/code>~<code><a class=\"kref\" href=\"#K-L28\">K-L28<\/a><\/code> 的原始素材、伽罗卡<\/td><\/tr><tr><td>阿良-射手教学<\/td><td>BV1Qxd8BGEW5（公孙离）、BV1ngLQ6HED4（敖隐）<\/td><td>公孙离卡、敖隐卡、<code><a class=\"kref\" href=\"#K-B13\">K-B13<\/a><\/code><\/td><\/tr><tr><td>小石头光溜溜国服攻略<\/td><td>BV1WzbR6KEfX（狄仁杰黑科技出装）<\/td><td>狄仁杰卡（seed）<\/td><\/tr><tr><td>请叫我宇浩老师<\/td><td>BV1mkZ5BAEJQ、BV1YNxz6YEMy<\/td><td>发育路经济观的对照（未单独成条）<\/td><\/tr><tr><td>是秋白呀<\/td><td>BV1Uf4y1K7nj（公孙离）<\/td><td>公孙离卡的第二来源<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>浅梦-Dream 已核实<\/strong>：mid = <strong>255842890<\/strong>（之前名单里写\"四种搜法都没命中\"是错的，宽扫一次就出来了）。 但要注意：他命中的 11 条里只有 1 条字幕是本人内容（BV1iagP6PE2o 实际是 iPhone 评测字幕，属 ASR 污染）， 所以<strong>名字进名单，素材暂不入库<\/strong>。<\/p>"}, {"title": "素材缺口台账（2026-11-01）", "file": "96_素材缺口.md", "html": "<blockquote><p>这张表回答一个问题：<strong>现在这个库里，哪些东西是\"有结论但没实证\"、哪些是\"根本没写\"。<\/strong> 用处是防止把 seed 卡当完整卡用，也防止下次重复去采已经确认采不到的东西。<\/p><\/blockquote>\n<h2>一、采集通道现状（先看这个，再看缺口）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>环节<\/th><th>状态<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>搜索接口<\/td><td>✅ 可用<\/td><td>旧接口 <code>x/web-interface/search/type<\/code> 未登录必 412，已改走 <strong>wbi 签名版<\/strong>。无 SESSDATA 也能用<\/td><\/tr><tr><td>字幕接口<\/td><td>⚠️ 只能用浏览器<\/td><td>API 侧无登录返回 <code>subtitles: []<\/code>；<code>subs_browser.py<\/code> 用浏览器 profile 里的 HttpOnly cookie 取，<strong>这条通道目前正常<\/strong><\/td><\/tr><tr><td><strong>ASR 污染率<\/strong><\/td><td>❌ <strong>约 70%<\/strong><\/td><td>抓 100 条字幕，通常只有 25–35 条内容是本文视频。其余是别的视频（手机评测、职场访谈、LoL、动画台词）<\/td><\/tr><tr><td>体检<\/td><td>✅ <code>s12_check.py<\/code><\/td><td>判据：术语密度 &lt; 3/千字 或噪音 &gt; 8% → reject<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这条结论很重要<\/strong>：<strong>B 站字幕不能当成\"有视频就有文字\"<\/strong>。每次采集必须过体检，否则会拿别人的稿子写王者结论。<\/p>\n<h2>二、A 类：53 个英雄的完成度<\/h2>\n<div class=\"tw\"><table><thead><tr><th>等级<\/th><th>数量<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>完整卡<\/td><td>18<\/td><td>不知火舞、小乔、大乔、女娲、夏洛特、盾山、苏烈、鲁班大师、韩信、铠、刘备、雅典娜、元歌、王维、公孙离、伽罗、敖隐（+ 4 张原有卡的补充章节）<\/td><\/tr><tr><td><strong>seed 卡<\/strong><\/td><td><strong>35<\/strong><\/td><td>只有《冲击巅峰千强·辅助篇》一条来源，只有\"实战动作\"，<strong>没有技能数值、没有出装铭文<\/strong>；狄仁杰也记 seed（出装来自单个 UP 的科研流）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>王维<\/strong>（2026-11-01 补）：机制部分取自 S45 官方前瞻与技能面板，<strong>不是视频素材<\/strong>；对线处理有 1 条 B 站素材（BV15EJk6fEwX，讲\"弱势法师全局思路\"，王维是样本）。卡内 <code>status: seed<\/code>，出装只给胜率统计口径，没有实测。<\/p><\/blockquote>\n<p><strong>seed 卡清单<\/strong>（辅助篇覆盖）：钟馗、张飞、牛魔、东皇太一、大禹、刘邦、太乙真人、孙膑、鬼谷子、桑启、瑶、蔡文姬、明世隐、少司缘、空空儿、杨玉环、朵莉亚、元辅、安奈特、张良、墨子、廉颇、项羽、刘禅、庄周、夏侯惇、赵怀真、金蝉、姜子牙、王昭君、孙策、达摩、武则天、海月、白起（部分与完整卡重叠时是补充章节）。<\/p>\n<h3>中路英雄为什么少<\/h3>\n<p>用户主玩中路，但<strong>中路的干净字幕极难采<\/strong>。本次实测：<\/p>\n<div class=\"tw\"><table><thead><tr><th>英雄<\/th><th>抓取情况<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>甄姬<\/td><td>抓 3 条，3 条全污染（惠普笔记本维修、空镜头剪辑教程）<\/td><td>需重采<\/td><\/tr><tr><td>上官婉儿<\/td><td>抓 5 条，4 条污染 + 1 条混入足球解说<\/td><td>需重采<\/td><\/tr><tr><td>干将莫邪<\/td><td>抓 4 条，3 条污染；仅 BV1TFp96pEbp 可用，但内容是\"发育路干将\"的杂谈<\/td><td>素材等级不足<\/td><\/tr><tr><td>貂蝉<\/td><td>搜索返回 0 条（疑似短时限流）<\/td><td>需重采<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>所以中路现在只有 4 张卡<\/strong>（不知火舞、小乔、女娲、王维）+ 1 张 seed（王昭君）。其中王维的机制来自官方公告，不是教学视频。<\/p>\n<h2>三、B 类：对位卡（9 个英雄）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>有卡的<\/th><th>苏烈、王维、女娲、张良、钟馗、庄周、孙膑、韩信<\/th><\/tr><\/thead><tbody><tr><td><strong>缺的<\/strong><\/td><td>发育路全部（射手对位一条都没有）、中路大部分、打野大部分<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>卡点<\/strong>：<code>s8_harvest.py<\/code> 主动排除了标题含「对位X／打X／克制X」的视频（当初是为了防止把\"别人讲怎么打她\"混进英雄教学）。做 B 类要<strong>反过来只采这些<\/strong>，需要单独写一个 <code>s11_duel.py<\/code>。<\/p>\n<p><strong>已发现但未入库的对位线索<\/strong>（素材在本地，等整理）：<\/p>\n<ul><li>马超 vs 韩信（BV1tPbk6rEVH，已入 <a class=\"kref\" href=\"#K-B12\">K-B12<\/a>）<\/li><li>司马懿 vs 献祭流雅典娜（BV1r54y1N7fo）<\/li><li>刘备打铠的\"三个技巧\"（BV1fj411U7tr）<\/li><li>雅典娜克戈雅（BV1Rkui6QExF，攻击频率越高大招炸得越快）<\/li><\/ul>\n<h2>四、C 类：BP（10 条）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>有<\/th><th>五查顺序、组合补缺、组合速查表<\/th><\/tr><\/thead><tbody><tr><td>缺<\/td><td><strong>版本 T 度名单<\/strong>（必须带日期）、<strong>职业 BP 的一二手顺序<\/strong>、对抗路/打野视角的组合<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>五、D 类：对局内（主线 10 节，现在 5 节）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>有<\/th><th>00 主线地图、02 开局前 90 秒、03 前四分钟、04 对线期、05 资源点与推进<\/th><\/tr><\/thead><tbody><tr><td><strong>缺<\/strong><\/td><td>01（编号空）、<strong>06 中期资源、07 团战、08 顺风推进、09 逆风止损、10 终结比赛<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>00_主线地图.md<\/code> 里的依赖图已经画到 10，但只有 5 节有内容。<\/p>\n<h2>六、L 类：分路（49 条）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>条数<\/th><th>素材强度<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>6<\/td><td>中<\/td><\/tr><tr><td>游走<\/td><td>15<\/td><td><strong>强<\/strong>（辅助篇文档补了 7 条）<\/td><\/tr><tr><td>发育路<\/td><td>10<\/td><td><strong>弱<\/strong>（只有 1 条射手第一视角，其余是辅助视角）<\/td><\/tr><tr><td>对抗路<\/td><td>10<\/td><td>强<\/td><\/tr><tr><td>打野<\/td><td>10<\/td><td>中（镜、澜、马超各一条）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>七、下次采集的直接指令<\/h2>\n<pre><code># 1. 补中路（换关键词，逐批试，命中就停）\n\"$PY\" s8_harvest.py --hero 甄姬 --hero 上官婉儿 --hero 貂蝉 --hero 干将莫邪\n\"$PY\" subs_browser.py --bvid BVxxx ...\n\"$PY\" s12_check.py --lane mid          # 体检，术语密度 &lt; 3/千字直接扔\n\n# 2. 做 B 类（需要新脚本：只采「对位X／打X／怎么打X」标题）\n#    s11_duel.py 还没写，采法见 B_克制关系/_说明.md\n\n# 3. 补 D 类 06–10（关键词：中期运营 / 团战站位 / 顺风推进 / 逆风止损 / 结束比赛）<\/code><\/pre>\n<h2>八、规矩没变<\/h2>\n<p><strong>没有来源就不写。<\/strong> 宁可留一张\"待补\"，也不要把\"我觉得\"写进去 —— 因为这张库最后是给打排位用的，写错一条会比空着更糟。<\/p>\n<hr>\n<h2>七、2026-11-01 第二轮采集：发育路 + 打野（宽扫法）<\/h2>\n<h3>采集方法变了<\/h3>\n<p>第一轮是\"按英雄找视频\"（<code>s8_harvest.py<\/code>），命中率低。这一轮改成<strong>先扫人、再取料<\/strong>：<\/p>\n<ol><li><code>s15_roster.py<\/code> — 32 个关键词 × 2 页宽扫，518 条视频 → 聚合出 100+ 个教学 UP（结果进 <code>95_信源名单.md<\/code> 第九节）<\/li><li><code>s16_pick.py<\/code> — 按分路（adc / jungle / mid / solo / roam）从池里挑，同一 UP 最多 3 条，优先长视频<\/li><li><code>subs_browser.py<\/code> — 浏览器上下文抓字幕<\/li><li>体检：术语密度 ≥ 4/千字 且 噪音 &lt; 5% 才算可用（比 <code>s12_check.py<\/code> 的 3/千字稍严，因为这一轮素材量大，宁可错杀）<\/li><\/ol>\n<h3>这一轮的真实命中率<\/h3>\n<div class=\"tw\"><table><thead><tr><th>批次<\/th><th>抓到的字幕<\/th><th>通过体检<\/th><th>通过率<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>发育路<\/td><td>42<\/td><td>16<\/td><td><strong>38%<\/strong><\/td><td>比第一轮估的 30% 略好<\/td><\/tr><tr><td>打野<\/td><td>11<\/td><td>3<\/td><td><strong>27%<\/strong><\/td><td>打野素材本身就少，污染也重<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>污染样本长什么样<\/strong>（这次真实遇到的）：<\/p>\n<ul><li>「鲁班七号教学」（坤神）→ 字幕是<strong>代驾去新疆<\/strong>的 vlog<\/li><li>浅梦-Dream「万字发育路教科书」→ 字幕是 <strong>iPhone 16 评测<\/strong><\/li><li>「马可镜转吕布全局精讲」→ 字幕是<strong>王者万象棋<\/strong>（棋类玩法，不是 MOBA）<\/li><\/ul>\n<p><strong>结论<\/strong>：搜索标题和字幕内容<strong>完全没有相关性保证<\/strong>。所以\"看到标题靠谱就往库里写\"一定会出事，体检这一步不能省。<\/p>\n<h3>这一轮的净产出<\/h3>\n<div class=\"tw\"><table><thead><tr><th>产出<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>发育路英雄卡<\/td><td>公孙离、伽罗、敖隐（完整卡）、狄仁杰（seed）<\/td><\/tr><tr><td>发育路分路层<\/td><td>新增 <code><a class=\"kref\" href=\"#K-L58\">K-L58<\/a><\/code>（呆射/游射/技能型三分法）、<code><a class=\"kref\" href=\"#K-L59\">K-L59<\/a><\/code>（队友掉点=资源窗口）<\/td><\/tr><tr><td>打野分路层<\/td><td>新增 <code><a class=\"kref\" href=\"#K-L61\">K-L61<\/a><\/code>~<code><a class=\"kref\" href=\"#K-L64\">K-L64<\/a><\/code>（六拍节奏法 / 节拍从上一波开始 / 一轮只有两片野区 / 反野的要素是刷新时间）<\/td><\/tr><tr><td>克制<\/td><td><code><a class=\"kref\" href=\"#K-B13\">K-B13<\/a><\/code>（公孙离全时期怕戈娅）<\/td><\/tr><tr><td>信源<\/td><td>95 名单新增第九节：40 个 UP 的命中/分路/英雄分布表<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>仍然缺的（下一轮目标）<\/h3>\n<ul><li><strong>中路<\/strong>：4 张卡（不知火舞/小乔/女娲/王维），甄姬、上官婉儿、貂蝉、干将莫邪仍然采不到干净字幕<\/li><li><strong>对抗路<\/strong>：2 张卡（元歌、夏洛特），是全库第二大的洞<\/li><li><strong>打野<\/strong>：4 张卡（韩信/雅典娜/刘备/铠），且缺\"发育型打野\"样本<\/li><li><strong>射手<\/strong>：还缺马可波罗、孙尚香、虞姬、鲁班七号、戈娅、百里守约的独立卡（素材抓到了，但密度不够，只有实战切片）<\/li><\/ul>\n<hr>\n<h2>第八节 第三轮采集：克制关系专项（2026-11-01）<\/h2>\n<p>这一轮的目标不是补英雄卡，是把 B 类（克制关系）从\"只有官方举例\"做成\"有实测、有动作\"。<\/p>\n<h3>三层素材链，命中率差别很大<\/h3>\n<div class=\"tw\"><table><thead><tr><th>环节<\/th><th>输入<\/th><th>输出<\/th><th>通过率<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>官方详情页<\/td><td>129 个英雄<\/td><td>117 个页面 / 463 条方向边<\/td><td><strong>91%<\/strong><\/td><td>12 个新英雄官方没开关系页<\/td><\/tr><tr><td>搜「X怎么打」类视频<\/td><td>45 个英雄 × 2 模板<\/td><td>222 条候选<\/td><td>—<\/td><td>标题筛：要像讲对位，排除赛事/直播/皮肤/高光<\/td><\/tr><tr><td>取字幕<\/td><td>68 条目标<\/td><td>47 条有字幕<\/td><td><strong>69%<\/strong><\/td><td>比前两轮的 38% / 27% 高得多，因为标题就是对位视频<\/td><\/tr><tr><td>扫对位片段<\/td><td>467 份字幕<\/td><td>287 条候选<\/td><td>—<\/td><td>必须同时命中\"对位语义词 + 两个不同英雄名\"<\/td><\/tr><tr><td>人工筛<\/td><td>287 条<\/td><td>29 条<\/td><td><strong>10%<\/strong><\/td><td>大头被丢掉：局势播报、方向不明、ASR 污染<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关键结论<\/strong>：<strong>专项搜索的通过率（69%）远高于泛搜（38%/27%）<\/strong>。 以后补某个主题，先想清楚\"这类视频的标题长什么样\"，再搜。<\/p>\n<h3>丢掉的那 90% 长什么样（记下来免得以后又去捞）<\/h3>\n<ul><li>局势播报：「这波打完我们反个红」「他肯定没了」——讲那一局，不是这两个英雄<\/li><li>只有一个英雄名：「后羿丢完二我们清线就行」——没有对手，不成对位<\/li><li>方向不明：<strong>能留下的都有一句具体动作<\/strong>。比如「夏洛特打蒙恬不用怕」本身没用，<\/li><\/ul>\n<p>加上「学会扭腰躲他枪」才有用。这条标准是人工筛的唯一判据。<\/p>\n<ul><li>ASR 污染：「夏洛特打蒙恬<strong>七夕<\/strong>不用怕」——\"七夕\"是噪音，不能当技能名写进卡<\/li><\/ul>\n<h3>这一轮的净产出<\/h3>\n<div class=\"tw\"><table><thead><tr><th>产出<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>官方关系<\/td><td><code>30_index/relations.json<\/code>，463 条边，覆盖 117 英雄<\/td><\/tr><tr><td>B 卡<\/td><td>9 张 → <strong>129 张<\/strong>（全英雄池）<\/td><\/tr><tr><td>K-B 条目<\/td><td>13 条 → <strong>42 条<\/strong>，覆盖 35 个英雄，全部 9 字段齐全<\/td><\/tr><tr><td>站点<\/td><td>新增 <code>#matrix<\/code> 对位总表；英雄页加「克制速览」<\/td><\/tr><tr><td>新脚本<\/td><td><code>s18_official.py<\/code>（官方）/ <code>s17_write_b.py<\/code>（建卡）/ <code>s19_duel.py<\/code>（扫字幕）/ <code>s20_duel_entries.py<\/code>（写条目）/ <code>s21_duel_pick.py<\/code>（搜对位视频）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>仍然缺的<\/h3>\n<ul><li><strong>129 张卡里，「我该怎么打」绝大多数还是空的<\/strong>。这是诚实的状态——没素材就不填。<\/li><li>12 个新英雄（元流之子、王维、敖隐、少司缘、影、空空儿、孙权、蚩奼、大禹、卢雅那、大司命、心魔六耳）官方没开关系页，只能靠实测从零建。<\/li><li>对位视频还有 155 条候选没取字幕（222 里取了 68）。下一轮直接接着取，不用重新搜。<\/li><\/ul>"}, {"title": "版本变更台账", "file": "90_版本变更台账.md", "html": "<p><strong>版本真值只认官方公告，不认任何\"版本答案\"。<\/strong> 每条 K 条目都必须写\"适用版本\"，跨赛季自动进复核队列。<\/p>\n<h2>赛季区间表（2026）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>赛季<\/th><th>名称<\/th><th>开始<\/th><th>结束<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>S42<\/td><td>神佑建木<\/td><td>2026-01-08<\/td><td>2026-04-01<\/td><td>官网公告 tid=791692<\/td><\/tr><tr><td>S43<\/td><td>陌上相逢<\/td><td>2026-04-01<\/td><td>2026-06-24<\/td><td>官网赛季公告<\/td><\/tr><tr><td>S44<\/td><td>—<\/td><td>2026-06-25<\/td><td>2026-09-23<\/td><td>官网赛季公告<\/td><\/tr><tr><td><strong>S45<\/strong><\/td><td><strong>月照长安（当前）<\/strong><\/td><td><strong>2026-09-23<\/strong><\/td><td><strong>2026-11-25<\/strong><\/td><td>官网赛季公告<\/td><\/tr><tr><td>S46<\/td><td>—<\/td><td>2026-11-25<\/td><td>—<\/td><td>官方预告（11-25 0:00–5:00 停服更新）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>注意：S45 只有约 63 天，比常规 85–95 天短。<strong>任何按\"三个月一赛季\"推算的结论都要重新核对。<\/strong><\/p><\/blockquote>\n<h2>S45 版本特征（影响内容取舍）<\/h2>\n<ul><li><strong>中野辅版本<\/strong>：打野与辅助的联动权重高于边路单带。<\/li><li>周年庆期间（10/24 前后）活动内容多、<strong>平衡性调整少<\/strong>，教学素材偏旧。<\/li><li>新英雄：王维、蚩奼、大司命、空空儿、孙权、苍、影等；<strong>刀锋宝贝仍在体验服<\/strong>。<\/li><\/ul>\n<h2>已发生的平衡调整（截至 2026-10-31）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>日期<\/th><th>对象<\/th><th>改动<\/th><th>影响的知识点<\/th><\/tr><\/thead><tbody><tr><td>10-30（体验服）<\/td><td>镜<\/td><td>二技能 CD 9~7→10~8（全等级 +1s）；加速 50%→100(+20/Lv)；二技能伤害小幅上调；三技能充能 10→10~8<\/td><td>未入库（打野支线），暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>曜<\/td><td>三技能 CD 15~10→13.5~10<\/td><td>未入库，暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>刀锋宝贝<\/td><td>三技能追踪优化、强化普攻法球修复<\/td><td>未上线正式服，不采信为正式结论<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>体验服改动一律不作为正式服结论入库<\/strong>，只能进本表。<\/p>\n<h2>待办<\/h2>\n<ul><li>[ ] 抓到 S45 官方更新公告原文后，补全本表 9-23 至 10-31 的正式服调整<\/li><li>[ ] S46（11-25）上线后 7 天内，全库过一遍\"适用版本 = S45\"的条目<\/li><\/ul>"}], "meta": {"total": 169, "heroes": 131, "sub": "当前版本 S45 · 共 169 条 · 更新 2026-11-01"}}</script>
<script>
/* ══════════════════════════════════════════════════════════
   kog 站点交互 —— 英雄宫格 + 折叠卡
   数据来自 <script id="DATA" type="application/json">，构建时注入
   路由用 hash（要支持 file:// 直接打开，不能用 History API）：
     # / 空        → 英雄宫格
     #H:苏烈       → 英雄页
     #doc:xx.md    → 长文档（信源名单 / 版本台账 / 导航）
     #cat:A        → 某一类的全部条目
     #K-B01        → 直达条目并展开
   ══════════════════════════════════════════════════════════ */
(function () {
  const D = JSON.parse(document.getElementById('DATA').textContent);
  const view = document.getElementById('view');
  const qEl = document.getElementById('q');
  const root = document.documentElement;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 扁平分索引：搜索与直达用 ── */
  const IDX = [];
  D.heroes.forEach(h => {
    h.a.concat(h.b).forEach(e => IDX.push({ ...e, owner: h.name, kind: 'H:' + h.name }));
  });
  D.general.forEach(g => g.entries.forEach(e =>
    IDX.push({ ...e, owner: g.title, kind: 'doc:' + g.file })));
  (D.lanes || []).forEach(l => l.entries.forEach(e =>
    IDX.push({ ...e, owner: l.name, kind: 'lane:' + l.file })));

  const heroOf = n => D.heroes.find(h => h.name === n);
  const laneOf = f => (D.lanes || []).find(l => l.file === f);
  const byId = id => IDX.find(e => e.id === id);

  /* ── 条目折叠卡 ── */
  function entryCard(e, open) {
    const idAttr = e.id ? ` id="${esc(e.id)}"` : '';
    const idTag  = e.id ? `<span class="id">${esc(e.id)}</span>` : '';
    return `<details class="entry"${idAttr}${open ? ' open' : ''}>
      <summary>
        ${idTag}
        <span class="tt"><b>${esc(e.title)}</b>
          <span>${esc(e.sum || '')}</span></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="body">${e.html || ''}</div>
    </details>`;
  }

  /* ── 大局观定位：强势期 / 节奏职责 / 一句话 ── */
  const TEMPO_CN = { early: '前期', mid: '中期', late: '后期', even: '全期' };
  const JOB_CN = { open: '开节奏', follow: '跟节奏', hold: '守节奏',
                   scout: '视野侦察', split: '带线牵制' };
  function planTags(h) {
    const out = [];
    if (h.tempo) out.push(`<span class="pill t-${esc(h.tempo)}">${esc(TEMPO_CN[h.tempo] || h.tempo)}</span>`);
    if (h.job) out.push(`<span class="pill j-${esc(h.job)}">${esc(JOB_CN[h.job] || h.job)}</span>`);
    return out.join('');
  }

  /* ── 英雄卡 ── */
  function heroCard(h) {
    const pills = [];
    if (h.a.length) pills.push(`<span class="pill a">怎么玩 ${h.a.length}</span>`);
    // 克制数来自官方口径（全英雄池都有），比"对位条目数"更能反映这张卡有多厚
    if (h.beats_n) pills.push(`<span class="pill kw">克 ${h.beats_n}</span>`);
    if (h.loses_n) pills.push(`<span class="pill kl">被克 ${h.loses_n}</span>`);
    if (!pills.length) pills.push('<span class="pill g">待补</span>');
    const plan = planTags(h);
    return `<a class="hcard" href="#H:${encodeURIComponent(h.name)}">
      <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
      <span class="hname">${esc(h.name)}${h.unlisted ? '<i class="unlisted" title="官方 129 英雄名录里没有这个名字">?</i>' : ''}</span>
      <span class="hmeta">${pills.join('')}</span>
      ${plan ? `<span class="hplan">${plan}</span>` : ''}
    </a>`;
  }

  /* ── 分路卡 ── */
  function laneCard(l) {
    return `<a class="lcard" href="#lane:${encodeURIComponent(l.file)}">
      <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
      <span class="hname">${esc(l.name)}</span>
      <span class="hmeta">
        <span class="pill l">${l.entries.length} 条</span>
        ${l.heroes.length ? `<span class="pill g">${l.heroes.length} 英雄</span>` : ''}
      </span>
      <span class="lmotto">${esc(l.motto || '')}</span>
    </a>`;
  }

  /* ── 首页 ── */
  function renderHome() {
    const heroes = D.heroes.map(heroCard).join('');
    const lanes = (D.lanes || []).map(laneCard).join('');
    const gen = D.general.filter(g => g.entries.length || g.intro).map(g => {
      const icon = g.key === 'D' ? '⌁' : g.key === 'C' ? '⇄' : '·';
      const n = g.entries.length;
      return `<a class="gcard" href="#doc:${encodeURIComponent(g.file)}">
        <span class="gicon">${icon}</span>
        <span class="gtxt"><b>${esc(g.title)}</b>
          <span>${esc(g.cat)} · ${n ? n + ' 条判断' : '阅读'}</span></span>
      </a>`;
    }).join('');

    const docs = D.overview.filter(o => o.file !== '00_导航.md').map(o =>
      `<a class="gcard" href="#doc:${encodeURIComponent(o.file)}">
        <span class="gicon">▤</span>
        <span class="gtxt"><b>${esc(o.title.replace(/（.*?）/, ''))}</b>
          <span>参考文档</span></span>
      </a>`).join('');

    view.innerHTML = `
      <div class="hero-head">
        <p class="eyebrow">${esc(D.version)} · 决策手册</p>
        <h1>点英雄，看怎么打</h1>
        <p class="lede">每一条结论都能回溯到具体视频与秒数。有判据才写，没把握就留空。</p>
      </div>

      <section class="sec">
        <div class="sec-h"><h2>按分路看</h2><span>同一时间点，五个位置要做的决定不一样</span></div>
        <div class="grid lanes">${lanes}</div>
      </section>

      <section class="sec">
        <div class="sec-h"><h2>英雄</h2>
          <span>${D.heroes.length} 个 · 点开看全部 ·
            <a href="#matrix">对位总表 →</a>${duelHas()
              ? ` · <a href="#duel:${encodeURIComponent(Object.keys(D.duel)[0])}">同路五档矩阵 →</a>` : ''}</span></div>
        <div class="grid">${heroes}</div>
      </section>

      ${gen ? `<section class="sec">
        <div class="sec-h"><h2>不挑英雄的</h2><span>对线、节奏、BP</span></div>
        <div class="row">${gen}</div>
      </section>` : ''}

      ${docs ? `<section class="sec">
        <div class="sec-h"><h2>参考</h2></div>
        <div class="row">${docs}</div>
      </section>` : ''}
    `;
  }

  /* ── 英雄页 ── */
  function renderHero(name) {
    const h = heroOf(name);
    if (!h) return renderHome();

    const secA = h.a.length
      ? `<section class="sec"><div class="sec-h"><h2>怎么玩</h2>
           <span>${h.a.length} 条</span></div>
           ${h.a.map(e => entryCard(e, false)).join('')}</section>`
      : `<section class="sec"><div class="sec-h"><h2>怎么玩</h2></div>
           <p class="lede">还没有这个英雄的条目。</p></section>`;

    const secB = h.b.length
      ? `<section class="sec"><div class="sec-h"><h2>打谁 / 被谁克</h2>
           <span>${h.b.length} 条</span></div>
           ${h.b.map(e => entryCard(e, false)).join('')}</section>`
      : '';

    const inc = h.incoming.length
      ? `<section class="sec"><div class="sec-h"><h2>被这些英雄的条目点名</h2></div>
           <p class="lede">${h.incoming.map(n =>
             `<a href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`).join('、')}
           的克制条目里提到了他，点进去看具体打法。</p></section>`
      : '';

    // 克制速览：官方口径的两组名字，点一下就能跳到对方
    const chip = n => `<a class="oppchip" href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`;
    const secK = (h.beats.length || (h.loses_all || []).length)
      ? `<section class="sec"><div class="sec-h"><h2>克制速览</h2>
           <span>官方口径 L0 · 具体怎么打看下面的卡</span></div>
         <div class="oppbox">
           <div class="opprow">
             <span class="oppk win">我压</span>
             <span class="oppv">${(h.beats.length ? h.beats.map(chip).join('') : '<i class="dim">官方没列</i>')}</span>
           </div>
           <div class="opprow">
             <span class="oppk lose">压我</span>
             <span class="oppv">${((h.loses_all || []).length ? h.loses_all.map(chip).join('') : '<i class="dim">官方没列</i>')}</span>
           </div>
         </div>
         <p class="lede"><a href="#matrix">看全部 ${D.heroes.length} 个英雄的对位表 →</a></p>
         </section>`
      : '';

    const plan = (h.tempo || h.job || h.motto)
      ? `<div class="planbox">
           <div class="pb-cell">
             <span class="pb-k">强势期</span>
             <b>${esc(TEMPO_CN[h.tempo] || '—')}</b>
           </div>
           <div class="pb-cell">
             <span class="pb-k">节奏职责</span>
             <b>${esc(JOB_CN[h.job] || '—')}</b>
           </div>
           <div class="pb-cell wide">
             <span class="pb-k">一句话</span>
             <b>${esc(h.motto || '—')}</b>
           </div>
         </div>`
      : '';

    view.innerHTML = `
      <a class="back" href="#">← 全部英雄</a>
      <div class="hhead">
        <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
        <div>
          <h1>${esc(h.name)}</h1>
          <div class="hmeta">
            <span class="pill g">${h.n} 条</span>
            ${h.unlisted ? '<span class="pill w">不在官方名录</span>' : ''}
            ${h.beats_n ? `<span class="pill kw">克 ${h.beats_n}</span>` : ''}
            ${h.loses_n ? `<span class="pill kl">被克 ${h.loses_n}</span>` : ''}
            ${planTags(h)}
            ${(h.lanes || []).map(k => {
              const l = (D.lanes || []).find(x => x.key === k);
              return l ? `<a class="pill l" href="#lane:${encodeURIComponent(l.file)}">${esc(l.name)}大局观</a>` : '';
            }).join('')}
          </div>
        </div>
      </div>
      ${plan}
      ${duelBox(h.name)}${secK}${secA}${secB}${inc}
    `;
  }

  /* ── 分路页 ── */
  function renderLane(file) {
    const l = laneOf(file);
    if (!l) return renderHome();

    const heroRow = l.heroes.length
      ? `<div class="grid">${l.heroes.map(n => heroCard(heroOf(n))).filter(Boolean).join('')}</div>`
      : `<p class="lede">这个分路还没有英雄卡。${l.key === 'adc' || l.key === 'jungle'
          ? '（这是已知缺口：没有以该位置为第一视角的素材。）' : ''}</p>`;

    const others = (D.lanes || []).filter(x => x.key !== l.key).map(x =>
      `<a class="klink" href="#lane:${encodeURIComponent(x.file)}">${esc(x.name)} · ${esc(x.motto || '')}</a>`).join('');

    const stages = (l.stages || []).length
      ? `<div class="row">${l.stages.map(s =>
          `<a class="gcard" href="#doc:${encodeURIComponent(s.file)}">
            <span class="gicon">⌁</span>
            <span class="gtxt"><b>${esc(s.title)}</b><span>对局内 · ${s.id} 节</span></span>
          </a>`).join('')}</div>`
      : `<p class="lede">这一路还没有对应的对局内环节。</p>`;

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hhead">
        <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
        <div>
          <h1>${esc(l.name)}</h1>
          <div class="hmeta">
            <span class="pill l">${l.entries.length} 条判断</span>
            <span class="pill g">只看位置，不看英雄</span>
          </div>
        </div>
      </div>

      <section class="sec"><div class="sec-h"><h2>这一路的大局观</h2></div>
        <div class="doc">${l.intro || ''}</div></section>

      <section class="sec"><div class="sec-h"><h2>分条判断</h2>
        <span>${l.entries.length} 条</span></div>
        ${l.entries.map(e => entryCard(e, false)).join('')}</section>

      <section class="sec"><div class="sec-h"><h2>这个位置的英雄</h2></div>${heroRow}</section>

      <section class="sec"><div class="sec-h"><h2>对应的时间环节</h2></div>${stages}</section>

      <section class="sec"><div class="sec-h"><h2>交叉的分路</h2>
        <span>同一件事，两边判据要对得上</span></div>
        <div class="row">${others}</div></section>
    `;
  }

  /* ── 长文档页 ── */
  function renderDoc(file) {
    const o = D.overview.find(x => x.file === file);
    const g = D.general.find(x => x.file === file);
    if (o) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="doc">${o.html}</div>`;
      return;
    }
    if (g) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="hero-head"><p class="eyebrow">${esc(g.cat)}</p>
          <h1>${esc(g.title)}</h1></div>
        <div class="doc">${g.intro || ''}</div>
        ${g.entries.map(e => entryCard(e, false)).join('')}`;
      return;
    }
    renderHome();
  }

  /* ── 分类页 ── */
  function renderCat(key) {
    const c = D.cats.find(x => x.key === key);
    if (!c) return renderHome();
    const list = IDX.filter(e => e.cat === key);
    view.innerHTML = `<a class="back" href="#">← 返回</a>
      <div class="hero-head"><p class="eyebrow">分类</p>
        <h1>${esc(c.name)}</h1><p class="lede">${esc(c.desc)}</p></div>
      ${list.length ? list.map(e => entryCard(e, false)).join('')
        : '<p class="empty">这一类还没有条目。</p>'}`;
  }

  /* ── 搜索 ── */
  function renderSearch(kw) {
    const k = kw.trim().toLowerCase();
    if (!k) return renderHome();
    const hs = D.heroes.filter(h => h.name.toLowerCase().includes(k));
    const es = IDX.filter(e =>
      (e.id + e.title + (e.sum || '') + (e.opp || '')).toLowerCase().includes(k));

    view.innerHTML = `
      <div class="hero-head"><p class="eyebrow">搜索</p>
        <h1>“${esc(kw.trim())}”</h1>
        <p class="lede">${es.length} 条结论${hs.length ? ` · ${hs.length} 个英雄` : ''}</p></div>
      ${hs.length ? `<section class="sec"><div class="sec-h"><h2>英雄</h2></div>
        <div class="grid">${hs.map(heroCard).join('')}</div></section>` : ''}
      ${es.length ? `<section class="sec"><div class="sec-h"><h2>结论</h2></div>
        ${es.map(e => entryCard(e, true)).join('')}</section>`
        : '<p class="empty">没有命中。换个词试试，比如英雄名或「对线」。</p>'}`;
  }

  /* ── 对位总表：129 个英雄一张表 ── */
  function renderMatrix() {
    const LANES = [['solo', '对抗路'], ['jungle', '打野'], ['mid', '中路'],
                   ['adc', '发育路'], ['roam', '游走']];
    const chip = (n, cls) => `<a class="oppchip ${cls || ''}" href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`;
    const rowsOf = list => list.map(h => {
      const b = h.beats.length ? h.beats.map(n => chip(n, 'win')).join('') : '<i class="dim">—</i>';
      const l = (h.loses_all || []).length ? h.loses_all.map(n => chip(n, 'lose')).join('') : '<i class="dim">—</i>';
      return `<div class="mtx-row">
        <a class="mtx-h" href="#H:${encodeURIComponent(h.name)}">${esc(h.name)}</a>
        <div class="mtx-cell"><span class="mtx-lab win">他压制的</span>${b}</div>
        <div class="mtx-cell"><span class="mtx-lab lose">压制他的</span>${l}</div>
      </div>`;
    }).join('');

    const head = `<div class="mtx-row mtx-head">
        <span>英雄</span><span>他压制的</span><span>压制他的</span>
      </div>`;

    const blocks = LANES.map(([k, cn]) => {
      const list = D.heroes.filter(h => h.main_lane === k)
        .sort((a, b) => b.beats_n - a.beats_n || a.name.localeCompare(b.name, 'zh'));
      if (!list.length) return '';
      return `<section class="sec">
        <div class="sec-h"><h2>${cn}</h2><span>${list.length} 个</span></div>
        <div class="mtx">${head}${rowsOf(list)}</div>
      </section>`;
    }).join('');

    const noLane = D.heroes.filter(h => !LANES.some(([k]) => h.main_lane === k));
    const rest = noLane.length
      ? `<section class="sec"><div class="sec-h"><h2>分路未定</h2><span>${noLane.length} 个</span></div>
         <div class="mtx">${head}${rowsOf(noLane)}</div></section>` : '';

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hero-head">
        <p class="eyebrow">全英雄池</p>
        <h1>对位总表</h1>
        <p class="lede">名字全部可点。这一版是<b>官方口径（L0）</b>：
          官方每个英雄只给两个方向各 2~6 个例子，不是全量配对，也没给成立条件。
          要「在什么分段、什么出装下成立」，看英雄页里的 K-B 实测条目。</p>
      </div>
      ${duelHas() ? `<section class="sec">
        <div class="sec-h"><h2>同路五档矩阵</h2><span>只判同路，五档 + 证据三态</span></div>
        <div class="row">${Object.keys(D.duel).map(k => {
          const g = D.duel[k], cov = g.coverage || {};
          return `<a class="gcard" href="#duel:${encodeURIComponent(k)}">
            <span class="gicon">⇄</span>
            <span class="gtxt"><b>${esc(g.cn || k)} · ${g.heroes.length} 英雄</b>
              <span>${cov.measured || 0} 实测 / ${cov.total || 0} 格</span></span>
          </a>`;
        }).join('')}</div>
      </section>` : ''}
      ${blocks}${rest}
    `;
  }

  /* ══════════════════════════════════════════════════════════
     同路五档对位矩阵（30_index/duel/{lane}.grid.json）
     档位：克 / 小优 / 五五开 / 小劣 / 被克
     状态：measured 有人真讲过 · derived 有档位没实测 · empty 待补
     数据是位置数组，每格 6 个数字，见 build_site.duel_payload
     ══════════════════════════════════════════════════════════ */
  const DUEL_G = ['克', '小优', '五五开', '小劣', '被克'];
  const DUEL_SHORT = ['克', '优', '平', '劣', '被'];
  const DUEL_S_CN = ['待补', '推演', '实测'];
  const DUEL_LAYER = ['机制', '数值'];
  const DUEL_CONF = ['', '低', '中', '高'];
  const DUEL_BASIS = { column: '专栏', video: '视频',
                       official: '官方口径', mechanism: '机制推演' };
  const duelMode = {};
  let curDuel = '';

  const duelHas = () => !!(D.duel && Object.keys(D.duel).length);

  function duelCell(g, ia, ib) {
    const o = (ia * g.heroes.length + ib) * 6;
    return { grade: g.flat[o], status: g.flat[o + 1], conf: g.flat[o + 2],
             layer: g.flat[o + 3], ev: g.flat[o + 4], mirror: g.flat[o + 5] };
  }

  /* 某个英雄在这一路的所有对位 → 五个档位分桶 + 三态计数 */
  function duelBuckets(g, name) {
    const out = [[], [], [], [], []];
    const st = { empty: 0, derived: 0, measured: 0 };
    const ia = g.heroes.indexOf(name);
    if (ia < 0) return { out, st, n: 0 };
    g.heroes.forEach((b, ib) => {
      if (b === name) return;
      const c = duelCell(g, ia, ib);
      st[['empty', 'derived', 'measured'][c.status] || 'empty']++;
      if (c.grade >= 0) out[c.grade].push(b);
    });
    return { out, st, n: g.heroes.length - 1 };
  }

  /* ── 名单视图：一个英雄一行 ── */
  function duelRow(g, name, lane) {
    const b = duelBuckets(g, name);
    const h = heroOf(name);
    const groups = b.out.map((list, gi) => list.length
      ? `<span class="dgrp"><i class="dgk g${gi}">${DUEL_G[gi]}</i>${list.map(n =>
          `<button class="dchip g${gi}" data-lane="${esc(lane)}" data-a="${esc(name)}"
             data-b="${esc(n)}">${esc(n)}</button>`).join('')}</span>`
      : '').filter(Boolean).join('');
    const stat = [
      b.st.measured ? `<b class="dok">实测 ${b.st.measured}</b>` : '',
      b.st.derived ? `<b class="dder">推演 ${b.st.derived}</b>` : '',
      `<b class="demp">待补 ${b.st.empty}</b>`,
    ].join('');
    return `<div class="drow">
      <a class="drow-h" href="#H:${encodeURIComponent(name)}">
        <span class="avatar" style="--h:${h ? h.hue : 0}">${esc(name.slice(0, 1))}</span>
        <span class="drow-n">${esc(name)}</span>
      </a>
      <div class="drow-b">${groups || `<i class="dim">${b.n} 个对位全部待补</i>`}</div>
      <span class="drow-s">${stat}</span>
    </div>`;
  }

  /* ── 网格视图：24 × 24 ── */
  function duelGrid(g, lane) {
    const H = g.heroes;
    const head = `<tr><th class="dgx"></th>${H.map((b, i) =>
      `<th><span>${esc(b)}</span></th>`).join('')}</tr>`;
    const body = H.map((a, ia) => `<tr><th class="dgy">${esc(a)}</th>${H.map((b, ib) => {
      if (a === b) return '<td class="dself"></td>';
      const c = duelCell(g, ia, ib);
      const cls = c.grade >= 0 ? `g${c.grade} s${c.status}` : 'gx';
      const tip = `${a} vs ${b}` + (c.grade >= 0
        ? ` · ${DUEL_G[c.grade]} · ${DUEL_S_CN[c.status]}` : ' · 待补');
      return `<td><button class="dcell ${cls}" title="${esc(tip)}"
        data-lane="${esc(lane)}" data-a="${esc(a)}" data-b="${esc(b)}"
        aria-label="${esc(tip)}">${c.grade >= 0 ? DUEL_SHORT[c.grade] : ''}</button></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="dgwrap"><table class="dgrid">
      <thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  /* ── 详情弹层 ── */
  const mmss = s => {
    const v = Math.max(0, Math.round(Number(s) || 0));
    return `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`;
  };

  function openDuel(lane, a, b) {
    const g = (D.duel || {})[lane];
    if (!g) return;
    const ia = g.heroes.indexOf(a), ib = g.heroes.indexOf(b);
    if (ia < 0 || ib < 0) return;
    const c = duelCell(g, ia, ib);
    const d = (g.detail || {})[`${a}|${b}`] || null;

    const grade = c.grade >= 0
      ? `<span class="dgrade g${c.grade}">${DUEL_G[c.grade]}</span>`
      : `<span class="dgrade gx">待补</span>`;
    const pills = [
      `<span class="dpill s${c.status}">${DUEL_S_CN[c.status] || '待补'}</span>`,
      c.layer >= 0 ? `<span class="dpill">${DUEL_LAYER[c.layer]}差距</span>` : '',
      c.conf ? `<span class="dpill">可信度 ${DUEL_CONF[c.conf]}</span>` : '',
      c.ev ? `<span class="dpill">${c.ev} 条证据</span>` : '',
      d && d.basis ? `<span class="dpill">依据 ${esc(DUEL_BASIS[d.basis] || d.basis)}</span>` : '',
    ].filter(Boolean).join('');

    let note = '';
    if (c.status === 0) {
      note = `<p class="dnote">这一格还没有来源。官方关系页每边只列 2 个例子，
        同路对位覆盖率不到 5%，所以大部分格是空的——不猜、不凑。</p>`;
    } else if (c.status === 1) {
      note = `<p class="dnote">${d && d.basis === 'official'
        ? '官方口径只给了方向，没给强度和成立条件。这里按最保守的一档暂记，等实测覆盖。'
        : '按机制推的，没有视频或专栏实测过。可作参考，别当结论。'}</p>`;
    }
    if (c.mirror) {
      note += `<p class="dnote">这一格是反对偶：由「${esc(b)} vs ${esc(a)}」的结论取反得来，
        打法细节在对面那条里。</p>`;
    }

    const EV_KIND = { video: '视频', column: '专栏', official: '官方关系页' };
    const evList = (d && d.ev && d.ev.length)
      ? d.ev.map(e => {
          const tag = EV_KIND[e.k] || '出处';
          const when = (e.k === 'video' || e.k === 'column') && e.ts != null
            ? ` @ ${mmss(e.ts)}` : '';
          // 官方口径的 ref 是站点内部的文件名，对人没意义，只留可点的官方页面
          const tail = e.k === 'official' || !e.ref ? '' : ' · ' + esc(e.ref);
          const src = e.url
            ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(tag)}${tail}${when}</a>`
            : `<span class="devsrc">${esc(tag)}${tail}</span>`;
          return `<li>${src}${e.q ? `<q>${esc(e.q)}</q>` : ''}</li>`;
        }).join('')
      : '';

    const sec = (t, v) => v ? `<section class="dsec"><h4>${t}</h4><p>${esc(v)}</p></section>` : '';
    const body = `
      <div class="dhead">
        <div class="dvs">
          <a href="#H:${encodeURIComponent(a)}">${esc(a)}</a>
          <em>vs</em>
          <a href="#H:${encodeURIComponent(b)}">${esc(b)}</a>
        </div>
        <button class="dclose" aria-label="关闭">×</button>
      </div>
      <div class="dbadges">${grade}${pills}</div>
      ${d && d.cond ? `<p class="dcond">成立条件 · ${esc(d.cond)}</p>` : ''}
      ${sec('怎么打', d && d.how)}
      ${sec('他的破绽', d && d.counter)}
      ${evList ? `<section class="dsec"><h4>出处</h4><ul class="dev">${evList}</ul></section>` : ''}
      ${note}
      <p class="dfoot">${esc(g.cn || '')} · 对位矩阵</p>`;

    const el = duelModal();
    el.querySelector('.dbox').innerHTML = body;
    el.classList.add('on');
    document.body.style.overflow = 'hidden';
    el.querySelector('.dclose').addEventListener('click', closeDuel);
  }

  function duelModal() {
    let el = document.getElementById('dmodal');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'dmodal';
    el.className = 'dmodal';
    el.innerHTML = '<div class="dmask"></div><div class="dbox" role="dialog" aria-modal="true"></div>';
    el.querySelector('.dmask').addEventListener('click', closeDuel);
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && el.classList.contains('on')) closeDuel();
    });
    document.body.appendChild(el);
    return el;
  }

  function closeDuel() {
    const el = document.getElementById('dmodal');
    if (el) el.classList.remove('on');
    document.body.style.overflow = '';
  }

  /* 事件委托：所有 dchip / dcell 都走这一个入口 */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('.dchip, .dcell');
    if (!t) return;
    ev.preventDefault();
    openDuel(t.dataset.lane, t.dataset.a, t.dataset.b);
  });

  /* ── 对位矩阵页 ── */
  function renderDuel(lane, mode) {
    const g = (D.duel || {})[lane];
    if (!g) return renderHome();
    curDuel = lane;
    const m = mode || duelMode[lane] || 'list';
    duelMode[lane] = m;

    const cov = g.coverage || {};
    const tot = cov.total || g.heroes.length * (g.heroes.length - 1);
    const pct = x => (x || 0) / tot * 100;
    const otherLanes = Object.keys(D.duel || {}).filter(k => k !== lane);

    const legend = `<div class="dlegend">
      <span class="dlegend-t">档位</span>
      ${DUEL_G.map((n, i) => `<span class="dgrade g${i}">${n}</span>`).join('')}
      <span class="dlegend-t">状态</span>
      <span class="dpill s2">实测</span>
      <span class="dpill s1">推演</span>
      <span class="dpill s0">待补</span>
    </div>`;

    const listBody = m === 'list'
      ? `<div class="dlist">${g.heroes.map(n => duelRow(g, n, lane)).join('')}</div>`
      : duelGrid(g, lane);

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hero-head">
        <p class="eyebrow">${esc(g.version || D.version)} · 同路对位</p>
        <h1>${esc(g.cn || lane)} · ${g.heroes.length} × ${g.heroes.length - 1} 全矩阵</h1>
        <p class="lede">这一路<b>所有</b>英雄两两配对，谁克谁一格一格摆出来。
          五档是判断，三态是证据强弱：<b>实测</b>有人真讲过并留了秒数，<b>推演</b>只有方向没有验证，
          <b>待补</b>就是还没人讲。点任意一格看依据、成立条件和出处。</p>
      </div>

      <section class="sec">
        <div class="dbar">
          <div class="dbar-n">
            <b>${cov.measured || 0}</b><span>实测</span>
          </div>
          <div class="dbar-n">
            <b>${cov.derived || 0}</b><span>推演</span>
          </div>
          <div class="dbar-n">
            <b>${cov.empty || 0}</b><span>待补</span>
          </div>
          <div class="dbar-b">
            <i class="dbar-m" style="width:${pct(cov.measured)}%"></i>
            <i class="dbar-d" style="width:${pct(cov.derived)}%"></i>
          </div>
          <div class="dbar-p">实测覆盖 ${pct(cov.measured).toFixed(1)}%</div>
        </div>
        ${legend}
        <div class="dswitch">
          <button class="dtab${m === 'list' ? ' on' : ''}" data-mode="list">名单</button>
          <button class="dtab${m === 'grid' ? ' on' : ''}" data-mode="grid">网格</button>
          <a class="dtab" href="#matrix">全英雄对位总表 →</a>
          ${otherLanes.map(k => `<a class="dtab" href="#duel:${encodeURIComponent(k)}">${esc(D.duel[k].cn || k)}</a>`).join('')}
        </div>
      </section>

      <section class="sec">${listBody}</section>

      <p class="dnofoot">为什么这么多格是空的：官方关系页每个方向固定只列 2 个例子，
        而且 77% 是跨路对位；同路对位要靠视频字幕与专栏逐条挖，通过率不高。
        补齐进度记在 <a href="#doc:96_素材缺口.md">素材缺口</a>里。</p>
    `;
    view.querySelectorAll('.dtab[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => renderDuel(lane, btn.dataset.mode));
    });
  }

  /* ── 英雄页上的对位块 ── */
  function duelBox(name) {
    if (!duelHas()) return '';
    const lanes = Object.keys(D.duel).filter(k => D.duel[k].heroes.includes(name));
    if (!lanes.length) return '';
    const lane = lanes[0];
    const g = D.duel[lane];
    const b = duelBuckets(g, name);
    const rows = b.out.map((list, gi) => list.length
      ? `<div class="opprow">
           <span class="oppk g${gi}">${DUEL_G[gi]}</span>
           <span class="oppv">${list.map(n =>
             `<button class="dchip g${gi}" data-lane="${esc(lane)}" data-a="${esc(name)}"
                data-b="${esc(n)}">${esc(n)}</button>`).join('')}</span>
         </div>`
      : '').join('');
    return `<section class="sec"><div class="sec-h"><h2>同路对位（${esc(g.cn || lane)}）</h2>
        <span>实测 ${b.st.measured} · 推演 ${b.st.derived} · 待补 ${b.st.empty}</span></div>
      ${rows ? `<div class="oppbox">${rows}</div>`
             : `<p class="lede">这一路 ${b.n} 个对位全部待补。</p>`}
      <p class="lede"><a href="#duel:${encodeURIComponent(lane)}">看${esc(g.cn || lane)}全矩阵 →</a></p>
    </section>`;
  }

  /* ── 路由 ── */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    qEl.value = '';
    if (!h) return renderHome();
    if (h === 'matrix') return renderMatrix();
    if (h.startsWith('duel:')) return renderDuel(h.slice(5));
    if (h.startsWith('H:')) return renderHero(h.slice(2));
    if (h.startsWith('lane:')) return renderLane(h.slice(5));
    if (h.startsWith('doc:')) return renderDoc(h.slice(4));
    if (h.startsWith('cat:')) return renderCat(h.slice(4));
    const e = byId(h);
    if (e) {
      if (e.kind.startsWith('H:')) renderHero(e.kind.slice(2));
      else if (e.kind.startsWith('lane:')) renderLane(e.kind.slice(5));
      else renderDoc(e.kind.slice(4));
      requestAnimationFrame(() => {
        const el = document.getElementById(h);
        if (el) {
          el.open = true;
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.querySelector('summary').style.background = 'var(--bg3)';
          setTimeout(() => { el.querySelector('summary').style.background = ''; }, 1600);
        }
      });
      return;
    }
    renderHome();
  }

  /* ── 搜索交互 ── */
  let t = null;
  qEl.addEventListener('input', () => {
    clearTimeout(t);
    const v = qEl.value;
    t = setTimeout(() => {
      if (v.trim()) renderSearch(v);
      else if (!location.hash) renderHome();
    }, 140);
  });
  qEl.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { qEl.value = ''; route(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== qEl) {
      ev.preventDefault(); qEl.focus();
    }
  });

  /* ── 主题 ── */
  const saved = localStorage.getItem('kog-theme');
  if (saved) root.dataset.theme = saved;
  document.getElementById('theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    localStorage.setItem('kog-theme', next);
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
