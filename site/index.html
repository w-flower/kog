<li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：顺风局想扩大优势<\/li><li><strong>判断依据<\/strong>：进攻时站位应以<strong>保命为主<\/strong>，不是为输出贴近<\/li><li><strong>决策分支<\/strong>：<\/li><li>人不齐 → 不进野区（@ 08:28~08:32）<\/li><li>进野区 → 一旦掉点，逆风追赶机制一把追回 3500 经济（@ 08:53~08:59）<\/li><li><strong>反例<\/strong>：「顺风进野区收割」——\"顺风最忌讳的翻盘点就是人不齐无脑进野区\"（@ 08:28~08:34）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 08:09~08:59<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：顺风局想扩大优势判断依据：进攻时站位应以保命为主，不是为输出贴近决策分支：人不齐 → 不进野区（@ 08:28~08:32）进野区 → 一旦掉点，逆风追赶机制一把追回…"}, {"id": "K-D38", "cat": "D", "title": "逆风射手：防守吃线等机会，95% 情况不找节奏", "self": "<h3><a class=\"kref\" href=\"#K-D38\">K-D38<\/a> 逆风射手：防守吃线等机会，95% 情况不找节奏<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方逆风，射手想打开局面<\/li><li><strong>判断依据<\/strong>：逆风对射手\"就一句话：防守吃线之中等一个机会\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>正常情况下（95%）→ 不需要射手去找节奏，找了就是被平推（@ 09:20~09:23）<\/li><li>例外：意识远大于当前分段（阿离\"自由人\"降维打法）→ 同分段几乎不可复制（@ 09:29~09:54）<\/li><li><strong>反例<\/strong>：「逆风让射手出去开节奏」——除非意识碾压，否则就是送（@ 09:21~09:23）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 09:11~09:54<\/li><li><strong>可信度<\/strong>：高（\"95%\"是经验比例，非精确数据）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方逆风，射手想打开局面判断依据：逆风对射手\"就一句话：防守吃线之中等一个机会\"决策分支：正常情况下（95%）→ 不需要射手去找节奏，找了就是被平推（@ 09:20~…"}, {"id": "K-D39", "cat": "D", "title": "后期团战核心是射手；开团位置选塔前，掩护撤退先找绕后位", "self": "<h3><a class=\"kref\" href=\"#K-D39\">K-D39<\/a> 后期团战核心是射手；开团位置选塔前，掩护撤退先找绕后位<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟后的团战站位<\/li><li><strong>判断依据<\/strong>：后期绝对核心是射手；射手利用地形（自家一塔在）被冲脸可闪现进野区跑，对方难追<\/li><li><strong>决策分支<\/strong>：<\/li><li>开团位置选<strong>塔前<\/strong>，不是野区（@ 11:56~12:00）<\/li><li>掩护队友撤退第一步 → 先找出对方<strong>绕后位<\/strong>（@ 10:28~10:32）<\/li><li>提前支援把团战锁在对方二塔附近 → 容易被绕后偷（@ 10:24~10:46）<\/li><li><strong>反例<\/strong>：「一遇团战就结，打两下就想跑」——输出高但死亡率也高，没资格谈输赢（@ 11:02~11:09）<\/li><li><strong>为什么重要<\/strong>：没前排或前排前压时你没跟伤害 → 团战难输出（@ 13:05~13:19）；射手没前排也能用超远射程消耗（@ 13:30~13:35）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 10:24~10:46、11:29~12:00、13:02~13:35<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：10 分钟后的团战站位判断依据：后期绝对核心是射手；"}, {"id": "K-D40", "cat": "D", "title": "10 分钟后团战为推塔拿水晶，不为发育", "self": "<h3><a class=\"kref\" href=\"#K-D40\">K-D40<\/a> 10 分钟后团战为推塔拿水晶，不为发育<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟之后的每一波团战<\/li><li><strong>判断依据<\/strong>：10 分钟前团战争经济；10 分钟后团战\"完全有能力一两波结束对方\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>这阶段团战目标 = 推塔/拿水晶，不是发育（@ 11:11~11:27）<\/li><li>想通这点 → 终结比赛能力直线提升（@ 11:26~11:27）<\/li><li><strong>反例<\/strong>：「后期还在贪发育」——10 分钟后团战价值已变，继续发育=浪费窗口<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 11:11~11:27<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>这一节和其他节的关系<\/h2>\n<div class=\"tw\"><table><thead><tr><th>上游<\/th><th>关系<\/th><\/tr><\/thead><tbody><tr><td><code>04_对线期.md<\/code><\/td><td>开局对线纪律（卡线、看中辅）从这里接<\/td><\/tr><tr><td><code>05_资源点与推进.md<\/code><\/td><td>本节的\"推进\"是把 05 的资源点转成压制/拆塔，视角换成发育路<\/td><\/tr><tr><td><code>06_中期.md<\/code><\/td><td>4–10 分钟的节点（<a class=\"kref\" href=\"#K-D25\">K-D25<\/a>~D28）与本节的 7 分钟前/转线判定互补<\/td><\/tr><tr><td><code>L_分路/03_发育路.md<\/code><\/td><td>本节的发育路专属判断，落到分路框架里<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>待补<\/h2>\n<ul><li>具体出装/铭文节点（视频只讲运营，未给完整出装）<\/li><li>与 <code>03_发育路.md<\/code> 的对线细节做交叉引用<\/li><li>其他分路（对抗/打野/中路）是否有同结构的\"推进公式\"可对照<\/li><\/ul>", "sum": "适用版本：S45触发条件：10 分钟之后的每一波团战判断依据：10 分钟前团战争经济；"}]}, {"key": "D", "cat": "对局内", "title": "07 团战", "file": "07_团战.md", "intro": "<blockquote><p>素材说明：四份素材，四个位置、四个分段，互相不能替代。 <strong>打野视角<\/strong>：浅梦《打野教科书》（BV1oRJYzpEYb），12 位 KPL 职业打野第一视角，教练口播拆解，全篇按\"前 2 分钟→前 4 分钟→龙团→野区入侵→兵线运营→高地推进\"推进，团战部分集中在 26:33 之后。 <strong>射手视角 A<\/strong>：小居王者丶（BV1X2jV6KEiP），巅峰万强实战解析，讲的是\"射手如何去偷国服射手的推进思维\"，团战段的落点是站位与进场。 <strong>中路视角<\/strong>：王者荣耀听说《昭君细节对线思路》（BV1uu4y197Sr），2100 中等分段，主体是对线与转线，团战段只在压塔那一段集中讲了 09:07~09:31。 <strong>射手视角 B<\/strong>：赵伽蒙《伽罗前中后期思路》（BV1ssxz6SEGo），1900 分学员对局复盘，团战段是逐帧挑错，反例密度最高。 本节只回答一件事：<strong>这一波团我该站在哪、什么时候进、进了打谁<\/strong>。 需要提前说明的是：<strong>\"打谁\"这一问，四份素材合起来也只给了打野一侧的答案（跨前排摸后排），射手和中路都没有给出正面集火的优先级<\/strong>，这一块进「待补」，不注水。 上游接 <code>06<\/code>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：先数人——己方已经倒了两个及以上，这波团就不是团，是送 → K-D88\n第 2 步：人齐了，先认自己站哪个位置：打野找夹位／射手等前排缠斗／中单找射手侧后 → K-D79、K-D84、K-D89\n第 3 步：打野——夹位从\"敌方分几个人去守哪座塔\"反推，推不出夹位这波不该由你开 → K-D80\n第 4 步：射手——判断这是缠斗还是追击，追击不跟；要跟就卡在队友开团那一刻第二时间进 → K-D84、K-D85\n第 5 步：射手已经进团——落点以保命为第一，不以接近输出为第一，站自家塔侧 → K-D86\n第 6 步：10 分钟以后——开团点锁死在塔前，不追进野区；要退就跟队友走同一个角度 → K-D87\n第 7 步：中单——站侧面，不和射手同点，位置要能随时盖到射手 → K-D89\n第 8 步：团战前置是视野——压塔前先站住中路视野点，蹲人等到对面辅助探草那一瞬间 → K-D90\n第 9 步：龙团单独一套——4 分钟先判兵线权再定战场，10 分钟判正面强弱决定接还是换 → K-D81、K-D82\n第 10 步：高地团——打野护线优先于切入，推进优先选边高 → K-D83<\/code><\/pre>", "entries": [{"id": "K-D79", "cat": "D", "title": "野核\"什么时候进\"取决于有没有夹位，不取决于团开没开（打野视角）", "self": "<h3><a class=\"kref\" href=\"#K-D79\">K-D79<\/a> 野核\"什么时候进\"取决于有没有夹位，不取决于团开没开（打野视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中后期野核英雄要参与正面团，队已经在往一起靠<\/li><li><strong>判断依据<\/strong>：素材原话「野核英雄一旦到了中后期，团战切入思路就是找夹击位」（@ 26:37~26:41）；夹位的定义是「跨过前排，直接摸对方的后排」（@ 26:45~26:47）；结论句是「团战能不能打，就看负责切 C 的位置能不能找到一个很好的夹位」（@ 26:49~26:52）。这条思路成熟之后「野核就可以稳定 C 中后期」（@ 27:26~27:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有夹位 → 进，从侧后接敌方后排，不从正面挤<\/li><li>没有夹位 → 这一波不作为自己的开团点，只做正面牵扯；素材只说了\"能不能打看夹位\"，\"找不到就不开\"是据此推的一支，可信度按中处理<\/li><li><strong>反例<\/strong>：从正面跨前排。素材特意说明夹位的价值就是\"跨过前排\"（@ 26:45~26:47），反过来说正面是过不去的<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 26:37~26:52、27:26~27:29<\/li><li><strong>可信度<\/strong>：中（\"夹位决定能不能打\"是原话；\"没有夹位就不开\"这一步推理没有原话支撑）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：中后期野核英雄要参与正面团，队已经在往一起靠判断依据：素材原话「野核英雄一旦到了中后期，团战切入思路就是找夹击位」（@ 26:37~26:41）；"}, {"id": "K-D80", "cat": "D", "title": "夹位从\"敌方分几个人去守哪座塔\"反推，敌方堆人的一侧不是夹口（打野视角）", "self": "<h3><a class=\"kref\" href=\"#K-D80\">K-D80<\/a> 夹位从\"敌方分几个人去守哪座塔\"反推，敌方堆人的一侧不是夹口（打野视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想给野核找夹位，但地图上没有现成的侧翼口<\/li><li><strong>判断依据<\/strong>：素材给了敌方两种应对和各自对应的夹位。敌方\"多人防守下二塔\"，澜就和队友「把中线顶出去，推中一」（@ 27:01~27:06）；敌方\"正常应对，中路放更多人来顶中下二，放一到两人协防\"，「这一波的夹位自然就是中路」，可以和队友形成包夹，敌方出来顶走队友后腹背受敌，夹位让澜「第一时间摸敌方的后排」（@ 27:08~27:24）<\/li><li><strong>决策分支<\/strong>：<\/li><li>敌方堆人去守某座二塔 → 那一侧不是夹口，改从中路正面顶出去<\/li><li>敌方把中路堵满、边塔只留一到两人 → 中路就是夹口，等队友把对方顶出来再摸后排<\/li><li><strong>反例<\/strong>：不看敌方分布、固定从同一侧绕后。素材两段案例里，夹位随敌方人数分布变化而变（@ 27:04~27:24），固定一侧就等于把夹位让给对方<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 26:54~27:24<\/li><li><strong>可信度<\/strong>：中（两个分支都是原话，\"反推\"这个提炼动作是把两段案例并起来读的）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：想给野核找夹位，但地图上没有现成的侧翼口判断依据：素材给了敌方两种应对和各自对应的夹位。"}, {"id": "K-D81", "cat": "D", "title": "4 分钟龙团先判兵线权，再决定战场立在中轴还是发育路（打野视角）", "self": "<h3><a class=\"kref\" href=\"#K-D81\">K-D81<\/a> 4 分钟龙团先判兵线权，再决定战场立在中轴还是发育路（打野视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：3 分 48 前后兵线对接，4 分钟暴君即将刷<\/li><li><strong>判断依据<\/strong>：龙团前的布置「在于兵线权」（@ 16:28~16:30）；中线和发育路线都清完，「中路和发育路的人会来的比对方更快」，就直接秒龙（@ 16:40~16:49）；只有一条有线权的情况，素材拆成两支：中优发育劣「就要开始部署，立足于中轴的龙团战场，草丛易守难攻」（@ 16:53~16:59）；中劣发育优则「龙头就是往发育路的方向拉」，用发育路河道的草丛（@ 17:52~17:56）<\/li><li><strong>决策分支<\/strong>：<\/li><li>中线 + 发育路线权都有 → 直接秒龙<\/li><li>中优发育劣 → 战场立中轴，队友把中轴那几个草站住，\"不让对方进来\"，靠过来抢龙就被打状态（@ 16:59~17:05）<\/li><li>中劣发育优 → 战场立发育路河道一侧<\/li><li><strong>反例<\/strong>：不判兵线权就开龙。素材在 10 分钟那波给了同逻辑的失败案例：澜先想过中线做优、被火舞打掉状态，接着 Buff 和龙同时出现，只能二选一（@ 19:23~19:44）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 16:24~17:05、17:52~17:56、19:23~19:44<\/li><li><strong>可信度<\/strong>：高（判据、分支、失败案例三者齐全）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：3 分 48 前后兵线对接，4 分钟暴君即将刷判断依据：龙团前的布置「在于兵线权」（@ 16:28~16:30）；"}, {"id": "K-D82", "cat": "D", "title": "10 分钟龙团：正面打得过就既赚龙也赚线，打不过就顶中线换龙，双边都劣就龙坑拉扯（打野视角）", "self": "<h3><a class=\"kref\" href=\"#K-D82\">K-D82<\/a> 10 分钟龙团：正面打得过就既赚龙也赚线，打不过就顶中线换龙，双边都劣就龙坑拉扯（打野视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：9 分半到 10 分钟，远端线和近端线要有人带出去，龙要开<\/li><li><strong>判断依据<\/strong>：顺风做法是 9 分半后打野落位在远端线，提前清掉 10 分钟前的兵线，敌方分人来管这波远端劣势线，「就可以直接开黑暗暴君，敌方人少来不及打龙团」（@ 29:16~29:32）。逆风做法看双边兵线：「单边劣可以接龙团，打正面对抗」，「双边劣就要做龙坑拉扯了」（@ 29:37~29:52）。总原则是「前置要优暴君的远端线，敌方接线我方打暴君；敌方全员打暴君，正面打得过既赚暴君也赚兵线，正面打不过顶，中线利用兵线优势做换龙」（@ 30:47~31:01）<\/li><li><strong>决策分支<\/strong>：<\/li><li>远端线带出去、敌方分人来管 → 直接开龙<\/li><li>敌方全员来打龙、正面打得过 → 接，既赚龙也赚线<\/li><li>敌方全员来打龙、正面打不过 → 不接，顶中线换龙<\/li><li>双边都劣 → 龙坑拉扯，等兵线缓和（@ 29:48~29:56）<\/li><li><strong>反例<\/strong>：10 分钟前掉点。素材原话「路人局 10 分钟前掉点，是不是都掉在野区或者中路，因为都是无头苍蝇，不知道现在优先干什么」（@ 29:29~29:35）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 29:07~31:01<\/li><li><strong>可信度<\/strong>：高（判断链完整，正反两面都有）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：9 分半到 10 分钟，远端线和近端线要有人带出去，龙要开判断依据：顺风做法是 9 分半后打野落位在远端线，提前清掉 10 分钟前的兵线，敌方分人来管这波远端劣势线，…"}, {"id": "K-D83", "cat": "D", "title": "高地团打野只有\"切入\"和\"护线\"两个出发点，线有被摸的风险就护线优先；推进优先选边高（打野视角）", "self": "<h3><a class=\"kref\" href=\"#K-D83\">K-D83<\/a> 高地团打野只有\"切入\"和\"护线\"两个出发点，线有被摸的风险就护线优先；推进优先选边高（打野视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：两路推进线已经推到高地，打野要决定这波是绕后切人还是留在正面<\/li><li><strong>判断依据<\/strong>：素材原话「一旦有两路推进线，对于打野来说就只有两个出发点：切入以及护线」（@ 31:45~31:48）。案例里「墨子在后方卡位不好做切入，狂铁身位想顶前摸线，切入难度高；哪怕成功切了后排，而线被狂铁顶掉了，推进依旧是失败的」（@ 31:50~32:00），所以「这一手一定是护线优先」（@ 32:00~32:03），做法是「在兵线进塔前防止狂铁摸线，大招逼退狂铁」（@ 32:03~32:08）。选推进目标时「优先推边高，因为边路高地推进是最安全高效的」，原因是推中高会被两面夹击、五人阵型会散（@ 31:23~31:30）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对方前排能顶到兵线 → 护线，大招/控制逼退摸线的人<\/li><li>对方摸不到线、后排又露出夹位 → 才轮到切入<\/li><li>选推哪一路 → 边高优先于中高<\/li><li><strong>反例<\/strong>：只想着切后排。「敌方是后裔，大部分打野玩家想的都会是我要切后排」（@ 31:39~31:45），素材说这波切了也白切，线一被顶掉推进就失败（@ 31:56~32:00）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 31:23~32:25<\/li><li><strong>可信度<\/strong>：高（护线优先有完整因果链：切人成功但线丢了仍等于推进失败）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：两路推进线已经推到高地，打野要决定这波是绕后切人还是留在正面判断依据：素材原话「一旦有两路推进线，对于打野来说就只有两个出发点：切入以及护线」（@ 31:45~31:…"}, {"id": "K-D84", "cat": "D", "title": "射手只在双方前排/开团手还在缠斗的团里有输出空间，变成追击战就不跟（射手视角）", "self": "<h3><a class=\"kref\" href=\"#K-D84\">K-D84<\/a> 射手只在双方前排/开团手还在缠斗的团里有输出空间，变成追击战就不跟（射手视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：队友已经在打，要决定这一波跟不跟<\/li><li><strong>判断依据<\/strong>：素材先给现象「自家是在追着对方打，既然是追击，那就意味着对方在往回跑，以你的追击能力是不可能追得上的」（@ 07:26~07:32）；再给原因「双方的开团手已经全部倒地」（@ 07:34~07:39）；结论是「只有双方的前排或者开团手在缠斗的团战，射手才有输出空间，而不是你追我打的一个追逐战」（@ 07:41~07:45）。机制层理由是「射手的机动性是跟他的保命技能挂钩的，你想快速追上对手，就必须用掉保命技能，一个没有保命技能的射手去追人，和送人头又有什么区别」（@ 07:53~08:02）<\/li><li><strong>决策分支<\/strong>：<\/li><li>双方前排还在缠斗 → 跟，正面输出<\/li><li>已经变成单方面追击 → 不跟，回头吃线或刷野<\/li><li><strong>反例<\/strong>：追着残血跑。素材原话「如果你的射手老是喜欢追人，那说明你的死亡率一定极高」（@ 07:47~07:51）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 07:16~08:02<\/li><li><strong>可信度<\/strong>：高（判据 + 机制 + 反例齐全）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：队友已经在打，要决定这一波跟不跟判断依据：素材先给现象「自家是在追着对方打，既然是追击，那就意味着对方在往回跑，以你的追击能力是不可能追得上的」（@ 07:26~07…"}, {"id": "K-D85", "cat": "D", "title": "射手的进场时机是\"第二时间\"，卡在队友开团那一刻；进之前先找对方绕后位（射手视角）", "self": "<h3><a class=\"kref\" href=\"#K-D85\">K-D85<\/a> 射手的进场时机是\"第二时间\"，卡在队友开团那一刻；进之前先找对方绕后位（射手视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：团战即将开始，射手还在侧翼或后方<\/li><li><strong>判断依据<\/strong>：素材原话「转线刚好卡在队友开团的时候，第二时间进场」（@ 06:01~06:05）。站位两难说得很清楚：「下路的三个队友是肯定不能卖的，但是进场太早的话，容易被绕后，导致跑不掉」（@ 10:20~10:24）；对应的动作是「想要掩护队友撤退的第一步，就是先找出对方的绕后位」（@ 10:27~10:30）<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友先开 → 第二时间进，进之前先把对方绕后位的位置找出来<\/li><li>对方绕后位还在（素材例：达摩蹲在蓝草）→ 先站自家塔侧，不提前压上去<\/li><li><strong>反例<\/strong>：提前支援。「如果你提前进行支援，把团战的位置锁定在对方的下路二塔附近，你这波一定偷不了」（@ 10:41~10:45）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 06:01~06:05、10:20~10:52<\/li><li><strong>可信度<\/strong>：高（给了\"为什么不能早\"的机制：绕后位）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：团战即将开始，射手还在侧翼或后方判断依据：素材原话「转线刚好卡在队友开团的时候，第二时间进场」（@ 06:01~06:05）。"}, {"id": "K-D86", "cat": "D", "title": "射手落点的第一优先级是保命，不是接近输出；人不齐不进野区（射手视角）", "self": "<h3><a class=\"kref\" href=\"#K-D86\">K-D86<\/a> 射手落点的第一优先级是保命，不是接近输出；人不齐不进野区（射手视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：已经进团，要选具体站位<\/li><li><strong>判断依据<\/strong>：素材自己复盘「我犯了一个顺风射手的大忌，进攻的时候站位竟然不是以保命为主，而是为了能够更好的接近对方去打出输出」（@ 08:17~08:23），代价是被蓝草里的达摩击杀（@ 08:13~08:26）；顺风最大的翻盘点被点成「在人不齐的情况下，无脑进野区」（@ 08:28~08:32）。正面的正解是「自家下路一塔是在的，打起来了被冲脸，直接一个闪现往野区跑，对方是很难追到你的」（@ 10:36~10:40）<\/li><li><strong>决策分支<\/strong>：<\/li><li>自家一塔还在 → 站塔这一侧，被冲脸就往野区闪<\/li><li>人不齐（有人没复活或没到位）→ 不进野区，等<\/li><li>已经决定要打 → 宁可少打一段输出，也不站到能被侧翼摸到的位置<\/li><li><strong>反例<\/strong>：为多打一段输出往前站。素材为此付出了本局最大的一次掉点（@ 08:24~08:32）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 08:13~08:32、10:36~10:40<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：已经进团，要选具体站位判断依据：素材自己复盘「我犯了一个顺风射手的大忌，进攻的时候站位竟然不是以保命为主，而是为了能够更好的接近对方去打出输出」（@ 08:17~08…"}, {"id": "K-D87", "cat": "D", "title": "10 分钟后的开团点只能在塔前、不能在野区；要退就跟队友走同一个角度，不单独走（射手视角，两素材互补）", "self": "<h3><a class=\"kref\" href=\"#K-D87\">K-D87<\/a> 10 分钟后的开团点只能在塔前、不能在野区；要退就跟队友走同一个角度，不单独走（射手视角，两素材互补）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟以后（或后期大龙团前后）要决定在哪接团、打不赢怎么退<\/li><li><strong>判断依据<\/strong>：先定性质——「10 分钟之后所发生的团战是完全有能力一到两波直接结束对方的」「目前这个阶段你的团战是为了推塔、拿对方的水晶，而不是为了获得更高的发育」（@ 11:11~11:26）。所以拿掉对方貂蝉后想继续接团时，「一定要确定好接下来开团的一个位置，一定是塔前，不是野区」（@ 11:53~12:00）。撤退侧由另一份射手素材补上：「正常跟着队友从蓝区那个角度撤了，不说能打赢吧，最起码你能安全撤离；对面要追上头，防御塔也在，还能反打一波」（@ 12:27~12:38）<\/li><li><strong>决策分支<\/strong>：<\/li><li>要接下一波 → 把团拖到自家塔前再开<\/li><li>打不赢要退 → 跟队友走同一个角度（素材例：蓝区），不从另一边单独走<\/li><li>已经有人被留下 → 被留下的是前排（素材例：钟馗）可以考虑接输出，被留下的是打野（素材例：猴子）就直接跑（@ 12:56~13:02）<\/li><li><strong>反例<\/strong>：野区接团 + 单独走。素材对单独走那一句的评价是「真的是太夸张了」「连点脑子都不用」（@ 12:16~12:27）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 11:11~12:00、12:56~13:02；BV1ssxz6SEGo @ 12:16~12:38<\/li><li><strong>可信度<\/strong>：中（\"塔前不开野区\"明确；\"跟队友走同一角度\"只有赵伽蒙一例，且是复盘语境）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：10 分钟以后（或后期大龙团前后）要决定在哪接团、打不赢怎么退判断依据：先定性质——「10 分钟之后所发生的团战是完全有能力一到两波直接结束对方的」「目前这个阶段你的…"}, {"id": "K-D88", "cat": "D", "title": "己方已经倒两个，这波团就不是团——转中清线保中一塔，不在原处死守（射手视角·赵伽蒙）", "self": "<h3><a class=\"kref\" href=\"#K-D88\">K-D88<\/a> 己方已经倒两个，这波团就不是团——转中清线保中一塔，不在原处死守（射手视角·赵伽蒙）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：团战开打前或刚开打，己方已经掉人<\/li><li><strong>判断依据<\/strong>：素材逐帧数人「队友倒了一个……那钟馗当着咱们的面也倒了——现在的中线团战打不了了吗」「队友已经明白倒两个，赶紧去中路准备清中了，不要再来上路这里了」「你三打五，你怎么打」（@ 10:47~11:05）。正解是「如果跟着猴子在中，或者你去到中，猴子刚好在那，我可以跟猴子配合先手清线；或者趁他们在上路打架的时候后手清线，把我们这个重要的战略点能让他晚掉一会儿」（@ 11:12~11:29），这个战略点素材前文点过是「双方第一道防线的中一塔」「谁先掉谁先难受」（@ 04:52~05:03）<\/li><li><strong>决策分支<\/strong>：<\/li><li>己方少人 → 不接正面，转中清线，让中一塔晚掉<\/li><li>中路有队友 → 先手清；中路没人 → 趁对面在上路打架时后手清<\/li><li><strong>反例<\/strong>：人不齐还在原地「死守」（@ 11:06~11:08）<\/li><li><strong>来源<\/strong>：BV1ssxz6SEGo @ 10:43~11:29、04:52~05:03<\/li><li><strong>可信度<\/strong>：高（人数条件、处置、目的三层都有）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：团战开打前或刚开打，己方已经掉人判断依据：素材逐帧数人「队友倒了一个……那钟馗当着咱们的面也倒了——现在的中线团战打不了了吗」「队友已经明白倒两个，赶紧去中路准备清中…"}, {"id": "K-D89", "cat": "D", "title": "压塔团中单站侧面、不和射手同点，位置要能随时盖到射手（中路视角）", "self": "<h3><a class=\"kref\" href=\"#K-D89\">K-D89<\/a> 压塔团中单站侧面、不和射手同点，位置要能随时盖到射手（中路视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：队友要压中塔或高地塔，团战可能在塔下开<\/li><li><strong>判断依据<\/strong>：素材原话「队友要压中塔，咱们提前去侧面找位置，不要跟鲁班站在一起就行了」「对面想守塔，大招一盖，那对面想守塔的话就会掉很多状态」（@ 09:07~09:16）；站位要求是「在一个后面的位置，时刻能大招二技能盖到射手」「对面想开团，你就大招直接开射手，确保他安全输出，团战就输不了」（@ 09:24~09:31）<\/li><li><strong>决策分支<\/strong>：<\/li><li>己方压塔 → 站侧面，大招留给\"对面开团的那一下\"，而不是用来先手<\/li><li>对面守塔 → 先用大招盖塔下压状态，再让兵线拆塔（@ 09:12~09:18）<\/li><li><strong>反例<\/strong>：和射手站同一个点。素材的理由是两人同点会被同一波开团一起打掉，所以要分开站（@ 09:07~09:12）<\/li><li><strong>来源<\/strong>：BV1uu4y197Sr @ 09:07~09:31<\/li><li><strong>可信度<\/strong>：高（站位、目的、用法都给全了）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：队友要压中塔或高地塔，团战可能在塔下开判断依据：素材原话「队友要压中塔，咱们提前去侧面找位置，不要跟鲁班站在一起就行了」「对面想守塔，大招一盖，那对面想守塔的话就会掉…"}, {"id": "K-D90", "cat": "D", "title": "团战前置是视野：压塔前先站住中路视野点，蹲人等到对面辅助探草那一瞬间再动（中路视角）", "self": "<h3><a class=\"kref\" href=\"#K-D90\">K-D90<\/a> 团战前置是视野：压塔前先站住中路视野点，蹲人等到对面辅助探草那一瞬间再动（中路视角）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：顺风要压塔开团，或要在对方转线路线上蹲人<\/li><li><strong>判断依据<\/strong>：压塔前「射手下去发育，咱们直接把中路视野站住，把视野都开出来」（@ 08:30~08:37）；看到对面都在红区就「指挥队友不要转中，直接去压下路二塔」，自己「往蓝区一钻，视野站住，对面肯定就会从这里支援」（@ 08:37~08:50）。蹲人的时机是「等到对面辅助探草的一瞬间动手，卡那一点点时间，几乎对面都反应不过来了」（@ 08:10~08:15），配套的心态是「玩昭君蹲人一定要冷静，慢慢来」（@ 08:25~08:28）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面人都在一侧 → 不转中，改压另一侧二塔；自己去站对方支援必经的野区口<\/li><li>在草里蹲 → 等对面辅助进草那一下再放技能，不提前<\/li><li><strong>反例<\/strong>：提前动手。「哪怕是职业也有一个毛病，就是会提前动手」，提前动手就会被对方辅助探草探出来（@ 08:00~08:09）<\/li><li><strong>来源<\/strong>：BV1uu4y197Sr @ 08:00~08:50<\/li><li><strong>可信度<\/strong>：高（时机 + 反例 + 机制都有）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>\"进了打谁\"这一问，四份素材合起来只覆盖了打野一侧<\/strong>：素材给的是\"跨前排摸后排\"（@ 26:45~26:47）和\"夹位摸后排\"（@ 27:21~27:24），没有系统讲正面集火优先级——先打对面前排还是先切对方 C、残血目标和关键目标的取舍，一概没有。射手与中路两份素材从头到尾没有出现\"先打谁\"的判断，只有\"打不打、站哪、什么时候进\"。<\/li><li><strong>对抗路/坦克视角完全缺失<\/strong>：「前排什么时候开团」这一半是全节的空白。射手视角只是转述「低分段最常见的情况就是玩个坦边一直带线，或者说玩一个承伤能力比较强的打野一直在那边刷野区」（@ 13:20~13:29），这是从射手侧看前排，不是前排自己的判断。<\/li><li><strong>辅助视角完全缺失<\/strong>：四份素材里辅助只以\"对方的绕后位\"\"探草的辅助\"出现，没有一份是辅助第一视角。<\/li><li><strong>量化阈值全无<\/strong>：没有血线标准、没有技能 CD 判断标准、没有\"几个人可以打几个人\"的通用公式。素材里最接近的只有「你三打五，你怎么打」（@ 11:04）这样的反问，不构成阈值。<\/li><li><strong>逆风局的\"谁来开团\"没有答案<\/strong>：射手视角明确说逆风不主动开节奏（@ 09:11~09:32），但逆风该由谁开、开在哪，素材只说\"等一个机会\"，没有展开。<\/li><li><strong>10 分钟龙的选择存在视角分歧且素材未调和<\/strong>：打野视角按\"敌方高地掉没掉\"分黑暗暴君与暗影主宰，高地没掉优先黑暗暴君（@ 27:53~27:57）；赵伽蒙（射手视角）主张「从头到尾就是开主宰，10 分钟之前的小主宰、10 分钟之后的大主宰，开就完事，不用听他们说什么开暴君」（@ 11:41~11:55）。两套说法的适用前提不同（一个看推进条件，一个看逆风续命），但素材没有给出统一结论，本节不强行合并。<\/li><li><strong>团战前的排视野/扫草没有覆盖<\/strong>：只有昭君视角讲了蹲人和站视野点（@ 08:10~08:50），打野侧的\"草丛易守难攻\"是 4 分钟龙团专属（@ 16:58~17:02），没有通用的团战前视野流程。<\/li><li><strong>高地团的五人具体站位没有覆盖<\/strong>：打野只给了\"打野自己切还是护线\"，射手只给了\"射手要战斗到最后\"，中单只给了\"站侧面\"，三块拼不出一个完整阵型。<\/li><li><strong>技能保留纪律只有闪现一项<\/strong>：只有赵伽蒙讲了「闪不要去乱交，因为关键的节骨眼你又没闪了」（@ 14:15~14:20），大招、净化、位移的保留时机没有对应结论。<\/li><li><strong>4 分钟暴君与射手线权的关系只单向提了一句<\/strong>：射手视角问「你到底是根据什么来判断这个暴君到底能不能拿」（@ 03:53~03:56）并给了反例（@ 03:56~04:04），但没有和打野侧的兵线权判断对齐；两份素材在这一点上是各说各的。<\/li><li><strong>视角冲突未在原素材内被任何一方讨论<\/strong>：<a class=\"kref\" href=\"#K-D79\">K-D79<\/a>/<a class=\"kref\" href=\"#K-D84\">K-D84<\/a>、<a class=\"kref\" href=\"#K-D82\">K-D82<\/a>/<a class=\"kref\" href=\"#K-D87\">K-D87<\/a>、<a class=\"kref\" href=\"#K-D83\">K-D83<\/a>/<a class=\"kref\" href=\"#K-D87\">K-D87<\/a> 这几处矛盾，是两份素材各自成立、拼在一起才显出来的，没有任何一份素材提到过另一侧的说法。<\/li><li><code>06<\/code> 的实际文件名与编号要跟库里对齐后再回填 depends_on；<code>08<\/code>/<code>09<\/code> 同理。<\/li><\/ul>", "sum": "适用版本：S45触发条件：顺风要压塔开团，或要在对方转线路线上蹲人判断依据：压塔前「射手下去发育，咱们直接把中路视野站住，把视野都开出来」（@ 08:30~08:37）；"}]}, {"key": "D", "cat": "对局内", "title": "08 顺风推进", "file": "08_顺风推进.md", "intro": "<blockquote><p>素材：燕十叁《王者打野公式的本质，从 0 学打野》（BV1NLHsexEPi，UP 主自述\"燕13的替身SY\"， 打野视角的教学口播 + 本人与国服老虎的实战复盘）。它讲的是<strong>野区刷新节拍怎么变成一张时间表<\/strong>： 90 秒一圈、一圈六拍、四片 Buff 一轮最多同时拿两片。下面每条判断都能在录像里对上时间点。 <strong>只覆盖打野视角<\/strong>——其他分路的换算素材没讲，全部进「待补」。 另：任务包同时附了 BV1T8hG6FEtp，但该段转写经核对是一档综艺（分船、塑料瓶造船、浮力实验）的内容， 与王者荣耀无关，本卡<strong>未从中取任何结论<\/strong>，仅保留编号以备追溯。 上游接 <code>07_发育路推进公式.md<\/code>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：优势到手，是该\"多做\"还是该\"换词\"        → K-D53\n第 2 步：这一波能做什么，由上一轮停在哪一拍决定  → K-D54\n第 3 步：想同时压两片以上野区，先决定放掉哪些小野 → K-D55\n第 4 步：龙/塔和野区撞在同一拍，用哪个换哪个      → K-D56\n第 5 步：一段推进做完，回原点还是把舍弃的补回来  → K-D57\n第 6 步：家里野区被对面换掉，这波推进停不停      → K-D58\n第 7 步：要反复进对面野区，是\"反\"还是\"等它刷\"    → K-D59<\/code><\/pre>", "entries": [{"id": "K-D53", "cat": "D", "title": "顺风不是多做，是节拍数不变、换收益更高的词", "self": "<h3><a class=\"kref\" href=\"#K-D53\">K-D53<\/a> 顺风不是多做，是节拍数不变、换收益更高的词<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：刚打出一波优势（反到 Buff、抓死一次、拔了一座塔），想\"接下來该多做什么\"<\/li><li><strong>判断依据<\/strong>：一个 90 秒循环大约只装得下六拍——一片野区算 2 拍、一座防御塔算 2 拍、蹭线抢线算 1 拍，加起来就是 6（@ 02:01~02:08）；作者给的用法原话是\"在同样时间的节拍里，尽可能去填收益更高的词\"（@ 02:14~02:18）<\/li><li><strong>决策分支<\/strong>：<\/li><li>节拍还没填满 → 补<strong>高收益<\/strong>的词（龙、塔、对面野区），不要凭空加动作（@ 02:10~02:18）<\/li><li>节拍已经填满 → 只能<strong>换词<\/strong>，不能加词；加了就一定挤掉别的（@ 13:05~13:11）<\/li><li><strong>反例<\/strong>：「顺风了，想到什么就做什么」——素材把这种状态直接排除在\"节奏\"之外：随心所欲做事不是节奏，知道一件事对规律的影响才是（@ 01:29~01:36）；另一种反例是野怪一刷新就跑回去复刻第一轮，作者形容\"说实话有点像人机\"（@ 01:00~01:04）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 01:29~01:36、02:01~02:18、13:05~13:11<\/li><li><strong>可信度<\/strong>：高。判断依据是作者自建的框架，但六拍的时间成本（2/2/1）是他在片子里明确给出的换算口径，不是含糊带过<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：刚打出一波优势（反到 Buff、抓死一次、拔了一座塔），想\"接下來该多做什么\"判断依据：一个 90 秒循环大约只装得下六拍——一片野区算 2 拍、一座防御塔算 2 拍…"}, {"id": "K-D54", "cat": "D", "title": "下一步能做什么，由上一轮停在哪一拍决定", "self": "<h3><a class=\"kref\" href=\"#K-D54\">K-D54<\/a> 下一步能做什么，由上一轮停在哪一拍决定<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：推进卡住，不知道该压哪一路、该不该回头刷<\/li><li><strong>判断依据<\/strong>：作者把这条单独列为\"第二点\"——\"打野公式是从上一波开始的，你下一件事能做什么，取决于你上一轮循环的节拍在哪里\"（@ 04:21~04:32）；反过来，\"节拍相同，填什么词都不会影响节奏\"（@ 05:27~05:31）<\/li><li><strong>决策分支<\/strong>：<\/li><li>上一轮把某个 Buff 位换成了蹭线 → 这个 Buff <strong>本轮不再归你掌控<\/strong>，别按旧表去等它（@ 08:13~08:28）<\/li><li>上一轮只是把\"刷一片野区\"这个词换成了\"刷对面野区\" → 节拍没变，可以照原时间线继续压（@ 04:57~05:11）<\/li><li><strong>反例<\/strong>：「顺风了，哪里有钱去哪里」——把上一轮的参照物丢掉，下一轮就会出现空拍，因为\"上一轮这里的节拍被我们从刷红替换成了蹭线，刷红已经不被我们所掌控\"（@ 08:19~08:28）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 04:21~04:32、04:57~05:11、08:13~08:28<\/li><li><strong>可信度<\/strong>：高。有老虎反红的具体推演作支撑：反红被明确定义为\"置换了原本应该刷蓝区的时间\"，所以节奏不断（@ 05:03~05:11）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：推进卡住，不知道该压哪一路、该不该回头刷判断依据：作者把这条单独列为\"第二点\"——\"打野公式是从上一波开始的，你下一件事能做什么，取决于你上一轮循环的节拍在哪里\"（@…"}, {"id": "K-D55", "cat": "D", "title": "想同时压两片以上野区，先决定放掉哪些小野", "self": "<h3><a class=\"kref\" href=\"#K-D55\">K-D55<\/a> 想同时压两片以上野区，先决定放掉哪些小野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：优势方想把野区压制扩成\"四片野区\"，或想一边控野一边控龙带线<\/li><li><strong>判断依据<\/strong>：全图四片 Buff，但一轮节奏里身上最多同时存在两个，所以\"一轮节奏你只能同时拥有两片野区\"（@ 05:43~05:51）；想吃到三片，推演里\"一定会有小野怪是放掉的\"（@ 06:25~06:30）；而小野 70 秒就刷一次，\"很容易因为贪一个小野而打乱自己的节奏，导致节奏断裂\"（@ 06:44~06:50）<\/li><li><strong>决策分支<\/strong>：<\/li><li>要走正方形 → <strong>主动<\/strong>把小野算进\"放弃项\"，用它换跑图时间（@ 07:38~07:43）<\/li><li>不放弃小野 → 老实拿两片，别宣称自己在做四片压制（@ 06:50~06:56）<\/li><li><strong>反例<\/strong>：「我全都要」——作者的原话反问是\"你想把三片野区塞到一个循环里面，那你刷野的路上是瞬移的吗\"（@ 06:32~06:36）；做不到的根因被点得很死：\"就是因为不懂得放掉小野怪占用的节拍，导致规划不及时\"（@ 06:38~06:44）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 05:43~05:51、06:25~06:50、07:38~07:43<\/li><li><strong>可信度<\/strong>：中高。结论本身有推演支撑，但\"拆成两条节奏线来理解\"是作者自己的表述（@ 07:29~07:32），属于他的解释框架，不是可外部验证的机制<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：优势方想把野区压制扩成\"四片野区\"，或想一边控野一边控龙带线判断依据：全图四片 Buff，但一轮节奏里身上最多同时存在两个，所以\"一轮节奏你只能同时拥有两片野区\"（@…"}, {"id": "K-D56", "cat": "D", "title": "龙和塔能整块换掉一轮刷野时间", "self": "<h3><a class=\"kref\" href=\"#K-D56\">K-D56<\/a> 龙和塔能整块换掉一轮刷野时间<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：龙刷了或塔能压，同时自家/对面野区也在刷，只能选一样<\/li><li><strong>判断依据<\/strong>：作者把\"推塔控龙\"和\"刷野区\"明确归为同一类节拍——\"我在刷野区的时候并不是在刷野区，我只是在做节拍时间为二的事情；同时我在做其他节拍时间为二的事情的时候，例如推塔控龙，你也可以理解我此时在打野，他们是可以互相置换的\"（@ 09:00~09:16）<\/li><li><strong>决策分支<\/strong>：<\/li><li>龙能直接换成塔/视野 → 先龙。国服老虎的实录是：4 分钟开龙，\"开完龙不刷蓝区，选择压上压了上路，等待红区刷新\"再回去反红（@ 10:28~10:33）<\/li><li>开龙 + 压塔大约占三拍 → 剩下的时间只够去<strong>占点<\/strong>对面红区，不够打完（@ 12:07~12:13）<\/li><li>选择回去补刷蓝区 → 就要舍弃拦小野，但能赶上对面蓝 Buff 刷新，这是<strong>取舍<\/strong>不是错误（@ 13:19~13:24）<\/li><li><strong>反例<\/strong>：「开完龙再回去把蓝区补了，还要顺手拦两只小野」——这正是把两条线的收益同时要，作者在推演里点名这样会让整个节奏崩盘（@ 13:05~13:19）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 09:00~09:16、10:28~10:33、12:07~12:13、13:19~13:24<\/li><li><strong>可信度<\/strong>：高。有带分钟级时间点的实战复盘（4 分钟开龙 → 压上塔 → 等红刷新 → 反红），不是纯口播<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：龙刷了或塔能压，同时自家/对面野区也在刷，只能选一样判断依据：作者把\"推塔控龙\"和\"刷野区\"明确归为同一类节拍——\"我在刷野区的时候并不是在刷野区，我只是在做节拍时间…"}, {"id": "K-D57", "cat": "D", "title": "一段推进做完就回时间原点，别把舍弃的节拍塞回来", "self": "<h3><a class=\"kref\" href=\"#K-D57\">K-D57<\/a> 一段推进做完就回时间原点，别把舍弃的节拍塞回来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一波推进结束（拿了龙 + 塔，或连吃两片野区），还剩时间，想\"再补点东西\"<\/li><li><strong>判断依据<\/strong>：\"如果你填了蹭线等其他的事情，那你就需要舍弃掉一个 Buff，否则你的节拍会溢出，导致下一轮节奏线延迟或者混乱\"（@ 07:50~07:58）；处置办法是\"在节拍填满时间线的时候，及时回到时间原点，才不会影响循环节奏的时间\"（@ 08:00~08:06）<\/li><li><strong>决策分支<\/strong>：<\/li><li>还有空拍 → 回原点接下一循环，按原节拍走（@ 08:00~08:06）<\/li><li>已经超拍 → 不要硬塞，<strong>开一条新循环并声明新原点<\/strong>；作者给的例子是把反红本身当成新原点，\"反红刷蓝、反蓝控拍\"（@ 08:30~08:43）<\/li><li><strong>反例<\/strong>：「刚才为了推塔没刷的那组野，现在补回来」——作者原话是把舍弃的节拍\"强行再塞进来\"，结果是\"整个节奏就会崩盘，就会乱\"（@ 13:13~13:19）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 07:50~08:06、08:30~08:43、13:13~13:19<\/li><li><strong>可信度<\/strong>：高。同一判断在 07:50 和 13:13 两处独立出现，前后一致<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：一波推进结束（拿了龙 + 塔，或连吃两片野区），还剩时间，想\"再补点东西\"判断依据：\"如果你填了蹭线等其他的事情，那你就需要舍弃掉一个 Buff，否则你的节拍会溢出，…"}, {"id": "K-D58", "cat": "D", "title": "对面换掉你一片野区，只要这条节奏线收益做足就不算亏", "self": "<h3><a class=\"kref\" href=\"#K-D58\">K-D58<\/a> 对面换掉你一片野区，只要这条节奏线收益做足就不算亏<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在推优势，家里野区被对面偷/换<\/li><li><strong>判断依据<\/strong>：老虎开龙那波，\"自家红是被对面的猪八戒换掉了，但这不重要，这并不影响老虎的节奏，老虎仍然做足了一条节奏线的收益——开龙推塔刷野区\"（@ 14:04~14:12）；作者对交换方的评价是\"猪八戒长途跋涉的跑去拿老虎的红，也算是没有办法的办法了\"（@ 14:14~14:17）<\/li><li><strong>决策分支<\/strong>：<\/li><li>你这条线已经拿到龙 + 塔 → <strong>继续推，不回头<\/strong>，被换掉的那片按 <a class=\"kref\" href=\"#K-D57\">K-D57<\/a> 开新原点处理（@ 14:04~14:12）<\/li><li>你这条线只拿到一片野区、其余全空 → 才回头守，这时\"顺风\"其实已经名不副实<\/li><li>判断不了自己这条线赚没赚 → 见 <code>09_逆风止损.md<\/code> 的 <a class=\"kref\" href=\"#K-D60\">K-D60<\/a>，先分清丢的是经济还是刷新规律的掌控<\/li><li><strong>反例<\/strong>：「他偷我红，我必须马上抢回来」——为了追回一片野区放弃已经在手的推进窗口，正是 <code>09<\/code> 开头要接的那条边（@ 14:12~14:21）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 14:04~14:17、14:19~14:21<\/li><li><strong>可信度<\/strong>：中高。是单局案例 + 作者一句\"不重要\"的判断，<strong>没有给出任何量化阈值<\/strong>（比如被换几片才该回头），所以只能当方向用，不能当尺子<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在推优势，家里野区被对面偷/换判断依据：老虎开龙那波，\"自家红是被对面的猪八戒换掉了，但这不重要，这并不影响老虎的节奏，老虎仍然做足了一条节奏线的收益——开龙推塔刷…"}, {"id": "K-D59", "cat": "D", "title": "反野的正确形态是\"等它刷\"，不是\"进去找\"", "self": "<h3><a class=\"kref\" href=\"#K-D59\">K-D59<\/a> 反野的正确形态是\"等它刷\"，不是\"进去找\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想反复进对面野区做压制，判断这一脚值不值得迈<\/li><li><strong>判断依据<\/strong>：作者把反野的第一性条件讲得很直白——\"反野的第一要素是什么？是要有野怪，你才可以反。野怪不刷，你怎么反？而如果你能让野怪在你反的时候正好刷新，那么你就控制了这片野区\"（@ 09:45~09:57）；配合\"老虎走到哪，那你的野区就会刷，从而可以提前规划\"（@ 06:07~06:12）<\/li><li><strong>决策分支<\/strong>：<\/li><li>能算出对面那片什么时候刷 → <strong>按时走过去<\/strong>，到了正好出生；实录里\"稍后时间走过去，蓝 Buff 会刚好刷新\"（@ 19:58~20:02）<\/li><li>算不出 → 不进。进去是空的，还白送一趟跑图（@ 16:22~16:30）<\/li><li><strong>反例<\/strong>：队友喊\"反红\"就跟着进——作者当场否掉：\"我不进他红区没东西，他红开的……我们抢完中线的时候韩信肯定出红区了，所以队友说反红是不存在的\"（@ 16:22~16:30）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 06:07~06:12、09:45~09:57、16:22~16:30、19:58~20:02<\/li><li><strong>可信度<\/strong>：高。正反两面都有实战例子：一次是掐点反蓝成功，一次是明确拒绝了一次空反<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>其他分路的换算完全没有<\/strong>：素材全程是打野视角，\"一片野区 2 拍、一座塔 2 拍\"是打野口径。射手/中路/对抗路的\"节拍当量\"素材没给，不能直接套<\/li><li><strong>S45 的刷新数值未经核对<\/strong>：素材里 90 秒（Buff）、70 秒（小野）是录制当时的数，片子没标版本（只提到\"7 月 31 号\"的实战视频）。S45 是否仍为这两个值，需要按当前版本核一遍<\/li><li><strong>推进的\"落地\"环节缺失<\/strong>：素材只有\"压上塔\"\"拆个中塔\"两句，没有兵线怎么带、塔皮怎么磨、越塔条件是什么<\/li><li><strong>团队层面缺失<\/strong>：谁是主指挥、四个人怎么跟、视野谁做，素材里只有\"让队友过去站点\"一句带过（@ 20:24~20:25）<\/li><li><strong>反面案例的披露不全<\/strong>：作者自己说过\"不要问我反红失败了怎么办，我会剪辑的\"（@ 19:10~19:19），所以实战片段是成功样本，失败率不可考<\/li><li><strong>素材一的可用性<\/strong>：BV1T8hG6FEtp 与主题无关，建议向素材提供方确认是否贴错文件<\/li><\/ul>", "sum": "适用版本：S45触发条件：想反复进对面野区做压制，判断这一脚值不值得迈判断依据：作者把反野的第一性条件讲得很直白——\"反野的第一要素是什么？"}]}, {"key": "D", "cat": "对局内", "title": "09 逆风止损", "file": "09_逆风止损.md", "intro": "<blockquote><p>素材：同 <code>08_顺风推进.md<\/code>（BV1NLHsexEPi，燕十叁，打野视角）。素材一 BV1T8hG6FEtp 与王者无关， 本卡同样未从中取任何结论。<\/p>\n<p>本节接 <code>08_顺风推进.md<\/code> 留下的<strong>两条边<\/strong>： ① <strong><a class=\"kref\" href=\"#K-D58\">K-D58<\/a><\/strong>「对面换掉你一片野区，只要这条节奏线收益做足就不算亏」——这条反过来做，就是\"非要把那片抢回来\"； ② <strong><a class=\"kref\" href=\"#K-D57\">K-D57<\/a><\/strong>「一段推进做完就回时间原点」——没回去、硬把舍弃的节拍塞回来，节拍溢出，下一轮延迟或混乱。<\/p>\n<p>这两条走错，局面就从顺风滑成\"顺风没推出去、被反打\"。<strong>本节只回答一件事：已经逆风了，怎么把损失按住。<\/strong> 上游接 <code>08_顺风推进.md<\/code>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：先分清丢的是经济，还是野区刷新规律的掌控 → K-D60\n第 2 步：没有野区可刷的时候，人会怎么死           → K-D61\n第 3 步：只剩一片能刷，怎么用它把循环接回来       → K-D62\n第 4 步：对面 Buff 马上刷，抢还是放               → K-D63\n第 5 步：掉点之后刷新时间已经偏了，怎么重设原点   → K-D64\n第 6 步：队友没到位，还进不进野区                 → K-D65\n第 7 步：为一只小野绕路，值不值                   → K-D66<\/code><\/pre>", "entries": [{"id": "K-D60", "cat": "D", "title": "逆风先分清：丢的是经济，还是刷新规律的掌控权", "self": "<h3><a class=\"kref\" href=\"#K-D60\">K-D60<\/a> 逆风先分清：丢的是经济，还是刷新规律的掌控权<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：落后了，想止损，但不知道第一步该修什么<\/li><li><strong>判断依据<\/strong>：素材把顺逆的分水岭落在\"谁掌握刷新区间\"上——老虎压制的收尾原话是\"他家的游戏刷新规律已经被老虎掌握了，他掌握不了\"（@ 14:19~14:21）；反过来看对面打野的失误，也是同一把尺子：\"又是一个不知道自己野区刷新规律的打野，我们直接接管\"（@ 17:07~17:12）<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济落后，但自家每片野什么时候刷你算得出 → 说明节奏线还在，按 <code>08<\/code> 的节拍继续填词就行，不需要额外动作（@ 06:04~06:11）<\/li><li>连自己野区什么时候刷都算不出 → <strong>先停手<\/strong>，重建时间原点，见 <a class=\"kref\" href=\"#K-D64\">K-D64<\/a>（@ 08:06~08:43）<\/li><li><strong>反例<\/strong>：不知道刷新时间还往对面野区走——进去是空的，白跑一趟还暴露位置（@ 16:22~16:30）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 14:19~14:21、16:22~16:30、17:07~17:12<\/li><li><strong>可信度<\/strong>：中。\"谁掌握刷新规律 = 谁占优\"是作者的核心论断，逻辑自洽且有正反案例；但<strong>素材没有给\"落后多少算逆风\"的任何刻度<\/strong>，经济差、塔差、龙差都没提，所以只能当优先级判断，不能当止损阈值<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：落后了，想止损，但不知道第一步该修什么判断依据：素材把顺逆的分水岭落在\"谁掌握刷新区间\"上——老虎压制的收尾原话是\"他家的游戏刷新规律已经被老虎掌握了，他掌握不了\"（…"}, {"id": "K-D61", "cat": "D", "title": "逆风最危险的不是穷，是没有野区可刷还乱跑", "self": "<h3><a class=\"kref\" href=\"#K-D61\">K-D61<\/a> 逆风最危险的不是穷，是没有野区可刷还乱跑<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：自家野区被清空/被反，地图上看不到能打的东西<\/li><li><strong>判断依据<\/strong>：素材里韩信那次死亡，归因讲得极清楚——\"韩信的死就是因为他的蓝还没有刷，所以他没有地方去，漫无目的的来到了我的红区\"（@ 15:21~15:27）；作者的补充是\"如果他懂得野区刷新规律，那么他就应该知道他的蓝区刷新是有时间差的，就不会在这个时候乱跑\"（@ 15:31~15:37）<\/li><li><strong>决策分支<\/strong>：<\/li><li>还有一片能刷 → 直奔那一片，用 <a class=\"kref\" href=\"#K-D62\">K-D62<\/a> 的接法（@ 15:46~15:57）<\/li><li>一片都没有 → 去线上吃兵/等刷新，<strong>不要进对面野区瞎逛<\/strong>（@ 15:27~15:31）<\/li><li><strong>反例<\/strong>：「没野可刷，去对面逛逛找机会」——正好撞在对方算好的时间线上，被顺手带走（@ 15:17~15:21 击杀就发生在\"传送去中路准备反蓝，顺手在这个地方击杀了韩信\"）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 15:17~15:37<\/li><li><strong>可信度<\/strong>：高。死因链条完整（蓝没刷 → 没地方去 → 乱跑 → 走进对方红区 → 被杀），不是事后归因的模糊说法<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：自家野区被清空/被反，地图上看不到能打的东西判断依据：素材里韩信那次死亡，归因讲得极清楚——\"韩信的死就是因为他的蓝还没有刷，所以他没有地方去，漫无目的的来到了我的红…"}, {"id": "K-D62", "cat": "D", "title": "保住\"还剩下的那一片\"，用它把循环接回来", "self": "<h3><a class=\"kref\" href=\"#K-D62\">K-D62<\/a> 保住\"还剩下的那一片\"，用它把循环接回来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：野区只剩一片能刷，或者刚被反完只剩残羹<\/li><li><strong>判断依据<\/strong>：作者反蓝那波的自述是\"你会发现我反蓝的过程当中，地图上只有这一片野区是可以刷的；我刷完蓝，我家的红也刷了，我不会像韩信一样没有野区刷；并且后续刷了红，我家的蓝也会刷，我可以继续循环\"（@ 15:46~15:57）<\/li><li><strong>决策分支<\/strong>：<\/li><li>按顺序刷完这一片 → 下一片正好接上（红完蓝、蓝完红），循环自然闭合（@ 15:52~15:57）<\/li><li>接不上、中间有真空 → 用一拍线上的事（清线/跟一波）填空，别硬等（@ 15:57~16:00）<\/li><li><strong>反例<\/strong>：手里明明还剩一片，却先去追对面的人——等于把唯一的接续点也丢了，回头两片都不在（@ 15:21~15:31 韩信既没有自己的蓝，也没守住时间线）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 15:46~16:00<\/li><li><strong>可信度<\/strong>：高。这条是作者在实战里边打边讲的，且和 <a class=\"kref\" href=\"#K-D61\">K-D61<\/a> 构成同一段的因果正反面<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：野区只剩一片能刷，或者刚被反完只剩残羹判断依据：作者反蓝那波的自述是\"你会发现我反蓝的过程当中，地图上只有这一片野区是可以刷的；"}, {"id": "K-D63", "cat": "D", "title": "对面 Buff 快刷了，人不占优就放，放是止损不是让", "self": "<h3><a class=\"kref\" href=\"#K-D63\">K-D63<\/a> 对面 Buff 快刷了，人不占优就放，放是止损不是让<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：算到对面蓝/红马上刷，自己状态或人数不占优<\/li><li><strong>判断依据<\/strong>：\"但是我们这波先不进蓝 Buff，我们放给他刷\"（@ 18:35~18:37）；放掉之后的替代动作是\"本来想的是这波先偷他小野，然后利用他刷蓝的时间差，去看看能不能推塔或者控龙\"（@ 18:44~18:48）<\/li><li><strong>决策分支<\/strong>：<\/li><li>人不齐或状态差 → <strong>放 Buff，改偷小野/换推塔控龙<\/strong>（@ 18:35~18:48）<\/li><li>人齐、状态好、算得准刷新点 → 按 <a class=\"kref\" href=\"#K-D59\">K-D59<\/a> 的掐点进（@ 19:58~20:02）<\/li><li><strong>反例<\/strong>：人不齐还硬进——同一段素材里作者的选择是\"本来刷完蓝区也想反蓝的，但是辅助没来，所以我们正常刷红\"（@ 17:01~17:06），这是他自己给出的正确处置<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 17:01~17:06、18:35~18:48、19:58~20:02<\/li><li><strong>可信度<\/strong>：高。放与不放两种选择在素材里都出现过，并且各自给了理由<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：算到对面蓝/红马上刷，自己状态或人数不占优判断依据：\"但是我们这波先不进蓝 Buff，我们放给他刷\"（@ 18:35~18:37）；"}, {"id": "K-D64", "cat": "D", "title": "掉点之后刷新时间已经偏了，要重设时间原点", "self": "<h3><a class=\"kref\" href=\"#K-D64\">K-D64<\/a> 掉点之后刷新时间已经偏了，要重设时间原点<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：自己刚复活，或对面/队友刚掉点，旧的时间表已经不准<\/li><li><strong>判断依据<\/strong>：己方掉点的后果被讲成机制——\"他上一波死了，所以红区的刷新是比蓝区有延迟的；Buff 有延迟，说明小野会在 Buff 该刷的时候刷\"（@ 18:36~18:40）；卡顿之后作者的操作是\"所以我们再重置一下时间，原点刷了蓝区的小野之后，先不去红区\"（@ 16:57~17:00）；更上一层的原则是\"时间原点是可以改变的，我们需要记住上一轮节奏的参照物\"（@ 08:06~08:11）<\/li><li><strong>决策分支<\/strong>：<\/li><li>自己死了 → 以复活后碰到的<strong>第一片野区<\/strong>为新原点，往后重排（@ 16:57~17:00）<\/li><li>对面死了 → 他的下一片会<strong>延迟<\/strong>，小野却按原时间刷，这正好是你提前布局的窗口（@ 16:36~16:41）<\/li><li><strong>反例<\/strong>：拿死之前那张表继续算——每一个点都是错的，还会误判\"他这片应该空了\"然后一头撞进去（@ 16:22~16:30）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 08:06~08:11、16:36~16:41、16:57~17:00、18:36~18:40<\/li><li><strong>可信度<\/strong>：高。\"Buff 延迟但小野不延迟\"这条在素材里被单独强调过两次，是可操作的区分<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：自己刚复活，或对面/队友刚掉点，旧的时间表已经不准判断依据：己方掉点的后果被讲成机制——\"他上一波死了，所以红区的刷新是比蓝区有延迟的；"}, {"id": "K-D65", "cat": "D", "title": "队友没到位就不进野区，默认动作是刷自家", "self": "<h3><a class=\"kref\" href=\"#K-D65\">K-D65<\/a> 队友没到位就不进野区，默认动作是刷自家<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：计划反野，但辅助/队友不在位，或沟通没落地<\/li><li><strong>判断依据<\/strong>：作者的原话决策是\"本来刷完蓝区也想反蓝的，但是辅助没来，所以我们正常刷红\"（@ 17:01~17:06）——注意这里没有纠结，直接切到默认动作<\/li><li><strong>决策分支<\/strong>：<\/li><li>辅助在、信息对得上 → 按 <a class=\"kref\" href=\"#K-D59\">K-D59<\/a> 掐点进（@ 19:58~20:02）<\/li><li>辅助不在 → <strong>正常刷自家，把反野推到下一拍<\/strong>，不要改成\"一个人去试试\"（@ 17:01~17:06）<\/li><li><strong>反例<\/strong>：人不齐、信息还是错的，就跟着喊反红——\"队友说反红是不存在的\"，因为对面红开的，进去根本没东西（@ 16:22~16:30）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 16:22~16:30、17:01~17:06<\/li><li><strong>可信度<\/strong>：高。这是素材里少见的、明确写出\"因为 X 所以我不做 Y\"的决策句，不是事后描述<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：计划反野，但辅助/队友不在位，或沟通没落地判断依据：作者的原话决策是\"本来刷完蓝区也想反蓝的，但是辅助没来，所以我们正常刷红\"（@ 17:01~17:06）——注意这…"}, {"id": "K-D66", "cat": "D", "title": "止损时别为一只小野赔掉整条循环", "self": "<h3><a class=\"kref\" href=\"#K-D66\">K-D66<\/a> 止损时别为一只小野赔掉整条循环<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：逆风时看到一只小野，但要绕路或多花一拍才能拿到<\/li><li><strong>判断依据<\/strong>：小野的刷新周期只有 70 秒，作者的原话是\"很容易因为贪一个小野而打乱自己的节奏，导致节奏断裂\"（@ 06:44~06:50）；同一套框架里，想吃下超量的野区\"一定会有小野怪是放掉的\"（@ 06:25~06:30）<\/li><li><strong>决策分支<\/strong>：<\/li><li>小野<strong>就在当前节拍线上<\/strong>（顺路 1 拍内）→ 拿（@ 07:38~07:43）<\/li><li>要绕路、要多花一拍 → 放掉，把那一拍留给接续循环（@ 06:44~06:50）<\/li><li><strong>反例<\/strong>：逆风时把\"偷他小野 + 用时间差推塔控龙\"一起做（@ 18:44~18:48）——这套加法在素材里是<strong>顺风<\/strong>语境下的操作，逆风时同样的绕路会直接掐断你仅剩的那条线<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 06:25~06:50、07:38~07:43、18:44~18:48<\/li><li><strong>可信度<\/strong>：中。素材讲的是顺风/均势下的节奏管理，\"逆风时贪小野更致命\"是<strong>推论<\/strong>，素材没有直接给逆风案例，所以只作方向参考<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>素材没有\"逆风\"的判定标准<\/strong>：经济差多少、掉几座塔、丢几条龙算逆风，全片没有数字。本节的 <a class=\"kref\" href=\"#K-D60\">K-D60<\/a> 只能给出\"先看刷新规律\"这个优先级，给不出阈值<\/li><li><strong>守家/守高地/清线拖延完全缺失<\/strong>：素材的逆风只到\"野区被压制\"这一层，没有高地防守、没有兵线处理、没有被破塔之后怎么办<\/li><li><strong>团战打输之后怎么收<\/strong>：素材里出现过\"团战还是没打过\"（@ 18:51~18:52），但作者一笔带过，没有拆解残局处理<\/li><li><strong>视野与站位<\/strong>：逆风最需要的视野布置、绕后位防范，素材零覆盖<\/li><li><strong>非打野分路的逆风止损<\/strong>：射手/中路/对抗路在逆风里做什么，素材没讲；<code>07<\/code> 的 <a class=\"kref\" href=\"#K-D38\">K-D38<\/a> 有射手视角的一条（\"防守吃线等机会\"），但两者没有在素材层面对齐过<\/li><li><strong>与 <a class=\"kref\" href=\"#K-D58\">K-D58<\/a> 的边界需要人复核<\/strong>：<code>08<\/code> 说\"被换一片野区不重要\"，<code>09<\/code> 说\"被换之后容易滑向抢回来\"。什么情况下该按 08 走、什么情况下该按 09 走，素材只给了方向、没给分界，建议由懂版本的人补一条硬判据<\/li><li><strong>S45 数值待核<\/strong>：90 秒 / 70 秒是素材录制时的口径，版本未标注<\/li><\/ul>\n<h2>自检<\/h2>\n<ul><li>08：K 条目 7 条（<a class=\"kref\" href=\"#K-D53\">K-D53<\/a>~<a class=\"kref\" href=\"#K-D59\">K-D59<\/a>）<\/li><li>09：K 条目 7 条（<a class=\"kref\" href=\"#K-D60\">K-D60<\/a>~<a class=\"kref\" href=\"#K-D66\">K-D66<\/a>）<\/li><li>素材没覆盖的方面：其他分路的节拍换算、推进落地（带线/磨塔/越塔）、团队指挥与视野、逆风阈值与守家、团战残局、S45 实际刷新数值；素材一 BV1T8hG6FEtp 内容与主题不符，全程未采信<\/li><li>需要人复核的地方：① 08 与 09 的分界（<a class=\"kref\" href=\"#K-D58\">K-D58<\/a> 的\"不重要\"到什么程度转为 <a class=\"kref\" href=\"#K-D60\">K-D60<\/a> 的\"该止损\"），素材只有方向没有判据；② 90 秒/70 秒在 S45 是否成立；③ <a class=\"kref\" href=\"#K-D55\">K-D55<\/a>、<a class=\"kref\" href=\"#K-D66\">K-D66<\/a> 两条是作者框架/推论的延伸，需版本内实测确认；④ 实战片段为剪辑精选（作者自述），成功样本存在选择偏差<\/li><\/ul>", "sum": "适用版本：S45触发条件：逆风时看到一只小野，但要绕路或多花一拍才能拿到判断依据：小野的刷新周期只有 70 秒，作者的原话是\"很容易因为贪一个小野而打乱自己的节奏，导致节奏断裂\"（@ 06:4…"}]}, {"key": "D", "cat": "对局内", "title": "10 终结比赛", "file": "10_终结比赛.md", "intro": "<blockquote><p>素材：素材 2 为浅梦《打野教科书》（BV1oRJYzpEYb，12 位 KPL 职业打野第一视角，S45），本节只取其 27:38 之后的「终结能力」段落（10 分钟龙团 → 高地推进）。 素材 1（BV1B84y177A1，任务包标注为猫萌《金牌辅助教学》）的转写全文是 iPhone 16 产品评测，没有任何王者荣耀内容，<strong>故本节不产出辅助视角条目<\/strong>，11 条全部是打野视角。 上游接 <code>09<\/code>（优势建立后的第一波推进，节名待核对）；上一节留下的问题——「优势已经有了，下一步先动龙还是先动线」——由本卡从 10 分钟龙团接管。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：优势在手，先看有没有一条边路是优线        → K-D67\n第 2 步：9:30 有没有一路远端线带出去              → K-D68\n第 3 步：10 分钟选黑暗暴君还是暗影主宰            → K-D69\n第 4 步：黑暗暴君到手，这一分半该做什么            → K-D70\n第 5 步：暗影主宰到手 / 被对面拿了，各自的用途      → K-D71\n第 6 步：顺风龙团，打野站哪、什么时候开            → K-D72\n第 7 步：逆风龙团，接正面还是龙坑拉扯              → K-D73\n第 8 步：正面打不过，怎么换龙                      → K-D74\n第 9 步：两路齐进，推边高还是中高                  → K-D75\n第 10 步：高地团，打野切后排还是护线               → K-D76\n第 11 步：推塔时三路兵线怎么堵                     → K-D77<\/code><\/pre>", "entries": [{"id": "K-D67", "cat": "D", "title": "中后期没有一条优线，就不存在推进", "self": "<h3><a class=\"kref\" href=\"#K-D67\">K-D67<\/a> 中后期没有一条优线，就不存在推进<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦，KPL 职业打野第一视角；讲的是打野负责双边兵线运营）<\/li><li><strong>触发条件<\/strong>：手里有优势，准备推塔或上高地之前<\/li><li><strong>判断依据<\/strong>：中后期必须有一条边路是优线；如果全是劣线，是不可能做推进的（@ 24:39~24:46）。只有一路优线、被对面接掉让兵线平掉，三路一平就没有后续进攻节奏（@ 24:46~24:55）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有一条边路是优线 → 以这条线为推进起点，接着做连续进攻（@ 24:55~24:58）<\/li><li>全是劣线、或三路都平 → 先做线，不推进（@ 24:39~24:46）<\/li><li><strong>反例<\/strong>：优势在手直接抱团推中，三路兵线全平，推一波就被对面清出来（@ 24:51~24:55）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 24:39~24:58<\/li><li><strong>可信度<\/strong>：高（\"全是劣线不可能做推进\"是素材明说的结论，不是推论）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦，KPL 职业打野第一视角；"}, {"id": "K-D68", "cat": "D", "title": "9:30 必须有一路远端线带出去，远端优先于近端", "self": "<h3><a class=\"kref\" href=\"#K-D68\">K-D68<\/a> 9:30 必须有一路远端线带出去，远端优先于近端<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；这是打野在龙刷新前的落位问题）<\/li><li><strong>触发条件<\/strong>：9:30 到 10:00，10 分钟龙即将刷新<\/li><li><strong>判断依据<\/strong>：九分半到 10 分钟要一直看着远端线和近端线，一定要有一路带出去，且远端大于近端（@ 29:07~29:13）<\/li><li><strong>决策分支<\/strong>：<\/li><li>远端线能带出去 → 打野落位远端线，提前清掉 10 分钟前那波兵线（@ 29:18~29:22）<\/li><li>远端线带不出去 → 先把近端线处理掉，再回头做远端，否则没有开龙的前置（@ 29:07~29:13 的优先级）<\/li><li><strong>反例<\/strong>：9:30 之后还在中路、野区找架打，10 分钟前掉点（@ 29:29~29:35，素材原话\"路人局 10 分钟前掉点，是不是都掉在野区或者中路\"）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 29:07~29:35<\/li><li><strong>可信度<\/strong>：中（\"远端大于近端\"是明确结论；\"带不出去就先做近端\"是按这条优先级排出的执行顺序，素材未逐字展开）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D69", "cat": "D", "title": "10 分钟选龙看高地：高地没掉拿黑暗暴君，外塔推完拿暗影主宰", "self": "<h3><a class=\"kref\" href=\"#K-D69\">K-D69<\/a> 10 分钟选龙看高地：高地没掉拿黑暗暴君，外塔推完拿暗影主宰<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；打野是开龙的决策位）<\/li><li><strong>触发条件<\/strong>：10 分钟龙刷新，己方有优势但还没定打哪条<\/li><li><strong>判断依据<\/strong>：10 分钟时如果敌方高地没掉，优先选择对自身属性有增益的黑暗暴君（@ 27:53~27:59）；10 分钟或 10 分钟后已经把敌方外塔推完，就可以优先选择暗影主宰，用来打三线（@ 28:33~28:40）<\/li><li><strong>决策分支<\/strong>：<\/li><li>敌方高地还没掉 → 黑暗暴君（属性增益，服务于外塔推进和野区入侵）<\/li><li>外塔已推完、进入高地阶段 → 暗影主宰，打三线（@ 28:37~28:40）<\/li><li><strong>反例<\/strong>：10 分钟前先掉点，被对面顺势拿下龙后翻盘（@ 27:43~27:48，素材点名的路人局高频剧本）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 27:38~28:40<\/li><li><strong>可信度<\/strong>：高（两条都是带条件的明确判断，不是经验概括）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D70", "cat": "D", "title": "黑暗暴君买的是移速，不是伤害；拿完只做运线、推进、入侵", "self": "<h3><a class=\"kref\" href=\"#K-D70\">K-D70<\/a> 黑暗暴君买的是移速，不是伤害；拿完只做运线、推进、入侵<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；讲的是打野和双边带线时的被抓风险）<\/li><li><strong>触发条件<\/strong>：刚拿下黑暗暴君，接下来这一分半要决定干什么<\/li><li><strong>判断依据<\/strong>：两大增益是伤害和移速，移速最有用、也是最多人理解不到位的；中后期打野或双边带兵线都怕被抓，有移速不只是更快截断兵线，队友也能更快支援到位（@ 28:01~28:18）；没有黑暗暴君 Buff 的一方敢出来抓，就是等着一波猝死团（@ 28:20~28:24）<\/li><li><strong>决策分支<\/strong>：<\/li><li>Buff 在手 → 运线 / 推进 / 野区入侵，三选一（@ 28:24~28:29）<\/li><li>对面没 Buff 却出来抓 → 直接接，这正是猝死团（@ 28:20~28:24）<\/li><li><strong>反例<\/strong>：把黑暗暴君当纯伤害 Buff，拿完继续在野区、中路无目的地找人（@ 28:24~28:29 的\"只有三个行为\"就是反例清单）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 28:01~28:29<\/li><li><strong>可信度<\/strong>：中（\"移速最有用\"\"只有三个行为\"是明确结论；但 @ 28:26 原话\"运线五星推进\"转写不清，三类行为的准确措辞需回听核对）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D71", "cat": "D", "title": "暗影主宰既是终结道具也是防守道具，对面拿了会直接拖慢你", "self": "<h3><a class=\"kref\" href=\"#K-D71\">K-D71<\/a> 暗影主宰既是终结道具也是防守道具，对面拿了会直接拖慢你<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；换龙与拿龙都是打野决策）<\/li><li><strong>触发条件<\/strong>：进入高地阶段，主宰刷新；或对面正在打黑暗暴君<\/li><li><strong>判断依据<\/strong>：暗影主宰有两个用途——终结比赛、延缓节奏（@ 28:29~28:33）；敌方打黑暗暴君时，自己换龙拿暗影主宰，用处同样很大（@ 28:41~28:45）；反过来，对面拿到主宰可以用龙兵清线加减伤 Buff 稳守一路高地，大大延缓推进（@ 28:51~28:57）<\/li><li><strong>决策分支<\/strong>：<\/li><li>己方拿主宰 → 打三线，用龙兵清线推进（@ 28:37~28:40）<\/li><li>对面在打黑暗暴君 → 换龙拿主宰（@ 28:41~28:45）<\/li><li><strong>反例<\/strong>：只把主宰当\"推塔道具\"——一旦对面拿了，你的优势会被\"龙兵清线 + 减伤 Buff\"一点点拖掉（@ 28:51~28:57）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 28:29~28:57<\/li><li><strong>可信度<\/strong>：高（\"两个用途\"与\"延缓推进\"都是明说；但对面拿到主宰后的具体反制，素材没给）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D72", "cat": "D", "title": "顺风 10 分钟龙团：打野站远端线，对面分人管线就直接开黑暗暴君", "self": "<h3><a class=\"kref\" href=\"#K-D72\">K-D72<\/a> 顺风 10 分钟龙团：打野站远端线，对面分人管线就直接开黑暗暴君<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；这是顺风局打野的落位与开龙时机）<\/li><li><strong>触发条件<\/strong>：顺风，9:30 之后准备 10 分钟龙团<\/li><li><strong>判断依据<\/strong>：带线在九分半后，打野的落位在远端线，提前清理掉 10 分钟前的兵线（@ 29:18~29:22）；如果敌方后续分人来管这波远端劣势线，就可以直接开黑暗暴君，敌方人少、来不及打龙团（@ 29:22~29:28）<\/li><li><strong>决策分支<\/strong>：<\/li><li>敌方分人来接线 → 直接开黑暗暴君（@ 29:22~29:28）<\/li><li>敌方不来接线、正面人齐 → 不硬开，继续用远端线牵制（前置条件就是 <a class=\"kref\" href=\"#K-D68\">K-D68<\/a> 的\"必须有一路带出去\"@ 29:07~29:13）<\/li><li><strong>反例<\/strong>：顺风不站远端线，在中路、野区找架打——素材原话\"路人局 10 分钟前掉点，是不是都掉在野区或者中路\"（@ 29:29~29:35）<\/li><li><strong>职业/路人局差别<\/strong>：这是职业队\"带线牵制 → 敌方分人 → 开龙\"的三方联动；素材在同类协同段落里明说\"路人局在不开麦的情况下难以实现\"（@ 30:19），所以路人局更常见的是队友不来接线、也不来打龙<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 29:16~29:35、30:19<\/li><li><strong>可信度<\/strong>：中（\"敌方人少来不及\"没有人数阈值，素材未量化，需要按实际人数复核）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D73", "cat": "D", "title": "逆风 10 分钟龙团：单边劣接正面，双边劣龙坑拉扯", "self": "<h3><a class=\"kref\" href=\"#K-D73\">K-D73<\/a> 逆风 10 分钟龙团：单边劣接正面，双边劣龙坑拉扯<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；逆风局的龙团取舍）<\/li><li><strong>触发条件<\/strong>：逆风，10 分钟龙刷新，己方要不要接这波龙团<\/li><li><strong>判断依据<\/strong>：逆风看双边兵线，单边劣可以接龙团、打正面对抗，和 4 分钟龙团同理（@ 29:37~29:44）；双边劣就要做龙坑拉扯，防御塔会帮忙清理掉劣势线（@ 29:48~29:52）；如果正面能击退敌方，就可以抢占长草的同时把视野排开，等双边兵线缓和（@ 29:52~29:56）<\/li><li><strong>决策分支<\/strong>：<\/li><li>单边劣 → 接正面（@ 29:39~29:41）<\/li><li>双边劣 → 龙坑拉扯，靠防御塔清劣势线（@ 29:48~29:52）<\/li><li>双边劣但正面击退了 → 抢长草、排视野，等兵线缓和再谈开龙（@ 29:52~29:56）<\/li><li><strong>反例<\/strong>：双边劣还正面接龙团（@ 29:48）<\/li><li><strong>职业/路人局差别<\/strong>：素材明说这套\"路人局在不开麦的情况下难以实现\"（@ 30:19），路人局先执行\"双边劣就拉扯\"这一支，别指望三线协同<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 29:37~29:56、30:19<\/li><li><strong>可信度<\/strong>：高（三支都有对应的兵线前提，逻辑闭合）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D74", "cat": "D", "title": "正面打不过就换龙：前置优暴君远端线加中路，用中上优的半图视野把对面困在下半图", "self": "<h3><a class=\"kref\" href=\"#K-D74\">K-D74<\/a> 正面打不过就换龙：前置优暴君远端线加中路，用中上优的半图视野把对面困在下半图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；换龙是打野能控制的变量）<\/li><li><strong>触发条件<\/strong>：10 分钟龙团正面打不过，或正面刚打完一波残局<\/li><li><strong>判断依据<\/strong>：前置在九分半先把上路兵线优一波；正面打完自家掉两个、敌方交了全部大招（@ 30:24~30:31）；这时把中路兵线也优出去，中上优对应的半图视野都能提供，把没技能的敌方困在下半图，就可以做到换龙（@ 30:37~30:47）<\/li><li><strong>决策分支<\/strong>：<\/li><li>正面打得过 → 既赚暴君也赚兵线（@ 30:53~30:55）<\/li><li>正面打不过 → 用中路加兵线优势做换龙（@ 30:57~30:58）<\/li><li>前置没优暴君远端线 → 换龙不成立（@ 30:48~30:51）<\/li><li><strong>反例<\/strong>：正面打不过还硬顶龙团（@ 30:57）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 30:21~31:01<\/li><li><strong>可信度<\/strong>：中（\"困在下半图\"依赖\"敌方技能全交\"这个前提 @ 30:31，不是每波都能复现）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D75", "cat": "D", "title": "两路齐进优先推边高，不推中高", "self": "<h3><a class=\"kref\" href=\"#K-D75\">K-D75<\/a> 两路齐进优先推边高，不推中高<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；高地推进的路线选择）<\/li><li><strong>触发条件<\/strong>：拿完 10 分钟黑暗暴君，两条兵线同时到位，准备上高地<\/li><li><strong>判断依据<\/strong>：10 分钟黑暗暴君之后，上路兵线和中路兵线速率相近，这就是两路齐进的推进线（@ 31:15~31:18）；可以选择其中一路做推进，优先推边高，因为边路高地推进最安全高效（@ 31:20~31:24）；推中高会被两面夹击、打起来比较散乱，推边高靠着地图边缘、五人阵型不会乱（@ 31:27~31:36）<\/li><li><strong>决策分支<\/strong>：<\/li><li>两路兵线速率相近 → 选一路推，优先边高（@ 31:20~31:24）<\/li><li>目标落在中高 → 阵型会被两面夹击，不作为首选（@ 31:28~31:30）<\/li><li><strong>反例<\/strong>：有优势就抱团推中高（@ 31:28~31:30）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 31:10~31:36<\/li><li><strong>可信度<\/strong>：高（给了地形理由，不是单纯经验）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D76", "cat": "D", "title": "高地团打野只有两个出发点：切入或护线，切不动就护线", "self": "<h3><a class=\"kref\" href=\"#K-D76\">K-D76<\/a> 高地团打野只有两个出发点：切入或护线，切不动就护线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；这是野核在高地团的切入思路）<\/li><li><strong>触发条件<\/strong>：有两路推进线，兵线即将进高地塔<\/li><li><strong>判断依据<\/strong>：一旦有两路推进线，对打野来说只有两个出发点——切入和护线（@ 31:45~31:50）；墨子在后排卡位切入不好做，狂铁身位想顶前摸线、切入难度高；哪怕成功切了后排，线被狂铁顶掉，推进依旧是失败的（@ 31:50~32:00）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面卡位、顶线强（墨子卡位、狂铁顶线）→ 护线优先：兵线进塔前防止狂铁摸线，用大招逼退（@ 32:03~32:06）<\/li><li>能摸到后排且线安全 → 切入（@ 31:45~31:48）<\/li><li><strong>反例<\/strong>：只想着\"我要切后排\"，线被对面顶掉，推进照样失败（@ 31:56~31:59）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 31:39~32:06<\/li><li><strong>可信度<\/strong>：高（\"切了后排但线掉了也算失败\"是明确的判定标准）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}, {"id": "K-D77", "cat": "D", "title": "推塔时堵线：不让敌方兵线跑出来，主宰龙兵用来做三线齐进", "self": "<h3><a class=\"kref\" href=\"#K-D77\">K-D77<\/a> 推塔时堵线：不让敌方兵线跑出来，主宰龙兵用来做三线齐进<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>视角<\/strong>：打野（浅梦；龙兵与堵线的配合）<\/li><li><strong>触发条件<\/strong>：队友正在推高地塔，或刚打完暗影主宰<\/li><li><strong>判断依据<\/strong>：队友在推塔时就要看三路兵线，不要让敌方兵线跑出来，这样才能持续有自家兵线做推进、加快终结（@ 32:34~32:41）；猪八戒打完主宰龙后，中下能堵线、上路有高地、下路没有主宰龙兵，就直接放上和中下的队友同时清掉这波兵线，下一波就是三线齐进（@ 33:07~33:21）；护住中下超级兵和对面拉扯，对面就没有足够人手去守上路（@ 33:21~33:28）；上高破掉后第一时间把战场切到上路，用主宰的减伤 Buff 和对面正面作战（@ 33:28~33:35）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有主宰龙兵的一路 → 用龙兵清线、堵线（@ 33:13~33:19）<\/li><li>没有龙兵的一路 → 先放掉，集中人力到能堵的两路，等下一波三线齐进（@ 33:15~33:21）<\/li><li>上高破掉 → 战场立刻切到上路，带着减伤 Buff 正面接（@ 33:28~33:35）<\/li><li><strong>反例<\/strong>：三路都想推、人不齐，敌方兵线跑出来把线清掉，推进节奏断掉（@ 32:36~32:38）<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 32:34~33:35<\/li><li><strong>可信度<\/strong>：高（堵线、放线、切战场三步在同一段录像里连续演示）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>辅助视角的全部内容<\/strong>：视野布控、开团先手、保 C 站位、辅助装在推进期的用法——素材 1 的转写全文是 iPhone 16 评测（含充电宝口播、相机按键分析），与王者荣耀无关，需换一份真正的辅助教学素材重做这一半<\/li><li><strong>@ 28:26「运线五星推进」转写不清<\/strong>：黑暗暴君到手后的三类行为，第二、三项的准确措辞需回听原片核对<\/li><li><strong>对面拿到暗影主宰后的反制<\/strong>：素材只说了\"龙兵清线 + 减伤 Buff 会稳守一路高地、大大延缓推进\"，没给具体拆解打法<\/li><li><strong>只有一路推进线时的高地选择<\/strong>：素材只讲了\"两路齐进\"的情形<\/li><li><strong>开团时机与开团手<\/strong>：素材讲的是打野的切入/护线，没有\"谁先开、开谁、开到什么程度算开成了\"的判定<\/li><li><strong>破高地到拆水晶这一段<\/strong>：素材止于上高破掉、战场切上路，水晶前的处理没讲<\/li><li><strong>逆风反推路径<\/strong>：只讲了逆风怎么接 10 分钟龙团，没讲怎么从守转攻<\/li><li><strong>人数阈值与语音依赖<\/strong>：@ 29:28「敌方人少」、@ 30:19「不开麦难以实现」都没有量化<\/li><li><strong>上游核对<\/strong>：本卡只读到任务包，未读到 <code>09<\/code> 原文，<code>depends_on<\/code> 的节号与\"上一节留下的分支\"需与库内文件核对<\/li><li><strong><a class=\"kref\" href=\"#K-D78\">K-D78<\/a> 未使用<\/strong>：素材在该区间能支撑的独立判断已归并到 11 条，不为凑号拆条注水<\/li><\/ul>", "sum": "适用版本：S45视角：打野（浅梦；"}]}, {"key": "D", "cat": "对局内", "title": "梦辰溪_专注王者教学 · 视频索引（未转写）", "file": "梦辰溪视频索引.md", "intro": "<blockquote><p>mid 1078678010 ｜ 全部 18 条投稿，按主题归类。<\/p><\/blockquote>\n<blockquote><p><strong>重要<\/strong>：B 站对本 UP 的视频<strong>不返回任何可用字幕<\/strong>（无 CC、无 AI，旧接口给的是与视频错配的幽灵内容）。因此本页仅作<strong>真实视频索引<\/strong>，正文内容暂未提炼进卡片。<\/p><\/blockquote>\n<blockquote><p>需要真正消化内容 → 须对视频做音频转写（whisper 等），详见信源名单第十一节。<\/p><\/blockquote>\n<h2>一、英雄专项（标题即主题，可作候选素材）<\/h2>\n<ul><li><a href=\"https://www.bilibili.com/video/BV1
