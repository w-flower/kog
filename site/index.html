<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王者荣耀实战知识库 · S45</title>
<meta name="description" content="按英雄查的王者荣耀决策手册：怎么玩、打谁舒服、被谁克、这一刻该干什么。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<style>
/* ══════════════════════════════════════════════════════════
   kog 站点样式 —— 英雄宫格 + 折叠卡
   改配色只改 :root 变量；组件规则一般不用动
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232d; --line:#28313d; --line2:#333e4c;
  --fg:#e8eef5; --fg2:#98a5b3; --fg3:#6d7887;
  --accent:#f0b429; --accent2:#5aa2ff; --ok:#3fb950; --bad:#f85149;
  --r:16px; --r-s:11px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef1f5; --line:#e2e7ee; --line2:#cfd7e2;
  --fg:#161b22; --fg2:#5a6672; --fg3:#8b98a6;
  --accent:#b57d00; --accent2:#1266d6;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 24px -14px rgba(16,24,40,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:15.5px; line-height:1.85; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono); font-size:.88em; padding:.1em .38em; border-radius:5px;
  background:var(--bg3); border:1px solid var(--line);
}

/* ─────────── 顶栏 ─────────── */
.top{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:12px clamp(16px,4vw,32px); background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; color:var(--fg); flex:none}
.brand:hover{text-decoration:none}
.logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#12161c;
  background:linear-gradient(145deg,#ffd76a,#e8a01c);
}
.bt{display:flex;align-items:baseline;gap:7px;font-size:15px;letter-spacing:.2px}
.bt b{font-weight:700}
.bt i{font-style:normal;font-size:11.5px;color:var(--fg3);border:1px solid var(--line2);
  padding:1px 6px;border-radius:20px}
.search{
  flex:1; display:flex; align-items:center; gap:8px; max-width:520px;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:0 12px; height:42px; transition:border-color .15s;
}
.search:focus-within{border-color:var(--accent2)}
.search svg{width:15px;height:15px;fill:var(--fg3);flex:none}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:var(--fg);
  font:inherit;font-size:14.5px;
}
.icon-btn{
  flex:none;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--fg2);
}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round}

/* ─────────── 版心 ─────────── */
.wrap{max-width:1080px;margin:0 auto;padding:clamp(26px,4vw,46px) clamp(16px,4vw,32px)}

.hero-head{margin:0 0 26px}
.eyebrow{font-size:12.5px;color:var(--fg3);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(25px,4.2vw,34px);line-height:1.3;margin:0 0 10px;letter-spacing:-.4px}
.lede{color:var(--fg2);margin:0;max-width:56ch;font-size:15px;line-height:1.8}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h h2{font-size:16px;margin:0;letter-spacing:.3px}
.sec-h span{font-size:12.5px;color:var(--fg3)}

/* ─────────── 英雄宫格 ─────────── */
.grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
.hcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.hcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.avatar{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:20px;letter-spacing:0;
  color:hsl(var(--h) 85% 80%);
  background:
    radial-gradient(circle at 32% 26%, hsl(var(--h) 60% 34%), hsl(var(--h) 70% 15%));
  border:1px solid hsl(var(--h) 55% 42% / .55);
  box-shadow:inset 0 0 14px hsl(var(--h) 80% 40% / .28);
}
html[data-theme="light"] .avatar{
  color:hsl(var(--h) 72% 30%);
  background:radial-gradient(circle at 32% 26%, hsl(var(--h) 80% 92%), hsl(var(--h) 70% 82%));
  border-color:hsl(var(--h) 60% 70%);
  box-shadow:none;
}
.hname{font-weight:650;font-size:15.5px;line-height:1.3}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pill{
  font-size:11.5px;padding:1.5px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg3);color:var(--fg2);line-height:1.6;white-space:nowrap;
}
.pill.a{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.b{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.l{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.g{color:var(--fg3)}

/* ─────────── 分路卡 ─────────── */
.lcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.lcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.lmotto{font-size:12px;color:var(--fg3);line-height:1.5}
.klink{
  display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--fg2);font-size:13.5px;
}
.klink:hover{text-decoration:none;border-color:var(--line2);color:var(--fg)}
html[data-theme="light"] .pill.l{color:#2f5c96;border-color:#c5d7ee;background:#eef4fb}

/* ─────────── 通用卡（对局内 / BP / 文档） ─────────── */
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gcard{
  display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);color:var(--fg);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s;
}
.gcard:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--line2)}
.gicon{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  font-size:20px;background:var(--bg3);border:1px solid var(--line);
}
.gtxt{min-width:0}
.gtxt b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.gtxt span{display:block;font-size:12.5px;color:var(--fg3);line-height:1.55}

/* ─────────── 折叠卡（条目） ─────────── */
.entry{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden;
}
.entry+.entry{margin-top:10px}
.entry>summary{
  list-style:none;cursor:pointer;padding:15px 18px;display:grid;
  grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary:hover{background:var(--bg3)}
.entry .id{
  font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:3px;
  letter-spacing:.02em;white-space:nowrap;
}
.entry .tt{min-width:0}
.entry .tt b{display:block;font-size:15.5px;font-weight:650;line-height:1.5}
.entry .tt span{
  display:block;font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.7;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.entry .chev{
  width:20px;height:20px;flex:none;margin-top:3px;color:var(--fg3);
  transition:transform .18s ease;
}
.entry[open] .chev{transform:rotate(90deg)}
.entry .body{
  padding:2px 20px 18px 20px;border-top:1px solid var(--line);margin-top:2px;
  font-size:15px;color:var(--fg);max-width:74ch;
}
.entry .body p{margin:.85em 0}
.entry .body ul,.entry .body ol{padding-left:1.25em;margin:.8em 0}
.entry .body li{margin:.35em 0}
.entry .body blockquote{
  margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);
  background:var(--bg3);border-radius:0 10px 10px 0;color:var(--fg2);font-size:14.5px;
}
.entry .body h4{font-size:14px;margin:1.2em 0 .5em;color:var(--fg2);letter-spacing:.3px}
.entry .body table{
  width:100%;border-collapse:collapse;margin:1em 0;font-size:14px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.entry .body th,.entry .body td{
  border:1px solid var(--line);padding:8px 12px;text-align:left;
}
.entry .body th{background:var(--bg3);font-weight:600;color:var(--fg2)}
.kref{font-family:var(--mono);font-size:.9em;padding:0 .3em;border-radius:4px;
  background:var(--bg3);border:1px solid var(--line);color:var(--accent2)}
.opp{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--fg2);background:var(--bg3);margin-left:8px;
  vertical-align:2px}

/* ─────────── 英雄详情头 ─────────── */
.hhead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex-wrap:wrap}
.hhead .avatar{width:74px;height:74px;font-size:30px;border-radius:24px}
.hhead h1{margin:0;font-size:clamp(23px,4vw,30px)}
.hhead .hmeta{margin-top:6px}
.back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg3);
  margin-bottom:14px;
}
.back:hover{color:var(--fg2);text-decoration:none}

/* ─────────── 文档页（长文） ─────────── */
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.doc-nav a{
  font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);
}
.doc-nav a:hover,.doc-nav a.on{border-color:var(--accent2);color:var(--fg);text-decoration:none}
.doc h2{font-size:19px;margin:2em 0 .8em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:1.8em 0 .6em}
.doc p{margin:.9em 0;max-width:74ch}
.doc ul,.doc ol{padding-left:1.3em;max-width:74ch}
.doc li{margin:.4em 0}
.doc blockquote{
  margin:1.2em 0;padding:.8em 1.1em;border-left:3px solid var(--accent);
  background:var(--bg2);border-radius:0 12px 12px 0;color:var(--fg2);
}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc table{
  width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px;
  display:block;overflow-x:auto;
}
.doc th,.doc td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
.doc th{background:var(--bg3);font-weight:600;color:var(--fg2);white-space:nowrap}
.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 60%,var(--bg))}

/* ─────────── 搜索结果 ─────────── */
.res-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);
}
.res-item .id{font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:4px;flex:none}
.res-item b{font-weight:650}
.res-item span{display:block;font-size:13px;color:var(--fg2)}
.empty{color:var(--fg3);padding:40px 0;text-align:center}

/* ─────────── 页脚 ─────────── */
.foot{
  max-width:1080px;margin:60px auto 0;padding:22px clamp(16px,4vw,32px) 0;
  border-top:1px solid var(--line);color:var(--fg3);font-size:12.5px;
}

/* ─────────── 响应式 ─────────── */
@media (max-width:720px){
  body{font-size:15px}
  .top{gap:8px;padding:10px 14px}
  .bt b{font-size:14px}
  .logo{width:29px;height:29px;font-size:14.5px}
  .search{height:38px}
  .search input{font-size:14px}
  .icon-btn{width:38px;height:38px}
  .wrap{padding:22px 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .hcard{padding:13px 10px 11px;align-items:center;text-align:center;gap:8px}
  .avatar{width:44px;height:44px;font-size:17.5px}
  .hname{font-size:13.5px}
  .hmeta{justify-content:center}
  .pill{font-size:10.5px;padding:1px 6px}
  .entry>summary{padding:13px 14px;gap:9px;grid-template-columns:1fr auto}
  .entry .id{display:none}
  .entry .body{padding:2px 14px 15px}
  .hhead .avatar{width:58px;height:58px;font-size:23px;border-radius:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.foot{display:none}.entry>summary{grid-template-columns:1fr}.entry .body{display:block!important}}

</style>
</head>

中把敌人拉回来 → 让防御塔补伤害<\/li><li><strong>反例<\/strong>：「大招是团控，留着打团」——单杀阶段把人大招拉进塔，是最省技能的杀法。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 04:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标在塔的射程边缘，且你敢吃一发塔伤判断依据：大招的拉回方向能否把目标拉进塔下决策分支：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害反例：「大招是团控，留着打团」——单杀阶…"}, {"id": "K-A17", "cat": "A", "title": "用扇子探草：命中会回能", "self": "<h3><a class=\"kref\" href=\"#K-A17\">K-A17<\/a> 用扇子探草：命中会回能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：进草前、支援路上<\/li><li><strong>判断依据<\/strong>：扇子出手后能量有没有涨<\/li><li><strong>决策分支<\/strong>：能量涨了 → 草里有人，别进去；没涨 → 可以走<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:10<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A18\">K-A18<\/a> 对线期第一波线别靠前（对面是钩子类辅助时）<\/h3>\n<p>这条是<strong>中路对线期的通用纪律<\/strong>，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L06\">K-L06<\/a><\/code>。火舞的特殊点在于她<strong>清线慢<\/strong>（抢不动也躲不开），所以对她来说这条不是\"建议\"而是\"必须\"。<\/p>\n<h2>5. 出装与铭文<\/h2>\n<p><strong>结论：暂不写入具体铭文组合。<\/strong><\/p>\n<p>原因：标题带\"出装铭文\"的两期，一期是 2020 年（BV1v541187YZ），一期是 2024-06（BV12b421H7sY，S36）；2026 年那条（BV1Td9EBKE9S）字幕里只有一句\"还有不知火舞的出装铭文\"就结束了，<strong>具体条目没有被 ASR 转录出来<\/strong>。ASR 对铭文名（梦魇/心眼/狩猎）的识别错误率高，硬写等于编。<\/p>\n<p><strong>能确认的只有一条思路<\/strong>：出装要围绕\"减魔抗 + 爆发\"，因为她的伤害模型就是扇子标记后一套带走；对面出了魔女斗篷时，原话是\"他现在这套装备就是秒他，但是他出了魔女咱们秒不掉\"——遇到魔女要改路线，不要硬堆法强。<\/p>\n<ul><li>来源：BV1v541187YZ @ 12:19（魔女斗篷的应对）<\/li><li>待补：S45 具体六件套顺序、铭文红蓝绿配置，需要一条 2026-09 之后、标题明确标\"出装铭文\"且<strong>有字幕<\/strong>的视频，或官网英雄页/助手数据核对。<\/li><\/ul>\n<h2>6. 最容易崩的三个地方<\/h2>\n<ol><li><strong>能量不够硬进团<\/strong> → 进去放不出三段，等于送。<\/li><li><strong>不会取消后摇<\/strong> → 一模一样的操作，别人打完能翻滚走，你还在原地收招。<\/li><li><strong>把一闪当输出用<\/strong> → 交完闪现又没杀掉，接下来 90 秒你没有开团手段。<\/li><\/ol>\n<h2>7. 待补<\/h2>\n<ul><li>各技能精确数值（CD、能量消耗、大招拉回距离）未从素材获得。<\/li><li>强势期/弱势期：素材多为顺风或均势局，逆风下限没有样本。<\/li><li>与具体英雄的对位结论见 <code>B_克制关系/<\/code>（目前无火舞条目）。<\/li><\/ul>", "sum": "这条是中路对线期的通用纪律，已迁到 L_分路/01_中路.md 的 K-L06。"}], "b": [], "lanes": ["mid"], "n": 7, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "苏烈", "hue": 273, "a": [{"id": "K-A01", "cat": "A", "title": "苏烈的核心是\"第三棍\"和\"二技能\"，不是大招", "self": "<h3><a class=\"kref\" href=\"#K-A01\">K-A01<\/a> 苏烈的核心是\"第三棍\"和\"二技能\"，不是大招<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何需要苏烈先手的局面<\/li><li><strong>判断依据<\/strong>：对面站位是否进入三段普攻的追击距离；二技能冷却是否可用<\/li><li><strong>决策分支<\/strong>：<\/li><li>二技能可用 → 优先用它把对面的开团手<strong>推离<\/strong>，或者把落单的人<strong>推回<\/strong>队友方向<\/li><li>二技能不可用 → 不要用大招硬开，改打三棍逼退<\/li><li><strong>反例<\/strong>：「辅助的大招就是用来开团的」——苏烈大招蓄力期间不能动，盲目蓄力等于把自己钉在原地等人集火。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:21；BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何需要苏烈先手的局面判断依据：对面站位是否进入三段普攻的追击距离；"}, {"id": "K-A02", "cat": "A", "title": "二技能有两个完全不同的用途，别只用一个", "self": "<h3><a class=\"kref\" href=\"#K-A02\">K-A02<\/a> 二技能有两个完全不同的用途，别只用一个<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：二技能可用时<\/li><li><strong>判断依据<\/strong>：对面有没有正在进行的位移/突进技能<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>挡<\/strong>：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间<\/li><li><strong>推<\/strong>：抓落单时把目标推向队友方向，不是推离<\/li><li><strong>反例<\/strong>：「二技能就是个位移」——它同时是<strong>拦截<\/strong>手段。挡下一次开团的价值，往往高于推一个人。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 02:21<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：二技能可用时判断依据：对面有没有正在进行的位移/突进技能决策分支：挡：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间推：抓落单时把目标推向队友方向…"}, {"id": "K-A03", "cat": "A", "title": "被动是资源，不是保命符", "self": "<h3><a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 被动是资源，不是保命符<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每次准备进场前<\/li><li><strong>判断依据<\/strong>：被动是否可用（有 / 无）；队友是否在附近能\"点灯\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有被动 → 可以硬吃一波伤害，打出被动后还能给附近的双 C 回血<\/li><li>无被动 → <strong>不许硬接<\/strong>，只能打边缘消耗<\/li><li><strong>反例<\/strong>：「我是肉辅，先冲进去扛」——没被动时苏烈就是一个普通近战，进去等于送人头。字幕里出现过\"没点到灯，不然可以二技能跑\"，说明<strong>被动依赖队友点亮<\/strong>，队友不在时它根本不算数。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:00；BV1yke26fEYB @ 04:14；BV1yke26fEYB @ 06:31<\/li><li><strong>可信度<\/strong>：中高（\"点灯\"细节来自实战解说，非二手攻略）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A04\">K-A04<\/a> 前期不要抢打野的尾刀<\/h3>\n<p>这条<strong>跟苏烈无关<\/strong>，是游走通用纪律，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code>。原来源 BV1yke26fEYB @ 02:28 一并带过去。<\/p>\n<h2>4. 出装与铭文（两套，按位置选）<\/h2>\n<p><strong>打对抗路（边路）<\/strong><\/p>\n<ul><li>铭文：<strong>10 狩猎 + 10 鹰眼 + 10 异变<\/strong>（\"百穿\"，狩猎是为了保攻速）<\/li><li>出装：对线强 → 先荆棘护手；对线不强 → 攻速鞋 → <strong>第二件必出暗影战斧<\/strong>（给 CD + 穿透 + 输出）→ 荆棘护手升反甲<\/li><li>来源：BV1BpdNYZEYj @ 04:54、@ 03:56、@ 04:11<\/li><\/ul>\n<p><strong>打游走（辅助）<\/strong><\/p>\n<ul><li>铭文：<strong>10 宿命 + 5 狩猎 + 5 调和 + 10 虚空<\/strong>（苏烈要兼顾开团，移速和坦度都得有）<\/li><li>出装：前期疾跑鞋（方便支援）→ 中后期换抵抗之靴（提高容错）；辅助装按对局选（射手需要主动上前时先做星泉）<\/li><li>来源：BV17Vp9zXEx2 @ 01:10、@ 01:17、@ 01:32<\/li><\/ul>\n<p><strong>两条共同点<\/strong>：都不是\"堆输出\"的思路，铭文都在补攻速/移速/坦度，因为苏烈的核心是<strong>把控制打出来<\/strong>，不是自己打伤害。<\/p>\n<ul><li>版本提示：两条素材都未标 S45（浩克是训练营通用向、云兽是解析 AG 大帅的职业打法），<strong>具体装备数值以游戏内为准<\/strong>，配置结构可直接照用。<\/li><\/ul>\n<h2>5. 全局思路（辅助位）<\/h2>\n<blockquote><p><strong>分路层面<\/strong>的通用做法（开局去哪、怎么帮中、怎么跟射手）已统一收进 <code>L_分路/02_游走.md<\/code>，这一节只留苏烈自己的东西。<\/p><\/blockquote>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A05\">K-A05<\/a> 开局：连人带兵一起消耗，而不是单纯抢线<\/h3>\n<p>这是<strong>游走通用动作<\/strong>（任何有消耗手段的辅助都该这么打），已迁到 <code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code>。<\/p>", "sum": "这条跟苏烈无关，是游走通用纪律，已迁到 L_分路/02_游走.md 的 K-L13。"}, {"id": "K-A06", "cat": "A", "title": "被动要主动用，别舍不得", "self": "<h3><a class=\"kref\" href=\"#K-A06\">K-A06<\/a> 被动要主动用，别舍不得<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：有被动且能吃一波关键伤害<\/li><li><strong>判断依据<\/strong>：这波吃了之后，队友能不能跟着打赢<\/li><li><strong>决策分支<\/strong>：该触就触；触发后给附近双 C 回血，是团队收益<\/li><li><strong>反例<\/strong>：「留着被动保命」——原话直接说\"很多苏烈会舍不得触发被动，这点是错误的\"。<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:32<\/li><li><strong>可信度<\/strong>：高（与原 <a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 一致，互为印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：有被动且能吃一波关键伤害判断依据：这波吃了之后，队友能不能跟着打赢决策分支：该触就触；"}, {"id": "K-A07", "cat": "A", "title": "开团前必须和队友沟通好\"帮你踩灯\"", "self": "<h3><a class=\"kref\" href=\"#K-A07\">K-A07<\/a> 开团前必须和队友沟通好\"帮你踩灯\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备先手开团<\/li><li><strong>判断依据<\/strong>：周围有没有队友能点亮你的被动<\/li><li><strong>决策分支<\/strong>：先打字/信号确认，再开团；没人踩灯就不要主动吃伤害<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:07<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 新手最容易崩在哪一步<\/h2>\n<ul><li><strong>在第 0 步（确认被动）上<\/strong>：忘记看被动，进场被判死一次之后整局都不敢开团，从\"开节奏\"退化成\"挂机跟团\"。<\/li><li><strong>在第 3 步（三棍）上<\/strong>：打两棍就急着交二技能，第三段击飞永远打不出来——苏烈的控制全在第三棍上。<\/li><\/ul>\n<h2>5. 待补<\/h2>\n<ul><li>具体数值（被动冷却、大招蓄力时长、二技能距离）<strong>未从素材中获得<\/strong>，需官网英雄页核对后补。<\/li><li>对抗路/辅助两套配置已补（见第 4 节），但都未标 S45，数值需游戏内核对。<\/li><li>强势期/弱势期缺素材（该视频是顺风局，看不出逆风时苏烈的下限）。<\/li><\/ul>", "sum": "触发条件：准备先手开团判断依据：周围有没有队友能点亮你的被动决策分支：先打字/信号确认，再开团；"}], "b": [{"id": "K-B01", "cat": "B", "title": "对孙策：机制克——二技能能挡下他的船", "self": "<h3><a class=\"kref\" href=\"#K-B01\">K-B01<\/a> 对孙策：机制克——二技能能挡下他的船<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：孙策（开大冲脸）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong><\/li><li><strong>我该怎么做<\/strong>：孙策开大的一瞬间，把二技能放在<strong>他和自家 C 位之间<\/strong>，用身位当墙。挡下来之后不要追，退回 C 位旁边。<\/li><li><strong>反向反制<\/strong>：孙策可以等你二技能交完再开船；所以<strong>二技能不要提前交在别的地方<\/strong>。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中（单来源实战解说）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：孙策（开大冲脸）克制层级：机制克我该怎么做：孙策开大的一瞬间，把二技能放在他和自家 C 位之间，用身位当墙。", "opp": "孙策"}, {"id": "K-B02", "cat": "B", "title": "对云缨：她的霸体期间你什么都做不了，等结束再推", "self": "<h3><a class=\"kref\" href=\"#K-B02\">K-B02<\/a> 对云缨：她的霸体期间你什么都做不了，等结束再推<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：云缨（大招霸体）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>苏烈被克<\/strong>，不是克别人<\/li><li><strong>我该怎么做<\/strong>：云缨开大期间不要试图控制她，<strong>等霸体结束<\/strong>再往队友方向推。<\/li><li><strong>反例<\/strong>：「我是硬辅，控住就行」——霸体期间控制无效，你的三棍和大招全部白交，还把自己留在她身边。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:55；BV1yke26fEYB @ 04:57<\/li><li><strong>可信度<\/strong>：中高（解说里明确说了\"他的大招有霸体，插不了火，等他结束往宫本那边推\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>苏烈怕哪些远程消耗型辅助（无素材）<\/li><li>苏烈对软辅（大乔、蔡文姬类）的压制关系（无素材）<\/li><li>以上两条需要专门的\"对位\"视频，<code>B_克制关系/_说明.md<\/code> 已记门槛<\/li><\/ul>", "sum": "适用版本：S45针对对手：云缨（大招霸体）克制层级：机制克（反向）——这条是苏烈被克，不是克别人我该怎么做：云缨开大期间不要试图控制她，等霸体结束再往队友方向推。", "opp": "云缨"}], "lanes": ["roam"], "n": 7, "b_n": 2, "vs": ["云缨", "孙策"], "incoming": [], "lane_names": ["游走"]}, {"name": "女娲", "hue": 123, "a": [{"id": "K-A71", "cat": "A", "title": "女娲前期没有线权，别抢", "self": "<h3><a class=\"kref\" href=\"#K-A71\">K-A71<\/a> 女娲前期没有线权，别抢<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：开局对线<\/li><li><strong>判断依据<\/strong>：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）<\/li><li><strong>决策分支<\/strong>：<\/li><li>抢不过 → 一技能丢四个兵就往后走，<strong>保血线<\/strong><\/li><li>抢得过 → 正常推，但别越塔<\/li><li><strong>反例<\/strong>：「中单必须抢线」——女娲前期 CD 长、伤害低，被打掉状态后连野区防守都参与不了。<\/li><li><strong>通用面<\/strong>：「线权看对面清线速度」本身是中路通用判据，见 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。这条留在英雄卡里的部分只有<strong>女娲自己的强度曲线<\/strong>（前期 CD 长、伤害低）。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 02:41<\/li><li><strong>可信度<\/strong>：高（原话直接给了判断与后果）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：开局对线判断依据：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）决策分支：抢不过 → 一技能丢四个兵就往后走，保血线抢得过 → 正常推，但别越塔反例：「中单必须抢线」——女娲前…"}, {"id": "K-A72", "cat": "A", "title": "支援靠三技能，但传送会被打断", "self": "<h3><a class=\"kref\" href=\"#K-A72\">K-A72<\/a> 支援靠三技能，但传送会被打断<\/h3>", "ht ong>：女娲最强的用法是\"传侧面打后排\"，站正面输出等于浪费被动。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>完整六件套顺序。<\/li><li>S45 版本是否调整过被动/施法距离成长。<\/li><li>对位结论（现无 <code>B_克制关系/女娲.md<\/code>；已有海月视角一条，可补反向）。<\/li><\/ul>", "sum": "触发条件：任何要打控制链的时刻判断依据：当前场上还有几个方块（可存 3 个）决策分支：有 2 个 → 合长方形夹人有 4 个 → 合大正方形封路反例：「方块丢出去就行」——不会合的方块只是占位…"}], "b": [{"id": "K-B04", "cat": "B", "title": "对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来", "self": "<h3><a class=\"kref\" href=\"#K-B04\">K-B04<\/a> 对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月（中路对线）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>女娲被克<\/strong>。国服海月原话：<strong>「海月对线女娲八二开」<\/strong>。<\/li><li><strong>为什么是机制克<\/strong>（三层，缺一层这条就不成立）：<\/li><\/ul>\n<ol><li><strong>线权差<\/strong>：海月三个一技能光速清掉第一波兵，女娲前期清线慢，<strong>先手权在她手上<\/strong>。<\/li><li><strong>你的控制被免疫<\/strong>：海月有免控，能直接躲掉女娲一技能的击退（<code>BV1K8gDzwEho @ 02:00<\/code>）。<\/li><li><strong>你的保命被废<\/strong>：女娲唯一的位移是三技能传送，<strong>读条中被打断就走不掉<\/strong>（见 A 卡第 2 节）；海月大招把人拉走单挑，女娲在幻境里没有位移可用。<\/li><\/ol>\n<ul><li><strong>我该怎么做<\/strong>（可执行，不是「小心点」）：<\/li><li><strong>不在正面单走<\/strong>。中期海月不站正面、专门找「意想不到的位置」单杀落单的人（<code>@ 02:10<\/code>、<code>@ 02:17<\/code>）。女娲清线、补刀都要贴着队友或塔。<\/li><li><strong>一技能别当唯一控制用<\/strong>。她免控能吃掉你的击退，指望「一推→大」这套接死海月是错的——推不到，大招就是空。<\/li><li><strong>记她大招<\/strong>。她大招拉到谁都是赚（<code>@ 02:41<\/code>「只要能打出持续掉点，拉谁都是一样的」）。她大交了，才是女娲进场的窗口。<\/li><li>自己的大招是<strong>全图<\/strong>的：她要单杀你就得脱离阵型，这时候用大招支援被拉走/被追的队友，比跟她对拼划算。<\/li><li><strong>反向反制（她的破绽）<\/strong>：海月单杀依赖大招，<strong>大招 CD 期间她只是一个有线权的法师<\/strong>，没有硬控逃生；女娲可以趁这段用二技能墙封她退路，配合打野抓。<\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:00；BV1K8gDzwEho @ 02:00；BV1K8gDzwEho @ 02:10；BV1K8gDzwEho @ 02:41<\/li><li><strong>可信度<\/strong>：中高（对手视角的原话 + 实战演示，两段互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月（中路对线）克制层级：机制克（反向）——这条是女娲被克。", "opp": "海月"}, {"id": "K-B05", "cat": "B", "title": "对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判", "self": "<h3><a class=\"kref\" href=\"#K-B05\">K-B05<
