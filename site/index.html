 └─ 齐 → 进下一判据\n│\n├─ 我方站位先到吗？（谁先占住龙坑侧的草）\n│   ├─ 我方先到 → 【K-D16】争。先到的人决定这波团的形状\n│   └─ 对面先到 → 不硬冲，改成\"等他们打完/换另一侧资源\"【K-D17】\n│\n└─ 以上任一条判\"放\"→ 复活/回线后的第一步，不要回自己的线\n    → 【K-D18】先看小地图：谁在哪、谁状态不好<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>一次性资源<\/td><td>被动图标 / 大招 CD / 闪现<\/td><td>有 / 无<\/td><td>第一个分叉<\/td><\/tr><tr><td>场上人数<\/td><td>复活计时 + 小地图<\/td><td>我方 &lt; 对面<\/td><td>第二个分叉<\/td><\/tr><tr><td>龙坑侧草的归属<\/td><td>小地图视野<\/td><td>我方先占<\/td><td>第三个分叉<\/td><\/tr><tr><td>对面清完中线后的转向<\/td><td>兵线位置 + 小地图<\/td><td>大概率转向资源点<\/td><td><a class=\"kref\" href=\"#K-D17\">K-D17<\/a><\/td><\/tr><tr><td>自己复活后的位置<\/td><td>小地图<\/td><td>谁在附近、谁状态差<\/td><td><a class=\"kref\" href=\"#K-D18\">K-D18<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D14", "cat": "D", "title": "前四分钟的逆风是常态，不要在落后时硬接团", "self": "<h3><a class=\"kref\" href=\"#K-D14\">K-D14<\/a> 前四分钟的逆风是常态，不要在落后时硬接团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：前四分钟内我方被团灭过一次 / 经济落后<\/li><li><strong>判断依据<\/strong>：落后量（一个人头以内算正常）+ 我方一次性资源是否还在<\/li><li><strong>决策分支<\/strong>：<\/li><li>落后但资源在 → 只打\"对面先交技能\"的团，不主动开<\/li><li>落后且资源不在 → 完全不打，先发育<\/li><li><strong>反例<\/strong>：「落后就要打回来」——前四分钟的经济差通常不到 500，硬接一次团灭会直接变成 2000，这才是真正拉开差距的地方。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:06；BV1yke26fEYB @ 03:08；BV1yke26fEYB @ 04:17<\/li><li><strong>可信度<\/strong>：中高（UP 主在团灭后立刻给出这句定调，并用自己的后续处理验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：前四分钟内我方被团灭过一次 / 经济落后判断依据：落后量（一个人头以内算正常）+ 我方一次性资源是否还在决策分支：落后但资源在 → 只打\"对面先交技能\"的团，不主动开…"}, {"id": "K-D15", "cat": "D", "title": "资源点争不争，先看自己有没有\"一次性资源\"", "self": "<h3><a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 资源点争不争，先看自己有没有\"一次性资源\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟资源点刷新前<\/li><li><strong>判断依据<\/strong>：被动/大招/闪现是否可用；我方是否有人阵亡<\/li><li><strong>决策分支<\/strong>：<\/li><li>资源在且人齐 → 可以争（见 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>）<\/li><li>资源不在（如苏烈被动没装好）→ <strong>放<\/strong>，原话：\"没被动的时候就不要去硬接\"<\/li><li><strong>反例<\/strong>：「龙不能放」——4 分钟的龙价值约等于一波半兵线，而一次团灭的价值远大于它。<strong>放龙换 40 秒发育，是赚的。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:11；BV1yke26fEYB @ 04:13；BV1yke26fEYB @ 04:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟资源点刷新前判断依据：被动/大招/闪现是否可用；"}, {"id": "K-D16", "cat": "D", "title": "谁先占住龙坑侧的草，谁决定这波团的形状", "self": "<h3><a class=\"kref\" href=\"#K-D16\">K-D16<\/a> 谁先占住龙坑侧的草，谁决定这波团的形状<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要争这个资源点<\/li><li><strong>判断依据<\/strong>：龙坑侧草的视野归属；我方是否有人能先手控<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方先占 → 让对面来冲，我们打反手（先到的人不用先交技能）<\/li><li>对面先占 → 不要正面挤进去，改成拉边/等对面出来<\/li><li><strong>反例<\/strong>：「龙刷了五个人一起上」——五个人挤进一个口，等于把先手权交给对面。<strong>先到不等于先打，先到是为了让别人先打你。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:47；BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 03:51<\/li><li><strong>可信度<\/strong>：中（素材是\"蹲草反打\"的实战，结论方向明确但表述较口语）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要争这个资源点判断依据：龙坑侧草的视野归属；"}, {"id": "K-D17", "cat": "D", "title": "争不到就换：对面全员在龙坑时，另一侧一定空着", "self": "<h3><a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 争不到就换：对面全员在龙坑时，另一侧一定空着<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：资源点被对面先占住，且我方人不齐/资源不在<\/li><li><strong>判断依据<\/strong>：对面几个人在龙坑附近；另一侧兵线在哪<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面 4 人以上在龙坑 → <strong>不争<\/strong>，去另一侧吃线/推塔/反野<\/li><li>对面只有 2–3 人在 → 可以抢视野、逼他们分人<\/li><li><strong>反例<\/strong>：「他们打龙我们就去骚扰」——骚扰的收益是\"可能抢到\"，成本是\"整队站位散在龙坑口\"。换成另一侧的确定收益更划算。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>；与 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>（反方向拿资源）是同一条判据的不同时间尺度<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:13（\"到时候可以看情况选择放龙\"）；BV1yke26fEYB @ 04:33<\/li><li><strong>可信度<\/strong>：中（\"放\"的动作有原话，\"换什么\"是从 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的框架推的，标中）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：资源点被对面先占住，且我方人不齐/资源不在判断依据：对面几个人在龙坑附近；"}, {"id": "K-D18", "cat": "D", "title": "复活后的第一步不是回自己的线，是先读图", "self": "<h3><a class=\"kref\" href=\"#K-D18\">K-D18<\/a> 复活后的第一步不是回自己的线，是先读图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：阵亡后复活（前四分钟内最常发生）<\/li><li><strong>判断依据<\/strong>：小地图上 ① 谁在哪 ② 谁状态不好 ③ 哪条线正在被推<\/li><li><strong>决策分支<\/strong>：<\/li><li>某一路我方有人且对面状态差 → <strong>直接过去<\/strong>，不要先回线<\/li><li>全线都在安全位置 → 回自己的线，路过野区顺一下（不绕路才顺，见 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「复活先回自己线补经济」——复活那 5 秒是你唯一\"能选位置\"的时刻，回线等于把这个选择权浪费掉。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>（放资源点之后的时间怎么用）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:17；BV1yke26fEYB @ 04:20；BV1yke26fEYB @ 04:23；BV1yke26fEYB @ 04:29<\/li><li><strong>可信度<\/strong>：中高（原话给了完整推理：\"小乔在下路、打野在野区、并且他状态不好，这时我们下一步一定是去下路\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「一次性资源」上<\/strong>：人会把\"我血是满的\"当成\"我能打\"，忽略被动/大招是否是这波的前提。苏烈没被动就是普通近战，盾山没能量就是一块木板。<\/li><li><strong>在节点「人数」上<\/strong>：人会用\"他马上复活了\"给自己找理由。差 3 秒也是少一个人。<\/li><li><strong>在节点「先到」上<\/strong>：人以为先到就要先开，于是把反手机会打成了正面硬冲。<\/li><li><strong>在节点「放」上<\/strong>：人放了龙却不知道去换什么，40 秒全队在中路晃——这是\"放\"最常见的执行失败。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<h3>冲突 1：第一个资源点到底是 2 分钟还是 4 分钟<\/h3>\n<p>两条素材对不上，<strong>必须挂在这里，不许挑一条当结论<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>来源<\/th><th>说法<\/th><th>时间<\/th><\/tr><\/thead><tbody><tr><td>BV1yke26fEYB @ 04:17（苏烈全局，S45 区间）<\/td><td>「暴君刷新了」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1X2jV6KEiP @ 03:47（射手教学）<\/td><td>「马上也要来到我们的暴君团……4 分钟这个暴君」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1fp4y1D7Wd @ 02:01（干货教练，五位置节奏）<\/td><td>「2 分钟刷新的两条远古生物」<\/td><td><strong>2 分钟<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>两条 6 月内的实战素材都说 4 分钟，只有那条理论框架视频说 2 分钟。<strong>倾向按 4 分钟用<\/strong>，但那条理论视频可能拍得更早（S44 或之前）。本节的所有判据与\"几分钟\"无关——它问的是\"我有资格站进去吗\"，所以结论不受影响。<\/p>\n<h3>干货教练给的\"前期时间轴\"（未与版本对齐，仅作参照）<\/h3>\n<p>BV1fp4y1D7Wd @ 01:44 起给了一串节点：中路第一波兵 → 30 秒第一轮野区 + 边路河蟹 → 第二波兵 + 1 分钟中路河道之灵 → 第三波兵 → 2 分钟远古生物 + 第四波兵。<\/p>\n<p><strong>这套轴如果按\"远古生物 2 分钟\"成立，那么上文所有\"4 分钟\"的判断都要整体前移 2 分钟。<\/strong> 用之前先在游戏里对一次刷新时间。<\/p>\n<h3>其他<\/h3>\n<ul><li><strong>4 分钟资源点的类型与数值<\/strong>没有素材，本节只处理\"争不争\"的判断，不涉及打龙操作。<\/li><li>素材来自一局逆风局，<strong>顺风局的前四分钟<\/strong>（该不该加速、该不该越塔）没有样本。<\/li><li>\"对面先到就不冲\"这条在强开团阵容下可能不成立（盾山/苏烈可以硬顶进去），需补一条阵容相关的分支。<\/li><\/ul>", "sum": "两条素材对不上，必须挂在这里，不许挑一条当结论："}]}, {"key": "D", "cat": "对局内", "title": "04 对线期：这波线清完，我该往哪走", "file": "04_对线期.md", "intro": "<blockquote><p><strong>依赖<\/strong>：03 前四分钟（结论：线权来自第一波谁先清完） <strong>被依赖<\/strong>：05 第一波转线（本节产出的「可动窗口」是 05 的输入）；09 逆风止损（本节判定\"没线权\"且持续到 4 分钟，直接跳 09）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>03 结尾留下的是：<strong>\"你先到 2 级了，然后呢？\"<\/strong><\/p>\n<p>先到 2 级只说明你<strong>有了一次清线优势<\/strong>，不等于你能走。这一节要回答的，是这次优势能不能换成地图上的东西——换不成，优势会在 90 秒内自己蒸发。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>这一波线清完之后，我是往河道走、往边路走，还是退回塔后等下一波？<\/strong><\/p>\n<p>不是\"怎么打得更好\"，是\"这一步该不该动\"。操作的差距在这个决定面前是次要的。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>中线清完 / 即将清完（判断起点）\n│\n├─ 判据 A：我有没有线权？（看谁的小兵更多、谁先推过去）\n│   ├─ 没有（我方兵线被压回塔前，或我每波都在塔下补刀）\n│   │   ├─ 判据 A1：对面法师是否已经离开中线？（小地图 8 秒内无其视野）\n│   │   │   ├─ 是 → 【K-D01】不尾随，往反方向去拿资源\n│   │   │   └─ 否 → 【K-D02】塔后过线，同时给边路打信号\n│   │   └─ 判据 A2：我这一波掉了多少状态？（血量 &lt;60% 且无闪现）\n│   │       ├─ 是 → 【K-D03】回城，不要为了保线硬撑\n│   │       └─ 否 → 留在塔后等下一波\n│   └─ 有（我方小兵更多，或对面被迫交技能补刀）\n│       ├─ 判据 B：下一波兵到线还需多久？\n│       │   ├─ &gt;8 秒 → 够一次短游，进判据 C\n│       │   └─ ≤8 秒 → 【K-D04】不动，把线再推一波更赚\n│       └─ 判据 C：我方打野在哪？\n│           ├─ 在我方半区/河道 → 【K-D05】跟他走同一侧，去做视野或反野\n│           └─ 位置未知/在对面半区 → 【K-D06】只占中轴草，不深入\n└─ 判据 D：这波我死了或刚复活\n    └─ 【K-D07】先回中线过线，不要先参团<\/code><\/pre>\n<p>每个叶子都对应下面一个 K 条目。<strong>树里没有\"视情况而定\"这种分支<\/strong>——出现这三个字说明判据没写清。<\/p>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>线权<\/td><td>双方小兵数量与位置<\/td><td>我方小兵 ≥ 对方且未进塔<\/td><td>判据 A<\/td><\/tr><tr><td>对面法师视野<\/td><td>小地图<\/td><td>消失 &gt;8 秒<\/td><td>A1<\/td><\/tr><tr><td>自身血量 / 召唤师技能<\/td><td>血条 + 技能栏<\/td><td>血量 &lt;60% 且无闪现<\/td><td>A2<\/td><\/tr><tr><td>下一波兵到线时间<\/td><td>兵线节奏（约 30 秒一波）<\/td><td>&gt;8 秒<\/td><td>B<\/td><\/tr><tr><td>我方打野位置<\/td><td>小地图<\/td><td>己方半区 / 未知<\/td><td>C<\/td><\/tr><tr><td>是否刚复活<\/td><td>复活计时<\/td><td>—<\/td><td>D<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>底层判据（适用于全库）<\/strong>：判断\"能不能打\"看的不是经济差，是<strong>战斗力差 × 能不能及时到达<\/strong>。信息不足时这条压过一切技巧性结论——这条来自 <code>BV1i2n96AEvp<\/code> 的框架，原文是\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/p>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D01", "cat": "D", "title": "没线权，对面法师走了——我不跟，去反方向", "self": "<h3><a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 没线权，对面法师走了——我不跟，去反方向<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（2026-09-23 起）；S46 待复核<\/li><li><strong>触发条件<\/strong>：我方中路无线权（兵线被压回塔前）；对面法师小地图消失 &gt;8 秒<\/li><li><strong>判断依据<\/strong>：对面法师的消失方向（看小地图最后视野朝向哪一路）；我方另一路是否有可拿资源<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面法师去上 → <strong>我去下路<\/strong>，拿河蟹/兵线/野区小资源<\/li><li>对面法师去下 → <strong>我去上路<\/strong>，同理<\/li><li>完全看不出方向 → 不动，塔后过线<\/li><li><strong>反例<\/strong>：「对面法师去支援了，我赶紧跟过去」——你没有线权，走过去比他慢 5 秒以上，到了正好接他一套技能，还把中线白送。<strong>尾随强势法师作用不大，不如反方向拿资源。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a>（先要能安全过线）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:38；BV15EJk6fEwX @ 00:41<\/li><li><strong>可信度<\/strong>：高（全局思路复盘，非剪辑集锦；与《一野二边三射四中》的开局逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（2026-09-23 起）；"}, {"id": "K-D02", "cat": "D", "title": "没线权时的过线方式：塔后过，不打信号就完事", "self": "<h3><a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 没线权时的过线方式：塔后过，不打信号就完事<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：判定为无线权状态，且需要继续吃中线经济<\/li><li><strong>判断依据<\/strong>：对面法师的消耗距离；我方塔的血量<\/li><li><strong>决策分支<\/strong>：<\/li><li>站在<strong>塔后<\/strong>过线（不是塔前补刀），同时观察对面法师动向<\/li><li>给边路打信号，说明\"我这路被压，你们注意对面中单可能来\"<\/li><li><strong>反例<\/strong>：「我打个信号让队友别打就行了」——这条被明确否掉了：对面法师+打野一起进你们野区，或者四包二越你们下路，一个信号拦不住。<strong>打信号不能替代你到场<\/strong>。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:03；BV15EJk6fEwX @ 01:10<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：判定为无线权状态，且需要继续吃中线经济判断依据：对面法师的消耗距离；"}, {"id": "K-D03", "cat": "D", "title": "血线被打到 60% 以下且没闪现——回家，别保线", "self": "<h3><a class=\"kref\" href=\"#K-D03\">K-D03<\/a> 血线被打到 60% 以下且没闪现——回家，别保线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中路对线期，血量 &lt;60%，闪现已交或在冷却<\/li><li><strong>判断依据<\/strong>：对面法师的技能冷却与斩杀线；我方塔下是否安全<\/li><li><strong>决策分支<\/strong>：<\/li><li>直接回城，接受掉 1–2 个兵<\/li><li>若对面法师蓝量也不健康且无法越塔 → 可以再撑一波，但要站在塔后<\/li><li><strong>反例<\/strong>：「我血少但不能掉线，硬吃一波」——<strong>掉状态之后轻则被单杀、丢闪现，重则丢野区<\/strong>。这是\"为了一波兵输掉整条线\"的典型。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:30；BV15EJk6fEwX @ 00:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中路对线期，血量 &lt;60%，闪现已交或在冷却判断依据：对面法师的技能冷却与斩杀线；"}, {"id": "K-D04", "cat": "D", "title": "有线权但下一波兵 8 秒内到——别走，再推一波", "self": "<h3><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 有线权但下一波兵 8 秒内到——别走，再推一波<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有明确线权；下一波兵线到线时间 ≤8 秒<\/li><li><strong>判断依据<\/strong>：兵线节奏（约 30 秒一波）；当前小兵数量<\/li><li><strong>决策分支<\/strong>：留在线上再推一波，把兵线送进对面塔，让对面疲于补塔刀<\/li><li><strong>反例<\/strong>：「有线权就立刻游走」——走到一半兵线回来，你既没拿到资源也没吃到线，两头空。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:53<\/li><li><strong>可信度<\/strong>：中（阈值为 8 秒的推算值，UP 主未给具体秒数，需实战校准）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有明确线权；"}, {"id": "K-D05", "cat": "D", "title": "有线权且打野在同侧——跟他走，别自己单走", "self": "<h3><a class=\"kref\" href=\"#K-D05\">K-D05<\/a> 有线权且打野在同侧——跟他走，别自己单走<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权；我方打野位于己方半区或河道<\/li><li><strong>判断依据<\/strong>：打野位置与行进方向；对面打野是否已在小地图暴露<\/li><li><strong>决策分支<\/strong>：与打野走同一侧，做视野或反野；两人一起才有交换价值<\/li><li><strong>反例<\/strong>：「我自己先去探一下」——单人进野区在无视野情况下大概率被抓，而这次被抓会把刚拿到的线权一起吐出去。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a>（先确认可动窗口）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 02:11；BV15EJk6fEwX @ 02:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权；"}, {"id": "K-D06", "cat": "D", "title": "打野位置不明——只占中轴草，不深入", "self": "<h3><a class=\"kref\" href=\"#K-D06\">K-D06<\/a> 打野位置不明——只占中轴草，不深入<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权，但打野位置未知或在对面上半区<\/li><li><strong>判断依据<\/strong>：小地图打野最后出现位置与时间<\/li><li><strong>决策分支<\/strong>：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场<\/li><li><strong>反例<\/strong>：「反正有线权，去对面野区找个机会」——打野位置不明时进对面野区，等于把命交给概率。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:43；BV15EJk6fEwX @ 01:47<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权，但打野位置未知或在对面上半区判断依据：小地图打野最后出现位置与时间决策分支：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场反例：「…"}, {"id": "K-D07", "cat": "D", "title": "死了刚复活——先回中线过线，不要先参团", "self": "<h3><a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 死了刚复活——先回中线过线，不要先参团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：复活后场上正在发生团战或资源争夺<\/li><li><strong>判断依据<\/strong>：兵线位置；团战距离；自身大招冷却<\/li><li><strong>决策分支<\/strong>：<\/li><li>中线有兵且没人清 → <strong>先过线<\/strong>，再决定是否进场<\/li><li>中线已空 → 直接进场<\/li><li><strong>反例<\/strong>：「团战开始了必须去」——线不过，你到场也是白给经济，而且下一波还要被压。<strong>兵线大于团战<\/strong>这条在低分段尤其反直觉。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 03:24；BV15EJk6fEwX @ 03:26<\/li><li><strong>可信度<\/strong>：中（\"兵线大于团战\"是 UP 主的口号式结论，需在 06/07 用其他来源交叉验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：复活后场上正在发生团战或资源争夺判断依据：兵线位置；"}, {"id": "K-D08", "cat": "D", "title": "对线期的辅助：按「野→边→射→中」的顺序决定第一步", "self": "<h3><a class=\"kref\" href=\"#K-D08\">K-D08<\/a> 对线期的辅助：按「野→边→射→中」的顺序决定第一步<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，辅助决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>反例<\/strong>：「辅助就该跟着射手」——这是四个判据里排第三的一条，不是第一条。开局直接去发育路，等于放弃了野区节奏。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:47；BV1yke26fEYB @ 00:52<\/li><li><strong>可信度<\/strong>：中（该公式为 UP 主自创命名\"一野二边三射四中\"，非官方；顺序逻辑与 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 的反方向拿资源一致，故采信）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂，不单列）<\/h2>\n<ul><li><strong>在节点「判据 A 线权」上<\/strong>：把\"我先到 2 级\"当成\"我有线权\"。到 2 级只是一次，线权是持续状态，看的是<strong>这一波谁的小兵更多<\/strong>。<\/li><li><strong>在节点「判据 A1 对面法师消失」上<\/strong>：把\"小地图没有他\"当成\"他走了\"。消失 8 秒内可能只是在草丛里，直接跟过去会撞脸。<\/li><li><strong>在节点「判据 C 打野位置」上<\/strong>：把\"打野刚露头\"当成\"打野在附近\"。露头的位置决定他能不能到，不能到就等于不在。<\/li><li><strong>在节点「判据 D 刚复活」上<\/strong>：默认\"团战优先级最高\"。低分段最常见的死法就是复活后直奔团战，回来发现自己中线已经掉两波。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 的 8 秒阈值、<a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 的\"兵线大于团战\"均为单一来源，缺第二个 UP 主交叉验证 → <code>30_index/stale.md<\/code> 已登记。<\/li><li>本节的\"线权\"定义在中路成立，<strong>对抗路不适用<\/strong>（对抗路优势要控线，中路优势要推线）→ 对抗路支线待 P2 单独写，不要套用本节。<\/li><li>版本风险：王维为 S45 新英雄，若 S46 调整其一级强度，<a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 的\"塔后过线\"前提需重估。<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，辅助决定第一波去哪判断依据：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清决策分支…"}]}, {"key": "D", "cat": "对局内", "title": "05 第一波转线", "file": "05_第一波转线.md", "intro": "<blockquote><p>素材：浅梦《打野教科书》（BV1oRJYzpEYb，12 位 KPL 职业打野第一视角）与《中路教科书》（BV1WkKzzUEtq，KPL 职业中路 + 顶端局实战解析），均为教练口播拆解，S45。 本节只回答一件事：<strong>兵线清完、人已经能动的这一刻，先往哪一路走、凭什么这么判<\/strong>。判断顺序里出现两个 K-D 号的，是同一步的两个分叉，不是两步。 上游接 <code>04<\/code>（第一波线权与开局落位）。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：这一波线到底归不归你清 → K-D50（没线权）／K-D51（主动放线）\n第 2 步：线清完了，这波中线接不接得起（中轴对抗强度 × 野区速率） → K-D41\n第 3 步：接不起 → 放裂到塔下用塔伤接，不抢这波线权 → K-D42\n第 4 步：接得起且中轴优 → 人不用走，节奏就留在中路 → K-D43\n第 5 步：中路只是\"过兵线\" → 出节奏点不在中路，人转边 → K-D44\n第 6 步：转两条边里的哪一条 → 先比边路对抗强度 → K-D45\n第 7 步：手上没有对方打野信息时的默认方向 → 和打野反方向 → K-D46\n第 8 步：走过去的路上 → 顺手把对方打野开局信息拿掉 → K-D47\n第 9 步：到了边上 → 半靠还是完全靠 → K-D48；清完线发现自家打野亏了速率 → 先回野区提速 → K-D49\n第 10 步：中后期同一问升级 → 能不能入侵／能不能推进，且必须留中 → K-D52<\/code><\/pre>", "entries": [{"id": "K-D41", "cat": "D", "title": "清完第一片野区，\"去哪\"之前先算这波中线接不接得起", "self": "<h3><a class=\"kref\" href=\"#K-D41\">K-D41<\/a> 清完第一片野区，\"去哪\"之前先算这波中线接不接得起<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一片野区收完、队友已经在往中路附近的中立资源点压，中路线同时到，要决定是接中还是继续刷<\/li><li><strong>判断依据<\/strong>：素材把这一步拆成两把尺——<strong>中轴对抗强度<\/strong>和<strong>野区速率<\/strong>（@ 01:40~01:43）。中轴 1V2 必定是裂的，就没必要抢这波中线权（@ 01:48~01:52）；打野单人接中线还会拖慢野区速率，且打野刀对兵线有减伤（@ 01:52~01:59），硬接容易变成残血 + 一边野区没刷、野区防守压力变重（@ 02:00~02:04）<\/li><li><strong>决策分支<\/strong>：<\/li><li>中轴打得过、野区速率不吃亏 → 接中线，再接下一片野区<\/li><li>中轴 1V2 必裂或野区速率本来就慢 → 先速刷野区，中线等队友传送回来再吃（@ 02:06~02:14）<\/li><li><strong>反例<\/strong>：两片野区刷完就出来蹭中线——素材直接点这是\"大众路人局无意义的刷野方式\"（@ 01:08~01:10）。职业局 vs 路人局的差别：职业局这波中线本来就有队友分掉（有人去抢中立资源），路人局没人替你压资源点，\"不接中\"要改成\"先确认队友在不在\"，不是默认放线<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 01:40~02:14<\/li><li><strong>可信度<\/strong>：高（明确给了两个变量和各自后果，且同一逻辑在后文重复出现）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一片野区收完、队友已经在往中路附近的中立资源点压，中路线同时到，要决定是接中还是继续刷判断依据：素材把这一步拆成两把尺——中轴对抗强度和野区速率（@ 01:40~0…"}, {"id": "K-D42", "cat": "D", "title": "中轴对抗劣 → 不抢线权，把线放裂到塔下用塔伤接", "self": "<h3><a class=\"kref\" href=\"#K-D42\">K-D42<\/a> 中轴对抗劣 → 不抢线权，把线放裂到塔下用塔伤接<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中轴对抗明显劣（素材例：甄姬加四级前的镜），同时自己野区速率也慢<\/li><li><strong>判断依据<\/strong>：处理方式是\"把兵线放裂塔下\"再接，敌方不容易打掉我们的状态，因为有防御塔的伤害（@ 02:37~02:46）；中轴对抗烈就\"故意把中线放裂塔下，接后刷野区\"（@ 02:56~02:59）。另一处同理：人少打人多就是绝对的劣势线，线权是给对面推过来的，塔下接（@ 12:20~12:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>线已经被对面推过来 → 塔下接，而且不急着清，留着和队友一起吃（@ 12:29~12:50）<\/li><li>辅助或中单先来帮着清中 → 打野刀的减伤就可以忽略（@ 02:44~02:46）<\/li><li><strong>反例<\/strong>：中轴劣还上去抢线或者打人——素材原话\"我们不可能上去抢线或者打人\"（@ 02:33~02:35）。职业局 vs 路人局的差别：职业局\"放裂\"是团队设计，塔下这波线是留给传送回来的打野或中单吃的；路人局没人来接，放线就是白掉塔血，放之前必须先看到有人能来<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 02:33~02:59、BV1WkKzzUEtq @ 12:20~12:50<\/li><li><strong>可信度<\/strong>：高（机制层理由清楚：塔伤换状态）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：中轴对抗明显劣（素材例：甄姬加四级前的镜），同时自己野区速率也慢判断依据：处理方式是\"把兵线放裂塔下\"再接，敌方不容易打掉我们的状态，因为有防御塔的伤害（@ 02:3…"}, {"id": "K-D43", "cat": "D", "title": "中轴对抗优 → 人不用走，节奏就该留在中路", "self": "<h3><a class=\"kref\" href=\"#K-D43\">K-D43<\/a> 中轴对抗优 → 人不用走，节奏就该留在中路<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：清完线，中轴强度判为优（我方手长或人多），而第二轮野区还有一段时间才刷<\/li><li><strong>判断依据<\/strong>：素材要求同时想两件事，\"中轴强度优还是劣\"和\"接下来的野区规划\"（@ 03:06~03:09）；第二轮野区刷新在 2 分钟后，前期中立资源已争完，小地图上没有资源点也没野区刷新（@ 03:19~03:27），所以节奏继续在中路和对方摩擦（@ 03:27~03:31）<\/li><li><strong>决策分支<\/strong>：<\/li><li>中轴优且正处在野区刷新的空窗 → 留在中路压状态、不用省技能，因为后续规划就是回野区刷野（@ 03:34~03:41）<\/li><li>中轴优但自家野区马上刷 → 该回野区，不要再拿技能在中路换血<\/li><li><strong>反例<\/strong>：清完线就本能地往外走。这一段真正的收益是隐性的：把对方中线拖慢，他河道挤不出来，也就没法给双边施压（@ 03:43~03:49）。职业局 vs 路人局的差别：这条吃的是队友一起在中路压，路人局中路常常没人跟，一个人压过去等于送打野抓<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 03:06~03:49<\/li><li><strong>可信度<\/strong>：高（\"空窗期\"这一判据在素材里有明确时间支撑：二轮野区 2 分钟后刷）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：清完线，中轴强度判为优（我方手长或人多），而第二轮野区还有一段时间才刷判断依据：素材要求同时想两件事，\"中轴强度优还是劣\"和\"接下来的野区规划\"（@ 03:06~03…"}, {"id": "K-D44", "cat": "D", "title": "中路只是\"过兵线\" → 出节奏点一定不在中路，人转边", "self": "<h3><a class=\"kref\" href=\"#K-D44\">K-D44<\/a> 中路只是\"过兵线\" → 出节奏点一定不在中路，人转边<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对方中单留在边路抢中立资源，中路只剩打野或清线快的人过线<\/li><li><strong>判断依据<\/strong>：素材判断\"这波是没有中轴对抗的\"，敌方中单留在对抗路抢空间灵、让打野出来接中线，我方中路仅仅过兵线就可以（@ 04:16~04:26）；结论是\"接下来出节奏的地点一定不是中路，而是对抗路\"（@ 04:26~04:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>中路线交给清线速率更快的人（素材例：炸弹猫）接 → 自己速刷到对抗路（@ 04:37~04:41）<\/li><li>抢速率赶到对抗路 → 一定有节奏点；对方打野还在接中线的时候，上路已经能做出四打二（@ 04:29~04:35、@ 04:51~04:53）<\/li><li><strong>反例<\/strong>：中路没人对抗还在中路纠缠等人齐——节奏窗口就是对方打野接线那几秒，等人齐窗口已经关了。职业局 vs 路人局的差别：职业局\"让清线快的人接中线\"是分工，路人局没人替你接，得先确认有人接再走<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 04:16~04:53<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：对方中单留在边路抢中立资源，中路只剩打野或清线快的人过线判断依据：素材判断\"这波是没有中轴对抗的\"，敌方中单留在对抗路抢空间灵、让打野出来接中线，我方中路仅仅过兵线就…"}, {"id": "K-D45", "cat": "D", "title": "转哪条边，先比两条边的对抗强度，再按强度选半图", "self": "<h3><a class=\"kref\" href=\"#K-D45\">K-D45<\/a> 转哪条边，先比两条边的对抗强度，再按强度选半图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：已经决定要转边，两条边都可能有节奏<\/li><li><strong>判断依据<\/strong>：\"提前看边路对抗强度是优还是劣\"（@ 04:43~04:46）；哪怕对方中单不传走，也还是绝对的优势（@ 04:46~04:48）。边路对抗包含发育边和对抗边（@ 06:36~06:38），两条边要分别比<\/li><li><strong>决策分支<\/strong>：<\/li><li>那条边对抗强度优 → 直接去，少打对面一个中单也是优势<\/li><li>中轴没对抗但边路也打不过 → 就不存在这条边的对抗画面，换另一条（@ 05:31~05:42 发育路兵线一塔传过去会掉状态的例子）<\/li><li>两条边都够呛、自己又刚好能升四 → 放一片小野换最快速率，赶在资源点刷之前到位（@ 05:13~05:24）<\/li><li><strong>反例<\/strong>：按\"红开还是蓝开\"的惯性选边。素材原话这\"是一个很浅的说法\"，真正该问的是发育路野区开还是对抗路野区开（@ 01:17~01:26）。职业局 vs 路人局的差别：职业局这两条边的强弱由 BP 和换线决定，路人局要靠开局一分钟的对线结果现看<\/li><li><strong>来源<\/strong>：BV1oRJYzpEYb @ 01:17~01:26、04:43~05:42<\/li><li><strong>可信度<\/strong>：高（判据与后文\"边路对抗强度悬殊时也一定能出节奏\"的案例一致）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：已经决定要转边，两条边都可能有节奏判断依据：\"提前看边路对抗强度是优还是劣\"（@ 04:43~04:46）；"}, {"id": "K-D46", "cat": "D", "title": "中单没有信息时的默认方向：和打野反方向走", "self": "<h3><a class=\"kref\" href=\"#K-D46\">K-D46<\/a> 中单没有信息时的默认方向：和打野反方向走<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一波中线清完，手上没有对方打野的位置<\/li><li><strong>判断依据<\/strong>：标准方法——\"和打野反方向，打野上半图开局你就往下路去帮，下半图开局你就往上路去帮\"，顺道看住另一边他还没打的野区，自家打野就不容易被反 Buff（@ 01:44~01:56）；素材明说这条\"对于中低分段来说是很重要的\"（@ 01:59~02:01）。实战对应：打野下半图开，所以往上半图跑（@ 09:53~09:58）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野上半图开 → 往下路<\/li><li>打野下半图开 → 往上路<\/li><li>打野位置已经由辅助给出 → 不必再套默认方向，直接按信息走（@ 03:19~03:23）<\/li><li><strong>反例<\/strong>：凭感觉选一边、直直走过去。素材要求\"不是无脑的直直的过去\"，这段路要拿来收集信息（@ 02:03~02:06）。职业局 vs 路人局的差别：这是全篇少数明确说\"中低分段很重要\"的条目，路人局可以照抄；职业局方向会被辅助给的信息改写<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 01:44~02:06、09:53~09:58<\/li><li><strong>可信度<\/strong>：高（给了默认规则、例外条件和适用分段）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一波中线清完，手上没有对方打野的位置判断依据：标准方法——\"和打野反方向，打野上半图开局你就往下路去帮，下半图开局你就往上路去帮\"，顺道看住另一边他还没打的野区，自…"}, {"id": "K-D47", "cat": "D", "title": "走过去的路上，顺手把对方打野的开局信息拿掉", "self": "<h3><a class=\"kref\" href=\"#K-D47\">K-D47<\/a> 走过去的路上，顺手把对方打野的开局信息拿掉<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：正在往某条边路移动，且开局没有对方打野位置<\/li><li><strong>判断依据<\/strong>：去上时看对方双猪，没人碰 → 对方打野大概率是蓝开（@ 02:08~02:13）；去下时透墙看对方有没有打蓝（@ 02:13~02:16）。实战走红背，看对面双猪和红 Buff，都没打就只能说明他蓝开（@ 10:05~10:12、@ 10:17~10:20）。辅助没给信息时，就和对方中路反方向去把信息补回来（@ 03:51~04:05）<\/li><li><strong>决策分支<\/strong>：<\/li><li>双猪和红都没被碰 → 判蓝开，按蓝开的顺序估他进上半图的时间<\/li><li>看到对面在上半区动 → 判红开，据此改自己落点，先一步靠过去形成人数差（@ 19:08~19:19）<\/li><li><strong>反例<\/strong>：把\"去边路\"当成纯赶路，走完全程还是不知道对方打野在哪，等于白送一段视野窗口。职业局 vs 路人局的差别：职业局这条通常由辅助和中单分担，素材原话是\"开局辅助没能给到我们对方打野的位置信息，就需要我们在第一波兵线后去获取信息\"（@ 03:52~03:58），路人局没人分担，只能自己补<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 02:08~02:16、03:51~04:05、10:05~10:20<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：正在往某条边路移动，且开局没有对方打野位置判断依据：去上时看对方双猪，没人碰 → 对方打野大概率是蓝开（@ 02:08~02:13）；"}, {"id": "K-D48", "cat": "D", "title": "到了边上：默认半靠，只有打起来或能白拿一只小野才完全靠", "self": "<h3><a class=\"kref\" href=\"#K-D48\">K-D48<\/a> 到了边上：默认半靠，只有打起来或能白拿一只小野才完全靠<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：人已经走到\"半靠中路 + 一条边路\"的位置，要决定贴不贴过去<\/li><li><strong>判断依据<\/strong>：这个位置的定义就是\"半靠中路以及其中一条边路\"（@ 02:18~02:26）。完全靠过去的前提是\"那个地方得打起来，或者能抢到对方的野区资源、拿掉对方的一只小野怪\"——提高自己经济的同时削减敌方，比中路兵线更赚（@ 02:35~02:47）<\/li><li><strong>决策分支<\/strong>：<\/li><li>那边打起来了，或者能抢一只小野 → 完全靠过去，不回中<\/li><li>没打起来也没资源 → 回中路抢下一波兵线权（@ 02:54~02:56）<\/li><li>实例：上路狂铁优了一波线、有线权能配合秒野怪 → 可以完全靠（@ 10:21~10:35）<\/li><li><strong>反例<\/strong>：每次都整个人贴过去。素材另一处给了反向纪律：经济被影响又补不回来时，就该每次去边路都只半靠，只在那有额外人头经济时才完全靠（@ 05:36~05:51）。职业局 vs 路人局的差别：素材自己说\"不同分段用不同方式\"（@ 05:55~05:58），路人局打野不让蹭野时，半靠是默认档<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 02:18~02:56、05:36~05:58、10:21~10:35<\/li><li><strong>可信度<\/strong>：高（判据是\"能不能拿到增量收益\"，可当场验证）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：人已经走到\"半靠中路 + 一条边路\"的位置，要决定贴不贴过去判断依据：这个位置的定义就是\"半靠中路以及其中一条边路\"（@ 02:18~02:26）。"}, {"id": "K-D49", "cat": "D", "title": "清完线先看自家打野亏没亏速率，亏了就先回野区提速", "self": "<h3><a class=\"kref\" href=\"#K-D49\">K-D49<\/a> 清完线先看自家打野亏没亏速率，亏了就先回野区提速<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：这波线自己跑去边路处理、中线由打野补掉，或打野为了帮边丢了刷野时间<\/li><li><strong>判断依据<\/strong>：路过野区垫伤害能加快打野出野区，而且提速是可以反补自身的（@ 04:38~04:47）。实例：大司命在下路帮队友拿了资源还过了一波兵线，等于亏野区速率，所以\"我们过完兵线首要的就是来帮大司命提速野区速率\"（@ 14:33~14:46）；提完速他才有速率跟你一起抢下一波中线权（@ 14:51~15:01）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野为了补中或帮边掉速 → 清完线先去野区垫伤害，再谈转边<\/li><li>打野速率正常 → 直接按 <a class=\"kref\" href=\"#K-D48\">K-D48<\/a> 处理边路<\/li><li>蹭野时要注意：不要乱蹭且不补刀，需要补经验和经济时再蹭（@ 04:53~05:00）<\/li><li><strong>反例<\/strong>：清完线直接奔下一条边，把自家打野的速率空档留给对面当入侵窗口。职业局 vs 路人局的差别：素材把这套叫协作打法，并明说\"这种很难学，只是让大家了解一下比赛的一个协作打法\"（@ 09:28~09:32），路人局打野常常不让蹭，按 <a class=\"kref\" href=\"#K-D48\">K-D48<\/a> 的半靠处理更稳<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 04:38~05:00、09:28~09:32、14:33~15:01<\/li><li><strong>可信度<\/strong>：中（职业局的配合前提很强，路人局成功率取决于打野是否配合）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：这波线自己跑去边路处理、中线由打野补掉，或打野为了帮边丢了刷野时间判断依据：路过野区垫伤害能加快打野出野区，而且提速是可以反补自身的（@ 04:38~04:47）。"}, {"id": "K-D50", "cat": "D", "title": "没线权：先看对方中单去哪边，再按\"有没有他打野的位置\"决定跟还是反跑", "self": "<h3><a class=\"kref\" href=\"#K-D50\">K-D50<\/a> 没线权：先看对方中单去哪边，再按\"有没有他打野的位置\"决定跟还是反跑<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：这波中路线被对面先清完，你动起来比他慢<\/li><li><strong>判断依据<\/strong>：没线权先看敌方中路往哪边走，两种选择——跟过去或去另一边（@ 03:02~03:11），判据是\"有没有敌方打野的位置\"（@ 03:12~03:15）。有信息就不必再找打野，慢慢跟过去，用技能探草、前后摇摆走位，防被蹲（@ 03:19~03:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对方中单完全靠过去了 → 看情况跟过去打架（@ 03:32~03:34）<\/li><li>对方中单没完全过去 → 卡住他的位置，不给他舒服回中，下一波线就轮到你（@ 03:38~03:48）<\/li><li>没有对方打野信息 → 和对方中路反方向去拿信息，再及时回中抢下一波（@ 03:51~04:10）<\/li><li><strong>反例<\/strong>：没线权就原地等下一波线。素材给出的正解是卡对方回中，直接把下一波线权抢回来，\"转劣为优\"（@ 14:17~14:21）。职业局 vs 路人局的差别：职业局辅助先给打野位置，多数时候走\"慢慢跟\"；路人局没信息，\"先补信息\"这条分支更常用<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 03:02~04:10、14:17~14:21<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：这波中路线被对面先清完，你动起来比他慢判断依据：没线权先看敌方中路往哪边走，两种选择——跟过去或去另一边（@ 03:02~03:11），判据是\"有没有敌方打野的位置\"…"}, {"id": "K-D51", "cat": "D", "title": "想 GANK 边路：清完线再走 GANK 率低，要提前动就得放一波线", "self": "<h3><a class=\"kref\" href=\"#K-D51\">K-D51<\/a> 想 GANK 边路：清完线再走 GANK 率低，要提前动就得放一波线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想把中路优势转成边路人头，但清完线才动身<\/li><li><strong>判断依据<\/strong>：GANK 的逻辑是利用人数差，而三路兵线速度是一样的，中路清完再去 GANK，边路也差不多清完了，GANK 率肯定不高（@ 06:06~06:16）；所以可以选择放一波中路线不清，利用这个时间直接去边路，GANK 率会高很多（@ 06:16~06:21）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野会补中线 → 放线，提前到边路打人数差<\/li><li>打野不会补 → 不放线，改去帮对抗路，打完用传送阵回中，等于 GANK 对抗路 + 吃对抗路和中路两波线（@ 06:22~06:41）<\/li><li><strong>反例<\/strong>：按\"清完线再走\"的流程走，人是到了，边路那波线也没了。职业局 vs 路人局的差别：放线这条完全依赖打野补线，素材直接给了不需要配合的替代方案（去对抗路 + 传送阵），路人局不要照搬放线<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 06:06~06:41<\/li><li><strong>可信度<\/strong>：高（给了不满足条件时的等价方案）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：想把中路优势转成边路人头，但清完线才动身判断依据：GANK 的逻辑是利用人数差，而三路兵线速度是一样的，中路清完再去 GANK，边路也差不多清完了，GANK 率肯定不…"}, {"id": "K-D52", "cat": "D", "title": "中后期同一问升级成两问：能不能入侵、能不能推进，并且必须留中", "self": "<h3><a class=\"kref\" href=\"#K-D52\">K-D52<\/a> 中后期同一问升级成两问：能不能入侵、能不能推进，并且必须留中<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中后期摸完一波线，不知道下一个节奏点在哪<\/li><li><strong>判断依据<\/strong>：答案只有两件事——\"能不能做入侵或者能不能做推进\"（@ 24:56~25:02）；上路有兵线但队友不在那边，不好做推进，下路有兵线且射手在那边，适合推进，所以往下靠配合队友（@ 25:02~25:10）<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友在、兵线在 → 往那条边靠，做推进<\/li><li>对面只有一人守、队友已经两人压一个 → 不需要完全贴过去，留中（@ 25:13~25:25）<\/li><li>打野要回去接 Buff → 必须留中堵口子，不然对方能从河道钻过来包夹（@ 25:25~25:58）<\/li><li><strong>反例<\/strong>：清完线全员压一条边、中路放空——素材里假设的画面就是对方三个人在正面、打野从中路钻过来形成夹击（@ 25:31~25:40）。职业局 vs 路人局的差别：素材在十分钟龙团处点明\"路人局在不开麦的情况下难以实现\"（@ 30:19~30:21），留中尤其需要队友知道你在做什么，路人局要么打字沟通，要么只做\"两人压、我不去\"的简化版<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 24:56~25:58、BV1oRJYzpEYb @ 30:19~30:21<\/li><li><strong>可信度<\/strong>：中（\"两问\"的框架清楚，但每条分支都依赖队友是否在同一频道）<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>素材只给了打野和中单的第一视角，没有发育路/对抗路自己的视角——\"线清完了，该不该等中单打野过来\"这一半没有对应结论<\/li><li>两条边都不适合去、又没野区可刷的空窗期，素材没有给站位处置<\/li><li>转线速度与英雄位移技能的关系（除传送阵、女娲三技能被提到）没有量化<\/li><li>兵线到达时间只有三个明确节点：3 分 47/48 中路汇聚、第二轮野区 2 分钟后刷、四分钟龙，其余靠\"一波线对接\"这类描述<\/li><li>逆风局的第一波转线素材没有覆盖，两份素材都是顺风/均势开局解析<\/li><li>职业局与路人局的差别只在少数几处被素材明说（放线、协作提速、开麦留中），其余条目里的差别是据语境推断，需要人复核<\/li><li><code>04<\/code> 的实际文件名与编号要跟库里对齐后再回填 depends_on<\/li><\/ul>", "sum": "适用版本：S45触发条件：中后期摸完一波线，不知道下一个节奏点在哪判断依据：答案只有两件事——\"能不能做入侵或者能不能做推进\"（@ 24:56~25:02）；"}]}, {"key": "D", "cat": "对局内", "title": "05 资源点与推进", "file": "05_资源点与推进.md", "intro": "<blockquote><p>素材：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。这是<strong>全位置通用<\/strong>的一节 —— 资源刷新时间对五个人都一样，只是谁去争、谁去换不同。 上游是 <code>03_前四分钟.md<\/code>（第一条龙争不争），这一节接在它后面：<strong>第一条龙之后，剩下的资源怎么排优先级<\/strong>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：这局有哪些资源点可用？   → K-D19（先有一张时刻表，才有得选）\n第 2 步：优势时，龙怎么拿才不翻车？→ K-D20（控血线，不拼惩）\n第 3 步：劣势时，龙怎么换才不亏？  → K-D21（换 + 抢仇恨的时机）\n第 4 步：打完团，推还是撤？        → K-D22（看前排还在不在）\n第 5 步：要拆塔了，先拆哪座？      → K-D23（边塔 &gt; 中塔，边路高地 &gt; 中路高地）\n第 6 步：大龙和主宰什么时候放？    → K-D24（把大小龙兵拉开距离）<\/code><\/pre>", "entries": [{"id": "K-D19", "cat": "D", "title": "资源点清单：记不住时间就别去偷", "self": "<h3><a class=\"kref\" href=\"#K-D19\">K-D19<\/a> 资源点清单：记不住时间就别去偷<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何时刻判断\"现在有什么可争的\"<\/li><li><strong>清单（按刷新频率排）<\/strong>：<\/li><li><strong>发育路红隼<\/strong>（开局第一个可争点）<\/li><li><strong>对抗路河灵<\/strong>（正常刷 3 只）<\/li><li><strong>双方赤甲<\/strong><\/li><li><strong>前期野区小野<\/strong>（后期刷新速度不一致，<strong>记不住时间就放弃偷<\/strong>）<\/li><li><strong>Buff<\/strong><\/li><li><strong>2 / 4 / 8 / 10 分钟龙<\/strong>，以及<strong>风暴龙王<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>你能说出下一个资源点<strong>还有多久刷<\/strong> → 可以围绕它打<\/li><li>说不出来 → <strong>放弃偷，去干确定的事<\/strong>（解线、卡位）<\/li><li><strong>反例<\/strong>：「大概快刷了吧，我去看看」——\"去看看\"的成本是 10 秒 + 一次视野暴露，收益是零。资源点的全部价值在<strong>提前 20 秒布置<\/strong>，不在了才去就已经晚了<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（清单本身是客观事实；\"后期小野刷新不一致\"是版本特性，需定期复核）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何时刻判断\"现在有什么可争的\"清单（按刷新频率排）：发育路红隼（开局第一个可争点）对抗路河灵（正常刷 3 只）双方赤甲前期野区小野（后期刷新速度不一致，记不住时间就…"}, {"id": "K-D20", "cat": "D", "title": "优势方控龙：把龙血控在一万以上，别给对面拼惩的机会", "self": "<h3><a class=\"kref\" href=\"#K-D20\">K-D20<\/a> 优势方控龙：把龙血控在一万以上，别给对面拼惩的机会<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方优势，正在打龙<\/li><li><strong>判断依据<\/strong>：龙的血量 vs 对面打野的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li>优势方 → <strong>龙血控在一万以上<\/strong>，慢慢打。<strong>不要一路打到斩杀线<\/strong>，那等于把龙交给一次 50/50 的拼惩<\/li><li>对面打野不在（掉点/在另一侧）→ 可以直接打穿<\/li><li><strong>反例<\/strong>：「打得越快越安全」——快是给对面的机会。你打到 3000 血时，对面打野一个闪进来就是 50% 概率。控住血线，他进来只是送<\/li><li><strong>为什么这条重要<\/strong>：优势局的龙<strong>不是资源，是陷阱<\/strong>。你本来已经赢了，唯一输的方式就是在这里赌一次<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（与\"优势不赌\"的通用原则一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方优势，正在打龙判断依据：龙的血量 vs 对面打野的位置决策分支：优势方 → 龙血控在一万以上，慢慢打。"}, {"id": "K-D21", "cat": "D", "title": "劣势方打龙：换，以及\"抢仇恨\"只在暴君放地震波时不行", "self": "<h3><a class=\"kref\" href=\"#K-D21\">K-D21<\/a> 劣势方打龙：换，以及\"抢仇恨\"只在暴君放地震波时不行<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方劣势，对面在打龙<\/li><li><strong>决策分支<\/strong>：<\/li><li>首选 <strong>换龙<\/strong>（对面打这条，你去打另一条/去拆塔），不硬抢<\/li><li>要抢 → 等<strong>仇恨不转移的窗口过去<\/strong>：<strong>暴君放地震波期间仇恨不转移<\/strong>，等波过完才能抢<\/li><li><strong>反例<\/strong>：「劣势也要抢龙翻盘」——劣势抢龙是 20% 成功率的事，换龙是 100% 拿到等值资源的事。翻盘靠的是<strong>连续三次不亏<\/strong>，不是一次赌赢<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（\"地震波期间仇恨不转移\"是机制细节，需按版本复核）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方劣势，对面在打龙决策分支：首选 换龙（对面打这条，你去打另一条/去拆塔），不硬抢要抢 → 等仇恨不转移的窗口过去：暴君放地震波期间仇恨不转移，等波过完才能抢反例：…"}, {"id": "K-D22", "cat": "D", "title": "团战打完之后：先看前排还在不在，再决定推还是撤", "self": "<h3><a class=\"kref\" href=\"#K-D22\">K-D22<\/a> 团战打完之后：先看前排还在不在，再决定推还是撤<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一波团刚打完，双方都有阵亡<\/li><li><strong>判断依据<\/strong>：<strong>己方前排还在不在<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>杀了对面前排 → <strong>先退，等 CD 再推<\/strong>。这时候推塔等于替对面吸收伤害（他们的后排还有输出，你们的前排已经残了）<\/li><li>自家前排掉点 → <strong>立刻找对面开团<\/strong>。前排一没，你们就再也开不了团了，只能被磨死<\/li><li><strong>反例<\/strong>：「团赢了就推」——赢的是人头，不是站位。前排残血时推塔，塔的伤害 + 对面后排的输出会把人头还回去<\/li><li><strong>推广<\/strong>：这条和第 3 节的\"资源点\"是同一个逻辑：<strong>先看\"我还有没有下一波的能力\"，再决定要不要把这波收益最大化<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一波团刚打完，双方都有阵亡判断依据：己方前排还在不在决策分支：杀了对面前排 → 先退，等 CD 再推。"}, {"id": "K-D23", "cat": "D", "title": "压塔顺序：先边塔，假压高地转中；高地先清边线再清中", "self": "<h3><a class=\"kref\" href=\"#K-D23\">K-D23<\/a> 压塔顺序：先边塔，假压高地转中；高地先清边线再清中<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：优势方要拆塔<\/li><li><strong>判断依据<\/strong>：塔的价值 = 它后面能带出什么（超级兵/视野/进野区路线）<\/li><li><strong>决策分支（按顺序）<\/strong>：<\/li><\/ul>\n<ol><li><strong>先拆边塔<\/strong>，再拆中塔<\/li><li>拆完边塔 → <strong>假压高地，转中<\/strong>（把对面的防守拉过去，再回头拆中）<\/li><li><strong>上高地前先清边线，再清中线<\/strong>，让三线同时到<\/li><li><strong>边路高地优先于中路高地<\/strong>——因为边路高地破了有<strong>超级兵<\/strong><\/li><\/ol>\n<ul><li><strong>反例<\/strong>：「中路是核心，先拆中塔」——中塔拆了只是打开地图，边塔拆了才有超级兵持续给压力。先拆中塔的收益是\"能进野区\"，先拆边塔的收益是\"对面必须一直有人去清线\"<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：优势方要拆塔判断依据：塔的价值 = 它后面能带出什么（超级兵/视野/进野区路线）决策分支（按顺序）：先拆边塔，再拆中塔拆完边塔 → 假压高地，转中（把对面的防守拉过去…"}, {"id": "K-D24", "cat": "D", "title": "主宰之镜的光：等小龙兵过一塔一点再放，把大小龙兵拉开距离", "self": "<h3><a class=\"kref\" href=\"#K-D24\">K-D24<\/a> 主宰之镜的光：等小龙兵过一塔一点再放，把大小龙兵拉开距离<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方拿了主宰之镜，准备放大龙兵<\/li><li><strong>判断依据<\/strong>：大小龙兵的<strong>到达时间差<\/strong><\/li><li><strong>决策分支<\/strong>：<strong>等小龙兵过一塔一点再放<\/strong>大龙兵 → 两条线不会同时到，对面<strong>必须交两轮技能<\/strong>才能清完<\/li><li><strong>反例<\/strong>：「拿到就放，越早越好」——同时到 = 对面一波技能清两条。错开 10 秒 = 对面要交两次，而技能是有 CD 的<\/li><li><strong>为什么这条是本节的收尾<\/strong>：前面的 <a class=\"kref\" href=\"#K-D19\">K-D19<\/a>~D23 都在讲\"什么时候动手\"，这条讲\"<strong>动手的时机差本身就是收益<\/strong>\"。同一个资源，早放和晚放差一轮技能<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中（单来源，且属操作细节，版本改动风险高）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>这一节和其他节的关系<\/h2>\n<div class=\"tw\"><table><thead><tr><th>上游<\/th><th>关系<\/th><\/tr><\/thead><tbody><tr><td><code>03_前四分钟.md<\/code><\/td><td>第一条龙争不争 → 本节处理\"第一条之后的所有资源\"<\/td><\/tr><tr><td><code><a class=\"kref\" href=\"#K-L19\">K-L19<\/a><\/code> 一带的游走纪律<\/td><td>资源点要<strong>提前 20 秒布置<\/strong>，不是刷了才去<\/td><\/tr><tr><td><code>L_分路/05_打野.md<\/code>（<a class=\"kref\" href=\"#K-L41\">K-L41<\/a> 时间差）<\/td><td>打野把资源点当成\"时间差的刻度\"，其他位置把它当成\"目标\"<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>待补<\/h2>\n<ul><li><strong>每个资源点的精确经济值<\/strong>（决定\"换\"划不划算）—— 需官方或营地数据<\/li><li><strong>暴君/主宰的具体增益数值<\/strong>（本文档没提，只有\"争不争\"的判断）<\/li><li><strong>风龙/暗影主宰等特殊机制<\/strong>（版本相关，未覆盖）<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方拿了主宰之镜，准备放大龙兵判断依据：大小龙兵的到达时间差决策分支：等小龙兵过一塔一点再放大龙兵 → 两条线不会同时到，对面必须交两轮技能才能清完反例：「拿到就放，…"}]}, {"key": "D", "cat": "对局内", "title": "06 中期：为 10 分钟强化龙做准备", "file": "06_中期.md", "intro": "<blockquote><p>素材：阿泽×国一铠浩宇 2200 分逆风局（BV1VTdGBaEXg）、445 雅典娜百强局（BV1DSPtz4EM9）。 上一节 <code>05_资源点与推进.md<\/code> 讲\"资源怎么排优先级\"，这一节讲\"<strong>中期这段时间的目标是什么<\/strong>\"。<\/p><\/blockquote>\n<h2>1. 中期只有一个目标：把 10 分钟那一波打好<\/h2>\n<p>4–10 分钟这段，很多人会当成\"继续发育\"，然后到 10 分钟突然发现对面已经站好龙坑了。<\/p>\n<p><strong>正确的理解是：这一整段时间是在\"布置\"10 分钟的那一波。<\/strong><\/p>\n<p>所以中期所有动作都要能回答一句：\"这一步对 10 分钟那波有什么用？\"答不上来，就是在空转。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：4–7 分钟该干什么？      → K-D25（发育 + 推进反野，顺手压边塔）\n第 2 步：7–10 分钟该干什么？      → K-D26（抓掉点 + 带线，为龙团铺路）\n第 3 步：10 分钟那一波，站位怎么排？→ K-D27（藏视野，别打正面）\n第 4 步：什么时候该稳一手？        → K-D28（对面掉了人，反而要慢）<\/code><\/pre>", "entries": [{"id": "K-D25", "cat": "D", "title": "4–7 分钟：加速发育 + 推进反野，有优势先压边塔", "self": "<h3><a class=\"kref\" href=\"#K-D25\">K-D25<\/a> 4–7 分钟：加速发育 + 推进反野，有优势先压边塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一条龙打完，进入 4–7 分钟<\/li><li><strong>判断依据<\/strong>：己方有没有优势<\/li><li><strong>决策分支<\/strong>：<\/li><li>有优势 → <strong>先压边塔<\/strong>。边塔掉了才有更多入侵机会（BV1VTdGBaEXg @ 06:06）<\/li><li>有优势 → 带队友<strong>吃对面野区<\/strong>，把雪球滚起来（@ 07:09）<\/li><li>没优势 → 以发育为绝对优先，一波野区一波线<\/li><li><strong>为什么是\"边塔\"不是\"中塔\"<\/strong>：边塔破了对面必须分人守线，中塔破了只是打开地图。<strong>要的是\"逼对面分人\"，不是\"打开地图\"<\/strong>（详见 <code><a class=\"kref\" href=\"#K-D23\">K-D23<\/a><\/code>）<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 06:06、@ 07:09<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一条龙打完，进入 4–7 分钟判断依据：己方有没有优势决策分支：有优势 → 先压边塔。"}, {"id": "K-D26", "cat": "D", "title": "7–10 分钟：抓掉点 + 加快推进，没机会就去带线", "self": "<h3><a class=\"kref\" href=\"#K-D26\">K-D26<\/a> 7–10 分钟：抓掉点 + 加快推进，没机会就去带线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：7–10 分钟<\/li><li><strong>判断依据<\/strong>：小地图上有没有\"对面少人\"的窗口<\/li><li><strong>决策分支<\/strong>：<\/li><li>有掉点 → 加快推进，优先拔外塔，争取上高地（BV1VTdGBaEXg @ 08:58）<\/li><li>没机会 → <strong>去边路带线<\/strong>。一组兵线 + 一片野，经济高于刷两片野区，耗时还更短（@ 08:10）<\/li><li><strong>反例<\/strong>：「没机会就在野区刷」——野区刷完经济是涨了，但<strong>兵线没动<\/strong>，10 分钟那波你还是没位置<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 07:57、@ 08:10、@ 08:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：7–10 分钟判断依据：小地图上有没有\"对面少人\"的窗口决策分支：有掉点 → 加快推进，优先拔外塔，争取上高地（BV1VTdGBaEXg @ 08:58）没机会 → …"}, {"id": "K-D27", "cat": "D", "title": "10 分钟龙团：先藏视野，等队友开起来再绕后", "self": "<h3><a class=\"kref\" href=\"#K-D27\">K-D27<\/a> 10 分钟龙团：先藏视野，等队友开起来再绕后<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟强化龙即将刷新<\/li><li><strong>判断依据<\/strong>：你的英雄<strong>打不打得了正面<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>不灵活的英雄（铠、大部分战士）→ <strong>必须藏视野 + 绕后<\/strong>。打正面会被对面中射消耗掉状态，之后想参团就进不去了（BV1VTdGBaEXg @ 09:11）<\/li><li>灵活/远程的 → 可以正面，但要站在<strong>能吃到队友控制<\/strong>的位置<\/li><li><strong>标准流程<\/strong>（@ 09:35）：<\/li><\/ul>\n<p>``<code> 先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C → 打掉点形成人数差 → 再稳稳拿龙 <\/code>``<\/p>\n<ul><li><strong>为什么\"绕后\"不是\"偷\"<\/strong>：绕后的目的是<strong>在团开起来之后进场<\/strong>，不是绕过去单杀。你先动手，对面五个人都在，你只是送<\/li><li><strong>来源<\/strong>：BV1VTdGBaEXg @ 09:11、@ 09:35<\/li><li><strong>可信度<\/strong>：高（这条对\"不灵活的近战\"是硬约束）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "`` 先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C → 打掉点形成人数差 → 再稳稳拿龙 ``"}, {"id": "K-D28", "cat": "D", "title": "对方掉人时反而要慢：稳一手，先让别人去占视野", "self": "<h3><a class=\"kref\" href=\"#K-D28\">K-D28<\/a> 对方掉人时反而要慢：稳一手，先让别人去占视野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：10 分钟前后，对面有 1–2 人刚死<\/li><li><strong>判断依据<\/strong>：<strong>对面复活时间 vs 你们拿龙需要的时间<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>稳一手开龙 → 让队友先去<strong>占主宰/暴君视野<\/strong>，没有的话点信号让队友去占（BV1DSPtz4EM9 @ 05:57）<\/li><li>抢节奏 → 只有在\"对面剩下的人来不及到\"时才成立<\/li><li><strong>反例<\/strong>：「对面掉了两个人，赶紧打龙」——对面复活 20 秒，龙要打 30 秒，最后 10 秒就是给对面翻盘的机会<\/li><li><strong>配套<\/strong>：这时候最容易犯的错是<strong>以为自己在打龙，其实在打团<\/strong>。所以开龙前先问一句：<strong>对面剩下的人在哪？<\/strong> 看不到人，就是他们要来了<\/li><li><strong>来源<\/strong>：BV1DSPtz4EM9 @ 05:57<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 这段时间最容易犯的三个错<\/h2>\n<ol><li><strong>把中期当\"发育期\"<\/strong>（<a class=\"kref\" href=\"#K-D25\">K-D25<\/a>）→ 到 10 分钟才发现没位置。<\/li><li><strong>龙团打正面<\/strong>（<a class=\"kref\" href=\"#K-D27\">K-D27<\/a>）→ 不灵活的英雄打正面，等于把状态送给对面中射。<\/li><li><strong>对面掉人就急着开龙<\/strong>（<a class=\"kref\" href=\"#K-D28\">K-D28<\/a>）→ 没算复活时间，最后 10 秒被抢。<\/li><\/ol>\n<h2>4. 交叉<\/h2>\n<div class=\"tw\"><table><thead><tr><th>位置<\/th><th>中期的主要任务<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>反野 + 放野给队友，把对位差做出来<\/td><td><code><a class=\"kref\" href=\"#K-L49\">K-L49<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L50\">K-L50<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>跟\"大哥\"转线，不是跟射手<\/td><td><code><a class=\"kref\" href=\"#K-L56\">K-L56<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>有线权就走，别站桩<\/td><td><code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>4 分半自检线（一件成品装 + 鞋、0-0-0）<\/td><td><code><a class=\"kref\" href=\"#K-L37\">K-L37<\/a><\/code><\/td><\/tr><tr><td>发育路<\/td><td>7 分钟前别转线<\/td><td><code><a class=\"kref\" href=\"#K-L28\">K-L28<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>待补<\/h2>\n<ul><li>中期\"经济差多少算优势\"的阈值（素材里只有\"经济大优\"这种定性说法）<\/li><li>逆风中期的处理（这一节全部是均势/优势视角）<\/li><li>各位置在 10 分钟龙团的具体站位（现在只有\"藏视野绕后\"这一条通用原则）<\/li><\/ul>", "sum": "适用版本：S45触发条件：10 分钟前后，对面有 1–2 人刚死判断依据：对面复活时间 vs 你们拿龙需要的时间决策分支：稳一手开龙 → 让队友先去占主宰/暴君视野，没有的话点信号让队友去占（…"}]}, {"key": "D", "cat": "对局内", "title": "07 发育路推进公式", "file": "07_发育路推进公式.md", "intro": "<blockquote><p>素材：小居王者丶《射手的 13 分钟公式化推进思路》（BV1X2jV6KEiP，国服射手视角，S45）。 这是<strong>发育路视角的对局运营全周期<\/strong>教学（从开局对线 → 4 分钟 → 7 分钟 → 10 分钟 → 后期）， 讲的是\"什么时候该干什么、为什么\"，不是连招。下面每条都是录像里明确讲出、可回看的判断。 上游接 <code>04_对线期<\/code>、<code>05_资源点与推进<\/code>、<code>06_中期<\/code>。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：射手只发育赢不了游戏 → 想清楚\"推进\"才是目标（K-D29）\n第 2 步：前期保状态，不是保命 → 别用闪现换血（K-D30）\n第 3 步：清线前先看小地图 → 用看残血兵的时间看信息（K-D31）\n第 4 步：4 分钟后兵线能不能吃 = 看中路线权（K-D32）\n第 5 步：7 分钟前不盲目转线/推塔，循环发育等队友拔塔（K-D33）\n第 6 步：要转线先做风险判定（K-D34）\n第 7 步：中期进野区看对方复活时间，别贪（K-D35）\n第 8 步：射手不追击（K-D36）；顺风不无脑进野区（K-D37）\n第 9 步：逆风防守吃线等机会（K-D38）\n第 10 步：后期团战核心是射手，开团位置选塔前（K-D39）\n第 11 步：10 分钟后团战为推塔拿水晶，不为发育（K-D40）<\/code><\/pre>", "entries": [{"id": "K-D29", "cat": "D", "title": "核心论点：射手只发育赢不了游戏", "self": "<h3><a class=\"kref\" href=\"#K-D29\">K-D29<\/a> 核心论点：射手只发育赢不了游戏<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何\"我分均经济很高但还是输\"的自我怀疑<\/li><li><strong>判断依据<\/strong>：低分段节奏慢，是因为\"大家都热爱发育，唯一有推进能力的射手不去压塔\"（@ 00:23~00:28）<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济高但赢不了 → 问题在<strong>没把经济转成推进/压制<\/strong>，不是经济不够<\/li><li>分均 800 还一直输 → 把\"刷钱\"当成目标本身就是误区（@ 00:07~00:12 学员原话）<\/li><li><strong>反例<\/strong>：「分均 800 块了还输，是队友不行」——同一学员的误区；教练原话\"这不纯扯淡吗\"，根因是没推进<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 00:01~00:28<\/li><li><strong>可信度<\/strong>：高（逻辑自洽，且和 <code>05<\/code> 的\"资源点要转成压制\"一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何\"我分均经济很高但还是输\"的自我怀疑判断依据：低分段节奏慢，是因为\"大家都热爱发育，唯一有推进能力的射手不去压塔\"（@ 00:23~00:28）决策分支：经济高但…"}, {"id": "K-D30", "cat": "D", "title": "保状态 > 保命：前期别用闪现换血", "self": "<h3><a class=\"kref\" href=\"#K-D30\">K-D30<\/a> 保状态 &gt; 保命：前期别用闪现换血<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期要不要交闪现/保命技能<\/li><li><strong>判断依据<\/strong>：高分射手\"时刻保证自己前期状态是好的\"；低分射手\"用闪现来保命，而不是保状态\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>状态不好（残血/没技能）→ <strong>撤，别用闪现硬保<\/strong>（@ 04:26~04:31）<\/li><li>为残血炮车/小野交闪现 → 错，等于把命交给对面（@ 04:19~04:22）<\/li><li><strong>反例<\/strong>：「残血了交闪现跑」——闪现是保<strong>状态<\/strong>的，交掉后下次被越塔就真没招了（@ 04:34 被多人越塔的根因）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:11~04:36<\/li><li><strong>可信度<\/strong>：高（直接对应\"越塔风险来自残血\"的机制）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期要不要交闪现/保命技能判断依据：高分射手\"时刻保证自己前期状态是好的\"；"}, {"id": "K-D31", "cat": "D", "title": "清线前先看小地图：把看残血兵的时间用来看地图", "self": "<h3><a class=\"kref\" href=\"#K-D31\">K-D31<\/a> 清线前先看小地图：把看残血兵的时间用来看地图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每一次准备清兵线之前<\/li><li><strong>判断依据<\/strong>：下路一个人时，清线前看一眼小地图，能决定\"这波线清不清、去哪\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有人来抓 → 这波线不清，直接打旁边小野（@ 03:06~03:11）<\/li><li>没人来抓 → 清完线，再去打小野（@ 03:11~03:13）<\/li><li>对面射辅往中转了 → 兵线卡塔外吃就行（@ 03:35~03:37）<\/li><li><strong>反例<\/strong>：「盯着小兵残血补最后一下」——把注意力全放兵上，被抓时\"刚好停了一下救了我的命\"（@ 03:31~03:34 实录）<\/li><li><strong>为什么重要<\/strong>：意识=把花在兵线上的注意力挪到地图，下一步去哪自然清楚（@ 03:15~03:20）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 03:00~03:34<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每一次准备清兵线之前判断依据：下路一个人时，清线前看一眼小地图，能决定\"这波线清不清、去哪\"决策分支：有人来抓 → 这波线不清，直接打旁边小野（@ 03:06~03:…"}, {"id": "K-D32", "cat": "D", "title": "4 分钟后兵线能不能吃 = 看自家中路线权", "self": "<h3><a class=\"kref\" href=\"#K-D32\">K-D32<\/a> 4 分钟后兵线能不能吃 = 看自家中路线权<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟塔保护消失后，发育路每一波兵线<\/li><li><strong>判断依据<\/strong>：自家中路有没有线权，决定下路兵线进不进塔<\/li><li><strong>决策分支<\/strong>：<\/li><li>中路线权在己方 → 下路兵线能正常处理<\/li><li>中路被压在塔前 → 下路兵线进塔被越塔是<strong>必然<\/strong>（@ 04:48~04:57），不是队友不帮<\/li><li><strong>反例<\/strong>：「自己老是被越塔，是队友不帮」——很多时候队友也被压在塔前，同样动不了（@ 04:57~05:03）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:38~05:03<\/li><li><strong>可信度<\/strong>：高（机制：4 分钟塔保护消失 + 中路线权辐射下路）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟塔保护消失后，发育路每一波兵线判断依据：自家中路有没有线权，决定下路兵线进不进塔决策分支：中路线权在己方 → 下路兵线能正常处理中路被压在塔前 → 下路兵线进…"}, {"id": "K-D33", "cat": "D", "title": "7 分钟前：一组兵线 + 一只小野循环，不盲目转线/推塔", "self": "<h3><a class=\"kref\" href=\"#K-D33\">K-D33<\/a> 7 分钟前：一组兵线 + 一只小野循环，不盲目转线/推塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：优势方 7 分钟前的节奏安排<\/li><li><strong>判断依据<\/strong>：优势方\"7 分钟之前不用到处乱走，也不用考虑去推塔\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>一组兵线 + 一只小野的循环 → 直到队友过来帮你把下塔拔掉（@ 05:06~05:14）<\/li><li>小野刷完\"没事做\"→ 转线？先想清楚收益（@ 05:16~05:19）<\/li><li><strong>反例<\/strong>：「小野刷完了转线吃更多经济」——转线收益提高，风险也同比例提高（@ 05:18~05:26）<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 05:06~05:26<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：优势方 7 分钟前的节奏安排判断依据：优势方\"7 分钟之前不用到处乱走，也不用考虑去推塔\"决策分支：一组兵线 + 一只小野的循环 → 直到队友过来帮你把下塔拔掉（@ …"}, {"id": "K-D34", "cat": "D", "title": "转线前做风险判定：没线权就别转，真转卡队友开团第二时间进场", "self": "<h3><a class=\"kref\" href=\"#K-D34\">K-D34<\/a> 转线前做风险判定：没线权就别转，真转卡队友开团第二时间进场<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想从发育路转中去吃线/参团<\/li><li><strong>判断依据<\/strong>：下路二打二有没有抢到线权<\/li><li><strong>决策分支<\/strong>：<\/li><li>没抢到线权 → 转中比对方射手<strong>来得晚<\/strong>，转线收益抵消（@ 05:37~05:43）<\/li><li>真要转 → 等\"全场信息吃全\"（对方开主宰等）后，卡在<strong>队友开团时第二时间进场<\/strong>（@ 05:55~06:05）<\/li><li><strong>反例<\/strong>：「清完线就转中再吃一波」——这波还有更好选择：利用对方以为能防守反击的心理，入侵蓝野区（@ 06:06~06:47）<\/li>
