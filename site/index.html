手<\/strong>：百里守约<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：守约的射程和消耗在前中期完全压住狄仁杰。这一段的正确做法是<strong>放弃线权、卡在塔前吃兵<\/strong>，不要试图跟他换血。撑到后期装备成型，你的持续输出才盖过他。<\/li><li><strong>反向反制<\/strong>：守约的弱点是被贴脸。自家打野来抓的时候，你必须第一时间跟上，别等他跑了才动。<\/li><li><strong>来源<\/strong>：BV1YNxz6YEMy @ 10:47<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>狄仁杰 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打狄仁杰」「狄仁杰怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：百里守约克制层级：数值克我该怎么做：守约的射程和消耗在前中期完全压住狄仁杰。", "opp": "百里守约"}], "lanes": ["adc"], "tempo": "even", "job": "hold", "motto": "会平A就行，大招全空也能打", "beats": ["虞姬", "露娜"], "loses": ["云中君", "兰陵王", "花木兰"], "main_lane": "adc", "type": "射手", "unlisted": false, "n": 7, "b_n": 3, "vs": ["哪吒", "百里守约"], "beats_n": 2, "loses_n": 3, "incoming": ["云中君", "兰陵王", "花木兰"], "loses_all": ["云中君", "兰陵王", "花木兰"], "lane_names": ["发育路"]}, {"name": "苏烈", "hue": 273, "a": [{"id": "K-A01", "cat": "A", "title": "苏烈的核心是\"第三棍\"和\"二技能\"，不是大招", "self": "<h3><a class=\"kref\" href=\"#K-A01\">K-A01<\/a> 苏烈的核心是\"第三棍\"和\"二技能\"，不是大招<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何需要苏烈先手的局面<\/li><li><strong>判断依据<\/strong>：对面站位是否进入三段普攻的追击距离；二技能冷却是否可用<\/li><li><strong>决策分支<\/strong>：<\/li><li>二技能可用 → 优先用它把对面的开团手<strong>推离<\/strong>，或者把落单的人<strong>推回<\/strong>队友方向<\/li><li>二技能不可用 → 不要用大招硬开，改打三棍逼退<\/li><li><strong>反例<\/strong>：「辅助的大招就是用来开团的」——苏烈大招蓄力期间不能动，盲目蓄力等于把自己钉在原地等人集火。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:21；BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何需要苏烈先手的局面判断依据：对面站位是否进入三段普攻的追击距离；"}, {"id": "K-A02", "cat": "A", "title": "二技能有两个完全不同的用途，别只用一个", "self": "<h3><a class=\"kref\" href=\"#K-A02\">K-A02<\/a> 二技能有两个完全不同的用途，别只用一个<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：二技能可用时<\/li><li><strong>判断依据<\/strong>：对面有没有正在进行的位移/突进技能<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>挡<\/strong>：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间<\/li><li><strong>推<\/strong>：抓落单时把目标推向队友方向，不是推离<\/li><li><strong>反例<\/strong>：「二技能就是个位移」——它同时是<strong>拦截<\/strong>手段。挡下一次开团的价值，往往高于推一个人。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 02:21<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：二技能可用时判断依据：对面有没有正在进行的位移/突进技能决策分支：挡：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间推：抓落单时把目标推向队友方向…"}, {"id": "K-A03", "cat": "A", "title": "被动是资源，不是保命符", "self": "<h3><a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 被动是资源，不是保命符<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每次准备进场前<\/li><li><strong>判断依据<\/strong>：被动是否可用（有 / 无）；队友是否在附近能\"点灯\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有被动 → 可以硬吃一波伤害，打出被动后还能给附近的双 C 回血<\/li><li>无被动 → <strong>不许硬接<\/strong>，只能打边缘消耗<\/li><li><strong>反例<\/strong>：「我是肉辅，先冲进去扛」——没被动时苏烈就是一个普通近战，进去等于送人头。字幕里出现过\"没点到灯，不然可以二技能跑\"，说明<strong>被动依赖队友点亮<\/strong>，队友不在时它根本不算数。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:00；BV1yke26fEYB @ 04:14；BV1yke26fEYB @ 06:31<\/li><li><strong>可信度<\/strong>：中高（\"点灯\"细节来自实战解说，非二手攻略）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A04\">K-A04<\/a> 前期不要抢打野的尾刀<\/h3>\n<p>这条<strong>跟苏烈无关<\/strong>，是游走通用纪律，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code>。原来源 BV1yke26fEYB @ 02:28 一并带过去。<\/p>\n<h2>4. 出装与铭文（两套，按位置选）<\/h2>\n<p><strong>打对抗路（边路）<\/strong><\/p>\n<ul><li>铭文：<strong>10 狩猎 + 10 鹰眼 + 10 异变<\/strong>（\"百穿\"，狩猎是为了保攻速）<\/li><li>出装：对线强 → 先荆棘护手；对线不强 → 攻速鞋 → <strong>第二件必出暗影战斧<\/strong>（给 CD + 穿透 + 输出）→ 荆棘护手升反甲<\/li><li>来源：BV1BpdNYZEYj @ 04:54、@ 03:56、@ 04:11<\/li><\/ul>\n<p><strong>打游走（辅助）<\/strong><\/p>\n<ul><li>铭文：<strong>10 宿命 + 5 狩猎 + 5 调和 + 10 虚空<\/strong>（苏烈要兼顾开团，移速和坦度都得有）<\/li><li>出装：前期疾跑鞋（方便支援）→ 中后期换抵抗之靴（提高容错）；辅助装按对局选（射手需要主动上前时先做星泉）<\/li><li>来源：BV17Vp9zXEx2 @ 01:10、@ 01:17、@ 01:32<\/li><\/ul>\n<p><strong>两条共同点<\/strong>：都不是\"堆输出\"的思路，铭文都在补攻速/移速/坦度，因为苏烈的核心是<strong>把控制打出来<\/strong>，不是自己打伤害。<\/p>\n<ul><li>版本提示：两条素材都未标 S45（浩克是训练营通用向、云兽是解析 AG 大帅的职业打法），<strong>具体装备数值以游戏内为准<\/strong>，配置结构可直接照用。<\/li><\/ul>\n<h2>5. 全局思路（辅助位）<\/h2>\n<blockquote><p><strong>分路层面<\/strong>的通用做法（开局去哪、怎么帮中、怎么跟射手）已统一收进 <code>L_分路/02_游走.md<\/code>，这一节只留苏烈自己的东西。<\/p><\/blockquote>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A05\">K-A05<\/a> 开局：连人带兵一起消耗，而不是单纯抢线<\/h3>\n<p>这是<strong>游走通用动作<\/strong>（任何有消耗手段的辅助都该这么打），已迁到 <code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code>。<\/p>", "sum": "这条跟苏烈无关，是游走通用纪律，已迁到 L_分路/02_游走.md 的 K-L13。"}, {"id": "K-A06", "cat": "A", "title": "被动要主动用，别舍不得", "self": "<h3><a class=\"kref\" href=\"#K-A06\">K-A06<\/a> 被动要主动用，别舍不得<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：有被动且能吃一波关键伤害<\/li><li><strong>判断依据<\/strong>：这波吃了之后，队友能不能跟着打赢<\/li><li><strong>决策分支<\/strong>：该触就触；触发后给附近双 C 回血，是团队收益<\/li><li><strong>反例<\/strong>：「留着被动保命」——原话直接说\"很多苏烈会舍不得触发被动，这点是错误的\"。<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:32<\/li><li><strong>可信度<\/strong>：高（与原 <a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 一致，互为印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：有被动且能吃一波关键伤害判断依据：这波吃了之后，队友能不能跟着打赢决策分支：该触就触；"}, {"id": "K-A07", "cat": "A", "title": "开团前必须和队友沟通好\"帮你踩灯\"", "self": "<h3><a class=\"kref\" href=\"#K-A07\">K-A07<\/a> 开团前必须和队友沟通好\"帮你踩灯\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备先手开团<\/li><li><strong>判断依据<\/strong>：周围有没有队友能点亮你的被动<\/li><li><strong>决策分支<\/strong>：先打字/信号确认，再开团；没人踩灯就不要主动吃伤害<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:07<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 新手最容易崩在哪一步<\/h2>\n<ul><li><strong>在第 0 步（确认被动）上<\/strong>：忘记看被动，进场被判死一次之后整局都不敢开团，从\"开节奏\"退化成\"挂机跟团\"。<\/li><li><strong>在第 3 步（三棍）上<\/strong>：打两棍就急着交二技能，第三段击飞永远打不出来——苏烈的控制全在第三棍上。<\/li><\/ul>\n<h2>5. 待补<\/h2>\n<ul><li>具体数值（被动冷却、大招蓄力时长、二技能距离）<strong>未从素材中获得<\/strong>，需官网英雄页核对后补。<\/li><li>对抗路/辅助两套配置已补（见第 4 节），但都未标 S45，数值需游戏内核对。<\/li><li>强势期/弱势期缺素材（该视频是顺风局，看不出逆风时苏烈的下限）。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>大闪开团<\/strong>：大闪是起手式。熟练之后可以<strong>反向着大<\/strong>——大招有偏心判定，对面会误判打不到。<\/li><li><strong>一技能强化 A 的前后摇能被大招取消<\/strong>：所以连招里大招不只是伤害，是<strong>取消器<\/strong>。<\/li><li><strong>二技能只要边缘擦到脚下红圈就能推到<\/strong>：前摇带<strong>假霸体<\/strong>，可以顶着控制推。<\/li><li><strong>蓄大时把手指按在取消键上<\/strong>：被打断不会自动放出去。<\/li><li><strong>残血别贴墙<\/strong>：灯会卡墙里，队友点不到。<\/li><li><strong>怕大司命、甄姬造出来的墙<\/strong>：撤退撞墙会直接停住。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "触发条件：准备先手开团判断依据：周围有没有队友能点亮你的被动决策分支：先打字/信号确认，再开团；"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/194.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>孙悟空<\/strong><\/td><td>打野<\/td><td>“苏烈拥有超强的控制技能，当孙悟空对脆皮英雄发起突袭时，苏烈可以轻松克制并保护队友。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>米莱狄<\/strong><\/td><td>中路<\/td><td>“苏烈释放大招时，敌人越多，站位越密集，伤害越高。可以专门用来克制米莱狄的机械大军”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>阿古朵<\/strong><\/td><td>打野／发育路<\/td><td>“苏烈的AOE能力可以快速清掉阿古朵的召唤物”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>阿轲<\/strong><\/td><td>打野<\/td><td>“苏烈被动自带超高的护甲和魔抗，阿轲想近身与苏烈肉搏是基本没有胜算的。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>孙尚香<\/strong><\/td><td>发育路<\/td><td>“苏烈的控制技能都有一定的释放前摇，孙尚香可以快速频繁的位移躲开苏烈的攻击。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>达摩<\/strong><\/td><td>对抗路<\/td><td>“苏烈进场释放大招的时候，达摩可以迅速打断他，并将他击飞到战场以外。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鬼谷子、庄周<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/194.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B01", "cat": "B", "title": "对孙策：机制克——二技能能挡下他的船", "self": "<h3><a class=\"kref\" href=\"#K-B01\">K-B01<\/a> 对孙策：机制克——二技能能挡下他的船<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：孙策（开大冲脸）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong><\/li><li><strong>我该怎么做<\/strong>：孙策开大的一瞬间，把二技能放在<strong>他和自家 C 位之间<\/strong>，用身位当墙。挡下来之后不要追，退回 C 位旁边。<\/li><li><strong>反向反制<\/strong>：孙策可以等你二技能交完再开船；所以<strong>二技能不要提前交在别的地方<\/strong>。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中（单来源实战解说）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：孙策（开大冲脸）克制层级：机制克我该怎么做：孙策开大的一瞬间，把二技能放在他和自家 C 位之间，用身位当墙。", "opp": "孙策"}, {"id": "K-B02", "cat": "B", "title": "对云缨：她的霸体期间你什么都做不了，等结束再推", "self": "<h3><a class=\"kref\" href=\"#K-B02\">K-B02<\/a> 对云缨：她的霸体期间你什么都做不了，等结束再推<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：云缨（大招霸体）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>苏烈被克<\/strong>，不是克别人<\/li><li><strong>我该怎么做<\/strong>：云缨开大期间不要试图控制她，<strong>等霸体结束<\/strong>再往队友方向推。<\/li><li><strong>反例<\/strong>：「我是硬辅，控住就行」——霸体期间控制无效，你的三棍和大招全部白交，还把自己留在她身边。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:55；BV1yke26fEYB @ 04:57<\/li><li><strong>可信度<\/strong>：中高（解说里明确说了\"他的大招有霸体，插不了火，等他结束往宫本那边推\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<p>&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;<\/p>\n<h2>官方口径（L0 · 未经实测）<\/h2>\n<blockquote><p>来源：官方英雄详情页 <code>herodetail/194.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>孙悟空<\/strong><\/td><td>打野<\/td><td>“苏烈拥有超强的控制技能，当孙悟空对脆皮英雄发起突袭时，苏烈可以轻松克制并保护队友。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>米莱狄<\/strong><\/td><td>中路<\/td><td>“苏烈释放大招时，敌人越多，站位越密集，伤害越高。可以专门用来克制米莱狄的机械大军”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>阿古朵<\/strong><\/td><td>打野／发育路<\/td><td>“苏烈的AOE能力可以快速清掉阿古朵的召唤物”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>阿轲<\/strong><\/td><td>打野<\/td><td>“苏烈被动自带超高的护甲和魔抗，阿轲想近身与苏烈肉搏是基本没有胜算的。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>孙尚香<\/strong><\/td><td>发育路<\/td><td>“苏烈的控制技能都有一定的释放前摇，孙尚香可以快速频繁的位移躲开苏烈的攻击。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>达摩<\/strong><\/td><td>对抗路<\/td><td>“苏烈进场释放大招的时候，达摩可以迅速打断他，并将他击飞到战场以外。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鬼谷子、庄周<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>\n<h2>待补<\/h2>\n<ul><li>苏烈怕哪些远程消耗型辅助（无素材）<\/li><li>苏烈对软辅（大乔、蔡文姬类）的压制关系（无素材）<\/li><li>以上两条需要专门的\"对位\"视频，<code>B_克制关系/_说明.md<\/code> 已记门槛<\/li><\/ul>", "sum": "&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;", "opp": "云缨"}], "lanes": ["roam"], "tempo": "even", "job": "open", "motto": "大闪开团，蓄大时手指按在取消键上", "beats": ["孙悟空", "米莱狄", "阿古朵", "阿轲"], "loses": ["孙尚香", "达摩"], "main_lane": "roam", "type": "辅助", "unlisted": false, "n": 7, "b_n": 3, "vs": ["云缨", "孙策"], "beats_n": 4, "loses_n": 2, "incoming": ["孙尚香", "达摩"], "loses_all": ["孙尚香", "达摩"], "lane_names": ["游走"]}, {"name": "铠", "hue": 214, "a": [{"id": "", "cat": "", "title": "1. 机制内核：大招给的不是伤害，是\"每段减伤\"", "self": "<h3>1. 机制内核：大招给的不是伤害，是\"每段减伤\"<\/h3>", "html": "<p>三段机制要分开看：<\/p>\n<div class=\"tw\"><table><thead><tr><th>机制<\/th><th>内容<\/th><th>带来什么<\/th><\/tr><\/thead><tbody><tr><td><strong>大招<\/strong><\/td><td>巨额物理攻击加成 + <strong>每一段攻击格挡固定伤害<\/strong><\/td><td>不是\"变肉\"，是\"<strong>多段伤害打不进来<\/strong>\"<\/td><\/tr><tr><td><strong>二技能<\/strong><\/td><td>位移 + 强化普攻，<strong>强普持续 5 秒<\/strong><\/td><td>可以<strong>提前存<\/strong>，所以铠能\"手里常备一发\"<\/td><\/tr><tr><td><strong>一技能<\/strong><\/td><td>命中给自己加速/攻速，命中敌人给减速<\/td><td>留人靠这个，不靠平 A<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>由此推出铠真正的强度来源：<\/strong><\/p>\n<ul><li>因为大招是<strong>每段<\/strong>格挡 → 铠极度克制<strong>高频多段伤害<\/strong>：澜、后羿的强化平A、嬴政大招（BV1rZLv65EhP @ 03:24）<\/li><li>因为大招给巨额攻击力 → <strong>全肉只有一把红刀也能切后排<\/strong>（全肉 + 红刀血量约 1.2–1.3 万，同时还能给自己减速/加速/百分比回血/加攻速/群体控制，BV1rZLv65EhP @ 04:40）<\/li><li>因为强普能存 5 秒 → 铠的爆发是\"两段强普叠在一起\"，不是一段<\/li><\/ul>", "sum": "三段机制要分开看："}, {"id": "", "cat": "", "title": "2. 三个必须练成肌肉记忆的细节", "self": "<h3>2. 三个必须练成肌肉记忆的细节<\/h3>", "html": "<h3>2.1 双强普：有二技能就放，手里永远留一发<\/h3>\n<p>强普持续 5 秒，有蓝 Buff 时二技能 CD 很短。所以正确做法是<strong>二技能有了就按<\/strong>，让自己手里始终挂着一次强普；靠近目标后 <strong>2A<\/strong> 连打两次强普（BV1VTdGBaEXg @ 02:20）。<\/p>\n<p>清野时也一样，双强普能让清野更快。<strong>这不是花活，是铠唯一的\"爆发窗口\"构造方式。<\/strong><\/p>\n<h3>2.2 一技能可以扔野怪和小兵<\/h3>\n<p>一技能不好标人时，<strong>扔旁边的野怪或小兵<\/strong>，一样能吃到移速和攻速（BV1VTdGBaEXg @ 02:32）。<\/p>\n<p>进阶：像蔡文姬弹弹弹一样，<strong>通过小兵把减速传到人身上<\/strong>——同一句话里 UP 给的两个用法，第二个需要小兵和人在一条线上。<\/p>\n<h3>2.3 两个操作设置（直接影响上限）<\/h3>\n<ul><li><strong>普攻近距离优先选\"主要\"<\/strong>：用来送方向盘穿墙（BV1VTdGBaEXg @ 00:45）<\/li><li><strong>技能中断方式改成\"拖动\"<\/strong>：这样团战里乱点也不会把大招提前取消（BV1VTdGBaEXg @ 00:45）<\/li><\/ul>", "sum": "强普持续 5 秒，有蓝 Buff 时二技能 CD 很短。"}, {"id": "", "cat": "", "title": "3. 出装与铭文", "self": "<h3>3. 出装与铭文<\/h3>", "html": "<p><strong>顺序（阿泽/浩宇版）<\/strong>：<\/p>\n<pre><code>野刀 → 二级野刀 → CD 鞋 → 暗影战斧 → 荆棘护手 → 反甲 → 宗师之力 → 破魔刀/魔女<\/code><\/pre>\n<p>逐件的理由（BV1VTdGBaEXg @ 00:57–01:52）：<\/p>\n<div class=\"tw\"><table><thead><tr><th>件<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>二级野刀 → <strong>CD 鞋<\/strong><\/td><td>冷却鞋 + 蓝 Buff 直接凑满 35% CD，大招好得特别快，前期打架能力更强<\/td><\/tr><tr><td><strong>暗影战斧<\/strong><\/td><td>核心装备。对面有猴子/机小满这种高爆发物伤 → <strong>换护甲鞋<\/strong>；法伤高或控制多 → <strong>换抵抗鞋<\/strong>；前期大逆风可先换鞋抗压<\/td><\/tr><tr><td><strong>荆棘护手<\/strong>（前期先出）<\/td><td>加护甲，做完再升大打野刀发育<\/td><\/tr><tr><td><strong>反甲<\/strong><\/td><td>护手合成<\/td><\/tr><tr><td><strong>宗师之力<\/strong><\/td><td>提爆发<\/td><\/tr><tr><td><strong>破魔刀 / 魔女斗篷<\/strong><\/td><td>想伤害高选破魔刀；对面有炸弹猫这种消耗强的做法系，出魔女<\/td><\/tr><tr><td><strong>名刀<\/strong>（预购）<\/td><td>大后期卖鞋换名刀 → 再换复活<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>铭文<\/strong>：蓝色 10 狩猎 / 绿色 10 鹰眼 / 红色 10 祸源（移速暴击铭文，BV1VTdGBaEXg @ 02:07）。<\/p>\n<blockquote><p><strong>核心心法<\/strong>：铠是\"<strong>每出一件新装备就是一个新的强度<\/strong>\"的英雄（BV1rZLv65EhP @ 01:44）。所以它不怕阵容——不适合做输出就直接做半肉，对面秒伤高就只留一把红刀。这也是为什么铠\"几乎可以不看任何阵容直接拿\"。<\/p><\/blockquote>", "sum": "顺序（阿泽/浩宇版）："}, {"id": "", "cat": "", "title": "4. 全局思路：一条时间轴", "self": "<h3>4. 全局思路：一条时间轴<\/h3>", "html": "<p>这条轴来自 2200 分逆风翻盘局（BV1VTdGBaEXg @ 02:46 起），<strong>注意它是逆风局<\/strong>，所以节奏偏保守。<\/p>\n<h3>4.0 开局先分析阵容，再决定帮哪路<\/h3>\n<p>常规是\"前期帮对抗路\"，但这一把<strong>中路边路强度都不如对面<\/strong>，于是改成<strong>帮发育路<\/strong>（@ 02:46）。<\/p>\n<p><strong>判据<\/strong>：不是\"打野该帮哪路\"，是\"<strong>哪路打得过<\/strong>\"。打不过的路去了只是送。<\/p>\n<h3>4.1 0:00–0:30 占位与存刀<\/h3>\n<ol><li>开局<strong>鞋子换野刀<\/strong>，增加出门速度（@ 02:59）<\/li><li><strong>先占红背草<\/strong>，防对面野辅入侵<\/li><li><strong>26 秒存第一刀强普<\/strong> → 30 秒红 Buff 刷新，直接穿墙 A 过来开红<\/li><\/ol>\n<p>开野路线：<strong>红 Buff + 小猪 + 猴子 → 蓝区双狼 + 蓝 Buff + 蜥蜴<\/strong>（红开刷六野，@ 03:13）。<\/p>\n<h3>4.2 刷完第一轮：能抓就抓，抓不到就蹭线<\/h3>\n<p>帮发育路尝试抓人，抓不到就<strong>蹭一波兵线<\/strong>，然后回中路帮抢线（@ 03:25）。<\/p>\n<p><strong>这条是打野的通用心法<\/strong>：支援的收益不是\"必须拿到人头\"，是\"<strong>追到有人头，追不到有兵线<\/strong>\"，不管结果如何都有钱拿（@ 04:01）。<\/p>\n<h3>4.3 4 分钟前：一波野区一波线<\/h3>\n<p>以快速发育为绝对优先。<strong>一波野区 + 一波线，经济高于连着刷两片野区<\/strong>，而且耗时更短（@ 04:13、@ 07:21）。<\/p>\n<h3>4.4 抢线权的连锁：这是本卡最值得学的一段<\/h3>\n<p>@ 05:04 的完整链条：<\/p>\n<pre><code>盯小地图 → 中路视野没漏就绝不出去\n→ 敌方中路在下路露头的瞬间，果断出来抢线\n→ 中路二打一拿到线权 → 自家中单解放，提前动起来\n→ 敌方打野只能后手清线\n→ 抓住这个窗口入侵他的红区\n→ 对面中路就算传送过来，也不可能比自家中路来得快<\/code><\/pre>\n<p><strong>这条链的核心<\/strong>：抢线权不是为了兵线，是为了<strong>制造一个 5 秒的窗口，让你的入侵合法<\/strong>。单看\"抢中线\"没有意义，看\"抢完能做什么\"才有。<\/p>\n<h3>4.5 4–7 分钟：加速发育 + 推进反野<\/h3>\n<ul><li>有优势就<strong>先压边塔<\/strong>——边塔掉了才有更多入侵机会（@ 06:06）<\/li><li>优势时<strong>带队友吃对面野区<\/strong>，滚雪球（@ 07:09）<\/li><li><strong>不超过半图的团战都要跟<\/strong>，且是<strong>后手入场<\/strong>（对面技能交得差不多了，@ 06:57）<\/li><\/ul>\n<h3>4.6 让红的判断（很多人做错）<\/h3>\n<p>铠<strong>不太吃红 Buff<\/strong>：留人主要靠一技能减速，很少有机会直接 A 到人，所以中后期有没有红区别不大（@ 06:19）。<\/p>\n<p><strong>让红的时间点取决于射手水平<\/strong>：<\/p>\n<ul><li>射手会玩 → <strong>5–6 分钟后就可以让<\/strong><\/li><li>射手一般 → <strong>9–10 分钟再让<\/strong><\/li><\/ul>\n<h3>4.7 7–10 分钟：为强化龙团做准备<\/h3>\n<ul><li>主要任务是<strong>抓掉点 + 加快推进<\/strong>（@ 07:57）<\/li><li>没机会就<strong>去边路带线<\/strong>——铠单挑基本无敌，而且\"一组兵线一片野\"比刷两片野经济更高、耗时更少（@ 08:10）<\/li><\/ul>\n<h3>4.8 10 分钟龙团：必须藏视野绕后<\/h3>\n<p><strong>这是铠最容易送的一波。<\/strong> 铠不算灵活，打正面很容易被对面中射消耗掉状态，之后想参团就进不去了（@ 09:11）。<\/p>\n<p>标准流程（@ 09:35）：<\/p>\n<pre><code>先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C\n→ 打掉点形成人数差 → 再稳稳拿龙<\/code><\/pre>\n<h3>4.9 顺风逆风的资源选择<\/h3>\n<p><strong>顺风优先拿暴君，逆风优先拿主宰<\/strong>（@ 08:58）。<\/p>", "sum": "这条轴来自 2200 分逆风翻盘局（BV1VTdGBaEXg @ 02:46 起），注意它是逆风局，所以节奏偏保守。"}, {"id": "", "cat": "", "title": "5. 铠弱在哪（要提前知道）", "self": "<h3>5. 铠弱在哪（要提前知道）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>弱点<\/th><th>表现<\/th><th>应对<\/th><\/tr><\/thead><tbody><tr><td><strong>逆风纠结<\/strong><\/td><td>出肉扛不住，出输出又切不到人（BV1rZLv65EhP @ 02:53）<\/td><td>多憋两件装备，别在只有一件成品时就强开<\/td><\/tr><tr><td><strong>怕灵活后排<\/strong><\/td><td>对面\"牛魔 + 马可\"、\"孙尚香 + 张飞\"这类组合，切后排极难（@ 03:08）<\/td><td>改打\"保护 + 拆火\"：和自家中路一起蹲对面打野切 C 的时机（BV1VTdGBaEXg @ 08:45）<\/td><\/tr><tr><td><strong>装备太多挑花眼<\/strong><\/td><td>同一个局面有三四种能出的装<\/td><td>先定\"这局我是切 C 还是吃伤害\"，再选装<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "弱点表现应对逆风纠结出肉扛不住，出输出又切不到人（BV1rZLv65EhP @ 02:53）多憋两件装备，别在只有一件成品时就强开怕灵活后排对面\"牛魔 + 马可\"、\"孙尚香 + 张飞\"这类组合…"}, {"id": "", "cat": "", "title": "6. 一句话", "self": "<h3>6. 一句话<\/h3>", "html": "<p><strong>铠的强度不在操作，在\"你什么时候存下那两发强普\"和\"你绕后之前有没有藏住视野\"。<\/strong><\/p>", "sum": "铠的强度不在操作，在\"你什么时候存下那两发强普\"和\"你绕后之前有没有藏住视野\"。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/193.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（6）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>司马懿<\/strong><\/td><td>打野／中路<\/td><td>“司马懿在突袭方面具有很大的优势，但是，如果敌方正在发愁如何开战的话，就是另外一种情况了，…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>后羿<\/strong><\/td><td>发育路<\/td><td>“没位移的射手英雄要离铠远一点哦”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>夏洛特<\/strong><\/td><td>对抗路<\/td><td>“开启大招后的铠具有格挡状态，能够有效克制夏洛特的多段伤害”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>蒙犽<\/strong><\/td><td>发育路<\/td><td>“多段的技能伤害会被铠大招格挡掉大部分，无法利用伤害压制这位峡谷刀王”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>马超<\/strong><\/td><td>对抗路／打野<\/td><td>“同时拥有高额减速与定向爆发力的铠，可以让更偏刺客能力的马超非常难受”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“没位移的射手英雄要离铠远一点哦”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>公孙离<\/strong><\/td><td>发育路<\/td><td>“铠是无法对公孙离造成太大的威胁的，无论自身位移还是击退，都可以反制大部分战士坦克突袭”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>芈月<\/strong><\/td><td>对抗路／打野<\/td><td>“铠容易被长手法师风筝”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>蒙恬<\/strong><\/td><td>对抗路<\/td><td>“蒙恬的技能机制让铠这类高爆发英雄难以发挥”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>诸葛亮<\/strong><\/td><td>打野／中路<\/td><td>“铠容易被长手法师风筝”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：宫本武藏、花木兰<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/193.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B26", "cat": "B", "title": "对诸葛亮／法师：战士刺客很难打法系，这是通病", "self": "<h3><a class=\"kref\" href=\"#K-B26\">K-B26<\/a> 对诸葛亮／法师：战士刺客很难打法系，这是通病<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：诸葛亮／法师<\/li><li><strong>克制层级<\/strong>：机制克<\/li><li><strong>我该怎么做<\/strong>：不是铠一个人的问题——铠、典韦这类近战爆发打法系都难受，因为法系有控制有位移还能远程消耗。你要做的是<strong>别在法术射程里出现<\/strong>，从侧面或草丛起手，一套打完就走。<\/li><li><strong>反向反制<\/strong>：法师的弱点是身板脆、怕贴脸。等他的控制技能交掉（比如诸葛亮的大招被打断）再进场。<\/li><li><strong>来源<\/strong>：BV1Qjeb69Eu9 @ 01:34<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>铠 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打铠」「铠怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：诸葛亮／法师克制层级：机制克我该怎么做：不是铠一个人的问题——铠、典韦这类近战爆发打法系都难受，因为法系有控制有位移还能远程消耗。", "opp": "诸葛亮"}], "lanes": ["jungle"], "tempo": "late", "job": "split", "motto": "存两发强普，绕后之前先藏住视野", "beats": ["司马懿", "后羿", "夏洛特", "蒙犽", "马超", "鲁班七号"], "loses": ["公孙离", "芈月", "蒙恬", "诸葛亮"], "main_lane": "jungle", "type": "战士", "unlisted": false, "n": 7, "b_n": 2, "vs": ["诸葛亮"], "beats_n": 6, "loses_n": 4, "incoming": ["公孙离", "芈月", "蒙恬", "诸葛亮"], "loses_all": ["公孙离", "芈月", "蒙恬", "诸葛亮"], "lane_names": ["打野"]}, {"name": "公孙离", "hue": 204, "a": [{"id": "", "cat": "", "title": "1. 机制内核：三个技能都是\"位移 + 一段伤害\"，所以它是游射", "self": "<h3>1. 机制内核：三个技能都是\"位移 + 一段伤害\"，所以它是游射<\/h3>", "html": "<p>公孙离的强不在于单次伤害，在于<strong>每次技能都能换一次身位<\/strong>。这推出三件事：<\/p>\n<ol><li><strong>伤害必须打满被动<\/strong>——一套 1A2A 是最短的\"打满四层\"路径（@ 02:03）<\/li><li><strong>二技能是盾不是伤害<\/strong>——它能<strong>挡掉普攻<\/strong>（@ 01:14、@ 01:37），所以对线期真正的核心技能是二技能，不是一技能<\/li><li><strong>回伞是唯一的\"撤销键\"<\/strong>——大招回伞可以把自己从进场位置拉回来（@ 11:26），这是所有激进操作的兜底<\/li><\/ol>", "sum": "公孙离的强不在于单次伤害，在于每次技能都能换一次身位。"}, {"id": "", "cat": "", "title": "2. 对线：劣势方永远不要先碰兵线", "self": "<h3>2. 对线：劣势方永远不要先碰兵线<\/h3>", "html": "<ul><li><strong>开局只分析两件事<\/strong>：中路有没有线权、射辅对线强度（@ 00:11）<\/li><li>阿离打戈娅属于<strong>全时期被压制<\/strong>（@ 00:16）→ 这把的定位就是抗压<\/li><li><strong>劣势方把线卡在自家塔前<\/strong>，对面想压就上去打一套 1A2A（@ 01:51、@ 02:03）<\/li><li><strong>永远不先手碰兵线<\/strong>：先碰线 = 兵线位置前移 = 你离开塔的保护（@ 02:03）<\/li><li><strong>换血的时机是\"对面补刀\"<\/strong>：后排兵残血时，对面一定会前压补刀，这时二技能好了就打一套（@ 02:15）——这就是无伤消耗<\/li><li><strong>红隼用二技能斩杀<\/strong>：二技能挡普攻，保证稳拿前期红隼（@ 01:37）<\/li><li>对线期只干两件事：<strong>控好兵线和周边野怪 / 用换血技能把对面打残<\/strong>（@ 03:03）<\/li><\/ul>", "sum": "开局只分析两件事：中路有没有线权、射辅对线强度（@ 00:11）阿离打戈娅属于全时期被压制（@ 00:16）→ 这把的定位就是抗压劣势方把线卡在自家塔前，对面想压就上去打一套 1A2A（@ 0…"}, {"id": "", "cat": "", "title": "3. 连招：起手式由对方的血量决定", "self": "<h3>3. 连招：起手式由对方的血量决定<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>为什么<\/th><\/tr><\/thead><tbody><tr><td>对线换血<\/td><td><strong>1A2A<\/strong><\/td><td>最短的打满被动路径（@ 02:03）<\/td><\/tr><tr><td>打脆皮<\/td><td><strong>A1A 起手<\/strong><\/td><td>快速打满被动，不给他反应（@ 07:54）<\/td><\/tr><tr><td>打战士 / 高经济目标<\/td><td><strong>A3 起手<\/strong><\/td><td>用大招把每段技能当位移，一段一段拉断他的普攻（@ 07:54、@ 08:06）<\/td><\/tr><tr><td>追杀残血<\/td><td>大招起手<\/td><td><strong>只有追杀才允许大招起手<\/strong>，其他情况先一二技能消耗，别 all in（@ 09:07）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>原话：\"大招起手只适用于你追杀对面，也就是说对面是残血或者没技能了。\"<\/p><\/blockquote>", "sum": "原话：\"大招起手只适用于你追杀对面，也就是说对面是残血或者没技能了。"}, {"id": "", "cat": "", "title": "4. 中后期：边路是舒适区，清边转中", "self": "<h3>4. 中后期：边路是舒适区，清边转中<\/h3>", "html": "<ul><li><strong>4 分钟以后只在两种情况下转线<\/strong>：自家一塔守不住 / 推掉对面一塔（@ 04:51）<\/li><li><strong>中期舒适区是边路<\/strong>：一个人吃线，经济最高（@ 06:17）<\/li><li>循环：<strong>清边 → 转中吃线 → 中没线就吃野怪<\/strong>（@ 06:54）<\/li><li><strong>移速是这套循环的引擎<\/strong>：末世 + 疾跑鞋（都有血量加成）让你比对面更早抓到 timing（@ 06:05、@ 06:29）<\/li><li><strong>后期团战必须手上有红 Buff<\/strong>（@ 10:51）<\/li><li><strong>压高地前先留一把撤退伞<\/strong>（@ 11:26）<\/li><\/ul>", "sum": "4 分钟以后只在两种情况下转线：自家一塔守不住 / 推掉对面一塔（@ 材未给出固定连招表，见待补。"}, {"id": "", "cat": "", "title": "4. 中后期/节奏", "self": "<h3>4. 中后期/节奏<\/h3>", "html": "<ul><li><strong>真正的节奏点只有 10 分钟龙点<\/strong>：10 分钟前\"边刷边发育，没机会就发育\"（BV13yfLByERE @ 06:50 附近的打野通用节奏 + @ 06:54）<\/li><li><strong>经济领先的滚雪球公式<\/strong>：追着对面打血线压力 → 对面没法带线吃野 → 对面经济停摆（@ 08:00）；\"像我这样稳健的打法你是很难被翻盘的\"（@ 08:15）<\/li><li><strong>打完团必须收资源<\/strong>：保持一号位经济（@ 07:48）；队友打赢了不追击，\"我们就把兵线带好\"（@ 05:44）<\/li><li><strong>张飞没大才压塔，有大开龙<\/strong>：\"张飞有大给你控到了，一个五杠零的大司命死了是非常亏的\"（@ 05:56）<\/li><li><strong>高经济可以无视塔伤越塔<\/strong>（@ 08:35）<\/li><\/ul>", "sum": "真正的节奏点只有 10 分钟龙点：10 分钟前\"边刷边发育，没机会就发育\"（BV13yfLByERE @ 06:50 附近的打野通用节奏 + @ 06:54）经济领先的滚雪球公式：追着对面打血…"}, {"id": "", "cat": "", "title": "5. 出装铭文（BV13yfLByERE）", "self": "<h3>5. 出装铭文（BV13yfLByERE）<\/h3>", "html": "<ul><li><strong>铭文<\/strong>：10 兽痕 + 10 鹰眼 + 7 无双 + 3 祸源；底层逻辑是无双提供暴伤，祸源 + 兽痕保证暴击能出来——\"暴击不出来一切都是虚的\"（@ 00:12）<\/li><li><strong>顺序<\/strong>：大红刀起手 → CD 鞋 → 影刃 → 黑切 → 吸血刀 → 名刀（@ 00:33）。变体说明：这是\"万盾飞天流\"把盾装换成黑切的<strong>单盾黑刀流<\/strong>，黑切同样提供 CD（@ 09:19）<\/li><li><strong>CD 鞋是节奏装<\/strong>：\"CD 鞋可以跟上他们的技能刷新频率\"（@ 04:15）；打完一波<strong>提前算好复活时间换抵抗鞋<\/strong>反杀（@ 04:32）<\/li><li><strong>最后一件看情况<\/strong>：铭文带无双，所以名刀、苍穹都能做来提容错（@ 10:43）<\/li><\/ul>", "sum": "铭文：10 兽痕 + 10 鹰眼 + 7 无双 + 3 祸源；"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>官方详情页不存在或抓取失败（<code>herodetail/517.shtml<\/code>），这一块留空。 新英雄上线后官方常不补关系页，只能靠实测补。<\/p><\/blockquote>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "官方详情页不存在或抓取失败（herodetail/517.shtml），这一块留空。", "opp": ""}, {"id": "K-B39", "cat": "B", "title": "对程咬金：出磐石之心＋末世，他根本打不动你", "self": "<h3><a class=\"kref\" href=\"#K-B39\">K-B39<\/a> 对程咬金：出磐石之心＋末世，他根本打不动你<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：程咬金<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：核心是两件装备：<strong>磐石之心<\/strong>（顶住他的持续伤害）＋<strong>末世<\/strong>（对他的高血量造成百分比伤害）。UP 的说法很夸张但方向明确——出了这两件，连满级程咬金都打不过一级大司命。<\/li><li><strong>反向反制<\/strong>：程咬金靠回血续命，末世就是专门克这个的。反过来说，如果你没出末世，这个对位就不成立。<\/li><li><strong>来源<\/strong>：BV1rFnq68ECR @ 00:00<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>官方没有关系页，四条方向边全缺，只能靠实测从零建<\/li><li>找「打大司命」「大司命怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：程咬金克制层级：数值克我该怎么做：核心是两件装备：磐石之心（顶住他的持续伤害）＋末世（对他的高血量造成百分比伤害）。", "opp": "程咬金"}], "lanes": ["solo"], "tempo": "mid", "job": "open", "motto": "大司命这个英雄思路一定是大于一切的，有钱这个英雄就是厉害", "beats": [], "loses": [], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 6, "b_n": 2, "vs": ["程咬金"], "beats_n": 0, "loses_n": 0, "incoming": [], "loses_all": [], "lane_names": ["对抗路"]}, {"name": "女娲", "hue": 123, "a": [{"id": "K-A71", "cat": "A", "title": "女娲前期没有线权，别抢", "self": "<h3><a class=\"kref\" href=\"#K-A71\">K-A71<\/a> 女娲前期没有线权，别抢<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：开局对线<\/li><li><strong>判断依据<\/strong>：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）<\/li><li><strong>决策分支<\/strong>：<\/li><li>抢不过 → 一技能丢四个兵就往后走，<strong>保血线<\/strong><\/li><li>抢得过 → 正常推，但别越塔<\/li><li><strong>反例<\/strong>：「中单必须抢线」——女娲前期 CD 长、伤害低，被打掉状态后连野区防守都参与不了。<\/li><li><strong>通用面<\/strong>：「线权看对面清线速度」本身是中路通用判据，见 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。这条留在英雄卡里的部分只有<strong>女娲自己的强度曲线<\/strong>（前期 CD 长、伤害低）。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 02:41<\/li><li><strong>可信度<\/strong>：高（原话直接给了判断与后果）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：开局对线判断依据：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）决策分支：抢不过 → 一技能丢四个兵就往后走，保血线抢得过 → 正常推，但别越塔反例：「中单必须抢线」——女娲前…"}, {"id": "K-A72", "cat": "A", "title": "支援靠三技能，但传送会被打断", "self": "<h3><a class=\"kref\" href=\"#K-A72\">K-A72<\/a> 支援靠三技能，但传送会被打断<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：边路打起来、需要支援<\/li><li><strong>判断依据<\/strong>：传送落点是否安全、自己是否会被打断<\/li><li><strong>决策分支<\/strong>：<\/li><li>安全 → 三技能坐过去，落地一推二控<\/li><li>有风险 → 走过去或用大招远程补伤害<\/li><li><strong>反例<\/strong>：「三技能当闪现用」——传送期间不能动，被看到就是一个活靶子。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 01:04、@ 03:58<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：边路打起来、需要支援判断依据：传送落点是否安全、自己是否会被打断决策分支：安全 → 三技能坐过去，落地一推二控有风险 → 走过去或用大招远程补伤害反例：「三技能当闪现用」——传送期间…"}, {"id": "K-A73", "cat": "A", "title": "多看小地图，绕后切射手比打正面团收益高", "self": "<h3><a class=\"kref\" href=\"#K-A73\">K-A73<\/a> 多看小地图，绕后切射手比打正面团收益高<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：中路团战僵持<\/li><li><strong>判断依据<\/strong>：小地图上有没有落单的射手/后排<\/li><li><strong>决策分支<\/strong>：三技能传送到侧面 → 一推 → 二技能控制 → 平A/大招收掉<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 05:02（\"女娲不要一直盯着正面的团战，多看小地图\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：中路团战僵持判断依据：小地图上有没有落单的射手/后排决策分支：三技能传送到侧面 → 一推 → 二技能控制 → 平A/大招收掉来源：BV18ns8zmE6j @ 05:02（\"女娲不要…"}, {"id": "K-A74", "cat": "A", "title": "二技能是\"墙 + 控制\"，不是伤害技能", "self": "<h3><a class=\"kref\" href=\"#K-A74\">K-A74<\/a> 二技能是\"墙 + 控制\"，不是伤害技能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何要打控制链的时刻<\/li><li><strong>判断依据<\/strong>：当前场上还有几个方块（可存 3 个）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有 2 个 → 合长方形夹人<\/li><li>有 4 个 → 合大正方形封路<\/li><li><strong>反例<\/strong>：「方块丢出去就行」——不会合的方块只是占位，合起来才有控制。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 00:39<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 对位情报（来自对手视角）<\/h2>\n<ul><li><strong>海月 vs 女娲<\/strong>：海月的说法是\"对线女娲八二开\"，理由是海月三个一技能秒掉第一波兵线拿到线权，然后立刻进野区做事。反过来说：<strong>女娲遇到能秒线的法师，前期基本没线权，只能后手清线<\/strong>。<\/li><li>来源：BV1K8gDzwEho @ 00:00、@ 00:03<\/li><li>可信度：中（单一来源，且是对手视角）<\/li><\/ul>\n<h2>7. 最容易崩的地方<\/h2>\n<ol><li><strong>前期硬抢线<\/strong>：被打掉状态，野区防不了，节奏全丢。<\/li><li><strong>三技能传送到人堆<\/strong>：传送中不能动，落地就是死。<\/li><li><strong>只顾正面团<\/strong>：女娲最强的用法是\"传侧面打后排\"，站正面输出等于浪费被动。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>完整六件套顺序。<\/li><li>S45 版本是否调整过被动/施法距离成长。<\/li><li>对位结论（现无 <code>B_克制关系/女娲.md<\/code>；已有海月视角一条，可补反向）。<\/li><\/ul>", "sum": "触发条件：任何要打控制链的时刻判断依据：当前场上还有几个方块（可存 3 个）决策分支：有 2 个 → 合长方形夹人有 4 个 → 合大正方形封路反例：「方块丢出去就行」——不会合的方块只是占位…"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/179.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“女娲的施法距离，可以轻松针对王昭君”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“女娲拥有十分强大远程输出能力，对于移动能力欠缺的后排来说，威胁十分巨大”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“女娲无法预知兰陵王会从哪个方向进攻，其高额的爆发也会让女娲感受到压力”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>宫本武藏<\/strong><\/td><td>打野<\/td><td>“宫本武藏可以轻松跨越矩阵空间，开始和女娲近身作战”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>杨玉环<\/strong><\/td><td>打野／中路<\/td><td>“以消耗为主的女娲，面对杨玉环时，无法发挥其长处，杨玉环可以一直保持队友的作战能力”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：梦奇、黄忠<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/179.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B04", "cat": "B", "title": "对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来", "self": "<h3><a class=\"kref\" href=\"#K-B04\">K-B04<\/a> 对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月（中路对线）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>女娲被克<\/strong>。国服海月原话：<strong>「海月对线女娲八二开」<\/strong>。<\/li><li><strong>为什么是机制克<\/strong>（三层，缺一层这条就不成立）：<\/li><\/ul>\n<ol><li><strong>线权差<\/strong>：海月三个一技能光速清掉第一波兵，女娲前期清线慢，<strong>先手权在她手上<\/strong>。<\/li><li><strong>你的控制被免疫<\/strong>：海月有免控，能直接躲掉女娲一技能的击退（<code>BV1K8gDzwEho @ 02:00<\/code>）。<\/li><li><strong>你的保命被废<\/strong>：女娲唯一的位移是三技能传送，<strong>读条中被打断就走不掉<\/strong>（见 A 卡第 2 节）；海月大招把人拉走单挑，女娲在幻境里没有位移可用。<\/li><\/ol>\n<ul><li><strong>我该怎么做<\/strong>（可执行，不是「小心点」）：<\/li><li><strong>不在正面单走<\/strong>。中期海月不站正面、专门找「意想不到的位置」单杀落单的人（<code>@ 02:10<\/code>、<code>@ 02:17<\/code>）。女娲清线、补刀都要贴着队友或塔。<\/li><li><strong>一技能别当唯一控制用<\/strong>。她免控能吃掉你的击退，指望「一推→大」这套接死海月是错的——推不到，大招就是空。<\/li><li><strong>记她大招<\/strong>。她大招拉到谁都是赚（<code>@ 02:41<\/code>「只要能打出持续掉点，拉谁都是一样的」）。她大交了，才是女娲进场的窗口。<\/li><li>自己的大招是<strong>全图<\/strong>的：她要单杀你就得脱离阵型，这时候用大招支援被拉走/被追的队友，比跟她对拼划算。<\/li><li><strong>反向反制（她的破绽）<\/strong>：海月单杀依赖大招，<strong>大招 CD 期间她只是一个有线权的法师<\/strong>，没有硬控逃生；女娲可以趁这段用二技能墙封她退路，配合打野抓。<\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:00；BV1K8gDzwEho @ 02:00；BV1K8gDzwEho @ 02:10；BV1K8gDzwEho @ 02:41<\/li><li><strong>可信度<\/strong>：中高（对手视角的原话 + 实战演示，两段互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月（中路对线）克制层级：机制克（反向）——这条是女娲被克。", "opp": "海月"}, {"id": "K-B05", "cat": "B", "title": "对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判", "self": "<h3><a class=\"kref\" href=\"#K-B05\">K-B05<\/a> 对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嬴政（远程高伤 poke）<\/li><li><strong>克制层级<\/strong>：<strong>数值克<\/strong>——同一套换血流程，顺序错就被他先手打残<\/li><li><strong>我该怎么做<\/strong>：一次完整的对拼是<strong>四步<\/strong>，顺序不能换：<\/li><\/ul>\n<ol><li><strong>二技能先往后挪<\/strong>，把身位拉出他的伤害范围（<code>@ 20:31<\/code>）；<\/li><li>他跟进/回头时，<strong>二技能夹住他一下<\/strong>（<code>@ 20:32<\/code>）；<\/li><li><strong>一技能预瞄他的落点<\/strong>，不要瞄他当前站位（<code>@ 20:35<\/code>）；<\/li><li>前面三步都成立，<strong>1+3 才打得满<\/strong>（<code>@ 20:37<\/code>）。<\/li><\/ol>\n<ul><li><strong>反例<\/strong>：一起手就丢一技能——他手比你长，你的前摇在换血里就是白给，一技能空了后面全是挨打。<\/li><li><strong>反向反制<\/strong>：嬴政没有位移，被二技能夹住之后<strong>逃不掉<\/strong>；他的破绽在<strong>清线时身位固定<\/strong>，那时候夹最准。<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 20:31；BV1WkKzzUEtq @ 20:32；BV1WkKzzUEtq @ 20:35；BV1WkKzzUEtq @ 20:37<\/li><li><strong>可信度<\/strong>：中（单来源实战解说，且该段字幕为 ASR 转写，「嬴政拉回来」一句语义有歧义，只取其余四步）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<p>&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;<\/p>\n<h2>官方口径（L0 · 未经实测）<\/h2>\n<blockquote><p>来源：官方英雄详情页 <code>herodetail/179.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“女娲的施法距离，可以轻松针对王昭君”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“女娲拥有十分强大远程输出能力，对于移动能力欠缺的后排来说，威胁十分巨大”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“女娲无法预知兰陵王会从哪个方向进攻，其高额的爆发也会让女娲感受到压力”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>宫本武藏<\/strong><\/td><td>打野<\/td><td>“宫本武藏可以轻松跨越矩阵空间，开始和女娲近身作战”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>杨玉环<\/strong><\/td><td>打野／中路<\/td><td>“以消耗为主的女娲，面对杨玉环时，无法发挥其长处，杨玉环可以一直保持队友的作战能力”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：梦奇、黄忠<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>\n<h2>待补<\/h2>\n<ul><li>女娲怕谁：突进型刺客（兰陵王、镜）的实际应对——无素材<\/li><li>女娲对炮台法师（干将、嬴政之外的）线权判断——仅嬴政一段，样本不足<\/li><\/ul>", "sum": "&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;", "opp": "嬴政"}], "lanes": ["mid"], "tempo": "late", "job": "hold", "motto": "用石头和传送把战场切开，不追人", "beats": ["王昭君", "鲁班七号"], "loses": ["兰陵王", "宫本武藏", "杨玉环"], "main_lane": "mid", "type": "法师", "unlisted": false, "n": 6, "b_n": 3, "vs": ["嬴政", "海月"], "beats_n": 2, "loses_n": 3, "incoming": ["兰陵王", "宫本武藏", "杨玉环"], "loses_all": ["兰陵王", "宫本武藏", "杨玉环"], "lane_names": ["中路"]}, {"name": "扁鹊", "hue": 265, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>叠毒 + 大招斩杀<\/strong>：叠毒后大招斩杀，五层以上就有斩杀机会（BV16suu6JE4x @ 06:08~06:10）；四级后\"叠毒大招斩杀就可以转线了\"（BV16suu6JE4x @ 03:43~03:46）<\/li><li><strong>技能都是范围 AOE<\/strong>：\"扁鹊的技能都是范围AOE伤害\"，所以抢线和打状态都能顺手做（BV16suu6JE4x @ 04:10~04:12）<\/li><li><strong>非常吃 CD<\/strong>：出装要先出叠 CD 的小件，做痛苦面具之前一定要先补叠 CD（BV16suu6JE4x @ 00:46~00:51）<\/li><li><strong>大招不能一直捏着<\/strong>：有的情况要当成打状态和叠毒来用（BV16suu6JE4x @ 03:33~03:37）；对面突脸多时不要想着大招斩杀，留给队友补状态当工具人（BV16suu6JE4x @ 06:21~06:26）<\/li><li><strong>反向二闪<\/strong>：正常二闪容易打不中、或者人闪出去技能没放，反向二闪 90% 可以命中，失误几率很小（BV16suu6JE4x @ 01:17~01:31）<\/li><li><strong>大闪<\/strong>：扁鹊可以大闪，技能特效不会显示、只停留在原地，但伤害已经打出来了（BV16suu6JE4x @ 01:32~01:42）<\/li><li><strong>开局白嫖移速<\/strong>：开局买鞋，出高地卖掉换成小法点（BV16suu6JE4x @ 01:48~01:51）<\/li><\/ol>", "sum": "叠毒 + 大招斩杀：叠毒后大招斩杀，五层以上就有斩杀机会（BV16suu6JE4x @ 06:08~06:10）；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>发育优先<\/strong><\/td><td>主要保证自身发育，其次才是帮队友控资源；\"想玩好扁鹊就一定要自私一点\"<\/td><td>BV16suu6JE4x @ 01:51~02:04<\/td><\/tr><tr><td><strong>开局站视野<\/strong><\/td><td>打野红开，帮忙占住蓝区视野<\/td><td>BV16suu6JE4x @ 02:04~02:06<\/td><\/tr><tr><td><strong>兵线交汇<\/strong><\/td><td>对面是强线权英雄就打他状态；清线能力不强就尝试抢线，抢线时能消耗就消耗<\/td><td>BV16suu6JE4x @ 02:06~02:15<\/td><\/tr><tr><td><strong>快速清线<\/strong><\/td><td>先用二技能把兵线推到一起，再用一技能清完<\/td><td>BV16suu6JE4x @ 02:53~02:57<\/td><\/tr><tr><td><strong>清完线转线<\/strong><\/td><td>清完线转发育路控资源<\/td><td>BV16suu6JE4x @ 02:16~02:18<\/td><\/tr><tr><td><strong>射辅压线时<\/strong><\/td><td>我方射辅压着对面打，就不用出去帮抢红隼，藏好视野卡杨玉环位置、打她状态<\/td><td>BV16suu6JE4x @ 02:23~02:30<\/td><\/tr><tr><td><strong>不救必败的边路<\/strong><\/td><td>我方对抗路四级前太弱、打野又是红开，这波肯定打不了，没必要下去，等下波兵线<\/td><td>BV16suu6JE4x @ 02:45~02:52<\/td><\/tr><tr><td><strong>不越塔<\/strong><\/td><td>4 分钟前不好越塔，\"扁鹊太弱了\"<\/td><td>BV16suu6JE4x @ 04:21~04:24<\/td><\/tr><tr><td><strong>半靠中左<\/strong><\/td><td>没资源就打半靠、站住中左视野，防止对面中单转线支援；有人从中左路过就打一套状态<\/td><td>BV16suu6JE4x @ 03:12~03:20、03:58~04:04<\/td><\/tr><tr><td><strong>蹭野区<\/strong><\/td><td>边路没资源、打不起来时，去蹭一下野区经济<\/td><td>BV16suu6JE4x @ 04:24~04:26<\/td><\/tr><tr><td><strong>提前蹲人<\/strong><\/td><td>上路兵线进塔、对面三人都在中路，判断虞姬大概率来清线，提前上去蹲<\/td><td>BV16suu6JE4x @ 05:31~05:36<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景做法依据发育优先主要保证自身发育，其次才是帮队友控资源；"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>蹲人 / 先手<\/strong><\/td><td>121 起手，一技能先到，直接大闪斩杀（怕对方交闪跑）<\/td><td>BV16suu6JE4x @ 05:36~05:41<\/td><\/tr><tr><td><strong>支援控人<\/strong><\/td><td>反向二闪控一下 → 一技能叠毒 → 技能范围内直接开大压状态<\/td><td>BV16suu6JE4x @ 03:04~03:08<\/td><\/tr><tr><td><strong>快速清线<\/strong><\/td><td>二技能把兵线推到一起 → 一技能清完<\/td><td>BV16suu6JE4x @ 02:53~02:57<\/td><\/tr><tr><td><strong>推进 / 开团<\/strong><\/td><td>叠毒到五层以上、有斩杀机会 → 大闪开团<\/td><td>BV16suu6JE4x @ 06:08~06:10<\/td><\/tr><tr><td><strong>反打<\/strong><\/td><td>等对方大招结束 → 二技能控一下 → 斩杀线到了收<\/td><td>BV16suu6JE4x @ 05:19~05:21<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景连招依据蹲人 / 先手121 起手，一技能先到，直接大闪斩杀（怕对方交闪跑）BV16suu6JE4x @ 05:36~05:41支援控人反向二闪控一下 → 一技能叠毒 → 技能范围内直接开…"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>4 分钟后的方向<\/strong>：优先帮发育路解放；自己有优势了就可以放线去帮忙（BV16suu6JE4x @ 05:26~05:30）<\/li><li><strong>推进节奏<\/strong>：解放发育路后开始打推进，队友推塔时用一二技能压位置、恶心对面（BV16suu6JE4x @ 05:43~05:50）；出疾跑鞋就是为了中期跟得上队友（BV16suu6JE4x @ 05:50~05:53）<\/li><li><strong>推塔站位<\/strong>：躲在队友后面丢技能卡位置，同时打状态、叠毒（BV16suu6JE4x @ 06:03~06:08）<\/li><li><strong>抢资源<\/strong>：有大招时\"扁鹊抢资源可是一把好手\"，叠毒大招斩杀直接拿下（BV16suu6JE4x @ 04:04~04:08）<\/li><li><strong>蓝条<\/strong>：建议多叫几声哥哥，让打野让出 Buff（BV16suu6JE4x @ 05:55~05:58）<\/li><li><strong>团战<\/strong>：多注意站位、多拉扯、慢慢叠毒；对面突脸多就把大招留给队友补状态（BV16suu6JE4x @ 06:17~06:26）<\/li><li><strong>开大清线的代价<\/strong>：队友那边打起来就没有留人手段；但前期很少打架、以控资源发育为主，所以问题不大（BV16suu6JE4x @ 03:46~03:54）<\/li><\/ul>", "sum": "4 分钟后的方向：优先帮发育路解放；"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p><strong>铭文<\/strong>：十狩猎、十献祭、十梦魇（BV16suu6JE4x @ 00:16~00:17）<\/p>\n<p><strong>出装顺序<\/strong>（BV16suu6JE4x @ 00:23~00:43）：<\/p>\n<ol><li>开局小法点<\/li><li>法穿鞋<\/li><li>圣者法典叠 CD<\/li><li>转线过程中换疾跑鞋（还在线上清线就没必要换，挂着即可）<\/li><li>梦魇<\/li><\/ol>\n<ul><li><strong>第二件分支<\/strong>：对面坦克多，先做痛苦面具，但之前一定要出叠 CD 的小件；坦克不多就先日暮，出完日暮再出冰杖（BV16suu6JE4x @ 00:43~00:55）<\/li><li><strong>换鞋节点<\/strong>：到这个节点可以换鞋——对面控制多换抵抗鞋，没控制、物理伤害高换护甲鞋（BV16suu6JE4x @ 00:55~01:00）<\/li><li><strong>第四件<\/strong>：站位不行就出时之预言增加容错；想多用点技能就做无相神器（转写原文）（BV16suu6JE4x @ 01:01~01:08）<\/li><li><strong>最后一件<\/strong>：帽子补输出（BV16suu6JE4x @ 01:08~01:10）<\/li><li>两套完整出装被放在评论区，正文没有逐件列全（BV16suu6JE4x @ 01:10~01:13）<\/li><\/ul>", "sum": "铭文：十狩猎、十献祭、十梦魇（BV16suu6JE4x @ 00:16~00:17）"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/119.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>东皇太一<\/strong><\/td><td>对抗路／游走<\/td><td>“东皇太一：东皇太一初期具有较强的入侵野区能力，扁鹊和其他中单不同，扁鹊主要靠普攻叠被动来…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>妲己<\/strong><\/td><td>中路<\/td><td>“妲己：妲己初期清理兵线能力比较弱，扁鹊强的AOE清理兵线能力会更强一些，可以使经济和等级…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“兰陵王的隐身和秒杀能力很容易接近扁鹊将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>花木兰<\/strong><\/td><td>对抗路<\/td><td>“花木兰的超高爆发输出能力能快速击杀走位不慎的扁鹊”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>诸葛亮<\/strong><\/td><td>打野／中路<\/td><td>“扁鹊：扁鹊和诸葛同样作为法师，但在对战时候却没有诸葛亮强势。扁鹊没有位移技能，且需要叠加…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：蔡文姬、项羽<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/119.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B25", "cat": "B", "title": "对小乔：出装慢就是没优势，别指望对拼", "self": "<h3><a class=\"kref\" href=\"#K-B25\">K-B25<\/a> 对小乔：出装慢就是没优势，别指望对拼<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：小乔<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：扁鹊的问题不是英雄弱，是<strong>出装慢<\/strong>。在对上高爆发的小乔时，前中期你没有对拼资本。这局的正确打法是先做能保命的装备、把线收在塔前，等毒层叠满再考虑换血。<\/li><li><strong>反向反制<\/strong>：小乔的爆发有前摇，你只要不被一套打满就能反手叠毒。所以站位永远留一段后退距离。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 01:38<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>扁鹊 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打扁鹊」「扁鹊怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：小乔克制层级：数值克我该怎么做：扁鹊的问题不是英雄弱，是出装慢。", "opp": "小乔"}], "lanes": ["mid"], "tempo": "mid", "job": "follow", "motto": "扁鹊是一个典型的中后期英雄", "beats": ["东皇太一", "妲己"], "loses": ["兰陵王", "花木兰", "诸葛亮"], "main_lane": "mid", "type": "法师", "unlisted": false, "n": 6, "b_n": 2, "vs": ["小乔"], "beats_n": 2, "loses_n": 3, "incoming": ["兰陵王", "花木兰", "诸葛亮"], "loses_all": ["兰陵王", "花木兰", "诸葛亮"], "lane_names": ["中路"]}, {"name": "敖隐", "hue": 12, "a": [{"id": "", "cat": "", "title": "1. 机制内核：技能型射手，站撸必死", "self": "<h3>1. 被动<\/strong>。对面一套打死你时它救你，对面慢慢磨你时它一层层被抠掉<\/li><li>所以王维<strong>怕的是持续消耗型（干将、小乔这类先手磨血再收割），不怕一套爆发型<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.2 一技能「空山入障」：站在自己的圈里，被动回得飞快<\/h3>\n<ul><li>持续伤害 + 20%~40% 减速，1.5 秒后引爆<\/li><li><strong>王维自己在范围内 → 进入\"空山状态\" → 快速回复被动层数<\/strong><\/li><li>这是王维的全部续航来源。<strong>掉出圈 = 失去闪避 = 变成普通脆皮法师<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.3 二技能「江流渺渺」：击退 + 分叉，穿过空山会引爆<\/h3>\n<ul><li>主水流击退 0.75 秒，命中后分出最多 2 道支流追人（50% 伤害 + 减速）<\/li><li><strong>水流经过空山会绕山而行，把敌人卷进山里，并提前引爆空山<\/strong><\/li><li>这是连招的真正核心：<strong>二技能不是起手，是\"把对面按进我的圈里\"<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.4 大招「天地一念」：本体留在原地，雾气穿墙走<\/h3>\n<ul><li>第一段：本体不动，雾气化身飞行 9 秒，<strong>无视地形、不可选中<\/strong>，飞行中可放一二技能（替换成「乘雾」加速 /「回岚」转向）<\/li><li>第二段：瞬移到雾的位置，落地范围伤害 + 3 秒锁定多段伤害，期间<strong>持续空山状态<\/strong><\/li><li>这是位移 + 保命 + 进场三合一，<strong>也是王维唯一能主动开团的手段<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>", "sum": "1.1 被动「雾我无相」：每 5~4 秒叠 1 层，5 层闪避一次伤害闪避按伤害量扣层，最多闪避 250 + 50% 法强 的伤害关键推论：这是一个\"防爆发\"被动，不是\"防消耗\"被动。"}, {"id": "", "cat": "", "title": "2. 对线：一级就是打不过，别硬抢", "self": "<h3>2. 对线：一级就是打不过，别硬抢<\/h3>", "html": "<ul><li>对<strong>嫦娥<\/strong>这类一级强线权中单：<strong>一技能只打后排兵，不打人<\/strong>（BV15EJk6fEwX @ 00:27）<\/li><li>目的不是消耗，是<strong>别被卡线<\/strong>。被卡线 → 掉状态 → 丢闪现甚至丢整片野区（@ 00:28）<\/li><li>对面去支援时<strong>不跟<\/strong>，往<strong>反方向<\/strong>去下路拿资源（@ 00:39 / @ 00:40）<\/li><li>判断流程完整版见 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L07\">K-L07<\/a><\/code><\/li><\/ul>", "sum": "对嫦娥这类一级强线权中单：一技能只打后排兵，不打人（BV15EJk6fEwX @ 00:27）目的不是消耗，是别被卡线。"}, {"id": "", "cat": "", "title": "3. 连招：先把圈铺好，再谈伤害", "self": "<h3>3. 连招：先把圈铺好，再谈伤害<\/h3>", "html": "<p><strong>基础三连（对线换血）<\/strong><\/p>\n<pre><code>一技能落在自己脚下偏前 → 走进去回被动 → 二技能把对面卷进圈 → 引爆 → 出圈<\/code><\/pre>\n<p><strong>反打（被突进时）<\/strong><\/p>\n<pre><code>一技能落脚下 → 等对面进来 → 二技能击退（把人推出圈/推进圈） → 大招第一段拉开<\/code><\/pre>\n<p><strong>核心纪律<\/strong>：<strong>不要在没圈的地方和人对拼。<\/strong> 王维的伤害和续航都在圈里，圈外他就是一个没有位移的脆皮。素材里那句\"空山\"状态是他唯一能站住的原因，本库据此把它定为<strong>\"空山 = 血包\"<\/strong>，而不是输出手段。<\/p>", "sum": "基础三连（对线换血）"}, {"id": "", "cat": "", "title": "4. 出装 / 铭文（按 S45 胜率与出场率取的主流方案，非教学结论）", "self": "<h3>4. 出装 / 铭文（按 S45 胜率与出场率取的主流方案，非教学结论）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>类别<\/th><th>推荐<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>鞋<\/td><td><strong>秘法之靴<\/strong><\/td><td>法穿 + 回蓝，可 5 分钟免费换鞋<\/td><\/tr><tr><td>大件 1<\/td><td><strong>回响之杖<\/strong><\/td><td>技能命中触发范围爆炸，配合王维多段伤害<\/td><\/tr><tr><td>大件 2<\/td><td><strong>博学者之怒<\/strong><\/td><td>法强乘数，被动闪避上限也随之抬高（闪避量吃 50% 法强）<\/td><\/tr><tr><td>铭文<\/td><td><strong>梦魇 ×10 / 狩猎 ×10 / 心眼 ×10<\/strong><\/td><td>法强 + 移速 + 法穿，胜率与出场率都是第一<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>数据来源：S45 王维英雄数据页（胜率 50.67%，出场率 3.6%，禁用率 4.12%）。<strong>这是统计口径，不是\"版本答案\"<\/strong>，版本一动就要重估。<\/p><\/blockquote>", "sum": "数据来源：S45 王维英雄数据页（胜率 50.67%，出场率 3.6%，禁用率 4.12%）。"}, {"id": "", "cat": "", "title": "5. 弱点：三条，都是\"掉出圈\"的变体", "self": "<h3>5. 弱点：三条，都是\"掉出圈\"的变体<\/h3>", "html": "<ol><li><strong>失去空山 = 失去一切<\/strong>：被击退、被强制位移推出圈，被动回不上，直接变成普通法师<\/li><li><strong>弱前期被卡线后滚雪球<\/strong>：一级清不动线，一旦被压到塔下，河蟹/河灵/自家红区全让出去<\/li><li><strong>大招是保命牌，交掉后极脆<\/strong>：9 秒飞行结束回来后如果没圈，等于站在对面脸上<\/li><\/ol>", "sum": "失去空山 = 失去一切：被击退、被强制位移推出圈，被动回不上，直接变成普通法师弱前期被卡线后滚雪球：一级清不动线，一旦被压到塔下，河蟹/河灵/自家红区全让出去大招是保命牌，交掉后极脆：9 秒飞…"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>官方详情页不存在或抓取失败（<code>herodetail/138.shtml<\/code>），这一块留空。 新英雄上线后官方常不补关系页，只能靠实测补。<\/p><\/blockquote>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "官方详情页不存在或抓取失败（herodetail/138.shtml），这一块留空。", "opp": ""}, {"id": "K-B03", "cat": "B", "title": "对嫦娥：一级打不过，别抢线", "self": "<h3><a class=\"kref\" href=\"#K-B03\">K-B03<\/a> 对嫦娥：一级打不过，别抢线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嫦娥（中路）<\/li><li><strong>克制层级<\/strong>：<strong>节奏克<\/strong>（王维一级弱势，嫦娥一级能压）<\/li><li><strong>我该 ><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：阿轲<\/li><li><strong>克制层级<\/strong>：机制克<\/li><li><strong>我该怎么做<\/strong>：阿轲靠绕后秒人，但她的位移是单向的——进来容易出去难。貂蝉的大招圈住之后持续位移+真实伤害，阿轲贴上来反而被反杀。所以别跑，站着开大，让她自己撞进来。<\/li><li><strong>反向反制<\/strong>：阿轲会等你大招CD再进场。所以团战里大招不能随便交，留着等她。<\/li><li><strong>来源<\/strong>：BV1k4411F7tM @ 02:34<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>貂蝉 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打貂蝉」「貂蝉怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：阿轲克制层级：机制克我该怎么做：阿轲靠绕后秒人，但她的位移是单向的——进来容易出去难。", "opp": "阿轲"}], "lanes": ["solo"], "tempo": "mid", "job": "open", "motto": "这就是你貂蝉菜的原因，频率低", "beats": ["典韦", "刘禅", "哪吒", "夏侯惇", "庄周", "廉颇", "张飞", "杨戬", "海诺", "澜", "牛魔", "甄姬", "虞姬", "裴擒虎", "达摩", "钟无艳", "露娜", "项羽"], "loses": ["妲己", "张良", "甄姬", "花木兰", "蔡文姬", "赵怀真", "高渐离"], "main_lane": "solo", "type": "法师", "unlisted": false, "n": 6, "b_n": 2, "vs": ["阿轲"], "beats_n": 18, "loses_n": 7, "incoming": ["妲己", "张良", "甄姬", "花木兰", "蔡文姬", "赵怀真", "高渐离"], "loses_all": ["妲己", "张良", "甄姬", "花木兰", "蔡文姬", "赵怀真", "高渐离"], "lane_names": ["对抗路"]}, {"name": "钟馗", "hue": 82, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>全部战术价值压在一个钩子上<\/strong>：素材把钟馗的行为概括成「他会拿钩子勾」（@ 09:04），勾空之后在解说者眼里就是零作用——「因为他本来就没用啊」（@ 21:13~21:16），「他一直空钩，他跟超级兵有啥区别」（@ 20:09）。<\/li><li><strong>钩空会给对面报点<\/strong>：这是本片说得最具体的一条机制——「他勾空以后，他头上会被司马懿看到，然后会亮」（@ 12:51~12:55）。空钩不只是没命中，还把自身位置交出去了。<\/li><li><strong>丢技能就会持续暴露视野<\/strong>：钟馗「会一直暴露视野」（@ 09:01）；解说者全程用「看头上亮不亮就可以猜司马懿位置」的办法反推司马懿（@ 07:02~07:13、@ 08:00~08:15），而钟馗正是被读的那一方。<\/li><li><strong>身板厚，但厚身板换不出队友的活路<\/strong>：口播称他「1万血」（@ 08:55），可队友视角是「我跟他走肯定死」（@ 08:53~08:57）；勾不住人时只能拿承伤交差——「勾不住人，说自己承伤了」（@ 20:16~20:21）。「1万血」是口播概数，未经核实（见 <code>待补<\/code>）。<\/li><li><strong>二技能拉中一次，团战直接结束<\/strong>：素材里那个「1万8战力」钟馗「二技能拉庄周」之后「空放几个一技能，团战就赢了」（@ 12:14~12:18）。全片他能被记成正面表现的动作只有这一次，其余全是空钩——这也是为什么空钩等于白给。<\/li><\/ol>", "sum": "全部战术价值压在一个钩子上：素材把钟馗的行为概括成「他会拿钩子勾」（@ 09:04），勾空之后在解说者眼里就是零作用——「因为他本来就没用啊」（@ 21:13~21:16），「他一直空钩，他跟…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>钩空 = 这一波没有他这个人<\/strong>：解说者的判词很干脆，「那一直空钩跟摆有啥区别吗」（@ 18:04），并反复拿「摆」作对照（@ 19:47~19:51）。<\/li><li><strong>钩子只钩得到野怪<\/strong>：「是不是抢蓝第一名，也只能勾个蓝了」「勾个真人跟要了你命一样」（@ 18:29、18:34）——全片他干成的事是抢蓝，钩人一次都没成。<\/li><li><strong>蹲人前先想清楚丢技能会不会亮<\/strong>：素材给的是反面教材，钟馗「会一直暴露视野」（@ 09:01），而解说者这边的原则是「司马懿在这别放技能，放技能会漏视野」（@ 07:01~07:02）。钟馗的问题正是技能一直丢、视野一直漏。<\/li><li><strong>别把队友拉进自己的暴露位<\/strong>：「动不动压力人，自己丢个技能，然后被司马懿看到，然后让我跟他蹲」（@ 12:46~12:55）——两个人在同一个被读到的位置蹲，等于把双人份的位置一起送出去。<\/li><li><strong>对线期本身零覆盖<\/strong>：素材没有讲钟馗线上怎么换血、怎么卡兵线、跟哪个辅助对位，这些全部进 <code>待补<\/code>，不拿常识补。<\/li><li><strong>勾不到人时拿承伤顶账不成立<\/strong>：「你看来承伤了」「勾不住人，说自己承伤了」（@ 20:16~20:21）——承伤不是钩子的替代品。<\/li><\/ul>", "sum": "钩空 = 这一波没有他这个人：解说者的判词很干脆，「那一直空钩跟摆有啥区别吗」（@ 18:04），并反复拿「摆」作对照（@ 19:47~19:51）。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖连招细节：全片没有一处讲钟馗钩中之后怎么接，能看到的只有同一类碎片动作。<\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>团战钩中庄周<\/td><td>二技能拉中 → 空放一技能 / 空放大招 → 团战赢；钩中本身就把事办完了，后续衔接素材里没有任何成功案例<\/td><td>BV1FFHz6AEbY @ 11:45~11:51、@ 12:03~12:06、@ 12:14~12:18<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>素材里他的大招两次都没打出东西：「打团就放了个一技能，然后再空放个大招」（@ 12:03~12:06）、「好像大招还空了」（@ 12:24~12:27）。<\/li><li>也就是说，本卡能确认的只有二技能起手这一环，钩中之后的技能顺序一律进 <code>待补<\/code>。<\/li><\/ul>", "sum": "素材未覆盖连招细节：全片没有一处讲钟馗钩中之后怎么接，能看到的只有同一类碎片动作。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>钩中 C 位一次就够赢团<\/strong>：那个「1万8战力」钟馗靠「二技能拉庄周」加几个空放的一技能，团战就翻了（@ 12:14~12:18）；同一波解说者给的是「太帅了」（@ 12:02）。<\/li><li><strong>钩不中时只剩威慑<\/strong>：「可不勾不中人，不只能威慑了吗」（@ 17:32~17:33）——空钩的钟馗在场上的作用被压到站着让人不敢上这一层。<\/li><li><strong>他的实际站位是躲后排<\/strong>：「还是躲在后面混最自在」（@ 12:20）；队友的描述更直白：「上波打团搁那后面挂机」（@ 20:12）。<\/li><li><strong>团战零参与也能赢，说明他不在胜负链条上<\/strong>：「我们家钟馗好像上波团战什么都没做呀，怎么又赢了」（@ 15:51）——钟馗没做事而团战照样赢，是空钩既无害也无用的另一面。<\/li><li><strong>别把「有没有你都能赢」当成他的功劳<\/strong>：「玩的菜就别说演，有没有你都能赢」（@ 23:31）。<\/li><\/ul>", "sum": "钩中 C 位一次就够赢团：那个「1万8战力」钟馗靠「二技能拉庄周」加几个空放的一技能，团战就翻了（@ 12:14~12:18）；"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>素材完全没给钟馗的出装与铭文<\/strong>，一件都没有。<\/li><li>片中出现的「出回响的话」「回想下一件就是帽子啊」「家人们就不要做贤者天书了」（@ 03:56~04:02，「回想」为「回响」的错字），以及「出回响加帽子，第三件就一定要做吸血书」（@ 07:38~07:41），都是解说者自己英雄的法师三件套，<strong>不能算给钟馗<\/strong>。<\/li><li>@ 03:08 有一句「出的护甲鞋」，但主语不明（前后文是解说者自己让刘备杀狄仁杰的解说），<strong>未采信<\/strong>。<\/li><li>完整出装未覆盖，见 <code>待补<\/code>。<\/li><\/ul>", "sum": "素材完全没给钟馗的出装与铭文，一件都没有。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/175.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>周瑜<\/strong><\/td><td>中路<\/td><td>“周瑜：以周瑜为首的缺乏位移的中单英雄基础移速慢，机动性差。钟馗只要钩子命中就可以配合防御…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>露娜<\/strong><\/td><td>打野<\/td><td>“钟馗可以将露娜团战前拉回来将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>黄忠<\/strong><\/td><td>发育路<\/td><td>“黄忠：以黄忠为代表的缺乏位移的射手，例如成吉思汗，虞姬，狄仁杰等英雄，机动性差。面对钟馗…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>花木兰<\/strong><\/td><td>对抗路<\/td><td>“花木兰的超高爆发输出能力能快速击杀走位不慎的钟馗”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>钟无艳<\/strong><\/td><td>对抗路／打野<\/td><td>“钟馗：团战时，钟馗勾人技能十分厉害，但是对上钟无艳，把钟无艳勾过去，钟无艳一个大招基本可…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>韩信<\/strong><\/td><td>打野<\/td><td>“刺客（韩信、兰陵王）的爆发输出很容易击杀落单的钟馗”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：刘备、王昭君<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/175.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B08", "cat": "B", "title": "对墨子：掐\"开炮前摇\"这一下——但这条有分段门槛", "self": "<h3><a class=\"kref\" href=\"#K-B08\">K-B08<\/a> 对墨子：掐\"开炮前摇\"这一下——但这条有分段门槛<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：墨子（二技能开炮有前摇）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong>（前摇是技能结构，不是数值）<\/li><li><strong>我该怎么做<\/strong>：<strong>不是看到墨子就勾<\/strong>，而是等他的二技能起手、还打不出来的那一下勾。他这时不能位移、不能取消，是你的确定性命中。<\/li><li><strong>反向反制<\/strong>：墨子可以<strong>只清线不开炮<\/strong>、站得比你勾的距离远一点；也可以让前排先吃勾。<\/li><li><strong>门槛（重点）<\/strong>：这条克制<strong>要求你反应得过来<\/strong>。前摇只有零点几秒，反应不过来就不存在克制关系 —— 见 <code>C_BP/01_选人五查.md<\/code> 的 <a class=\"kref\" href=\"#K-C05\">K-C05<\/a>。<strong>这是本库唯一一条明确标了\"分段门槛\"的克制。<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中（UP 自己加了\"反应不过来就不存在\"的限定，说明他自己也不认为这是普适结论）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<p>&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;<\/p>\n<h2>官方口径（L0 · 未经实测）<\/h2>\n<blockquote><p>来源：官方英雄详情页 <code>herodetail/175.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>周瑜<\/strong><\/td><td>中路<\/td><td>“周瑜：以周瑜为首的缺乏位移的中单英雄基础移速慢，机动性差。钟馗只要钩子命中就可以配合防御…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>露娜<\/strong><\/td><td>打野<\/td><td>“钟馗可以将露娜团战前拉回来将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>黄忠<\/str strong>近战平 A 刷野更快<\/strong>：一技能要先放脚下，防止召唤出来的小野卡住位置；古朵近战平 A 刷野更快（BV1q7Kj64Ec4 @ 02:56、BV1q7Kj64Ec4 @ 02:58）<\/li><li><strong>大招可过墙收人<\/strong>：野区没秒掉的庄周，\"后续大招过墙还是把他打掉了\"（BV1q7Kj64Ec4 @ 03:27）<\/li><li><strong>手长的作用是抽状态<\/strong>：原话\"手长的优势一直都不是打致死伤害\"，而是把对面状态抽掉、拿到后续压塔或线权（BV1q7Kj64Ec4 @ 04:23、BV1q7Kj64Ec4 @ 04:26）<\/li><li><strong>能硬打推进<\/strong>：\"古朵因为机制特殊，是可以硬打推进的\"（BV1q7Kj64Ec4 @ 05:08），是公认的\"推塔利器\"（BV1q7Kj64Ec4 @ 04:43）<\/li><\/ol>", "sum": "定位特殊：\"阿古朵绝对是打野里面打法最特殊之人\"（BV1q7Kj64Ec4 @ 00:00），不按常规打野的刷野—抓人循环走红开极快：红开野区速率很快，\"90%的对局我都选择红开\"，剩下 10…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<p>阿古朵是打野位，本节写刷野路线、抓边与压塔。<\/p>\n<div class=\"tw\"><table><thead><tr><th>阶段<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>红开第一轮<\/td><td>放生红 Buff，先刷蜥蜴——防双猪刷太快，做节奏时被偷<\/td><td>BV1q7Kj64Ec4 @ 01:19、BV1q7Kj64Ec4 @ 01:23<\/td><\/tr><tr><td>防反野<\/td><td>对面中辅清完第一波线可能来反双猪，那就先刷双猪，二技能留着<\/td><td>BV1q7Kj64Ec4 @ 01:27、BV1q7Kj64Ec4 @ 01:33<\/td><\/tr><tr><td>蓝区布点<\/td><td>一技能放双狼和蓝草中间，刷到双狼时也覆盖刷蓝范围<\/td><td>BV1q7Kj64Ec4 @ 01:38、BV1q7Kj64Ec4 @ 01:40<\/td><\/tr><tr><td>抢线身位<\/td><td>感觉有危险就用远程平 A 慢慢点，身位更靠后；安全则用近战平 A 吃 AOE<\/td><td>BV1q7Kj64Ec4 @ 03:05、BV1q7Kj64Ec4 @ 03:08<\/td><\/tr><tr><td>抓边时机<\/td><td>等对面\"过了半个河道再去抓\"，成功率更高<\/td><td>BV1q7Kj64Ec4 @ 02:39<\/td><\/tr><tr><td>反制强中轴<\/td><td>对面是少司缘、火舞这类抢河道极强的中轴时，一技能探草，可以不让队友排草<\/td><td>BV1q7Kj64Ec4 @ 02:18、BV1q7Kj64Ec4 @ 02:25<\/td><\/tr><tr><td>压塔<\/td><td>带射手过来，一技能放塔里抗塔<\/td><td>BV1q7Kj64Ec4 @ 05:21、BV1q7Kj64Ec4 @ 04:48<\/td><\/tr><tr><td>守塔反打<\/td><td>电刀已出就\"完全没必要龟缩塔下\"，二技能滚脸主动出击，边打边往后拉<\/td><td>BV1q7Kj64Ec4 @ 04:11、BV1q7Kj64Ec4 @ 04:14<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "阿古朵是打野位，本节写刷野路线、抓边与压塔。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>切入 / 反打<\/td><td>二技能滚脸 → 边打边往后拉，提防支援<\/td><td>BV1q7Kj64Ec4 @ 04:14<\/td><\/tr><tr><td>撤退<\/td><td>二技能滚走（观察对面动向，靠过
