<th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>妲己<\/strong><\/td><td>中路<\/td><td>“阿古朵能抗能打的特性让法师很难占得便宜”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>诸葛亮<\/strong><\/td><td>打野／中路<\/td><td>“身板脆弱的英雄很难抗住阿古朵动物军团的追击”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>苏烈<\/strong><\/td><td>对抗路／游走<\/td><td>“苏烈的AOE能力可以快速清掉阿古朵的召唤物”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>韩信<\/strong><\/td><td>打野<\/td><td>“韩信的骚扰能力则可以限制阿古朵在野区的发育”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：扁鹊、刘禅<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/533.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B28", "cat": "B", "title": "对海月／大司命：机制上就克，这是选她的理由", "self": "<h3><a class=\"kref\" href=\"#K-B28\">K-B28<\/a> 对海月／大司命：机制上就克，这是选她的理由<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月／大司命<\/li><li><strong>克制层级<\/strong>：机制克<\/li><li><strong>我该怎么做<\/strong>：UP 说得很直接：出阿古朵的情况之一就是“对面海月、大司命，你英雄上机制上克制他们”。所以对上这两个，安心打节奏就行，不用绕。<\/li><li><strong>反向反制<\/strong>：阿古朵怕的是清野速度被压制、以及被反野。对面如果配强入侵打野，这个克制关系就不成立了。<\/li><li><strong>来源<\/strong>：BV1UeT16wEXt @ 15:50<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>阿古朵 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打阿古朵」「阿古朵怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月／大司命克制层级：机制克我该怎么做：UP 说得很直接：出阿古朵的情况之一就是“对面海月、大司命，你英雄上机制上克制他们”。", "opp": "海月"}], "lanes": ["jungle"], "tempo": "even", "job": "follow", "motto": "阿古朵绝对是打野里面打法最特殊之人", "beats": ["妲己", "诸葛亮"], "loses": ["苏烈", "韩信"], "main_lane": "jungle", "type": "射手", "unlisted": false, "n": 6, "b_n": 2, "vs": ["海月"], "beats_n": 2, "loses_n": 2, "incoming": ["苏烈", "韩信"], "loses_all": ["苏烈", "韩信"], "lane_names": ["打野"]}, {"name": "亚连", "hue": 314, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<p>素材只讲到\"怎么用\"，没讲技能原理，以下仅记录可复现的用法：<\/p>\n<ol><li><strong>消耗靠\"刮\"<\/strong>：一次接触只打一下就走——\"刮一手进草\"（BV16exveoEfJ @ 01:06）、\"再刮一手拉开\"（BV16exveoEfJ @ 02:19）<\/li><li><strong>有钩子类手段可以先手<\/strong>：\"勾一手一二好\"（BV16exveoEfJ @ 00:36）、\"抛个钩子\"（BV16exveoEfJ @ 02:16）<\/li><li><strong>有一套斩杀线判断<\/strong>：\"看能不能一套231给他斩死\"（BV16exveoEfJ @ 01:46）；同样的 231 也用来控：\"那我得231控死你了\"（BV16exveoEfJ @ 04:27）<\/li><li><strong>大招能当先手控<\/strong>：\"这大招直接控一手死\"（BV16exveoEfJ @ 12:28）<\/li><li>技能名、被动、具体数值素材均未提，不补<\/li><\/ol>", "sum": "素材只讲到\"怎么用\"，没讲技能原理，以下仅记录可复现的用法："}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>一级接触<\/strong><\/td><td>一二技能打一套，立刻\"拉开往后走\"，只换一波血量<\/td><td>BV16exveoEfJ @ 00:36~00:41<\/td><\/tr><tr><td><strong>换血后<\/strong><\/td><td>二三技能收尾再拉开，不给对面反打距离<\/td><td>BV16exveoEfJ @ 00:59<\/td><\/tr><tr><td><strong>消失视野<\/strong><\/td><td>刮一下进草藏视野，等对方身上的标记/状态消失，再出来刮第二下<\/td><td>BV16exveoEfJ @ 01:06~01:12<\/td><\/tr><tr><td><strong>第二次消耗<\/strong><\/td><td>一二转→进草→藏视野→抛钩子→再刮一手→拉开<\/td><td>BV16exveoEfJ @ 02:11~02:19<\/td><\/tr><tr><td><strong>连打带 A<\/strong><\/td><td>刮一手接 A，再 2-3 接 A 收<\/td><td>BV16exveoEfJ @ 02:25<\/td><\/tr><tr><td><strong>对手打野红开<\/strong><\/td><td>连喊两次\"小心小心红开的\"\"说了两次呀\"，提醒队友别被抓；判断打野位置靠野怪：\"去打小鸟了哈→这波他家打野是不会来的，应该在中路\"<\/td><td>BV16exveoEfJ @ 01:24~01:31、BV16exveoEfJ @ 01:57~02:02<\/td><\/tr><tr><td><strong>对嫦娥<\/strong><\/td><td>对面 2000 多经济也照打：\"我可以打得过，打不过也不至于被他打死\"<\/td><td>BV16exveoEfJ @ 04:38~04:48<\/td><\/tr><tr><td><strong>线权优先<\/strong><\/td><td>先拿线权再支援：\"先把线权拿了，好支援一会\"<\/td><td>BV16exveoEfJ @ 05:20~05:21<\/td><\/tr><tr><td><strong>怕张良<\/strong><\/td><td>\"最恶心的就是这个张良，他老掐我\"——被压制就废，需要队友先处理<\/td><td>BV16exveoEfJ @ 11:01~11:05<\/td><\/tr><tr><td><strong>跟团先手<\/strong><\/td><td>不自己开，等队友控住再跟：\"等队友控住，我直接跟他\"<\/td><td>BV16exveoEfJ @ 11:29~11:33<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景做法依据一级接触一二技能打一套，立刻\"拉开往后走\"，只换一波血量BV16exveoEfJ @ 00:36~00:41换血后二三技能收尾再拉开，不给对面反打距离BV16exveoEfJ @ …"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材没有统一连招公式，下面都是局内口述的片段组合：<\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>常规消耗<\/td><td>1-2 打完立刻后拉<\/td><td>BV16exveoEfJ @ 00:36~00:41<\/td><\/tr><tr><td>换血收尾<\/td><td>2-3 拉开<\/td><td>BV16exveoEfJ @ 00:59<\/td><\/tr><tr><td>斩杀<\/td><td>2-3-1 一套斩死<\/td><td>BV16exveoEfJ @ 01:46<\/td><\/tr><tr><td>控杀<\/td><td>2-3-1 控住再杀<\/td><td>BV16exveoEfJ @ 04:27<\/td><\/tr><tr><td>平 A 插入<\/td><td>刮一手 → A → 2-3 → A<\/td><td>BV16exveoEfJ @ 02:25<\/td><\/tr><tr><td>先手开团<\/td><td>大招直接起手控<\/td><td>BV16exveoEfJ @ 12:28<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "素材没有统一连招公式，下面都是局内口述的片段组合："}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>目标就是拆塔<\/strong>：\"直接二塔给他拆了\"（BV16exveoEfJ @ 06:07）、\"准备压中吧，请求集合来压中\"（BV16exveoEfJ @ 06:17~06:18）<\/li><li><strong>用传送阵来回支援<\/strong>：\"这波我去传送\"（BV16exveoEfJ @ 07:03）、\"打完还能再往中传\"（BV16exveoEfJ @ 07:23~07:24）<\/li><li><strong>替队伍站视野<\/strong>：\"我来中路站视野\"（BV16exveoEfJ @ 07:55）<\/li><li><strong>团战定位是吃伤害<\/strong>：\"抗伤强度拉满了\"（BV16exveoEfJ @ 06:57）、\"主宰我太肉了吧\"（BV16exveoEfJ @ 13:25）<\/li><li><strong>逆风信号看对面射手经济<\/strong>：孙尚香\"7000多了\"→\"完了我们要逆风了\"（BV16exveoEfJ @ 08:28~08:39）<\/li><\/ul>", "sum": "目标就是拆塔：\"直接二塔给他拆了\"（BV16exveoEfJ @ 06:07）、\"准备压中吧，请求集合来压中\"（BV16exveoEfJ @ 06:17~06:18）用传送阵来回支援：\"这波我…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>防御装顺序<\/strong>：\"做永夜先不合火甲，对面法术伤害占比高\"（BV16exveoEfJ @ 04:20~04:23）——先做永夜，火甲往后放<\/li><li><strong>成型节点<\/strong>：\"我的大盒装做出来了……我的永夜人生……抗伤强度拉满了\"（BV16exveoEfJ @ 06:51~06:57）<\/li><li><strong>后续补件<\/strong>：\"再搞手不死鸟\"（BV16exveoEfJ @ 10:55）<\/li><li><strong>攻速鞋有争议<\/strong>：前一句还在说\"还有一个亚连喂攻速鞋\"（BV16exveoEfJ @ 04:25），局末直接吐槽\"太脆了，还攻速鞋呢，谁教的呀\"（BV16exveoEfJ @ 14:03~14:06）<\/li><li>完整出装顺序未覆盖，铭文完全未提<\/li><\/ul>", "sum": "防御装顺序：\"做永夜先不合火甲，对面法术伤害占比高\"（BV16exveoEfJ @ 04:20~04:23）——先做永夜，火甲往后放成型节点：\"我的大盒装做出来了……我的永夜人生……抗伤强度拉…"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/514.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>吕布<\/strong><\/td><td>对抗路<\/td><td>“吕布比较笨重，亚连的技能能够轻松命中吕布并积攒怒气”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>庄周<\/strong><\/td><td>游走<\/td><td>“庄周缺乏控制和爆发，对亚连缺乏威胁”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>司马懿<\/strong><\/td><td>打野／中路<\/td><td>“司马懿爆发能力极强，能趁亚连怒气不足时快速击败亚连”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>马可波罗<\/strong><\/td><td>发育路<\/td><td>“马可波罗位移能力强，能让亚连难以接近”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：澜、瑶<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/514.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "mid", "job": "hold", "motto": "一二打完就拉开，进草隐藏视野再刮一手", "beats": ["吕布", "庄周"], "loses": ["司马懿", "马可波罗"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 2, "incoming": ["司马懿", "马可波罗"], "loses_all": ["司马懿", "马可波罗"], "lane_names": ["对抗路"]}, {"name": "元歌", "hue": 177, "a": [{"id": "", "cat": "", "title": "1. 被动与傀儡：三条必须先背的规则", "self": "<h3>1. 被动与傀儡：三条必须先背的规则<\/h3>", "html": "<h3>1.1 碎片：普攻/技能命中敌方英雄就收集，50 个变一次敌方英雄<\/h3>\n<ul><li>背包最多 <strong>150 个<\/strong><\/li><li>每消耗 <strong>50 个<\/strong>可以变成<strong>任意敌方英雄<\/strong><\/li><li>元歌的\"恢复\"技能被换成了碎片（不是回血键）<\/li><li><strong>来源<\/strong>：BV1G8etzKEKV @ 00:17、@ 00:34<\/li><\/ul>\n<h3>1.2 变身只能持续 10 秒，但可以卡最后一秒延长<\/h3>\n<ul><li>屏幕<strong>变暗<\/strong>说明只剩最后 2 秒<\/li><li><strong>卡最后一秒接持续技能<\/strong>可以延长变身时间：孙策的开船、马可的一三技能、嬴政的大招<\/li><li><strong>来源<\/strong>：@ 00:52<\/li><\/ul>\n<h3>1.3 傀儡被打死 = 本体眩晕 2 秒 + 20 秒不能再召唤（最致命的一条）<\/h3>\n<ul><li>眩晕 2 秒且<strong>不能用四技能解除<\/strong><\/li><li>20 秒内<strong>禁止召唤傀儡<\/strong><\/li><li><strong>补救<\/strong>：傀儡即将死亡时<strong>秒按四技能位移<\/strong>，或用 <strong>332 连招<\/strong>，可以免疫眩晕<\/li><li><strong>来源<\/strong>：@ 02:17、@ 02:33<\/li><\/ul>", "sum": "1.1 碎片：普攻/技能命中敌方英雄就收集，50 个变一次敌方英雄背包最多 150 个每消耗 50 个可以变成任意敌方英雄元歌的\"恢复\"技能被换成了碎片（不是回血键）来源：BV1G8etzKE…"}, {"id": "", "cat": "", "title": "2. 技能细节（每条都是\"说明里没写\"的）", "self": "<h3>2. 技能细节（每条都是\"说明里没写\"的）<\/h3>", "html": "<h3>2.1 一技能（丢/收傀儡）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>细节<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>回收收益<\/td><td>回收傀儡会加<strong>护盾 + 最高 80% 移速<\/strong><\/td><\/tr><tr><td>击飞<\/td><td>丢出和回收<strong>都对路径上的敌人造成击飞<\/strong><\/td><\/tr><tr><td>身后判定<\/td><td>丢和收都有<strong>一个身位左右的身后判定<\/strong><\/td><\/tr><tr><td><strong>塔下消耗<\/strong><\/td><td><strong>傀儡攻击塔下的敌人，防御塔不会攻击傀儡<\/strong> —— 越塔消耗的免费手段<\/td><\/tr><tr><td>傀儡能干嘛<\/td><td>吃经济经验、<strong>继承本体的 Buff 效果<\/strong><\/td><\/tr><tr><td><strong>自动普攻<\/strong><\/td><td>放出傀儡后身边有三个圈：<strong>最内圈有攻击单位、且傀儡不出第二圈<\/strong>，本体就会<strong>自动普攻那个目标<\/strong>（本体和傀儡同时输出）<\/td><\/tr><tr><td>傀儡消失<\/td><td>傀儡出最大圈后脚下出现箭头，<strong>攒到五个箭头傀儡直接消失<\/strong>；走回圈内箭头归零<\/td><\/tr><tr><td><strong>解控<\/strong><\/td><td>本体被控制时，<strong>收回傀儡即可瞬间解除<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>来源<\/strong>：@ 01:09、@ 01:25、@ 01:43、@ 02:00、@ 02:17<\/li><\/ul>\n<h3>2.2 二技能（四枚暗器）<\/h3>\n<ul><li><strong>二技能瞬间马上接一技能<\/strong>：取消后摇，还能瞬间打出伤害和控制（一二都有严重前后摇）<\/li><li><strong>指示器不准<\/strong>：实际攻击距离比指示器<strong>远一个身位<\/strong><\/li><li><strong>不需要贴脸<\/strong>：与敌人保持<strong>半个闪现左右<\/strong>的距离，四枚暗器才能全中、爆发拉满<\/li><li><strong>可以二闪<\/strong>：但闪现<strong>只改释放位置，不改攻击方向<\/strong><\/li><li><strong>来源<\/strong>：@ 02:33、@ 02:53、@ 03:09<\/li><\/ul>\n<h3>2.3 三技能（十字斩）<\/h3>\n<ul><li><strong>两条线的中心斩中<\/strong>：伤害翻倍 + 有斩杀效果 + 减速<\/li><li><strong>前摇很长，但代码是瞬发<\/strong>：即使前摇时元歌被击杀，<strong>三技能还是会打出来<\/strong> → 极限反杀<\/li><li><strong>本体往后撤退<\/strong>：所以 <strong>二三连招<\/strong>是元歌最基础的高爆发连招<\/li><li><strong>可穿墙 + 无影步<\/strong>：卡视野反蹲、拉扯风筝都能用<\/li><li><strong>侧斩<\/strong>：单用一条线的末端攻击，<strong>能延长双倍攻击距离<\/strong> → 抢野怪、收割残血、远距离补刀<\/li><li><strong>来源<\/strong>：@ 03:26、@ 03:43、@ 04:02<\/li><\/ul>\n<h3>2.4 四技能<\/h3>\n<ul><li>释放时<strong>无法被选中<\/strong>，可躲伤害、穿墙逃跑，<strong>吃到控制也能直接解除<\/strong><\/li><li><strong>缺点<\/strong>：不能像净化一样清除负面效果（扁鹊的毒、李元芳的标记）<\/li><li><strong>来源<\/strong>：@ 04:21<\/li><\/ul>\n<h3>2.5 傀儡形态的三个技能<\/h3>\n<div class=\"tw\"><table><thead><tr><th>技能<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>傀儡二技能<\/td><td><strong>本体和傀儡互换位置<\/strong><\/td><\/tr><tr><td>傀儡三技能<\/td><td>两段：一段<strong>减速<\/strong>，三秒内可放第二段<strong>持续眩晕<\/strong> → <strong>133 是元歌最强的控制连招<\/strong><\/td><\/tr><tr><td>傀儡四技能<\/td><td><strong>带着本体一起位移<\/strong>；本体位移时<strong>像貂蝉二技能一样免疫伤害和控制<\/strong>；<strong>三三控制后接二技能换位也能卡出无敌和霸体<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>后摇取消<\/strong>：傀儡三技能第一段施法后摇严重，<strong>秒接平A 或收回傀儡<\/strong>都能取消 → 中后期进场能防傀儡被秒<\/li><li><strong>远程消耗<\/strong>：<strong>3A1<\/strong> 可以瞬间打出高额消耗<\/li><li><strong>来源<\/strong>：@ 04:38、@ 04:56、@ 05:13、@ 05:31<\/li><\/ul>", "sum": "2.1 一技能（丢/收傀儡）细节内容回收收益回收傀儡会加护盾 + 最高 80% 移速击飞丢出和回收都对路径上的敌人造成击飞身后判定丢和收都有一个身位左右的身后判定塔下消耗傀儡攻击塔下的敌人，防…"}, {"id": "", "cat": "", "title": "3. 三套连招（他明确说\"元歌真正的精髓只有三套\"）", "self": "<h3>3. 三套连招（他明确说\"元歌真正的精髓只有三套\"）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>连招<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td><strong>1<\/strong><\/td><td>一（放傀儡）→ 四（突脸）→ 三三（减速+控制）→ 二（换回本体）→ 二三（打爆发）<\/td><td>前中期<strong>打消耗 + 秒脆皮<\/strong><\/td><\/tr><tr><td><strong>2<\/strong><\/td><td>一 → 四突脸 → 三一段（挂减速）→ 二换位 → 一收回傀儡（打出控制）→ 三二（打满爆发）<\/td><td>后期<strong>秒脆皮、越塔<\/strong>，速度极快<\/td><\/tr><tr><td><strong>3<\/strong><\/td><td>二一（起手控制）→ 挂减速 → 瞬间换位 → 收回傀儡（控制）→ 三（斩杀收割）<\/td><td><strong>蹲草 / 被贴脸反打<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>来源<\/strong>：@ 05:50、@ 06:10、@ 06:29<\/li><\/ul>\n<p><strong>共同结构<\/strong>：都是\"<strong>先挂控制 → 再打伤害<\/strong>\"。元歌的伤害全在\"对方动不了\"的那一秒里，所以顺序错了一整套就废。<\/p>", "sum": "共同结构：都是\"先挂控制 → 再打伤害\"。"}, {"id": "", "cat": "", "title": "4. 出装与铭文", "self": "<h3>4. 出装与铭文<\/h3>", "html": "<p><strong>铭文<\/strong>：10 异变 / 10 隐匿 / 10 鹰眼（@ 06:46）<\/p>\n<p><strong>出装顺序<\/strong>：<\/p>\n<pre><code>护手 → 布甲鞋 → 暗影战斧 → 苍穹 → 破军 → 冰痕 + 碎星锤<\/code><\/pre>\n<div class=\"tw\"><table><thead><tr><th>件<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>护手 + 布甲鞋<\/td><td>大幅提升<strong>前期对拼能力<\/strong><\/td><\/tr><tr><td>暗影战斧 + 苍穹<\/td><td><strong>爆发和容错同时拉满<\/strong><\/td><\/tr><tr><td>破军<\/td><td>大幅提高爆发<\/td><\/tr><tr><td>冰痕 + 碎星锤<\/td><td>常规收尾<\/td><\/tr><tr><td><strong>对面爆发高<\/strong><\/td><td><strong>冰痕换成防御装保命<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>原话批评了两种常见错法：冷缩不够（极其难受）、身板太脆（一碰就碎）。<\/p>", "sum": "铭文：10 异变 / 10 隐匿 / 10 鹰眼（@ 06:46）"}, {"id": "", "cat": "", "title": "5. 一句话", "self": "<h3>5. 一句话<\/h3>", "html": "<p><strong>元歌不是\"操作英雄\"，是\"信息英雄\"——你之所以打不出伤害，通常不是手速不够，是傀儡没先把对面按住。<\/strong><\/p>", "sum": "元歌不是\"操作英雄\"，是\"信息英雄\"——你之所以打不出伤害，通常不是手速不够，是傀儡没先把对面按住。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/125.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>狂铁<\/strong><\/td><td>对抗路<\/td><td>“狂铁的爆发力十分有规律，而元歌灵活的战斗方式会让狂铁有力无处使”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“元歌强有力的控制伤害能力，对于没有位移的射手来说是无法单独处理的”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“元歌本体还是惧怕爆发袭击，兰陵王凭借隐身能力能逼迫元歌放弃操作傀儡，轻松击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>阿轲<\/strong><\/td><td>打野<\/td><td>“同样具有隐身能力的阿轲也会限制元歌的发挥”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：白起、鬼谷子<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/125.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "mid", "job": "scout", "motto": "傀儡是眼睛，本体是刀", "beats": ["狂铁", "鲁班七号"], "loses": ["兰陵王", "阿轲"], "main_lane": "solo", "type": "刺客", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 2, "incoming": ["兰陵王", "阿轲"], "loses_all": ["兰陵王", "阿轲"], "lane_names": ["对抗路"]}, {"name": "元流之子", "hue": 27, "a": [{"id": "", "cat": "", "title": "1. 机制内核：能量系统决定一切", "self": "<h3>1. 机制内核：能量系统决定一切<\/h3>", "html": "<ol><li><strong>一技能是能量发动机<\/strong>：空放可攒五格能量，场上每多一个队友/目标额外加能量，两个兵线才额外加一格（BV1jk9nBXEFQ @ 04:26、@ 04:33）。能量会消失，没队友时只能平 A 敌方单位或重放一技能刷新（@ 04:47）<\/li><li><strong>能量的作用<\/strong>：平 A 加伤害；四层能量可以多放一次二技能，五层能量可以多放一次大招（@ 05:21）<\/li><li><strong>伤害核心是二技能不是大招<\/strong>：不管有没有装备，二技能伤害都比大招高，还有回复（@ 05:29）。刺客形态\"核心就是二技能，大招只是用来辅助的\"（@ 04:01）<\/li><li><strong>一技能回血是坦度来源<\/strong>：中单狂暴流里\"一个二技能回 300 多，一个一技能回 700，加上技能吸血，完全是个坦克\"（BV1GW421d7bj @ 00:59）；一技能靠近小兵一起吸可以多两个能量（@ 03:47）<\/li><li><strong>大招二阶爆发<\/strong>：对面没位移时直接刷二阶大招，\"满血墨子一套三秒钟直接秒\"（@ 05:55）<\/li><\/ol>", "sum": "一技能是能量发动机：空放可攒五格能量，场上每多一个队友/目标额外加能量，两个兵线才额外加一格（BV1jk9nBXEFQ @ 04:26、@ 04:33）。"}, {"id": "", "cat": "", "title": "2. 对线：开局装与抢线公式（中单形态）", "self": "<h3>2. 对线：开局装与抢线公式（中单形态）<\/h3>", "html": "<ul><li><strong>开局选生命装 + 匕首，预购攻速鞋<\/strong>——提升一级对拼抢线能力（BV1GW421d7bj @ 01:40）。法穿是三件开局装备里收益最低的，因为前期没魔抗（@ 01:29）<\/li><li><strong>第一波线见人开狂暴清线<\/strong>，用补刀键锁兵，被打了狂暴吸血吸回来（@ 01:46）；但对线周瑜、猫咪不能这么抢，抢不过还容易被反杀（@ 01:59）<\/li><li><strong>有线权直接二级支援发育路<\/strong>：这个版本取消河蟹后，第一波线权的中单都很强（@ 02:06）<\/li><li><strong>第二波线可以放<\/strong>：协助射手吃完红隼和兵线，让打野补中，再带辅助回红区，之后一起去对抗路抢四级传送阵（@ 02:31）<\/li><li><strong>打野形态<\/strong>：26 秒存一技能，和中单站一起多一层能量；能量尽量用在强化普攻上，刷野效率高（BV1Lb421n7P8 @ 00:24）；建议对抗路开，2 分钟能刷回上路（@ 00:41）<\/li><\/ul>", "sum": "开局选生命装 + 匕首，预购攻速鞋——提升一级对拼抢线能力（BV1GW421d7bj @ 01:40）。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>中单先手<\/td><td><strong>狂暴 + 大招接双二控制<\/strong><\/td><td>BV1GW421d7bj @ 03:26<\/td><\/tr><tr><td>中路蹲草消耗<\/td><td><strong>一技能吸被动 → 双二接大招<\/strong>，打掉半血<\/td><td>BV1GW421d7bj @ 03:50<\/td><\/tr><tr><td>支援抓人<\/td><td><strong>双二起手<\/strong>（前期主要输出就是双二 + 平 A）<\/td><td>BV1GW421d7bj @ 02:24<\/td><\/tr><tr><td>刺客进场<\/td><td><strong>二三大突进 → 强化二技能打后排<\/strong>，第一个二技能可以空掉<\/td><td>BV1jk9nBXEFQ @ 09:59<\/td><\/tr><tr><td>刺客拉扯<\/td><td>打完一套<strong>等一技能能量再上<\/strong>，打两套而不是一套<\/td><td>BV1jk9nBXEFQ @ 04:15<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>刺客形态细节：二技能连打三下过程中除非目标消失/你用大招/被压制，否则不会被打断（BV1jk9nBXEFQ @ 05:47）；二技能有略微击退，贴野怪往墙外放可以隔墙打蓝（@ 06:31）；想释放流畅只能<strong>滑动<\/strong>二技能，点击、加移动键、点平 A 都会卡顿（@ 07:03）。<\/p><\/blockquote>", "sum": "刺客形态细节：二技能连打三下过程中除非目标消失/你用大招/被压制，否则不会被打断（BV1jk9nBXEFQ @ 05:47）；"}, {"id": "", "cat": "", "title": "4. 中后期/节奏", "self": "<h3>4. 中后期/节奏<\/h3>", "html": "<ul><li><strong>中期公式<\/strong>：有线权就找资源控；打野吃中时跟着打野吃野区，加快出野区速度（BV1GW421d7bj @ 07:10）；2 分钟后有线权往发育路支援（@ 07:42）<\/li><li><strong>打团公式<\/strong>：开大攒好被动往前滋就行，\"打团是很无脑的，非常不需要手\"（@ 06:10）；有抵抗鞋 + 狂暴，对面攻不动你，这个英雄\"就相当于是一个有伤害有控制的前排\"（@ 04:22）<\/li><li><strong>坦度里程碑<\/strong>：8 分钟 8000 血，\"其他中单想都不敢想的坦度\"（@ 05:18）；狂暴一开满血就是斩杀线（@ 09:06）<\/li><li><strong>强度边界<\/strong>：综合性能比狂暴婉儿强（有控制、能持续输出），但上限没婉儿高（@ 06:26）；怕多突进阵容，\"面对多突进阵容基本上没有任何反打能力\"（@ 00:24）<\/li><\/ul>", "sum": "中期公式：有线权就找资源控；"}, {"id": "", "cat": "", "title": "5. 出装铭文（中单狂暴流，BV1GW421d7bj）", "self": "<h3>5. 出装铭文（中单狂暴流，BV1GW421d7bj）<\/h3>", "html": "<ul><li><strong>铭文<\/strong>：正常法师百穿穿透（@ 08:27）；<strong>召唤师技能必带狂暴<\/strong>，否则伤害吸血都不够（@ 08:31）<\/li><li><strong>顺序<\/strong>：生命装出门 → 匕首 + 攻速鞋 → 换法穿鞋 → 血书（拉满狂暴收益）→ 破茧之甲（5000 块吃满全部属性）→ <strong>换鞋 CD 好了法穿鞋换回抵抗鞋<\/strong>（不缺输出了，260 穿透下 C 位出不了魔抗）→ 时之预言 → 帽子（法术加成高收益大）→ 最后一件：对面魔抗低就穿透武器 + 回响/梦魇，魔抗高就双穿（@ 08:36–09:40）<\/li><li><strong>打野/刺客形态<\/strong>：野刀 → 鞋（控多抵抗鞋、正常冷却鞋）→ 不先做黑切先做三级野刀 → 黑切 → 苍穹（做完苍穹必须换抵抗鞋）→ 反甲 → 破军/魔女；第五件必做肉（BV1jk9nBXEFQ @ 01:41–03:28）；铭文常规隐匿百穿带一个红月（@ 03:55）。顺风能做破军就做破军（@ 01:31）<\/li><\/ul>", "sum": "铭文：正常法师百穿穿透（@ 08:27）；"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>官方详情页不存在或抓取失败（<code>herodetail/582.shtml<\/code>），这一块留空。 新英雄上线后官方常不补关系页，只能靠实测补。<\/p><\/blockquote>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "官方详情页不存在或抓取失败（herodetail/582.shtml），这一块留空。", "opp": ""}], "lanes": ["solo"], "tempo": "mid", "job": "open", "motto": "你要解决的是怎么才能站得住，把你伤害打满", "beats": [], "loses": [], "main_lane": "solo", "type": "法师", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 0, "loses_n": 0, "incoming": [], "loses_all": [], "lane_names": ["对抗路"]}, {"name": "兰陵王", "hue": 28, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>破隐三秒攻速<\/strong>：解除隐身之后三秒内攻速增加，下方图标就是攻速效果（BV1bm421L7Ma @ 02:17~02:24）；图标转到半圈时再点一次隐身，上一段攻速刚结束、下一段破隐刚好接上，可以无缝续攻速（BV1bm421L7Ma @ 02:24~02:36）<\/li><li><strong>二技能标记<\/strong>：标记到敌人后，对其普攻或放技能都能造成眩晕并给自己回血（BV1bm421L7Ma @ 07:09~07:16）<\/li><li><strong>二技能只命中第一个英雄<\/strong>：飞镖能穿小兵和野怪，但打中英雄就停下，性质与安琪拉一技能一样，被辅助挡掉后后续连招可能打不死人（BV1bm421L7Ma @ 07:35~07:46）<\/li><li><strong>多次回血<\/strong>：标记多个敌人后分多次打出眩晕可以触发多次回血；一次攻击把所有单位的眩晕都打出来，只回一次（BV1bm421L7Ma @ 07:56~08:08）<\/li><li><strong>二技能爆炸破隐<\/strong>：二技能爆炸会解除隐身，所以放完二技能想跑，最好估着还差一秒爆炸时再开隐身，否则刚隐身就又显形（BV1bm421L7Ma @ 08:11~08:32）<\/li><li><strong>大招范围大于位移<\/strong>：一旦放大招就解除隐身，而大招的伤害范围比位移距离更远（BV1bm421L7Ma @ 06:03~06:11、06:27~06:32）<\/li><li><strong>探草<\/strong>：脚底下出现加速标志，就代表前面的草丛里有人（BV1bm421L7Ma @ 13:39~13:47）<\/li><\/ol>", "sum": "破隐三秒攻速：解除隐身之后三秒内攻速增加，下方图标就是攻速效果（BV1bm421L7Ma @ 02:17~02:24）；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>选人<\/strong><\/td><td>能禁英雄时优先禁蔡文姬，其次李元芳和百里守约；其他的没必要<\/td><td>BV1bm421L7Ma @ 01:37~01:45<\/td><\/tr><tr><td><strong>开局<\/strong><\/td><td>出生第一时间点隐身，打蓝打红都可以，靠破隐攻速打完 Buff<\/td><td>BV1bm421L7Ma @ 02:13~02:36<\/td><\/tr><tr><td><strong>抓人目标<\/strong><\/td><td>半个地图以内、血量一半以下、或者打得比较激进的英雄<\/td><td>BV1bm421L7Ma @ 03:13~03:21<\/td><\/tr><tr><td><strong>抓人实例<\/strong><\/td><td>本已从下路走到中路准备打蓝 Buff，看到对面下路二人组打得很激进，果断转头回下路，靠稳定控制与伤害拿下人头<\/td><td>BV1bm421L7Ma @ 03:24~03:36<\/td><\/tr><tr><td><strong>避战：以一敌二<\/strong><\/td><td>打野位擅长的单体爆发、不擅长对群，以少敌多顶多杀一个，伤害分摊到多人身上可能一个都杀不掉<\/td><td>BV1bm421L7Ma @ 03:38~04:05<\/td><\/tr><tr><td><strong>避战：不跟对面打野单挑<\/strong><\/td><td>单挑能打过的打野\"极其的少\"，要做的是偷袭残血或脆皮，不在正面战场硬刚<\/td><td>BV1bm421L7Ma @ 04:05~04:23<\/td><\/tr><tr><td><strong>避战：不打肉盾<\/strong><\/td><td>清兵打野慢 + 大招 CD 长，打肉盾打不死，等于把时间和技能浪费掉，是收益最低的打法<\/td><td>BV1bm421L7Ma @ 04:25~04:38<\/td><\/tr><tr><td><strong>软柿子法则<\/strong><\/td><td>谁一抓一个准就反复抓他；抓了两次都抓不死，说明这个人会玩，就不抓<\/td><td>BV1bm421L7Ma @ 04:40~04:57<\/td><\/tr><tr><td><strong>心理战<\/strong><\/td><td>隐身快结束时就近找草丛蹲下，对面看不到感叹号就想象不到你在草里，这时候一套 231 成功率相当高<\/td><td>BV1bm421L7Ma @ 06:41~07:03<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景做法依据选人能禁英雄时优先禁蔡文姬，其次李元芳和百里守约；"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>最稳妥（贴身）<\/strong><\/td><td>走到敌人身边 → 二技能挂标记 → <strong>普攻<\/strong>打出眩晕 → 接一三技能打伤害的同时拉开距离<\/td><td>BV1bm421L7Ma @ 05:18~05:26<\/td><\/tr><tr><td><strong>出其不意<\/strong><\/td><td>231：感叹号刚亮，人已经贴到脸上，低分段很多玩家反应不过来<\/td><td>BV1bm421L7Ma @ 05:44~06:01<\/td><\/tr><tr><td><strong>收残血<\/strong><\/td><td>32：直接大招扑过去，再接二技能；对方血量低、不太缺伤害又赶时间时用<\/td><td>BV1bm421L7Ma @ 06:16~06:35<\/td><\/tr><tr><td><strong>后期有冰甲<\/strong><\/td><td>先贴身 → 冰甲定住 → 再放技能，绕开\"飞镖可能空\"和\"进场被控\"两个问题<\/td><td>BV1bm421L7Ma @ 11:01~11:16<\/td><\/tr><tr><td><strong>团战摸后排<\/strong><\/td><td>隐身绕后，等队友跟对面打起来，找战场最外围的人，一套 213 收掉后跑路<\/td><td>BV1bm421L7Ma @ 10:08~10:33<\/td><\/tr><tr><td><strong>抢龙<\/strong><\/td><td>龙剩 1 万血左右时 231 接惩击<\/td><td>BV1bm421L7Ma @ 13:24~13:28<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>231 的风险<\/strong>：不管有没有打到人，只要放大招就解除隐身，二技能空了就可能回不来（BV1bm421L7Ma @ 06:03~06:15）<\/li><li><strong>二技能空了<\/strong>：第一时间不会显形，直接走就行（BV1bm421L7Ma @ 05:36~05:42）<\/li><\/ul>", "sum": "场景连招依据最稳妥（贴身）走到敌人身边 → 二技能挂标记 → 普攻打出眩晕 → 接一三技能打伤害的同时拉开距离BV1bm421L7Ma @ 05:18~05:26出其不意231：感叹号刚亮，人…"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>中期的判定<\/strong>：边路没人清兵线、射手和辅助都聚在中路打架，就是中期（BV1bm421L7Ma @ 08:39~08:50）<\/li><li><strong>顺风 / 均势<\/strong>：赶紧推塔，想办法破掉中路一塔二塔（BV1bm421L7Ma @ 08:51~08:55）；但不要冒进——这时候脆皮开始抱团，杀掉一个也容易被剩下的人集火，顺风局死一次对面经济就追上来一大截（BV1bm421L7Ma @ 09:03~09:14）<\/li><li><strong>逆风<\/strong>：尽量避战，去边路带线；有人来抓就大招拉距离 + 隐身跑路（BV1bm421L7Ma @ 09:17~09:26）。跑法是先往一个方向跑，进隐身之后立马掉头；追的人也回头，就再来一个 90 度转弯（BV1bm421L7Ma @ 09:27~09:43）<\/li><li><strong>团战不能先手<\/strong>：隐身摸到敌人身边、一套二一再用三技能撤出来的想法\"千万不要有\"，因为很容易死；正确顺序是隐身绕到后方，等队友开打，再收战场最外围的人（BV1bm421L7Ma @ 09:52~10:33）<\/li><li><strong>后期（冰甲到手）<\/strong>：射手法师三四个大件、打野接近六神，兰陵王会穷一点，但此时冰甲通常已经到手（素材原话\"我相信你一定已经买出了那件装备\"），进场方式随之改变（BV1bm421L7Ma @ 10:44~11:16）<\/li><li><strong>后期伏击<\/strong>：防御塔推得差不多、战线拉长后，可以在敌方脆皮从泉水复活赶往前线的路上伏击，直接在家门口截杀（BV1bm421L7Ma @ 11:20~11:36）<\/li><li><strong>推高地<\/strong>：一进塔就会被防御塔照出来，能做的是站在塔外围，看谁位置靠前就 231 摸奖；最好有队友先吸引塔的仇恨（BV1bm421L7Ma @ 11:44~12:07）。对面不敢靠前或二技能空了，就用破隐的三秒攻速跟队友一起拆塔（BV1bm421L7Ma @ 12:10~12:16）<\/li><li><strong>守高地<\/strong>：刺客不擅长守家，靠隐身绕到敌人后方不停亮感叹号施压，找配合机会，或者去断对面下一波兵线（BV1bm421L7Ma @ 12:18~12:33）<\/li><li><strong>大后期<\/strong>：所有人六神后是兰陵王最难打的时候，对面抱团紧就一点机会都没有；只能等队友先手吸引注意力再摸脆皮，能一换一就是赚（BV1bm421L7Ma @ 12:39~13:01）<\/li><li><strong>风暴龙王<\/strong>：敌方拿了龙王后，闪电能劈到隐身的兰陵王——不会显形，但会暴露位置（BV1bm421L7Ma @ 13:02~13:15）；反过来兰陵王抢龙很容易，爆发高，成功率在 70% 左右（BV1bm421L7Ma @ 13:18~13:30）<\/li><\/ul>", "sum": "中期的判定：边路没人清兵线、射手和辅助都聚在中路打架，就是中期（BV1bm421L7Ma @ 08:39~08:50）顺风 / 均势：赶紧推塔，想办法破掉中路一塔二塔（BV1bm421L7Ma…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p><strong>出装顺序<\/strong>（BV1bm421L7Ma @ 00:48~00:56）：<\/p>\n<ol><li>小的红色打野刀<\/li><li>抵抗鞋<\/li><li>暗影战斧<\/li><li>升级打野刀<\/li><\/ol>\n<ul><li>讲者称这三件是\"几乎每一个刺客或者战士型打野都可以\"的起手（BV1bm421L7Ma @ 00:56~01:01）<\/li><li><strong>第四件冰霜冲击（冰甲）<\/strong>：可以让周围敌人眩晕接近一秒，是这套方案的关键件（BV1bm421L7Ma @ 01:01~01:09）<\/li><li>第五件破军补伤害，第六件名刀司命，确保进场后在被打死之前把伤害打出来（BV1bm421L7Ma @ 01:10~01:17）<\/li><li>这套只有三件攻击装，\"但是伤害是完全够的\"；不够就把名刀司命换成碎星锤（BV1bm421L7Ma @ 01:20~01:29）<\/li><\/ul>\n<p><strong>铭文<\/strong>：两套可选——\"战刺穿透攻速\"或\"战刺穿透攻击\"（BV1bm421L7Ma @ 01:47~01:51）。讲者更偏向攻速：攻击提高的是爆发伤害，攻速提高的是持续伤害，而兰陵王清兵打野偏慢，补攻速才不至于打得很痛苦（BV1bm421L7Ma @ 01:54~02:08）。<\/p>\n<blockquote><p>完整铭文名称与属性未覆盖，见待补。<\/p><\/blockquote>", "sum": "出装顺序（BV1bm421L7Ma @ 00:48~00:56）："}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/153.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（24）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“鲁班七号：无位移技能的英雄，兰陵王几乎是他们最大的威胁，高爆发一套流的特性，可以非常好的…”<\/td><td>_待补_<\/td><td>L0 官方·双向<\/td><\/tr><tr><td><strong>伽罗<\/strong><\/td><td>发育路<\/td><td>“暗中前来的兰陵王让伽罗的视野能力失去意义，突出的爆发能力更会直接将伽罗秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>元歌<\/strong><\/td><td>对抗路<\/td><td>“元歌本体还是惧怕爆发袭击，兰陵王凭借隐身能力能逼迫元歌放弃操作傀儡，轻松击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>周瑜<\/strong><\/td><td>中路<\/td><td>“兰陵王大招的隐身近身和二段位移斩杀，十分克制需要布置战场的周瑜”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>女娲<\/strong><\/td><td>中路<\/td><td>“女娲无法预知兰陵王会从哪个方向进攻，其高额的爆发也会让女娲感受到压力”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>妲己<\/strong><\/td><td>中路<\/td><td>“兰陵王的隐身和秒杀能力很容易接近妲己将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>嬴政<\/strong><\/td><td>中路<\/td><td>“兰陵王的隐身和秒杀能力很容易接近嬴政将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>孙尚香<\/strong><\/td><td>发育路<\/td><td>“兰陵王的隐身和秒杀能力很容易接近孙尚香将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>孙膑<\/strong><\/td><td>游走<\/td><td>“兰陵王的隐身和秒杀能力很容易接近孙膑将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>安琪拉<\/strong><\/td><td>中路<\/td><td>“兰陵王在团战中能够一套技能直接带走安琪拉”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>小乔<\/strong><\/td><td>中路<\/td><td>“兰陵王在团战中能够一套技能直接带走小乔”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>干将莫邪<\/strong><\/td><td>中路<\/td><td>“干将莫邪没有技能可以抵抗兰陵王的秒杀能力”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>扁鹊<\/strong><\/td><td>中路<\/td><td>“兰陵王的隐身和秒杀能力很容易接近扁鹊将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>李元芳<\/strong><\/td><td>打野／发育路<\/td><td>“兰陵王：兰陵王的核心玩法是隐身后先手秒杀敌方核心输出点，有李元芳的被动在可以轻松探测到敌…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>李白<\/strong><\/td><td>打野<\/td><td>“李白：李白在初期的伤害能力比较差，单挑无法打赢兰陵王，被兰陵王2技能加1技能组合技能后会…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>武则天<\/strong><\/td><td>中路<\/td><td>“兰陵王在团战中能够一套技能直接带走武则天”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>沈梦溪< 42167Ar @ 01:05~01:14）；随后\"轮到我卡上线\"，\"就因为我的兵线卡在这个位置 他完全玩不了\"（BV1HB42167Ar @ 01:38~01:45）。<\/li><li><strong>对手打他不抢线<\/strong>：被问\"大神怎么打\"时，回答是\"前期不要抢线啊\"（BV1HB42167Ar @ 02:17~02:19）。<\/li><li><strong>漏兵会被滚雪球<\/strong>：\"他这波1233只小兵没了 还被卡了两只兵\"（BV1HB42167Ar @ 05:16~05:19）。<\/li><li><strong>经济被迅速拉开<\/strong>：司空震\"2600经济\"，对手\"4200\"（BV1HB42167Ar @ 05:58~06:01）。<\/li><li><strong>塔一破就没人管<\/strong>：\"他上路塔已经破了……他现在上路塔破了 不需要打\"（BV1HB42167Ar @ 05:48~05:51）——线权丢掉后对手直接放弃这条线。<\/li><li><strong>交闪能活<\/strong>：对手追到一半\"江湖规矩 交闪不杀\"（BV1HB42167Ar @ 07:36~07:42），闪现是他少有的脱身手段。<\/li><li><strong>前期被单杀的具体窗口<\/strong>：对手在\"牢大现在是三级\"时选择\"先一技能一抓一下 打出大招\"，升四级后\"连人带兵一起打……然后就一脚二一把他踹死\"（BV1HB42167Ar @ 01:58~02:12）——即<strong>司空震四级前后、大招刚交或未好的那一波<\/strong>最危险。<\/li><li><strong>狂暴是他前期的硬筹码<\/strong>：\"有狂暴不能打法\"（BV1HB42167Ar @ 00:45~00:47），对手会等狂暴结束再压。<\/li><\/ul>", "sum": "以下是对手视角下司空震的处境与对手的处理方式，即\"司空震会被怎么打\"。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖司空震的连招细节。片中出现的\"1212\"（BV1HB42167Ar @ 02:09）、\"1A21231A二\"（BV1HB42167Ar @ 05:11）、\"321一脚两脚\"（BV1HB42167Ar @ 11:43）全部是<strong>主播（对手）自己的连招<\/strong>，不能算作司空震的连招，故不列表。<\/p>", "sum": "素材未覆盖司空震的连招细节。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>有大招才有出手权<\/strong>：对手的整条判断链是\"没大→可以直接抓/越塔\"，\"越塔他没大\"（BV1HB42167Ar @ 04:32）。<\/li><li><strong>没大招时对面敢抱团压塔<\/strong>：对手在己方\"都没有大招\"的情况下仍然选择\"保证后排打\"，因为对面同样缺大（BV1HB42167Ar @ 12:02~12:10）。<\/li><li><strong>线权丢失后地图存在感消失<\/strong>：上路塔破，\"不需要打\"，对手转去中路与野区（BV1HB42167Ar @ 05:48~05:51）。<\/li><li><strong>素材没有给出司空震的翻盘或带线方式<\/strong>：全片只有他被卡线、被抓、被越塔的镜头。<\/li><\/ul>", "sum": "有大招才有出手权：对手的整条判断链是\"没大→可以直接抓/越塔\"，\"越塔他没大\"（BV1HB42167Ar @ 04:32）。"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>只给到对手的针对出装<\/strong>：对面开局\"赶紧买个抗魔披风\"，再\"买个陨星\"（BV1HB42167Ar @ 00:05~00:08）——说明对线压力的来源是司空震的法术伤害，这属于对手的出装，不是司空震的出装。<\/li><li>片中关于\"出冰心\"\"有三套出装\"的讨论（BV1HB42167Ar @ 09:11~09:19），是主播在回答自己英雄的出装，<stro detail/123.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B29", "cat": "B", "title": "对海月：带免控、出名刀就很好打", "self": "<h3><a class=\"kref\" href=\"#K-B29\">K-B29<\/a> 对海月：带免控、出名刀就很好打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月<\/li><li><strong>克制层级<\/strong>：机制克<\/li><li><strong>我该怎么做<\/strong>：海月的核心是把人拉进幻境单挑。两个解法：①带<strong>免控<\/strong>（净化/装备）直接废掉她的控制链；②出<strong>名刀·司命<\/strong>，被拉进去也能挡一下不死。有了这两样，这个对位就反过来了。<\/li><li><strong>反向反制<\/strong>：海月可以不拉你，转去拉你的队友。所以你在团战里要站得离她近，让她只能拉你。<\/li><li><strong>来源<\/strong>：BV1g1he6bErH @ 27:03<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>吕布 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打吕布」「吕布怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月克制层级：机制克我该怎么做：海月的核心是把人拉进幻境单挑。", "opp": "海月"}], "lanes": ["solo"], "tempo": "unknown", "job": "open", "motto": "素材不足，定位待采", "beats": ["刘邦", "嫦娥", "张飞", "梦奇", "盾山", "赵怀真", "黄忠"], "loses": ["王昭君", "亚连", "姬小满", "张良", "瑶", "项羽", "马可波罗"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 2, "vs": ["海月"], "beats_n": 7, "loses_n": 7, "incoming": ["亚连", "姬小满", "张良", "王昭君", "瑶", "项羽", "马可波罗"], "loses_all": ["亚连", "姬小满", "张良", "王昭君", "瑶", "项羽", "马可波罗"], "lane_names": ["对抗路"]}, {"name": "哪吒", "hue": 190, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>大招能跨图飞<\/strong>：打野没抢到龙，\"飞过去挽回一点损失\"（BV1j64y1e79q @ 00:53~00:59）；带线被马可包过来时\"直接开大飞另一头\"（BV1j64y1e79q @ 02:33~02:38）<\/li><li><strong>带线与支援是一体的<\/strong>：\"技能给到对面攻击，又能跟得上队友的节奏\"（BV1j64y1e79q @ 01:25~01:29）<\/li><li><strong>二技能用来拉扯<\/strong>：对孙策\"二技能拉扯一下\"，他追上来时\"倒二技能拉扯，躲他一技能\"（BV1j64y1e79q @ 00:22~00:25、00:39~00:44）<\/li><li><strong>红 Buff 是留人手段<\/strong>：杀掉马可后身上有红 Buff，\"这个孙策也走不掉\"（BV1j64y1e79q @ 00:59~01:03）<\/li><li><strong>跟位移要等对方先交<\/strong>：\"留意二技能，等他交完位移跟上\"（BV1j64y1e79q @ 01:03~01:04）<\/li><li><strong>带线后要靠草丛消视野<\/strong>：清完兵线\"找个草丛一躲\"，把两路视野分出去管（BV1j64y1e79q @ 01:51~01:56）<\/li><\/ol>", "sum": "大招能跨图飞：打野没抢到龙，\"飞过去挽回一点损失\"（BV1j64y1e79q @ 00:53~00:59）；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>对孙策：不跟他打<\/strong>。孙策抢二能单杀，所以尽可能不接战，清完线就走，用二技能拉扯（BV1j64y1e79q @ 00:15~00:25）<\/li><li><strong>先确认草丛<\/strong>：看孙策在不在草里，他漏了、不跟我们打，就先把线清掉（BV1j64y1e79q @ 00:25~00:32）<\/li><li><strong>他追就拉扯<\/strong>：倒二技能拉开，躲掉他一技能（BV1j64y1e79q @ 00:39~00:44）<\/li><li><strong>带线时不要被抓<\/strong>：清完兵线找草丛躲，注意两路视野（BV1j64y1e79q @ 01:47~01:56）<\/li><li><strong>被包就飞走<\/strong>：马可包过来时直接开大飞另一头（BV1j64y1e79q @ 02:29~02:38）<\/li><li><strong>大后期拉视野<\/strong>：23 分钟躲在中路二塔草丛里拉对面视野，因为对面都有奔狼、就想抓哪吒（BV1j64y1e79q @ 02:53~03:05）<\/li><li><strong>被多人抓时<\/strong>：一个人在带线，他们来抓，就直接往另一头飞（BV1j64y1e79q @ 03:11~03:13）<\/li><li><strong>对面人走了再清线<\/strong>：把这波线清掉；中路打不起来就清线，清完不着急，等队友过来再去下路（BV1j64y1e79q @ 03:15~03:31）<\/li><\/ul>", "sum": "对孙策：不跟他打。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖连招细节，只有零散操作片段：<\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>抢龙失败止损<\/strong><\/td><td>直接飞过去参团，杀掉马可后靠红 Buff 留住孙策<\/td><td>BV1j64y1e79q @ 00:53~01:03<\/td><\/tr><tr><td><strong>带线被包<\/strong><\/td><td>开大飞另一头<\/td><td>BV1j64y1e79q @ 02:33~02:38<\/td><\/tr><tr><td><strong>跟人<\/strong><\/td><td>等对方交完位移再跟上<\/td><td>BV1j64y1e79q @ 01:03~01:04<\/td><\/tr><tr><td><strong>开团卖身<\/strong><\/td><td>有复活甲时开奔狼上前吃技能，让队友收割<\/td><td>BV1j64y1e79q @ 03:51~03:58<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "素材未覆盖连招细节，只有零散操作片段："}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>龙团止损<\/strong>：打野没抢到龙，飞上去带着队友打了一波一换四，\"不是很亏\"（BV1j64y1e79q @ 00:56~01:19）<\/li><li><strong>跟团要跟到底<\/strong>：东皇开团就跟上去，\"没有回头箭，只能硬着脸上一上\"，强行打了一波二换二，把对面的状态和技能打掉（BV1j64y1e79q @ 02:01~02:15）<\/li><li><strong>关键节点是龙<\/strong>：自己死掉风暴龙王就白给对面，\"很可能输掉这把比赛\"（BV1j64y1e79q @ 02:39~02:44）<\/li><li><strong>23 分钟后的处理<\/strong>：躲中路二塔草丛拉视野 → 对面扑空 → 清线 → 等队友集合再转下路（BV1j64y1e79q @ 02:53~03:31）<\/li><li><strong>最后一波<\/strong>：对面开奔狼、位置不好，自己有复活甲就上去卖一波吃技能，打出西施大招和曹操大招，队友收割拿下比赛（BV1j64y1e79q @ 03:51~04:10）<\/li><li><strong>推塔<\/strong>：团赢后可以推对面下路二塔（BV1j64y1e79q @ 01:40~01:45）<\/li><\/ul>", "sum": "龙团止损：打野没抢到龙，飞上去带着队友打了一波一换四，\"不是很亏\"（BV1j64y1e79q @ 00:56~01:19）跟团要跟到底：东皇开团就跟上去，\"没有回头箭，只能硬着脸上一上\"，强行…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li>素材明确说\"哪吒是什么样的出装和铭文，下一个视频为大家揭晓\"（BV1j64y1e79q @ 04:17~04:24）<\/li><li>正文里只出现过两条装备线索：身上有红 Buff（BV1j64y1e79q @ 00:59~01:01）、\"我有复活甲\"（BV1j64y1e79q @ 03:54~03:56）<\/li><li>完整出装未覆盖。<\/li><\/ul>", "sum": "素材明确说\"哪吒是什么样的出装和铭文，下一个视频为大家揭晓\"（BV1j64y1e79q @ 04:17~04:24）正文里只出现过两条装备线索：身上有红 Buff（BV1j64y1e79q @…"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/180.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>后羿<\/strong><\/td><td>发育路<\/td><td>“后羿：后羿作为无位移的射手，极度依赖队友保护，而哪吒大招可以做到团战时无视后羿队友直接冲…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>杨玉环<\/strong><\/td><td>打野／中路<\/td><td>“对于基本处于后排的治疗型辅助，哪吒可以轻易的开启近身作战，其自带的降低治疗，也会让杨玉环…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>桑启<\/strong><\/td><td>游走<\/td><td>“减回复”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>程咬金<\/strong><\/td><td>对抗路<\/td><td>“程咬金：程咬金一般作为骚扰后排的存在，哪吒的被动有效的反制敌方程咬金对己方ADC，AP的…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>张良<\/strong><\/td><td>中路／游走<\/td><td>“张良的大招效果可以无视哪吒的大招韧性效果”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>老夫子<\/strong><\/td><td>对抗路<\/td><td>“哪吒：哪吒有一个核心玩法是41分推，既能牵制敌方英雄又可以及时支援战场，带线推进让人防不…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>貂蝉<\/strong><\/td><td>对抗路／中路<\/td><td>“貂蝉能在躲避技能同时很好的风筝哪吒”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：刘邦、太乙真人<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/180.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "unknown", "job": "split", "motto": "玩好哪吒这个英雄需要做到带线支援", "beats": ["后羿", "杨玉环", "桑启", "程咬金"], "loses": ["张良", "老夫子", "貂蝉"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 4, "loses_n": 3, "incoming": ["张良", "老夫子", "貂蝉"], "loses_all": ["张良", "老夫子", "貂蝉"], "lane_names": ["对抗路"]}, {"name": "大乔", "hue": 245, "a": [{"id": "K-A31", "cat": "A", "title": "大乔的核心连招是\"一三接大招\"，不是单纯保人", "self": "<h3><a class=\"kref\" href=\"#K-A31\">K-A31<\/a> 大乔的核心连招是\"一三接大招\"，不是单纯保人<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要打一波有准备的团<\/li><li><strong>判断依据<\/strong>：队友是否跟得上（在附近、血量健康）<\/li><li><strong>决策分支<\/strong>：一技能 + 三技能打出控制与位移 → <strong>立刻接大招<\/strong>把人拉进战场 → 二技能留给自己或残血队友撤<\/li><li><strong>反例<\/strong>：「大乔就是奶妈，跟着 C 位跑」——她的收益来自调动，不是治疗。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 04:56；BV1M81kYpEPE @ 08:14（\"放一三连招，接大给队友加个盾传过来\"）<\/li><li><strong>可信度<\/strong>：高（两个不同 UP 一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要打一波有准备的团判断依据：队友是否跟得上（在附近、血量健康）决策分支：一技能 + 三技能打出控制与位移 → 立刻接大招把人拉进战场 → 二技能留给自己或残血队友撤反例：「大乔就是奶…"}, {"id": "K-A32", "cat": "A", "title": "逆风局：断兵线拖发育，团战能接就接", "self": "<h3><a class=\"kref\" href=\"#K-A32\">K-A32<\/a> 逆风局：断兵线拖发育，团战能接就接<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方逆风、对面在推塔<\/li><li><strong>判断依据<\/strong>：能否用二技能回家 + 传送反复截掉对面兵线<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面在推 → 断线、拖节奏、等队友复活<\/li><li>队友开团了 → <strong>能接就一定要接<\/strong>（人数差团战是逆风翻盘的唯一机会）<\/li><li><strong>反例<\/strong>：「逆风就守塔」——守塔是等死，断线才是把时间买回来。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 04:40；@ 04:51<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：己方逆风、对面在推塔判断依据：能否用二技能回家 + 传送反复截掉对面兵线决策分支：对面在推 → 断线、拖节奏、等队友复活队友开团了 → 能接就一定要接（人数差团战是逆风翻盘的唯一机会…"}, {"id": "K-A33", "cat": "A", "title": "大招前先\"勾引\"：让对面先上", "self": "<h3><a class=\"kref\" href=\"#K-A33\">K-A33<\/a> 大招前先\"勾引\"：让对面先上<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方人多、对面犹豫<\/li><li><strong>判断依据<\/strong>：对面有没有开团意图/强行进圈<\/li><li><strong>决策分支<\/strong>：先露一个身位把对面引进来 → 圈放好 → 大招把队友拉过来 → 反打<\/li><li><strong>来源<\/strong>：BV1M81kYpEPE @ 04:37（\"这个就是大招的一个勾引节奏\"）；@ 08:49（\"勾引一下再进圈\"）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A34\">K-A34<\/a> 开局：别跟射手，先帮中路抢线 + 做视野<\/h3>\n<p>这条是<strong>游走位的通用开局排序<\/strong>（「野→边→射→中」），不是大乔特有，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>，判据原表在 <code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>。<\/p>", "sum": "这条是游走位的通用开局排序（「野→边→射→中」），不是大乔特有，已迁到 L_分路/02_游走.md 的 K-L12，判据原表在 K-D08。"}, {"id": "K-A35", "cat": "A", "title": "圈要放在身后，靠\"拉扯\"活着", "self": "<h3><a class=\"kref\" href=\"#K-A35\">K-A35<\/a> 圈要放在身后，靠\"拉扯\"活着<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：团战中持续输出阶段<\/li><li><strong>判断依据<\/strong>：自己的身位是否被对面突进够到<\/li><li><strong>决策分支<\/strong>：把圈放到队伍后方 → 边打边退 → 用二技能回血回蓝再进场<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 07:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>4. 最容易崩的地方<\/h2>\n<ol><li><strong>大招当传送门用<\/strong>：开大是为了打团，不是为了\"人到齐了\"。没有后续动作的大招就是白送 CD。<\/li><li><strong>跟射手走<\/strong>：等于把自己的地图影响力砍掉一半。<\/li><li><strong>不看对面绕后位<\/strong>：对面强开团辅助大概率在绕后，大乔必须先把那个人探出来（原话：\"我们把他辅助探出来\"）。<\/li><\/ol>\n<h2>5. 待补<\/h2>\n<ul><li>极影流的适用条件、S45 出装数值调整。<\/li><li>二技能回血/冷却精确数值。<\/li><li>与苏烈的对位思路已有实战片段（BV14VuVzWEBE @ 01:44：站左侧小草帮射手拆火），可整理进 <code>B_克制关系/<\/code>。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>别「大圈套小圈」<\/strong>：传过去满血又被传回家。<\/li><li><strong>回血圈靠墙放防被推出去<\/strong>：但<strong>圈心不能落进墙体<\/strong>，否则会被卡到别的位置。<\/li><li><strong>一三技能打准了再摇大<\/strong>：否则人早跑了。<\/li><li><strong>血量回到约 4/3 时点大招基本满血归位<\/strong>：这是回城的时机阈值。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>\n<h2>扩展素材（候选·外部）<\/h2>\n<blockquote><p>以下视频标题确认与本英雄相关，但 B 站未提供可用字幕（幽灵字幕），正文未提炼。待转写后核实。<\/p><\/blockquote>\n<ul><li><a href=\"https://www.bilibili.com/video/BV19r4y1V7M9\">普通大乔玩家都会犯的四个错误<\/a><\/li><li><a href=\"https://www.bilibili.com/video/BV1pvJJzfENr\">大乔等于5个杨玉环？科研无解法爆流<\/a><\/li><\/ul>", "sum": "以下视频标题确认与本英雄相关，但 B 站未提供可用字幕（幽灵字幕），正文未提炼。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/191.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>墨子<\/strong><\/td><td>中路／游走<\/td><td>“墨子：墨子释放关键大招时，大乔可以用1技能和3技能进行打断，配合队友集火击杀。墨子是消耗…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>孙策<\/strong><\/td><td>对抗路／打野<\/td><td>“孙策有强势的支援能力但是没大乔快，大乔能够将被孙策强行控住的英雄传送回城保全其性命”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>露娜<\/strong><\/td><td>打野<\/td><td>“露娜：露娜的技能衔接是非常关键的，在露娜即将释放技能的时候利用沉默可以有效的打断露娜的技…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>阿轲<\/strong><\/td><td>打野<\/td><td>“阿轲的快速收割能力很容易在法阵消失之前就击杀掉友军”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>韩信<\/strong><\/td><td>打野<\/td><td>“韩信的高机动和爆发让大乔的技能很难起到关键作用”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：狄仁杰、花木兰<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/191.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B27", "cat": "B", "title": "对廉颇：长手法辅打短手硬辅，你是优势方", "self": "<h3><a class=\"kref\" href=\"#K-B27\">K-B27<\/a> 对廉颇：长手法辅打短手硬辅，你是优势方<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：廉颇<\/li><li><strong>克制层级<\/strong>：机制克<\/li><li><strong>我该怎么做<\/strong>：廉颇的所有技能都要近身才有效。你只要保持在他技能范围外，他就永远是挨打的一方。用一三技能消耗、二技能把人推开，不要为了省蓝去贴他。<\/li><li><strong>反向反制<\/strong>：廉颇的位移+控制一旦接上，大乔是脆的。所以宁可多退一步，也别站在他能冲到的地方。<\/li><li><strong>来源<\/strong>：BV1ngLQ6HED4 @ 00:11<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>大乔 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打大乔」「大乔怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：廉颇克制层级：机制克我该怎么做：廉颇的所有技能都要近身才有效。", "opp": "廉颇"}], "lanes": ["roam"], "tempo": "mid", "job": "open", "motto": "摇人不是救人，是把人数差搬到任何一个点", "beats": ["墨子", "孙策", "露娜"], "loses": ["阿轲", "韩信"], "main_lane": "roam", "type": "辅助", "unlisted": false, "n": 5, "b_n": 2, "vs": ["廉颇"], "beats_n": 3, "loses_n": 2, "incoming": ["阿轲", "韩信"], "loses_all": ["阿轲", "韩信"], "lane_names": ["游走"]}, {"name": "姬小满", "hue": 44, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>二跳免伤 60%<\/strong>：二技能第二段跳起时自带大额免伤，是进场硬吃伤害的资本（BV1HB42167Ar @ 10:21）<\/li><li><strong>一二技能 CD 极短、循环快<\/strong>：打完一套\"先等一下我们一二技能 CD\"再决定下一步（@ 04:14）——技能好才有资格接对拼，技能没好就是白板<\/li><li><strong>一二连段的收尾可以存位移<\/strong>：\"我一二最后一下不是有个动机吧，那个总击他是可以保存下来\"——A 小兵靠近，然后再 E 过去（@ 03:12）<\/li><li><strong>大招是斩杀威慑<\/strong>：有大的姬小满 E 闪可以直接秒人（@ 01:30）；对面\"没大招等于\"没威胁，可以带着队友越塔（@ 04:32）<\/li><li><strong>炮兵是位移跳板<\/strong>：\"加强姬小满这波在利用这个炮兵靠近\"（@ 04:55）——用兵线单位当二技能的起跳点接近目标<\/li><\/ol>", "sum": "二跳免伤 60%：二技能第二段跳起时自带大额免伤，是进场硬吃伤害的资本（BV1HB42167Ar @ 10:21）一二技能 CD 极短、循环快：打完一套\"先等一下我们一二技能 CD\"再决定下一…"}, {"id": "", "cat": "", "title": "2. 对线：打司空震的完整流程", "self": "<h3>2. 对线：打司空震的完整流程<\/h3>", "html": "<ul><li><strong>出门装<\/strong>：买抗魔披风 + 陨星，\"在塔底下瑟瑟发抖\"（BV1HB42167Ar @ 00:05）<\/li><li><strong>前期不要抢线<\/strong>：\"前期不要抢线\"（@ 02:17），等对面对拼欲望交出来再打<\/li><li><strong>卡线是核心战术<\/strong>：把兵线卡在塔前关键位，\"就因为我的兵线卡在这个位置，他完全玩不了\"（@ 01:42）——对面打野和边路\"一点事情都不敢干\"（@ 01:38）<\/li><li><strong>抓对面打野去中路的空档<\/strong>：先慢慢等对面打野走，然后先一技能抓一下打出大招，再大一二收（@ 01:52）<\/li><li><strong>连人带兵一起打升四<\/strong>：\"1212，连人带兵一起打的时候升到四级，然后就一脚二一把他踹死\"（@ 02:09）<\/li><li><strong>中立资源必抢<\/strong>：\"咱们现在尽量把动力之源全吃了\"，对面空间优势和大招冷却不能给（@ 02:27）<\/li><li><strong>没大招就不接<\/strong>：一、二技能 CD 没好时等（@ 04:14）；一技能抓不到就交给队友（@ 03:06）<\/li><\/ul>", "sum": "出门装：买抗魔披风 + 陨星，\"在塔底下瑟瑟发抖\"（BV1HB42167Ar @ 00:05）前期不要抢线：\"前期不要抢线\"（@ 02:17），等对面对拼欲望交出来再打卡线是核心战术：把兵线卡…"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>对线换血/斩杀<\/td><td><strong>1A 2 1 2 3 1A 二<\/strong>（1A21231A）<\/td><td>BV1HB42167Ar @ 05:11<\/td><\/tr><tr><td>升四爆发<\/td><td><strong>1-2-1-2 连人带兵一起打<\/strong><\/td><td>BV1HB42167Ar @ 02:09<\/td><\/tr><tr><td>抓单起手<\/td><td><strong>先一技能抓一下 → 打出大招 → 大一二<\/strong><\/td><td>BV1HB42167Ar @ 01:58<\/td><\/tr><tr><td>追击残血<\/td><td><strong>211 脚踹死 / 二闪加一加大<\/strong><\/td><td>BV1HB42167Ar @ 06:24、@ 12:17<\/td><\/tr><tr><td>借兵进场<\/td><td>A 小兵靠近 → E 过去（一二收尾位移存着用）<\/td><td>BV1HB42167Ar @ 03:19<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景连招依据对线换血/斩杀1A 2 1 2 3 1A 二（1A21231A）BV1HB42167Ar @ 05:11升四爆发1-2-1-2 连人带兵一起打BV1HB42167Ar @ 02:0…"}, {"id": "", "cat": "", "title": "4. 中后期/节奏", "self": "<h3>4. 中后期/节奏<\/h3>", "html": "<ul><li><strong>优势期保发育不浪<\/strong>：\"咱们现在不要死，把中立资源吃了，抢个线权就可以了\"（BV1HB42167Ar @ 03:56）<\/li><li><strong>大招没好就声明不接团<\/strong>：对局里反复喊\"他没有想法的话咱们继续跟牢大玩\"——用对线牵制代替强行开团（@ 04:37）<\/li><li><strong>团战保后排打<\/strong>：\"保到后排打，不用着急，在后排打野战都不需要散大招，没有大招的情况下你保后排打就可以了\"（@ 12:02）<\/li><li><strong>被埋伏先想退路<\/strong>：A 塔前先确认对面孙策大招位置，\"我 A 塔进那个位置我过不去啊\"（@ 07:03）<\/li><\/ul>", "sum": "优势期保发育不浪：\"咱们现在不要死，把中立资源吃了，抢个线权就可以了\"（BV1HB42167Ar @ 03:56）大招没好就声明不接团：对局里反复喊\"他没有想法的话咱们继续跟牢大玩\"——用对线…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p>素材只覆盖了<strong>对线期小件<\/strong>：抗魔披风 + 陨星（打司空震出门装，BV1HB42167Ar @ 00:05）、布甲（UP 自述买错后调整，@ 02:19）。完整出装铭文素材未覆盖，见待补。<\/p>", "sum": "素材只覆盖了对线期小件：抗魔披风 + 陨星（打司空震出门装，BV1HB42167Ar @ 00:05）、布甲（UP 自述买错后调整，@ 02:19）。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/564.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>吕布<\/strong><\/td><td>对抗路<\/td><td>“小满的灵活走位可以轻松躲过吕布的附魔，从而在对抗中获得优势”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>马超<\/strong><\/td><td>对抗路／打野<\/td><td>“马超的机动性优势在小满的组合技中较难发挥，同时小满的输出可以较轻松击败马超”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>刘备<\/strong><\/td><td>打野<\/td><td>“刘备的近战能力让小满较难发挥”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>夏侯惇<\/strong><\/td><td>对抗路／打野<\/td><td>“夏侯惇的多段控制可以干扰小满的组合技，同时较高的坦度可以压制小满的输出”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鬼谷子、鲁班大师<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/564.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "early", "job": "open", "motto": "二跳的时候是有60%免伤的", "beats": ["吕布", "马超"], "loses": ["刘备", "夏侯惇"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 2, "incoming": ["刘备", "夏侯惇"], "loses_all": ["刘备", "夏侯惇"], "lane_names": ["对抗路"]}, {"name": "娜可露露", "hue": 19, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>大招（鹰）是打肉的根<\/strong>：鹰是\"拥有AD成长的百分比最大生命值伤害\"，还\"吃破军这些东西\"（BV1Z1br69EAh @ 04:41~04:49）；\"一个后期的坦克吃他两下都有点遭不住\"（BV1Z1br69EAh @ 04:49），因此被称作\"唯一一个能打动肉的刺客了\"（BV1Z1br69EAh @ 04:53）。<\/li><li><strong>一套打完没有后续<\/strong>：黑切前\"一套技能打不到差不多一半\"，\"打完一套又没有什么后续的情况下 其实还挺难顶的\"（BV1Z1br69EAh @ 01:03~01:08）；对拼逻辑因此是\"打技能一套打不完人的话就得撤的\"（BV1Z1br69EAh @ 05:33）。<\/li><li><strong>控制不是她的强项<\/strong>：\"他控制也没有机制 不算优秀\"（BV1Z1br69EAh @ 06:17）。<\/li><li><strong>吃红蓝 Buff、吃 CD<\/strong>：\"这英雄真的很吃这个红蓝Buff\"（BV1Z1br69EAh @ 05:54）；黑切之后要\"接这个黑切满CD\"（BV1Z1br69EAh @ 05:58）。<\/li><li><strong>蓝耗高，红开是为留住蓝 Buff<\/strong>：\"如果我红开留着蓝Buff去打架的话 那至少保证我打着打着蓝不会掉\"；蓝开则身上只剩红，\"那没技能了的话不就炸了吗\"（BV1Z1br69EAh @ 07:28~07:40）。<\/li><li><strong>上限不高<\/strong>：\"这英雄上限本来就不是很高\"（BV1Z1br69EAh @ 02:09）；\"打起来的时候如果没有经济做支撑 真的就看着都很尴尬\"（BV1Z1br69EAh @ 06:20）。<\/li><\/ol>", "sum": "大招（鹰）是打肉的根：鹰是\"拥有AD成长的百分比最大生命值伤害\"，还\"吃破军这些东西\"（BV1Z1br69EAh @ 04:41~04:49）；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>红开、从下往上刷<\/strong>：\"红开往上刷 因为蒙恬这个英雄肯定是需要打2V2的\"（BV1Z1br69EAh @ 00:25~00:27）；蓝耗高是红开的第二个理由（BV1Z1br69EAh @ 07:28）。<\/li><li><strong>开局先蹭线再控野<\/strong>：\"这里不仅蹭到兵线 还直接把这个小野怪给抢到了 已经是非常胡的开局了\"（BV1Z1br69EAh @ 00:35）；对面来人时\"把小野稍微往后拉一下 橘子不会贸然冲进来的\"，就能稳稳控下（BV1Z1br69EAh @ 00:45）。<\/li><li><strong>第二轮野区刷新前把资源吃满<\/strong>：上路河道之灵、下路小野、上路兵线都蹭，\"相当于就经济最大化了\"（BV1Z1br69EAh @ 01:12）；\"优势都是一点一点建立起来的\"（BV1Z1br69EAh @ 01:21）。<\/li><li><strong>抢中、占中视野<\/strong>：\"玩打野一定要频繁的去抢中路\"，占住中路视野\"会影响到对面中单的一些转线\"，\"主要是给全队提速\"（BV1Z1br69EAh @ 01:23~01:38）。<\/li><li><strong>上路没机会就立刻转中<\/strong>：\"这个线被推回去了 就直接果断转中路去 不浪费时间\"（BV1Z1br69EAh @ 02:36）。<\/li><li><strong>用对面交掉的闪现做下一步决策<\/strong>：上波已打掉后羿闪现，清完小猪\"正常来说是要刷这个红的\"，但发现对面还在前压，\"正好咱红还没刷 先去干他一波\"，随后收下一血（BV1Z1br69EAh @ 03:12~03:25）。<\/li><li><strong>偷对面小野<\/strong>：\"一定要学会去偷对面小野啊 经济差都是这样滚起来的\"（BV1Z1br69EAh @ 03:38）。<\/li><li><strong>正面抓不到人，靠蹲草和卡视野<\/strong>：很多波机会\"都是通过蹲草啊 或者是去卡视野什么之类的\"（BV1Z1br69EAh @ 08:11~08:14）。<\/li><li><strong>不贪残血人头<\/strong>：放掉元歌\"果断奔着后羿去\"，这一点\"就值得大家学习\"（BV1Z1br69EAh @ 04:07~04:10）。<\/li><li><strong>别硬抓<\/strong>：\"你不刷钱 非要硬抓 抓不死人 把自己整死两波 这个游戏就玩不了了\"（BV1Z1br69EAh @ 06:06~06:09）。<\/li><li><strong>野区被反就失去游戏<\/strong>：\"对面无限进你野区 你就没法玩了\"（BV1Z1br69EAh @ 02:13）。<\/li><li><strong>越塔要先算防御塔减伤<\/strong>：\"在越塔前期 这玩意的输出量在防御塔减伤的加持之下 没有你想的那么多\"（BV1Z1br69EAh @ 10:39~10:44）。<\/li><li><strong>惩戒可以留<\/strong>：\"如果不是队友马上打起来特别赶时间 惩戒可以留一下的\"，可能刚好反掉对面小野（BV1Z1br69EAh @ 10:14~10:17）。<\/li><li><strong>她几乎没有速刷技巧<\/strong>：\"相比很多英雄 他没有什么速刷技巧\"，只要\"二技能都别丢歪\"；一技能丢成丝血会导致\"回收不了CD\"（BV1Z1br69EAh @ 09:42~09:51）。<\/li><\/ul>", "sum": "红开、从下往上刷：\"红开往上刷 因为蒙恬这个英雄肯定是需要打2V2的\"（BV1Z1br69EAh @ 00:25~00:27）；"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖连招细节。全文只出现两个散点：刷野时\"二技能起手 后面慢慢刷就好了\"（BV1Z1br69EAh @ 09:38）；团战收人头用大招\"一屁股坐死\"（BV1Z1br69EAh @ 04:36）。没有给出任何技能顺序。<\/p>", "sum": "素材未覆盖连招细节。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>顺风没有秒不掉的人<\/strong>：经济优势够大时\"野区随便转三路都是优势的\"（BV1Z1br69EAh @ 04:33），\"一个顺风的鸟人 没有谁秒不了\"，连\"开大的铠也是一屁股坐死\"（BV1Z1br69EAh @ 04:36~04:41）。<\/li><li><strong>顺风收尾靠龙团<\/strong>：\"有优势的情况下 10分钟龙团一拿下的话 就直接大火收汁了\"（BV1Z1br69EAh @ 07:00~07:02）。<\/li><li><strong>逆风只能一换一<\/strong>：\"军事逆风的时候 只能说换掉一个或者是打出像样的输出\"（BV1Z1br69EAh @ 06:29~06:31）。<\/li><li><strong>崩盘是一条链<\/strong>：先一波团打崩，接着\"野区就被反了\"，红区被清、\"这个龙经济被滚得特别大\"，最后\"一个蓝一个红都拿不到了 直接就烂完了\"（BV1Z1br69EAh @ 01:57~02:07）。<\/li><li><strong>后期节奏是刷钱 + 带边 + 偶尔抓单<\/strong>：\"后面刷刷钱再带边线 偶尔抓刷单就差不多就这么结束了\"（BV1Z1br69EAh @ 08:28~08:31）。<\/li><li><strong>破军是分水岭<\/strong>：对韩信那局\"鸟人这时候破军出来的话 我感觉就胜负已分了\"（BV1Z1br69EAh @ 08:54~08:56）。<\/li><\/ul>", "sum": "顺风没有秒不掉的人：经济优势够大时\"野区随便转三路都是优势的\"（BV1Z1br69EAh @ 04:33），\"一个顺风的鸟人 没有谁秒不了\"，连\"开大的铠也是一屁股坐死\"（BV1Z1br69E…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>黑切<\/strong>是伤害分水岭：出之前\"战斗力并不是很强\"，出之后\"可算有伤害了 一屁股下去就差不多丝血了\"（BV1Z1br69EAh @ 05:50~05:52）。<\/li><li><strong>破军<\/strong>：与鹰的最大生命值伤害联动（BV1Z1br69EAh @ 04:47），出完后对拼\"胜负已分\"（BV1Z1br69EAh @ 08:54）。<\/li><li><strong>黑切 + 满 CD<\/strong> 是主播给出的组合方向（BV1Z1br69EAh @ 05:58）。<\/li><li>铭文、鞋、以及黑切与破军之外的完整出装顺序<strong>均未覆盖<\/strong>。<\/li><\/ul>", "sum": "黑切是伤害分水岭：出之前\"战斗力并不是很强\"，出之后\"可算有伤害了 一屁股下去就差不多丝血了\"（BV1Z1br69EAh @ 05:50~05:52）。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/162.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>后羿<\/strong><\/td><td>发育路<\/td><td>“后羿：后羿作为无位移的射手，极易被游走的娜可露露gank，灵巧的娜可露露可以躲开其控制并…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>姜子牙<\/strong><\/td><td>中路／游走<\/td><td>“娜可露露的切入能力极强，姜子牙容易被接近和击败。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>干将莫邪<\/strong><\/td><td>中路<\/td><td>“干将莫邪：干将莫邪的机动性很差，且惧怕贴脸英雄，并且由于射程较远，所以位置极易落单。此时…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>明世隐<\/strong><\/td><td>游走<\/td><td>“明世隐不擅长开视野，容易被爆发型英雄埋伏一波输出”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>张良<\/strong><\/td><td>中路／游走<\/td><td>“张良的硬控能控住娜可露露将其击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>项羽<\/strong><\/td><td>对抗路／游走<\/td><td>“娜可露露进场后，项羽可选择将其推开或控制限制其输出”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：钟馗、白起<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/162.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["jungle"], "tempo": "late", "job": "scout", "motto": "他后期很强，前中期其实反而无所谓", "beats": ["后羿", "姜子牙", "干将莫邪", "明世隐"], "loses": ["张良", "项羽"], "main_lane": "jungle", "type": "刺客", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 4, "loses_n": 2, "incoming": ["张良", "项羽"], "loses_all": ["张良", "项羽"], "lane_names": ["打野"]}, {"name": "嬴政", "hue": 19, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>法师定位，但没有常规法师的稳定输出<\/strong>：\"虽然嬴政是一个法师的定位，但并不具备常规法师更稳定的输出能力\"，打团时\"只是一个炮台法师，去靠技能压对面血线\"（BV19uSTBPEux @ 00:08~00:18）<\/li><li><strong>技能撑不起输出<\/strong>：\"技能伤害不算高\"，而且\"对面也不傻，技能伤害一般打不满多少\"，\"没技能就只能平A输出\"（BV19uSTBPEux @ 00:19~00:26）<\/li><li><strong>普攻是纯法伤且吃暴击，所以能走平 A 流<\/strong>：\"嬴政的普攻是纯法伤\"，加成里含\"35%\"与\"AP加固定额外数值\"，\"加成部分可享受暴击收益\"，\"所以完全能出[物理]装去打平A流，不会被系统判定为乱出装\"（BV19uSTBPEux @ 00:26~00:37，转写此处把物理装记成了\"L装\"）<\/li><li><strong>射程是核心资产<\/strong>：面板\"索敌范围仅有600码\"，但\"实际普攻的飞剑伤害范围有1050码\"，\"甚至嬴政的射程比伽罗开弓还逐日的射程都远\"（BV19uSTBPEux @ 00:39~00:51）<\/li><li><strong>平 A 是贯穿伤害<\/strong>：\"在射手里面也算独一档了\"（BV19uSTBPEux @ 00:51~00:53）<\/li><li><strong>飞剑方向吃轮盘<\/strong>：\"平A飞剑打出去的方向受轮盘影响\"，\"实战中需要不断用轮盘面朝敌方英雄位置\"，\"平A普攻才有可能能造成伤害\"（BV19uSTBPEux @ 00:55~01:03）<\/li><li><strong>二技能是保命核心<\/strong>：自身加速 + 获得护盾，\"被命中的敌方额外物攻会直接被清空几秒\"，所以\"嬴政相比其他射手不那么怕突脸\"（BV19uSTBPEux @ 03:55~04:05）<\/li><li><strong>但二技能的常驻移速救不了笨重<\/strong>：\"虽然二技能拥有常驻移速，但是还是太呆了，打灵活阵容还是够呛\"（BV19uSTBPEux @ 03:31~03:37）<\/li><li><strong>大招定位是压血与清线<\/strong>：\"四级后开大压对面状态\"（BV19uSTBPEux @ 01:28）；\"只要开了大招，就算路边的狗也得吃我几把飞剑\"（BV19uSTBPEux @ 01:34~01:37）<\/li><\/ol>", "sum": "法师定位，但没有常规法师的稳定输出：\"虽然嬴政是一个法师的定位，但并不具备常规法师更稳定的输出能力\"，打团时\"只是一个炮台法师，去靠技能压对面血线\"（BV19uSTBPEux @ 00:08~…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>开局就卡极限距离清线<\/strong>：兵线还没交汇，\"极限距离提前平A，1技能扔到后两个兵线上\"，再\"平A贯穿打三兵\"（BV19uSTBPEux @ 01:15~01:20）<\/li><li><strong>清兵顺带消耗<\/strong>：\"清兵的同时消耗对面状态\"（BV19uSTBPEux @ 01:23~01:25）<\/li><li><strong>基础数值高，清线刷野都快<\/strong>（BV19uSTBPEux @ 01:25~01:27）<\/li><li><strong>四级是大招节点<\/strong>：开大压状态、顺手清线（BV19uSTBPEux @ 01:28~01:30）<\/li><li><strong>清完就转线吃钱<\/strong>：\"配合一技能快速清线，然后转线去吃更多的经济\"（BV19uSTBPEux @ 01:37~01:39）<\/li><li><strong>不怕被卡线<\/strong>：\"发育路嬴政的好处就是不怕被卡线\"，\"哪怕我们出了[物理]装大招伤害，一般对面也会下意识的去躲我们大招的伤害\"（BV19uSTBPEux @ 01:51~01:58）<\/li><li><strong>对面压太实就放<\/strong>：\"当然如果对面压的太实，那还是放掉吧\"（BV19uSTBPEux @ 02:01~02:03）<\/li><li><strong>认清自己是呆射<\/strong>：\"我们没有位移，所以算是个呆射\"；原则是\"活着才有输出\"（BV19uSTBPEux @ 02:42~02:47）<\/li><li><strong>顺手帮打野提速<\/strong>：\"打野刷野慢，可以帮他提速\"（BV19uSTBPEux @ 01:45~01:46）<\/li><li><strong>打团顺序<\/strong>：队友先上去吃技能→自己再进场；\"上去A的差不多了，对面跑的太远也A不到，最后用大招收尾收割\"（BV19uSTBPEux @ 03:04~03:16）<\/li><li><strong>推塔可以边推边打<\/strong>：\"只要敢和水晶或防御塔站一条直线，我们完全可以一边推塔一边打赢\"（BV19uSTBPEux @ 04:34~04:37）<\/li><li><strong>打笨重阵容更强<\/strong>：\"这局对面全是那种人怪，我都能拿十几个人头，要是打那种笨重阵容只会更强\"（BV19uSTBPEux @ 04:42~04:47）<\/li><\/ul>", "sum": "开局就卡极限距离清线：兵线还没交汇，\"极限距离提前平A，1技能扔到后两个兵线上\"，再\"平A贯穿打三兵\"（BV19uSTBPEux @ 01:15~01:20）清兵顺带消耗：\"清兵的同时消耗对面…"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材没给固定技能连招，给的是\"普攻优先\"的输出顺序，按场景记：<\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招 / 顺序<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>一级清线<\/td><td>卡极限距离 → 1 技能砸后两个兵 → 平 A 贯穿三兵<\/td><td>BV19uSTBPEux @ 01:15~01:23<\/td><\/tr><tr><td>四级压血<\/td><td>开大压状态 + 1 技能清线 → 转线<\/td><td>BV19uSTBPEux @ 01:28~01:39<\/td><\/tr><tr><td>打团<\/td><td>队友先吃技能 → 平 A 输出 → 大招收尾<\/td><td>BV19uSTBPEux @ 03:04~03:16<\/td><\/tr><tr><td>无输出空间<\/td><td>没状态或 A 不到人才开大（只当消耗/收割）<\/td><td>BV19uSTBPEux @ 03:24~03:31<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "素材没给固定技能连招，给的是\"普攻优先\"的输出顺序，按场景记："}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>经济节奏<\/strong>：清线即转线，\"转线去吃更多的经济\"（BV19uSTBPEux @ 01:37~01:39）<\/li><li><strong>装备节点即强度节点<\/strong>：影刃 → 无尽，出完无尽\"一发平A有1000多法爆伤害\"（BV19uSTBPEux @ 01:51、BV19uSTBPEux @ 02:57~03:01）<\/li><li><strong>后期换装<\/strong>：\"后期鞋直接换复活甲\"（BV19uSTBPEux @ 04:05~04:07）<\/li><li><strong>跑图能力<\/strong>：\"狩猎影刃逐日二技能有大量常驻移速，没血跑的也比大部分人快\"（BV19uSTBPEux @ 04:07~04:12）<\/li><li><strong>日渊之后质变<\/strong>：\"后期出了日渊，一下能打出两发飞剑\"（BV19uSTBPEux @ 04:21~04:24）<\/li><\/ul>", "sum": "经济节奏：清线即转线，\"转线去吃更多的经济\"（BV19uSTBPEux @ 01:37~01:39）装备节点即强度节点：影刃 → 无尽，出完无尽\"一发平A有1000多法爆伤害\"（BV19uST…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p>素材给的是逐件顺序，散点如下：<\/p>\n<ol><li><strong>开局攻速鞋<\/strong>（BV19uSTBPEux @ 01:41）<\/li><li><strong>续航<\/strong>：\"两个秘法产业保证续航\"（BV19uSTBPEux @ 01:42）——口播简称，具体装备名需核对<\/li><li><strong>第一件核心影刃<\/strong>：\"我们优先和影刃而发育\"（BV19uSTBPEux @ 01:51）<\/li><li><strong>第二件无尽<\/strong>：\"出完出无尽\"（BV19uSTBPEux @ 02:57）<\/li><li><strong>吸血书<\/strong>：\"出吸血书有续航生命，兼顾一定坦度\"（BV19uSTBPEux @ 03:37~03:39）<\/li><li><strong>逐日<\/strong>：\"然后出一个逐日\"，\"配合二技能移速超级灵能，大幅提高我们的生存能力\"，\"还能增加普攻索敌范围\"（BV19uSTBPEux @ 03:40~03:50）<\/li><li><strong>最后一件法穿看对面魔抗<\/strong>：\"最后一件补法穿，敌方500魔抗以下日暮，反之虚无\"（BV19uSTBPEux @ 03:51~03:55）<\/li><li><strong>大后期<\/strong>：\"后期鞋直接换复活甲\"（BV19uSTBPEux @ 04:05）<\/li><li><strong>铭文<\/strong>：素材只有一句\"狩猎影刃逐日二技能有大量常驻移速\"（BV19uSTBPEux @ 04:07~04:12），完整铭文未覆盖<\/li><\/ol>", "sum": "素材给的是逐件顺序，散点如下："}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/110.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“王昭君：嬴政大招可以直接在王昭君大招范围外攻击王昭君，逼迫她交闪现或者断大走开，为队友击…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>白起<\/strong><\/td><td>对抗路<\/td><td>“嬴政：嬴政几乎不会进入白起的攻击范围，使得白起在面对嬴政时只能从他的队友着手”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>黄忠<\/strong><\/td><td>发育路<\/td><td>“黄忠：嬴政大招超远射程可以在黄忠大招范围外命中黄忠，逼迫他收起炮台，方便队友进行击杀，若…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“兰陵王的隐身和秒杀能力很容易接近嬴政将其秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>花木兰<\/strong><\/td><td>对抗路<\/td><td>“花木兰的超高爆发输出能力能快速击杀走位不慎的嬴政”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：墨子、白起<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/110.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["adc"], "tempo": "late", "job": "follow", "motto": "能A到人就优先平A，大招只用来消耗收割", "beats": ["王昭君", "白起", "黄忠"], "loses": ["兰陵王", "花木兰"], "main_lane": "adc", "type": "法师", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 3, "loses_n": 2, "incoming": ["兰陵王", "花木兰"], "loses_all": ["兰陵王", "花木兰"], "lane_names": ["发育路"]}, {"name": "影", "hue": 221, "a": [{"id": "", "cat": "", "title": "1. 机制内核：印记 + 二技能传导", "self": "<h3>1. 机制内核：印记 + 二技能传导<\/h3>", "html": "<ol><li><strong>一技能增强后不用叠层数<\/strong>，一二技能可以直接打出爆发——前期对线秒人全靠这个（BV1uT3v61EDr @ 00:53）<\/li><li><strong>叠多层印记的二技能是主要伤害来源<\/strong>，但影本身续航低，需要吸血装创造对拼条件（BV1hU4NefEDR @ 05:27）<\/li><li><strong>二技能单位越多回血越多<\/strong>——清三只野怪是最快回状态手段（BV1hU4NefEDR @ 01:08）<\/li><li><strong>二技能会被控制打断<\/strong>：影没霸体、没有被控反制手段；澜这类优先级更高的控制会<strong>直接中断<\/strong>二技能（BV1hU4NefEDR @ 12:00）<\/li><li><strong>大招被控时也能丢<\/strong>：开大不是怕死，是怕被控住时目标跑掉，大招同时是补伤害 + 保命键（BV1hU4NefEDR @ 12:38）<\/li><li><strong>距离博弈<\/strong>：对抗射手和中单攻击距离不占优，但打边路打野这些短手怪克制——换了血就能一直保持身位消耗（BV1hU4NefEDR @ 04:05）<\/li><\/ol>", "sum": "一技能增强后不用叠层数，一二技能可以直接打出爆发——前期对线秒人全靠这个（BV1uT3v61EDr @ 00:53）叠多层印记的二技能是主要伤害来源，但影本身续航低，需要吸血装创造对拼条件（B…"}, {"id": "", "cat": "", "title": "2. 对线：抢二级速度就是霸权", "self": "<h3>2. 对线：抢二级速度就是霸权<\/h3>", "html": "<ul><li><strong>开局买鞋走到高地再卖<\/strong>，抢先到线 A 前排兵抢二——影抢二级的速度\"对抗路应该没有人比他更快\"（BV1uT3v61EDr @ 01:10、@ 01:38）<\/li><li><strong>想单杀先做两个小铁剑<\/strong>：前期两个铁剑的强度在影身上\"尤为明显\"（BV1uT3v61EDr @ 02:44）<\/li><li><strong>残血安全抢线<\/strong>：用离对面远的前排兵叠被动，二技能传导到后排兵，补不上一技能收尾（BV1uT3v61EDr @ 02:14）<\/li><li><strong>打野位刷野细节<\/strong>：保持近距离远程平 A 刷猪，最后两三百血二技能推出来再平 A；刷单只野先进场平 A 一下，等它打你再一技能拉开（BV1hU4NefEDR @ 00:38）<\/li><li><strong>打野位开局弱点<\/strong>：影前期\"抢线和对抗能力都不够\"，打不过边野，只能放弃传送阵对抗或反向刷野（BV1m1QcYQEqg @ 00:49）<\/li><\/ul>", "sum": "开局买鞋走到高地再卖，抢先到线 A 前排兵抢二——影抢二级的速度\"对抗路应该没有人比他更快\"（BV1uT3v61EDr @ 01:10、@ 01:38）想单杀先做两个小铁剑：前期两个铁剑的强度…"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>前期秒人<\/td><td><strong>一二技能直接爆发<\/strong>（不用叠层数）<\/td><td>BV1uT3v61EDr @ 00:53<\/td><\/tr><tr><td>斩杀<\/td><td><strong>叠两下被动到斩杀线 → 二接大秒掉<\/strong><\/td><td>BV1hU4NefEDR @ 04:23<\/td><\/tr><tr><td>收割<\/td><td>一二超复杂连招（对局原话\"一个一二超复杂连招\"）<\/td><td>BV1hU4NefEDR @ 07:39<\/td><\/tr><tr><td>越塔强杀<\/td><td>可以<strong>不开大纯平 A 越塔 A 死<\/strong>（优势压制力）<\/td><td>BV1hU4NefEDR @ 08:00<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景连招依据前期秒人一二技能直接爆发（不用叠层数）BV1uT3v61EDr @ 00:53斩杀叠两下被动到斩杀线 → 二接大秒掉BV1hU4NefEDR @ 04:23收割一二超复杂连招（对局…"}, {"id": "", "cat": "", "title": "4. 中后期/节奏：单带牵制是核心玩法", "self": "<h3>4. 中后期/节奏：单带牵制是核心玩法<\/h3>", "html": "<ul><li><strong>单边线优势的放大逻辑<\/strong>：推掉二塔后每一波带线对面都\"必须去管\"，形成天然对位优势（BV1uT3v61EDr @ 04:54）；对面只能派一号位经济来管线，正面就是五打四（@ 06:46）<\/li><li><strong>达成领先位经济才能对抗领先位<\/strong>：经济不够看时继续带三线吃发育，\"带边线吃三线这样去发育，你的经济慢慢就提上来了\"（BV1uT3v61EDr @ 08:44）<\/li><li><strong>打团前抽状态<\/strong>：后期打团之前疯狂抽对面前排状态（吕布这类）\"给他抽废了\"（BV1uT3v61EDr @ 12:49）<\/li><li><strong>打野位 10 分钟前只发育<\/strong>：真正要自己执行的节奏只有 10 分钟龙点（BV1hU4NefEDR @ 06:49）；逆风时野区就是经济差，\"你少吃一组对面多吃一组，那对面就是双倍收益\"（BV1m1QcYQEqg @ 06:15）<\/li><li><strong>弱点清单<\/strong>：怕控制（无霸体，BV1hU4NefEDR @ 12:00）、打不动出布甲鞋的 ADC 和肉（@ 06:45、BV1m1QcYQEqg @ 00:35 \"影打不动肉\"）、遇到宫本这种克制单带的存在要绕着走（BV1uT3v61EDr @ 05:53）<\/li><\/ul>", "sum": "单边线优势的放大逻辑：推掉二塔后每一波带线对面都\"必须去管\"，形成天然对位优势（BV1uT3v61EDr @ 04:54）；"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>边路铭文<\/strong>：多一个隐匿还是红月\"大差不差\"，全换十狩猎也行，看个人喜好（BV1uT3v61EDr @ 03:10）<\/li><li><strong>边路出装<\/strong>：黑切和冰矛看情况换；鞋按对线换——对马超关羽先做冰矛，对司空震这类高伤害做布甲鞋 + 战斧；破魔刀可换永夜、破军可换碎星锤（BV1uT3v61EDr @ 03:25–03:58）<\/li><li><strong>打野出装<\/strong>：正常顺序<strong>先大吸血刀再大野刀<\/strong>（换血对这个英雄重要）；逆风先大野刀堆伤害和跑图；苍穹位可换锤子（这版本肉多、苍穹经常点不出来）；最后看阵容补肉——法伤多魔女、顺风爆裂（BV1hU4NefEDR @ 05:21、@ 08:24）<\/li><li><strong>对抗反甲思路<\/strong>：打不过典韦的影通常是没出穿透——这套出装有锤子（穿透）同经济基本打得过（BV1hU4NefEDR @ 11:47）<\/li><\/ul>", "sum": "边路铭文：多一个隐匿还是红月\"大差不差\"，全换十狩猎也行，看个人喜好（BV1uT3v61EDr @ 03:10）边路出装：黑切和冰矛看情况换；"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>官方详情页不存在或抓取失败（<code>herodetail/558.shtml<\/code>），这一块留空。 新英雄上线后官方常不补关系页，只能靠实测补。<\/p><\/blockquote>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "官方详情页不存在或抓取失败（herodetail/558.shtml），这一块留空。", "opp": ""}], "lanes": ["solo"], "tempo": "early", "job": "open", "motto": "这个影就是非常全能的英雄", "beats": [], "loses": [], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 0, "loses_n": 0, "incoming": [], "loses_all": [], "lane_names": ["对抗路"]}, {"name": "曹操", "hue": 222, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>一技能会连点三段<\/strong>：对手的原话是\"他不能直接点了三个一嘛\"，随后\"我突然出来 他判定到我身上去了\"（BV1p7FrekE3S @ 02:46~02:54）——说明曹操的三段一技能有判定、且会朝着目标落点走。<\/li><li><strong>威胁高度依赖大招<\/strong>：对手的处理是\"把他大招骗出来 下波再杀他\"（BV1p7FrekE3S @ 02:23~02:25），即大招在时不出手、大招空了才是击杀窗口。<\/li><li><strong>没抵抗鞋就怕控<\/strong>：对手专门确认\"他是没抵抗鞋的\"之后才继续施压（BV1p7FrekE3S @ 02:33）。<\/li><li><strong>经济落后就打不动<\/strong>：曹操 1700 经济对位对面 4000，\"因为经济差太大了\"，对手的判断是\"他们不可能打得过\"（BV1p7FrekE3S @ 03:45~03:50）。<\/li><li><strong>第一个兵被卡就很难受<\/strong>：对手的针对性打法是\"卡他第一个兵\"，\"他只要想想过来吃第一个兵 那他就死定了\"（BV1p7FrekE3S @ 01:15~01:20）。<\/li><\/ol>", "sum": "一技能会连点三段：对手的原话是\"他不能直接点了三个一嘛\"，随后\"我突然出来 他判定到我身上去了\"（BV1p7FrekE3S @ 02:46~02:54）——说明曹操的三段一技能有判定、且会朝着…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<p>以下全部是对手视角下曹操的处境，即\"曹操会遇到什么\"，不是曹操的操作指南。<\/p>\n<div class=\"tw\"><table><thead><tr><th>对手动作<\/th><th>曹操的处境<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>卡第一个兵<\/strong><\/td><td>想吃第一个兵就要挨打，\"那他就死定了\"<\/td><td>BV1p7FrekE3S @ 01:15~01:20<\/td><\/tr><tr><td><strong>断线<\/strong><\/td><td>兵线被\"直接断了\"，吃不到整波<\/td><td>BV1p7FrekE3S @ 01:32<\/td><\/tr><tr><td><strong>反红 / 反野<\/strong><\/td><td>红刷新时\"那就反个红吧\"，野区资源被拿走<\/td><td>BV1p7FrekE3S @ 01:49~01:51<\/td><\/tr><tr><td><strong>草丛卡视野<\/strong><\/td><td>\"小视野兄弟们 然后再回来\"，被卡在视野盲区里打<\/td><td>BV1p7FrekE3S @ 02:32<\/td><\/tr><tr><td><strong>骗大招<\/strong><\/td><td>大招被骗出来后，下一波才是对面的击杀点<\/td><td>BV1p7FrekE3S @ 02:23<\/td><\/tr><tr><td><strong>抓没抵抗鞋的窗口<\/strong><\/td><td>没有抵抗之靴，控到就难以脱身<\/td><td>BV1p7FrekE3S @ 02:33<\/td><\/tr><tr><td><strong>不打、只发育<\/strong><\/td><td>对面判断\"去单杀他也是没有任何意义的\"，直接放着他发育<\/td><td>BV1p7FrekE3S @ 04:59~05:03<\/td><\/tr><tr><td><strong>整条线放空<\/strong><\/td><td>\"不用去管那个曹操\"，对手转去处理中路<\/td><td>BV1p7FrekE3S @ 07:14<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>经济差是硬门槛<\/strong>：曹操 1700 时对面 4000，对手的结论是\"快他们怎么可能打得动我们呢\"（BV1p7FrekE3S @ 03:45~03:52）——曹操在被拉开两件装备后没有反打能力。<\/li><li><strong>血包归对手<\/strong>：对手\"直接吃两个血包\"（BV1p7FrekE3S @ 03:42），并且主动放弃曹操方蓝区，\"因为我们上路的塔有危险\"（BV1p7FrekE3S @ 04:25~04:28）——素材只体现对手的资源调度，曹操如何争资源未覆盖。<\/li><\/ul>", "sum": "以下全部是对手视角下曹操的处境，即\"曹操会遇到什么\"，不是曹操的操作指南。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖曹操的连招细节。唯一可提取的观察是：曹操会\"直接点了三个一\"（一技能连点三段），并且第三段的判定会落到人身上（BV1p7FrekE3S @ 02:46）。除此之外没有任何技能顺序。<\/p>", "sum": "素材未覆盖曹操的连招细节。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>经济落后即失去存在感<\/strong>：1700 对 4000 的经济差下，对手认定\"他们不可能打得过\"（BV1p7FrekE3S @ 03:45~03:50）。<\/li><li><strong>边线被放空<\/strong>：对手\"不用去管那个曹操\"，把人力转去中路（BV1p7FrekE3S @ 07:14）——说明这条线在当时已经不构成威胁。<\/li><li><strong>素材没有给出曹操的翻盘路径<\/strong>：没有带线、没有团战、没有绕后，只有被压制的画面。<\/li><\/ul>", "sum": "经济落后即失去存在感：1700 对 4000 的经济差下，对手认定\"他们不可能打得过\"（BV1p7FrekE3S @ 03:45~03:50）。"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li>只给到一条负面线索：<strong>没出抵抗之靴<\/strong>（BV1p7FrekE3S @ 02:33），因此被控的窗口很大。<\/li><li>其余装备与铭文<strong>完全未覆盖<\/strong>。<\/li><\/ul>", "sum": "只给到一条负面线索：没出抵抗之靴（BV1p7FrekE3S @ 02:33），因此被控的窗口很大。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/128.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“王昭君：王昭君的关键点于2技能的冰冻效果，冻住英雄大招打出极高的爆发。曹操的大招能够增加…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“鲁班七号：曹操的一套技能很少有脆皮能够承受的住。他的高机动性和强大控制能力，也让没有位移…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>刘邦<\/strong><\/td><td>对抗路／游走<\/td><td>“刘邦的2技能能有效的控制曹操输出”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>宫本武藏<\/strong><\/td><td>打野<\/td><td>“宫本的大招可以针对恢复型英雄，曹操面对他最大的长板被无限缩小”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“王昭君：王昭君的关键点于2技能的冰冻效果，冻住英雄大招打出极高的爆发。曹操的大招能够增加…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>蒙恬<\/strong><\/td><td>对抗路<\/td><td>“缺乏位移的站边英雄很难在蒙恬身上占得便宜”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：庄周、孙膑<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/128.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "unknown", "job": "hold", "motto": "把他大招骗出来，没抵抗鞋就能杀", "beats": ["王昭君", "鲁班七号"], "loses": ["刘邦", "宫本武藏", "王昭君", "蒙恬"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 4, "incoming": ["刘邦", "宫本武藏", "王昭君", "蒙恬"], "loses_all": ["刘邦", "宫本武藏", "王昭君", "蒙恬"], "lane_names": ["对抗路"]}, {"name": "李元芳", "hue": 316, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>一技能是核心输出<\/strong>：能\"秒掉大部分的战士、脆皮\"，期间增加攻速与射程，\"让元芳自带逐日之弓\"；该技能\"可以对防御塔使用 拆塔速度非常快\"（BV1dt411P7Yg @ 08:19~08:32）。<\/li><li><strong>一技能可以借物挂标<\/strong>：打不到人时，\"可以利用小兵或者野怪或者防御塔提升攻速、射程 打中敌方英雄\"（BV1dt411P7Yg @ 08:34~08:42）。<\/li><li><strong>二技能是保命技能<\/strong>：用于\"逃生追击\"，也能当封路手段——\"往敌方撤退的那个位置身后放二技能\"来减速封路（BV1dt411P7Yg @ 08:46~09:02）。<\/li><li><strong>二技能范围反直觉<\/strong>：\"实际伤害距离比那个指示器多出两个身位\"；反过来\"同时跟敌人保持一个身位 或者位置和敌方英雄重叠 是没法造成伤害的\"（BV1dt411P7Yg @ 09:04~09:25）。<\/li><li><strong>大招伤害不高，功能大于伤害<\/strong>：主要作用是\"叠加一技能的层数\"、封退路、分割战场；内圈\"可以造成双倍伤害\"（BV1dt411P7Yg @ 09:41~10:02）。<\/li><li><strong>被动是移动侦察<\/strong>：探草能直接看到蹲的人，也能\"看到隐身的敌人\"，如兰陵王、阿轲、鬼谷子、守约（BV1dt411P7Yg @ 07:52~07:56）。<\/li><\/ol>", "sum": "一技能是核心输出：能\"秒掉大部分的战士、脆皮\"，期间增加攻速与射程，\"让元芳自带逐日之弓\"；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>出门先不学技能<\/strong>：\"我们一般出门不要学习技能\"，到兵线先确认对位是谁，因为对面可能换路（BV1dt411P7Yg @ 12:36~12:43）；对面不知道你学一还是学二，\"这个时候你可以就是吓跑他\"（BV1dt411P7Yg @ 12:50~12:53）。<\/li><li><strong>学一还是学二看对面反应<\/strong>：一技能打上去能打残，\"如果他跑了 二技能直接把兵线清掉 快速升到二级\"；对面要刚到底就\"学一技能 满层数的一技能\"（BV1dt411P7Yg @ 13:05~13:29）。<\/li><li><strong>对坦克直接学二<\/strong>：\"是坦克的话 就直接学二技能 不用管 直接学二技能快速清线 他打不死你啊\"（BV1dt411P7Yg @ 13:41~13:46）。<\/li><li><strong>一级的唯一目标是到二<\/strong>：\"元芳第一个目标就是要想办法升到二级\"，因为一、二技能单独用都很难打出效果（BV1dt411P7Yg @ 11:25~11:45）；\"到了二级之后 元芳就有质变的能力\"（BV1dt411P7Yg @ 13:50~13:53）。<\/li><li><strong>开局布甲防卡线<\/strong>（对孙尚香）：\"开局预购一手布甲 这一步是防止有些孙尚香一级会卡你的线 出布甲可以硬吃他的伤害\"（BV1Yx421D7hC @ 00:14~00:20）；对面不卡线就\"正常出铁剑\"（BV1Yx421D7hC @ 00:23~00:25）。<\/li><li><strong>塔下补兵把兵线卡在外面<\/strong>，否则\"很容易就会和我一样补不到兵线\"（BV1Yx421D7hC @ 00:31~00:35）。<\/li><li><strong>第二波提前进草<\/strong>：\"现在峡谷地图变大了 第一个小兵很容易被卡掉 提前来到这个草丛 可以避免被卡掉\"（BV1Yx421D7hC @ 00:40~00:48）。<\/li><li><strong>对面打野没露就别把线卡在外面<\/strong>（BV1Yx421D7hC @ 00:56~00:58）；对面来抓就缩塔，\"前期他们不来四五个人是不敢越塔的\"（BV1Yx421D7hC @ 01:20~01:26）。<\/li><li><strong>4 级前压着打<\/strong>：\"元芳四级之前尽量压着敌方打\"，很多战士要 4 级才有作用；但遇到\"有控有位移的\"橘右京要小心（BV1dt411P7Yg @ 15:19~15:35）。<\/li><li><strong>对反打强的英雄不要先交二<\/strong>：孙策、李信、橘右京、狂铁这类，\"你二技能滚过去 人家一套打到你身上来\"，\"他满血的时候不要跟他杠\"（BV1dt411P7Yg @ 01:07~01:32）。<\/li><li><strong>该换线就换线<\/strong>：遇到阿离、狄仁杰、百里守约，\"尽量要求和队友换线\"——阿离\"可以用扇子挡住你的一技能\"，狄仁杰二技能\"可以直接把你那个标给解掉\"，守约\"不跟你对 他就在前面狙你\"（BV1dt411P7Yg @ 15:38~16:09）。<\/li><li><strong>抓中路别暴露视野<\/strong>：\"你在下路清完一波线了 你就直接往中路走了 别人的中路只要有点意识 就知道你要去抓他\"（BV1dt411P7Yg @ 18:57~19:06）。<\/li><\/ul>", "sum": "出门先不学技能：\"我们一般出门不要学习技能\"，到兵线先确认对位是谁，因为对面可能换路（BV1dt411P7Yg @ 12:36~12:43）；"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>对面无位移 / 只有一个闪现<\/td><td><strong>213AA<\/strong>：二技能近身 → 一技能套上 → 大招丢在对方身后防闪现<\/td><td>BV1dt411P7Yg @ 00:30~01:04<\/td><\/tr><tr><td>对面反打强（孙策、李信、橘右京）<\/td><td>先用一技能把血线压到一半，再\"12AAA连招带走\"，二技能全程不先交<\/td><td>BV1dt411P7Yg @ 01:35~01:53<\/td><\/tr><tr><td>蹲草遇到坦克<\/td><td>一技能套上消耗、打出被动；二、三技能不给坦克，除非坦克和队友脱节单独探草<\/td><td>BV1dt411P7Yg @ 02:04~02:56<\/td><\/tr><tr><td>蹲草遇到脆皮 / 坦度一般的战士<\/td><td>一技能起手 → 等对方交掉位移 → 二技能滚过去贴身 → 三技能封路<\/td><td>BV1dt411P7Yg @ 03:06~03:40<\/td><\/tr><tr><td>对面不跑、直接硬刚<\/td><td>二技能留着躲致命伤害（花木兰一技能、光信大招）<\/td><td>BV1dt411P7Yg @ 03:44~04:00<\/td><\/tr><tr><td>抓中路法师（诸葛亮、干将这类）<\/td><td>213 一套带走；对面有控（如妲己）时二技能留着躲控<\/td><td>BV1dt411P7Yg @ 18:05~18:13<\/td><\/tr><tr><td>被刺客贴脸<\/td><td>大招直接扔自己脚下，先延缓进攻节奏，再考虑反打<\/td><td>BV1dt411P7Yg @ 10:35~11:04<\/td><\/tr><tr><td>自己撤退<\/td><td><strong>先二技能，再闪现<\/strong><\/td><td>BV1Yx421D7hC @ 02:07~02:09<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景连招依据对面无位移 / 只有一个闪现213AA：二技能近身 → 一技能套上 → 大招丢在对方身后防闪现BV1dt411P7Yg @ 00:30~01:04对面反打强（孙策、李信、橘右京）先…"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>先推一塔再谈其他<\/strong>：前期只要不对线很强的上单，元芳能把下路一塔耗掉大半；4 分钟炮车兵来了还推不掉，\"一定要叫队友来帮忙\"，\"这样才能解放元芳\"（BV1dt411P7Yg @ 16:42~16:55）。<\/li><li><strong>推塔后直接进对面野区<\/strong>：\"趁敌方打野GANK不在的时间可以偷野偷Buff\"，既发育又\"打断敌方的进攻节奏\"（BV1dt411P7Yg @ 17:11~17:37）。<\/li><li><strong>顺风围绕对面野区打<\/strong>：大优势时\"可以过来和廉颇快速把兵线带过去 对面是不敢守这个蓝的\"；优势不大时\"一定要优先过来给对面压力\"（BV1Yx421D7hC @ 05:02~05:16）。<\/li><li><strong>搜刮完野区再转<\/strong>：\"队友来蓝区了 那我们就去对面红区 让对面拿不到野区资源 这样他们就没有翻盘的机会\"（BV1Yx421D7hC @ 05:56~06:05）。<\/li><li><strong>不要在线上待太久<\/strong>：\"千万不要在长期带线线上待太久\"，破塔后局势打不开就\"和队友进行一个换路 我们去上路继续拆\"（BV1dt411P7Yg @ 19:14~19:33）。<\/li><li><strong>一次掉点就可能被翻<\/strong>：\"你要知道你可是全队拿了最多人头、最多经济 没有你 队友那边打团是完全打不过\"（BV1Yx421D7hC @ 04:47~04:53）。<\/li><li><strong>不要一个人转线<\/strong>：\"清完这波兵线 对面不漏就不要转线了 因为这个时候 对面大概率会在你回防的路上蹲你\"（BV1Yx421D7hC @ 04:34~04:39）。<\/li><li><strong>龙的处理<\/strong>：\"优势局拿暴君 逆风局拿主宰\"（BV1Yx421D7hC @ 06:07~06:09）；打野不喜欢开龙\"我们自己也是可以开龙的\"（BV1Yx421D7hC @ 03:01~03:03），\"元芳打龙很快\"（BV1dt411P7Yg @ 20:04）。<\/li><li><strong>破军多数时候等不到<\/strong>：\"很多时候其实等不到我们破军出来就已经赢了 破军算是杀手锏\"（BV1Yx421D7hC @ 06:38~06:42）。<\/li><\/ul>", "sum": "先推一塔再谈其他：前期只要不对线很强的上单，元芳能把下路一塔耗掉大半；"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>破军流开局<\/strong>：对孙尚香先预购布甲（BV1Yx421D7hC @ 00:14），不卡线则铁剑（BV1Yx421D7hC @ 00:23）。<\/li><li><strong>电刀<\/strong>：
