项羽怎么这么疼啊\"（BV1emFUzyEzN @ 00:14）——坦度和伤害在她身上同时存在<\/li><li><strong>有石化类控制<\/strong>：全片唯一一次提到是\"这边都不好石化啊\"（BV1emFUzyEzN @ 06:17），即那一波没石化到人；石化怎么触发、范围多大，素材没讲<\/li><li><strong>能开团<\/strong>：团战起手记为\"钟无艳开了\"（BV1emFUzyEzN @ 05:11），随后被项羽切入（BV1emFUzyEzN @ 05:22）<\/li><li><strong>会传送离线<\/strong>：素材记她\"直接传送走了\"（BV1emFUzyEzN @ 01:12），是召唤师技能还是回城，原片没说明<\/li><li><strong>敢站兵线换血<\/strong>：她能在项羽面前站住兵线，项羽的应对是\"连人带兵补刀往后拉扯\"（BV1emFUzyEzN @ 01:41）<\/li><\/ol>", "sum": "血厚且减伤明显：开局 4889 血的钟无艳（BV1emFUzyEzN @ 00:03），项羽打上去\"都不带掉血\"（BV1emFUzyEzN @ 00:18），素材把这点归到她的出装与铭文上（B…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<p>以下几条是项羽侧的处理，反过来就是钟无艳的对线强度。<\/p>\n<ul><li><strong>换血占优<\/strong>：项羽\"杀不了他\"，只能保证自己\"不能被他过多的消耗\"（BV1emFUzyEzN @ 01:23）<\/li><li><strong>硬拼打不过<\/strong>：素材直言\"一直一股脑的跟他对线、一直一股脑的跟他打\"，\"一般项羽是打不过的\"（BV1emFUzyEzN @ 03:12、BV1emFUzyEzN @ 03:13）<\/li><li><strong>吃经济差<\/strong>：项羽的思路是\"不能比他经济低\"（BV1emFUzyEzN @ 03:25），说明钟无艳的压制力跟经济差直接挂钩<\/li><li><strong>她也会漏线<\/strong>：\"他这一波要丢波兵线\"（BV1emFUzyEzN @ 03:29），兵线运营并非不掉线<\/li><li><strong>对抗路通用时间点<\/strong>：素材原话\"1分25秒这个时候过河道，有风险\"（BV1emFUzyEzN @ 00:51），1 分 30 秒对面打野大概率已到（BV1emFUzyEzN @ 01:03）<\/li><\/ul>", "sum": "以下几条是项羽侧的处理，反过来就是钟无艳的对线强度。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖连招细节。<\/p>\n<p>需要分清：片中反复出现的\"大闪\"\"一秒五刀\"\"一技能往后拉\"（BV1emFUzyEzN @ 03:36、BV1emFUzyEzN @ 05:19、BV1emFUzyEzN @ 04:09）都是<strong>项羽<\/strong>的操作，不是钟无艳的。钟无艳这一侧只有\"开了\"（BV1emFUzyEzN @ 05:11）和\"不好石化\"（BV1emFUzyEzN @ 06:17）两句。<\/p>", "sum": "素材未覆盖连招细节。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li>5 分钟那波她先手开团，被项羽\"啪啪就进去一刀\"、\"瞬间切双C\"（BV1emFUzyEzN @ 05:17、BV1emFUzyEzN @ 05:19），原话\"要不死我都得给他杀\"（BV1emFUzyEzN @ 05:24）<\/li><li>到 8 分多\"钟无艳已经躺了\"（BV1emFUzyEzN @ 08:37）<\/li><li>素材对她的后期判断是\"存活都没有任何意义了\"（BV1emFUzyEzN @ 07:52）——前期压不出经济差，后期就没有存在感<\/li><\/ul>", "sum": "5 分钟那波她先手开团，被项羽\"啪啪就进去一刀\"、\"瞬间切双C\"（BV1emFUzyEzN @ 05:17、BV1emFUzyEzN @ 05:19），原话\"要不死我都得给他杀\"（BV1emF…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li>散点一：<strong>肉铭文<\/strong>（BV1emFUzyEzN @ 00:08、BV1emFUzyEzN @ 00:14）<\/li><li>散点二：开局 <strong>4889 血<\/strong>（BV1emFUzyEzN @ 00:03）<\/li><li>完整出装顺序与铭文具体搭配未覆盖<\/li><\/ul>", "sum": "散点一：肉铭文（BV1emFUzyEzN @ 00:08、BV1emFUzyEzN @ 00:14）散点二：开局 4889 血（BV1emFUzyEzN @ 00:03）完整出装顺序与铭文具体…"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/117.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“兰陵王：兰陵王作为一个自身没有位移技能的刺客，虽然大招隐身非常厉害，钟无艳可以在兰陵王靠…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>钟馗<\/strong><\/td><td>游走<\/td><td>“钟馗：团战时，钟馗勾人技能十分厉害，但是对上钟无艳，把钟无艳勾过去，钟无艳一个大招基本可…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（5）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>司空震<\/strong><\/td><td>对抗路／打野<\/td><td>“司空震可以轻松与钟无艳拉开距离，让钟无艳的高伤害无法发挥。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>夏侯惇<\/strong><\/td><td>对抗路／打野<\/td><td>“钟无艳：钟无艳虽然有控制有位移，但是如果打到后期装备成型，钟无艳将完全不是夏侯惇的对手。…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>戈娅<\/strong><\/td><td>发育路<\/td><td>“钟无艳的位移能力较弱，除蹲草外难以接近戈娅”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>貂蝉<\/strong><\/td><td>对抗路／中路<\/td><td>“灵活的貂蝉会让钟无艳的技能很难打中她”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>项羽<\/strong><\/td><td>对抗路／游走<\/td><td>“钟无艳在大招期间，项羽能将她推开限制她对友方的输出与控制”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：虞姬、马可波罗<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/117.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["solo"], "tempo": "early", "job": "open", "motto": "钟无艳是不好打的", "beats": ["兰陵王", "钟馗"], "loses": ["司空震", "夏侯惇", "戈娅", "貂蝉", "项羽"], "main_lane": "solo", "type": "战士", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 5, "incoming": ["司空震", "夏侯惇", "戈娅", "貂蝉", "项羽"], "loses_all": ["司空震", "夏侯惇", "戈娅", "貂蝉", "项羽"], "lane_names": ["对抗路"]}, {"name": "镜", "hue": 2, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>双印记 = 斩杀 + 刷新<\/strong>：本体和镜像的攻击给敌人留不同印记，同时存在两个印记就造成已损生命值斩杀伤害，并刷新一二技能 CD；头上白色读条就是刷新 CD 的计时（BV1YDqTYkEkT @ 01:14-01:28），平时 5 秒、大招期间缩至 2 秒（BV163411a7we @ 01:37-01:41）<\/li><li><strong>镜像复制惩戒<\/strong>：本体和镜像离得越远惩戒伤害越高——刷野时刻意拉远距离再惩戒，大幅提升刷野效率和抢野斩杀线（BV1YDqTYkEkT @ 01:30-01:42）；36 秒刷野法：A 一下叠印记 → 一技能出镜像 → 往外走几步惩戒 → 读条快结束 1A1 带走（BV163411a7we @ 03:17-03:39）<\/li><li><strong>镜像共享视野<\/strong>：可以用镜像探草，也可以利用镜像没有血条、不显眼的机制靠近对手再换位突进（@ 01:42-01:51）<\/li><li><strong>快 A<\/strong>：一技能强化普攻不用等飞到终点，飞行途中就能按 A，这就是别人的镜爆发更高的原因（@ 01:52-02:06）；强化普攻可触发一切法球效果，且不受减攻速影响——对面出不祥、冰心甚至夏洛特也拦不住 1A1（BV163411a7we @ 02:41-02:53）<\/li><li><strong>二技能的指示器就是镜像的中轴线<\/strong>：往上下放镜像就左右动，往左右放镜像就上下动——用它随心所欲控制镜像位置；回血量同样跟镜像距离有关，残血先一技能召唤镜像、拉到最远一起撞兵，回得更多（BV1YDqTYkEkT @ 02:06-02:37）<\/li><li><strong>大招<\/strong>：把路径上敌人推到中线定身；开大瞬间是无敌的，可以躲控制和伤害（BV1YDqTYkEkT @ 03:25-03:29）；换位飞行过程中有 30% 免伤，落地就没有，吃塔伤时用它抗（BV163411a7we @ 09:23-09:33）；大招还能刷新被动读条，短时间打出三段一技能（@ 04:57-05:16）；后期大招仅 18 秒，不用吝啬（@ 05:56-05:58）<\/li><li><strong>镜像没有霸体<\/strong>：指向性技能躲不了，只能靠大招换位移到己方一侧减轻影响——所以进场时机最重要，等对面没控再上（@ 08:48-09:18）<\/li><\/ol>", "sum": "双印记 = 斩杀 + 刷新：本体和镜像的攻击给敌人留不同印记，同时存在两个印记就造成已损生命值斩杀伤害，并刷新一二技能 CD；"}, {"id": "", "cat": "", "title": "2. 对线", "self": "<h3>2. 对线<\/h3>", "html": "<p>打野位无传统对线。开局二选一：<\/p>\n<ul><li><strong>正常开局<\/strong>：跟发育路 Buff 刷，刷完到四级正好抓对抗路，越不了塔就带着边路转中或打龙团（BV163411a7we @ 10:50-11:10）<\/li><li><strong>反野开局<\/strong>：不是强反，是猜对面打野哪个 Buff 开、提前蹲在附近，一个 E1A 惩戒直接抢掉；有机会杀打野，没机会二技能加速走（@ 11:11-11:41）<\/li><\/ul>", "sum": "打野位无传统对线。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>圈内秒人（绞杀）<\/td><td>1A132 → 3A32 → 31A<\/td><td>爆发最快的圈内连招（BV1YDqTYkEkT @ 04:12-04:22）<\/td><\/tr><tr><td>越塔<\/td><td>31A2A，再一技能出塔<\/td><td>（@ 04:22-04:28）<\/td><\/tr><tr><td>远距离绞杀<\/td><td>先二次瞬步让影子靠近目标，再远距离换位 1A32A1A323A<\/td><td>瞬秒后排（@ 04:28-04:40）<\/td><\/tr><tr><td>鬼影卡墙杀<\/td><td>二技能把镜像藏在墙外，换位贴墙飞过去 1A1A3A2A1A<\/td><td>抓边出其不意（@ 04:40-04:50）<\/td><\/tr><tr><td>无限飞雷神<\/td><td>31323A32 循环；技能在空中就能按，平 A 后摇用技能或走位轮盘取消，每次平 A 换位后接技能<\/td><td>（BV1YDqTYkEkT @ 03:01-03:25；BV163411a7we @ 06:17-07:31）<\/td><\/tr><tr><td>二次瞬步<\/td><td>连按两次换位的同时，轮盘往想位移的反方向推，瞬移一段距离、能穿绝大多数墙体<\/td><td>反向瞬步还能给影子加位移，用来探草或出其不意冲后排（BV1YDqTYkEkT @ 03:36-03:57）<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "场景连招依据圈内秒人（绞杀）1A132 → 3A32 → 31A爆发最快的圈内连招（BV1YDqTYkEkT @ 04:12-04:22）越塔31A2A，再一技能出塔（@ 04:22-04:2…"}, {"id": "", "cat": "", "title": "4. 中后期/节奏", "self": "<h3>4. 中后期/节奏<\/h3>", "html": "<ul><li><strong>镜像永远走中轴线的反方向<\/strong>：想让它往左，本体就往右——探草、无伤越塔收割残血、用镜像磨塔都靠这一点（BV163411a7we @ 10:03-10:24）<\/li><li><strong>假视野<\/strong>：清完线放出镜像走另一边、本体藏视野，小地图上分不出真假，蹲人神器（@ 10:24-10:38）<\/li><li><strong>打均势局多隐藏自身、找关键一击；优势局多多逼团，用飞雷神压塔磨人；劣势局多带线发育<\/strong>（@ 11:58-12:07）<\/li><li>飞雷神成没练成的标准：大招十秒内普通省标玩家飞 12 次，顶级能飞 17 次（@ 09:40-09:50）<\/li><\/ul>", "sum": "镜像永远走中轴线的反方向：想让它往左，本体就往右——探草、无伤越塔收割残血、用镜像磨塔都靠这一点（BV163411a7we @ 10:03-10:24）假视野：清完线放出镜像走另一边、本体藏视…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>铭文<\/strong>：十隐匿、十鹰眼、八异变两红月——红月为卡 3.2 攻速阈值，六级 8.2 攻速刚好第三档；但强化普攻本身不受攻速影响，必要时可不为卡攻速纠结（BV163411a7we @ 12:15-12:30）<\/li><li><strong>出装顺序<\/strong>：小野刀 → 陨星（队友前排多就先陨星，否则先大鞋）→ 黑切 → 小护手提升容错 → 实战后合成大野刀 → 破军 → 碎星锤（@ 12:35-12:50）<\/li><li>操作设置：自动追击距离\"近距离\"、移动式追击关、精准普攻关（不关换 A 会变慢）；布局里把三、四技能键互换，换位放在三技能手感更顺（BV1YDqTYkEkT @ 00:40-01:00）<\/li><\/ul>", "sum": "铭文：十隐匿、十鹰眼、八异变两红月——红月为卡 3.2 攻速阈值，六级 8.2 攻速刚好第三档；"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/531.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>伽罗<\/strong><\/td><td>发育路<\/td><td>“镜快速的接近能力，让远程站桩射手很难反抗”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>西施<\/strong><\/td><td>中路<\/td><td>“西施的技能命中难度较高，而灵活的镜可以使用技能从容的躲避”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>澜<\/strong><\/td><td>打野<\/td><td>“澜的大招可强行将镜“拖出”大招范围内。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“王昭君反手的大招，让镜在释放大招后无法继续在范围内继续活动被迫离开”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>项羽<\/strong><\/td><td>对抗路／游走<\/td><td>“克制镜最好的办法就是将其推出大招范围，同时项羽的硬度也能保证自身的安全”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鬼谷子、瑶<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/531.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["jungle"], "tempo": "early", "job": "open", "motto": "镜像离本体越远，伤害和回复越多", "beats": ["伽罗", "西施"], "loses": ["澜", "王昭君", "项羽"], "main_lane": "jungle", "type": "刺客", "unlisted": false, "n": 5, "b_n": 1, "vs": [], "beats_n": 2, "loses_n": 3, "incoming": ["澜", "王昭君", "项羽"], "loses_all": ["澜", "王昭君", "项羽"], "lane_names": ["打野"]}, {"name": "阿轲", "hue": 135, "a": [{"id": "", "cat": "", "title": "1. 机制内核：暴击规则就是她的切入规则", "self": "<h3>1. 机制内核：暴击规则就是她的切入规则<\/h3>", "html": "<ol><li><strong>被动暴击是定向的<\/strong>：从背后攻击\"百分百会暴击\"，\"正面攻击是必定不会暴击的\"（BV1bA41147mn @ 00:18-00:22）<\/li><li><strong>暴击率直接兑换成伤害<\/strong>：每 1% 暴击转化成 0.5% 暴击伤害，所以堆暴击\"变相的增加阿轲的伤害\"（BV1bA41147mn @ 00:22-00:28）<\/li><li><strong>清野伤害有上限<\/strong>：对非英雄目标（小兵、野怪）单次伤害上限 1500，\"打敌方英雄是没有伤害上限\"（BV1bA41147mn @ 00:31-00:38）<\/li><li><strong>一技能是移动中的强化普攻<\/strong>：移动中可释放，\"相当于打两下平A\"，因为有物理加成所以比普攻伤害高一点（BV1bA41147mn @ 00:42-00:49）<\/li><li><strong>二技能是核心技能<\/strong>：戳中敌人后三重效果——自己加 40% 攻速；标记让敌人对你的伤害减 30%（减伤）；被标记的敌人被你普攻或技能命中时减速 50%。\"这个就是一个很关键的留人技能\"（BV1bA41147mn @ 00:51-01:22）<\/li><li><strong>大招隐身回血 + 加移速<\/strong>：破隐之后还有 3 秒攻击加成，\"这个攻击加成还是很重要的，一定要合理运用好大招\"（BV1bA41147mn @ 01:22-01:30）<\/li><li><strong>大招能被打断<\/strong>：起跳一瞬间被敌方控制技能命中，大招会被打断（BV1bA41147mn @ 01:32-01:38）<\/li><\/ol>", "sum": "被动暴击是定向的：从背后攻击\"百分百会暴击\"，\"正面攻击是必定不会暴击的\"（BV1bA41147mn @ 00:18-00:22）暴击率直接兑换成伤害：每 1% 暴击转化成 0.5% 暴击伤害…"}, {"id": "", "cat": "", "title": "2. 对线", "self": "<h3>2. 对线<\/h3>", "html": "<ul><li>素材未覆盖，见待补。<\/li><\/ul>", "sum": "素材未覆盖，见待补。"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<ul><li>素材未覆盖，见待补（UP 主预告的\"操作技巧或玩法\"在下一期，字幕库中暂无）。<\/li><\/ul>", "sum": "素材未覆盖，见待补（UP 主预告的\"操作技巧或玩法\"在下一期，字幕库中暂无）。"}, {"id": "", "cat": "", "title": "4. 中后期/节奏", "self": "<h3>4. 中后期/节奏<\/h3>", "html": "<ul><li>素材未覆盖，见待补。<\/li><\/ul>", "sum": "素材未覆盖，见待补。"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<ul><li><strong>铭文（素材唯一给出的成品配置）<\/strong>：10 狩猎 + 10 鹰眼 + 10 无双（BV1bA41147mn @ 00:10-00:14）<\/li><li>出装素材未覆盖，见待补。<\/li><\/ul>", "sum": "铭文（素材唯一给出的成品配置）：10 狩猎 + 10 鹰眼 + 10 无双（BV1bA41147mn @ 00:10-00:14）出装素材未覆盖，见待补。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/116.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（8）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>伽罗<\/strong><\/td><td>发育路<\/td><td>“同样更加灵活的阿轲也能轻松收割伽罗”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>元歌<\/strong><\/td><td>对抗路<\/td><td>“同样具有隐身能力的阿轲也会限制元歌的发挥”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>大乔<\/strong><\/td><td>中路／游走<\/td><td>“阿轲的快速收割能力很容易在法阵消失之前就击杀掉友军”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>沈梦溪<\/strong><\/td><td>中路<\/td><td>“同样具有隐身能力并且爆发超高的阿轲会对沈梦溪造成很大的威胁，令他不敢在战线后方慢慢蓄力。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“王昭君：王昭君是一个脆皮站桩输出英雄，等待王昭君使用2技能后的真空期后，可以快速贴近使用…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>莱西奥<\/strong><\/td><td>发育路<\/td><td>“刺客绕后切”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>西施<\/strong><\/td><td>中路<\/td><td>“不仅可以静悄悄靠近西施，还在近身后凭借灵活身手降低西施技能的命中几率”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“鲁班七号：面对鲁班七号需要注意躲避好鲁班七号的1技能命中眩晕效果，可以选择大招绕后利用暴…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（12）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>亚瑟<\/strong><\/td><td>对抗路／打野<\/td><td>“阿轲：亚瑟的一技能非常频繁，对敌方单体的沉默能力非常突出，而阿轲正好也是对单体输出非常强…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>刘禅<\/strong><\/td><td>游走<\/td><td>“阿轲：当前版本的阿轲多是刺客玩法，出装偏向输出摆法型，攻击力高的同时身板也很脆，当阿轲隐…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>太乙真人<\/strong><\/td><td>游走<\/td><td>“太乙真人：太乙真人的复活给到队友后即使阿轲击杀也无法刷新自己的大招逃命”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>曜<\/strong><\/td><td>对抗路／打野<\/td><td>“阿轲的爆发力十足，但只要曜有所准备就能够 ml": "<ol><li><strong>枪可以存、可以捡<\/strong>：素材以\"21 秒存枪，27 秒捡枪，枪已经存在兵线旁边\"记录开局枪位（BV1EpGq6KEMx @ 00:14、BV1EpGq6KEMx @ 00:15；原文主语写作\"项羽\"，此处不改写）<\/li><li><strong>枪能把兵往回拉<\/strong>：\"第一枪戳，第二枪往回拉，把这个近战兵拉到我们身上\"（BV1EpGq6KEMx @ 00:20、BV1EpGq6KEMx @ 00:21）<\/li><li><strong>一技能贯穿可改方向<\/strong>：防卡线时\"一技能贯穿往旁边打\"（BV1EpGq6KEMx @ 01:02）<\/li><li><strong>抢线的胜负点是二级<\/strong>：\"抢线比的就是谁先到二级\"（BV1EpGq6KEMx @ 00:28）<\/li><li><strong>机动性是保命底牌<\/strong>：明知对面打野在对抗路还硬对线，\"要不是靠着我们马超的一个高机动性\"，这一波就是白给（BV1EpGq6KEMx @ 03:00）<\/li><\/ol>", "sum": "枪可以存、可以捡：素材以\"21 秒存枪，27 秒捡枪，枪已经存在兵线旁边\"记录开局枪位（BV1EpGq6KEMx @ 00:14、BV1EpGq6KEMx @ 00:15；"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<ul><li><strong>站位<\/strong>：不要跟兵线站一起，\"容易被项羽推\"（BV1EpGq6KEMx @ 00:18）<\/li><li><strong>补三个兵<\/strong>：一枪戳、一枪往回拉，把近战兵拉到身上，\"同时出三个兵\"；不然近战兵抢不到，就升不了二级（BV1EpGq6KEMx @ 00:21、BV1EpGq6KEMx @ 00:23、BV1EpGq6KEMx @ 00:26）<\/li><li><strong>两套 CD 找单杀<\/strong>：先到二级 → 先打对面一套 CD → 等第二套 CD 再打一套，\"就可以有单杀的一个机会\"（BV1EpGq6KEMx @ 00:30、BV1EpGq6KEMx @ 00:31、BV1EpGq6KEMx @ 00:33）<\/li><li><strong>线权换支援<\/strong>：抢完线对面只能后手清线，就先做事、先打中立资源（BV1EpGq6KEMx @ 00:37、BV1EpGq6KEMx @ 00:40）<\/li><li><strong>防卡线<\/strong>：一技能贯穿往旁边打（BV1EpGq6KEMx @ 01:02）；原理是对面小兵打不过自家小兵，兵线一直往对面推，清兵点会离自家塔越来越远，被抓就更危险（BV1EpGq6KEMx @ 01:05、BV1EpGq6KEMx @ 01:09、BV1EpGq6KEMx @ 01:11）<\/li><li><strong>一分钟那波线<\/strong>：不知道对面打野什么开，就默认他往我们这里开，\"一分钟的那一波线我们就不能清\"（BV1EpGq6KEMx @ 01:23、BV1EpGq6KEMx @ 01:25）<\/li><li><strong>卡线窗口<\/strong>：1 分 36 秒到 2 分 15 秒最惨，对面打野首开 Buff 要到 2 分 15 秒才刷新，刷新前他可以不回去、一直卡你的线（BV1EpGq6KEMx @ 01:31、BV1EpGq6KEMx @ 01:37、BV1EpGq6KEMx @ 01:39）<\/li><li><strong>镜像原则<\/strong>：双方都红开，出野区时间接近，对面打野大概率就在对抗路（BV1EpGq6KEMx @ 02:27、BV1EpGq6KEMx @ 02:32、BV1EpGq6KEMx @ 02:36、BV1EpGq6KEMx @ 02:46）<\/li><li><strong>打项羽<\/strong>：素材原话\"基本上是拿他没有一点办法的\"（BV1EpGq6KEMx @ 04:53）<\/li><\/ul>", "sum": "站位：不要跟兵线站一起，\"容易被项羽推\"（BV1EpGq6KEMx @ 00:18）补三个兵：一枪戳、一枪往回拉，把近战兵拉到身上，\"同时出三个兵\"；"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<p>素材未覆盖连招细节。<\/p>\n<p>只给到一个操作片段：\"第一枪戳，第二枪往回拉\"用来拉近战兵（BV1EpGq6KEMx @ 00:20），完整连招、枪的层数与戳枪节奏都没讲。<\/p>", "sum": "素材未覆盖连招细节。"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>中期只做一件事<\/strong>：带线打人数差（BV1EpGq6KEMx @ 05:49、BV1EpGq6KEMx @ 06:53）<\/li><li><strong>利用刷钱心理<\/strong>：低分段对面\"真的会去清线\"，就吃他们\"吃线刷钱\"的心理找机会（BV1EpGq6KEMx @ 05:51、BV1EpGq6KEMx @ 06:02、BV1EpGq6KEMx @ 06:05）<\/li><li><strong>10 分钟龙点<\/strong>：队友开主宰时，\"一定要带上路这个远端线\"，因为对面大概率偷龙（BV1EpGq6KEMx @ 06:59、BV1EpGq6KEMx @ 07:01）<\/li><li><strong>反向利用教学<\/strong>：对面就算不偷龙，也会按\"逆风多带线\"的思路来，正好在边路提前反蹲（BV1EpGq6KEMx @ 07:07、BV1EpGq6KEMx @ 07:19）<\/li><li><strong>龙位处理<\/strong>：龙不该放中路；原话\"我们可以龙放下路\"，人往中上给压力，等对面中上人多再转下路打声东击西（BV1EpGq6KEMx @ 07:34、BV1EpGq6KEMx @ 07:37、BV1EpGq6KEMx @ 07:42）<\/li><li><strong>上高地<\/strong>：本质是让对面同时清线又要打人，被兵线消耗技能（BV1EpGq6KEMx @ 07:46、BV1EpGq6KEMx @ 07:53）；\"一定不要跟兵线站在一起\"（BV1EpGq6KEMx @ 07:57）<\/li><li><strong>抓机会<\/strong>：这个分段对面意识不强，\"一抓一个准\"（BV1EpGq6KEMx @ 05:21）<\/li><\/ul>", "sum": "中期只做一件事：带线打人数差（BV1EpGq6KEMx @ 05:49、BV1EpGq6KEMx @ 06:53）利用刷钱心理：低分段对面\"真的会去清线\"，就吃他们\"吃线刷钱\"的心理找机会（B…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p>素材未涉及出装与铭文，本节无内容，见待补。<\/p>", "sum": "素材未涉及出装与铭文，本节无内容，见待补。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/518.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>安琪拉<\/strong><\/td><td>中路<\/td><td>“安琪拉拥有足够的火力来消灭对手，不过比较笨重，马超可以利用灵活的身手绕至身后躲避其大招的…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“鲁班自保的击退能 被删掉<\/strong>。<\/li><li><strong>推广<\/strong>：判断自己被不被克，问一句\"我的核心动作在对面这套阵容下还能不能做出来\"。做不出来就是机制克。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<p>&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;<\/p>\n<h2>官方口径（L0 · 未经实测）<\/h2>\n<blockquote><p>来源：官方英雄详情页 <code>herodetail/156.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（13）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>上官婉儿<\/strong><\/td><td>中路<\/td><td>“面对有2个强势控制技能的张良，上官婉儿的灵动性会受到较大限制”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>云中君<\/strong><\/td><td>打野<\/td><td>“云中君脆弱的身板需要恰到好处的释放技能来抵消伤害和控制，但张良不会给云中君表演的机会”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“张良的硬控能控住兰陵王将其击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>吕布<\/strong><\/td><td>对抗路<\/td><td>“张良面对无位移的持续输出型战士时，自身“拖住敌人”的优势特质容易发挥出来”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>哪吒<\/strong><\/td><td>对抗路／打野<\/td><td>“张良的大招效果可以无视哪吒的大招韧性效果”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>娜可露露<\/strong><\/td><td>打野<\/td><td>“张良的硬控能控住娜可露露将其击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>戈娅<\/strong><\/td><td>发育路<\/td><td>“点控压制，可以轻松控制住戈娅”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>李白<\/strong><\/td><td>打野<\/td><td>“张良的硬控能控住李白将其击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>王昭君<\/strong><\/td><td>中路／游走<\/td><td>“张良手握两个硬控技能，对阵有长时间引导技能敌人时，可以轻易将其施法打断”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>芈月<\/strong><\/td><td>对抗路／打野<\/td><td>“张良：拥有硬控的英雄可以很好的控制住芈月让她无法随心所欲施放技能”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><str -A22<\/a> 打野先手开团时，小乔的大招是\"必中\"的<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方打野先手切入（尤其是有减速/控制的打野）<\/li><li><strong>判断依据<\/strong>：对面是否正在集火己方打野（站位会聚成一团）<\/li><li><strong>决策分支<\/strong>：直接大招进场压伤害 → 接一技能压状态<\/li><li><strong>反例<\/strong>：「法师要站后排安全输出」——这一波对面已经聚在一起，你的大招收益远大于你多站两秒。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 05:13（\"打野如果开先手……我们直接大招跑过去，技能是必中的\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A23\">K-A23<\/a> 中路有没有线权，看的是\"对面清线速度\"，不是你的血线<\/h3>\n<p>这是<strong>中路通用判据<\/strong>，换任何法师都成立，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。<\/p>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A24\">K-A24<\/a> 一技能蹭野怪：中路顺路的经济，别用普攻<\/h3>\n<p>这是<strong>中路通用动作<\/strong>（\"顺路蹭、别站桩\"），已迁到 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>。小乔的特殊点只有\"一技能边缘能摸到野怪\"这种手感层面，不构成独立判断。<\/p>\n<h2>4. 出装与铭文<\/h2>\n<p><strong>具体铭文组合：未取到干净数据。<\/strong><\/p>\n<p>原因写清楚，免得下次重复踩：标题带\"铭文出装\"的视频（BV1vA411v7C5、BV17s411h76U 等）<strong>字幕轨是错的内容<\/strong>——有的是职场访谈，有的是 LoL 局，说明 ASR 对这类视频根本没有可用语音轨；简介里也没写具体搭配。按规矩，没有原文就不写。<\/p>\n<p><strong>能确认的只有思路层面<\/strong>：小乔是标准 AP 消耗型法师，出装要围绕\"法强 + 法术穿透 + 少量移速\"，对面魔抗堆起来之前先做法穿，魔抗堆起来之后再补穿透类装备。<\/p>\n<ul><li>待补：S45 六件套顺序、铭文红蓝绿配置。补法见本文件末尾。<\/li><\/ul>\n<h2>5. 最容易崩的地方<\/h2>\n<ol><li><strong>把二技能当输出<\/strong>：它只有很短的控制，伤害靠一技能和大招。二技能用空了不可怕，用它换掉对面的关键位移才值。<\/li><li><strong>没线权硬推线<\/strong>：被卡在中路，两边都支援不了，这是小乔最常见的死法。<\/li><li><strong>大招当保命<\/strong>：大招位移很短，交出去之后你就是个站桩法师。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li>出装铭文（见上，需要看画面帧或官网核对）。<\/li><li>与具体英雄的对位结论（现无 <code>B_克制关系/小乔.md<\/code>）。<\/li><\/ul>", "sum": "这是中路通用判据，换任何法师都成立，已迁到 L_分路/01_中路.md 的 K-L01。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/106.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比 ><li><strong>触发条件<\/strong>：己方塔被磨、需要拖时间<\/li><li><strong>判断依据<\/strong>：塔的血量与对面推进速度<\/li><li><strong>决策分支<\/strong>：修塔给塔加护盾（约 600 点量级），换取一波兵线时间<\/li><li><strong>来源<\/strong>：BV13E411p7HY @ 07:06<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A53\">K-A53<\/a> 盾山吃\"沟通\"，不吃操作上限<\/h3>\n<p>开团前确认队友跟不跟，是<strong>所有开团型游走的通用纪律<\/strong>，已迁到 <code><a class=\"kref\" href=\"#K-L17\">K-L17<\/a><\/code>。原句里\"盾山胜率不高是因为队友不了解他\"属于英雄普及度问题，不构成判断。<\/p>\n<h2>6. 待补<\/h2>\n<ul><li>S45 攻速阈值是否变化（铭文那套是 2020 年的）。<\/li><li>完整六件套顺序（素材只给了分场景的出装原则，没有完整列表）。<\/li><li>盾山与鲁班/黄忠/嬴政的对位结论，应整理进 <code>B_克制关系/盾山.md<\/code>。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>出塔方向 = 进塔方向的延长线<\/strong>：<strong>绕一点进塔<\/strong>，出塔位置就离对面远很多——这条不用练，只要改习惯。<\/li><li><strong>二技能箭头放在两人中间<\/strong>：有机会<strong>背两个<\/strong>。<\/li><li><strong>极限距离背和贴脸背的位移距离一样<\/strong>：所以没必要贴脸冒险。<\/li><li><strong>被背的队友让他自己取消<\/strong>：否则有「抛起再落地」的僵直。<\/li><li><strong>大招只击飞一次<\/strong>：窄口和龙坑卡角度封飞行物，别指望它开团。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "开团前确认队友跟不跟，是所有开团型游走的通用纪律，已迁到 K-L17。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/509.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>后羿<\/strong><\/td><td>发育路<\/td><td>“后羿不仅不太灵活容易被盾山抛回，并且后羿依赖的强大正面射击能力被盾山完美克制”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>海诺<\/strong><\/td><td>对抗路／中路<\/td><td>“盾山可以挡掉海诺的1技能，使其丧失输出能力”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>马可波罗<\/strong><\/td><td>发育路<\/td><td>“虽然马可波罗比较灵活，但是其技能子弹方向比较固定，盾山比较容易阻挡其射击”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>吕布<\/strong><\/td><td>对抗路<\/td><td>“吕布大招能够跳跃至盾山身后直接面对后排输出，配合刺客队友，能让盾山无法兼顾防御方向”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>周瑜<\/strong><\/td><td>中路<\/td><td>“周瑜具有强力的清理兵线能力，可以轻松化解正面推进，并且周瑜的技能也不会被盾山所抵挡”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>蒙犽<\/strong><\/td><td>发育路<\/td><td>“改版后的盾山无法承受蒙犽输出的高频火力会被快速的消耗掉能量”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鲁班七号、女娲<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/509.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["roam"], "tempo": "even", "job": "open", "motto": "绕一点进塔，出塔就离对面远很多", "beats": ["后羿", "海诺", "马可波罗"], "loses": ["吕布", "周瑜", "蒙犽"], "main_lane": "roam", "type": "辅助", "unlisted": false, "n": 1, "b_n": 1, "vs": [], "beats_n": 3, "loses_n": 3, "incoming": ["吕布", "周瑜", "蒙犽"], "loses_all": ["吕布", "周瑜", "蒙犽"], "lane_names": ["游走"]}], "general": [{"key": "C", "cat": "BP", "title": "选人五查", "file": "01_选人五查.md", "intro": "<blockquote><p>素材来源是用户提供的《冲击巅峰千强·辅助篇》整理稿（原视频 BV1ydMZ6bE8n，UP：吾家李世公侯，6 小时 / 44 个分 P）。这是<strong>方法论<\/strong>，不是版本答案 —— 它不谈\"谁强\"，只谈\"你这套阵容成不成立\"，所以跨版本仍然有效。<\/p>\n<p>用法：五条是<strong>顺序检查<\/strong>，不是清单。第 1 条不过，后面四条不用看了。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 关：前排够不够？        → K-C01（≥1 个前排点，0.5+0.5 也算 1）\n第 2 关：前期会不会五个人一起弱？→ K-C02（吃钱点已经四个了，就别再来软的）\n第 3 关：有没有控？          → K-C03（零控可以六分投；保命技能不算控）\n第 4 关：强度在不在 T1？      → K-C04（T2 只在克对面时拿）\n第 5 关：你会不会？          → K-C05（所有克制都以熟练度为前提）<\/code><\/pre>", "entries": [{"id": "K-C01", "cat": "C", "title": "第一关查前排：软辅能不能选，取决于\"0.5 + 0.5 够不够 1\"", "self": "<h3><a class=\"kref\" href=\"#K-C01\">K-C01<\/a> 第一关查前排：软辅能不能选，取决于\"0.5 + 0.5 够不够 1\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（判据本身跨版本）<\/li><li><strong>触发条件<\/strong>：你在四五楼，己方已有边路 + 打野 + 中路<\/li><li><strong>判断依据<\/strong>：把己方所有位置的\"前排贡献\"加起来，<strong>健康阵容要 ≥ 1 个完整前排点<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>边路是木兰（半前排）+ 打野是半肉铠（半前排）→ 0.5 + 0.5 = 1 → <strong>这时才可以上软辅<\/strong><\/li><li>边路是元歌这种 0 前排 → 软辅<strong>绝对不能选<\/strong>，哪怕对面阵容完美契合<\/li><li>己方已有完整前排（张飞/牛魔/夏侯惇）→ 你可以自由选功能辅<\/li><li><strong>反例<\/strong>：「我这把孙膑特别好发挥」——好发挥的前提是有人替你吃第一波伤害。没有前排时，孙膑的二技能拉不出任何空间，因为队伍根本没人能站住。<\/li><li><strong>为什么用\"点数\"而不是\"有没有坦克\"<\/strong>：因为半肉战士补一半，两个半肉就等于一个坦。用点数算才不会漏掉「木兰 + 铠」这种看起来没坦其实够用的阵容。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高（UP 个人方法论；\"点数相加\"的算法是他自己提出的简化，逻辑自洽但无数据支撑）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（判据本身跨版本）触发条件：你在四五楼，己方已有边路 + 打野 + 中路判断依据：把己方所有位置的\"前排贡献\"加起来，健康阵容要 ≥ 1 个完整前排点决策分支：边路是木兰（半前…"}, {"id": "K-C02", "cat": "C", "title": "第二关查发育点：辅助不吃钱，但\"五个人前期都弱\"会直接崩", "self": "<h3><a class=\"kref\" href=\"#K-C02\">K-C02<\/a> 第二关查发育点：辅助不吃钱，但\"五个人前期都弱\"会直接崩<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：己方已选三个以上需要发育/需要等级的英雄<\/li><li><strong>判断依据<\/strong>：己方<strong>吃钱点（需要经济和等级才能发力）的数量<\/strong>。四个吃钱点已经是上限<\/li><li><strong>决策分支<\/strong>：<\/li><li>已有四个吃钱点 → 你必须选<strong>前期就能打<\/strong>的（张飞、牛魔、苏烈、东皇）<\/li><li>只有两三个吃钱点 → 可以选孙膑、大乔、明世隐这类\"后期放大器\"<\/li><li><strong>反例<\/strong>：「辅助又不吃钱，多一个发育点没关系」——辅助确实不吃钱，但辅助也<strong>不产生前期强度<\/strong>。四个吃钱点 + 一个软辅 = 前期五个人全是弱的，对面打野第一轮进野区就没有人能拦。<\/li><li><strong>判据来源<\/strong>：<code><a class=\"kref\" href=\"#K-L11\">K-L11<\/a><\/code>（游走的产出是人数差）+ 本条。两条合起来说一件事：<strong>软辅的强度是借来的，借的是队友的前期<\/strong>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：己方已选三个以上需要发育/需要等级的英雄判断依据：己方吃钱点（需要经济和等级才能发力）的数量。"}, {"id": "K-C03", "cat": "C", "title": "第三关查控制：零控可以六分投，但\"保命技能不算控\"", "self": "<h3><a class=\"kref\" href=\"#K-C03\">K-C03<\/a> 第三关查控制：零控可以六分投，但\"保命技能不算控\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：选人最后一位，己方看起来\"有位移有爆发\"<\/li><li><strong>判断依据<\/strong>：能不能<strong>主动开团<\/strong>。区分标准：这个技能能不能\"我先手按出去，然后队友跟上\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有硬开团（张飞大招、苏烈大闪、盾山二闪、钟馗勾）→ 合格<\/li><li>只有软控（减速、短眩晕）→ 需要配一个有硬控的边路/打野补<\/li><li>零硬控 → 这局只能打反手，BP 上已经输了半局<\/li><li><strong>反例<\/strong>：「鲁班二闪、虞姬一闪也是控」——这两个是<strong>保命技能<\/strong>，开不了团。射手和大法师的位移/闪避类技能一律不算控制点，别自我安慰。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中高（\"保命技能不算控\"这个定义是全篇最实用的一句）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：选人最后一位，己方看起来\"有位移有爆发\"判断依据：能不能主动开团。"}, {"id": "K-C04", "cat": "C", "title": "第四关查强度：T2 只在克对面时拿，T3 除非打战力不碰", "self": "<h3><a class=\"kref\" href=\"#K-C04\">K-C04<\/a> 第四关查强度：T2 只在克对面时拿，T3 除非打战力不碰<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（<strong>每条强度榜必须挂日期，本条只给用法不给名单<\/strong>）<\/li><li><strong>触发条件<\/strong>：你想玩的英雄不在当前版本强势区<\/li><li><strong>判断依据<\/strong>：T 度分级 + 对手阵容<\/li><li><strong>决策分支<\/strong>：<\/li><li>T1 及以上 → 直接玩<\/li><li>T2 → <strong>只在明确克制对面某一环时拿<\/strong>，否则换<\/li><li>T3 → 除了打战力/绝活，不碰<\/li><li><strong>为什么不放名单<\/strong>：强度榜 3 周就过时。本库的规矩是「名单类内容必须带统计日期」，所以这里只留判定方法，具体名单看 <code>90_版本变更台账.md<\/code>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：中（分级标准是 UP 个人划分，无官方数据）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（每条强度榜必须挂日期，本条只给用法不给名单）触发条件：你想玩的英雄不在当前版本强势区判断依据：T 度分级 + 对手阵容决策分支：T1 及以上 → 直接玩T2 → 只在明确克制…"}, {"id": "K-C05", "cat": "C", "title": "第五关查熟练度：所有克制关系都以\"你会不会打\"为前提", "self": "<h3><a class=\"kref\" href=\"#K-C05\">K-C05<\/a> 第五关查熟练度：所有克制关系都以\"你会不会打\"为前提<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你打算靠\"克制\"来选人<\/li><li><strong>判断依据<\/strong>：这个克制动作需要多长的反应窗口，你练过没有<\/li><li><strong>决策分支<\/strong>：<\/li><li>动作已成本能（盾山二闪、张飞后段喷、钟馗勾前摇）→ 可以用克制关系选人<\/li><li>还需要\"在脑子里走一遍先二再闪\"→ <strong>这个克制对你不存在<\/strong>，对面走位失误只有 0.5 秒，想完就没了<\/li><li><strong>反例<\/strong>：把克制表当护身符。表上写\"钟馗克墨子\"，但你反应不过来墨子二技能的前摇，这条克制就是不成立的 —— 文档里明确写了「这条有分段门槛」。<\/li><li><strong>推广<\/strong>：这一条把 <code>B_克制关系/<\/code> 整类的可信度前提说清楚了：<strong>B 类记录的是\"机制上成不成立\"，不是\"你能不能打出来\"<\/strong>。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n，BP 分 P）<\/li><li><strong>可信度<\/strong>：高（与 B 类 _说明.md 的「机制克 &gt; 数值克 &gt; 节奏克」分层一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>这五关的排序为什么不能换<\/h2>\n<p>前排决定\"你能不能选软辅\"，前期强度决定\"你会不会被打崩\"，控制决定\"你能不能主动开团\"，强度决定\"数值上亏不亏\"，熟练度决定\"以上四条你能不能兑现\"。<\/p>\n<p>前四条是<strong>阵容层面<\/strong>的，第五条是<strong>人的层面<\/strong>的。文档把熟练度放最后不是因为它最不重要，而是因为它是<strong>否决权<\/strong>：前四条全过，第五条不过，照样别选。<\/p>\n<h2>待补<\/h2>\n<ul><li>版本 T 度名单（需官方/营地数据，且必须带日期）—— 见 <code>90_版本变更台账.md<\/code><\/li><li>对线期的具体克制（B 类负责）<\/li><\/ul>", "sum": "前排决定\"你能不能选软辅\"，前期强度决定\"你会不会被打崩\"，控制决定\"你能不能主动开团\"，强度决定\"数值上亏不亏\"，熟练度决定\"以上四条你能不能兑现\"。"}]}, {"key": "C", "cat": "BP", "title": "组合补缺法", "file": "02_组合补缺.md", "intro": "<blockquote><p>素材来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。原 UP 的原则一句话：<strong>组合只看\"搭配能不能成立\"，先不谈英雄强度<\/strong> —— 这样内容才跨版本。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步：先看队友缺什么 → K-C06\n第 2 步：缺口是不是\"一个技能就能补\" → K-C07\n第 3 步：这个组合有没有\"不能配的人\" → K-C08\n第 4 步：对面组合靠哪一环成立 → K-C09（破解）\n第 5 步：这套组合的强度还在不在 → K-C10（版本折旧）<\/code><\/pre>", "entries": [{"id": "K-C06", "cat": "C", "title": "组合成立的唯一判据：它补上了队友的哪个缺口", "self": "<h3><a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 组合成立的唯一判据：它补上了队友的哪个缺口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在配一套\"XX + YY 很强\"的组合<\/li><li><strong>判断依据<\/strong>：把队友的短板说出来，再看这个辅助是不是正好补它。说不出来就别配<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友<strong>缺开团<\/strong>（刘邦、镜、司空震这类\"能进但开不了团\"）→ 配一个能主动开的<\/li><li>队友<strong>缺一秒爆发<\/strong>（张良捏住只有一秒窗口）→ 配干将、安琪拉、李元芳<\/li><li>队友<strong>缺\"再进一次场的能力\"<\/strong>（大招型英雄进场后没有第二个大）→ 配朵莉亚<\/li><li>队友<strong>缺位移/脱手<\/strong>（短手慢速，开技能时被突）→ 配张飞反打<\/li><li><strong>反例<\/strong>：「两个 T1 拼一起肯定强」——强度不叠加。两个都需要开团时机的英雄配在一起，谁都开不出第一波。<\/li><li><strong>为什么这条能跨版本<\/strong>：缺口是<strong>机制层<\/strong>的（缺开团、缺爆发、缺第二次进场），数值怎么改都不影响\"他缺这个\"。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（方法论自洽，且与 B 类「机制克 &gt; 数值克」的分层一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在配一套\"XX + YY 很强\"的组合判断依据：把队友的短板说出来，再看这个辅助是不是正好补它。"}, {"id": "K-C07", "cat": "C", "title": "双向适配比单向适配值钱：刘邦 × 司空震这类\"互救\"组合", "self": "<h3><a class=\"kref\" href=\"#K-C07\">K-C07<\/a> 双向适配比单向适配值钱：刘邦 × 司空震这类\"互救\"组合<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：评估一个组合的稳定性<\/li><li><strong>判断依据<\/strong>：顺风和逆风两个方向，这套组合是不是都成立<\/li><li><strong>决策分支<\/strong>：<\/li><li>只在一个方向成立 → 是\"顺风组合\"，逆风直接废<\/li><li>两个方向都成立 → 才是可以当主体系的组合<\/li><li><strong>例子（文档原例）<\/strong>：刘邦 + 镜/司空震/宫本。顺风时刘邦落点控帮它留人；<strong>逆风时刘邦开大上天能防它\"坠机\"<\/strong>。同一个人，顺风是\"雪球\"，逆风是\"保险\"。<\/li><li><strong>反例<\/strong>：只看顺风的组合最容易骗人。你在匹配里用着很爽，一到逆风局就发现自己没有任何翻盘手段。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：评估一个组合的稳定性判断依据：顺风和逆风两个方向，这套组合是不是都成立决策分支：只在一个方向成立 → 是\"顺风组合\"，逆风直接废两个方向都成立 → 才是可以当主体系的…"}, {"id": "K-C08", "cat": "C", "title": "\"不能配谁\"比\"能配谁\"更该记：朵莉亚 × 马可波罗/海月", "self": "<h3><a class=\"kref\" href=\"#K-C08\">K-C08<\/a> \"不能配谁\"比\"能配谁\"更该记：朵莉亚 × 马可波罗/海月<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你想用\"刷大招\"型辅助（朵莉亚、元辅、太乙）<\/li><li><strong>判断依据<\/strong>：队友<strong>进场后还剩多少血<\/strong>。刷出来的第二个大，他要不要再进一次场<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友开大进场后血量健康 → 刷大成立（吕布、铠、杨玉环、敖隐、后羿、夏侯惇；嬴政、王昭君这类大范围分割）<\/li><li>队友进场后血已经掉一半 → <strong>刷了也不敢再进<\/strong>，这条组合不成立（马可波罗、海月）<\/li><li><strong>反例<\/strong>：「多给一个大总是好的」——多给一个大，但他不敢进场，等于这个技能只缩短了 CD，没有换来第二次入场。辅助的价值全在\"第二次\"上。<\/li><li><strong>推广<\/strong>：这条同样适用于太乙真人的复活、鲁班大师的链子 —— <strong>任何\"再来一次\"型技能，都要问队友敢不敢再来。<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你想用\"刷大招\"型辅助（朵莉亚、元辅、太乙）判断依据：队友进场后还剩多少血。"}, {"id": "K-C09", "cat": "C", "title": "破解对面组合：不看它多强，看它靠哪一环成立，掐那一环", "self": "<h3><a class=\"kref\" href=\"#K-C09\">K-C09<\/a> 破解对面组合：不看它多强，看它靠哪一环成立，掐那一环<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面已经选出一套明显有配合的阵容<\/li><li><strong>判断依据<\/strong>：这套组合的<strong>关键一环<\/strong>是哪个技能/哪一秒<\/li><li><strong>决策分支<\/strong>：<\/li><li>组合靠\"一秒窗口\"成立（张良捏人）→ 拿<strong>能拆火<\/strong>的（阿古朵、武则天），或让被捏的人提前出复活甲<\/li><li>组合靠\"霸体免控\"成立（廉颇）→ 拿<strong>压制<\/strong>（张良），压制能断霸体<\/li><li>组合靠\"拉扯\"成立（孙膑体系）→ 拿<strong>能捆住的<\/strong>（老夫子大闪五秒）<\/li><li>组合靠\"藏视野抓边\"成立（张良、鬼谷子）→ 拿<strong>破隐/反视野<\/strong>的<\/li><li><strong>反例<\/strong>：「对面组合强，我们也堆一套组合」——两套组合对撞，赢的是\"谁的关键一环先被掐\"。先想掐，再想堆。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）。具体对位见 <code>B_克制关系/<\/code><\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面已经选出一套明显有配合的阵容判断依据：这套组合的关键一环是哪个技能/哪一秒决策分支：组合靠\"一秒窗口\"成立（张良捏人）→ 拿能拆火的（阿古朵、武则天），或让被捏的…"}, {"id": "K-C10", "cat": "C", "title": "组合会折旧：养马流为什么掉了", "self": "<h3><a class=\"kref\" href=\"#K-C10\">K-C10<\/a> 组合会折旧：养马流为什么掉了<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在用一个\"老版本很强\"的体系<\/li><li><strong>判断依据<\/strong>：这套体系是靠<strong>几个技能叠起来的<\/strong>。叠的层数越多，被砍一层的损失越大<\/li><li><strong>例子（文档原例）<\/strong>：孙膑 + 马超的\"养马流\"。原本是\"阿古朵一技能给队友加速 + 孙膑二技能叠移速\"两层叠加；<strong>阿古朵的一技能加速被取消后，只剩孙膑二技能还能叠移速，体系强度直接掉下来<\/strong>。<\/li><li><strong>决策分支<\/strong>：<\/li><li>体系只依赖一个技能 → 相对稳定<\/li><li>体系依赖两三个技能的叠加 → 每个版本都要重新验证，别当默认答案<\/li><li><strong>推广<\/strong>：这条是本库 <code>90_版本变更台账.md<\/code> 存在的理由 —— 组合类结论必须记\"它是靠几层叠起来的\"，被砍时才知道掉了多少。<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>每套组合的\"折旧日期\"（要靠版本公告逐条核，还没做）<\/li><li>对抗路/打野位的组合（本文档只覆盖辅助视角）<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在用一个\"老版本很强\"的体系判断依据：这套体系是靠几个技能叠起来的。"}]}, {"key": "C", "cat": "BP", "title": "组合速查表", "file": "03_组合速查表.md", "intro": "<blockquote><p><strong>用之前先做两件事。<\/strong> 第一，读 <code>02_组合补缺.md<\/code> 的 <a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 到 <a class=\"kref\" href=\"#K-C10\">K-C10<\/a> —— 这张表是判据的<strong>举例<\/strong>，不是命令。 第二，按 <a class=\"kref\" href=\"#K-C10\">K-C10<\/a> 问一句：这套组合靠几层叠起来的？最近有没有被砍？（表是 2026-10 录制时的经验，不是版本答案。）<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>辅助<\/th><th>配谁<\/th><th>补的是什么缺口<\/th><\/tr><\/thead><tbody><tr><td>孙膑<\/td><td>马超<\/td><td>叠移速。<strong>注意：阿古朵一技能加速取消后已折损一层<\/strong>（<a class=\"kref\" href=\"#K-C10\">K-C10<\/a>）<\/td><\/tr><tr><td>刘邦<\/td><td>镜 / 司空震 / 宫本<\/td><td>补\"开团弱、找机会弱\"；逆风开大上天能防\"坠机\"（双向适配，<a class=\"kref\" href=\"#K-C07\">K-C07<\/a>）<\/td><\/tr><tr><td>张良<\/td><td>干将 / 安琪拉 / 李元芳<\/td><td>捏住后只有一秒窗口，必须配一秒能灌死人的爆发<\/td><\/tr><tr><td>朵莉亚<\/td><td>吕布 / 铠 / 杨玉环 / 敖隐 / 后羿 / 夏侯惇 / 嬴政 / 王昭君<\/td><td>补\"第二次进场\"。<strong>不适配马可波罗、海月<\/strong>（进场血掉一半，多刷一个也不敢再进，<a class=\"kref\" href=\"#K-C08\">K-C08<\/a>）<\/td><\/tr><tr><td>张飞<\/td><td>李元芳 / 蒙犽<\/td><td>李元芳挂塔推塔，张飞把塔下人喷走；蒙犽短手慢速开一技能时被突，张飞反打<\/td><\/tr><tr><td>钟馗<\/td><td>小乔 / 安琪拉<\/td><td>钟馗大招有前摇，靠队友补一段控，不用交冰甲也能吸住<\/td><\/tr><tr><td>鲁班大师<\/td><td>李元芳 / 元坦 / 杨戬 / 王昭君 / 大司命 / 公孙离<\/td><td>李元芳滚脸后拉链子回来骗技能；\"有进无出\"的坦度英雄靠链子吃一波再撤<\/td><\/tr><tr><td>元辅（台子）<\/td><td>狄仁杰 / 虞姬 / 敖隐 / 甄姬<\/td><td>台子上走位空间小，靠这几个自己的二技能/霸体下台拉扯；三技能都能吃满台子的距离加成<\/td><\/tr><tr><td>太乙真人<\/td><td>孙尚香 / 成吉思汗<\/td><td>经典\"真香\"；香香强势期被 ban 就换狼狗<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>表怎么读<\/h2>\n<ol><li>在第二列找到你队友的英雄<\/li><li>读第三列\"补的是什么缺口\"<\/li><li>问自己：<strong>这个缺口我现在真的缺吗？<\/strong><\/li><\/ol>\n<ul><li>缺 → 这套成立<\/li><li>不缺（比如队友已经有人能开团）→ 这套对你不成立，换一个<\/li><\/ul>\n<p><strong>举例<\/strong>：队友选了镜，你打算配刘邦。镜缺的是\"开团/找机会\"，刘邦的大招落点控正好补上，顺风留人、逆风防坠机 —— 成立。但如果你的边路已经是张飞、中路是张良（都能开），那刘邦补的这个缺口就是重复的，这时你更需要的是前期强度。<\/p>\n<h2>表里没有的组合怎么办<\/h2>\n<p>用 <a class=\"kref\" href=\"#K-C06\">K-C06<\/a> 的四步自己推：<\/p>\n<ul><li>队友<strong>能进但开不了团<\/strong> → 找能主动开的<\/li><li>队友<strong>控住人但打不死<\/strong> → 找一秒爆发的<\/li><li>队友<strong>开完大就没有第二次<\/strong> → 找能刷大的<\/li><li>队友<strong>手短、开技能时不能动<\/strong> → 找能反打的<\/li><\/ul>\n<p>推不出来就别硬配。<strong>组合的目的是补缺口，不是凑两个 T1。<\/strong><\/p>\n<h2>待补<\/h2>\n<ul><li>每套组合的\"折旧日期\"（要逐条对版本公告核，还没做）<\/li><li>打野位/对抗路位的组合（本文档只覆盖辅助视角）<\/li><li>表中组合的实战录像对照（目前只有口述，没有逐帧验证）<\/li><\/ul>", "entries": []}, {"key": "C", "cat": "BP", "title": "04 分路推荐与克制选人", "file": "04_分路推荐与克制选人.md", "intro": "<blockquote><p>素材说明：四份素材里，只有两份能用。<\/p>\n<ol><li><strong>BV1nPJk6uEiN<\/strong>，白衣游戏说《新赛季全分路上分推荐》。<strong>分路榜视角<\/strong>：按对抗路 / 发育路 / 打野 / 辅助 / 中路逐个点名，每个英雄报\"顶端巅峰赛\"和\"全分段\"两个胜率，个别报禁用率。UP 没有说明胜率来自哪个平台、统计到哪天、样本多大。UP 未标注发布日期。<\/li><li><strong>BV1ADbL6xEYJ<\/strong>，晚风风《老虎顶分保姆级实战教学·进攻节奏终极模版》。<strong>单英雄单局视角<\/strong>：主播自述是\"国服老虎江县的一把近 2500 的顶分局\"（@ 00:05），讲的是开局怎么读双方阵容、怎么用中轴反野。UP 未标注发布日期。<\/li><li><strong>BV1Tqx76wE7c<\/strong>，小弯为所欲为《完美克制老夫子》。<strong>素材失效<\/strong>：标题写的是老夫子克制，字幕全文是闽菜探店加猜价格，正文里\"老夫子\"出现 0 次。本卡未采用，也不代为补写。<\/li><li><strong>BV1PxxT6fErn<\/strong>，青云ovq《粉丝对位1w9打野复盘》。<strong>素材失效<\/strong>：标题写的是打野对位复盘，字幕全文是试驾小米 SU7 的 vlog，没有任何一局对位内容。本卡未采用。<\/li><\/ol>\n<p>以上全部是<strong>个人经验与单局复盘，不是官方数据<\/strong>。所有胜率、禁用率都是 UP 口播或引用，没有口径、没有日期、没有样本量。本卡把它们当\"方向\"用，不当\"结论\"用。凡是\"谁强、谁值得抢\"的判断，可信度一律压低，并在条目里写明来源性质。<\/p>\n<p>用法：判断顺序是从\"你在哪个分段\"往下推，不是从\"谁是 T1\"往下抄。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步  先锁分段，再念英雄名            → K-C11（两段胜率差 &gt; 5 个点是分段特化，不是强弱）\n第 2 步  分清\"必抢\"和\"补位\"              → K-C15（能\"放出来就抢\"的只有盾山这类，抢不到才是常态）\n第 3 步  打野位先数对面前期强度点          → K-C14（中路没线权、辅助不跟，就别一抢老虎）\n第 4 步  对抗路先划雷区，再挑容错型        → K-C12 → K-C13（名单缺失时退回\"容错率\"这一层）\n第 5 步  要打克制，先问 BP 上克不克得动    → K-C16（大乔：克在\"能不能开到她\"，不在\"选谁\"）\n第 6 步  把同一套克制换成分段收益          → K-C17（哪吒在低分段是克制，在高分段是配合）\n第 7 步  最后过一遍榜单可信度              → K-C20 → K-C18 / K-C19（先问\"谁在玩\"，再问\"适不适配\"）<\/code><\/pre>", "entries": [{"id": "K-C11", "cat": "C", "title": "先定分段再定英雄：同一个英雄两个分段差 5 个点以上，就不是强弱问题而是适配问题", "self": "<h3><a class=\"kref\" href=\"#K-C11\">K-C11<\/a> 先定分段再定英雄：同一个英雄两个分段差 5 个点以上，就不是强弱问题而是适配问题<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在选人时想\"这个英雄到底强不强\"，但还没确认这一局的实际分段<\/li><li><strong>判断依据<\/strong>：素材给每个英雄都报了两个数——\"顶端巅峰赛胜率\"和\"全分段胜率\"。<strong>两个数的差值比数值本身信息量更大<\/strong>：差值小说明英雄机制在全段位都站得住，差值大说明它的强度依赖特定分段的对局质量（@ 03:10）（@ 04:48）（@ 07:02）（@ 10:14）（@ 10:52）<\/li><li><strong>决策分支<\/strong>：<\/li><li>两段差 &lt; 2 个点且口径一致（影 49/51、小乔 48/48）→ 全段位可用，谁拿都不容易崩，可以放心当补位选择<\/li><li>全分段明显高于顶端（赵云 48/54、哪吒 49/52）→ 低分段特化。素材对赵云的表述是\"巅峰赛 1800 分以下，或者你想排位上分，强烈建议你玩赵云\"（@ 10:56）<\/li><li>顶端明显高于全分段（孙尚香 54/46、公孙离 51/42、关羽 52/46、裴擒虎 50/44）→ 高端局特化。低分段拿等于自己放弃数值<\/li><li><strong>反例<\/strong>：看到\"孙尚香巅峰赛胜率 54%\"就在低分段一手锁。素材同一条里的后半句是\"全分段胜率只有 46%\"（@ 04:51），UP 自己的解释是\"高手和新手的差距\"（@ 04:53）。同一段话里两个数，只抄对自己有利的那个，就是拿榜单骗自己。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 03:10<\/li><li><strong>可信度<\/strong>：低。单源个人经验；两段胜率均无统计口径、无日期、无样本量，UP 也没说明\"顶端\"具体是多少分以上。本条只用\"差值方向\"，不用绝对值。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在选人时想\"这个英雄到底强不强\"，但还没确认这一局的实际分段判断依据：素材给每个英雄都报了两个数——\"顶端巅峰赛胜率\"和\"全分段胜率\"。"}, {"id": "K-C12", "cat": "C", "title": "对抗路先用排除法划雷区，再谈选谁——但\"四七兄弟\"的名单素材里没有", "self": "<h3><a class=\"kref\" href=\"#K-C12\">K-C12<\/a> 对抗路先用排除法划雷区，再谈选谁——但\"四七兄弟\"的名单素材里没有<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在补对抗路，还没有明确人选，手上只有一份\"推荐榜\"<\/li><li><strong>判断依据<\/strong>：素材开口第一句不是排名，是排除法——\"对抗路四七兄弟大家都听说过吗，只要你不玩这四个英雄呀，剩下的都挺好上分的\"（@ 00:03），讲完这句才开始排第六到第一。也就是说它的推荐结构是<strong>先划雷区、再排序<\/strong>，不是\"从上往下抄\"。<\/li><li><strong>决策分支<\/strong>：<\/li><li>你自己分段打过、心里有四七兄弟的名单 → 先划掉，剩下的按 <a class=\"kref\" href=\"#K-C11\">K-C11<\/a> 的分段适配挑<\/li><li>你没有这份名单 → 这条对你只有方法没有内容，直接退回 <a class=\"kref\" href=\"#K-C13\">K-C13<\/a>，用\"容错率\"这一层挑<\/li><li>看到榜单序号就当强度序 → 错，见反例<\/li><li><strong>反例<\/strong>：把\"第六名到第一名\"当成\"从弱到强\"的梯度。曹操排第六，却是 UP 第一个讲的（@ 00:08）；关羽排第一，同时是全分段胜率最低的 46%（@ 03:13）。他的序号是<strong>上分推荐序<\/strong>，不是强度序——第一名是最\"吃队友\"的那个，不是最\"强\"的那个。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 00:03<\/li><li><strong>可信度<\/strong>：低。单源个人经验，且<strong>关键名单缺失<\/strong>：素材全文只提了\"四七兄弟\"这个名字，从头到尾没说是哪四个英雄。本条只能给方法，不能给名单，不要自行补全。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在补对抗路，还没有明确人选，手上只有一份\"推荐榜\"判断依据：素材开口第一句不是排名，是排除法——\"对抗路四七兄弟大家都听说过吗，只要你不玩这四个英雄呀，剩下的都挺好…"}, {"id": "K-C13", "cat": "C", "title": "对抗路优先选\"容错型\"而不是\"上限型\"：打不过也不会崩，比打得过更重要", "self": "<h3><a class=\"kref\" href=\"#K-C13\">K-C13<\/a> 对抗路优先选\"容错型\"而不是\"上限型\"：打不过也不会崩，比打得过更重要<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对抗路候选里同时有吃手法的（司空震）和不怎么吃手法的（亚瑟、影、曹操）<\/li><li><strong>判断依据<\/strong>：素材给这几个人的推荐理由，全部落在\"容错\"上，而不是伤害上：<\/li><li>曹操的抓手是新召唤师技能位移远、\"卡墙位移的话更远\"，能切到对面 C 位（@ 00:15）（@ 00:22）<\/li><li>亚瑟\"舍弃传统的暗影战斧，出装就出纯肉装……照样有伤害，而且容错还很高\"（@ 00:44）<\/li><li>影\"大招自带复活甲，容错直接拉满了\"（@ 02:11）<\/li><li>司空震被单独挑出来说\"胜率就没这么高了，主要是玩的人太多了，但水平参差不齐\"，会玩的才在线上打出优势（@ 02:25）（@ 02:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>你要稳一手、不想被单杀滚雪球 → 亚瑟 / 影。素材对亚瑟补了一句\"用亚瑟上个 1800 分是绝对没有问题的\"（@ 01:35）<\/li><li>对面 C 位在后排、需要越墙才能摸到 → 曹操 + 悟行千山，\"卡墙位移的话更远\"，容易切到对面 C 位（@ 00:22）（@ 00:24）<\/li><li>你有手法、就是要线上压制 → 司空震，远程普攻消耗 + 找时机单杀（@ 02:29）<\/li><li>你选亚瑟但准备待在线上对线 → 错，素材明确说\"亚瑟的精髓就是一定要多游走，往往你在线上是打不出什么优势的\"（@ 00:49）（@ 00:53）<\/li><li><strong>反例<\/strong>：把\"胜率高\"当选人唯一标准。司空震顶端 49%、全分段 48%（@ 02:21）（@ 02:23），顶端值和影的 49%（@ 01:57）完全一样，但素材对司空震的评价明显保留——胜率数字没告诉你\"是谁在玩这个英雄\"。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 00:44<\/li><li><strong>可信度<\/strong>：低。单源个人经验；\"容错高\"是 UP 的主观归类，四件装备/技能的说法没有对局数据支撑。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：对抗路候选里同时有吃手法的（司空震）和不怎么吃手法的（亚瑟、影、曹操）判断依据：素材给这几个人的推荐理由，全部落在\"容错\"上，而不是伤害上：曹操的抓手是新召唤师技能位…"}, {"id": "K-C14", "cat": "C", "title": "打野位一抢老虎的前提：对面数不出第二个前期强度点，且中路有线权", "self": "<h3><a class=\"kref\" href=\"#K-C14\">K-C14<\/a> 打野位一抢老虎的前提：对面数不出第二个前期强度点，且中路有线权<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在高顺位考虑一抢裴擒虎；或对面打野已亮、你在判断要不要拿老虎对位<\/li><li><strong>判断依据<\/strong>：三条约束叠在一起才成立：<\/li><li><strong>曲线<\/strong>：老虎\"前期强、中期偏强、后期弱\"（@ 00:57），后期\"输出模式单一、团战作用低、带线还容易被抓\"（@ 00:53）。所以它必须在前中期换出经济差或资源差，拖后期就是亏<\/li><li><strong>门槛<\/strong>：能不能反野不看你想不想。\"首先看中路有没有线权，再看你辅助的位置，你一个人进去打两个，那肯定是打不过的\"（@ 10:31）（@ 10:35）<\/li><li><strong>读法<\/strong>：顶分局是先\"数前期强度点\"再定走向——\"我们老虎炸弹猫都是前期合（字幕转写如此，语境指前期强），而对面只有一个猪是前期有强度的，这么一整理，我们老虎的前期走向规划就清楚了，以中轴为主抢线打进攻人数差\"（@ 01:20）（@ 01:27）（@ 01:29）<\/li><li><strong>决策分支<\/strong>：<\/li><li>己方中路有线权 + 辅助能跟 + 对面前期强度点 ≤ 1 → 可以先抢。开局按素材的顺序走：不拿自己 Buff、卡中左草、抢中线、再反野、然后控边野（@ 01:32）（@ 02:13）<\/li><li>中路是清线慢的法师，或辅助是软辅 → <strong>不先抢<\/strong>。老虎拿不到野区主动权就是个后期弱的白板<\/li><li>对面已经亮出两个以上前期强势点 → 换人。素材给的替代方向是\"全靠数值\"的赵云（@ 11:02）<\/li><li>对面缩塔不出来 → 别硬抓，\"人抓不到咱就推塔呗，快速拔塔也是老虎的优势之一\"（@ 10:42）（@ 10:45）<\/li><li><strong>反例<\/strong>：看视频里老虎反野很顺就跟着入侵。素材自己列了两条前提，还补了\"敌方比较聪明猥琐在塔里\"这种情况（@ 10:39）——反野是条件成立之后的结果，不是开局动作。条件不成立时一抢老虎，等于把胜负交给对面中路。<\/li><li><strong>来源<\/strong>：BV1ADbL6xEYJ @ 01:20；BV1nPJk6uEiN @ 10:31<\/li><li><strong>可信度<\/strong>：中。两个 UP 各出一份<strong>个人经验<\/strong>，非官方数据，但两处独立指向同一组约束（中路线权 / 辅助位置 / 前期强度点数量），构成交叉验证；晚风素材是单局复盘（n=1），样本仍不足。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在高顺位考虑一抢裴擒虎；"}, {"id": "K-C15", "cat": "C", "title": "辅助位真正的\"克制\"在 ban 位：能被放出来就该抢，抢不到才是常态", "self": "<h3><a class=\"kref\" href=\"#K-C15\">K-C15<\/a> 辅助位真正的\"克制\"在 ban 位：能被放出来就该抢，抢不到才是常态<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：BP 阶段，你在辅助位；或对面辅助已亮，你在想要不要找 counter<\/li><li><strong>判断依据<\/strong>：<\/li><li>盾山顶端 55%、全分段 53%（@ 15:16）。素材的评价是\"你只要放出来抢到了，那基本上都能稳赢\"，紧接着说\"唯一的缺点就是不太容易放出来\"（@ 15:20）（@ 15:40）<\/li><li>元辅顶端 50%，<strong>禁用率高达 80%<\/strong>（@ 15:45）（@ 15:47）<\/li><li>元辅那一段的收尾是\"我实在想不出来什么英雄可以克制元辅了\"（@ 16:12）——这句话本身就是对\"靠选人解\"的否定<\/li><li><strong>决策分支<\/strong>：<\/li><li>你在 ban 位 → 优先处理这两个。素材给的判断是\"放不出来\"才是它们真正的限制，不是\"打不过\"<\/li><li>对面放出来、你先选 → 直接锁，这一手不需要想克制<\/li><li>对面已经锁了盾山 → 别指望用某个英雄反制。素材给的解法是配组合：\"如果队友再来一个鲁班 7 号，你俩组成僵王博士，那就更好了\"（@ 15:25），不是找 counter<\/li><li>你打算用元辅但分段不高 → 先想清楚。素材说\"中低分段队友可能不太配合，不容易上分\"，段位高一点才知道二技能是干什么的（@ 16:04）（@ 16:09）<\/li><li><strong>反例<\/strong>：在 ban 位纠结\"我打不过谁就 ban 谁\"，结果把 80% 禁用率的元辅放出来（@ 15:47）。ban 位是选人阶段唯一的确定性手段，把它花在个人对线阴影上，是最贵的一种浪费。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 15:40<\/li><li><strong>可信度<\/strong>：低。单源个人经验；\"稳赢\"是口播夸张词，55% 的胜率不等于稳赢；80% 禁用率没有数据口径和日期。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：BP 阶段，你在辅助位；"}, {"id": "K-C16", "cat": "C", "title": "克制关系怎么用：大乔\"怕控制\"克的是\"能不能开到她\"，不是\"你选了谁\"", "self": "<h3><a class=\"kref\" href=\"#K-C16\">K-C16<\/a> 克制关系怎么用：大乔\"怕控制\"克的是\"能不能开到她\"，不是\"你选了谁\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面已锁大乔，你想在选人阶段拿一手\"克她的\"；或者你自己要拿大乔，对面有强开团<\/li><li><strong>判断依据<\/strong>：素材里这两句必须一起读，顺序很关键：<\/li><li>先给结论：\"现在基本上也没什么阵容体系能克制大乔吧\"（@ 18:33）<\/li><li>再给机制：\"其实大乔主要是怕控制，遇到对面有什么苏烈关羽啥的，咱们最好还是带净化\"（@ 18:36）（@ 18:38）<\/li><li>最后给后果：\"不然被对面开到了，根本就没有机会坐天梯回家\"（@ 18:41）<\/li><li><strong>克在哪个机制<\/strong>：断的是<strong>回城 / 传送这个动作<\/strong>，不是伤害。控制命中 → 大乔被开 → 她坐不了电梯 → 整个运营体系停摆。所以判据是\"你的控制能不能落到她身上\"，不是\"你的伤害够不够\"。<\/li><li><strong>决策分支<\/strong>：<\/li><li>你是克方，对面大乔 → 选强开团 + 硬控（素材点名苏烈、关羽），并且<strong>必须确保能开到她<\/strong>：她站在队伍最后排、或者手里有净化，你这手就是空的<\/li><li>你是大乔方，对面有苏烈 / 关羽 → \"最好还是带净化\"（@ 18:40）。这是素材给的直接应对，带上净化，这个克制就不成立<\/li><li>你是大乔方，不管对面有没有强开 → 别自己出去带线。\"你千万别和玩中路大乔一样，老自己出去带线\"（@ 18:44）；跟队友走才有牌（@ 18:40）<\/li><li><strong>失效条件（任一成立，这条克制就没了）<\/strong>：① 大乔带净化（@ 18:40）；② 你的开团落不到她身上（她站后排 / 你被先手打断）；③ 她不单独行动、始终跟队友抱团——素材说的\"只要你一直跟着队友走\"（@ 18:40）<\/li><li><strong>反例<\/strong>：以为\"选了苏烈就克大乔\"，选完就不再管。素材的话序是\"没什么体系能克制\"在前、\"怕控制\"在后——它在说：<strong>克制存在于执行层，不存在于阵容层<\/strong>。你开不到她，克制一点没兑现，你只是多选了个前排。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 18:33（同段另见 @ 18:36、@ 18:38、@ 18:40、@ 18:41、@ 18:44）<\/li><li><strong>可信度<\/strong>：中。单源个人经验，但机制链条完整（控制 → 无法回城 → 断运营）、可局内验证，且与\"位移/传送类英雄怕硬控\"的通用认知一致；没有任何对局数据。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面已锁大乔，你想在选人阶段拿一手\"克她的\"；"}, {"id": "K-C17", "cat": "C", "title": "同一套克制，分段不同收益不同：哪吒锁头克的是\"没人保的 C 位\"，不是\"C 位\"", "self": "<h3><a class=\"kref\" href=\"#K-C17\">K-C17<\/a> 同一套克制，分段不同收益不同：哪吒锁头克的是\"没人保的 C 位\"，不是\"C 位\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在低分段对局，对面 C 位没有队友专门保护，你在考虑拿哪吒做强开点<\/li><li><strong>判断依据<\/strong>：素材把哪吒的强弱直接绑在分段上，而不是绑在英雄上：\"段位越低，玩哪吒越容易上分。因为低段位的一些人，他不知道哪吒该怎么处理，队友也不会保护 C 位，一被哪吒锁头基本上就没了\"（@ 02:49）（@ 02:53）（@ 02:57）<\/li><li><strong>决策分支<\/strong>：<\/li><li>低分段 + 对面队友不保 C 位 → 拿。克制点是\"锁头强开单点\"，对面既没意识也没手段反制<\/li><li>高端局 → 仍然能玩，但<strong>打法必须换<\/strong>：\"就是要根据情况释放大招，尽量和队友沟通，发信号一起上，别你一个人冲进去献祭\"（@ 03:01）（@ 03:05）。从\"单点秒 C\"变成\"跟队友的第二手进场\"<\/li><li>触发失效：对面会保 C 位——素材给低分段的判据是\"队友也不会保护 C 位\"（@ 02:57），反过来，队友会保，这手锁头就进不去；进去打不死，克制就变成送人头<\/li><li><strong>反例<\/strong>：把低分段的\"一锁头就没了\"原样搬到高分段。同一个英雄，顶端 49%、全分段 52%（@ 02:45）——差的这 3 个点，就是\"对面会不会保 C、你会不会等队友\"。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 02:49<\/li><li><strong>可信度<\/strong>：低。单源个人经验；\"低段位不知道处理\"是 UP 的主观判断，没给具体分段区间；胜率无口径。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在低分段对局，对面 C 位没有队友专门保护，你在考虑拿哪吒做强开点判断依据：素材把哪吒的强弱直接绑在分段上，而不是绑在英雄上：\"段位越低，玩哪吒越容易上分。"}, {"id": "K-C18", "cat": "C", "title": "射手位先看\"新召唤师技能适配\"，再看英雄本身：黄忠是这一版的直接受益者", "self": "<h3><a class=\"kref\" href=\"#K-C18\">K-C18<\/a> 射手位先看\"新召唤师技能适配\"，再看英雄本身：黄忠是这一版的直接受益者<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：发育路选人，候选里有黄忠这类开大后原地输出、依赖站位的射手，也有孙尚香、公孙离这类自带位移的<\/li><li><strong>判断依据<\/strong>：<\/li><li>悟行千山给黄忠补上了位移：从\"开大之后就是活靶子\"变成\"移动炮台\"，可以\"边位移边释放大炮轰击\"，还能躲关键技能、用来追击（@ 03:52）（@ 03:56）（@ 04:05）<\/li><li>这个技能的 CD 是 100 秒，\"比闪现更短\"，所以\"团战容错率远高\"（@ 04:07）（@ 04:10）<\/li><li>蒙犽是另一类受益，但方向不同：改动后\"没有红怒一技能也可以穿透兵线了，可以说是大大提高前期对线能力\"（@ 04:19）（@ 04:22）<\/li><li><strong>决策分支<\/strong>：<\/li><li>你会站桩、队伍有人保 → 黄忠 + 悟行千山，这一手的收益最大（全分段 53%，@ 03:43）<\/li><li>你有手法、要上限 → 孙尚香 / 公孙离，但先过 <a class=\"kref\" href=\"#K-C20\">K-C20<\/a> 的手法门槛（公孙离\"需要一定的手法加持\"，@ 07:06）<\/li><li>你要前期对线压制、抢线权 → 蒙犽，靠穿透兵线滚雪球（@ 04:22）<\/li><li>你想把悟行千山给孙尚香 → 素材的答案不是她：\"要说射手里面最适合这个新召唤师技能的是谁呢，那一定是这个黄忠\"（@ 03:48）（@ 03:51）；孙尚香本身有位移（@ 04:59）<\/li><li><strong>反例<\/strong>：按老印象选黄忠——\"之前的黄忠开大之后就是活靶子\"（@ 03:52）。版本塞给他一个技能，选人判断就得跟着改；反过来，看到\"适合新技能的射手\"就以为所有射手都吃这波红利，也错——素材给的答案是\"那一定是这个黄忠\"（@ 03:51），不是全体。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 03:48<\/li><li><strong>可信度<\/strong>：低。单源个人经验；\"完全换了一个英雄\"是口播形容，没有对局数据；53% 胜率无口径。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：发育路选人，候选里有黄忠这类开大后原地输出、依赖站位的射手，也有孙尚香、公孙离这类自带位移的判断依据：悟行千山给黄忠补上了位移：从\"开大之后就是活靶子\"变成\"移动炮台…"}, {"id": "K-C19", "cat": "C", "title": "中路选人看\"清线 + 大招落点 + 进场时机\"，不是看中路胜率排名", "self": "<h3><a class=\"kref\" href=\"#K-C19\">K-C19<\/a> 中路选人看\"清线 + 大招落点 + 进场时机\"，不是看中路胜率排名<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中路补位，候选全是 48%~52% 的中间档法师，靠胜率分不出高下<\/li><li><strong>判断依据<\/strong>：素材给的中路五个人，胜率几乎全挤在同一个区间——小乔 48/48（@ 16:23）、沈梦溪 50/49（@ 16:56）、王维 52/51（@ 17:25）、嫦娥 51/54（@ 17:56）、海月 50/50（@ 18:47）。这个区间里胜率排序没有意义，真正区分他们的是三件事：<\/li><li><strong>清线 / 野区节奏<\/strong>：海月\"前期一技能清线，四级之后随机挑选幸运观众\"（@ 18:55）（@ 18:57）；嫦娥强在\"出色的野区压制能力和支援能力\"，靠\"一技能定住，配合上大招\"打伤害（@ 18:04）（@ 18:07）<\/li><li><strong>大招落点<\/strong>：沈梦溪\"大招炸弹尽量要炸对面的后排\"（@ 17:20）<\/li><li><strong>进场时机<\/strong>：王维\"尽量后手进场，别先手开团\"（@ 17:49）<\/li><li><strong>决策分支<\/strong>：<\/li><li>队伍缺压后排的手段 → 沈梦溪，大招往 C 位砸（@ 17:20）<\/li><li>队伍怕逆风、需要守塔 → 嫦娥，二技能拉扯兵线，\"守塔能守住，那就有机会翻盘\"（@ 18:14）<\/li><li>对面有单点核心、需要一个 1v1 解法 → 海月，四级后\"随机挑选幸运观众，关起来 1V1 基本上都能打得过\"（@ 18:59）<\/li><li>你自己容易被集火、队伍开团有人 → 王维，后手进场（@ 17:49）<\/li><li><strong>反例<\/strong>：拿\"中路第一名\"当答案。素材里排第一的海月是 50%（@ 18:47），排第五的沈梦溪也是 50%（@ 16:56）——这个区间的差值落在噪声里。选谁取决于你的阵容缺什么，不取决于谁排第一。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 17:20<\/li><li><strong>可信度<\/strong>：低。单源个人经验；五人胜率均无口径，且区间过窄（48~52）本就不足以排序。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45触发条件：中路补位，候选全是 48%~52% 的中间档法师，靠胜率分不出高下判断依据：素材给的中路五个人，胜率几乎全挤在同一个区间——小乔 48/48（@ 16:23）、沈梦溪…"}, {"id": "K-C20", "cat": "C", "title": "胜率榜不能直接当选人榜：出场率和手法会把强英雄的胜率压下去", "self": "<h3><a class=\"kref\" href=\"#K-C20\">K-C20<\/a> 胜率榜不能直接当选人榜：出场率和手法会把强英雄的胜率压下去<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你看中一个英雄，但它的胜率只有 47%~48%，你在犹豫要不要拿<\/li><li><strong>判断依据<\/strong>：素材自己先反驳了\"只看胜率\"：<\/li><li>\"一个英雄你不能只看胜率，也要看出场率\"（@ 08:56）<\/li><li>猴子\"都属于那种打两把必出一把的英雄\"，\"每个人的操作手法也是不一样的，总会有一些不会玩的人拉低胜率\"（@ 08:59）（@ 09:03）<\/li><li>同一逻辑在开头也说过一次：\"你每个分段都有适合每个分段的上分英雄，也不能只看这个胜率来玩\"（@ 03:30）——两处独立表述，不是口头禅<\/li><li><strong>决策分支<\/strong>：<\/li><li>高出场 + 胜率 47~49% → 大概率被大量不会玩的人稀释了，不代表弱（猴子 48/47，@ 08:46）<\/li><li>低出场 + 胜率 50%+ → 更可能是\"只有会玩的人在玩\"。阿古朵 52/53（@ 09:17），但素材立刻补一句\"哥们你得会玩呀\"（@ 09:25）<\/li><li>两段胜率差 &gt; 5 个点 → 别在这一层纠结，退回 <a class=\"kref\" href=\"#K-C11\">K-C11<\/a> 先解决分段问题<\/li><li><strong>反例<\/strong>：用\"胜率只有 48% 你推荐什么呀，你这不是纯纯误人子弟吗\"去质疑榜单（@ 08:50）。素材的反问就是答案：看出场率、看是谁在玩。反过来也一样——看到 53% 就以为谁拿都赢，阿古朵 53% 的前提是\"会玩\"（@ 09:25）。<\/li><li><strong>来源<\/strong>：BV1nPJk6uEiN @ 08:56<\/li><li><strong>可信度<\/strong>：中。方法论层面自洽（出场率稀释胜率是可解释的统计现象），且素材内有两处独立表述（@ 03:30、@ 08:56）；但仍属单源个人经验，\"出场率\"本身也没给数字。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>对抗路\"四七兄弟\"到底是哪四个英雄<\/strong>：素材只提了名字（@ 00:03），全文没有名单。<a class=\"kref\" href=\"#K-C12\">K-C12<\/a> 因此只能给方法，给不出内容，需另找源补齐，不要凭印象填。<\/li><li><strong>老夫子的克制方法<\/strong>：素材 BV1Tqx76wE7c 标题是《完美克制老夫子》，字幕全文是美食探店，正文\"老夫子\"出现 0 次。这是本卡最大的内容缺口——原本应该由这份素材承担\"对线期机制克制\"的部分。<\/li><li><strong>1w9 打野对位复盘<\/strong>：素材 BV1PxxT6fErn 标题是《粉丝对位1w9打野复盘》，字幕全文是试驾 vlog，没有任何一局对位内容。原本应该由这份素材承担\"高分段打野对位怎么读\"的部分。<\/li><li><strong>所有胜率 / 禁用率的统计口径、日期、样本量<\/strong>：白衣每段报两个数但不说来源，晚风只说\"近 2500\"，都没给统计日期。这是本卡所有\"低\"可信度的共同原因。<\/li><li><strong>完整的英雄间机制克制表<\/strong>：素材里只有两组——大乔 × 苏烈/关羽（<a class=\"kref\" href=\"#K-C16\">K-C16<\/a>）、哪吒 × 无保护 C 位（<a class=\"kref\" href=\"#K-C17\">K-C17<\/a>）。第三组都没有，不足以构成表。<\/li><li><strong>ban 位优先级排序<\/strong>：素材只给了盾山\"不太容易放出来\"（@ 15:40）和元辅 80% 禁用率（@ 15:47），没有完整的 ban 序，也没说谁该第一个 ban。<\/li><li><strong>王维的分路归属<\/strong>：素材两处说法不一致——辅助段说\"玩辅助才更容易上分\"（@ 12:14），中路段又把他排进中路榜（@ 17:25），没给判据。<a class=\"kref\" href=\"#K-C19\">K-C19<\/a> 只用了他的\"后手进场\"这一条，没碰分路争议。<\/li><li><strong>\"元辅\"和\"王维\"到底是哪个英雄<\/strong>：两者都直接照抄素材用词，素材没有给出对应到正式英雄名的说明（元辅见 @ 15:45，王维见 @ 12:03）。本卡没有替它们推断归属，<a class=\"kref\" href=\"#K-C15\">K-C15<\/a> 与 <a class=\"kref\" href=\"#K-C19\">K-C19<\/a> 沿用素材原词。<\/li><li><strong>五排 / 巅峰赛的阵容配合差异<\/strong>：素材只在大乔处提了一句\"尤其是五排来玩大乔真的太恐怖了\"（@ 18:24），没有系统性结论。<\/li><li><strong>对线期的具体克制细节<\/strong>（谁压谁、几级强势、换血怎么换）：四份可用素材全是\"选谁 / 开局怎么走\"层面，没有一条讲到对线换血。这部分应由 B 类知识卡承担。<\/li><\/ul>", "sum": "适用版本：S45触发条件：你看中一个英雄，但它的胜率只有 47%~48%，你在犹豫要不要拿判断依据：素材自己先反驳了\"只看胜率\"：\"一个英雄你不能只看胜率，也要看出场率\"（@ 08:56）猴子…"}]}, {"key": "C", "cat": "BP", "title": "05 辅助选取体系", "file": "05_辅助选取体系.md", "intro": "<blockquote><p>素材说明：本卡只有一份素材，而且它<strong>不是一份\"辅助怎么选\"的榜单<\/strong>，是一个英雄的完整对局解说。按\"能用来回答什么\"拆三层：<\/p>\n<ol><li><strong>BV17hgK6kEas<\/strong>，益达兄弟《想要上分不吃苦，那就玩九大神辅·第1期》。<strong>单英雄全局解说<\/strong>：标题挂的是\"九大神辅\"系列，全片约 15 分钟只完整打了一个英雄（素材里被转写成\"原神大人 / 邵思源 / 少司员\"，按上下文指同一个英雄），另外八个从头到尾没有点名，只在结尾预告里出现了\"张飞\"一个名字（@ 15:10）。真正可用的内容是三块：<strong>出装分支<\/strong>（@ 00:13–@ 00:57）、<strong>开局野区与连体判断<\/strong>（@ 01:05–@ 03:55）、<strong>中后期的续航与压塔节奏<\/strong>（@ 05:46–@ 14:11）。<\/li><li><strong>需要剔掉的段落<\/strong>：@ 01:22–@ 02:01 是二手机广告（某回收平台的 iPhone 15 Pro），与选取无关；@ 15:17 之后是收尾口播。本卡未引用这两段作为判断依据。<\/li><li><strong>字幕质量<\/strong>：转写错误密集，正文里按语境做了标注（\"强补\"当作强普、\"前力\"当作前期、\"新意拳 / 兽拳 / 星拳\"当作星泉、\"尽会会\"当作近卫、\"火区\"与\"青岛\"疑为站位/兵线误转）。凡是转写不清、无法还原原词的（例如开局公式\"一野二鞭 344 中\"@ 01:07），一律不拿来当结论，只进待补。<\/li><\/ol>\n<p>以上全部是<strong>个人经验与单局复盘，不是官方数据<\/strong>。素材没有标版本号、没有报胜率、没有报禁用率、没有说分段，连\"九大神辅\"的另外八个都不在素材里。所以本卡可信度整体压在\"低\"；<a class=\"kref\" href=\"#K-C28\">K-C28<\/a> 专门用来划这条边界：<strong>这一期能教你一个英雄怎么打完整一局，教不了你辅助位怎么排。<\/strong><\/p>\n<p>用法：判断顺序是从\"有没有先出权\"往下推，不是从\"九大神辅是哪九个\"往下抄。<\/p><\/blockquote>\n<h2>判断顺序<\/h2>\n<pre><code>第 1 步  先问放不放得出来，再问强不强            → K-C21（\"不看阵容先出\"是唯一待遇，不是通例）\n第 2 步  选不出就落默认值：无脑近卫保容错          → K-C22（素材给的底座是容错，不是上限）\n第 3 步  读双方前期强度，定近卫还是极影            → K-C22（对面前期强→近卫；我方前期强→极影滚雪球）\n第 4 步  过一遍法抗与开团需求                    → K-C22 → K-C23（对面法抗多→近卫；要开团或逆风→弃圣杯出冰甲）\n第 5 步  看自家打野开哪片，反向决定守哪片          → K-C24（去红守蓝、去蓝守红）\n第 6 步  开局站位跟着队友动向改，不背固定点        → K-C24（素材自评\"强普清线\"是错误示范）\n第 7 步  看自家法师吃不吃线权，决定连体还是中轴     → K-C25（吃线权的中法→压中轴，别无脑连体）\n第 8 步  看这套阵容要不要\"能回满再压\"的续航        → K-C26 → K-C27（续航换压塔窗口；被动经济已不是卖点）\n第 9 步  最后检查素材边界，别当九大神辅名单用      → K-C28（本期只覆盖一个英雄）<\/code><\/pre>", "entries": [{"id": "K-C21", "cat": "C", "title": "辅助位真正的\"先出权\"只有一个：放得出来 + 不吃阵容 + 版本仍在，三条同时成立才一抢", "self": "<h3><a class=\"kref\" href=\"#K-C21\">K-C21<\/a> 辅助位真正的\"先出权\"只有一个：放得出来 + 不吃阵容 + 版本仍在，三条同时成立才一抢<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本，本条不主张它在 S45 仍成立，见可信度）<\/li><li><strong>触发条件<\/strong>：你在辅助位且顺位靠前；或你在想\"有没有可以不看阵容、直接先手拿的辅助\"<\/li><li><strong>判断依据<\/strong>：素材把这个英雄的两个标签分开说——先是\"出道即T0、从未跌落神坛的原神大人\"（@ 00:04），再是\"作为九大神辅里唯一一个可以不看阵容先出的英雄\"（@ 00:08）。<strong>\"强\"和\"能先出\"在素材里是两句话<\/strong>。而能不能先出，落点在三件事上：版本强度（\"出道即T0\"）、不依赖阵容（\"不看阵容先出\"）、ban 位放行（\"只要没人 ban，直接一抢\"@ 00:10）（@ 00:11）。<\/li><li><strong>决策分支<\/strong>：<\/li><li>没人 ban + 你不知道辅助位该拿什么 → 一抢。素材给的定位就是\"不看阵容\"，这一手买的是容错，不是上限（@ 00:12）<\/li><li>被 ban / 被对面先抢 → 这条直接失效。退回 <a class=\"kref\" href=\"#K-C22\">K-C22<\/a> 按阵容定出装、<a class=\"kref\" href=\"#K-C25\">K-C25<\/a> 按法师定打法，不要为了\"它本来是 T0\"去硬找一个替代位<\/li><li>你不确定它在这个版本还成不成立 → 素材没给版本号和任何胜率口径，按 <a class=\"kref\" href=\"#K-C28\">K-C28<\/a> 的边界处理，别把\"从未跌落神坛\"当版本结论<\/li><li><strong>反例<\/strong>：把\"T0\"读成\"谁都能不看阵容先出\"。素材的原词是\"<strong>唯一一个<\/strong>\"（@ 00:08）——它说的是九大神辅里的唯一，不是辅助位的通例。你换个辅助去套\"不看阵容先出\"，失败的原因不是英雄弱，是你把特例当成了规则。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 00:08（同段 @ 00:04、@ 00:10、@ 00:11）<\/li><li><strong>可信度<\/strong>：低。单源、单英雄、口播；\"T0\"\"从未跌落神坛\"没有任何胜率、禁用率或分段口径，UP 也没标素材版本。本条只取\"先出权 = 强度 + 不吃阵容 + ban 放行\"这个结构，不取\"它现在还是 T0\"这个结论。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本，本条不主张它在 S45 仍成立，见可信度）触发条件：你在辅助位且顺位靠前；"}, {"id": "K-C22", "cat": "C", "title": "辅助装先落近卫，再看两件事决定要不要换极影：对面前期强度、我方前期强度", "self": "<h3><a class=\"kref\" href=\"#K-C22\">K-C22<\/a> 辅助装先落近卫，再看两件事决定要不要换极影：对面前期强度、我方前期强度<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：辅助位已定，进入出装选择，手上只有\"近卫圣杯流\"和\"极影\"两套<\/li><li><strong>判断依据<\/strong>：素材把选择压成一个默认值加三条改写条件，顺序很清楚：<\/li><li><strong>默认<\/strong>：\"如果你不知道怎么出，那就无脑近卫，搞容错\"（@ 00:33）（@ 00:35）（@ 00:36）——近卫是底座，先保证不崩<\/li><li><strong>对面前期强 → 近卫<\/strong>：\"这把对面前期强度大于我们阵容，所以我们选择近卫\"（@ 00:42）（@ 00:44）<\/li><li><strong>对面法抗多 → 近卫<\/strong>（@ 00:45）<\/li><li><strong>我方前期强 → 极影滚雪球<\/strong>：\"如果是我们前期强，可以选择极影滚雪球\"（@ 00:54）（@ 00:55）<\/li><li><strong>极影不能无脑出<\/strong>：\"极影也要根据阵容去出\"（@ 00:25），前置理由是\"自从邵思源偷钱减少后，缩减的争议也降低了\"（@ 00:21）（@ 00:23）<\/li><li><strong>决策分支<\/strong>：<\/li><li>读不清对面阵容 / 不知道怎么选 → 近卫，这是素材明写的默认值（@ 00:35）<\/li><li>对面前期强度高于我方 → 近卫（@ 00:44）<\/li><li>对面法抗堆得多 → 近卫（@ 00:45）<\/li><li>我方前期强、想把优势滚起来 → 极影（@ 00:55）<\/li><li>两套之间还有第三条路（开团/逆风）→ 见 <a class=\"kref\" href=\"#K-C23\">K-C23<\/a><\/li><li><strong>反例<\/strong>：知道\"极影上限高\"就每把都先出极影。素材的叙述顺序是<strong>先给默认（无脑近卫）、再给极影的成立条件（我方前期强）<\/strong>，极影是条件成立后的加速器，不是底座。反过来的错也一样：明明是前期强势阵容，还保守出近卫，等于把滚雪球窗口让掉（@ 00:55）。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 00:35（同段 @ 00:42、@ 00:45、@ 00:55）<\/li><li><strong>可信度<\/strong>：低。单源个人经验，且是单个英雄的装备判断；\"对比于无相胜率都是高于他的\"（@ 00:19）既没给数字，也没说口径，\"无相\"疑为转写误差，本条不把它当依据。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：辅助位已定，进入出装选择，手上只有\"近卫圣杯流\"和\"极影\"两套判断依据：素材把选择压成一个默认值加三条改写条件，顺序很清楚：默认：\"如果你不知道怎么出…"}, {"id": "K-C23", "cat": "C", "title": "圣杯与冰甲是互斥项：阵容要你开团、或者前期已经逆风，就弃圣杯出冰甲", "self": "<h3><a class=\"kref\" href=\"#K-C23\">K-C23<\/a> 圣杯与冰甲是互斥项：阵容要你开团、或者前期已经逆风，就弃圣杯出冰甲<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：你在\"续航装\"和\"打团装\"之间选；或者这局开局已经掉节奏，在想要不要补输出/前排<\/li><li><strong>判断依据<\/strong>：素材把两条路并列给出来，触发条件写得比结论还清楚——\"至于下面那一套，是阵容需要你开团，或者你前期逆风的情况，就舍弃圣杯，直接冰甲加强打团能力\"（@ 00:47）（@ 00:49）（@ 00:50）（@ 00:51）（@ 00:52）。反过来，留在圣杯路线的隐含前提是：这局不需要你承担开团，而且也没崩。<\/li><li><strong>决策分支<\/strong>：<\/li><li>阵容缺先手 / 你是唯一的开团点 → 冰甲，放弃圣杯（@ 00:49）<\/li><li>前期逆风、续航也守不住塔 → 冰甲，转正面团找翻盘（@ 00:50）（@ 00:52）<\/li><li>顺风、不需要你开团 → 留圣杯路线，续航换成压制窗口（与 <a class=\"kref\" href=\"#K-C26\">K-C26<\/a> 连读）<\/li><li><strong>反例<\/strong>：逆风了还抱着圣杯刷续航。素材把\"前期逆风\"直接列成弃圣杯的条件之一（@ 00:50）——逆风时你的问题是打不过正面团，不是蓝不够。用续航去补一个打团问题，方向就错了。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 00:49（同段 @ 00:47、@ 00:50、@ 00:51、@ 00:52）<\/li><li><strong>可信度<\/strong>：低。单源个人经验；冰甲、圣杯的具体属性与收益素材一句没提，只有\"加强打团能力\"这个方向性说法，也没给\"逆风\"的判定标准（经济差多少算逆风）。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：你在\"续航装\"和\"打团装\"之间选；"}, {"id": "K-C24", "cat": "C", "title": "开局守哪片野是\"反向守\"：自家打野去哪片，就守另一边；但这条只在\"对面打野更强\"时被演示过", "self": "<h3><a class=\"kref\" href=\"#K-C24\">K-C24<\/a> 开局守哪片野是\"反向守\"：自家打野去哪片，就守另一边；但这条只在\"对面打野更强\"时被演示过<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：开局约 30 秒，辅助在决定第一波站哪、要不要进野区<\/li><li><strong>判断依据<\/strong>：素材先问\"是否要参与野区的进攻和防守\"（@ 01:09），这一局的答案是要，理由是\"对面打野是老虎\"（@ 01:12）、\"这把前期要帮典韦防守野区\"（@ 01:14）。具体分工是<strong>反向守<\/strong>：\"典韦去红区我们就帮他看蓝，他去蓝区我们就得帮他看红\"（@ 01:16）（@ 01:18）。更上一层的方法是\"要根据队友的动向去变动\"（@ 02:16）。<\/li><li><strong>决策分支<\/strong>：<\/li><li>自家打野前期弱、对面打野前期强（素材对位：典韦 vs 老虎）→ 参与防守，守打野没去的那半边（@ 01:14）（@ 01:16）<\/li><li>自家打野前期强 → 素材没讲要不要反打，别直接照抄\"反向守\"，进待补<\/li><li>站位一律跟队友动向走；素材自评过一个错误示范：\"我们强普清线是错误示范……直接站红背占视野才是对的\"（@ 02:10）（@ 02:14）<\/li><li><strong>反例<\/strong>：把\"正常情况占中右\"（@ 02:06）当成固定开局脚本。同一局里打野\"选择占中左\"（@ 02:09），辅助还按默认点位走，两个人就脱节了。点位是跟着打野动向算出来的，不是背下来的。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 01:16（同段 @ 01:09、@ 01:12、@ 01:14）<\/li><li><strong>可信度<\/strong>：低。单局复盘，n=1；\"反向守\"只在这一个对位里被演示过，素材没给\"什么时候不参与野区\"\"打野本身强势时怎么办\"的条件，本条只覆盖防守一侧。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：开局约 30 秒，辅助在决定第一波站哪、要不要进野区判断依据：素材先问\"是否要参与野区的进攻和防守\"（@ 01:09），这一局的答案是要，理由是\"对面…"}, {"id": "K-C25", "cat": "C", "title": "连体还是打中轴，判据是\"中路能不能拿到线权\"，不是\"射手需不需要保\"", "self": "<h3><a class=\"kref\" href=\"#K-C25\">K-C25<\/a> 连体还是打中轴，判据是\"中路能不能拿到线权\"，不是\"射手需不需要保\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：辅助在决定这局跟射手连体，还是压中轴带节奏；自家中路是吃线权才能起节奏的法师<\/li><li><strong>判断依据<\/strong>：素材的原话把两个条件叠在一起——\"下路是李信加上中路是火舞这种法师，对面打野是老虎，95% 的思路是打中轴的，千万不能无脑连体。打中轴，让火舞可以拿到线权，才能发挥火舞的节奏能力\"（@ 03:46）（@ 03:49）（@ 03:50）（@ 03:52）（@ 03:53）（@ 03:54）（@ 03:55）。条件①是中法\"火舞这种\"靠线权起节奏；条件②是发育路能自理——后文印证了这点：\"李信下路兵线他自己可以快速清掉\"（@ 05:00）。<\/li><li><strong>决策分支<\/strong>：<\/li><li>中法吃线权 + 发育路能自己清线 → 打中轴，不连体（@ 03:52）<\/li><li>发育路清不动线、需要人保 → 素材没给这一支，别硬套中轴，进待补<\/li><li>中路是清线慢、不靠线权起节奏的法师 → 素材没给，进待补<\/li><li><strong>反例<\/strong>：把\"辅助就该跟射手\"当默认。素材在同一局里明确否掉了连体（@ 03:52），理由不是\"射手很强\"，而是\"让火舞拿到线权才能发挥节奏能力\"（@ 03:55）。连不连体取决于<strong>谁能把线权换成节奏<\/strong>，不取决于谁是射手。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 03:50（同段 @ 03:46、@ 03:52、@ 03:55）<\/li><li><strong>可信度<\/strong>：低。单局单英雄；\"95% 的思路\"是口播估计，没有统计支撑；只演示了\"中法吃线权\"这一种成立条件，反方向的两种分支素材都没写。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：辅助在决定这局跟射手连体，还是压中轴带节奏；"}, {"id": "K-C26", "cat": "C", "title": "续航型辅助的价值不在治疗量，在\"打完一波能回满、立刻能压塔\"", "self": "<h3><a class=\"kref\" href=\"#K-C26\">K-C26<\/a> 续航型辅助的价值不在治疗量，在\"打完一波能回满、立刻能压塔\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：你在判断续航型辅助这局值不值；或一波团刚打完，在决定压不压塔<\/li><li><strong>判断依据<\/strong>：素材把续航直接换算成进攻窗口——\"我们是少选这种续航型辅助，打完一波状态可以回满，是可以尝试压塔的\"（@ 11:44）（@ 11:46）（@ 11:48）。配套的装备路线也自洽：血包改版后\"出近卫只需要一个法穿鞋，蓝量基本不缺\"（@ 06:40）（@ 06:41）（@ 06:43）（@ 06:47）；顺风\"还能出星泉来保证续航\"（@ 06:45）（@ 07:02）；\"中期可以把星泉换成救赎\"（@ 09:57）。<\/li><li><strong>决策分支<\/strong>：<\/li><li>队伍需要连续压塔、打人数差滚节奏 → 续航型有价值：状态能回满就别急着回城，接着压（@ 11:48）<\/li><li>顺风 → 星泉保续航（@ 07:02）；中期团战变多 → 星泉换救赎（@ 09:57）<\/li><li>逆风 / 需要开团 → 参考 <a class=\"kref\" href=\"#K-C23\">K-C23<\/a>，续航让位给打团装<\/li><li><strong>反例<\/strong>：把\"治疗量高、评分高\"当选取理由。素材确实提到\"刷了很多治疗量\"\"MVP 实至名归\"（@ 14:49）（@ 14:54），但同片后段又否掉了刷数据本身：\"刷起来被动对于整局的胜负影响不是特别大，主要是你思路和连招\"（@ 12:24）（@ 12:27）。续航的兑现方式是\"能压塔\"，不是\"面板好看\"。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 11:44（同段 @ 06:45、@ 07:02、@ 09:57、@ 11:48）<\/li><li><strong>可信度<\/strong>：低。单源个人经验；\"状态回满\"依赖血包与装备，素材没给回复量、冷却或蓝耗数字；星泉换救赎只有一个\"中期\"的模糊时点。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：你在判断续航型辅助这局值不值；"}, {"id": "K-C27", "cat": "C", "title": "这个英雄的旧卖点（刷被动经济）已被削：选它的理由要改成容错、续航和连招", "self": "<h3><a class=\"kref\" href=\"#K-C27\">K-C27<\/a> 这个英雄的旧卖点（刷被动经济）已被削：选它的理由要改成容错、续航和连招<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（素材未标版本）<\/li><li><strong>触发条件<\/strong>：你选了素材里这个续航型辅助，还按\"刻意刷被动、靠经济差\"的老思路在打<\/li><li><strong>判断依据<\/strong>：同一处改动被素材提了两次，是这条最硬的证据：前段\"自从邵思源偷钱减少后，缩减的争议也降低了\"（@ 00:21）（@ 00:23）；后段\"少司员自从偷钱少了之后，基本玩起来就可以不用刻意去刷钱，刻意会影响你的操作\"（@ 12:12）（@ 12:14）（@ 12:16）。替代的重心在紧接着的一句：\"主要是你思路和连招，这些做对的才是比较重要的\"（@ 12:27）（@ 12:28）。<\/li><li><strong>决策分支<\/strong>：<\/li><li>玩这个英雄 → 不刻意刷被动，把精力放到思路和连招上（@ 12:16）（@ 12:27）<\/li><li>还在按老版本刷钱 → 改。素材给的判断是\"刻意会影响你的操作\"，收益已经小于代价<\/li><li>想据此说\"偷钱型辅助整体变弱\" → 素材只讲了一个英雄，别外推，进待补<\/li><li><strong>反例<\/strong>：把\"能刷钱\"当这个英雄的选取理由。改动后素材的态度是\"不用刻意去刷\"（@ 12:14），卖点已经从经济转到了容错、续航和连招。选人理由停在旧版本，就是拿过期卖点做决策。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 12:12（同段 @ 00:21、@ 12:14、@ 12:27）<\/li><li><strong>可信度<\/strong>：低。单源、单英雄；UP 只说\"偷钱减少\"，没说削了多少、哪个版本改的，也没有改前改后的胜率或出场率。本条的可用部分是\"重心从经济转向思路连招\"这个方向，不是\"削了多少\"这个量。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>", "sum": "适用版本：S45（素材未标版本）触发条件：你选了素材里这个续航型辅助，还按\"刻意刷被动、靠经济差\"的老思路在打判断依据：同一处改动被素材提了两次，是这条最硬的证据：前段\"自从邵思源偷钱减少后，…"}, {"id": "K-C28", "cat": "C", "title": "素材边界：这是\"九大神辅\"的第 1 期，只完整打了一个英雄，不能当九大神辅名单用", "self": "<h3><a class=\"kref\" href=\"#K-C28\">K-C28<\/a> 素材边界：这是\"九大神辅\"的第 1 期，只完整打了一个英雄，不能当九大神辅名单用<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：不涉及版本判断，属于素材边界陈述<\/li><li><strong>触发条件<\/strong>：你想用这一期素材去回答\"九大神辅是哪九个\"\"辅助位该怎么排\"\"功能辅和输出辅怎么选\"<\/li><li><strong>判断依据<\/strong>：三条可逐句核对的事实：<\/li><li>素材自称系列第 1 期（标题《九大神辅·第 1 期》），全片只完整打了一个英雄的对局<\/li><li>\"作为九大神辅唯一一个可以不看阵容先出的英雄\"（@ 00:08）只把这个英雄和\"另外八个\"作对比，<strong>没有点名其余八个<\/strong><\/li><li>结尾是预告而非结论：\"目前还有顶端局顶级张飞、云（转写\"云服\"）的素材，还有其他九大神辅的金牌游走的素材，你们想看哪个可以评论留言\"（@ 15:10）（@ 15:13）（@ 15:15）<\/li><li><strong>决策分支<\/strong>：<\/li><li>你要学\"单个辅助怎么打完整一局\" → 这期可用，按 <a class=\"kref\" href=\"#K-C22\">K-C22<\/a>～<a class=\"kref\" href=\"#K-C27\">K-C27<\/a> 拆<\/li><li>你要\"九大神辅名单 / 辅助位强弱排序\" → 这期给不了，进待补；别拿\"唯一一个可以先出\"反推其余八个的强弱<\/li><li>你要\"功能辅 vs 输出辅怎么选\" → 这期完全没覆盖，见待补<\/li><li><strong>反例<\/strong>：把\"九大神辅\"当成这一期已经排完的榜。素材里除主英雄外只出现\"张飞\"一个名字，而且是<strong>下期预告<\/strong>（@ 15:10），不是本期结论。拿预告当名单，是把标题当内容。<\/li><li><strong>来源<\/strong>：BV17hgK6kEas @ 15:10（同段 @ 00:08、@ 15:13、@ 15:15）<\/li><li><strong>可信度<\/strong>：中。这条不是对局判断，而是<strong>素材边界的事实陈述<\/strong>：系列定位、单英雄覆盖、其余八个未点名，都能在字幕里逐句核对。它约束的是\"这张卡能推到哪一步\"，不涉及版本强弱，所以可信度高于其余各条。<\/li><li><strong>状态<\/strong>：draft<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li><strong>功能辅 vs 输出辅怎么选<\/strong>：这是任务要回答的核心问题之一，素材<strong>零覆盖<\/strong>。全片只有一个续航/容错型辅助，没有出现任何\"输出型辅助\"的对局或判断，本卡不代为补写。<\/li><li><strong>九大神辅的其余八个是谁、怎么排<\/strong>：素材只在 @ 00:08 说了\"唯一一个\"，在 @ 15:10 预告了\"张飞\"和\"云（服）\"，其余全部未点名。<a class=\"kref\" href=\"#K-C28\">K-C28<\/a> 因此只能划边界，给不出名单。<\/li><li><strong>辅助与队友的搭配矩阵<\/strong>：素材只有一条成型条件——\"中路是火舞这种吃线权的法师 + 发育路能自理 → 打中轴\"（<a class=\"kref\" href=\"#K-C25\">K-C25<\/a>）。\"配什么射手\"\"配什么打野\"一条都没有，构不成矩阵。<\/li><li><strong>软辅 / 硬辅的选取判据<\/strong>：素材讲的是单个英雄的出装与打法，没有出现\"该拿软辅还是硬辅\"的取舍场景。<\/li><li><strong>对面辅助已亮时的 counter 选择<\/strong>：素材全片都在讲本方视角，对面辅助只在 @ 03:58 出现一句\"对面宗师辅在中路\"（转写存疑），没有对抗选人的任何结论。<\/li><li><strong>\"什么时候不参与野区\"<\/strong>：<a class=\"kref\" href=\"#K-C24\">K-C24<\/a> 只覆盖了\"对面打野强、要防守\"这一支；自家打野强势时是反打还是正常开局，素材没讲。<\/li><li><strong>逆风 / 顺风的量化标准<\/strong>：<a class=\"kref\" href=\"#K-C23\">K-C23<\/a>、<a class=\"kref\" href=\"#K-C26\">K-C26<\/a> 都用到\"逆风\"\"顺风\"，但素材没给经济差、塔数或时间点，判据只能停在定性。<\/li><li><strong>版本号与数据口径<\/strong>：素材没有发布日期、没有版本号、没有胜率、没有禁用率、没有分段。这是本卡绝大多数\"低\"可信度的共同原因，<a class=\"kref\" href=\"#K-C21\">K-C21<\/a> 的\"T0\"尤其不能当版本结论。<\/li><li><strong>装备的正式名与属性<\/strong>：近卫、极影、圣杯、冰甲、星泉、救赎都沿用素材原词，素材没给全称、属性和价格，也没说\"法穿鞋\"具体是哪一件。<\/li><li><strong>转写错误的完整清单<\/strong>：已知的有\"原神大人 / 邵思源 / 少司员\"（同一英雄）、\"强补\"（强普）、\"前力\"（前期）、\"尽会会\"（近卫）、\"新意拳 / 兽拳 / 星拳\"（星泉）、\"火区 / 青岛\"（站位与兵线，存疑）、\"一野二鞭 344 中\"（开局公式，无法还原）、\"易打\"（疑为\"益达\"）、\"云服\"（云？）、\"九二神符\"（九大神辅）、\"剑主之灵魂\"（存疑）。<strong>开局公式这一条最关键<\/strong>：@ 01:05–@ 01:09 是全片唯一成体系的\"辅助开局流程\"，但转写完全不可读，本卡未采用。<\/li><li><strong>对线期细节<\/strong>：素材是\"出装 + 开局 + 中后期节奏\"，没有一段讲对线换血、几级强势、谁压谁。这部分应由 B 类知识卡承担。<\/li><\/ul>", "sum": "适用版本：不涉及版本判断，属于素材边界陈述触发条件：你想用这一期素材去回答\"九大神辅是哪九个\"\"辅助位该怎么排\"\"功能辅和输出辅怎么选\"判断依据：三条可逐句核对的事实：素材自称系列第 1 期（…"}]}, {"key": "D", "cat": "对局内", "title": "主线地图", "file": "00_主线地图.md", "intro": "<p>读完这一页，你应该知道<strong>这局该按什么顺序想事<\/strong>，而不是\"有多少个知识点\"。<\/p>\n<h2>决策主线（节间依赖）<\/h2>\n<pre><code>01 选人 ──► 02 开局前90秒 ──► 03 前四分钟 ──► 04 对线期 ──► 05 第一波转线\n                                                              │\n05 ──► 06 中期资源 ──► 07 团战 ──┬──► 08 顺风推进 ──┐\n              ▲                  └──► 09 逆风止损 ──┴──► 10 终结比赛\n              │\n     04 ─(无对线权且持续到4分钟，直接跳 09)─┘<\/code><\/pre>\n<p>实线是正常推进；<strong>04 → 09 这条斜边是\"跳节\"路径<\/strong>——对线期就崩了的话，05、06、07 全部不成立，要直接进止损逻辑。清单式知识库给不出这条边。<\/p>\n<h2>每节回答的问题<\/h2>\n<div class=\"tw\"><table><thead><tr><th>节<\/th><th>只回答这一个决定<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>01 选人<\/td><td>我拿什么英雄，取决于对面已经选了什么<\/td><td>⏳ 由 <code>C_BP/04_分路推荐与克制选人.md<\/code> 承担，本目录不单列<\/td><\/tr><tr><td><strong>02 开局前90秒<\/strong><\/td><td><strong>第一步我站在哪<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>03 前四分钟<\/strong><\/td><td><strong>第一条龙我争不争<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>04 对线期<\/strong><\/td><td><strong>这波线清完，我该往哪走<\/strong><\/td><td>✅ 已完成<\/td><\/tr><tr><td><strong>05 第一波转线<\/strong><\/td><td><strong>我动起来之后，先去哪一路<\/strong><\/td><td>✅ 已完成（12 条，<a class=\"kref\" href=\"#K-D41\">K-D41<\/a>~D52，见 <code>05_第一波转线.md<\/code>）<\/td><\/tr><tr><td><strong>06 中期资源<\/strong><\/td><td><strong>这一整段是在布置 10 分钟那一波<\/strong><\/td><td>✅ 已完成（4 条，<a class=\"kref\" href=\"#K-D25\">K-D25<\/a>~D28）<\/td><\/tr><tr><td><strong>07 团战<\/strong><\/td><td><strong>这波团我该站在哪、什么时候进<\/strong><\/td><td>✅ 已完成（12 条，<a class=\"kref\" href=\"#K-D79\">K-D79<\/a>~D90，见 <code>07_团战.md<\/code>）<\/td><\/tr><tr><td><strong>08 顺风推进<\/strong><\/td><td><strong>拿到优势后，先推塔还是先控野<\/strong><\/td><td>✅ 已完成（7 条，<a class=\"kref\" href=\"#K-D53\">K-D53<\/a>~D59）<\/td><\/tr><tr><td><strong>09 逆风止损<\/strong><\/td><td><strong>打不过的时候，损失怎么止住<\/strong><\/td><td>✅ 已完成（7 条，<a class=\"kref\" href=\"#K-D60\">K-D60<\/a>~D66）<\/td><\/tr><tr><td><strong>10 终结比赛<\/strong><\/td><td><strong>怎么把优势变成水晶<\/strong><\/td><td>✅ 已完成（11 条，<a class=\"kref\" href=\"#K-D67\">K-D67<\/a>~D77）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>编号说明<\/strong>：<code>K-Dxx<\/code> 按<strong>入库顺序<\/strong>排，不按节号。所以 04 的条目是 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a>~D08，02 的条目是 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>~D13，03 的是 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>~D18——查条目时不要按节号推编号。<\/p>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<ul><li>经济差只是战斗力差的一种来源，不是唯一来源。<\/li><li>信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。<\/li><li>这条来自 <code>BV1i2n96AEvp @ 02:31<\/code>，原文：\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/li><\/ul>\n<h2>读这套东西的正确姿势<\/h2>\n<ol><li>先看当前局的<strong>时间点<\/strong>，定位到哪一节；<\/li><li>读那节的\"判断树\"，找自己正卡在哪个判据上；<\/li><li>只看那个判据对应的 K 条目，不要通读；<\/li><li>条目里的\"反例\"比\"结论\"更值钱——那是别人踩过的坑。<\/li><\/ol>\n<h2>三条写作硬规矩（新增内容必须遵守）<\/h2>\n<ol><li><strong>文件名是一个\"决定\"，不是话题。<\/strong> 不许出现\"英雄\"\"铭文\"\"出装\"这类名词短语。<\/li><li><strong>每节第一节必须是\"上一节留下的问题\"<\/strong>，且点名上一节哪个分支留下了它。断链的节不许存在。<\/li><li><strong>易错点按环节归位，不单列。<\/strong> 禁止\"本节易错点：①②③\"，错必须挂在它所属的判断节点下。<\/li><\/ol>", "entries": []}, {"key": "D", "cat": "对局内", "title": "02 开局前90秒：第一步我站在哪", "file": "02_开局前90秒.md", "intro": "<blockquote><p><strong>依赖<\/strong>：01 选人（尚未写）——它要交出的是\"这局前期以谁为核心\" <strong>被依赖<\/strong>：03 前四分钟（本节产出的\"第一步站位\"决定了第一波线谁先到、谁先有线权）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>01 选人还没写成条目，但它必须回答的问题是：<strong>这局前期该围绕谁打？<\/strong><\/p>\n<p>这一节不等 01 写完就先给出当前版本的主流答案——素材里的原话是：<\/p>\n<blockquote><p>「双方中路小乔和嫦娥……在这个中野辅的版本，我们这局前期要以野中为合，保证宫本的野区节奏以及小乔的中线权。」<\/p><\/blockquote>\n<p>也就是说，<strong>S45 的默认答案是\"野 + 中\"<\/strong>，不是任何一个单独的人。这个默认值有两个例外（见判断树），例外只看一件事：<strong>我方打野一级能不能动对面野区<\/strong>。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>读条结束那 20 秒，我第一步往哪走？<\/strong><\/p>\n<p>不是\"我要不要反野\"（那是打野的事），是<strong>\"我这一步走出去，会不会让本局的核心（野或中）多出一次机会\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>读条结束前，先答一个问题：我方打野一级能不能动对面野区？\n│\n├─ 能（打野是强反型 / 有惩戒优势 / 对面打野一级弱）\n│   → 本局核心 = 打野的野区节奏\n│   ├─ 我是辅助 → 去对抗路抢线权，抢完直接协同进野区   【K-D10】\n│   ├─ 我是中路 → 兵线交汇立刻清，清完帮看另一片野区   【K-D11】\n│   └─ 我是对抗路 → 一级先上手，把对面边路钉在线上     【K-D13】\n│\n└─ 不能（打野一级弱 / 对面打野压制）\n    → 本局核心 = 中路线权\n    ├─ 我是辅助 → 回中帮清，把中线权保住               【K-D10 分支 B】\n    ├─ 我是中路 → 不硬抢 2v2，改成\"清完就走\"           【K-D11 分支 B】\n    └─ 我是边路 → 只做安全对线，不主动换血             【K-D13】\n\n无论哪支：一级出现击杀窗口（对面边路走位冒进）→ 先拿一血，拿不到立刻转野区 【K-D13】<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>我方打野一级强度<\/td><td>英雄本身（能否强反/双惩戒）<\/td><td>能与不能<\/td><td>根的第一次分叉<\/td><\/tr><tr><td>对面打野一级强度<\/td><td>同上<\/td><td>比我方弱 → 能反<\/td><td>同上<\/td><\/tr><tr><td>中路 2v2 强度<\/td><td>双方中单+辅助的清线速度<\/td><td>明显打不过<\/td><td><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 分支 B<\/td><\/tr><tr><td>对面边路是否\"皮\"（敢出塔）<\/td><td>一级 30 秒内的站位<\/td><td>出塔且我方有控制<\/td><td><a class=\"kref\" href=\"#K-D13\">K-D13<\/a><\/td><\/tr><tr><td>打野是否已出野刀<\/td><td>装备栏<\/td><td>未出 → 尾刀让<\/td><td><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 的细节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D09", "cat": "D", "title": "开局的默认核心是「野 + 中」，不是任何一个人", "self": "<h3><a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 开局的默认核心是「野 + 中」，不是任何一个人<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）；S46 待复核<\/li><li><strong>触发条件<\/strong>：读条结束，全队要定第一步<\/li><li><strong>判断依据<\/strong>：版本节奏（中野辅）+ 双方阵容<\/li><li><strong>决策分支<\/strong>：<\/li><li>默认 → 所有开局动作服务于两件事：<strong>打野的野区节奏 + 中单的中线权<\/strong><\/li><li>只有当打野一级完全动不了野区时（见判断树），核心才切到\"中路线权\"单点<\/li><li><strong>反例<\/strong>：「开局各走各的，辅助跟射手、边路自己发育」——这类打法在\"中野辅\"版本里等于主动放弃前两条资源。素材原话把这条定为<strong>开局分析的第一句<\/strong>，位置在\"谁拿一血\"之前。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D10\">K-D10<\/a>、<a class=\"kref\" href=\"#K-D11\">K-D11<\/a>、<a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:34；BV1yke26fEYB @ 00:38；BV1yke26fEYB @ 00:40<\/li><li><strong>可信度<\/strong>：中高（职业向全局教学的定调句，且后续所有动作都与它自洽）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）；"}, {"id": "K-D10", "cat": "D", "title": "打野要偷野时，辅助去的是对抗路，不是中路也不是发育路", "self": "<h3><a class=\"kref\" href=\"#K-D10\">K-D10<\/a> 打野要偷野时，辅助去的是对抗路，不是中路也不是发育路<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局确认打野要偷对面野区<\/li><li><strong>判断依据<\/strong>：打野进草等对面动向（能不能偷成）；对抗路我方是否有先手<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷 → <strong>去对抗路抢线权<\/strong>，抢完带着边路一起进野区<\/li><li>打野不偷 → 回中帮清（分支 B）<\/li><li><strong>反例<\/strong>：「辅助开局跟射手」——这是四个判据里排第三的一条（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>），不是第一条。开局直接去发育路，等于放弃野区节奏。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>（核心是野区）；与 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code> 是同一条判据的位置级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:52；BV1yke26fEYB @ 00:54；BV1yke26fEYB @ 01:29<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局确认打野要偷对面野区判断依据：打野进草等对面动向（能不能偷成）；"}, {"id": "K-D11", "cat": "D", "title": "中路 2v2 打不过就不要抢，改去帮看野区", "self": "<h3><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 中路 2v2 打不过就不要抢，改去帮看野区<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级中路 2v2，我方清线明显慢<\/li><li><strong>判断依据<\/strong>：双方中单+辅助的清线速度差（一个技能能不能清完一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打不过 → <strong>不硬抢<\/strong>，把中线放掉，转去另一片野区看一眼（对面打野动不动我们的红/蓝）<\/li><li>抢得过 → 立刻清完，清完立刻走（<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢不过还去抢，是把自己钉在中路挨打，同时野区被反了也没人看。素材里这一波的处理就是\"中路抢线 2V2 打不过对面的组合 → 要协同打野的反野，就得去另外一边拿线权\"。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；与 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code> 互为位置级/环节级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:31；BV1yke26fEYB @ 01:33；BV1yke26fEYB @ 01:34<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级中路 2v2，我方清线明显慢判断依据：双方中单+辅助的清线速度差（一个技能能不能清完一波）决策分支：打不过 → 不硬抢，把中线放掉，转去另一片野区看一眼（对面打野…"}, {"id": "K-D12", "cat": "D", "title": "反完野的 30 秒，是给打野提速的窗口", "self": "<h3><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 反完野的 30 秒，是给打野提速的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：我方反野成功、对面野区清完<\/li><li><strong>判断依据<\/strong>：打野野区里还剩几组野；打野有没有出野刀<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野野区里有剩 → <strong>立刻过去帮打<\/strong>（三组小野一起提速），尾刀不抢<\/li><li>打野已清空 → 回中线，不要陪他蹲<\/li><li><strong>反例<\/strong>：「反完野就去帮下路」——反野换来的经济优势只有在他把自家野也吃完时才成立。你走了，他一个人清三组野，优势就摊薄了。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；尾刀细节见 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code><\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:16；BV1yke26fEYB @ 02:25；BV1yke26fEYB @ 02:27；BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：我方反野成功、对面野区清完判断依据：打野野区里还剩几组野；"}, {"id": "K-D13", "cat": "D", "title": "一级的一血窗口只看一件事：对面边路敢不敢出塔", "self": "<h3><a class=\"kref\" href=\"#K-D13\">K-D13<\/a> 一级的一血窗口只看一件事：对面边路敢不敢出塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局 0–60 秒，边路第一次兵线交汇<\/li><li><strong>判断依据<\/strong>：对面边路站位是否越过自家塔前；我方有没有硬控（如带晕眩的边路）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他出塔且我方有控 → <strong>打<\/strong>，这是开局性价比最高的一次击杀<\/li><li>他稳在塔后 → 立刻转\"快速抢线 + 进野区\"，不要在线上磨<\/li><li>偷野被对面发现 → <strong>不打了，直接快速抢线转进野区<\/strong>（原话：被发现了，那就直接快速抢线，带着队友去进对面野区）<\/li><li><strong>反例<\/strong>：「一级要稳」——一级恰恰是唯一\"对面还没有技能\"的窗口，稳到二级，这个机会就永久消失。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；被 <a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖（一血拿不到 → 转反野）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:59；BV1yke26fEYB @ 01:01；BV1yke26fEYB @ 01:40；BV1yke26fEYB @ 01:42<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「核心定给谁」上<\/strong>：人会跳过这一步，直接按自己的习惯走位（辅助跟射手、边路单带），结果前 90 秒全队四条线各打各的，一个资源都没拿到。<\/li><li><strong>在节点「打野能不能动野区」上<\/strong>：人会默认\"我的打野很强\"，不去看双方一级强弱，于是辅助白跑一趟对抗路，野区还是没反成。<\/li><li><strong>在节点「一血窗口」上<\/strong>：人会因为\"这波不一定杀得掉\"而放弃，转而去清兵——但清兵的收益是确定的、随时都有的，一血窗口不是。<\/li><li><strong>在节点「被发现了怎么办」上<\/strong>：人会继续蹲，怕浪费这一趟。原话的处理是立刻转\"抢线 + 进野区\"，把偷换成明抢。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><strong>\"中野辅版本\"这个前提本身没有版本号<\/strong>。素材是 S45 区间录的，但 UP 主说的是\"这个中野辅的版本\"，属于体感表述。S46 若节奏改动，<a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 要重审。<\/li><li><strong>射手视角缺失<\/strong>：本节五路里，发育路的分支（\"边路只做安全对线\"）是从辅助视角反推的，没有射手第一视角素材验证（见 <code>L_分路/03_发育路.md<\/code> 的缺口说明）。<\/li><li>一级一血窗口的判据只有一条边路样本（孙策 vs 关羽），换阵容是否成立未验证。<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局 0–60 秒，边路第一次兵线交汇判断依据：对面边路站位是否越过自家塔前；"}]}, {"key": "D", "cat": "对局内", "title": "03 前四分钟：第一条龙我争不争", "file": "03_前四分钟.md", "intro": "<blockquote><p><strong>依赖<\/strong>：02 开局前90秒（结论：第一步站位由\"本局核心是野还是中\"决定） <strong>被依赖<\/strong>：04 对线期（本节产出的\"我还在不在场上、状态够不够\"是 04 判断树里 A2 分支的输入）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>02 只解决了\"第一步站哪\"，它留下的是：<strong>如果第一步没换到东西（一血没拿到、野没反成），接下来这三分钟怎么过？<\/strong><\/p>\n<p>答案不是\"补回来\"，而是先把一个事实接住：<strong>前四分钟逆风是常态，不是失误。<\/strong> 素材里这一局在 3 分钟就已经 3v4 团灭过一次，原话是\"前期逆风很正常\"。<\/p>\n<p>这一节要回答的，就是逆风之后第一个资源点该怎么处理。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>4 分钟第一个资源点刷新，我这一波是去打，还是放？<\/strong><\/p>\n<p>不是\"怎么打赢这波团\"，是<strong>\"我这波有没有资格站进去\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>资源点（4 分钟）刷新前 15 秒，清点自己这一侧的家底\n│\n├─ 我的\"一次性资源\"还在吗？（被动 / 大招 / 闪现）\n│   ├─ 不在 → 【K-D15】放。别硬接，用这 40 秒去换别的东西\n│   └─ 在 → 进下一判据\n│\n├─ 我方场上人数够吗？（刚复活的人能不能赶上）\n│   ├─ 少人 → 【K-D15】放。少一个人不是\"勉强能打\"，是\"必定打输\"\n│
