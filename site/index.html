/li><li><strong>大招空拉<\/strong>：1.25 秒吟唱期间对面只要走两步就空，所以没有先手控就别开。<\/li><li><strong>不带射手转线<\/strong>：只在中路晃，等于把二技能最强的用法扔了。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>出装铭文（见上）。<\/li><li>弹弓流等组合技的具体搭档与条件。<\/li><li>对位结论（现无 <code>B_克制关系/鲁班大师.md<\/code>）。<\/li><\/ul>", "sum": "未取到干净数据。"}], "b": [], "lanes": ["roam"], "n": 3, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}, {"name": "小乔", "hue": 293, "a": [{"id": "K-A21", "cat": "A", "title": "二技能要放到\"他要去的地方\"，不是\"他在的地方\"", "self": "<h3><a class=\"kref\" href=\"#K-A21\">K-A21<\/a> 二技能要放到\"他要去的地方\"，不是\"他在的地方\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何要交二技能的瞬间<\/li><li><strong>判断依据<\/strong>：目标当前是否在朝某个方向移动（追击、后撤、绕塔）<\/li><li><strong>决策分支<\/strong>：<\/li><li>在移动 → 落点放到他行进路线前端一个身位<\/li><li>原地站桩输出 → 直接放脚下<\/li><li><strong>反例<\/strong>：「二技能空放是手残」——多数空放是\"瞄当前位置\"导致的，不是手残。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:51<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：任何要交二技能的瞬间判断依据：目标当前是否在朝某个方向移动（追击、后撤、绕塔）决策分支：在移动 → 落点放到他行进路线前端一个身位原地站桩输出 → 直接放脚下反例：「二技能空放是手残…"}, {"id": "K-A22", "cat": "A", "title": "打野先手开团时，小乔的大招是\"必中\"的", "self": "<h3><a class=\"kref\" href=\"#K-A22\">K-A22<\/a> 打野先手开团时，小乔的大招是\"必中\"的<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方打野先手切入（尤其是有减速/控制的打野）<\/li><li><strong>判断依据<\/strong>：对面是否正在集火己方打野（站位会聚成一团）<\/li><li><strong>决策分支<\/strong>：直接大招进场压伤害 → 接一技能压状态<\/li><li><strong>反例<\/strong>：「法师要站后排安全输出」——这一波对面已经聚在一起，你的大招收益远大于你多站两秒。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 05:13（\"打野如果开先手……我们直接大招跑过去，技能是必中的\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A23\">K-A23<\/a> 中路有没有线权，看的是\"对面清线速度\"，不是你的血线<\/h3>\n<p>这是<strong>中路通用判据<\/strong>，换任何法师都成立，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。<\/p>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A24\">K-A24<\/a> 一技能蹭野怪：中路顺路的经济，别用普攻<\/h3>\n<p>这是<strong>中路通用动作<\/strong>（\"顺路蹭、别站桩\"），已迁到 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>。小乔的特殊点只有\"一技能边缘能摸到野怪\"这种手感层面，不构成独立判断。<\/p>\n<h2>4. 出装与铭文<\/h2>\n<p><strong>具体铭文组合：未取到干净数据。<\/strong><\/p>\n<p>原因写清楚，免得下次重复踩：标题带\"铭文出装\"的视频（BV1vA411v7C5、BV17s411h76U 等）<strong>字幕轨是错的内容<\/strong>——有的是职场访谈，有的是 LoL 局，说明 ASR 对这类视频根本没有可用语音轨；简介里也没写具体搭配。按规矩，没有原文就不写。<\/p>\n<p><strong>能确认的只有思路层面<\/strong>：小乔是标准 AP 消耗型法师，出装要围绕\"法强 + 法术穿透 + 少量移速\"，对面魔抗堆起来之前先做法穿，魔抗堆起来之后再补穿透类装备。<\/p>\n<ul><li>待补：S45 六件套顺序、铭文红蓝绿配置。补法见本文件末尾。<\/li><\/ul>\n<h2>5. 最容易崩的地方<\/h2>\n<ol><li><strong>把二技能当输出<\/strong>：它只有很短的控制，伤害靠一技能和大招。二技能用空了不可怕，用它换掉对面的关键位移才值。<\/li><li><strong>没线权硬推线<\/strong>：被卡在中路，两边都支援不了，这是小乔最常见的死法。<\/li><li><strong>大招当保命<\/strong>：大招位移很短，交出去之后你就是个站桩法师。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li>出装铭文（见上，需要看画面帧或官网核对）。<\/li><li>与具体英雄的对位结论（现无 <code>B_克制关系/小乔.md<\/code>）。<\/li><\/ul>", "sum": "这是中路通用判据，换任何法师都成立，已迁到 L_分路/01_中路.md 的 K-L01。"}], "b": [], "lanes": ["mid"], "n": 2, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "王维", "hue": 273, "a": [], "b": [{"id": "K-B03", "cat": "B", "title": "对嫦娥：一级打不过，别抢线", "self": "<h3><a class=\"kref\" href=\"#K-B03\">K-B03<\/a> 对嫦娥：一级打不过，别抢线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嫦娥（中路）<\/li><li><strong>克制层级<\/strong>：<strong>节奏克<\/strong>（王维一级弱势，嫦娥一级能压）<\/li><li><strong>我该怎么做<\/strong>：<\/li><li>一技能<strong>只打后排兵<\/strong>，不打人<\/li><li>目的不是消耗，是<strong>防止被卡线掉状态<\/strong><\/li><li>一旦掉状态就退回塔后，交给 <code>D_对局内/04_对线期.md<\/code> 的 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 处理<\/li><li><strong>反向反制<\/strong>：这条只在一级成立。王维是\"弱前期强后期\"型，<strong>撑过前期后对位关系会反转<\/strong>——不要在 3 级后还按\"打不过\"处理。<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:23；BV15EJk6fEwX @ 00:27；BV15EJk6fEwX @ 00:30<\/li><li><strong>可信度<\/strong>：中（单来源，且 UP 主只给了\"对面是嫦娥\"这一个样本）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>王维克谁（素材只讲了对嫦娥被压这一侧）<\/li><li>王维对其他强势中路（如不知火舞类突进）的表现<\/li><\/ul>", "sum": "适用版本：S45针对对手：嫦娥（中路）克制层级：节奏克（王维一级弱势，嫦娥一级能压）我该怎么做：一技能只打后排兵，不打人目的不是消耗，是防止被卡线掉状态一旦掉状态就退回塔后，交给 D_对局内/…", "opp": "嫦娥"}], "lanes": [], "n": 1, "b_n": 1, "vs": ["嫦娥"], "incoming": [], "lane_names": []}, {"name": "盾山", "hue": 59, "a": [{"id": "K-A52", "cat": "A", "title": "修塔是被低估的技能", "self": "<h3><a class=\"kref\" href=\"#K-A52\">K-A52<\/a> 修塔是被低估的技能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方塔被磨、需要拖时间<\/li><li><strong>判断依据<\/strong>：塔的血量与对面推进速度<\/li><li><strong>决策分支<\/strong>：修塔给塔加护盾（约 600 点量级），换取一波兵线时间<\/li><li><strong>来源<\/strong>：BV13E411p7HY @ 07:06<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A53\">K-A53<\/a> 盾山吃\"沟通\"，不吃操作上限<\/h3>\n<p>开团前确认队友跟不跟，是<strong>所有开团型游走的通用纪律<\/strong>，已迁到 <code><a class=\"kref\" href=\"#K-L17\">K-L17<\/a><\/code>。原句里\"盾山胜率不高是因为队友不了解他\"属于英雄普及度问题，不构成判断。<\/p>\n<h2>6. 待补<\/h2>\n<ul><li>S45 攻速阈值是否变化（铭文那套是 2020 年的）。<\/li><li>完整六件套顺序（素材只给了分场景的出装原则，没有完整列表）。<\/li><li>盾山与鲁班/黄忠/嬴政的对位结论，应整理进 <code>B_克制关系/盾山.md<\/code>。<\/li><\/ul>", "sum": "开团前确认队友跟不跟，是所有开团型游走的通用纪律，已迁到 K-L17。"}], "b": [], "lanes": ["roam"], "n": 1, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}], "general": [{"key": "D", "cat": "对局内", "title": "主线地图", "file": "00_主线地图.md", "intro": "<p>读完这一页，你应该知道<strong>这局该按什么顺序想事<\/strong>，而不是\"有多少个知识点\"。<\/p>\n<h2>决策主线（节间依赖）<\/h2>\n<pre><code>01 选人 ──► 02 开局前90秒 ──► 03 前四分钟 ──► 04 对线期 ──► 05 第一波转线\n                                                              │\n05 ──► 06 中期资源 ──► 07 团战 ──┬──► 08 顺风推进 ──┐\n              ▲                  └──► 09 逆风止损 ──┴──► 10 终结比赛\n              │\n     04 ─(无对线权且持续到4分钟，直接跳 09)─┘<\/code><\/pre>\n<p>实线是正常推进；<strong>04 → 09 这条斜边是\"跳节\"路径<\/strong>——对线期就崩了的话，05、06、07 全部不成立，要直接进止损逻辑。清单式知识库给不出这条边。<\/p>\n<h2>每节回答的问题<\/h2>\n<div class=\"tw\"><table><thead><tr><th>节<\/th><th>只回答这一个决定<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>01 选人<\/td><td>我拿什么英雄，取决于对面已经选了什么<\/td><td>待写<\/td><\/tr><tr><td>02 开局前90秒<\/td><td>我一级站哪、第一波去哪<\/td><td>素材已备（BV1yke26fEYB 开局公式）<\/td><\/tr><tr><td>03 前四分钟<\/td><td>这一波我该不该抢线<\/td><td>待写<\/td><\/tr><tr><td><strong>04 对线期<\/strong><\/td><td><strong>这波线清完，我该往哪走<\/strong><\/td><td>✅ 已完成<\/td><\/tr><tr><td>05 第一波转线<\/td><td>我动起来之后，先去哪一路<\/td><td>待写<\/td><\/tr><tr><td>06 中期资源<\/td><td>下一个资源点该不该争<\/td><td>待写<\/td><\/tr><tr><td>07 团战<\/td><td>这波团我该站在哪、什么时候进<\/td><td>待写<\/td><\/tr><tr><td>08 顺风推进<\/td><td>拿到优势后，先推塔还是先控野<\/td><td>待写<\/td><\/tr><tr><td>09 逆风止损<\/td><td>打不过的时候，损失怎么止住<\/td><td>待写<\/td><\/tr><tr><td>10 终结比赛<\/td><td>怎么把优势变成水晶<\/td><td>待写<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<ul><li>经济差只是战斗力差的一种来源，不是唯一来源。<\/li><li>信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。<\/li><li>这条来自 <code>BV1i2n96AEvp @ 02:31<\/code>，原文：\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/li><\/ul>\n<h2>读这套东西的正确姿势<\/h2>\n<ol><li>先看当前局的<strong>时间点<\/strong>，定位到哪一节；<\/li><li>读那节的\"判断树\"，找自己正卡在哪个判据上；<\/li><li>只看那个判据对应的 K 条目，不要通读；<\/li><li>条目里的\"反例\"比\"结论\"更值钱——那是别人踩过的坑。<\/li><\/ol>\n<h2>三条写作硬规矩（新增内容必须遵守）<\/h2>\n<ol><li><strong>文件名是一个\"决定\"，不是话题。<\/strong> 不许出现\"英雄\"\"铭文\"\"出装\"这类名词短语。<\/li><li><strong>每节第一节必须是\"上一节留下的问题\"<\/strong>，且点名上一节哪个分支留下了它。断链的节不许存在。<\/li><li><strong>易错点按环节归位，不单列。<\/strong> 禁止\"本节易错点：①②③\"，错必须挂在它所属的判断节点下。<\/li><\/ol>", "entries": []}, {"key": "D", "cat": "对局内", "title": "04 对线期：这波线清完，我该往哪走", "file": "04_对线期.md", "intro": "<blockquote><p><strong>依赖<\/strong>：03 前四分钟（结论：线权来自第一波谁先清完） <strong>被依赖<\/strong>：05 第一波转线（本节产出的「可动窗口」是 05 的输入）；09 逆风止损（本节判定\"没线权\"且持续到 4 分钟，直接跳 09）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>03 结尾留下的是：<strong>\"你先到 2 级了，然后呢？\"<\/strong><\/p>\n<p>先到 2 级只说明你<strong>有了一次清线优势<\/strong>，不等于你能走。这一节要回答的，是这次优势能不能换成地图上的东西——换不成，优势会在 90 秒内自己蒸发。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>这一波线清完之后，我是往河道走、往边路走，还是退回塔后等下一波？<\/strong><\/p>\n<p>不是\"怎么打得更好\"，是\"这一步该不该动\"。操作的差距在这个决定面前是次要的。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>中线清完 / 即将清完（判断起点）\n│\n├─ 判据 A：我有没有线权？（看谁的小兵更多、谁先推过去）\n│   ├─ 没有（我方兵线被压回塔前，或我每波都在塔下补刀）\n│   │   ├─ 判据 A1：对面法师是否已经离开中线？（小地图 8 秒内无其视野）\n│   │   │   ├─ 是 → 【K-D01】不尾随，往反方向去拿资源\n│   │   │   └─ 否 → 【K-D02】塔后过线，同时给边路打信号\n│   │   └─ 判据 A2：我这一波掉了多少状态？（血量 &lt;60% 且无闪现）\n│   │       ├─ 是 → 【K-D03】回城，不要为了保线硬撑\n│   │       └─ 否 → 留在塔后等下一波\n│   └─ 有（我方小兵更多，或对面被迫交技能补刀）\n│       ├─ 判据 B：下一波兵到线还需多久？\n│       │   ├─ &gt;8 秒 → 够一次短游，进判据 C\n│       │   └─ ≤8 秒 → 【K-D04】不动，把线再推一波更赚\n│       └─ 判据 C：我方打野在哪？\n│           ├─ 在我方半区/河道 → 【K-D05】跟他走同一侧，去做视野或反野\n│           └─ 位置未知/在对面半区 → 【K-D06】只占中轴草，不深入\n└─ 判据 D：这波我死了或刚复活\n    └─ 【K-D07】先回中线过线，不要先参团<\/code><\/pre>\n<p>每个叶子都对应下面一个 K 条目。<strong>树里没有\"视情况而定\"这种分支<\/strong>——出现这三个字说明判据没写清。<\/p>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>线权<\/td><td>双方小兵数量与位置<\/td><td>我方小兵 ≥ 对方且未进塔<\/td><td>判据 A<\/td><\/tr><tr><td>对面法师视野<\/td><td>小地图<\/td><td>消失 &gt;8 秒<\/td><td>A1<\/td><\/tr><tr><td>自身血量 / 召唤师技能<\/td><td>血条 + 技能栏<\/td><td>血量 &lt;60% 且无闪现<\/td><td>A2<\/td><\/tr><tr><td>下一波兵到线时间<\/td><td>兵线节奏（约 30 秒一波）<\/td><td>&gt;8 秒<\/td><td>B<\/td><\/tr><tr><td>我方打野位置<\/td><td>小地图<\/td><td>己方半区 / 未知<\/td><td>C<\/td><\/tr><tr><td>是否刚复活<\/td><td>复活计时<\/td><td>—<\/td><td>D<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>底层判据（适用于全库）<\/strong>：判断\"能不能打\"看的不是经济差，是<strong>战斗力差 × 能不能及时到达<\/strong>。信息不足时这条压过一切技巧性结论——这条来自 <code>BV1i2n96AEvp<\/code> 的框架，原文是\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/p>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D01", "cat": "D", "title": "没线权，对面法师走了——我不跟，去反方向", "self": "<h3><a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 没线权，对面法师走了——我不跟，去反方向<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（2026-09-23 起）；S46 待复核<\/li><li><strong>触发条件<\/strong>：我方中路无线权（兵线被压回塔前）；对面法师小地图消失 &gt;8 秒<\/li><li><strong>判断依据<\/strong>：对面法师的消失方向（看小地图最后视野朝向哪一路）；我方另一路是否有可拿资源<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面法师去上 → <strong>我去下路<\/strong>，拿河蟹/兵线/野区小资源<\/li><li>对面法师去下 → <strong>我去上路<\/strong>，同理<\/li><li>完全看不出方向 → 不动，塔后过线<\/li><li><strong>反例<\/strong>：「对面法师去支援了，我赶紧跟过去」——你没有线权，走过去比他慢 5 秒以上，到了正好接他一套技能，还把中线白送。<strong>尾随强势法师作用不大，不如反方向拿资源。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a>（先要能安全过线）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:38；BV15EJk6fEwX @ 00:41<\/li><li><strong>可信度<\/strong>：高（全局思路复盘，非剪辑集锦；与《一野二边三射四中》的开局逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（2026-09-23 起）；"}, {"id": "K-D02", "cat": "D", "title": "没线权时的过线方式：塔后过，不打信号就完事", "self": "<h3><a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 没线权时的过线方式：塔后过，不打信号就完事<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：判定为无线权状态，且需要继续吃中线经济<\/li><li><strong>判断依据<\/strong>：对面法师的消耗距离；我方塔的血量<\/li><li><strong>决策分支<\/strong>：<\/li><li>站在<strong>塔后<\/strong>过线（不是塔前补刀），同时观察对面法师动向<\/li><li>给边路打信号，说明\"我这路被压，你们注意对面中单可能来\"<\/li><li><strong>反例<\/strong>：「我打个信号让队友别打就行了」——这条被明确否掉了：对面法师+打野一起进你们野区，或者四包二越你们下路，一个信号拦不住。<strong>打信号不能替代你到场<\/strong>。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:03；BV15EJk6fEwX @ 01:10<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：判定为无线权状态，且需要继续吃中线经济判断依据：对面法师的消耗距离；"}, {"id": "K-D03", "cat": "D", "title": "血线被打到 60% 以下且没闪现——回家，别保线", "self": "<h3><a class=\"kref\" href=\"#K-D03\">K-D03<\/a> 血线被打到 60% 以下且没闪现——回家，别保线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中路对线期，血量 &lt;60%，闪现已交或在冷却<\/li><li><strong>判断依据<\/strong>：对面法师的技能冷却与斩杀线；我方塔下是否安全<\/li><li><strong>决策分支<\/strong>：<\/li><li>直接回城，接受掉 1–2 个兵<\/li><li>若对面法师蓝量也不健康且无法越塔 → 可以再撑一波，但要站在塔后<\/li><li><strong>反例<\/strong>：「我血少但不能掉线，硬吃一波」——<strong>掉状态之后轻则被单杀、丢闪现，重则丢野区<\/strong>。这是\"为了一波兵输掉整条线\"的典型。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:30；BV15EJk6fEwX @ 00:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中路对线期，血量 &lt;60%，闪现已交或在冷却判断依据：对面法师的技能冷却与斩杀线；"}, {"id": "K-D04", "cat": "D", "title": "有线权但下一波兵 8 秒内到——别走，再推一波", "self": "<h3><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 有线权但下一波兵 8 秒内到——别走，再推一波<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有明确线权；下一波兵线到线时间 ≤8 秒<\/li><li><strong>判断依据<\/strong>：兵线节奏（约 30 秒一波）；当前小兵数量<\/li><li><strong>决策分支<\/strong>：留在线上再推一波，把兵线送进对面塔，让对面疲于补塔刀<\/li><li><strong>反例<\/strong>：「有线权就立刻游走」——走到一半兵线回来，你既没拿到资源也没吃到线，两头空。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:53<\/li><li><strong>可信度<\/strong>：中（阈值为 8 秒的推算值，UP 主未给具体秒数，需实战校准）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有明确线权；"}, {"id": "K-D05", "cat": "D", "title": "有线权且打野在同侧——跟他走，别自己单走", "self": "<h3><a class=\"kref\" href=\"#K-D05\">K-D05<\/a> 有线权且打野在同侧——跟他走，别自己单走<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权；我方打野位于己方半区或河道<\/li><li><strong>判断依据<\/strong>：打野位置与行进方向；对面打野是否已在小地图暴露<\/li><li><strong>决策分支<\/strong>：与打野走同一侧，做视野或反野；两人一起才有交换价值<\/li><li><strong>反例<\/strong>：「我自己先去探一下」——单人进野区在无视野情况下大概率被抓，而这次被抓会把刚拿到的线权一起吐出去。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a>（先确认可动窗口）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 02:11；BV15EJk6fEwX @ 02:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权；"}, {"id": "K-D06", "cat": "D", "title": "打野位置不明——只占中轴草，不深入", "self": "<h3><a class=\"kref\" href=\"#K-D06\">K-D06<\/a> 打野位置不明——只占中轴草，不深入<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权，但打野位置未知或在对面上半区<\/li><li><strong>判断依据<\/strong>：小地图打野最后出现位置与时间<\/li><li><strong>决策分支<\/strong>：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场<\/li><li><strong>反例<\/strong>：「反正有线权，去对面野区找个机会」——打野位置不明时进对面野区，等于把命交给概率。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:43；BV15EJk6fEwX @ 01:47<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权，但打野位置未知或在对面上半区判断依据：小地图打野最后出现位置与时间决策分支：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场反例：「…"}, {"id": "K-D07", "cat": "D", "title": "死了刚复活——先回中线过线，不要先参团", "self": "<h3><a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 死了刚复活——先回中线过线，不要先参团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：复活后场上正在发生团战或资源争夺<\/li><li><strong>判断依据<\/strong>：兵线位置；团战距离；自身大招冷却<\/li><li><strong>决策分支<\/strong>：<\/li><li>中线有兵且没人清 → <strong>先过线<\/strong>，再决定是否进场<\/li><li>中线已空 → 直接进场<\/li><li><strong>反例<\/strong>：「团战开始了必须去」——线不过，你到场也是白给经济，而且下一波还要被压。<strong>兵线大于团战<\/strong>这条在低分段尤其反直觉。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 03:24；BV15EJk6fEwX @ 03:26<\/li><li><strong>可信度<\/strong>：中（\"兵线大于团战\"是 UP 主的口号式结论，需在 06/07 用其他来源交叉验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：复活后场上正在发生团战或资源争夺判断依据：兵线位置；"}, {"id": "K-D08", "cat": "D", "title": "对线期的辅助：按「野→边→射→中」的顺序决定第一步", "self": "<h3><a class=\"kref\" href=\"#K-D08\">K-D08<\/a> 对线期的辅助：按「野→边→射→中」的顺序决定第一步<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，辅助决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>反例<\/strong>：「辅助就该跟着射手」——这是四个判据里排第三的一条，不是第一条。开局直接去发育路，等于放弃了野区节奏。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:47；BV1yke26fEYB @ 00:52<\/li><li><strong>可信度<\/strong>：中（该公式为 UP 主自创命名\"一野二边三射四中\"，非官方；顺序逻辑与 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 的反方向拿资源一致，故采信）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂，不单列）<\/h2>\n<ul><li><strong>在节点「判据 A 线权」上<\/strong>：把\"我先到 2 级\"当成\"我有线权\"。到 2 级只是一次，线权是持续状态，看的是<strong>这一波谁的小兵更多<\/strong>。<\/li><li><strong>在节点「判据 A1 对面法师消失」上<\/strong>：把\"小地图没有他\"当成\"他走了\"。消失 8 秒内可能只是在草丛里，直接跟过去会撞脸。<\/li><li><strong>在节点「判据 C 打野位置」上<\/strong>：把\"打野刚露头\"当成\"打野在附近\"。露头的位置决定他能不能到，不能到就等于不在。<\/li><li><strong>在节点「判据 D 刚复活」上<\/strong>：默认\"团战优先级最高\"。低分段最常见的死法就是复活后直奔团战，回来发现自己中线已经掉两波。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 的 8 秒阈值、<a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 的\"兵线大于团战\"均为单一来源，缺第二个 UP 主交叉验证 → <code>30_index/stale.md<\/code> 已登记。<\/li><li>本节的\"线权\"定义在中路成立，<strong>对抗路不适用<\/strong>（对抗路优势要控线，中路优势要推线）→ 对抗路支线待 P2 单独写，不要套用本节。<\/li><li>版本风险：王维为 S45 新英雄，若 S46 调整其一级强度，<a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 的\"塔后过线\"前提需重估。<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，辅助决定第一波去哪判断依据：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清决策分支…"}]}], "lanes": [{"key": "mid", "name": "中路", "icon": "中", "motto": "清完这波线往哪走", "file": "01_中路.md", "title": "中路：清完这波线，我往哪个方向走", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论，不是某个英雄的。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/<\/code>。<\/p><\/blockquote>\n<h2>1. 中路的位置特权：转线成本最低<\/h2>\n<p>中路是地图中心，<strong>到三条路的距离最短<\/strong>。所以中路的产出不是\"我打了多少伤害\"，而是<strong>\"我能在几个地方出现\"<\/strong>。<\/p>\n<p>这条决定了中路的判断顺序：<strong>先算线权（能不能走），再算方向（往哪走），最后才算操作（怎么打）<\/strong>。顺序反了就会出现\"我在中路打得很凶，但地图上什么都没发生\"。<\/p>\n<h2>2. 判断顺序（不能跳步）<\/h2>\n<pre><code>第 1 步：这波线，我有没有线权？        → K-L01\n   ↓ 有\n第 2 步：清完立刻走，还是再推一波？    → K-L02（判据：下一波兵到线时间）\n   ↓ 走\n第 3 步：往哪个方向走？                → K-L03（判据：对面中单消失方向 / 我方打野位置）\n   ↓ 顺路\n第 4 步：路过野区，蹭不蹭？            → K-L05（判据：能不能 3 秒内扫完）\n   ↓\n例外：打野差一级到四 → 中线让给他      → K-L04<\/code><\/pre>", "entries": [{"id": "K-L01", "cat": "L", "title": "线权不是\"我血多\"，是\"对面多快能清完这一波\"", "self": "<h3><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> 线权不是\"我血多\"，是\"对面多快能清完这一波\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每波兵线交汇前（判断自己能不能走）<\/li><li><strong>判断依据<\/strong>：对面中路（含辅助）<strong>一波兵需要几个技能<\/strong>。一个技能清完 = 你无线权；要三个技能以上 = 你有线权<\/li><li><strong>决策分支<\/strong>：<\/li><li>没线权 → 不硬抢，塔前接兵，改走\"反方向拿资源\"或等打野（见 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>）<\/li><li>有线权 → 清完立刻产生一个\"可动窗口\"，详见 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/li><li><strong>反例<\/strong>：「我血比对面多，所以我有线权」——血线是打架结果，不是线权来源。满血但清不动兵，照样是被压在塔下。<\/li><li><strong>分路差异<\/strong>：这条在对抗路也成立（<code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>），但中路的判据要多看一个人——<strong>对面辅助会不会来帮清<\/strong>，辅助一来清线速度直接翻倍。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:19（\"大乔一技能直接秒兵线，我只有一个人……这波没有线权\"）<\/li><li><strong>可信度<\/strong>：高（多英雄素材一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每波兵线交汇前（判断自己能不能走）判断依据：对面中路（含辅助）一波兵需要几个技能。"}, {"id": "K-L02", "cat": "L", "title": "有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口", "self": "<h3><a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：刚清完一波兵，下一波兵还没到<\/li><li><strong>判断依据<\/strong>：下一波兵到线还要多久（正常约 30 秒一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>到线 &gt; 8 秒 → 够一次短游，按 <a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 选方向<\/li><li>到线 ≤ 8 秒 → 不动，把线再推一波更赚（见 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「清完线在中路等下一波，顺便看有没有机会单杀」——单杀是低概率事件，转线是确定收益。<strong>有线权却不走，等于把线权浪费掉。<\/strong><\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:19（\"玩海月这种有线权的中单法师，一定要想办法在四级前多去控一两个中立资源\"）<\/li><li><strong>可信度<\/strong>：高（与 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code> 的 8 秒阈值互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：刚清完一波兵，下一波兵还没到判断依据：下一波兵到线还要多久（正常约 30 秒一波）决策分支：到线 &gt; 8 秒 → 够一次短游，按 K-L03 选方向到线 ≤ 8…"}, {"id": "K-L03", "cat": "L", "title": "方向选\"反方向\"，不是\"跟着走\"", "self": "<h3><a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 方向选\"反方向\"，不是\"跟着走\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要转线了，选往哪一路<\/li><li><strong>判断依据<\/strong>：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面中单往上 → <strong>我往下<\/strong>（拿河蟹、兵线、野区小资源）<\/li><li>对面中单往下 → 我往上<\/li><li>看不出方向 → 只占中轴草，不深入（<code><a class=\"kref\" href=\"#K-D06\">K-D06<\/a><\/code>）<\/li><li>我方打野在同侧 → 跟他走同一侧（<code><a class=\"kref\" href=\"#K-D05\">K-D05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「对面去支援了，我赶紧跟」——你没有线权时跟过去比他慢，有线权时跟过去也是<strong>同向撞车<\/strong>，两边都打不出东西。反方向才有空位。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:38；<code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的判据（BV1i2n96AEvp @ 02:31 底层框架）<\/li><li><strong>可信度<\/strong>：高（D 类已独立验证过同一条）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要转线了，选往哪一路判断依据：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区决策分支：对面中单往上 → 我往下（拿河蟹、兵线、野区小资源）对面中单往下 …"}, {"id": "K-L04", "cat": "L", "title": "中线归谁：打野差一级到四，中线让他", "self": "<h3><a class=\"kref\" href=\"#K-L04\">K-L04<\/a> 中线归谁：打野差一级到四，中线让他<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：打野走到中线想吃这波兵<\/li><li><strong>判断依据<\/strong>：打野当前等级离四级差多少<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野差一级到四 → <strong>让<\/strong>。他升四才有反打/进野区的能力，这一波线的收益远大于你自己多几十块<\/li><li>打野已四级以上 → 不让，按 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 自己清完转线<\/li><li><strong>反例<\/strong>：「我的线凭什么给他」——四级前的打野和四级后是两个英雄，这一波让出去，换的是他接下来 3 分钟的节奏权。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（\"此时一定要先选择速推中线……利用中线升四级，才可能有反打的机会\"）<\/li><li><strong>可信度<\/strong>：中高（打野视角的职业级素材，明确把中线当\"升四资源\"用）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：打野走到中线想吃这波兵判断依据：打野当前等级离四级差多少决策分支：打野差一级到四 → 让。"}, {"id": "K-L05", "cat": "L", "title": "顺路蹭野：用技能边缘扫一下就走，别站野区打完", "self": "<h3><a class=\"kref\" href=\"#K-L05\">K-L05<\/a> 顺路蹭野：用技能边缘扫一下就走，别站野区打完<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：清完线、等下一波兵的间隙，路过野区<\/li><li><strong>判断依据<\/strong>：这组野还剩多少血、你打完要几秒<\/li><li><strong>决策分支<\/strong>：只有一个技能的时间 → 边缘扫一下立刻走；要站桩打完 → 不打，回线<\/li><li><strong>反例<\/strong>：「顺手把野清干净」——你多待 5 秒，中线就丢了，中塔掉一半血。<strong>蹭野的收益上限是\"顺路\"，一旦需要绕路就不成立。<\/strong><\/li><li><strong>分路差异<\/strong>：对抗路也有\"顺路刷野\"，但对抗路可以合法地多待（见 <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>）；中路不行，中塔是全图最重要的塔。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:07（一技能边缘摸小猪，与直接转向相差约 0.3 秒）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：清完线、等下一波兵的间隙，路过野区判断依据：这组野还剩多少血、你打完要几秒决策分支：只有一个技能的时间 → 边缘扫一下立刻走；"}, {"id": "K-L06", "cat": "L", "title": "第一波线遇到钩子类辅助（钟馗），退到塔前接", "self": "<h3><a class=\"kref\" href=\"#K-L06\">K-L06<\/a> 第一波线遇到钩子类辅助（钟馗），退到塔前接<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面辅助是钟馗这类强制位移，且你在第一波线上<\/li><li><strong>判断依据<\/strong>：自己是否站在对方钩子的射程内<\/li><li><strong>决策分支<\/strong>：<strong>退到塔前接兵<\/strong>，不要站在兵线前沿；被勾进塔下等于直接脱节<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢线权的前提是你能安全清完。被钩一次，掉的不只是血，还有整波线的经验。<\/li><li><strong>分路差异<\/strong>：这条对<strong>清线慢的法师<\/strong>尤其致命（抢不动又躲不开），清线快的法师可以用一波技能换掉这个风险。<\/li><li><strong>来源<\/strong>：BV1Fd4y1k7EY @ 00:24；@ 01:09（清线慢所以先拿河蟹）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把线权当血量<\/strong>（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>）→ 明明清不动兵还站前面，被压到塔下，然后怪打野不来。<\/li><li><strong>有线权但不走<\/strong>（<a class=\"kref\" href=\"#K-L02\">K-L02<\/a>）→ 全场最贵的资源是\"能动的中单\"，站着等于放弃它。<\/li><li><strong>转线跟着对面走<\/strong>（<a class=\"kref\" href=\"#K-L03\">K-L03<\/a>）→ 同向撞车，两个人的收益都变成零。<\/li><\/ol>\n<h2>4. 交叉：中路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局第一波谁帮清中<\/td><td><code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（游走排序里中线排第四）/ <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>你转线过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>对面辅助一级来帮清中<\/strong>时，中单该不该抢——素材里出现过（BV1xEFGzoEYA 提到大乔一技能秒兵线），但没有明确结论。<\/li><li>中路对\"炮台 vs 法刺\"两类英雄的转线时机差异，只有零散片段。<\/li><li>S46 版本中路兵线节奏是否变化（S45 按 30 秒/波算）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面辅助是钟馗这类强制位移，且你在第一波线上判断依据：自己是否站在对方钩子的射程内决策分支：退到塔前接兵，不要站在兵线前沿；"}], "hue": 216, "heroes": ["不知火舞", "女娲", "小乔"], "stages": [{"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "cross": ["游走", "发育路", "对抗路", "打野"]}, {"key": "roam", "name": "游走", "icon": "游", "motto": "第一步去哪", "file": "02_游走.md", "title": "游走：第一步去哪", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/04_对线期.md<\/code>（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>）。<\/p><\/blockquote>\n<h2>1. 游走没有自己的线，靠别人的线吃饭<\/h2>\n<p>这是游走和另外四路最根本的区别：<strong>你没有一条自己清的线，所以你的\"活动资格\"完全来自队友的线权<\/strong>。队友被压在塔下，你就只能蹲在旁边；队友有压制力，你才有机会去野区、去别的路。<\/p>\n<p>由此推出游走唯一的核心指标：<strong>你这一波能不能让某个点上从 N 打 N 变成 N+1 打 N<\/strong>。做不到，你在哪都是多余的。<\/p>\n<p>这也是为什么\"跟着射手走\"是最常见的错误——<strong>跟人不产生人数差，只有\"到得比对面快\"才产生人数差<\/strong>。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：开局第一波去哪？          → K-L12（排「野→边→射→中」，中线排第四）\n第 2 步：帮打野时，手要放在哪？    → K-L13（不抢尾刀）\n第 3 步：帮中路抢线时，打谁？      → K-L14（连人带兵一起打）\n第 4 步：中期，跟谁？              → K-L15（跟射手转线，不是围中路）\n第 5 步：对面有强开团/钩子，站哪？ → K-L16（吃钩子是你的活）\n第 6 步：要开团了，开不开？        → K-L17（队友不跟就不开）<\/code><\/pre>", "entries": [{"id": "K-L11", "cat": "L", "title": "游走唯一的产出是\"人数差\"，不是\"保护\"", "self": "<h3><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> 游走唯一的产出是\"人数差\"，不是\"保护\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何时刻，当你不知道自己去哪<\/li><li><strong>判断依据<\/strong>：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N<\/li><li><strong>决策分支<\/strong>：<\/li><li>会变成多打少 → 去，哪怕只是站在那吃伤害<\/li><li>不会变 → 不去。这一趟的收益是零，还白送视野给对面<\/li><li><strong>反例<\/strong>：「辅助的职责是保护 C 位」——保护是一个<strong>结果<\/strong>，不是动作。真正的动作是\"让这个点上我们的人比他们多\"。跟着 C 位走一整局，人数差一次都没造出来，等于没打。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 06:14（\"用大招把队友传过来打一个人数差团战，这就是大乔\"）<\/li><li><strong>可信度<\/strong>：中高（这是大乔的结论，但\"人数差\"本身是位置级的判据，不依赖传送这个技能）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何时刻，当你不知道自己去哪判断依据：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N决策分支：会变成多打少 → 去，哪怕只是站在那吃伤害不会变 …"}, {"id": "K-L12", "cat": "L", "title": "开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列", "self": "<h3><a class=\"kref\" href=\"#K-L12\">K-L12<\/a> 开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>发育路排在第三位<\/strong>：只有前两条都不成立、且对面 2v2 压制明显时才直接去下<\/li><li><strong>反例<\/strong>：「辅助就该保射手」——按这个排序，开局直接去发育路等于放弃了野区节奏和边路一血，两条都比\"保一个还没成型的射手\"值钱。<\/li><li><strong>判据来源<\/strong>：<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（BV1yke26fEYB @ 00:47、@ 00:52，UP 主自创命名\"一野二边三射四中\"）<\/li><li><strong>分路差异<\/strong>：这条只对游走成立。中路/对抗路没有\"选一个点去\"的自由，他们被自己的线钉住了。<\/li><li><strong>来源<\/strong>：BV1M81kYpEPE @ 01:01、@ 01:51（大乔开局跟中路抢线，不跟射手）<\/li><li><strong>可信度<\/strong>：高（D 类独立写过同一判据，两个不同 UP 一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，决定第一波去哪判断依据：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清决策分支：打野要偷…"}, {"id": "K-L13", "cat": "L", "title": "帮打野刷野：不补最后一刀", "self": "<h3><a class=\"kref\" href=\"#K-L13\">K-L13<\/a> 帮打野刷野：不补最后一刀<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局帮打野清第一个野<\/li><li><strong>判断依据<\/strong>：打野是否已出打野刀、这组野是不是他的叠层来源<\/li><li><strong>决策分支<\/strong>：<strong>只打不补<\/strong>，最后一刀留给打野；自己拿助攻经验就走<\/li><li><strong>反例<\/strong>：「帮打野就是帮他打快」——抢了尾刀，他少一层、你多几十块。这笔账在四级前是亏的，因为打野的等级直接决定他能不能进野区。<\/li><li><strong>分路差异<\/strong>：这条<strong>五路通用<\/strong>，但收益最大的是游走（因为只有游走会主动站在野怪旁边）。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中（口播一句话，但与\"打野要靠等级进野区\"的 <a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局帮打野清第一个野判断依据：打野是否已出打野刀、这组野是不是他的叠层来源决策分支：只打不补，最后一刀留给打野；"}, {"id": "K-L14", "cat": "L", "title": "帮中路抢线：连人带兵一起打，不要只清兵", "self": "<h3><a class=\"kref\" href=\"#K-L14\">K-L14<\/a> 帮中路抢线：连人带兵一起打，不要只清兵<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级帮中路抢线<\/li><li><strong>判断依据<\/strong>：己方中单能不能跟上（有没有远程消耗手段）<\/li><li><strong>决策分支<\/strong>：不急着补兵，<strong>先连人带兵一起打<\/strong>，把对面中单磨成残血——即使他抢到线权，也打不动了<\/li><li><strong>反例<\/strong>：「帮中就是帮他把线清完」——线清完了但对面满血，下一波他照样压你家中单。<strong>抢线权的目的是让对面失去打架能力，不只是让兵线过去。<\/strong><\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 01:47（职业选手\"大帅\"的打法解析）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级帮中路抢线判断依据：己方中单能不能跟上（有没有远程消耗手段）决策分支：不急着补兵，先连人带兵一起打，把对面中单磨成残血——即使他抢到线权，也打不动了反例：「帮中就…"}, {"id": "K-L15", "cat": "L", "title": "中期跟射手转线，不是围着中路转", "self": "<h3><a class=\"kref\" href=\"#K-L15\">K-L15<\/a> 中期跟射手转线，不是围着中路转<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：进入中期（约 10 分钟后）<\/li><li><strong>判断依据<\/strong>：射手是否已经能独立吃线、有没有被越塔风险<\/li><li><strong>决策分支<\/strong>：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏<\/li><li><strong>反例<\/strong>：「辅助要跟团」——中期最值钱的动作是<strong>帮射手把线吃满 + 把视野推过去<\/strong>，在中路蹲着既不吃线也不做视野。<\/li><li><strong>分路差异<\/strong>：这条的前提是你的英雄有\"带人移动\"的能力（大乔的传送、鲁班大师的链子）。纯坦辅只能\"跟着走\"，收益减半（见 <code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 07:26、@ 06:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：进入中期（约 10 分钟后）判断依据：射手是否已经能独立吃线、有没有被越塔风险决策分支：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏反例：「辅助要跟团」——中…"}, {"id": "K-L16", "cat": "L", "title": "对面有钟馗这类钩子：**吃钩子是你的活**", "self": "<h3><a class=\"kref\" href=\"#K-L16\">K-L16<\/a> 对面有钟馗这类钩子：<strong>吃钩子是你的活<\/strong><\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面选出强制位移型辅助（钟馗为代表）<\/li><li><strong>判断依据<\/strong>：己方谁站在能被勾到的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>由辅助去吃钩<\/strong>，不要让它勾到 C 位；辅助被勾是\"可以接受的结果\"，C 位被勾是\"这波没了\"<\/li><li>团战前<strong>跟着钩子走<\/strong>：他去哪你跟到哪，防他勾自家野区 Buff<\/li><li>站位避开\"中左\"这类视野盲区的正面入口<\/li><li><strong>反例<\/strong>：「辅助要保护 C 位」——保护的具体动作就是<strong>站在他和钩子之间<\/strong>。躲在后面不叫保护。<\/li><li><strong>来源<\/strong>：BV1DGHx61EHn @ 11:08、@ 11:51、@ 14:35（\"你辅助要去挡钟馗钩子呀\"）；@ 03:37（\"你跟着钟馗走就可以防止钟馗勾野了\"）<\/li><li><strong>可信度<\/strong>：中高（这是一局实录里的指挥，说话人位置未确认，但内容是<strong>明确对辅助下的指令<\/strong>，可直接采）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面选出强制位移型辅助（钟馗为代表）判断依据：己方谁站在能被勾到的位置决策分支：由辅助去吃钩，不要让它勾到 C 位；"}, {"id": "K-L17", "cat": "L", "title": "开团前先确认队友跟不跟，不跟就不开", "self": "<h3><a class=\"kref\" href=\"#K-L17\">K-L17<\/a> 开团前先确认队友跟不跟，不跟就不开<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何要主动开团的时刻<\/li><li><strong>判断依据<\/strong>：队友是否知道你要开（信号/语音）、是否有输出位在射程内<\/li><li><strong>决策分支<\/strong>：先打信号确认；确认不到就不开，改打消耗<\/li><li><strong>为什么这条属于游走<\/strong>：另外四路开团失败最多是\"死一个人\"，游走开团失败是\"全队没了\"——因为游走是唯一\"用控制换队友输出\"的位置，队友没跟上，你的控制就是白交。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 13:09（\"如果队友能很好配合，盾山 T0 强度是有的\"）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何要主动开团的时刻判断依据：队友是否知道你要开（信号/语音）、是否有输出位在射程内决策分支：先打信号确认；"}, {"id": "K-L18", "cat": "L", "title": "打连体（2v2）：卡线压位置，别急着换血", "self": "<h3><a class=\"kref\" href=\"#K-L18\">K-L18<\/a> 打连体（2v2）：卡线压位置，别急着换血<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线<\/li><li><strong>判断依据<\/strong>：己方 2v2 能不能打过、对面射手敢不敢压<\/li><li><strong>决策分支<\/strong>：<\/li><li>打得过 → <strong>卡线压位置<\/strong>：对面过来就打状态，不过来就掉兵<\/li><li>打不过 → 退塔下接，别硬换<\/li><li><strong>反例<\/strong>：「打不过就消耗」——打不过的时候消耗等于送，退塔下让对方\"吃掉这波兵但不拿人头\"才是最小损失。<\/li><li><strong>交叉<\/strong>：这条和发育路共用（<code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code>），判据重心不同——<strong>辅助看的是\"能不能卡住位置\"，射手看的是\"敢不敢吃这波兵\"<\/strong>。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39、@ 03:00<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"跟人\"当\"保护\"<\/strong>（<a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L15\">K-L15<\/a>）→ 跟人不产生人数差，站位才产生。<\/li><li><strong>帮打野时手贱补尾刀<\/strong>（<a class=\"kref\" href=\"#K-L13\">K-L13<\/a>）→ 你赚 40 块，换他晚 30 秒到四。<\/li><li><strong>开团不看队友位置<\/strong>（<a class=\"kref\" href=\"#K-L17\">K-L17<\/a>）→ 控制交出去了，队友还在清线。<\/li><\/ol>\n<h2>4. 交叉：游走和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>开局第一波帮不帮清中<\/td><td><code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code> / <code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code><\/td><\/tr><tr><td>发育路<\/td><td>开局跟不跟射手、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code><\/td><\/tr><tr><td>打野<\/td><td>野区要不要跟<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>（打野的野区速率约束）<\/td><\/tr><tr><td>对抗路<\/td><td>边路一血要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>（他能不能给你创造机会）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>软辅 vs 硬辅的大局观差异<\/strong>：现在所有结论都偏硬辅（能吃钩、能开团）。大乔/鲁班大师这类功能辅的\"不吃钩\"版本没有素材。<\/li><li>逆风局的游走该怎么打（断线？保塔？）——只有大乔一条（<code><a class=\"kref\" href=\"#K-A32\">K-A32<\/a><\/code>），是英雄级不是分路级。<\/li><li>中期\"跟射手\"和\"跟打野\"的取舍阈值（多少经济差该换人）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线判断依据：己方 2v2 能不能打过、对面射手敢不敢压决策分支：打得过 → 卡线压位置：对面过来就打状态，不过来就掉兵打不过 → 退塔下接，别硬换反例…"}], "hue": 358, "heroes": ["苏烈", "大乔", "鲁班大师", "盾山"], "stages": [{"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "cross": ["中路", "发育路", "对抗路", "打野"]}, {"key": "adc", "name": "发育路", "icon": "射", "motto": "这波兵敢不敢吃", "file": "03_发育路.md", "title": "发育路：这波兵我敢不敢吃", "intro": "<blockquote><p>⚠️ <strong>这一路是全库最缺素材的一块。<\/strong> 现有素材全部来自<strong>辅助/指挥视角<\/strong>（大乔的运营、盾山的 2v2），没有任何一条是射手第一视角的全局教学。下面三条是\"从别人的镜头里能确认\"的部分，<strong>不是完整的射手大局观<\/strong>。<\/p><\/blockquote>\n<h2>1. 射手的位置特征：经济最贵，也最容易被开<\/h2>\n<p>射手是全场唯一\"输出全靠经济堆\"的位置——法师有技能基础伤害、战士有技能组，射手的伤害几乎等于装备。所以发育路的核心矛盾永远是同一句话：<\/p>\n<blockquote><p><strong>这一波兵的钱，值不值得用\"被开一次\"的风险去换。<\/strong><\/p><\/blockquote>\n<p>别的路可以\"打不过就发育\"，射手不行——<strong>不打钱就没有输出，打钱就暴露<\/strong>。这个矛盾没有完美解，只有判断。<\/p>\n<h2>2. 判断顺序（不完整，见文末待补）<\/h2>\n<pre><code>第 1 步：这波线在哪？我能不能安全过去？  → K-L21\n第 2 步：对面 2v2 谁强？                → K-L22（看辅助，不看射手）\n第 3 步：兵线过河了，我要不要跟？        → K-L23<\/code><\/pre>", "entries": [{"id": "K-L21", "cat": "L", "title": "射手的经济不是\"待在下路\"赚的，是\"哪条线安全就去哪条\"", "self": "<h3><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> 射手的经济不是\"待在下路\"赚的，是\"哪条线安全就去哪条\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路兵线被对面控住、或下塔已经掉了<\/li><li><strong>判断依据<\/strong>：哪条线的兵线位置安全（能吃到、不被越）<\/li><li><strong>决策分支<\/strong>：<\/li><li>下路被压 → <strong>去中路补线<\/strong>（我方中单转线的空档），不要在下路硬顶<\/li><li>上路出现空档 → 也可以去上路吃线，但要有队友接应<\/li><li><strong>反例<\/strong>：「射手就该待在下路」——素材里的指挥原话是\"我们就叫射手去中路补线\"、\"把射手跟中单摇过来\"。<strong>射手是\"被调度去吃安全线\"的位置，不是\"守着一条路\"的位置。<\/strong><\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 03:09、@ 03:26、@ 03:35<\/li><li><strong>可信度<\/strong>：中（<strong>辅助/指挥视角<\/strong>，看到的是\"怎么安排射手\"，不是\"射手怎么想\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路兵线被对面控住、或下塔已经掉了判断依据：哪条线的兵线位置安全（能吃到、不被越）决策分支：下路被压 → 去中路补线（我方中单转线的空档），不要在下路硬顶上路出现空档…"}, {"id": "K-L22", "cat": "L", "title": "2v2 的线权看辅助，不看射手", "self": "<h3><a class=\"kref\" href=\"#K-L22\">K-L22<\/a> 2v2 的线权看辅助，不看射手<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线期<\/li><li><strong>判断依据<\/strong>：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方辅助强 → 敢压，卡线压位置<\/li><li>我方辅助弱 → 退塔下接，接受\"掉几个兵换不掉人头\"<\/li><li><strong>反例<\/strong>：「我伤害比他高，应该压」——2v2 的对线强度由<strong>辅助的开团/承伤能力<\/strong>决定，射手前期的伤害差距远小于\"谁能先手控住\"。<\/li><li><strong>交叉<\/strong>：同一条判据在游走位也有（<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code>），但两边的落点不同——辅助看\"能不能卡住位置\"，射手看\"敢不敢跟上去输出\"。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39、@ 03:00<\/li><li><strong>可信度<\/strong>：中高（盾山视角，明确把 2v2 的胜负归因到辅助身上）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线期判断依据：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害决策分支：我方辅助强 → 敢压，卡线压位置我方辅助弱 → 退塔下接，接受…"}, {"id": "K-L23", "cat": "L", "title": "兵线过河前，先确认对面打野和中单的位置", "self": "<h3><a class=\"kref\" href=\"#K-L23\">K-L23<\/a> 兵线过河前，先确认对面打野和中单的位置<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：兵线要推过河道<\/li><li><strong>判断依据<\/strong>：对面打野/中单在小地图上的最后视野位置与消失时长<\/li><li><strong>决策分支<\/strong>：<\/li><li>位置已知且不在附近 → 可以跟线<\/li><li>消失超过 8 秒且方向不明 → <strong>不跟<\/strong>，把线放回来在塔前吃（和 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 中路用的是同一个阈值）<\/li><li><strong>反例<\/strong>：「兵线过河才有压制力」——射手的压制力是拿\"被抓一次\"换的。被抓一次，掉的不只是这波兵，还有接下来两分钟的发育时间。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 02:31（\"我们射手被越\"）；阈值沿用 <code>K-D<\/code> 主线地图 / <code>04_对线期<\/code> 的 8 秒判定<\/li><li><strong>可信度<\/strong>：<strong>低<\/strong>（现象来自素材，阈值是从中路判据平移过来的，<strong>没有射手视角的验证<\/strong>，用之前自己判一下）<\/li><li><strong>状态<\/strong>：active（置信度低，待补）<\/li><\/ul>\n<h2>3. 交叉：发育路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>游走<\/td><td>开局跟不跟我、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>我去中路补线，他正在转线<\/td><td><code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code>（中单清完就走，空档正好给你）<\/td><\/tr><tr><td>打野<\/td><td>下路打起来他来不来<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>（看对面交了什么，不看谁喊了）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 待补（这一路的真实缺口）<\/h2>\n<p>素材层面必须补的东西，按优先级：<\/p>\n<ol><li><strong>射手第一视角的全局教学<\/strong>——现在 0 条。没有它，这一路永远只能写\"从别人眼里看到的射手\"。<\/li><li><strong>被越塔的判据<\/strong>：什么阵容/什么时间点会被二包一，怎么提前撤。<\/li><li><strong>什么时候开始跟团<\/strong>：射手从\"吃线\"切到\"参团\"的经济/时间阈值。<\/li><li><strong>不同射手的分类<\/strong>（站桩型 vs 位移型 vs 消耗型）对站位的不同要求。<\/li><\/ol>\n<p>补法：按 <code>s8_harvest.py<\/code> 同一套链路，关键词换成「射手 全局思路」「发育路 教学」+ 标题点名射手的，取 3–5 个 UP 各 2 条即可开写。<\/p>", "sum": "素材层面必须补的东西，按优先级："}], "hue": 256, "heroes": [], "stages": [], "cross": ["中路", "游走", "对抗路", "打野"]}, {"key": "solo", "name": "对抗路", "icon": "抗", "motto": "压线还是放线", "file": "04_对抗路.md", "title": "对抗路：这一波我压线还是放线", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 对抗路的位置特权：可以合法地不参团<\/h2>\n<p>对抗路离主战场最远，<strong>跑一趟的成本最高<\/strong>。所以这一路的核心不是\"我什么时候去支援\"，而是反过来——<strong>\"我能不能用不去支援，换到更多东西\"<\/strong>。<\/p>\n<p>这让对抗路成了五路里<strong>自主权最高<\/strong>的位置：中路必须转线、游走必须到点、射手必须跟辅助，只有对抗路可以说\"这波我不去，我把线带穿\"。<\/p>\n<p>代价也很清楚：<strong>你不在，团战就是 4v5<\/strong>。所以每一次\"不去\"都必须换来对等的东西——一座塔、两个野怪、或者对面一条线的经济。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：这一波，我要不要压线？        → K-L31（判据：压完能不能安全撤）\n第 2 步：压线的收益是什么？            → K-L32（对面打野来不了 / 对面边路升不到四）\n第 3 步：线权换来的钱，怎么花？        → K-L33（立刻走，别刷上头）\n第 4 步：打不过怎么办？                → K-L34（闷头发育也是赢法）<\/code><\/pre>", "entries": [{"id": "K-L31", "cat": "L", "title": "对抗路可以把线权直接换成钱——但必须先算好怎么撤", "self": "<h3><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> 对抗路可以把线权直接换成钱——但必须先算好怎么撤<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：拿到线权、把兵线推到对面塔前<\/li><li><strong>判断依据<\/strong>：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到<\/li><li><strong>决策分支<\/strong>：<\/li><li>有撤离手段 → <strong>推完立刻走<\/strong>，去中路吃一波线、或进野区刷钱，不要在自家线上原地站着<\/li><li>没有撤离手段 → 只推到河道，不深入<\/li><li><strong>反例<\/strong>：「推完线回城补给」——回城是最亏的选项：你花了 8 秒什么都不做。推完线去做下一件事，才是把线权变现。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:52、@ 04:06、@ 04:08（\"没传送的时候一波清兵线吃野怪刷钱；有传送的时候，清完兵线就传送阵传送开西，保证自己用最快的速度刷最多的钱\"）<\/li><li><strong>可信度<\/strong>：中高（司空震视角的完整一局，动作与口播一致）<\/li><li><strong>分路差异<\/strong>：中路也能推完线走，但<strong>中路走的方向是\"支援\"<\/strong>；对抗路走的方向是\"再吃一份钱\"。同一动作，目的不同。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：拿到线权、把兵线推到对面塔前判断依据：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到决策分支：有撤离手段 → 推完立刻走，去中路吃一波线、…"}, {"id": "K-L32", "cat": "L", "title": "卡线的双重收益：对面打野不敢来 + 对面边路升不到四", "self": "<h3><a class=\"kref\" href=\"#K-L32\">K-L32<\/a> 卡线的双重收益：对面打野不敢来 + 对面边路升不到四<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在线权上压制对面边路<\/li><li><strong>判断依据<\/strong>：兵线位置（能否卡在自家塔前）与对面打野的开局路线<\/li><li><strong>决策分支<\/strong>：把兵线<strong>卡在我方塔前<\/strong>——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了也抓不到人）<\/li><li><strong>反例<\/strong>：「压线就是把兵推过去」——推到对面塔下等于把兵线送给对方，他还是能吃到经验。<strong>卡线和推线是两个相反的动作。<\/strong><\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:47（\"因为我们的卡线，导致对面打野第一时间不敢来，哪吒也没升四，搞得对面一点战斗力都没有\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>交叉<\/strong>：这条直接决定<strong>打野能不能进对面野区<\/strong>（<code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>）——我方边路卡住线，对面打野才不敢反蹲。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在线权上压制对面边路判断依据：兵线位置（能否卡在自家塔前）与对面打野的开局路线决策分支：把兵线卡在我方塔前——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了…"}, {"id": "K-L33", "cat": "L", "title": "别刷上头：刷钱是为了能去支援，不是为了刷钱", "self": "<h3><a class=\"kref\" href=\"#K-L33\">K-L33<\/a> 别刷上头：刷钱是为了能去支援，不是为了刷钱<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你已经经济领先，正在连续刷钱<\/li><li><strong>判断依据<\/strong>：地图上有没有正在打的团/即将刷新的资源点<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友在打 → <strong>立刻传送/走过去<\/strong>，能用传送就不用跑的（省赶路时间）<\/li><li>没有事发生 → 继续带线刷钱，带完线顺手入侵野区<\/li><li><strong>反例<\/strong>：「我经济领先，先刷满再说」——原话是\"千万不要一直刷钱，刷上头了\"。经济领先的唯一用途是<strong>在关键团里碾压<\/strong>，不参团的领先是纸面数字。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 05:30、@ 05:37、@ 06:24<\/li><li><strong>可信度<\/strong>：中高（UP 主自己在同一局里既示范了刷钱也示范了节制）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你已经经济领先，正在连续刷钱判断依据：地图上有没有正在打的团/即将刷新的资源点决策分支：队友在打 → 立刻传送/走过去，能用传送就不用跑的（省赶路时间）没有事发生 →…"}, {"id": "K-L34", "cat": "L", "title": "打不过就闷头发育——经济领先也是一种赢法", "self": "<h3><a class=\"kref\" href=\"#K-L34\">K-L34<\/a> 打不过就闷头发育——经济领先也是一种赢法<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期被压制、支援不出去<\/li><li><strong>判断依据<\/strong>：能不能稳定吃到兵线；对面是否已经开始转线<\/li><li><strong>决策分支<\/strong>：放弃支援，专注吃线 + 刷自家野区，把经济差控制在可接受范围；等对面走位失误再打<\/li><li><strong>反例<\/strong>：「打不过也要去支援，不然队友骂」——去支援等于送第二个人头。<strong>对抗路最合法的止损就是\"不去\"。<\/strong><\/li><li><strong>来源<\/strong>：BV156QfBQEDd @ 01:14、@ 01:28（\"支援不了就闷头发育，经济领先对面边路\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>压线不会撤<\/strong>（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>）→ 推完站在对面塔前，等对面打野来收。<\/li><li><strong>把卡线做成推线<\/strong>（<a class=\"kref\" href=\"#K-L32\">K-L32<\/a>）→ 想让对面难受，结果把兵线送过去让他舒服。<\/li><li><strong>刷钱刷到不参团<\/strong>（<a class=\"kref\" href=\"#K-L33\">K-L33<\/a>）→ 经济第一，团战 4v5，输了怪队友。<\/li><\/ol>\n<h2>4. 交叉：对抗路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>我卡线，你能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>你转线过来，这波线谁吃<\/td><td><code><a class=\"kref\" href=\"#K-L03\">K-L03<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>边路一血要不要来帮<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>传送/传送阵的 CD 与距离<\/strong>没有素材，只能确定\"优先用传送、少跑路\"这个方向。<\/li><li>对抗路与打野的\"二包一\"配合（谁先手、怎么卡位）——无素材。<\/li><li>坦克型边路 vs 战士型边路的大局观差异（现在所有结论都偏\"能带线能刷钱\"的战士）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期被压制、支援不出去判断依据：能不能稳定吃到兵线；"}], "hue": 313, "heroes": ["夏洛特"], "stages": [], "cross": ["中路", "游走", "发育路", "打野"]}, {"key": "jungle", "name": "打野", "icon": "野", "motto": "该刷还是该抓", "file": "05_打野.md", "title": "打野：现在该刷还是该抓", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 打野是唯一按「时间差」算账的位置<\/h2>\n<p>另外四路的资源是<strong>线<\/strong>（有固定节奏，一波接一波），打野的资源是<strong>野<\/strong>（有刷新间隔，可以被\"抢时间差\"）。所以打野的核心概念不是\"抓了几个人\"，而是：<\/p>\n<blockquote><p><strong>野区速率<\/strong>——你清完自己野区的速度，决定你能不能\"多出一次机会\"。<\/p><\/blockquote>\n<p>原话：「很多人不理解野区速率这个概念。当双方野区刷新间隔比较短时，是很难直接进野区的，<strong>进野区起码要领先对方两个野怪的时间差<\/strong>。」<\/p>\n<p>这条一旦立住，打野的所有判断都变成同一道算术题：<strong>我这一趟出去，回来的时候会不会落后节奏？<\/strong><\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：这局我一级能不能反野？      → K-L42（不能 → 决定开局刷野路线）\n第 2 步：我要不要蹭中线升四？        → K-L43（蹭了会拖野区速率，必须换来反打）\n第 3 步：这波能不能进对面野区？      → K-L44（判据：有没有领先两个野怪 + 视野）\n第 4 步：什么时候放弃自家野区去跟团？→ K-L45（判据：边路是否打出关键技能）<\/code><\/pre>", "entries": [{"id": "K-L41", "cat": "L", "title": "打野的 KPI 是「时间差」，不是「抓了几个人」", "self": "<h3><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> 打野的 KPI 是「时间差」，不是「抓了几个人」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每一次决定\"现在去哪\"<\/li><li><strong>判断依据<\/strong>：你这一趟出去，回来时会不会落后对面的野区节奏<\/li><li><strong>决策分支<\/strong>：<\/li><li>这一趟不亏速率 → 可以抓<\/li><li>这一趟要绕远/要蹲很久 → 不抓，保住速率<\/li><li><strong>反例<\/strong>：「打野不抓人就废了」——抓不到人的一趟，亏的是<strong>两三个野怪的时间<\/strong>，而这段时间对面打野正好在做事。抓人失败不是\"没收益\"，是\"负收益\"。<\/li><li><strong>为什么是这一路的核心<\/strong>：另外四路的资源是线（有固定节奏，不走就浪费），只有打野的资源是野（可以抢时间差）。这条判据在其他四路没有对应物。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"很多人不理解野区速率这个概念……进野区起码要领先对方两个野怪的时间差\"）<\/li><li><strong>可信度<\/strong>：高（唯一的完整打野视角素材，且它自己就在用这个概念算账）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每一次决定\"现在去哪\"判断依据：你这一趟出去，回来时会不会落后对面的野区节奏决策分支：这一趟不亏速率 → 可以抓这一趟要绕远/要蹲很久 → 不抓，保住速率反例：「打野…"}, {"id": "K-L42", "cat": "L", "title": "开局路线由「一级能不能反野」决定，不是背固定路线", "self": "<h3><a class=\"kref\" href=\"#K-L42\">K-L42<\/a> 开局路线由「一级能不能反野」决定，不是背固定路线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局读条结束前<\/li><li><strong>判断依据<\/strong>：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）<\/li><li><strong>决策分支<\/strong>：<\/li><li>一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区<\/li><li>一级不好反 → <strong>从发育路野区开，往对抗路刷<\/strong>（把路线拉成一条单向线，刷完正好到能出节奏的位置）<\/li><li><strong>反例<\/strong>：「打野就按固定路线刷」——路线是<strong>为了配合一级强弱<\/strong>而存在的。一级反野失败的情况下还硬走入侵路线，等于把节奏送出去。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 03:09、@ 03:12（\"一级不好反野，这把就可以选择直接发育路野区开往对抗路\"）<\/li><li><strong>可信度<\/strong>：中高（职业级对局拆解，明确给了\"因为 A 所以 B\"的因果关系）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局读条结束前判断依据：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）决策分支：一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区一级不好反…"}, {"id": "K-L43", "cat": "L", "title": "蹭中线是「投资」，不是「顺手」——必须换来升四或反打", "self": "<h3><a class=\"kref\" href=\"#K-L43\">K-L43<\/a> 蹭中线是「投资」，不是「顺手」——必须换来升四或反打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：路过中路，中单有线权/中单不在<\/li><li><strong>判断依据<\/strong>：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>差一级到四 → <strong>蹭，且优先速推中线<\/strong>（升四之后才有反打能力）<\/li><li>已经四级以上 → 不蹭，继续刷野保速率<\/li><li><strong>反例<\/strong>：「路过就吃一口」——原话紧接着就是\"因为这波蹭中线耽误了片刻的野区速率\"。<strong>蹭线的成本是看得见的（速率），收益必须能兑现，否则纯亏。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（升四才有反打机会）；@ 06:01（蹭中线拖慢速率）<\/li><li><strong>可信度<\/strong>：高（同一条视频里同时给了收益和成本，是全库最完整的一组权衡）<\/li><li><strong>交叉<\/strong>：这条要和 <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> 对着看——<strong>中单让不让，看的是打野差几级到四<\/strong>。两边判据一致，才不会互相抢。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：路过中路，中单有线权/中单不在判断依据：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"决策分支：差一级到四 → 蹭，且优先速推中线（升四之后才有…"}, {"id": "K-L44", "cat": "L", "title": "进对面野区：至少领先两个野怪的时间差，并且卡住视野", "self": "<h3><a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 进对面野区：至少领先两个野怪的时间差，并且卡住视野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想反对面野区<\/li><li><strong>判断依据<\/strong>：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）<\/li><li><strong>决策分支<\/strong>：<\/li><li>领先 ≥2 个野怪 → 可以进，且<strong>边打边卡视野<\/strong>（先探草再动野怪）<\/li><li>领先不足 → 不进，稳稳刷完自家野区再出来找节奏<\/li><li><strong>反例<\/strong>：「对面打野在下路，我去反他蓝」——他去下路不代表他回不来，你的判断依据应该是<strong>时间差<\/strong>，不是\"他刚露过视野\"。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"进野区起码要领先对方两个野怪的时间差\"）；@ 09:45、@ 09:53（\"卡好视野……全身而退\"）<\/li><li><strong>可信度<\/strong>：高（这条是全库最硬的分路判据，有明确阈值）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：想反对面野区判断依据：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）决策分支：领先 ≥2 个野怪 → 可以进，且边打边卡视野（先探草再动…"}, {"id": "K-L45", "cat": "L", "title": "放弃自家野区去跟团的条件：边路打出了关键技能", "self": "<h3><a class=\"kref\" href=\"#K-L45\">K-L45<\/a> 放弃自家野区去跟团的条件：边路打出了关键技能<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：正在刷野，边路/中路打起来了<\/li><li><strong>判断依据<\/strong>：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面关键技能已交 → <strong>立刻放弃野区去跟<\/strong>（这时候的团是\"低风险高收益\"）<\/li><li>只是互相消耗 → 继续刷，别被\"打起来了\"骗过去<\/li><li><strong>反例<\/strong>：「哪边打起来就去哪边」——没有关键技能交换的团，打野去了也只能蹭点伤害，回来还落后节奏。<strong>打野参团的理由是对面交了什么，不是队友喊了什么。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:08、@ 07:24（\"拉视野观察到影被夏洛特打出大招……我们就可以直接放弃中线来跟团\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"抓人\"当 KPI<\/strong>（<a class=\"kref\" href=\"#K-L44\">K-L44<\/a>）→ 抓不到人的时候你在亏速率，亏两次就再也进不去对面野区。<\/li><li><strong>蹭线不兑现<\/strong>（<a class=\"kref\" href=\"#K-L43\">K-L43<\/a>）→ 蹭了线、没升四、没打成反打，纯亏速率。<\/li><li><strong>看到打架就去<\/strong>（<a class=\"kref\" href=\"#K-L45\">K-L45<\/a>）→ 没有关键技能交换的团，去了就是陪打。<\/li><\/ol>\n<h2>4. 交叉：打野和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code>（两边判据必须一致）<\/td><\/tr><tr><td>对抗路<\/td><td>我能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>（他卡住线我才敢进）<\/td><\/tr><tr><td>游走<\/td><td>开局野区要不要人跟<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>（游走第一顺位是野区）<\/td><\/tr><tr><td>发育路<\/td><td>下路打起来要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>（看对面交了什么）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>野怪刷新间隔的具体秒数<\/strong>没有素材，只有\"两个野怪的时间差\"这个相对阈值。<\/li><li>不同打野类型（节奏型 vs 发育型）的路线差异——现在只有一条镜的对局。<\/li><li>打野的\"逆风局\"怎么打（野区被反穿之后的重启方式）——完全无素材。<\/li><\/ul>", "sum": "适用版本：S45触发条件：正在刷野，边路/中路打起来了判断依据：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）决策分支：对面关键技能已交 → 立刻放弃野区去跟（这时候的团是\"低风险高收益…"}], "hue": 159, "heroes": [], "stages": [], "cross": ["中路", "游走", "发育路", "对抗路"]}], "stages": [{"file": "00_主线地图.md", "title": "主线地图", "roles": [], "id": "00"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "lane_about": "<h2>这一类回答什么<\/h2>\n<p><strong>\"我这个位置，该按什么顺序想事？\"<\/strong><\/p>\n<p>不是\"这个英雄怎么玩\"（A 类），也不是\"现在第几分钟\"（D 类），而是<strong>同一个时间点，五个位置看到的东西不一样、要做的决定也不一样<\/strong>。<\/p>\n<p>典型问法：「我中路清完线了该走哪」「我辅助开局去哪」「打野这波该刷还是该抓」——这些问题的答案跟你玩哪个英雄关系不大，跟你站哪个位置关系极大。<\/p>\n<h2>为什么必须单列一类<\/h2>\n<p>英雄卡是按\"英雄\"切的，但它天然会把<strong>分路共有的东西<\/strong>重复 N 遍：五个中路英雄，就写五遍\"线权看对面清线速度\"。这类内容放在英雄卡里是<strong>错位<\/strong>的——它不稳定（换个英雄照样成立），也很难维护（改一处要改五处）。<\/p>\n<p>所以规矩是：<\/p>\n<blockquote><p><strong>分路通用的判断 → 放 L 类，只写一遍；英雄卡只留\"这个英雄有什么不同\"。<\/strong><\/p><\/blockquote>\n<h2>五路对照：共享什么、差在哪<\/h2>\n<h3>共享的四条底层判据（五路全部成立）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>能不能打，看的是<strong>战斗力差 × 能不能及时到达<\/strong>，不是经济差<\/td><td><code>K-D<\/code> 主线地图（BV1i2n96AEvp @ 02:31）<\/td><\/tr><tr><td>2<\/td><td><strong>线权 = 可动窗口<\/strong>。有线权才有\"走\"的资格，没线权动一步都是亏<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><tr><td>3<\/td><td><strong>视野是决策输入<\/strong>，不是\"顺手做的\"。看不见就不动<\/td><td><a class=\"kref\" href=\"#K-L44\">K-L44<\/a>、<a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/td><\/tr><tr><td>4<\/td><td><strong>人数差 &gt; 个人操作<\/strong>。五个人同时到一个点，比任何人秀都值钱<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>五路各自的\"唯一决定\"<\/h3>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>只回答这一个决定<\/th><th>别人替不了你的地方<\/th><th>详见<\/th><\/tr><\/thead><tbody><tr><td><strong>中路<\/strong><\/td><td>这波线清完，我往哪个方向走<\/td><td>唯一能<strong>同时<\/strong>够到三条路的位置，转线成本最低<\/td><td><code>01_中路.md<\/code><\/td><\/tr><tr><td><strong>对抗路<\/strong><\/td><td>这一波我压线还是放线<\/td><td>离团战最远，<strong>可以合法地不参团<\/strong>去换钱<\/td><td><code>04_对抗路.md<\/code><\/td><\/tr><tr><td><strong>打野<\/strong><\/td><td>现在该刷还是该抓<\/td><td>唯一按<strong>时间差<\/strong>算账的位置，不走线只走野区<\/td><td><code>05_打野.md<\/code><\/td><\/tr><tr><td><strong>发育路<\/strong><\/td><td>这波兵我敢不敢吃<\/td><td>全场最贵的经济来源，也是全场最容易被开的位置<\/td><td><code>03_发育路.md<\/code><\/td><\/tr><tr><td><strong>游走<\/strong><\/td><td>第一步去哪<\/td><td>唯一<strong>没有自己线权<\/strong>的位置，靠别人的线权吃饭<\/td><td><code>02_游走.md<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>交叉点：哪两路会在同一件事上打架<\/h3>\n<p>这张表是这类内容真正的价值——<strong>冲突发生的地方，才是需要判断的地方<\/strong>。<\/p>\n<div class=\"tw\"><table><thead><tr><th>交叉<\/th><th>争的是什么<\/th><th>判据（谁让）<\/th><th>条目<\/th><\/tr><\/thead><tbody><tr><td>中路 × 打野<\/td><td><strong>中线归谁<\/strong><\/td><td>打野差一级到四 → 中线让他；否则中线归中单转线<\/td><td><a class=\"kref\" href=\"#K-L04\">K-L04<\/a>、<a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><tr><td>中路 × 游走<\/td><td>开局第一波谁帮清中<\/td><td>游走按「野→边→射→中」排，中路排第四<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/td><\/tr><tr><td>游走 × 发育路<\/td><td>开局跟不跟射手<\/td><td>默认<strong>不跟<\/strong>，除非对面 2v2 压制且我方射手会被越<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/td><\/tr><tr><td>对抗路 × 打野<\/td><td>对抗路线权换不换对面野区<\/td><td>我方边路有线权压制 → 打野才敢进对面野区<\/td><td><a class=\"kref\" href=\"#K-L32\">K-L32<\/a>、<a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/td><\/tr><tr><td>发育路 × 游走<\/td><td>2v2 卡不卡线<\/td><td>看辅助强度，不看射手强度<\/td><td><a class=\"kref\" href=\"#K-L22\">K-L22<\/a>、<a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/td><\/tr><tr><td>打野 × 全队<\/td><td>蹭线拖慢野区速率<\/td><td>蹭线是投资，必须换来\"升四/反打\"，否则不蹭<\/td><td><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>读法<\/strong>：先按\"我是哪个位置\"进对应文档，再遇到交叉点的决定时跳到对方那一路看他的约束。两边都看完，才知道谁该让。<\/p>\n<h2>归属规则（写新条目时的判定）<\/h2>\n<pre><code>这条结论，换一个英雄还成立吗？\n├─ 不成立（只在某英雄的技能组里才有意义） → A 类，写进英雄卡\n└─ 成立\n   ├─ 只有某一个位置成立（换位置就不成立） → L 类，写进那个分路\n   └─ 五个位置都成立                        → D 类主线地图的\"底层判据\"<\/code><\/pre>\n<p>反例自查：「打野开先手时法师跟进放大」——换任何法师都成立，但换成分路就不成立（射手不会跟进放大），所以它属于<strong>中路<\/strong>的 L 类，不属于某个英雄。<\/p>\n<h2>编号<\/h2>\n<p><code>K-Lxx<\/code>，全局唯一，按分路段预分配号段：<\/p>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>号段<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> ~ <a class=\"kref\" href=\"#K-L10\">K-L10<\/a><\/td><\/tr><tr><td>游走<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> ~ <a class=\"kref\" href=\"#K-L20\">K-L20<\/a><\/td><\/tr><tr><td>发育路<\/td><td><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> ~ <a class=\"kref\" href=\"#K-L30\">K-L30<\/a><\/td><\/tr><tr><td>对抗路<\/td><td><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> ~ <a class=\"kref\" href=\"#K-L40\">K-L40<\/a><\/td><\/tr><tr><td>打野<\/td><td><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> ~ <a class=\"kref\" href=\"#K-L50\">K-L50<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>当前状态<\/h2>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>条目<\/th><th>素材厚薄<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>6 条（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>~06）<\/td><td>够用（小乔/女娲/海月/火舞多源）<\/td><\/tr><tr><td>游走<\/td><td>8 条（<a class=\"kref\" href=\"#K-L11\">K-L11<\/a>~18）<\/td><td>够用（大乔/鲁班/盾山/苏烈）<\/td><\/tr><tr><td>发育路<\/td><td>3 条（<a class=\"kref\" href=\"#K-L21\">K-L21<\/a>~23）<\/td><td><strong>最缺<\/strong>：0 条射手第一视角素材，1 条已标\"可信度低\"<\/td><\/tr><tr><td>对抗路<\/td><td>4 条（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>~34）<\/td><td>偏薄（主要靠司空震一条 + 夏洛特）<\/td><\/tr><tr><td>打野<\/td><td>5 条（<a class=\"kref\" href=\"#K-L41\">K-L41<\/a>~45）<\/td><td>够用（镜的野区速率框架，是全库最硬的一条）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>发育路是真缺口，不是没整理。<\/strong> 现有素材里提到射手，全是辅助视角（盾山怎么卡线、大乔怎么调度射手），没有一条讲\"射手自己该在哪站、什么时候能压\"。要补必须专门采射手视角的全局教学。<\/p>", "cats": [{"key": "A", "name": "英雄教学", "desc": "这个英雄怎么玩、什么时候强", "n": 31}, {"key": "B", "name": "克制关系", "desc": "打谁舒服、被谁克、为什么", "n": 5}, {"key": "C", "name": "BP", "desc": "选人阶段该怎么定", "n": 0}, {"key": "D", "name": "对局内", "desc": "现在这一刻该干什么", "n": 8}, {"key": "L", "name": "分路", "desc": "这个位置该按什么顺序想事", "n": 26}], "overview": [{"title": "导航：四类内容，四种问法", "file": "00_导航.md", "html": "<p>知识库按<strong>内容类型<\/strong>分四类。先判断你问的是哪一类，再去那一类找。<\/p>\n<div class=\"tw\"><table><thead><tr><th>类<\/th><th>你问的是<\/th><th>目录<\/th><th>编号<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td><strong>A 英雄教学<\/strong><\/td><td>\"这个英雄怎么玩\"<\/td><td><code>A_英雄教学/<\/code><\/td><td><code>K-Axx<\/code><\/td><td>苏烈 ✅<\/td><\/tr><tr><td><strong>B 克制关系<\/strong><\/td><td>\"打谁舒服、被谁克\"<\/td><td><code>B_克制关系/<\/code><\/td><td><code>K-Bxx<\/code><\/td><td>苏烈 ✅<\/td><\/tr><tr><td><strong>C BP<\/strong><\/td><td>\"选人阶段该怎么定\"<\/td><td><code>C_BP/<\/code><\/td><td><code>K-Cxx<\/code><\/td><td>⚠️ 骨架，无实证<\/td><\/tr><tr><td><strong>D 对局内<\/strong><\/td><td>\"现在这一刻该干什么\"<\/td><td><code>D_对局内/<\/code><\/td><td><code>K-Dxx<\/code><\/td><td>04 对线期 ✅<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>四类的边界（别混）<\/h2>\n<ul><li><strong>A 讲\"这个英雄\"<\/strong>：机制、连招顺序、强势期、废的时候。<strong>不涉及对面是谁<\/strong>。<\/li><li><strong>B 讲\"两个英雄之间\"<\/strong>：必须有具体对手。同一条结论换个对手就不成立，才叫克制。<\/li><li><strong>C 讲\"选人之前\"<\/strong>：只跟阵容和版本有关，不跟具体对局局势有关。<\/li><li><strong>D 讲\"选人之后\"<\/strong>：必须带时间点（0:45 / 4 分钟 / 10 分钟），不带时间点的不是 D 类。<\/li><\/ul>\n<p><strong>判定口诀<\/strong>：结论里出现\"对面是谁\"→ B；出现\"第几分钟\"→ D；只是\"这英雄\"→ A；只是\"这版本/这阵容\"→ C。<\/p>\n<h2>两条跨类的用法<\/h2>\n<ol><li><strong>A 和 B 是配套的<\/strong>：A 告诉你这英雄靠什么强，B 告诉你这个\"靠什么\"在谁面前失效。只看 A 不看 B，会在被克的对局里越打越崩。<\/li><li><strong>C 的输出是 D 的输入<\/strong>：BP 定了你能干什么，D 才谈得上\"这一刻该不该动\"。<\/li><\/ol>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<p>经济差只是战斗力差的一种来源。信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。 来源：<code>BV1i2n96AEvp @ 02:31<\/code>。<\/p>\n<h2>读法<\/h2>\n<ol><li>先按上表定位到类，再看那类的 <code>_说明.md<\/code> 了解它回答什么；<\/li><li>只读命中的那一条，<strong>不要通读<\/strong>；<\/li><li>条目里的「反例」比「结论」值钱——那是别人踩过的坑。<\/li><\/ol>"}, {"title": "教学信源名单（S45 实测，2026-10-31）", "file": "95_信源名单.md", "html": "<blockquote><p>这不是「关注列表」，是<strong>取用列表<\/strong>。按问题去取，不要全订。 名单会随赛季变，每 2 周复核一次（看 S45 更新数与平均时长有没有掉）。<\/p><\/blockquote>\n<hr>\n<h2>一、先定判据：凭什么说一个 UP「值得信任」<\/h2>\n<p>信任不来自粉丝量、也不来自播放量。按下面五条打分，缺两条以上就不进名单。<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>怎么验<\/th><th>反例特征<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>给判据，不给结论<\/strong><\/td><td>句子结构里有没有「如果/只要/除非/当…时」<\/td><td>全程「视情况而定」「看你怎么玩」<\/td><\/tr><tr><td>2<\/td><td><strong>讲机制，不只讲操作<\/strong><\/td><td>有没有「因为…所以」「原因是」，能不能解释<strong>为什么<\/strong>这样打<\/td><td>「记住这个连招就行」<\/td><\/tr><tr><td>3<\/td><td><strong>给可执行的阈值<\/strong><\/td><td>有没有秒数、经济差、码数、身位、次数<\/td><td>「差不多」「差一点」<\/td><\/tr><tr><td>4<\/td><td><strong>版本对得上<\/strong><\/td><td>标题/内容里的赛季号是否为当前 S45；S44 及更早当作过期<\/td><td>「S43 上路必看」今天还挂首页<\/td><\/tr><tr><td>5<\/td><td><strong>自证 + 不夹带<\/strong><\/td><td>有没有段位/国服/职业教练身份；签名里有没有「包标/上星/复盘××元」<\/td><td>全靠嘴说「我是国服」，且每条视频都在卖课<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这五条怎么量化<\/strong>：本次实测是把候选人的视频字幕抓下来，统计 条件句密度、因果句密度、数字密度、机制术语浓度、空话密度（无脑/记住就行）， 用样本内百分位合成质量分。播放量只占 5% 权重。<\/p>\n<p><strong>实测发现（值得记住）<\/strong>：<\/p>\n<ul><li>B 站「王者荣耀教学」关键词下，<strong>结构化解说型账号极少<\/strong>，高播放大多是直播切片、<\/li><\/ul>\n<p>实录、对喷、或流水线卖课。<\/p>\n<ul><li>抓了 26 个候选、约 100 条视频字幕，只有 <strong>10 个<\/strong>满足「至少 2 条字幕是人在讲而不是<\/li><\/ul>\n<p>游戏音效」。很多号的字幕轨全是「技能正在冷却」「请求集合」——那是 ASR 把游戏音效 当成说话转录了。<\/p>\n<ul><li>所以：<strong>字幕干净本身就是个质量信号<\/strong>，说明有旁白、有解说意图。<\/li><\/ul>\n<hr>\n<h2>二、S 档：跟着学「判断依据」（讲得清、还在更）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>为什么进 S<\/th><th>要打折扣的地方<\/th><\/tr><\/thead><tbody><tr><td><strong>王者荣耀晚风风<\/strong><\/td><td>481626368<\/td><td>打野·全局<\/td><td>视野与节奏讲成可执行步骤：「利用视野开节奏的两个关键点」；老虎那期给到 3 分 15 秒刷新交汇、7 分钟两倍经济差。术语浓度全场最高<\/td><td>均长仅 5.8 分钟，信息密度高但要反复看；签名有「wx 上星/商务」，业务与内容分开看<\/td><\/tr><tr><td><strong>白菜打野教学<\/strong><\/td><td>67244546<\/td><td>打野·分段突破<\/td><td>因果句密度全场最高，明确讲「你卡在 1900–2100 是因为前 4 分钟」，直接对着一个分段改动作<\/td><td>营销话术重（封神/反复观看）；卖复盘 88/次，注意把「他的服务」和「他说的方法」分开<\/td><\/tr><tr><td><strong>阿泽干货博主<\/strong><\/td><td>322640745<\/td><td>全英雄·国服共创<\/td><td>请国一/2w1 分玩家共创，给的是节点型判据：4 分钟圣杯、10 分钟三件套、10 分钟分均 6800 经济<\/td><td>他也做英雄联盟内容（样本里混进过 369 兰博），<strong>只取王者分区<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>三、A 档：单点很硬，按需取（不追全部，只取自己那一路）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>取什么<\/th><\/tr><\/thead><tbody><tr><td><strong>益达兄弟辅助教学<\/strong><\/td><td>298590209<\/td><td>辅助<\/td><td>巅峰最高 2667、总榜第五。出装判据实用（极影 vs 近卫按对面强度与阵容选），九大神辅系列可当辅助入门骨架<\/td><\/tr><tr><td><strong>老杨国服嫦娥<\/strong><\/td><td>1866098100<\/td><td>中路·嫦娥<\/td><td>目标置换讲得清楚：「这波不追求杀人，追求打掉状态、拖刘备到四」——这正是中路该有的思路。吐槽类视频跳过<\/td><\/tr><tr><td><strong>奥特曼zz国一刘备凯<\/strong><\/td><td>18909338<\/td><td>打野·刘备<\/td><td>实战细节密度高（记对面闪现、卡视野蹲人）。签名有上分业务，只取内容<\/td><\/tr><tr><td><strong>夜昧<\/strong><\/td><td>49993700<\/td><td>对抗路<\/td><td>粉丝少但讲得实在：对抗路稳线优先、宁可打不过也别被带节奏；马超存枪的版本差异<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>A 档的共同限制：<strong>覆盖窄<\/strong>。他们只对自己那一路负责，别拿打野的节奏逻辑去套中路。<\/p><\/blockquote>\n<h2>四、B 档：直播切片与职业选手（学操作与节奏，不学结论）<\/h2>\n<p>你说了切片也看，那这里要分清<strong>看什么<\/strong>：<\/p>\n<blockquote><p>切片天然删掉前提，只留结果。所以切片能用来<strong>验证你已经有的判断<\/strong>， 不能用来<strong>建立判断<\/strong>。看的时候问自己「他为什么这时候上」，而不是记「他这时候上了」。<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>类型<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td><strong>赖神无所畏惧<\/strong><\/td><td>395931838<\/td><td>大主播·对抗路（230w）<\/td><td>S45 内 21 条但均长 1.7 分钟，是切片形态。适合看对抗路的对线处理与手感，不适合学体系<\/td><\/tr><tr><td><strong>哔哩哔哩王者荣耀赛事<\/strong><\/td><td>392836434<\/td><td>官方赛事（691w）<\/td><td>S45 内 38 条、均长 55 分钟。<strong>这是 BP 与运营的唯一一手素材<\/strong>，也是我们知识库 C 类（BP）目前唯一的可靠来源<\/td><\/tr><tr><td>职业选手本人号（如 AG 超玩会老帅、LGD 教练阿泰）<\/td><td>549922787 / 492870807<\/td><td>职业/教练认证<\/td><td>账号存在且有认证，但按名字检索近期投稿命中为 0，需进空间页确认更新情况；确认后再补进名单<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>切片号的坑<\/strong>：同一选手常有好几个「XX剪辑呺」「XX精彩集锦」。实测其中一个剪辑号 的字幕轨全是歌词和英雄语音，一条讲解都没有——那种号只能当集锦看。 <strong>认准认证标识和署名，不要认名字相似。<\/strong><\/p>\n<h2>五、不进名单的（按行为特征判断，不针对具体人）<\/h2>\n<ol><li><strong>签名 = 卖课目录<\/strong>：「包标」「上星」「加入我们××教」「复盘 ×× 元」，<\/li><\/ol>\n<p>且视频平均时长 &lt; 3 分钟 → 内容被切成钩子，判断链是断的。<\/p>\n<ol><li><strong>纯剪辑号<\/strong>：无旁白、字幕只有歌词/游戏语音。<\/li><li><strong>版本漂移号<\/strong>：标题还挂着 S43/S44，或内容里说「这个版本」但无法对应到 S45。<\/li><li><strong>只讲出装不讲为什么<\/strong>：给一套铭文出装就结束，遇到阵容变化无法迁移。<\/li><\/ol>\n<hr>\n<h2>六、按你的情况排的取用顺序<\/h2>\n<p>你主中辅、在练对抗、目标荣耀。所以不要五个都订，按这个顺序取：<\/p>\n<ol><li><strong>先修判断公式<\/strong>（解决「什么时候该干什么」）<\/li><\/ol>\n<p>→ 哔哩哔哩王者荣耀赛事 的 BP 段 + 晚风风的视野与节奏。 打野视角讲的是资源与到达，中路/游走可以直接迁移。<\/p>\n<ol><li><strong>再补本分路<\/strong>（解决「我这一路怎么打」）<\/li><\/ol>\n<p>→ 益达兄弟（辅助出装判据）→ 老杨（中路目标置换）。<\/p>\n<ol><li><strong>对抗路单练<\/strong>（解决「最近在练的那条路」）<\/li><\/ol>\n<p>→ 赖神切片看对线与手感 → 夜昧看稳线逻辑。<\/p>\n<ol><li><strong>每个新学的点，立刻落成知识库格式<\/strong>：触发条件 → 判据 → 阈值 → 反例。<\/li><\/ol>\n<p>写不成这个格式，说明还没学到手，只是记住了。<\/p>\n<h2>七、复核机制<\/h2>\n<ul><li>每 2 周跑一次 <code>s0_creators.py --stage all<\/code>，看「S45 更新数」和「平均时长」。<\/li><li>更新数掉到 0 或均长掉到 3 分钟以下 → 降档（大概率转成切片/直播形态）。<\/li><li>赛季切换（11-25 切 S46）后，旧名单全部降为「待复核」，重跑一遍再定档。<\/li><\/ul>\n<hr>\n<p>_数据与脚本：<code>40_scripts/s0_creators.py<\/code>（筛选+评分）、<code>40_scripts/subs_browser.py<\/code>（字幕采集）、 <code>40_scripts/bili_api.py<\/code>（接口层）。原始结果：<code>10_sources/creators_scored.json<\/code>。_<\/p>"}, {"title": "版本变更台账", "file": "90_版本变更台账.md", "html": "<p><strong>版本真值只认官方公告，不认任何\"版本答案\"。<\/strong> 每条 K 条目都必须写\"适用版本\"，跨赛季自动进复核队列。<\/p>\n<h2>赛季区间表（2026）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>赛季<\/th><th>名称<\/th><th>开始<\/th><th>结束<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>S42<\/td><td>神佑建木<\/td><td>2026-01-08<\/td><td>2026-04-01<\/td><td>官网公告 tid=791692<\/td><\/tr><tr><td>S43<\/td><td>陌上相逢<\/td><td>2026-04-01<\/td><td>2026-06-24<\/td><td>官网赛季公告<\/td><\/tr><tr><td>S44<\/td><td>—<\/td><td>2026-06-25<\/td><td>2026-09-23<\/td><td>官网赛季公告<\/td><\/tr><tr><td><strong>S45<\/strong><\/td><td><strong>月照长安（当前）<\/strong><\/td><td><strong>2026-09-23<\/strong><\/td><td><strong>2026-11-25<\/strong><\/td><td>官网赛季公告<\/td><\/tr><tr><td>S46<\/td><td>—<\/td><td>2026-11-25<\/td><td>—<\/td><td>官方预告（11-25 0:00–5:00 停服更新）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>注意：S45 只有约 63 天，比常规 85–95 天短。<strong>任何按\"三个月一赛季\"推算的结论都要重新核对。<\/strong><\/p><\/blockquote>\n<h2>S45 版本特征（影响内容取舍）<\/h2>\n<ul><li><strong>中野辅版本<\/strong>：打野与辅助的联动权重高于边路单带。<\/li><li>周年庆期间（10/24 前后）活动内容多、<strong>平衡性调整少<\/strong>，教学素材偏旧。<\/li><li>新英雄：王维、蚩奼、大司命、空空儿、孙权、苍、影等；<strong>刀锋宝贝仍在体验服<\/strong>。<\/li><\/ul>\n<h2>已发生的平衡调整（截至 2026-10-31）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>日期<\/th><th>对象<\/th><th>改动<\/th><th>影响的知识点<\/th><\/tr><\/thead><tbody><tr><td>10-30（体验服）<\/td><td>镜<\/td><td>二技能 CD 9~7→10~8（全等级 +1s）；加速 50%→100(+20/Lv)；二技能伤害小幅上调；三技能充能 10→10~8<\/td><td>未入库（打野支线），暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>曜<\/td><td>三技能 CD 15~10→13.5~10<\/td><td>未入库，暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>刀锋宝贝<\/td><td>三技能追踪优化、强化普攻法球修复<\/td><td>未上线正式服，不采信为正式结论<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>体验服改动一律不作为正式服结论入库<\/strong>，只能进本表。<\/p>\n<h2>待办<\/h2>\n<ul><li>[ ] 抓到 S45 官方更新公告原文后，补全本表 9-23 至 10-31 的正式服调整<\/li><li>[ ] S46（11-25）上线后 7 天内，全库过一遍\"适用版本 = S45\"的条目<\/li><\/ul>"}], "meta": {"total": 70, "heroes": 9, "sub": "当前版本 S45 · 共 70 条 · 更新 2026-11-01"}}</script>
<script>
/* ══════════════════════════════════════════════════════════
   kog 站点交互 —— 英雄宫格 + 折叠卡
   数据来自 <script id="DATA" type="application/json">，构建时注入
   路由用 hash（要支持 file:// 直接打开，不能用 History API）：
     # / 空        → 英雄宫格
     #H:苏烈       → 英雄页
     #doc:xx.md    → 长文档（信源名单 / 版本台账 / 导航）
     #cat:A        → 某一类的全部条目
     #K-B01        → 直达条目并展开
   ══════════════════════════════════════════════════════════ */
(function () {
  const D = JSON.parse(document.getElementById('DATA').textContent);
  const view = document.getElementById('view');
  const qEl = document.getElementById('q');
  const root = document.documentElement;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 扁平分索引：搜索与直达用 ── */
  const IDX = [];
  D.heroes.forEach(h => {
    h.a.concat(h.b).forEach(e => IDX.push({ ...e, owner: h.name, kind: 'H:' + h.name }));
  });
  D.general.forEach(g => g.entries.forEach(e =>
    IDX.push({ ...e, owner: g.title, kind: 'doc:' + g.file })));
  (D.lanes || []).forEach(l => l.entries.forEach(e =>
    IDX.push({ ...e, owner: l.name, kind: 'lane:' + l.file })));

  const heroOf = n => D.heroes.find(h => h.name === n);
  const laneOf = f => (D.lanes || []).find(l => l.file === f);
  const byId = id => IDX.find(e => e.id === id);

  /* ── 条目折叠卡 ── */
  function entryCard(e, open) {
    return `<details class="entry" id="${esc(e.id)}"${open ? ' open' : ''}>
      <summary>
        <span class="id">${esc(e.id)}</span>
        <span class="tt"><b>${esc(e.title)}</b>
          <span>${esc(e.sum || '')}</span></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="body">${e.html || ''}</div>
    </details>`;
  }

  /* ── 英雄卡 ── */
  function heroCard(h) {
    const pills = [];
    if (h.a.length) pills.push(`<span class="pill a">怎么玩 ${h.a.length}</span>`);
    if (h.b.length) pills.push(`<span class="pill b">对位 ${h.b.length}</span>`);
    if (!pills.length) pills.push('<span class="pill g">待补</span>');
    return `<a class="hcard" href="#H:${encodeURIComponent(h.name)}">
      <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
      <span class="hname">${esc(h.name)}</span>
      <span class="hmeta">${pills.join('')}</span>
    </a>`;
  }

  /* ── 分路卡 ── */
  function laneCard(l) {
    return `<a class="lcard" href="#lane:${encodeURIComponent(l.file)}">
      <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
      <span class="hname">${esc(l.name)}</span>
      <span class="hmeta">
        <span class="pill l">${l.entries.length} 条</span>
        ${l.heroes.length ? `<span class="pill g">${l.heroes.length} 英雄</span>` : ''}
      </span>
      <span class="lmotto">${esc(l.motto || '')}</span>
    </a>`;
  }

  /* ── 首页 ── */
  function renderHome() {
    const heroes = D.heroes.map(heroCard).join('');
    const lanes = (D.lanes || []).map(laneCard).join('');
    const gen = D.general.filter(g => g.entries.length || g.intro).map(g => {
      const icon = g.key === 'D' ? '⌁' : g.key === 'C' ? '⇄' : '·';
      const n = g.entries.length;
      return `<a class="gcard" href="#doc:${encodeURIComponent(g.file)}">
        <span class="gicon">${icon}</span>
        <span class="gtxt"><b>${esc(g.title)}</b>
          <span>${esc(g.cat)} · ${n ? n + ' 条判断' : '阅读'}</span></span>
      </a>`;
    }).join('');

    const docs = D.overview.filter(o => o.file !== '00_导航.md').map(o =>
      `<a class="gcard" href="#doc:${encodeURIComponent(o.file)}">
        <span class="gicon">▤</span>
        <span class="gtxt"><b>${esc(o.title.replace(/（.*?）/, ''))}</b>
          <span>参考文档</span></span>
      </a>`).join('');

    view.innerHTML = `
      <div class="hero-head">
        <p class="eyebrow">${esc(D.version)} · 决策手册</p>
        <h1>点英雄，看怎么打</h1>
        <p class="lede">每一条结论都能回溯到具体视频与秒数。有判据才写，没把握就留空。</p>
      </div>

      <section class="sec">
        <div class="sec-h"><h2>按分路看</h2><span>同一时间点，五个位置要做的决定不一样</span></div>
        <div class="grid lanes">${lanes}</div>
      </section>

      <section class="sec">
        <div class="sec-h"><h2>英雄</h2><span>${D.heroes.length} 个 · 点开看全部</span></div>
        <div class="grid">${heroes}</div>
      </section>

      ${gen ? `<section class="sec">
        <div class="sec-h"><h2>不挑英雄的</h2><span>对线、节奏、BP</span></div>
        <div class="row">${gen}</div>
      </section>` : ''}

      ${docs ? `<section class="sec">
        <div class="sec-h"><h2>参考</h2></div>
        <div class="row">${docs}</div>
      </section>` : ''}
    `;
  }

  /* ── 英雄页 ── */
  function renderHero(name) {
    const h = heroOf(name);
    if (!h) return renderHome();

    const secA = h.a.length
      ? `<section class="sec"><div class="sec-h"><h2>怎么玩</h2>
           <span>${h.a.length} 条</span></div>
           ${h.a.map(e => entryCard(e, false)).join('')}</section>`
      : `<section class="sec"><div class="sec-h"><h2>怎么玩</h2></div>
           <p class="lede">还没有这个英雄的条目。</p></section>`;

    const secB = h.b.length
      ? `<section class="sec"><div class="sec-h"><h2>打谁 / 被谁克</h2>
           <span>${h.b.length} 条</span></div>
           ${h.b.map(e => entryCard(e, false)).join('')}</section>`
      : '';

    const inc = h.incoming.length
      ? `<section class="sec"><div class="sec-h"><h2>被这些英雄的条目点名</h2></div>
           <p class="lede">${h.incoming.map(n =>
             `<a href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`).join('、')}
           的克制条目里提到了他，点进去看具体打法。</p></section>`
      : '';

    view.innerHTML = `
      <a class="back" href="#">← 全部英雄</a>
      <div class="hhead">
        <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
        <div>
          <h1>${esc(h.name)}</h1>
          <div class="hmeta">
            <span class="pill g">${h.n} 条</span>
            ${h.b_n ? `<span class="pill b">对位 ${h.b_n}</span>` : ''}
            ${(h.lanes || []).map(k => {
              const l = (D.lanes || []).find(x => x.key === k);
              return l ? `<a class="pill l" href="#lane:${encodeURIComponent(l.file)}">${esc(l.name)}大局观</a>` : '';
            }).join('')}
          </div>
        </div>
      </div>
      ${secA}${secB}${inc}
    `;
  }

  /* ── 分路页 ── */
  function renderLane(file) {
    const l = laneOf(file);
    if (!l) return renderHome();

    const heroRow = l.heroes.length
      ? `<div class="grid">${l.heroes.map(n => heroCard(heroOf(n))).filter(Boolean).join('')}</div>`
      : `<p class="lede">这个分路还没有英雄卡。${l.key === 'adc' || l.key === 'jungle'
          ? '（这是已知缺口：没有以该位置为第一视角的素材。）' : ''}</p>`;

    const others = (D.lanes || []).filter(x => x.key !== l.key).map(x =>
      `<a class="klink" href="#lane:${encodeURIComponent(x.file)}">${esc(x.name)} · ${esc(x.motto || '')}</a>`).join('');

    const stages = (l.stages || []).length
      ? `<div class="row">${l.stages.map(s =>
          `<a class="gcard" href="#doc:${encodeURIComponent(s.file)}">
            <span class="gicon">⌁</span>
            <span class="gtxt"><b>${esc(s.title)}</b><span>对局内 · ${s.id} 节</span></span>
          </a>`).join('')}</div>`
      : `<p class="lede">这一路还没有对应的对局内环节。</p>`;

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hhead">
        <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
        <div>
          <h1>${esc(l.name)}</h1>
          <div class="hmeta">
            <span class="pill l">${l.entries.length} 条判断</span>
            <span class="pill g">只看位置，不看英雄</span>
          </div>
        </div>
      </div>

      <section class="sec"><div class="sec-h"><h2>这一路的大局观</h2></div>
        <div class="doc">${l.intro || ''}</div></section>

      <section class="sec"><div class="sec-h"><h2>分条判断</h2>
        <span>${l.entries.length} 条</span></div>
        ${l.entries.map(e => entryCard(e, false)).join('')}</section>

      <section class="sec"><div class="sec-h"><h2>这个位置的英雄</h2></div>${heroRow}</section>

      <section class="sec"><div class="sec-h"><h2>对应的时间环节</h2></div>${stages}</section>

      <section class="sec"><div class="sec-h"><h2>交叉的分路</h2>
        <span>同一件事，两边判据要对得上</span></div>
        <div class="row">${others}</div></section>
    `;
  }

  /* ── 长文档页 ── */
  function renderDoc(file) {
    const o = D.overview.find(x => x.file === file);
    const g = D.general.find(x => x.file === file);
    if (o) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="doc">${o.html}</div>`;
      return;
    }
    if (g) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="hero-head"><p class="eyebrow">${esc(g.cat)}</p>
          <h1>${esc(g.title)}</h1></div>
        <div class="doc">${g.intro || ''}</div>
        ${g.entries.map(e => entryCard(e, false)).join('')}`;
      return;
    }
    renderHome();
  }

  /* ── 分类页 ── */
  function renderCat(key) {
    const c = D.cats.find(x => x.key === key);
    if (!c) return renderHome();
    const list = IDX.filter(e => e.cat === key);
    view.innerHTML = `<a class="back" href="#">← 返回</a>
      <div class="hero-head"><p class="eyebrow">分类</p>
        <h1>${esc(c.name)}</h1><p class="lede">${esc(c.desc)}</p></div>
      ${list.length ? list.map(e => entryCard(e, false)).join('')
        : '<p class="empty">这一类还没有条目。</p>'}`;
  }

  /* ── 搜索 ── */
  function renderSearch(kw) {
    const k = kw.trim().toLowerCase();
    if (!k) return renderHome();
    const hs = D.heroes.filter(h => h.name.toLowerCase().includes(k));
    const es = IDX.filter(e =>
      (e.id + e.title + (e.sum || '') + (e.opp || '')).toLowerCase().includes(k));

    view.innerHTML = `
      <div class="hero-head"><p class="eyebrow">搜索</p>
        <h1>“${esc(kw.trim())}”</h1>
        <p class="lede">${es.length} 条结论${hs.length ? ` · ${hs.length} 个英雄` : ''}</p></div>
      ${hs.length ? `<section class="sec"><div class="sec-h"><h2>英雄</h2></div>
        <div class="grid">${hs.map(heroCard).join('')}</div></section>` : ''}
      ${es.length ? `<section class="sec"><div class="sec-h"><h2>结论</h2></div>
        ${es.map(e => entryCard(e, true)).join('')}</section>`
        : '<p class="empty">没有命中。换个词试试，比如英雄名或「对线」。</p>'}`;
  }

  /* ── 路由 ── */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    qEl.value = '';
    if (!h) return renderHome();
    if (h.startsWith('H:')) return renderHero(h.slice(2));
    if (h.startsWith('lane:')) return renderLane(h.slice(5));
    if (h.startsWith('doc:')) return renderDoc(h.slice(4));
    if (h.startsWith('cat:')) return renderCat(h.slice(4));
    const e = byId(h);
    if (e) {
      if (e.kind.startsWith('H:')) renderHero(e.kind.slice(2));
      else if (e.kind.startsWith('lane:')) renderLane(e.kind.slice(5));
      else renderDoc(e.kind.slice(4));
      requestAnimationFrame(() => {
        const el = document.getElementById(h);
        if (el) {
          el.open = true;
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.querySelector('summary').style.background = 'var(--bg3)';
          setTimeout(() => { el.querySelector('summary').style.background = ''; }, 1600);
        }
      });
      return;
    }
    renderHome();
  }

  /* ── 搜索交互 ── */
  let t = null;
  qEl.addEventListener('input', () => {
    clearTimeout(t);
    const v = qEl.value;
    t = setTimeout(() => {
      if (v.trim()) renderSearch(v);
      else if (!location.hash) renderHome();
    }, 140);
  });
  qEl.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { qEl.value = ''; route(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== qEl) {
      ev.preventDefault(); qEl.focus();
    }
  });

  /* ── 主题 ── */
  const saved = localStorage.getItem('kog-theme');
  if (saved) root.dataset.theme = saved;
  document.getElementById('theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    localStorage.setItem('kog-theme', next);
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
