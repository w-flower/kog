<strong>可信度<\/strong>：高（同一条视频给了\"卡\"和\"不卡\"两种处理的完整理由）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：兵线交汇，决定卡在塔外清还是直接推掉判断依据：① 我方中野能不能比对面先支援到 ② 对手水平（会不会看小地图）决策分支：队友能先到 → 卡线，让对面\"想吃这波线就必须…"}, {"id": "K-L24", "cat": "L", "title": "卡线的目的不是吃兵，是逼他跟你打——打人比推线值", "self": "<h3><a class=\"kref\" href=\"#K-L24\">K-L24<\/a> 卡线的目的不是吃兵，是逼他跟你打——打人比推线值<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：已经把线卡在塔外，对面射手还想吃这波兵<\/li><li><strong>判断依据<\/strong>：对面是否必须上前（不吃这波线就掉经济）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他上前 → <strong>优先打人<\/strong>，打得越凶，队友的收割机会越多<\/li><li>他放弃这波线 → 你也别推，继续卡着（推掉等于把线送给他）<\/li><li><strong>反例<\/strong>：「卡线就是为了自己安稳补刀」——那样你只是把兵线挪了个位置。卡线的价值在于<strong>强迫对面进入你的攻击范围<\/strong>，让他用血换兵。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 02:15；BV1X2jV6KEiP @ 02:17；BV1X2jV6KEiP @ 02:19<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：已经把线卡在塔外，对面射手还想吃这波兵判断依据：对面是否必须上前（不吃这波线就掉经济）决策分支：他上前 → 优先打人，打得越凶，队友的收割机会越多他放弃这波线 → 你…"}, {"id": "K-L25", "cat": "L", "title": "保状态 > 保命：闪现是用来保血线的，不是保人头的", "self": "<h3><a class=\"kref\" href=\"#K-L25\">K-L25<\/a> 保状态 &gt; 保命：闪现是用来保血线的，不是保人头的<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期血量被打掉一半以上<\/li><li><strong>判断依据<\/strong>：接下来 60 秒，你会不会被越塔<\/li><li><strong>决策分支<\/strong>：<\/li><li>血量偏低且对面中野位置不明 → <strong>把状态补满<\/strong>，宁可丢一波兵<\/li><li>有明确击杀机会但会掉血 → 放弃击杀，保状态<\/li><li><strong>反例<\/strong>：「残血人头/炮车不能放，交闪现也要拿」——原话把这件事说透了：低分射手是用闪现<strong>保命<\/strong>，高分射手是用闪现<strong>保状态<\/strong>。前者的结果就是\"经常在对线期间被多人越塔\"。<\/li><li><strong>为什么这条属于发育路<\/strong>：只有射手会被\"越塔\"直接判死（没位移、血少、位置固定），其他位置残血可以靠逃进野区活下来。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:11；BV1X2jV6KEiP @ 04:26；BV1X2jV6KEiP @ 04:29；BV1X2jV6KEiP @ 04:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期血量被打掉一半以上判断依据：接下来 60 秒，你会不会被越塔决策分支：血量偏低且对面中野位置不明 → 把状态补满，宁可丢一波兵有明确击杀机会但会掉血 → 放弃击…"}, {"id": "K-L26", "cat": "L", "title": "4 分钟以后，能不能吃这波线取决于「自家中路有没有线权」", "self": "<h3><a class=\"kref\" href=\"#K-L26\">K-L26<\/a> 4 分钟以后，能不能吃这波线取决于「自家中路有没有线权」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟之后，每一波兵线进塔前<\/li><li><strong>判断依据<\/strong>：自家中路有没有线权；对方中单/辅助的小地图动向<\/li><li><strong>决策分支<\/strong>：<\/li><li>自家中路有线权 → 中线推过去，对面中单被钉住 → 这波线可以吃<\/li><li>自家中路无线权 → 对面中单随时能下来 → <strong>这波线进塔就会被越<\/strong>，提前撤<\/li><li><strong>反例<\/strong>：「我被越塔是因为队友不来帮」——原话反过来了：<strong>不是队友不愿意来，而是他们同样被压在塔前<\/strong>。你被越塔的根因在中路。<\/li><li><strong>交叉<\/strong>：这是<strong>中路和发育路之间最硬的一条因果<\/strong>。<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>/<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code> 决定中线权，中线权决定发育路敢不敢吃线；反过来发育路有线权时也能反哺中路（<code><a class=\"kref\" href=\"#K-L03\">K-L03<\/a><\/code> 的\"打野在同侧\"分支）。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:38；BV1X2jV6KEiP @ 04:40；BV1X2jV6KEiP @ 05:01<\/li><li><strong>可信度<\/strong>：高（素材用一整波被三包一的死亡做反证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟之后，每一波兵线进塔前判断依据：自家中路有没有线权；"}, {"id": "K-L27", "cat": "L", "title": "只打\"前排互相缠斗\"的团，追逐战一律不跟", "self": "<h3><a class=\"kref\" href=\"#K-L27\">K-L27<\/a> 只打\"前排互相缠斗\"的团，追逐战一律不跟<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中期团战打起来，你要不要进场<\/li><li><strong>判断依据<\/strong>：① 双方前排/开团手是否在缠斗 ② 我方是在追人还是在打阵地<\/li><li><strong>决策分支<\/strong>：<\/li><li>前排互相咬住 → <strong>进<\/strong>，这是射手唯一有输出空间的团<\/li><li>我方在追人（对面在跑）→ <strong>不进<\/strong>，射手的追击能力=保命技能，追人等于自杀<\/li><li><strong>反例<\/strong>：「队友在打，我不去要被骂」——原话：射手不擅长追击，喜欢追人的射手死亡率一定极高。不去比去了送好。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 07:39；BV1X2jV6KEiP @ 07:44；BV1X2jV6KEiP @ 07:47；BV1X2jV6KEiP @ 07:53<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中期团战打起来，你要不要进场判断依据：① 双方前排/开团手是否在缠斗 ② 我方是在追人还是在打阵地决策分支：前排互相咬住 → 进，这是射手唯一有输出空间的团我方在追人…"}, {"id": "K-L28", "cat": "L", "title": "7 分钟前别转线：一组兵线 + 一只小野的循环就够", "self": "<h3><a class=\"kref\" href=\"#K-L28\">K-L28<\/a> 7 分钟前别转线：一组兵线 + 一只小野的循环就够<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：小野刷完了，\"没事做\"想转线<\/li><li><strong>判断依据<\/strong>：下路塔还在不在；转线会不会比对面射手晚到<\/li><li><strong>决策分支<\/strong>：<\/li><li>下塔还在、队友没来帮拆 → <strong>不转线<\/strong>，守\"一组兵线 + 一只小野\"的循环，等队友来拔塔<\/li><li>要转线 → 先做风险判定：<strong>没抢到线权就转中，你比对面射手晚到<\/strong>，这波团你接不上<\/li><li><strong>反例<\/strong>：「转线能吃到更多经济」——可以，但风险同步上升。原话：\"机遇和风险永远是并存的，你的转线真的提高了你的收益吗？\"<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 05:06；BV1X2jV6KEiP @ 05:10；BV1X2jV6KEiP @ 05:39；BV1X2jV6KEiP @ 05:41<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：小野刷完了，\"没事做\"想转线判断依据：下路塔还在不在；"}, {"id": "K-L29", "cat": "L", "title": "2v2 的线权看辅助，不看射手（换任何射手都不变）", "self": "<h3><a class=\"kref\" href=\"#K-L29\">K-L29<\/a> 2v2 的线权看辅助，不看射手（换任何射手都不变）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线期<\/li><li><strong>判断依据<\/strong>：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方辅助强 → 敢压，按 <a class=\"kref\" href=\"#K-L23\">K-L23<\/a>/<a class=\"kref\" href=\"#K-L24\">K-L24<\/a> 卡线打人<\/li><li>我方辅助弱 → 退塔下接，接受\"掉几个兵换不掉人头\"<\/li><li><strong>反例<\/strong>：「我伤害比他高，应该压」——2v2 的强度由辅助的先手/承伤能力决定，射手前期的伤害差距远小于\"谁能先控住\"。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39；BV1i6n9z7EWH @ 03:00<\/li><li><strong>可信度<\/strong>：中高（盾山视角，把 2v2 胜负明确归因到辅助身上）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线期判断依据：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害决策分支：我方辅助强 → 敢压，按 K-L23/K-L24 卡线打人我方…"}, {"id": "K-L30", "cat": "L", "title": "射手是\"被调度去安全线\"的位置，不是\"守着下路\"的位置", "self": "<h3><a class=\"kref\" href=\"#K-L30\">K-L30<\/a> 射手是\"被调度去安全线\"的位置，不是\"守着下路\"的位置<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路被压、下塔已掉、或中线空出来<\/li><li><strong>判断依据<\/strong>：哪条线的兵线位置安全（能吃到、不被越）<\/li><li><strong>决策分支<\/strong>：下路被压 → 去中路补线（中单转线的空档）；上路空出 → 也可以去，但要有队友接应<\/li><li><strong>反例<\/strong>：「射手就该待在下路」——素材里的指挥原话是\"我们就叫射手去中路补线\"\"把射手跟中单摇过来\"。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 03:09；BV14VuVzWEBE @ 03:26；BV14VuVzWEBE @ 03:35<\/li><li><strong>可信度<\/strong>：中（<strong>辅助/指挥视角<\/strong>，看到的是\"怎么安排射手\"，不是射手自己的判断）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>4. 交叉：发育路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td><strong>中路<\/strong><\/td><td><strong>中线权决定发育路敢不敢吃线<\/strong>（最硬的一条因果）<\/td><td><code><a class=\"kref\" href=\"#K-L26\">K-L26<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局跟不跟我、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L29\">K-L29<\/a><\/code><\/td><\/tr><tr><td>打野<\/td><td>下路打起来他来不来；我先推塔还是先跟团<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L41\">K-L41<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>我把线推过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>只刷不推<\/strong>（<a class=\"kref\" href=\"#K-L21\">K-L21<\/a>）→ 分均 800 还输，因为塔一座没掉。<\/li><li><strong>把闪现用来抢人头<\/strong>（<a class=\"kref\" href=\"#K-L25\">K-L25<\/a>）→ 交完闪现的 90 秒，你就是那个被三包一的人。<\/li><li><strong>追人<\/strong>（<a class=\"kref\" href=\"#K-L27\">K-L27<\/a>）→ 射手的追击能力就是保命能力，追一次少一条命。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li><strong>不同射手类型的差异<\/strong>（呆射 / 游射 / 消耗型）：素材提到\"呆射对位游射最大的优势是打一波\"（<code>@ 01:18<\/code>），但没有系统分类对照，需要再采 2–3 个不同射手的第一视角。<\/li><li><strong>被越塔的预警阈值<\/strong>：什么阵容/什么时间点会被二包一，现在只有\"看中线权\"这一条判据。<\/li><li><strong>射手什么时候开始跟团<\/strong>（从吃线切到参团的经济/时间阈值），素材只给了\"7 分钟前不转线\"这个上界。<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路被压、下塔已掉、或中线空出来判断依据：哪条线的兵线位置安全（能吃到、不被越）决策分支：下路被压 → 去中路补线（中单转线的空档）；"}], "hue": 256, "heroes": [], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}], "cross": ["中路", "游走", "对抗路", "打野"]}, {"key": "solo", "name": "对抗路", "icon": "抗", "motto": "压线还是放线", "file": "04_对抗路.md", "title": "对抗路：这一波我压线还是放线", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 对抗路的位置特权：可以合法地不参团<\/h2>\n<p>对抗路离主战场最远，<strong>跑一趟的成本最高<\/strong>。所以这一路的核心不是\"我什么时候去支援\"，而是反过来——<strong>\"我能不能用不去支援，换到更多东西\"<\/strong>。<\/p>\n<p>这让对抗路成了五路里<strong>自主权最高<\/strong>的位置：中路必须转线、游走必须到点、射手必须跟辅助，只有对抗路可以说\"这波我不去，我把线带穿\"。<\/p>\n<p>代价也很清楚：<strong>你不在，团战就是 4v5<\/strong>。所以每一次\"不去\"都必须换来对等的东西——一座塔、两个野怪、或者对面一条线的经济。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 0 步：把收益分成两层——主要收益 / 额外收益    → K-L35\n第 1 步：这一波，我要不要压线？                  → K-L31（判据：压完能不能安全撤）\n第 2 步：压线的收益是什么？                      → K-L32（对面打野来不了 / 对面边路升不到四）\n第 3 步：线权换来的钱，怎么花？                  → K-L33（立刻走，别刷上头）\n第 4 步：额外收益要不要去拿？                    → K-L36（判据：会不会影响主要收益）\n第 5 步：4 分半了，我达标了吗？                  → K-L37（一件成品装 + 鞋 / 0-0-0）\n第 6 步：3:50 的暴君去不去？                     → K-L39（判据：有没有被抢的风险）\n第 7 步：4 分钟之后，带哪条线？                  → K-L40（判据：对面打野位置）\n   ↓\n打不过怎么办？                                 → K-L34（闷头发育也是赢法）\n   ↓\n想放龙换别的东西？                             → K-L38（野区刷新同步的算法）<\/code><\/pre>", "entries": [{"id": "K-L31", "cat": "L", "title": "对抗路可以把线权直接换成钱——但必须先算好怎么撤", "self": "<h3><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> 对抗路可以把线权直接换成钱——但必须先算好怎么撤<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：拿到线权、把兵线推到对面塔前<\/li><li><strong>判断依据<\/strong>：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到<\/li><li><strong>决策分支<\/strong>：<\/li><li>有撤离手段 → <strong>推完立刻走<\/strong>，去中路吃一波线、或进野区刷钱，不要在自家线上原地站着<\/li><li>没有撤离手段 → 只推到河道，不深入<\/li><li><strong>反例<\/strong>：「推完线回城补给」——回城是最亏的选项：你花了 8 秒什么都不做。推完线去做下一件事，才是把线权变现。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:52、@ 04:06、@ 04:08（\"没传送的时候一波清兵线吃野怪刷钱；有传送的时候，清完兵线就传送阵传送开西，保证自己用最快的速度刷最多的钱\"）<\/li><li><strong>可信度<\/strong>：中高（司空震视角的完整一局，动作与口播一致）<\/li><li><strong>分路差异<\/strong>：中路也能推完线走，但<strong>中路走的方向是\"支援\"<\/strong>；对抗路走的方向是\"再吃一份钱\"。同一动作，目的不同。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：拿到线权、把兵线推到对面塔前判断依据：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到决策分支：有撤离手段 → 推完立刻走，去中路吃一波线、…"}, {"id": "K-L32", "cat": "L", "title": "卡线的双重收益：对面打野不敢来 + 对面边路升不到四", "self": "<h3><a class=\"kref\" href=\"#K-L32\">K-L32<\/a> 卡线的双重收益：对面打野不敢来 + 对面边路升不到四<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在线权上压制对面边路<\/li><li><strong>判断依据<\/strong>：兵线位置（能否卡在自家塔前）与对面打野的开局路线<\/li><li><strong>决策分支<\/strong>：把兵线<strong>卡在我方塔前<\/strong>——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了也抓不到人）<\/li><li><strong>反例<\/strong>：「压线就是把兵推过去」——推到对面塔下等于把兵线送给对方，他还是能吃到经验。<strong>卡线和推线是两个相反的动作。<\/strong><\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:47（\"因为我们的卡线，导致对面打野第一时间不敢来，哪吒也没升四，搞得对面一点战斗力都没有\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>交叉<\/strong>：这条直接决定<strong>打野能不能进对面野区<\/strong>（<code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>）——我方边路卡住线，对面打野才不敢反蹲。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在线权上压制对面边路判断依据：兵线位置（能否卡在自家塔前）与对面打野的开局路线决策分支：把兵线卡在我方塔前——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了…"}, {"id": "K-L33", "cat": "L", "title": "别刷上头：刷钱是为了能去支援，不是为了刷钱", "self": "<h3><a class=\"kref\" href=\"#K-L33\">K-L33<\/a> 别刷上头：刷钱是为了能去支援，不是为了刷钱<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你已经经济领先，正在连续刷钱<\/li><li><strong>判断依据<\/strong>：地图上有没有正在打的团/即将刷新的资源点<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友在打 → <strong>立刻传送/走过去<\/strong>，能用传送就不用跑的（省赶路时间）<\/li><li>没有事发生 → 继续带线刷钱，带完线顺手入侵野区<\/li><li><strong>反例<\/strong>：「我经济领先，先刷满再说」——原话是\"千万不要一直刷钱，刷上头了\"。经济领先的唯一用途是<strong>在关键团里碾压<\/strong>，不参团的领先是纸面数字。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 05:30、@ 05:37、@ 06:24<\/li><li><strong>可信度<\/strong>：中高（UP 主自己在同一局里既示范了刷钱也示范了节制）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你已经经济领先，正在连续刷钱判断依据：地图上有没有正在打的团/即将刷新的资源点决策分支：队友在打 → 立刻传送/走过去，能用传送就不用跑的（省赶路时间）没有事发生 →…"}, {"id": "K-L34", "cat": "L", "title": "打不过就闷头发育——经济领先也是一种赢法", "self": "<h3><a class=\"kref\" href=\"#K-L34\">K-L34<\/a> 打不过就闷头发育——经济领先也是一种赢法<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期被压制、支援不出去<\/li><li><strong>判断依据<\/strong>：能不能稳定吃到兵线；对面是否已经开始转线<\/li><li><strong>决策分支<\/strong>：放弃支援，专注吃线 + 刷自家野区，把经济差控制在可接受范围；等对面走位失误再打<\/li><li><strong>反例<\/strong>：「打不过也要去支援，不然队友骂」——去支援等于送第二个人头。<strong>对抗路最合法的止损就是\"不去\"。<\/strong><\/li><li><strong>来源<\/strong>：BV156QfBQEDd @ 01:14、@ 01:28（\"支援不了就闷头发育，经济领先对面边路\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期被压制、支援不出去判断依据：能不能稳定吃到兵线；"}, {"id": "K-L35", "cat": "L", "title": "对抗路前期的收益分两层：兵线+野怪是\"主要收益\"，其余全是\"额外收益\"", "self": "<h3><a class=\"kref\" href=\"#K-L35\">K-L35<\/a> 对抗路前期的收益分两层：兵线+野怪是\"主要收益\"，其余全是\"额外收益\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局到 4 分钟，决定这一分钟做什么<\/li><li><strong>判断依据<\/strong>：这件事属于哪一层<\/li><li><strong>主要收益<\/strong>：一波兵线 + 一组野怪（自家赤甲/小鸟这类）<\/li><li><strong>额外收益<\/strong>：对面的人头/助攻、对面野怪、中立资源（空间之灵）、中路兵线<\/li><li><strong>决策分支<\/strong>：<\/li><li>主要收益没拿 → 先拿主要收益，其他全部推后<\/li><li>主要收益已拿 → 再考虑额外收益（<a class=\"kref\" href=\"#K-L36\">K-L36<\/a>）<\/li><li><strong>反例<\/strong>：「哪里有东西就去哪」——对抗路最典型的崩法是追着额外收益跑，结果自己那波兵没吃到，4 分钟经济落后 800。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 00:16；BV1kVAfzbEBj @ 00:20；BV1kVAfzbEBj @ 00:50<\/li><li><strong>可信度<\/strong>：高（这条是整局打法的骨架，全程都在按它执行）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局到 4 分钟，决定这一分钟做什么判断依据：这件事属于哪一层主要收益：一波兵线 + 一组野怪（自家赤甲/小鸟这类）额外收益：对面的人头/助攻、对面野怪、中立资源（空…"}, {"id": "K-L36", "cat": "L", "title": "拿额外收益的前提：不影响主要收益", "self": "<h3><a class=\"kref\" href=\"#K-L36\">K-L36<\/a> 拿额外收益的前提：不影响主要收益<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：看到一个额外收益（反小鸟、吃中线、抢空间之灵）<\/li><li><strong>判断依据<\/strong>：去拿它会不会让你错过下一波兵线/自家野怪<\/li><li><strong>决策分支<\/strong>：<\/li><li>不影响 → 去拿<\/li><li>会影响 → <strong>先拿完主要收益再回头<\/strong>，或者直接放弃<\/li><li><strong>反例<\/strong>：「顺手就去了」——原话把顺序说死了：拿额外收益的前提，应该是不影响主要收益，<strong>或者拿完主要收益之后再去<\/strong>。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 01:59；BV1kVAfzbEBj @ 02:00；BV1kVAfzbEBj @ 02:03；BV1kVAfzbEBj @ 02:06<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：看到一个额外收益（反小鸟、吃中线、抢空间之灵）判断依据：去拿它会不会让你错过下一波兵线/自家野怪决策分支：不影响 → 去拿会影响 → 先拿完主要收益再回头，或者直接放…"}, {"id": "K-L37", "cat": "L", "title": "4 分半的自我校验线：一件成品装 + 一双鞋、0-0-0", "self": "<h3><a class=\"kref\" href=\"#K-L37\">K-L37<\/a> 4 分半的自我校验线：一件成品装 + 一双鞋、0-0-0<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：约 4:30<\/li><li><strong>判断依据<\/strong>：装备栏 + 战绩<\/li><li><strong>决策分支<\/strong>：<\/li><li>达到 → 说明主要收益全吃到了，可以进入\"看小地图带线\"的阶段（<a class=\"kref\" href=\"#K-L40\">K-L40<\/a>）<\/li><li>没达到 → 说明前面漏了主要收益，接下来补发育，别急着参团<\/li><li><strong>反例<\/strong>：「4 分钟该去参团了」——团战不看你到没到时间，看<strong>你的装备到没到线<\/strong>。0-0-0 也能达标，说明击杀不是这条线的考核项。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 04:26；BV1kVAfzbEBj @ 04:29；BV1kVAfzbEBj @ 04:30<\/li><li><strong>可信度<\/strong>：中高（UP 主明确把它当\"标准\"给出，但具体装备名随版本变，只取\"一件成品装 + 鞋\"这个量级）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：约 4:30判断依据：装备栏 + 战绩决策分支：达到 → 说明主要收益全吃到了，可以进入\"看小地图带线\"的阶段（K-L40）没达到 → 说明前面漏了主要收益，接下来补…"}, {"id": "K-L38", "cat": "L", "title": "对面打野从对抗路野区开 → 他的对抗路野区和暴君同时刷新", "self": "<h3><a class=\"kref\" href=\"#K-L38\">K-L38<\/a> 对面打野从对抗路野区开 → 他的对抗路野区和暴君同时刷新<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局判断出对面打野的开野侧<\/li><li><strong>判断依据<\/strong>：对面打野第一个 Buff 在哪（红开/蓝开）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面从<strong>对抗路侧<\/strong>野区开 → 他的对抗路野区和暴君同时刷新；我方红区刷新时，他的红也快刷新了<\/li><li>掌握这个时间差 → 暴君被抢风险低时，可以去反他的红<strong>换节奏<\/strong><\/li><li><strong>反例<\/strong>：「反野靠猜」——野区刷新是可以用开野侧推出来的，不用猜。不知道刷新时间就去反野，等于送。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 03:10；BV1kVAfzbEBj @ 03:12；BV1kVAfzbEBj @ 03:21；BV1kVAfzbEBj @ 03:24<\/li><li><strong>可信度<\/strong>：中高（这条是全库少见的\"可计算\"判据）<\/li><li><strong>交叉<\/strong>：和打野的 <code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> 是一对——打野算\"我领先几个野\"，边路算\"他的野什么时候刷\"。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局判断出对面打野的开野侧判断依据：对面打野第一个 Buff 在哪（红开/蓝开）决策分支：对面从对抗路侧野区开 → 他的对抗路野区和暴君同时刷新；"}, {"id": "K-L39", "cat": "L", "title": "3:50 的暴君去不去，只看\"有没有被抢的风险\"", "self": "<h3><a class=\"kref\" href=\"#K-L39\">K-L39<\/a> 3:50 的暴君去不去，只看\"有没有被抢的风险\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：3:50 左右，我方打野在打龙<\/li><li><strong>判断依据<\/strong>：对面打野在不在附近；我方上路有没有线权；对面阵容强度<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野能安稳拿 → <strong>不去<\/strong>，继续清线/吃野<\/li><li>有被抢风险（对面打野在附近、我方没线权、对面强度高）→ 去，或者干脆<strong>放龙去反他的红<\/strong><\/li><li><strong>反例<\/strong>：「龙团必须全员到」——原话：因为我们家打野是安稳拿龙的，对面打野没有去暴君，所以\"我们也不用过去\"。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 03:38；BV1kVAfzbEBj @ 03:40；BV1kVAfzbEBj @ 03:48；BV1kVAfzbEBj @ 03:50；BV1kVAfzbEBj @ 03:57<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>交叉<\/strong>：和 D 类 <code><a class=\"kref\" href=\"#K-D15\">K-D15<\/a><\/code>（没一次性资源就别硬接）方向一致，但视角不同：D 类问\"我够不够资格\"，这里问\"这波有没有风险\"。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：3:50 左右，我方打野在打龙判断依据：对面打野在不在附近；"}, {"id": "K-L40", "cat": "L", "title": "4 分钟之后，注意力从兵线转到小地图：看打野位置决定带哪条线", "self": "<h3><a class=\"kref\" href=\"#K-L40\">K-L40<\/a> 4 分钟之后，注意力从兵线转到小地图：看打野位置决定带哪条线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：过了 4 分钟，进入中期<\/li><li><strong>判断依据<\/strong>：小地图上对面打野的位置 + 哪条线的兵线正在过来<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野在下半区 → 带<strong>上路/对抗路线<\/strong>（安全侧）<\/li><li>打野在上半区且视野可见 → 带下半区线，或者干脆去中路吃线<\/li><li>打野位置不明 → 只带\"能立刻退回塔下\"的那一段<\/li><li><strong>反例<\/strong>：「中期就是一直带线」——中期带线的安全性完全由对面打野的位置决定，不看他就是盲带。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 04:49；BV1kVAfzbEBj @ 04:52；BV1kVAfzbEBj @ 04:55；BV1kVAfzbEBj @ 05:00<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>压线不会撤<\/strong>（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>）→ 推完站在对面塔前，等对面打野来收。<\/li><li><strong>把卡线做成推线<\/strong>（<a class=\"kref\" href=\"#K-L32\">K-L32<\/a>）→ 想让对面难受，结果把兵线送过去让他舒服。<\/li><li><strong>刷钱刷到不参团<\/strong>（<a class=\"kref\" href=\"#K-L33\">K-L33<\/a>）→ 经济第一，团战 4v5，输了怪队友。<\/li><\/ol>\n<h2>4. 交叉：对抗路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>我卡线，你能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>你转线过来，这波线谁吃<\/td><td><code><a class=\"kref\" href=\"#K-L03\">K-L03<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>边路一血要不要来帮<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>传送/传送阵的 CD 与距离<\/strong>没有素材，只能确定\"优先用传送、少跑路\"这个方向。<\/li><li>对抗路与打野的\"二包一\"配合（谁先手、怎么卡位）——无素材（打野视角的 <code><a class=\"kref\" href=\"#K-L48\">K-L48<\/a><\/code> 只讲了蹲回头点）。<\/li><li>坦克型边路 vs 战士型边路的大局观差异（现在所有结论都偏\"能带线能刷钱\"的战士/半肉）。<\/li><li><strong>\"额外收益\"的取舍在逆风局是否反过来<\/strong>（逆风可能需要主动抢额外收益搏一下）——无样本。<\/li><\/ul>", "sum": "适用版本：S45触发条件：过了 4 分钟，进入中期判断依据：小地图上对面打野的位置 + 哪条线的兵线正在过来决策分支：打野在下半区 → 带上路/对抗路线（安全侧）打野在上半区且视野可见 → 带…"}], "hue": 313, "heroes": ["夏洛特"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}], "cross": ["中路", "游走", "发育路", "打野"]}, {"key": "jungle", "name": "打野", "icon": "野", "motto": "该刷还是该抓", "file": "05_打野.md", "title": "打野：现在该刷还是该抓", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 打野是唯一按「时间差」算账的位置<\/h2>\n<p>另外四路的资源是<strong>线<\/strong>（有固定节奏，一波接一波），打野的资源是<strong>野<\/strong>（有刷新间隔，可以被\"抢时间差\"）。所以打野的核心概念不是\"抓了几个人\"，而是：<\/p>\n<blockquote><p><strong>野区速率<\/strong>——你清完自己野区的速度，决定你能不能\"多出一次机会\"。<\/p><\/blockquote>\n<p>原话：「很多人不理解野区速率这个概念。当双方野区刷新间隔比较短时，是很难直接进野区的，<strong>进野区起码要领先对方两个野怪的时间差<\/strong>。」<\/p>\n<p>这条一旦立住，打野的所有判断都变成同一道算术题：<strong>我这一趟出去，回来的时候会不会落后节奏？<\/strong><\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 0 步：这一局我是\"抢节奏\"还是\"错位\"？    → K-L46（判据：双方一级强弱）\n第 1 步：这局我一级能不能反野？            → K-L42（不能 → 决定开局刷野路线）\n第 2 步：第一轮刷完，先吃满还是先抓？      → K-L47\n第 3 步：我要不要蹭中线升四？              → K-L43（蹭了会拖野区速率，必须换来反打）\n第 4 步：这波能不能进对面野区？            → K-L44（判据：领先两个野怪 + 视野）\n第 5 步：对面打野刚露头，我去蹲哪？        → K-L48（蹲他的\"回头点\"）\n第 6 步：什么时候放弃自家野区去跟团？      → K-L45（判据：边路是否打出关键技能）<\/code><\/pre>", "entries": [{"id": "K-L41", "cat": "L", "title": "打野的 KPI 是「时间差」，不是「抓了几个人」", "self": "<h3><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> 打野的 KPI 是「时间差」，不是「抓了几个人」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每一次决定\"现在去哪\"<\/li><li><strong>判断依据<\/strong>：你这一趟出去，回来时会不会落后对面的野区节奏<\/li><li><strong>决策分支<\/strong>：<\/li><li>这一趟不亏速率 → 可以抓<\/li><li>这一趟要绕远/要蹲很久 → 不抓，保住速率<\/li><li><strong>反例<\/strong>：「打野不抓人就废了」——抓不到人的一趟，亏的是<strong>两三个野怪的时间<\/strong>，而这段时间对面打野正好在做事。抓人失败不是\"没收益\"，是\"负收益\"。<\/li><li><strong>为什么是这一路的核心<\/strong>：另外四路的资源是线（有固定节奏，不走就浪费），只有打野的资源是野（可以抢时间差）。这条判据在其他四路没有对应物。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"很多人不理解野区速率这个概念……进野区起码要领先对方两个野怪的时间差\"）<\/li><li><strong>可信度<\/strong>：高（唯一的完整打野视角素材，且它自己就在用这个概念算账）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每一次决定\"现在去哪\"判断依据：你这一趟出去，回来时会不会落后对面的野区节奏决策分支：这一趟不亏速率 → 可以抓这一趟要绕远/要蹲很久 → 不抓，保住速率反例：「打野…"}, {"id": "K-L42", "cat": "L", "title": "开局路线由「一级能不能反野」决定，不是背固定路线", "self": "<h3><a class=\"kref\" href=\"#K-L42\">K-L42<\/a> 开局路线由「一级能不能反野」决定，不是背固定路线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局读条结束前<\/li><li><strong>判断依据<\/strong>：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）<\/li><li><strong>决策分支<\/strong>：<\/li><li>一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区<\/li><li>一级不好反 → <strong>从发育路野区开，往对抗路刷<\/strong>（把路线拉成一条单向线，刷完正好到能出节奏的位置）<\/li><li><strong>反例<\/strong>：「打野就按固定路线刷」——路线是<strong>为了配合一级强弱<\/strong>而存在的。一级反野失败的情况下还硬走入侵路线，等于把节奏送出去。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 03:09、@ 03:12（\"一级不好反野，这把就可以选择直接发育路野区开往对抗路\"）<\/li><li><strong>可信度<\/strong>：中高（职业级对局拆解，明确给了\"因为 A 所以 B\"的因果关系）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局读条结束前判断依据：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）决策分支：一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区一级不好反…"}, {"id": "K-L43", "cat": "L", "title": "蹭中线是「投资」，不是「顺手」——必须换来升四或反打", "self": "<h3><a class=\"kref\" href=\"#K-L43\">K-L43<\/a> 蹭中线是「投资」，不是「顺手」——必须换来升四或反打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：路过中路，中单有线权/中单不在<\/li><li><strong>判断依据<\/strong>：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>差一级到四 → <strong>蹭，且优先速推中线<\/strong>（升四之后才有反打能力）<\/li><li>已经四级以上 → 不蹭，继续刷野保速率<\/li><li><strong>反例<\/strong>：「路过就吃一口」——原话紧接着就是\"因为这波蹭中线耽误了片刻的野区速率\"。<strong>蹭线的成本是看得见的（速率），收益必须能兑现，否则纯亏。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（升四才有反打机会）；@ 06:01（蹭中线拖慢速率）<\/li><li><strong>可信度<\/strong>：高（同一条视频里同时给了收益和成本，是全库最完整的一组权衡）<\/li><li><strong>交叉<\/strong>：这条要和 <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> 对着看——<strong>中单让不让，看的是打野差几级到四<\/strong>。两边判据一致，才不会互相抢。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：路过中路，中单有线权/中单不在判断依据：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"决策分支：差一级到四 → 蹭，且优先速推中线（升四之后才有…"}, {"id": "K-L44", "cat": "L", "title": "进对面野区：至少领先两个野怪的时间差，并且卡住视野", "self": "<h3><a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 进对面野区：至少领先两个野怪的时间差，并且卡住视野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想反对面野区<\/li><li><strong>判断依据<\/strong>：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）<\/li><li><strong>决策分支<\/strong>：<\/li><li>领先 ≥2 个野怪 → 可以进，且<strong>边打边卡视野<\/strong>（先探草再动野怪）<\/li><li>领先不足 → 不进，稳稳刷完自家野区再出来找节奏<\/li><li><strong>反例<\/strong>：「对面打野在下路，我去反他蓝」——他去下路不代表他回不来，你的判断依据应该是<strong>时间差<\/strong>，不是\"他刚露过视野\"。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"进野区起码要领先对方两个野怪的时间差\"）；@ 09:45、@ 09:53（\"卡好视野……全身而退\"）<\/li><li><strong>可信度<\/strong>：高（这条是全库最硬的分路判据，有明确阈值）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：想反对面野区判断依据：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）决策分支：领先 ≥2 个野怪 → 可以进，且边打边卡视野（先探草再动…"}, {"id": "K-L45", "cat": "L", "title": "放弃自家野区去跟团的条件：边路打出了关键技能", "self": "<h3><a class=\"kref\" href=\"#K-L45\">K-L45<\/a> 放弃自家野区去跟团的条件：边路打出了关键技能<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：正在刷野，边路/中路打起来了<\/li><li><strong>判断依据<\/strong>：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面关键技能已交 → <strong>立刻放弃野区去跟<\/strong>（这时候的团是\"低风险高收益\"）<\/li><li>只是互相消耗 → 继续刷，别被\"打起来了\"骗过去<\/li><li><strong>反例<\/strong>：「哪边打起来就去哪边」——没有关键技能交换的团，打野去了也只能蹭点伤害，回来还落后节奏。<strong>打野参团的理由是对面交了什么，不是队友喊了什么。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:08、@ 07:24（\"拉视野观察到影被夏洛特打出大招……我们就可以直接放弃中线来跟团\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：正在刷野，边路/中路打起来了判断依据：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）决策分支：对面关键技能已交 → 立刻放弃野区去跟（这时候的团是\"低风险高收益…"}, {"id": "K-L46", "cat": "L", "title": "对方打野一级比你强时，开局不是\"对抗\"，是「错位」", "self": "<h3><a class=\"kref\" href=\"#K-L46\">K-L46<\/a> 对方打野一级比你强时，开局不是\"对抗\"，是「错位」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：读条结束前，判断双方打野一级强弱<\/li><li><strong>判断依据<\/strong>：① 双方一级对拼/刷野速度 ② 双方边路的线权（能不能来帮）<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方强 → 正常抢节奏，可以进对面野区（<code><a class=\"kref\" href=\"#K-L42\">K-L42<\/a><\/code>）<\/li><li>对方强 → <strong>创造错位<\/strong>：红开转上半区发育，避开他，不在开局抢节奏；等双边打开局面、经济领先后再回去<\/li><li><strong>反例<\/strong>：「打野就该刚正面，谁强谁进野区」——原话：\"我们如果和他同时出野区并不占优势。\" 明知道同步出野区打不过，还去抢，等于把开局送给对面。<\/li><li><strong>分路差异<\/strong>：这条只有打野成立。其他位置\"避开\"的代价是掉线权，打野\"避开\"的代价只是少抓一次人，账完全不同。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 01:55；BV1pU8y6VEhP @ 02:00；BV1pU8y6VEhP @ 02:01；BV1pU8y6VEhP @ 02:09<\/li><li><strong>可信度<\/strong>：中高（澜 vs 宫本的开局拆解，因果讲得很清楚）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：读条结束前，判断双方打野一级强弱判断依据：① 双方一级对拼/刷野速度 ② 双方边路的线权（能不能来帮）决策分支：我方强 → 正常抢节奏，可以进对面野区（K-L42）对…"}, {"id": "K-L47", "cat": "L", "title": "第一轮野区刷完，先把经济吃满再转中——不要提前抢节奏", "self": "<h3><a class=\"kref\" href=\"#K-L47\">K-L47<\/a> 第一轮野区刷完，先把经济吃满再转中——不要提前抢节奏<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一轮野区清完，想去中路做事<\/li><li><strong>判断依据<\/strong>：自己当前经济/等级是否能支撑一次越塔或反蹲<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济没吃满 → <strong>先吃满<\/strong>（自家剩余野 + 安全线），再转中<\/li><li>已经领先 → 转中开节奏<\/li><li><strong>反例<\/strong>：「打野要早抓才有存在感」——原话：\"这就是经济一直刷不起来的原因……所以先把经济吃满再转中。\" 半血半经济去抓，抓不到就两头亏。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 04:36；BV1pU8y6VEhP @ 04:43<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一轮野区清完，想去中路做事判断依据：自己当前经济/等级是否能支撑一次越塔或反蹲决策分支：经济没吃满 → 先吃满（自家剩余野 + 安全线），再转中已经领先 → 转中开…"}, {"id": "K-L48", "cat": "L", "title": "预判对面打野的\"回头点\"：他抓完人一定要回中路吃线", "self": "<h3><a class=\"kref\" href=\"#K-L48\">K-L48<\/a> 预判对面打野的\"回头点\"：他抓完人一定要回中路吃线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面打野刚在边路露头抓人<\/li><li><strong>判断依据<\/strong>：他抓完之后的必经路线（回中路吃兵线/回自家野区）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他抓完必回中 → <strong>提前去中路线侧或他野区入口蹲<\/strong>（反小猪、卡他的回程）<\/li><li>他不回中（去另一侧）→ 直接反他刚离开的那片野区<\/li><li><strong>反例<\/strong>：「他露头了我赶紧去反野」——他去抓人不代表他的野区空着，但他的<strong>回头点<\/strong>是可预测的。抓\"回头点\"比抓\"空野区\"稳定。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 05:39；BV1pU8y6VEhP @ 05:43<\/li><li><strong>可信度<\/strong>：中（单来源，但是明确的因果表述）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"抓人\"当 KPI<\/strong>（<a class=\"kref\" href=\"#K-L44\">K-L44<\/a>）→ 抓不到人的时候你在亏速率，亏两次就再也进不去对面野区。<\/li><li><strong>蹭线不兑现<\/strong>（<a class=\"kref\" href=\"#K-L43\">K-L43<\/a>）→ 蹭了线、没升四、没打成反打，纯亏速率。<\/li><li><strong>看到打架就去<\/strong>（<a class=\"kref\" href=\"#K-L45\">K-L45<\/a>）→ 没有关键技能交换的团，去了就是陪打。<\/li><\/ol>\n<h2>4. 交叉：打野和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code>（两边判据必须一致）<\/td><\/tr><tr><td>对抗路<\/td><td>我能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>（他卡住线我才敢进）<\/td><\/tr><tr><td>游走<\/td><td>开局野区要不要人跟<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>（游走第一顺位是野区）<\/td><\/tr><tr><td>发育路<\/td><td>下路打起来要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>（看对面交了什么）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>野怪刷新间隔的具体秒数<\/strong>没有素材，只有\"两个野怪的时间差\"这个相对阈值。<\/li><li>不同打野类型的路线差异：现有两条（镜的速率框架、澜的错位开局），<strong>发育型打野（李白/公孙离类）没有样本<\/strong>。<\/li><li>打野的\"逆风局\"怎么打（野区被反穿之后的重启方式）——只有一条刘备逆风局的候选视频，但那条<strong>没有可用字幕<\/strong>。<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面打野刚在边路露头抓人判断依据：他抓完之后的必经路线（回中路吃兵线/回自家野区）决策分支：他抓完必回中 → 提前去中路线侧或他野区入口蹲（反小猪、卡他的回程）他不回…"}], "hue": 159, "heroes": [], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}], "cross": ["中路", "游走", "发育路", "对抗路"]}], "stages": [{"file": "00_主线地图.md", "title": "主线地图", "roles": [], "id": "00"}, {"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "lane_about": "<h2>这一类回答什么<\/h2>\n<p><strong>\"我这个位置，该按什么顺序想事？\"<\/strong><\/p>\n<p>不是\"这个英雄怎么玩\"（A 类），也不是\"现在第几分钟\"（D 类），而是<strong>同一个时间点，五个位置看到的东西不一样、要做的决定也不一样<\/strong>。<\/p>\n<p>典型问法：「我中路清完线了该走哪」「我辅助开局去哪」「打野这波该刷还是该抓」——这些问题的答案跟你玩哪个英雄关系不大，跟你站哪个位置关系极大。<\/p>\n<h2>为什么必须单列一类<\/h2>\n<p>英雄卡是按\"英雄\"切的，但它天然会把<strong>分路共有的东西<\/strong>重复 N 遍：五个中路英雄，就写五遍\"线权看对面清线速度\"。这类内容放在英雄卡里是<strong>错位<\/strong>的——它不稳定（换个英雄照样成立），也很难维护（改一处要改五处）。<\/p>\n<p>所以规矩是：<\/p>\n<blockquote><p><strong>分路通用的判断 → 放 L 类，只写一遍；英雄卡只留\"这个英雄有什么不同\"。<\/strong><\/p><\/blockquote>\n<h2>五路对照：共享什么、差在哪<\/h2>\n<h3>共享的四条底层判据（五路全部成立）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>能不能打，看的是<strong>战斗力差 × 能不能及时到达<\/strong>，不是经济差<\/td><td><code>K-D<\/code> 主线地图（BV1i2n96AEvp @ 02:31）<\/td><\/tr><tr><td>2<\/td><td><strong>线权 = 可动窗口<\/strong>。有线权才有\"走\"的资格，没线权动一步都是亏<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><tr><td>3<\/td><td><strong>视野是决策输入<\/strong>，不是\"顺手做的\"。看不见就不动<\/td><td><a class=\"kref\" href=\"#K-L44\">K-L44<\/a>、<a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/td><\/tr><tr><td>4<\/td><td><strong>人数差 &gt; 个人操作<\/strong>。五个人同时到一个点，比任何人秀都值钱<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>五路各自的\"唯一决定\"<\/h3>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>只回答这一个决定<\/th><th>别人替不了你的地方<\/th><th>详见<\/th><\/tr><\/thead><tbody><tr><td><strong>中路<\/strong><\/td><td>这波线清完，我往哪个方向走<\/td><td>唯一能<strong>同时<\/strong>够到三条路的位置，转线成本最低<\/td><td><code>01_中路.md<\/code><\/td><\/tr><tr><td><strong>对抗路<\/strong><\/td><td>这一波我压线还是放线<\/td><td>离团战最远，<strong>可以合法地不参团<\/strong>去换钱<\/td><td><code>04_对抗路.md<\/code><\/td><\/tr><tr><td><strong>打野<\/strong><\/td><td>现在该刷还是该抓<\/td><td>唯一按<strong>时间差<\/strong>算账的位置，不走线只走野区<\/td><td><code>05_打野.md<\/code><\/td><\/tr><tr><td><strong>发育路<\/strong><\/td><td>这波兵我敢不敢吃<\/td><td>全场最贵的经济来源，也是全场最容易被开的位置<\/td><td><code>03_发育路.md<\/code><\/td><\/tr><tr><td><strong>游走<\/strong><\/td><td>第一步去哪<\/td><td>唯一<strong>没有自己线权<\/strong>的位置，靠别人的线权吃饭<\/td><td><code>02_游走.md<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>交叉点：哪两路会在同一件事上打架<\/h3>\n<p>这张表是这类内容真正的价值——<strong>冲突发生的地方，才是需要判断的地方<\/strong>。<\/p>\n<div class=\"tw\"><table><thead><tr><th>交叉<\/th><th>争的是什么<\/th><th>判据（谁让）<\/th><th>条目<\/th><\/tr><\/thead><tbody><tr><td>中路 × 打野<\/td><td><strong>中线归谁<\/strong><\/td><td>打野差一级到四 → 中线让他；否则中线归中单转线<\/td><td><a class=\"kref\" href=\"#K-L04\">K-L04<\/a>、<a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><tr><td>中路 × 游走<\/td><td>开局第一波谁帮清中<\/td><td>游走按「野→边→射→中」排，中路排第四<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/td><\/tr><tr><td>游走 × 发育路<\/td><td>开局跟不跟射手<\/td><td>默认<strong>不跟<\/strong>，除非对面 2v2 压制且我方射手会被越<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/td><\/tr><tr><td>对抗路 × 打野<\/td><td>对抗路线权换不换对面野区<\/td><td>我方边路有线权压制 → 打野才敢进对面野区<\/td><td><a class=\"kref\" href=\"#K-L32\">K-L32<\/a>、<a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/td><\/tr><tr><td>发育路 × 游走<\/td><td>2v2 卡不卡线<\/td><td>看辅助强度，不看射手强度<\/td><td><a class=\"kref\" href=\"#K-L22\">K-L22<\/a>、<a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/td><\/tr><tr><td>打野 × 全队<\/td><td>蹭线拖慢野区速率<\/td><td>蹭线是投资，必须换来\"升四/反打\"，否则不蹭<\/td><td><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>读法<\/strong>：先按\"我是哪个位置\"进对应文档，再遇到交叉点的决定时跳到对方那一路看他的约束。两边都看完，才知道谁该让。<\/p>\n<h2>归属规则（写新条目时的判定）<\/h2>\n<pre><code>这条结论，换一个英雄还成立吗？\n├─ 不成立（只在某英雄的技能组里才有意义） → A 类，写进英雄卡\n└─ 成立\n   ├─ 只有某一个位置成立（换位置就不成立） → L 类，写进那个分路\n   └─ 五个位置都成立                        → D 类主线地图的\"底层判据\"<\/code><\/pre>\n<p>反例自查：「打野开先手时法师跟进放大」——换任何法师都成立，但换成分路就不成立（射手不会跟进放大），所以它属于<strong>中路<\/strong>的 L 类，不属于某个英雄。<\/p>\n<h2>编号<\/h2>\n<p><code>K-Lxx<\/code>，全局唯一，按分路段预分配号段：<\/p>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>号段<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> ~ <a class=\"kref\" href=\"#K-L10\">K-L10<\/a><\/td><\/tr><tr><td>游走<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> ~ <a class=\"kref\" href=\"#K-L20\">K-L20<\/a><\/td><\/tr><tr><td>发育路<\/td><td><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> ~ <a class=\"kref\" href=\"#K-L30\">K-L30<\/a><\/td><\/tr><tr><td>对抗路<\/td><td><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> ~ <a class=\"kref\" href=\"#K-L40\">K-L40<\/a><\/td><\/tr><tr><td>打野<\/td><td><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> ~ <a class=\"kref\" href=\"#K-L50\">K-L50<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>当前状态<\/h2>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>条目<\/th><th>素材厚薄<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>6 条（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>~06）<\/td><td>够用（小乔/女娲/海月/火舞多源）<\/td><\/tr><tr><td>游走<\/td><td>8 条（<a class=\"kref\" href=\"#K-L11\">K-L11<\/a>~18）<\/td><td>够用（大乔/鲁班/盾山/苏烈）<\/td><\/tr><tr><td>发育路<\/td><td>10 条（<a class=\"kref\" href=\"#K-L21\">K-L21<\/a>~30）<\/td><td><strong>已补齐<\/strong>：2026-11-01 补入射手第一视角（BV1X2jV6KEiP 巅峰万强局）<\/td><\/tr><tr><td>对抗路<\/td><td>10 条（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>~40）<\/td><td>已补：2026-11-01 补入\"主要收益/额外收益\"框架（BV1kVAfzbEBj）<\/td><\/tr><tr><td>打野<\/td><td>8 条（<a class=\"kref\" href=\"#K-L41\">K-L41<\/a>~48）<\/td><td>够用（镜的速率框架 + 澜的错位开局）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>两条容易搞混的同类判据，已明确分工<\/strong>：<\/p>\n<ul><li>「卡线」在对抗路叫<strong>卡对面<\/strong>（<code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>，目的是让对面打野不敢来、对面边路升不到四）；在发育路叫<strong>卡自己这波线在塔外<\/strong>（<code><a class=\"kref\" href=\"#K-L23\">K-L23<\/a><\/code>，目的是逼对面进你的攻击范围）。两个动作方向相反，不要混用。<\/li><li>「中线权」在中路是<strong>自己的产出<\/strong>（<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>），在发育路是<strong>别人的前提<\/strong>（<code><a class=\"kref\" href=\"#K-L26\">K-L26<\/a><\/code>）——发育路吃不吃得下这波线，由中路决定。<\/li><\/ul>\n<h3>素材体检这件事<\/h3>\n<p>2026-11-01 新增 <code>s12_check.py<\/code>：抓完字幕先跑一遍，看<strong>分路术语密度<\/strong>和<strong>噪音密度<\/strong>。当天实测 14 条候选里只有 4 条可用——B 站字幕轨经常是别的视频的（iPhone 评测、职场访谈、LoL 局）。不体检直接写卡，就是拿别人的稿子当王者素材。<\/p>", "cats": [{"key": "A", "name": "英雄教学", "desc": "这个英雄怎么玩、什么时候强", "n": 31}, {"key": "B", "name": "克制关系", "desc": "打谁舒服、被谁克、为什么", "n": 5}, {"key": "C", "name": "BP", "desc": "选人阶段该怎么定", "n": 0}, {"key": "D", "name": "对局内", "desc": "现在这一刻该干什么", "n": 18}, {"key": "L", "name": "分路", "desc": "这个位置该按什么顺序想事", "n": 42}], "overview": [{"title": "导航：四类内容，四种问法", "file": "00_导航.md", "html": "<p>知识库按<strong>内容类型<\/strong>分四类。先判断你问的是哪一类，再去那一类找。<\/p>\n<div class=\"tw\"><table><thead><tr><th>类<\/th><th>你问的是<\/th><th>目录<\/th><th>编号<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td><strong>A 英雄教学<\/strong><\/td><td>\"这个英雄怎么玩\"<\/td><td><code>A_英雄教学/<\/code><\/td><td><code>K-Axx<\/code><\/td><td>苏烈 ✅<\/td><\/tr><tr><td><strong>B 克制关系<\/strong><\/td><td>\"打谁舒服、被谁克\"<\/td><td><code>B_克制关系/<\/code><\/td><td><code>K-Bxx<\/code><\/td><td>苏烈 ✅<\/td><\/tr><tr><td><strong>C BP<\/strong><\/td><td>\"选人阶段该怎么定\"<\/td><td><code>C_BP/<\/code><\/td><td><code>K-Cxx<\/code><\/td><td>⚠️ 骨架，无实证<\/td><\/tr><tr><td><strong>D 对局内<\/strong><\/td><td>\"现在这一刻该干什么\"<\/td><td><code>D_对局内/<\/code><\/td><td><code>K-Dxx<\/code><\/td><td>04 对线期 ✅<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>四类的边界（别混）<\/h2>\n<ul><li><strong>A 讲\"这个英雄\"<\/strong>：机制、连招顺序、强势期、废的时候。<strong>不涉及对面是谁<\/strong>。<\/li><li><strong>B 讲\"两个英雄之间\"<\/strong>：必须有具体对手。同一条结论换个对手就不成立，才叫克制。<\/li><li><strong>C 讲\"选人之前\"<\/strong>：只跟阵容和版本有关，不跟具体对局局势有关。<\/li><li><strong>D 讲\"选人之后\"<\/strong>：必须带时间点（0:45 / 4 分钟 / 10 分钟），不带时间点的不是 D 类。<\/li><\/ul>\n<p><strong>判定口诀<\/strong>：结论里出现\"对面是谁\"→ B；出现\"第几分钟\"→ D；只是\"这英雄\"→ A；只是\"这版本/这阵容\"→ C。<\/p>\n<h2>两条跨类的用法<\/h2>\n<ol><li><strong>A 和 B 是配套的<\/strong>：A 告诉你这英雄靠什么强，B 告诉你这个\"靠什么\"在谁面前失效。只看 A 不看 B，会在被克的对局里越打越崩。<\/li><li><strong>C 的输出是 D 的输入<\/strong>：BP 定了你能干什么，D 才谈得上\"这一刻该不该动\"。<\/li><\/ol>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<p>经济差只是战斗力差的一种来源。信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。 来源：<code>BV1i2n96AEvp @ 02:31<\/code>。<\/p>\n<h2>读法<\/h2>\n<ol><li>先按上表定位到类，再看那类的 <code>_说明.md<\/code> 了解它回答什么；<\/li><li>只读命中的那一条，<strong>不要通读<\/strong>；<\/li><li>条目里的「反例」比「结论」值钱——那是别人踩过的坑。<\/li><\/ol>"}, {"title": "教学信源名单（S45 实测，2026-10-31）", "file": "95_信源名单.md", "html": "<blockquote><p>这不是「关注列表」，是<strong>取用列表<\/strong>。按问题去取，不要全订。 名单会随赛季变，每 2 周复核一次（看 S45 更新数与平均时长有没有掉）。<\/p><\/blockquote>\n<hr>\n<h2>一、先定判据：凭什么说一个 UP「值得信任」<\/h2>\n<p>信任不来自粉丝量、也不来自播放量。按下面五条打分，缺两条以上就不进名单。<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>怎么验<\/th><th>反例特征<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>给判据，不给结论<\/strong><\/td><td>句子结构里有没有「如果/只要/除非/当…时」<\/td><td>全程「视情况而定」「看你怎么玩」<\/td><\/tr><tr><td>2<\/td><td><strong>讲机制，不只讲操作<\/strong><\/td><td>有没有「因为…所以」「原因是」，能不能解释<strong>为什么<\/strong>这样打<\/td><td>「记住这个连招就行」<\/td><\/tr><tr><td>3<\/td><td><strong>给可执行的阈值<\/strong><\/td><td>有没有秒数、经济差、码数、身位、次数<\/td><td>「差不多」「差一点」<\/td><\/tr><tr><td>4<\/td><td><strong>版本对得上<\/strong><\/td><td>标题/内容里的赛季号是否为当前 S45；S44 及更早当作过期<\/td><td>「S43 上路必看」今天还挂首页<\/td><\/tr><tr><td>5<\/td><td><strong>自证 + 不夹带<\/strong><\/td><td>有没有段位/国服/职业教练身份；签名里有没有「包标/上星/复盘××元」<\/td><td>全靠嘴说「我是国服」，且每条视频都在卖课<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这五条怎么量化<\/strong>：本次实测是把候选人的视频字幕抓下来，统计 条件句密度、因果句密度、数字密度、机制术语浓度、空话密度（无脑/记住就行）， 用样本内百分位合成质量分。播放量只占 5% 权重。<\/p>\n<p><strong>实测发现（值得记住）<\/strong>：<\/p>\n<ul><li>B 站「王者荣耀教学」关键词下，<strong>结构化解说型账号极少<\/strong>，高播放大多是直播切片、<\/li><\/ul>\n<p>实录、对喷、或流水线卖课。<\/p>\n<ul><li>抓了 26 个候选、约 100 条视频字幕，只有 <strong>10 个<\/strong>满足「至少 2 条字幕是人在讲而不是<\/li><\/ul>\n<p>游戏音效」。很多号的字幕轨全是「技能正在冷却」「请求集合」——那是 ASR 把游戏音效 当成说话转录了。<\/p>\n<ul><li>所以：<strong>字幕干净本身就是个质量信号<\/strong>，说明有旁白、有解说意图。<\/li><\/ul>\n<hr>\n<h2>二、S 档：跟着学「判断依据」（讲得清、还在更）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>为什么进 S<\/th><th>要打折扣的地方<\/th><\/tr><\/thead><tbody><tr><td><strong>王者荣耀晚风风<\/strong><\/td><td>481626368<\/td><td>打野·全局<\/td><td>视野与节奏讲成可执行步骤：「利用视野开节奏的两个关键点」；老虎那期给到 3 分 15 秒刷新交汇、7 分钟两倍经济差。术语浓度全场最高<\/td><td>均长仅 5.8 分钟，信息密度高但要反复看；签名有「wx 上星/商务」，业务与内容分开看<\/td><\/tr><tr><td><strong>白菜打野教学<\/strong><\/td><td>67244546<\/td><td>打野·分段突破<\/td><td>因果句密度全场最高，明确讲「你卡在 1900–2100 是因为前 4 分钟」，直接对着一个分段改动作<\/td><td>营销话术重（封神/反复观看）；卖复盘 88/次，注意把「他的服务」和「他说的方法」分开<\/td><\/tr><tr><td><strong>阿泽干货博主<\/strong><\/td><td>322640745<\/td><td>全英雄·国服共创<\/td><td>请国一/2w1 分玩家共创，给的是节点型判据：4 分钟圣杯、10 分钟三件套、10 分钟分均 6800 经济<\/td><td>他也做英雄联盟内容（样本里混进过 369 兰博），<strong>只取王者分区<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>三、A 档：单点很硬，按需取（不追全部，只取自己那一路）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>取什么<\/th><\/tr><\/thead><tbody><tr><td><strong>益达兄弟辅助教学<\/strong><\/td><td>298590209<\/td><td>辅助<\/td><td>巅峰最高 2667、总榜第五。出装判据实用（极影 vs 近卫按对面强度与阵容选），九大神辅系列可当辅助入门骨架<\/td><\/tr><tr><td><strong>老杨国服嫦娥<\/strong><\/td><td>1866098100<\/td><td>中路·嫦娥<\/td><td>目标置换讲得清楚：「这波不追求杀人，追求打掉状态、拖刘备到四」——这正是中路该有的思路。吐槽类视频跳过<\/td><\/tr><tr><td><strong>奥特曼zz国一刘备凯<\/strong><\/td><td>18909338<\/td><td>打野·刘备<\/td><td>实战细节密度高（记对面闪现、卡视野蹲人）。签名有上分业务，只取内容<\/td><\/tr><tr><td><strong>夜昧<\/strong><\/td><td>49993700<\/td><td>对抗路<\/td><td>粉丝少但讲得实在：对抗路稳线优先、宁可打不过也别被带节奏；马超存枪的版本差异<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>A 档的共同限制：<strong>覆盖窄<\/strong>。他们只对自己那一路负责，别拿打野的节奏逻辑去套中路。<\/p><\/blockquote>\n<h2>四、B 档：直播切片与职业选手（学操作与节奏，不学结论）<\/h2>\n<p>你说了切片也看，那这里要分清<strong>看什么<\/strong>：<\/p>\n<blockquote><p>切片天然删掉前提，只留结果。所以切片能用来<strong>验证你已经有的判断<\/strong>， 不能用来<strong>建立判断<\/strong>。看的时候问自己「他为什么这时候上」，而不是记「他这时候上了」。<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>类型<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td><strong>赖神无所畏惧<\/strong><\/td><td>395931838<\/td><td>大主播·对抗路（230w）<\/td><td>S45 内 21 条但均长 1.7 分钟，是切片形态。适合看对抗路的对线处理与手感，不适合学体系<\/td><\/tr><tr><td><strong>哔哩哔哩王者荣耀赛事<\/strong><\/td><td>392836434<\/td><td>官方赛事（691w）<\/td><td>S45 内 38 条、均长 55 分钟。<strong>这是 BP 与运营的唯一一手素材<\/strong>，也是我们知识库 C 类（BP）目前唯一的可靠来源<\/td><\/tr><tr><td>职业选手本人号（如 AG 超玩会老帅、LGD 教练阿泰）<\/td><td>549922787 / 492870807<\/td><td>职业/教练认证<\/td><td>账号存在且有认证，但按名字检索近期投稿命中为 0，需进空间页确认更新情况；确认后再补进名单<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>切片号的坑<\/strong>：同一选手常有好几个「XX剪辑呺」「XX精彩集锦」。实测其中一个剪辑号 的字幕轨全是歌词和英雄语音，一条讲解都没有——那种号只能当集锦看。 <strong>认准认证标识和署名，不要认名字相似。<\/strong><\/p>\n<h2>五、不进名单的（按行为特征判断，不针对具体人）<\/h2>\n<ol><li><strong>签名 = 卖课目录<\/strong>：「包标」「上星」「加入我们××教」「复盘 ×× 元」，<\/li><\/ol>\n<p>且视频平均时长 &lt; 3 分钟 → 内容被切成钩子，判断链是断的。<\/p>\n<ol><li><strong>纯剪辑号<\/strong>：无旁白、字幕只有歌词/游戏语音。<\/li><li><strong>版本漂移号<\/strong>：标题还挂着 S43/S44，或内容里说「这个版本」但无法对应到 S45。<\/li><li><strong>只讲出装不讲为什么<\/strong>：给一套铭文出装就结束，遇到阵容变化无法迁移。<\/li><\/ol>\n<hr>\n<h2>六、按你的情况排的取用顺序<\/h2>\n<p>你主中辅、在练对抗、目标荣耀。所以不要五个都订，按这个顺序取：<\/p>\n<ol><li><strong>先修判断公式<\/strong>（解决「什么时候该干什么」）<\/li><\/ol>\n<p>→ 哔哩哔哩王者荣耀赛事 的 BP 段 + 晚风风的视野与节奏。 打野视角讲的是资源与到达，中路/游走可以直接迁移。<\/p>\n<ol><li><strong>再补本分路<\/strong>（解决「我这一路怎么打」）<\/li><\/ol>\n<p>→ 益达兄弟（辅助出装判据）→ 老杨（中路目标置换）。<\/p>\n<ol><li><strong>对抗路单练<\/strong>（解决「最近在练的那条路」）<\/li><\/ol>\n<p>→ 赖神切片看对线与手感 → 夜昧看稳线逻辑。<\/p>\n<ol><li><strong>每个新学的点，立刻落成知识库格式<\/strong>：触发条件 → 判据 → 阈值 → 反例。<\/li><\/ol>\n<p>写不成这个格式，说明还没学到手，只是记住了。<\/p>\n<h2>七、复核机制<\/h2>\n<ul><li>每 2 周跑一次 <code>s0_creators.py --stage all<\/code>，看「S45 更新数」和「平均时长」。<\/li><li>更新数掉到 0 或均长掉到 3 分钟以下 → 降档（大概率转成切片/直播形态）。<\/li><li>赛季切换（11-25 切 S46）后，旧名单全部降为「待复核」，重跑一遍再定档。<\/li><\/ul>\n<hr>\n<p>_数据与脚本：<code>40_scripts/s0_creators.py<\/code>（筛选+评分）、<code>40_scripts/subs_browser.py<\/code>（字幕采集）、 <code>40_scripts/bili_api.py<\/code>（接口层）。原始结果：<code>10_sources/creators_scored.json<\/code>。_<\/p>"}, {"title": "版本变更台账", "file": "90_版本变更台账.md", "html": "<p><strong>版本真值只认官方公告，不认任何\"版本答案\"。<\/strong> 每条 K 条目都必须写\"适用版本\"，跨赛季自动进复核队列。<\/p>\n<h2>赛季区间表（2026）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>赛季<\/th><th>名称<\/th><th>开始<\/th><th>结束<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>S42<\/td><td>神佑建木<\/td><td>2026-01-08<\/td><td>2026-04-01<\/td><td>官网公告 tid=791692<\/td><\/tr><tr><td>S43<\/td><td>陌上相逢<\/td><td>2026-04-01<\/td><td>2026-06-24<\/td><td>官网赛季公告<\/td><\/tr><tr><td>S44<\/td><td>—<\/td><td>2026-06-25<\/td><td>2026-09-23<\/td><td>官网赛季公告<\/td><\/tr><tr><td><strong>S45<\/strong><\/td><td><strong>月照长安（当前）<\/strong><\/td><td><strong>2026-09-23<\/strong><\/td><td><strong>2026-11-25<\/strong><\/td><td>官网赛季公告<\/td><\/tr><tr><td>S46<\/td><td>—<\/td><td>2026-11-25<\/td><td>—<\/td><td>官方预告（11-25 0:00–5:00 停服更新）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>注意：S45 只有约 63 天，比常规 85–95 天短。<strong>任何按\"三个月一赛季\"推算的结论都要重新核对。<\/strong><\/p><\/blockquote>\n<h2>S45 版本特征（影响内容取舍）<\/h2>\n<ul><li><strong>中野辅版本<\/strong>：打野与辅助的联动权重高于边路单带。<\/li><li>周年庆期间（10/24 前后）活动内容多、<strong>平衡性调整少<\/strong>，教学素材偏旧。<\/li><li>新英雄：王维、蚩奼、大司命、空空儿、孙权、苍、影等；<strong>刀锋宝贝仍在体验服<\/strong>。<\/li><\/ul>\n<h2>已发生的平衡调整（截至 2026-10-31）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>日期<\/th><th>对象<\/th><th>改动<\/th><th>影响的知识点<\/th><\/tr><\/thead><tbody><tr><td>10-30（体验服）<\/td><td>镜<\/td><td>二技能 CD 9~7→10~8（全等级 +1s）；加速 50%→100(+20/Lv)；二技能伤害小幅上调；三技能充能 10→10~8<\/td><td>未入库（打野支线），暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>曜<\/td><td>三技能 CD 15~10→13.5~10<\/td><td>未入库，暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>刀锋宝贝<\/td><td>三技能追踪优化、强化普攻法球修复<\/td><td>未上线正式服，不采信为正式结论<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>体验服改动一律不作为正式服结论入库<\/strong>，只能进本表。<\/p>\n<h2>待办<\/h2>\n<ul><li>[ ] 抓到 S45 官方更新公告原文后，补全本表 9-23 至 10-31 的正式服调整<\/li><li>[ ] S46（11-25）上线后 7 天内，全库过一遍\"适用版本 = S45\"的条目<\/li><\/ul>"}], "meta": {"total": 96, "heroes": 9, "sub": "当前版本 S45 · 共 96 条 · 更新 2026-11-01"}}</script>
<script>
/* ══════════════════════════════════════════════════════════
   kog 站点交互 —— 英雄宫格 + 折叠卡
   数据来自 <script id="DATA" type="application/json">，构建时注入
   路由用 hash（要支持 file:// 直接打开，不能用 History API）：
     # / 空        → 英雄宫格
     #H:苏烈       → 英雄页
     #doc:xx.md    → 长文档（信源名单 / 版本台账 / 导航）
     #cat:A        → 某一类的全部条目
     #K-B01        → 直达条目并展开
   ══════════════════════════════════════════════════════════ */
(function () {
  const D = JSON.parse(document.getElementById('DATA').textContent);
  const view = document.getElementById('view');
  const qEl = document.getElementById('q');
  const root = document.documentElement;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 扁平分索引：搜索与直达用 ── */
  const IDX = [];
  D.heroes.forEach(h => {
    h.a.concat(h.b).forEach(e => IDX.push({ ...e, owner: h.name, kind: 'H:' + h.name }));
  });
  D.general.forEach(g => g.entries.forEach(e =>
    IDX.push({ ...e, owner: g.title, kind: 'doc:' + g.file })));
  (D.lanes || []).forEach(l => l.entries.forEach(e =>
    IDX.push({ ...e, owner: l.name, kind: 'lane:' + l.file })));

  const heroOf = n => D.heroes.find(h => h.name === n);
  const laneOf = f => (D.lanes || []).find(l => l.file === f);
  const byId = id => IDX.find(e => e.id === id);

  /* ── 条目折叠卡 ── */
  function entryCard(e, open) {
    return `<details class="entry" id="${esc(e.id)}"${open ? ' open' : ''}>
      <summary>
        <span class="id">${esc(e.id)}</span>
        <span class="tt"><b>${esc(e.title)}</b>
          <span>${esc(e.sum || '')}</span></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="body">${e.html || ''}</div>
    </details>`;
  }

  /* ── 英雄卡 ── */
  function heroCard(h) {
    const pills = [];
    if (h.a.length) pills.push(`<span class="pill a">怎么玩 ${h.a.length}</span>`);
    if (h.b.length) pills.push(`<span class="pill b">对位 ${h.b.length}</span>`);
    if (!pills.length) pills.push('<span class="pill g">待补</span>');
    return `<a class="hcard" href="#H:${encodeURIComponent(h.name)}">
      <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
      <span class="hname">${esc(h.name)}</span>
      <span class="hmeta">${pills.join('')}</span>
    </a>`;
  }

  /* ── 分路卡 ── */
  function laneCard(l) {
    return `<a class="lcard" href="#lane:${encodeURIComponent(l.file)}">
      <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
      <span class="hname">${esc(l.name)}</span>
      <span class="hmeta">
        <span class="pill l">${l.entries.length} 条</span>
        ${l.heroes.length ? `<span class="pill g">${l.heroes.length} 英雄</span>` : ''}
      </span>
      <span class="lmotto">${esc(l.motto || '')}</span>
    </a>`;
  }

  /* ── 首页 ── */
  function renderHome() {
    const heroes = D.heroes.map(heroCard).join('');
    const lanes = (D.lanes || []).map(laneCard).join('');
    const gen = D.general.filter(g => g.entries.length || g.intro).map(g => {
      const icon = g.key === 'D' ? '⌁' : g.key === 'C' ? '⇄' : '·';
      const n = g.entries.length;
      return `<a class="gcard" href="#doc:${encodeURIComponent(g.file)}">
        <span class="gicon">${icon}</span>
        <span class="gtxt"><b>${esc(g.title)}</b>
          <span>${esc(g.cat)} · ${n ? n + ' 条判断' : '阅读'}</span></span>
      </a>`;
    }).join('');

    const docs = D.overview.filter(o => o.file !== '00_导航.md').map(o =>
      `<a class="gcard" href="#doc:${encodeURIComponent(o.file)}">
        <span class="gicon">▤</span>
        <span class="gtxt"><b>${esc(o.title.replace(/（.*?）/, ''))}</b>
          <span>参考文档</span></span>
      </a>`).join('');

    view.innerHTML = `
      <div class="hero-head">
        <p class="eyebrow">${esc(D.version)} · 决策手册</p>
        <h1>点英雄，看怎么打</h1>
        <p class="lede">每一条结论都能回溯到具体视频与秒数。有判据才写，没把握就留空。</p>
      </div>

      <section class="sec">
        <div class="sec-h"><h2>按分路看</h2><span>同一时间点，五个位置要做的决定不一样</span></div>
        <div class="grid lanes">${lanes}</div>
      </section>

      <section class="sec">
        <div class="sec-h"><h2>英雄</h2><span>${D.heroes.length} 个 · 点开看全部</span></div>
        <div class="grid">${heroes}</div>
      </section>

      ${gen ? `<section class="sec">
        <div class="sec-h"><h2>不挑英雄的</h2><span>对线、节奏、BP</span></div>
        <div class="row">${gen}</div>
      </section>` : ''}

      ${docs ? `<section class="sec">
        <div class="sec-h"><h2>参考</h2></div>
        <div class="row">${docs}</div>
      </section>` : ''}
    `;
  }

  /* ── 英雄页 ── */
  function renderHero(name) {
    const h = heroOf(name);
    if (!h) return renderHome();

    const secA = h.a.length
      ? `<section class="sec"><div class="sec-h"><h2>怎么玩</h2>
           <span>${h.a.length} 条</span></div>
           ${h.a.map(e => entryCard(e, false)).join('')}</section>`
      : `<section class="sec"><div class="sec-h"><h2>怎么玩</h2></div>
           <p class="lede">还没有这个英雄的条目。</p></section>`;

    const secB = h.b.length
      ? `<section class="sec"><div class="sec-h"><h2>打谁 / 被谁克</h2>
           <span>${h.b.length} 条</span></div>
           ${h.b.map(e => entryCard(e, false)).join('')}</section>`
      : '';

    const inc = h.incoming.length
      ? `<section class="sec"><div class="sec-h"><h2>被这些英雄的条目点名</h2></div>
           <p class="lede">${h.incoming.map(n =>
             `<a href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`).join('、')}
           的克制条目里提到了他，点进去看具体打法。</p></section>`
      : '';

    view.innerHTML = `
      <a class="back" href="#">← 全部英雄</a>
      <div class="hhead">
        <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
        <div>
          <h1>${esc(h.name)}</h1>
          <div class="hmeta">
            <span class="pill g">${h.n} 条</span>
            ${h.b_n ? `<span class="pill b">对位 ${h.b_n}</span>` : ''}
            ${(h.lanes || []).map(k => {
              const l = (D.lanes || []).find(x => x.key === k);
              return l ? `<a class="pill l" href="#lane:${encodeURIComponent(l.file)}">${esc(l.name)}大局观</a>` : '';
            }).join('')}
          </div>
        </div>
      </div>
      ${secA}${secB}${inc}
    `;
  }

  /* ── 分路页 ── */
  function renderLane(file) {
    const l = laneOf(file);
    if (!l) return renderHome();

    const heroRow = l.heroes.length
      ? `<div class="grid">${l.heroes.map(n => heroCard(heroOf(n))).filter(Boolean).join('')}</div>`
      : `<p class="lede">这个分路还没有英雄卡。${l.key === 'adc' || l.key === 'jungle'
          ? '（这是已知缺口：没有以该位置为第一视角的素材。）' : ''}</p>`;

    const others = (D.lanes || []).filter(x => x.key !== l.key).map(x =>
      `<a class="klink" href="#lane:${encodeURIComponent(x.file)}">${esc(x.name)} · ${esc(x.motto || '')}</a>`).join('');

    const stages = (l.stages || []).length
      ? `<div class="row">${l.stages.map(s =>
          `<a class="gcard" href="#doc:${encodeURIComponent(s.file)}">
            <span class="gicon">⌁</span>
            <span class="gtxt"><b>${esc(s.title)}</b><span>对局内 · ${s.id} 节</span></span>
          </a>`).join('')}</div>`
      : `<p class="lede">这一路还没有对应的对局内环节。</p>`;

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hhead">
        <span class="avatar" style="--h:${l.hue}">${esc(l.icon)}</span>
        <div>
          <h1>${esc(l.name)}</h1>
          <div class="hmeta">
            <span class="pill l">${l.entries.length} 条判断</span>
            <span class="pill g">只看位置，不看英雄</span>
          </div>
        </div>
      </div>

      <section class="sec"><div class="sec-h"><h2>这一路的大局观</h2></div>
        <div class="doc">${l.intro || ''}</div></section>

      <section class="sec"><div class="sec-h"><h2>分条判断</h2>
        <span>${l.entries.length} 条</span></div>
        ${l.entries.map(e => entryCard(e, false)).join('')}</section>

      <section class="sec"><div class="sec-h"><h2>这个位置的英雄</h2></div>${heroRow}</section>

      <section class="sec"><div class="sec-h"><h2>对应的时间环节</h2></div>${stages}</section>

      <section class="sec"><div class="sec-h"><h2>交叉的分路</h2>
        <span>同一件事，两边判据要对得上</span></div>
        <div class="row">${others}</div></section>
    `;
  }

  /* ── 长文档页 ── */
  function renderDoc(file) {
    const o = D.overview.find(x => x.file === file);
    const g = D.general.find(x => x.file === file);
    if (o) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="doc">${o.html}</div>`;
      return;
    }
    if (g) {
      view.innerHTML = `<a class="back" href="#">← 返回</a>
        <div class="hero-head"><p class="eyebrow">${esc(g.cat)}</p>
          <h1>${esc(g.title)}</h1></div>
        <div class="doc">${g.intro || ''}</div>
        ${g.entries.map(e => entryCard(e, false)).join('')}`;
      return;
    }
    renderHome();
  }

  /* ── 分类页 ── */
  function renderCat(key) {
    const c = D.cats.find(x => x.key === key);
    if (!c) return renderHome();
    const list = IDX.filter(e => e.cat === key);
    view.innerHTML = `<a class="back" href="#">← 返回</a>
      <div class="hero-head"><p class="eyebrow">分类</p>
        <h1>${esc(c.name)}</h1><p class="lede">${esc(c.desc)}</p></div>
      ${list.length ? list.map(e => entryCard(e, false)).join('')
        : '<p class="empty">这一类还没有条目。</p>'}`;
  }

  /* ── 搜索 ── */
  function renderSearch(kw) {
    const k = kw.trim().toLowerCase();
    if (!k) return renderHome();
    const hs = D.heroes.filter(h => h.name.toLowerCase().includes(k));
    const es = IDX.filter(e =>
      (e.id + e.title + (e.sum || '') + (e.opp || '')).toLowerCase().includes(k));

    view.innerHTML = `
      <div class="hero-head"><p class="eyebrow">搜索</p>
        <h1>“${esc(kw.trim())}”</h1>
        <p class="lede">${es.length} 条结论${hs.length ? ` · ${hs.length} 个英雄` : ''}</p></div>
      ${hs.length ? `<section class="sec"><div class="sec-h"><h2>英雄</h2></div>
        <div class="grid">${hs.map(heroCard).join('')}</div></section>` : ''}
      ${es.length ? `<section class="sec"><div class="sec-h"><h2>结论</h2></div>
        ${es.map(e => entryCard(e, true)).join('')}</section>`
        : '<p class="empty">没有命中。换个词试试，比如英雄名或「对线」。</p>'}`;
  }

  /* ── 路由 ── */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    qEl.value = '';
    if (!h) return renderHome();
    if (h.startsWith('H:')) return renderHero(h.slice(2));
    if (h.startsWith('lane:')) return renderLane(h.slice(5));
    if (h.startsWith('doc:')) return renderDoc(h.slice(4));
    if (h.startsWith('cat:')) return renderCat(h.slice(4));
    const e = byId(h);
    if (e) {
      if (e.kind.startsWith('H:')) renderHero(e.kind.slice(2));
      else if (e.kind.startsWith('lane:')) renderLane(e.kind.slice(5));
      else renderDoc(e.kind.slice(4));
      requestAnimationFrame(() => {
        const el = document.getElementById(h);
        if (el) {
          el.open = true;
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.querySelector('summary').style.background = 'var(--bg3)';
          setTimeout(() => { el.querySelector('summary').style.background = ''; }, 1600);
        }
      });
      return;
    }
    renderHome();
  }

  /* ── 搜索交互 ── */
  let t = null;
  qEl.addEventListener('input', () => {
    clearTimeout(t);
    const v = qEl.value;
    t = setTimeout(() => {
      if (v.trim()) renderSearch(v);
      else if (!location.hash) renderHome();
    }, 140);
  });
  qEl.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { qEl.value = ''; route(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== qEl) {
      ev.preventDefault(); qEl.focus();
    }
  });

  /* ── 主题 ── */
  const saved = localStorage.getItem('kog-theme');
  if (saved) root.dataset.theme = saved;
  document.getElementById('theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    localStorage.setItem('kog-theme', next);
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
