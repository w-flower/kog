<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王者荣耀实战知识库 · S45</title>
<meta name="description" content="按英雄查的王者荣耀决策手册：怎么玩、打谁舒服、被谁克、这一刻该干什么。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<style>
/* ══════════════════════════════════════════════════════════
   kog 站点样式 —— 英雄宫格 + 折叠卡
   改配色只改 :root 变量；组件规则一般不用动
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232d; --line:#28313d; --line2:#333e4c;
  --fg:#e8eef5; --fg2:#98a5b3; --fg3:#6d7887;
  --accent:#f0b429; --accent2:#5aa2ff; --ok:#3fb950; --bad:#f85149;
  --r:16px; --r-s:11px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef1f5; --line:#e2e7ee; --line2:#cfd7e2;
  --fg:#161b22; --fg2:#5a6672; --fg3:#8b98a6;
  --accent:#b57d00; --accent2:#1266d6;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 24px -14px rgba(16,24,40,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:15.5px; line-height:1.85; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono); font-size:.88em; padding:.1em .38em; border-radius:5px;
  background:var(--bg3); border:1px solid var(--line);
}

/* ─────────── 顶栏 ─────────── */
.top{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:12px clamp(16px,4vw,32px); background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; color:var(--fg); flex:none}
.brand:hover{text-decoration:none}
.logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#12161c;
  background:linear-gradient(145deg,#ffd76a,#e8a01c);
}
.bt{display:flex;align-items:baseline;gap:7px;font-size:15px;letter-spacing:.2px}
.bt b{font-weight:700}
.bt i{font-style:normal;font-size:11.5px;color:var(--fg3);border:1px solid var(--line2);
  padding:1px 6px;border-radius:20px}
.search{
  flex:1; display:flex; align-items:center; gap:8px; max-width:520px;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:0 12px; height:42px; transition:border-color .15s;
}
.search:focus-within{border-color:var(--accent2)}
.search svg{width:15px;height:15px;fill:var(--fg3);flex:none}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:var(--fg);
  font:inherit;font-size:14.5px;
}
.icon-btn{
  flex:none;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--fg2);
}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round}

/* ─────────── 版心 ─────────── */
.wrap{max-width:1080px;margin:0 auto;padding:clamp(26px,4vw,46px) clamp(16px,4vw,32px)}

.hero-head{margin:0 0 26px}
.eyebrow{font-size:12.5px;color:var(--fg3);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(25px,4.2vw,34px);line-height:1.3;margin:0 0 10px;letter-spacing:-.4px}
.lede{color:var(--fg2);margin:0;max-width:56ch;font-size:15px;line-height:1.8}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h h2{font-size:16px;margin:0;letter-spacing:.3px}
.sec-h span{font-size:12.5px;color:var(--fg3)}

/* ─────────── 英雄宫格 ─────────── */
.grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
.hcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.hcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.avatar{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:20px;letter-spacing:0;
  color:hsl(var(--h) 85% 80%);
  background:
    radial-gradient(circle at 32% 26%, hsl(var(--h) 60% 34%), hsl(var(--h) 70% 15%));
  border:1px solid hsl(var(--h) 55% 42% / .55);
  box-shadow:inset 0 0 14px hsl(var(--h) 80% 40% / .28);
}
html[data-theme="light"] .avatar{
  color:hsl(var(--h) 72% 30%);
  background:radial-gradient(circle at 32% 26%, hsl(var(--h) 80% 92%), hsl(var(--h) 70% 82%));
  border-color:hsl(var(--h) 60% 70%);
  box-shadow:none;
}
.hname{font-weight:650;font-size:15.5px;line-height:1.3}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pill{
  font-size:11.5px;padding:1.5px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg3);color:var(--fg2);line-height:1.6;white-space:nowrap;
}
.pill.a{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.b{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.l{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.g{color:var(--fg3)}
.pill.w{color:#e0c98a;border-color:#544223;background:#241f12}
html[data-theme="light"] .pill.w{background:#fdf6e3;border-color:#e3d4a8;color:#8a6d1f}
.unlisted{
  display:inline-block;margin-left:3px;width:14px;height:14px;line-height:13px;
  text-align:center;font-size:10px;font-style:normal;font-weight:700;
  border-radius:50%;border:1px solid #544223;background:#241f12;color:#e0c98a;
  vertical-align:1px;
}
html[data-theme="light"] .unlisted{background:#fdf6e3;border-color:#e3d4a8;color:#8a6d1f}

/* 大局观定位：强势期 / 节奏职责 */
.hplan{display:flex;flex-wrap:wrap;gap:5px;margin-top:-2px}
.pill[class*="t-"]{font-size:10.5px;padding:1px 7px;border-radius:6px}
.pill[class*="j-"]{font-size:10.5px;padding:1px 7px;border-radius:6px}
.pill.t-early{color:#f3c98b;border-color:#5a4526;background:#241d10}
.pill.t-mid{color:#8fd9cf;border-color:#275149;background:#12211f}
.pill.t-late{color:#c5b0f0;border-color:#42325e;background:#1d1729}
.pill.t-even{color:#b6d1a8;border-color:#3d5233;background:#182015}
.pill.j-open{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.j-follow{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.j-hold{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.j-scout{color:#d7c489;border-color:#4d4326;background:#1f1b12}
.pill.j-split{color:#c9a9d8;border-color:#4b2f56;background:#1d1420}
html[data-theme="light"] .pill[class*="t-"],
html[data-theme="light"] .pill[class*="j-"]{background:#fff;border-color:var(--line);color:var(--fg2)}

/* 克制：英雄卡上的两枚计数 */
.pill.kw{color:#f0b9a9;border-color:#5a3328;background:#261a15}
.pill.kl{color:#a9cdeb;border-color:#28415a;background:#151d26}
html[data-theme="light"] .pill.kw{background:#fff3ee;border-color:#e5c2b4;color:#9c4a24}
html[data-theme="light"] .pill.kl{background:#eef5fb;border-color:#b9cfe3;color:#2b5c86}

/* 英雄页的克制速览 */
.oppbox{
  display:grid;gap:1px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--line);overflow:hidden;margin:12px 0 6px;
}
.opprow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;
  padding:11px 14px;background:var(--bg2)}
.oppk{
  font-size:11.5px;letter-spacing:.05em;padding:2px 0;font-weight:600;white-space:nowrap;
}
.oppk.win{color:#f0a9a0}
.oppk.lose{color:#9fc4f5}
html[data-theme="light"] .oppk.win{color:#a8412c}
html[data-theme="light"] .oppk.lose{color:#2b5c86}
.oppv{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.oppchip{
  font-size:12.5px;padding:2px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg3);color:var(--fg2);
  text-decoration:none;line-height:1.6;white-space:nowrap;
}
.oppchip:hover{background:var(--bg2);color:var(--fg);border-color:var(--fg3)}
.oppchip.win{border-color:#5a3328}
.oppchip.lose{border-color:#28415a}
html[data-theme="light"] .oppchip{background:#fff}
html[data-theme="light"] .oppchip:hover{background:#f4f6f9}
.dim{color:var(--fg3);font-style:normal;font-size:12.5px}

/* 对位总表 */
.mtx{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.mtx-row{
  display:grid;grid-template-columns:104px 1fr 1fr;gap:0;
  border-top:1px solid var(--line);
}
.mtx-row:first-child{border-top:0}
.mtx-row > *{padding:9px 12px;min-width:0}
.mtx-row > * + *{border-left:1px solid var(--line)}
.mtx-head{
  background:var(--bg3);font-size:11.5px;color:var(--fg3);
  letter-spacing:.03em;font-weight:600;
}
.mtx-head > *{padding-top:7px;padding-bottom:7px}
.mtx-h{
  font-weight:600;font-size:13.5px;color:var(--fg);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mtx-h:hover{color:var(--fg2);text-decoration:underline}
.mtx-cell{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.mtx-cell .oppchip{font-size:12px;padding:1px 7px;margin:0}
.mtx-lab{display:none}
@media (max-width:640px){
  .mtx-row{grid-template-columns:1fr;gap:0}
  .mtx-row > * + *{border-left:0;border-top:1px dashed var(--line)}
  .mtx-head{display:none}
  .mtx-h{font-size:14px;background:var(--bg3)}
  /* 手机上一栏一栏堆叠，必须标出这栏是哪个方向 */
  .mtx-lab{
    display:block;width:100%;font-size:10.5px;letter-spacing:.05em;
    color:var(--fg3);margin-bottom:2px;
  }
  .mtx-lab.win{color:#d98d7c}
  .mtx-lab.lose{color:#7ba6cf}
}

/* 英雄页顶部的大局观三栏 */
.planbox{
  display:grid;gap:1px;grid-template-columns:auto auto 1fr;
  margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--line);overflow:hidden;
}
.pb-cell{display:flex;flex-direction:column;gap:3px;padding:12px 16px;background:var(--bg2)}
.pb-cell.wide{min-width:0}
.pb-k{font-size:11px;color:var(--fg3);letter-spacing:.04em}
.pb-cell b{font-size:14.5px;font-weight:600;line-height:1.45}
/* 大局观三栏下面紧跟的第一个 section（同路对位）要留出呼吸 */
.planbox + .sec{margin-top:24px}
@media (max-width:640px){
  .planbox{grid-template-columns:1fr 1fr}
  .pb-cell.wide{grid-column:1 / -1}
}

/* ─────────── 分路卡 ─────────── */
.lcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.lcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.lmotto{font-size:12px;color:var(--fg3);line-height:1.5}
.klink{
  display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--fg2);font-size:13.5px;
}
.klink:hover{text-decoration:none;border-color:var(--line2);color:var(--fg)}
html[data-theme="light"] .pill.l{color:#2f5c96;border-color:#c5d7ee;background:#eef4fb}

/* ─────────── 通用卡（对局内 / BP / 文档） ─────────── */
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gcard{
  display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);color:var(--fg);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s;
}
.gcard:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--line2)}
.gicon{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  font-size:20px;background:var(--bg3);border:1px solid var(--line);
}
.gtxt{min-width:0}
.gtxt b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.gtxt span{display:block;font-size:12.5px;color:var(--fg3);line-height:1.55}

/* ─────────── 折叠卡（条目） ─────────── */
.entry{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden;
}
.entry+.entry{margin-top:10px}
.entry>summary{
  list-style:none;cursor:pointer;padding:15px 18px;display:grid;
  grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary:hover{background:var(--bg3)}
.entry .id{
  font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:3px;
  letter-spacing:.02em;white-space:nowrap;
}
.entry .tt{min-width:0}
.entry .tt b{display:block;font-size:15.5px;font-weight:650;line-height:1.5}
.entry .tt span{
  display:block;font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.7;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.entry .chev{
  width:20px;height:20px;flex:none;margin-top:3px;color:var(--fg3);
  transition:transform .18s ease;
}
.entry[open] .chev{transform:rotate(90deg)}
.entry .body{
  padding:2px 20px 18px 20px;border-top:1px solid var(--line);margin-top:2px;
  font-size:15px;color:var(--fg);max-width:74ch;
}
.entry .body p{margin:.85em 0}
.entry .body ul,.entry .body ol{padding-left:1.25em;margin:.8em 0}
.entry .body li{margin:.35em 0}
.entry .body blockquote{
  margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);
  background:var(--bg3);border-radius:0 10px 10px 0;color:var(--fg2);font-size:14.5px;
}
.entry .body h4{font-size:14px;margin:1.2em 0 .5em;color:var(--fg2);letter-spacing:.3px}
.entry .body table{
  width:100%;border-collapse:collapse;margin:1em 0;font-size:14px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.entry .body th,.entry .body td{
  border:1px solid var(--line);padding:8px 12px;text-align:left;
}
.entry .body th{background:var(--bg3);font-weight:600;color:var(--fg2)}
.kref{font-family:var(--mono);font-size:.9em;padding:0 .3em;border-radius:4px;
  background:var(--bg3);border:1px solid var(--line);color:var(--accent2)}
.opp{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--fg2);background:var(--bg3);margin-left:8px;
  vertical-align:2px}

/* ─────────── 英雄详情头 ─────────── */
.hhead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex-wrap:wrap}
.hhead .avatar{width:74px;height:74px;font-size:30px;border-radius:24px}
.hhead h1{margin:0;font-size:clamp(23px,4vw,30px)}
.hhead .hmeta{margin-top:6px}
.back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg3);
  margin-bottom:14px;
}
.back:hover{color:var(--fg2);text-decoration:none}

/* ─────────── 文档页（长文） ─────────── */
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.doc-nav a{
  font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);
}
.doc-nav a:hover,.doc-nav a.on{border-color:var(--accent2);color:var(--fg);text-decoration:none}
.doc h2{font-size:19px;margin:2em 0 .8em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:1.8em 0 .6em}
.doc p{margin:.9em 0;max-width:74ch}
.doc ul,.doc ol{padding-left:1.3em;max-width:74ch}
.doc li{margin:.4em 0}
.doc blockquote{
  margin:1.2em 0;padding:.8em 1.1em;border-left:3px solid var(--accent);
  background:var(--bg2);border-radius:0 12px 12px 0;color:var(--fg2);
}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc table{
  width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px;
  display:block;overflow-x:auto;
}
.doc th,.doc td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
.doc th{background:var(--bg3);font-weight:600;color:var(--fg2);white-space:nowrap}
.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 60%,var(--bg))}

/* ─────────── 搜索结果 ─────────── */
.res-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);
}
.res-item .id{font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:4px;flex:none}
.res-item b{font-weight:650}
.res-item span{display:block;font-size:13px;color:var(--fg2)}
.empty{color:var(--fg3);padding:40px 0;text-align:center}

/* ─────────── 页脚 ─────────── */
.foot{
  max-width:1080px;margin:60px auto 0;padding:22px clamp(16px,4vw,32px) 0;
  border-top:1px solid var(--line);color:var(--fg3);font-size:12.5px;
}

/* ══════════════════════════════════════════════════════════
   同路五档对位矩阵
   五档三重区分：颜色 + 文字（克/优/平/劣/被）+ 底纹
   三态再区分：实测实底 / 推演 45° 斜纹 + 虚线边 / 待补极淡棋盘格
   ══════════════════════════════════════════════════════════ */
.g0,.g1,.g2,.g3,.g4{--gc:#f0a9a0; --gb:#3a201c; --gt:#f3c4bb}
.g1{--gc:#e0c07a; --gb:#332a17; --gt:#eed9a8}
.g2{--gc:#8d9aa8; --gb:#232a32; --gt:#c2ccd6}
.g3{--gc:#93b6d6; --gb:#1a2632; --gt:#bdd2e6}
.g4{--gc:#8fa8e0; --gb:#1b2033; --gt:#c3cdec}
html[data-theme="light"] .g0{--gc:#a8412c; --gb:#fdeee9; --gt:#8a3623}
html[data-theme="light"] .g1{--gc:#9a7318; --gb:#fdf6e3; --gt:#7d5c10}
html[data-theme="light"] .g2{--gc:#5f6b78; --gb:#eef1f5; --gt:#4c5764}
html[data-theme="light"] .g3{--gc:#2b5c86; --gb:#eef5fb; --gt:#245074}
html[data-theme="light"] .g4{--gc:#3b4a9e; --gb:#eef0fc; --gt:#33418c}

.dgrade{
  display:inline-flex; align-items:center; gap:4px; flex:none;

<script type="application/json" id="DATA">{"version": "S45", "heroes": [{"name": "韩信", "hue": 26, "a": [{"id": "", "cat": "", "title": "1. 机制内核：他是\"买时间\"的英雄", "self": "<h3>1. 机制内核：他是\"买时间\"的英雄<\/h3>", "html": "<p>韩信不是靠伤害赢的，是靠<strong>位移次数<\/strong>赢的。他的全部收益来自同一个公式：<\/p>\n<pre><code>多一段位移 → 多一次野区穿梭 → 对面少一次发育 → 你多一次经济领先<\/code><\/pre>\n<p>所以韩信的核心 KPI 不是人头，是<strong>\"对面打野这一轮的野区，有几组是你的\"<\/strong>。这条贯穿整张卡。<\/p>", "sum": "韩信不是靠伤害赢的，是靠位移次数赢的。"}, {"id": "", "cat": "", "title": "2. 开局反野：慢一步就全废", "self": "<h3>2. 开局反野：慢一步就全废<\/h3>", "html": "<p>BV1jd4y1373j @ 00:00 讲得很具体：<\/p>\n<ul><li><strong>反蓝就直接一技能跳过去<\/strong>，不要走过去<\/li><li>关键在<strong>一技能 CD 的卡点<\/strong>：走到某个固定位置时，刚好能\"无影步\"卡过去<\/li><li><strong>走得慢的后果<\/strong>：被对面辅助或中单发现 → 对面提前反应 → 这一波从\"反野\"变成\"送头\"<\/li><li>对面打野如果在自家蓝开或红开，暂时不用管，先把蓝 Buff 拿下<\/li><\/ul>\n<p><strong>这条的可迁移点<\/strong>：反野不是\"我去了就行\"，是\"<strong>我在对面还没反应过来的那 3 秒内到那里<\/strong>\"。所有反野教程里最难复制的东西就是这个时间窗。<\/p>", "sum": "BV1jd4y1373j @ 00:00 讲得很具体："}, {"id": "", "cat": "", "title": "3. 打不过的类型：拉开距离，不正面", "self": "<h3>3. 打不过的类型：拉开距离，不正面<\/h3>", "html": "<p><strong>韩信打刘备前期一点优势都没有<\/strong>——伤害不如他高，抓人不如他强（BV1jd4y1373j @ 00:31）。<\/p>\n<p>处理方式不是\"小心点\"，是<strong>换半区<\/strong>：<\/p>\n<blockquote><p>他去下路，我就去上路。<strong>离他远一点<\/strong>，不要和他正面交战。（@ 00:49）<\/p><\/blockquote>\n<p>同类的还有兰陵王这类前期强势英雄。<strong>判据<\/strong>：一级/二级能不能打过。打不过就换图，别硬碰。<\/p>", "sum": "韩信打刘备前期一点优势都没有——伤害不如他高，抓人不如他强（BV1jd4y1373j @ 00:31）。"}, {"id": "", "cat": "", "title": "4. 压制链：一个蓝 Buff 能滚到什么程度", "self": "<h3>4. 压制链：一个蓝 Buff 能滚到什么程度<\/h3>", "html": "<p>这是本卡最值得学的一段（@ 01:07 起）：<\/p>\n<pre><code>反掉他的蓝 → 他没有蓝，必须回家/回城\n→ 对面辅助没法跟着他（打野没蓝，辅助跟也没用）\n→ 河蟹变成你的\n→ 你开龙，他去拉扯 → 龙开完，他的红 Buff 刚好刷新 → 直接把红也控下来\n→ 他整片野区都拿不到\n→ 10 分钟，一路高地<\/code><\/pre>\n<p>原话收尾：\"<strong>节奏从哪里来的？其实节奏就是从那一个蓝 Buff 开始的。<\/strong>\"（@ 07:12）<\/p>\n<p><strong>关键认知<\/strong>：反野的收益<strong>不只是那组野怪<\/strong>。真正的收益是\"<strong>对面打野的行动被限定了<\/strong>\"——他必须回家，他必须补发育，他的辅助跟不了，这些\"他不能做的事\"才是雪球的起点。<\/p>\n<p>甚至有一波 UP 自己承认\"红蓝 Buff 一个没打着\"（@ 02:12），但他的结论是：<\/p>\n<blockquote><p>\"虽然野区并没有空下来，反野并没有反到，<strong>但是你节奏把握住了<\/strong>。\"<\/p><\/blockquote>\n<p><strong>这句话把反野的价值说透了<\/strong>：反的是\"节奏权\"，不是\"野怪\"。<\/p>", "sum": "这是本卡最值得学的一段（@ 01:07 起）："}, {"id": "", "cat": "", "title": "5. 不要去线上抓人", "self": "<h3>5. 不要去线上抓人<\/h3>", "html": "<p>@ 03:04 的原话：<\/p>\n<blockquote><p>\"你不要没事就跑到线上去抓人。你抓到了有什么用啊？被我们后手带走之后，<strong>他的野区也没有了<\/strong>。\"<\/p><\/blockquote>\n<p>逻辑链：你去线上抓人 → 你自己的野区空着 → 对面反你的野 → 你抓到一个人头，丢了一片野区，净亏。<\/p>\n<p><strong>这条和韩信的机制直接相关<\/strong>：韩信的经济来自野区穿梭，一旦离开野区节奏，他就变成一个\"伤害不高、又不敢正面\"的普通英雄。<\/p>", "sum": "@ 03:04 的原话："}, {"id": "", "cat": "", "title": "6. 阿森的防守视野布局（打强势打野时）", "self": "<h3>6. 阿森的防守视野布局（打强势打野时）<\/h3>", "html": "<p>对面是 1.87 万战力的裴擒虎（BV1bWnv6KEPw @ 00:17），开局的布置是：<\/p>\n<ol><li>让队友<strong>上半图去开蓝区视野<\/strong><\/li><li><strong>自己带辅助去红背<\/strong><\/li><li>目的：<strong>他不管是偷上半图还是强入侵下半图，你都防得住<\/strong>（@ 00:34）<\/li><\/ol>\n<p><strong>这套布局的判据<\/strong>：对面打野比你强时，第一件事不是\"我要不要反他\"，而是\"<strong>他反我，我能不能看见<\/strong>\"。<\/p>", "sum": "对面是 1.87 万战力的裴擒虎（BV1bWnv6KEPw @ 00:17），开局的布置是："}, {"id": "", "cat": "", "title": "7. 反野时机的第二个判据：双方 Buff 的刷新是否同向", "self": "<h3>7. 反野时机的第二个判据：双方 Buff 的刷新是否同向<\/h3>", "html": "<p>@ 02:09 的推演很干货：<\/p>\n<blockquote><p>对面打野红开，我也是红开，双方反向刷。所以<strong>我的次开 Buff（蓝）和他的首开 Buff（红）是同时刷新的<\/strong>。<\/p><\/blockquote>\n<p>由此推出：<\/p>\n<ul><li><strong>我的蓝区和他的红区同时刷新<\/strong> → 有窗口去他的红区（@ 03:31）<\/li><li>进野区时<strong>不要交惩戒<\/strong>，带着惩戒去，<strong>先找人打，不摸 Buff 不拼惩戒<\/strong>——因为队友第一时间还没到位（@ 03:47）<\/li><\/ul>", "sum": "@ 02:09 的推演很干货："}, {"id": "", "cat": "", "title": "8. 一句话", "self": "<h3>8. 一句话<\/h3>", "html": "<p><strong>韩信赢的方式不是\"打赢对面\"，是\"让对面这一轮少拿两组野\"，然后把这两组野变成一路高地。<\/strong><\/p>", "sum": "韩信赢的方式不是\"打赢对面\"，是\"让对面这一轮少拿两组野\"，然后把这两组野变成一路高地。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/150.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏 trong>：BV1jd4y1373j @ 00:31、@ 00:49<\/li><li><strong>可信度<\/strong>：高（两个 UP 独立说到\"韩信的伤害没到、结果输了，但思路是对的\"这类对位感受）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：刘备（前期强势野核）克制层级：数值克 + 节奏克（两者同时成立，所以最难受）数值上：伤害没有他高节奏上：抓人没有他强我该怎么做：换半区，不是\"小心点\"。", "opp": "刘备"}, {"id": "K-B12", "cat": "B", "title": "被马超打：他专打「脱节的人」，所以你不脱节他就没法打", "self": "<h3><a class=\"kref\" href=\"#K-B12\">K-B12<\/a> 被马超打：他专打「脱节的人」，所以你不脱节他就没法打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：马超（打野）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong>——克的是\"韩信喜欢单走\"这个习惯，不是克韩信这个英雄<\/li><li><strong>为什么成立<\/strong>：马超的打架优势是<strong>找脱节的能力非常强<\/strong>。原话：\"我们只要看谁脱节就打谁，<strong>千万不要去打对面没脱节的人<\/strong>。对面没脱节，就意味着你是一打二或一打三。\"（BV1tPbk6rEVH @ 00:50、@ 01:03）<\/li><li><strong>我该怎么做<\/strong>：<\/li><li><strong>不单走<\/strong>：韩信吃野时离队友/塔近一点，脱节的窗口就没了<\/li><li><strong>他来找你时不要接<\/strong>：马超的强势是<strong>一对一<\/strong>，所以只要你不是一个人，他就不会来<\/li><li>反过来讲：<strong>韩信的一对一不占优，二对二更不占优<\/strong>（@ 01:16），所以你的赢法只有\"不给他一对一的机会\"<\/li><li><strong>反向反制（马超视角的软肋）<\/strong>：马超<strong>必须先占住视野<\/strong>才有优先动手权（@ 00:35）。所以韩信可以靠\"不让他看见\"来拖——但这是被动打法，等于放弃节奏<\/li><li><strong>推广<\/strong>：这条是本库少见的\"<strong>克制的是行为，不是英雄<\/strong>\"的案例。判断自己被不被克时，先问一句：他克的是我的数值，还是我的习惯？<\/li><li><strong>来源<\/strong>：BV1tPbk6rEVH @ 00:35、@ 00:50、@ 01:03、@ 01:16<\/li><li><strong>可信度<\/strong>：中高（单来源，但讲的是机制不是数值，稳定性好）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<p>&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;<\/p>\n<h2>官方口径（L0 · 未经实测）<\/h2>\n<blockquote><p>来源：官方英雄详情页 <code>herodetail/150.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（14）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>不知火舞<\/strong><\/td><td>中路<\/td><td>“刺客的 td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>张良<\/strong><\/td><td>中路／游走<\/td><td>“张良的硬控能控住韩信将其击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>米莱狄<\/strong><\/td><td>中路<\/td><td>“米莱狄优秀的推进能力比韩信更加容易推到防御塔迫使其无法分带”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>虞姬<\/strong><\/td><td>发育路<\/td><td>“韩信：韩信是个高机动性英雄，但是面对高爆发加技能指向性加免疫物理伤害的虞姬，被天然克制。…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>达摩<\/strong><\/td><td>对抗路<\/td><td>“韩信：尽管韩信有多段位移技能，但是达摩大招的眩晕可以很完美的克制这一点，加上眩晕后的二段…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>项羽<\/strong><\/td><td>对抗路／游走<\/td><td>“韩信进场后，项羽可选择将其推开或控制限制其输出”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>黄忠<\/strong><\/td><td>发育路<\/td><td>“韩信：韩信如果前期不能带起节奏尽快推掉水晶，后期的核心玩法就是带线偷塔，而黄忠是一个可以…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：赵云、墨子<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>\n<h2>实测条目<\/h2>", "sum": "&lt;!-- AUTO:official:start 由 40_scripts/s17_write_b.py 生成，手改会被覆盖 --&gt;", "opp": ""}, {"id": "K-B21", "cat": "B", "title": "对刘备：前期一点优势都没有，别硬碰", "self": "<h3><a class=\"kref\" href=\"#K-B21\">K-B21<\/a> 对刘备：前期一点优势都没有，别硬碰<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：刘备<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：记住这句话：<strong>韩信打刘备，前期没有任何优势<\/strong>，伤害就是没他高。所以前期不要跟他抢野、不要在他面前露头清线。你的赢法是绕开他，去打另外两路。<\/li><li><strong>反向反制<\/strong>：刘备的弱点是没有位移、追不上人。你在他视野外的地方发育，他一点办法都没有。<\/li><li><strong>来源<\/strong>：BV1jd4y1373j @ 00:38<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>韩信克谁（对慢速、无位移打野的压制）—— <strong>目前没有一条素材正面讲\"韩信克谁\"<\/strong>，暂不写<\/li><li>韩信对中路/发育路的抓人成功率（无素材）<\/li><\/ul>", "sum": "适用版本：S45针对对手：刘备克制层级：数值克我该怎么做：记住这句话：韩信打刘备，前期没有任何优势，伤害就是没他高。", "opp": "刘备"}], "lanes": ["jungle"], "tempo": "early", "job": "open", "motto": "反的是节奏权，不是野怪", "beats": ["不知火舞", "刘禅", "大乔", "安琪拉", "小乔", "庄周", "李白", "武则天", "王昭君", "甄姬", "钟馗", "阿古朵", "露娜", "高渐离"], "loses": ["亚瑟", "张良", "米莱狄", "虞姬", "达摩", "项羽", "黄忠"], "main_lane": "jungle", "type": "刺客", "unlisted": false, "n": 11, "b_n": 4, "vs": ["刘备"], "beats_n": 14, "loses_n": 7, "incoming": ["亚瑟", "张良", "米莱狄", "虞姬", "达摩", "项羽", "黄忠"], "loses_all": ["亚瑟", "张良", "米莱狄", "虞姬", "达摩", "项羽", "黄忠"], "lane_names": ["打野"]}, {"name": "雅典娜", "hue": 277, "a": [{"id": "", "cat": "", "title": "1. 机制内核：三个信息差", "self": "<h3>1. 机制内核：三个信息差<\/h3>", "html": "<p>雅典娜的强度全在这三条\"技能说明里没写清楚\"的地方：<\/p>\n<h3>1.1 一技能：1 秒护盾 + 免控，命中刷新二技能并击退<\/h3>\n<ul><li><strong>能吃掉的控<\/strong>：孙策大招、苏烈大招、钟馗钩子、老夫子大招（BV1ip4EzeEZC @ 00:14）<\/li><li><strong>生效范围比指示器远<\/strong>：二技能的<strong>大圆<\/strong>和英雄<strong>脚下的小圆<\/strong>相交就命中——<strong>相切不行<\/strong>（@ 00:32）<\/li><li>残血时<strong>优先放一技能<\/strong>（护盾能补血、能反杀，BV1Rkui6QExF @ 05:41）<\/li><\/ul>\n<h3>1.2 二技能：位移 + 强化普攻，戳到敌人身后，血量越低伤害越高<\/h3>\n<ul><li><strong>强普触发后，无论闪现还是位移都会跟过去<\/strong>（BV1ip4EzeEZC @ 01:14）<\/li><li><strong>二技能是无影步，不暴露视野<\/strong> → 可以用来卡视野、当踏板（@ 01:14）<\/li><\/ul>\n<h3>1.3 大招：受的攻击越多，炸得越快越疼<\/h3>\n<ul><li>开大期间受到的攻击会增加爆炸伤害、并<strong>减少所需时间<\/strong>，<strong>最高 5 层<\/strong>（BV1Rkui6QExF @ 00:45、BV1ip4EzeEZC @ 05:05）<\/li><li>所以大招要<strong>在敌人攻击频率高的时候开<\/strong>，才容易创造奇迹<\/li><\/ul>\n<p><strong>由此直接推出一个克制关系<\/strong>：雅典娜<strong>克制戈雅<\/strong>这类攻击频率高的英雄（BV1Rkui6QExF @ 00:45）——他打得越猛，你的大炸得越早越疼。这条已记入 <code>B_克制关系/<\/code> 待补。<\/p>", "sum": "雅典娜的强度全在这三条\"技能说明里没写清楚\"的地方："}, {"id": "", "cat": "", "title": "2. 操作设置（先调，再练）", "self": "<h3>2. 操作设置（先调，再练）<\/h3>", "html": "<p>BV1ip4EzeEZC @ 01:31：<\/p>\n<div class=\"tw\"><table><thead><tr><th>项<\/th><th>设置<\/th><\/tr><\/thead><tbody><tr><td><strong>补刀推塔键<\/strong><\/td><td><strong>一定要开<\/strong>（核心，见第 3 节）<\/td><\/tr><tr><td>自动普攻<\/td><td><strong>最好关掉<\/strong><\/td><\/tr><tr><td>攻击目标<\/td><td><strong>绝对血量最少<\/strong><\/td><\/tr><tr><td>追击距离<\/td><td><strong>标准<\/strong><\/td><\/tr><tr><td>精准普攻<\/td><td>2300 分以下可以关掉，能降低很多练习成本<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "BV1ip4EzeEZC @ 01:31："}, {"id": "", "cat": "", "title": "3. 核心连招：一切围绕\"推塔键\"和\"踏板\"", "self": "<h3>3. 核心连招：一切围绕\"推塔键\"和\"踏板\"<\/h3>", "html": "<h3>3.1 五个步骤（所有连招的母版）<\/h3>\n<p>BV1ip4EzeEZC @ 02:27 把它标准化了：<\/p>\n<pre><code>① 存枪 → ② 拉视野 → ③ 找目标 → ④ 选踏板 → ⑤ 等 CD\n→ 完成后点【推塔普攻】或【补刀键】→ 接二一 → 戳 → 二戳<\/code><\/pre>\n<p><strong>\"踏板\"是雅典娜独有的概念<\/strong>：野怪、小兵、防御塔都可以当踏板，用来刷新二技能、缩短距离、或让自己安全脱身。<\/p>\n<h3>3.2 三个常用变体<\/h3>\n<div class=\"tw\"><table><thead><tr><th>连招<\/th><th>做法<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td><strong>二戳一（撕咬）<\/strong><\/td><td>二技能戳 → 等一技能好 → 再戳，反复<\/td><td>对面有闪现/位移且<strong>没有踏板<\/strong>时，无限追击（@ 01:49）<\/td><\/tr><tr><td><strong>蹲草连招<\/strong><\/td><td>只点一二技能，出伤最快<\/td><td>反过来，<strong>不能点太快<\/strong>（@ 02:27）<\/td><\/tr><tr><td><strong>踏板连招<\/strong><\/td><td>存枪 → 用野怪当踏板 → 戳脆皮<\/td><td>脆皮常在小猪那回血，直接踏板戳过去（@ 02:10）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 防御塔技巧：戳进去，再戳回来<\/h3>\n<p>目标在防御塔左边时，可以做到<strong>完美撤离<\/strong>：<\/p>\n<pre><code>先点推塔键 → 二一戳 → 最后接补刀键<\/code><\/pre>\n<p>只要在防御塔范围内，<strong>二技能接戳都能戳得到<\/strong>，所以能\"用防御塔再戳回来\"（@ 03:11）。<strong>越塔时多用一技能和大招规避防御塔伤害<\/strong>（BV1DSPtz4EM9 @ 06:34）。<\/p>", "sum": "BV1ip4EzeEZC @ 02:27 把它标准化了："}, {"id": "", "cat": "", "title": "4. 刷野与发育：24 秒存枪，惩戒先放", "self": "<h3>4. 刷野与发育：24 秒存枪，惩戒先放<\/h3>", "html": "<ul><li><strong>24 秒存一枪<\/strong>，两枪双珠一起戳（BV1DSPtz4EM9 @ 00:14）<\/li><li><strong>惩戒一定要先放再接强普<\/strong>，这样额外百分比伤害会更高（@ 00:28）<\/li><li>刷野时<strong>留一枪赶路<\/strong>，能提高刷野速率和连贯性（BV1Rkui6QExF @ 01:50）<\/li><li><strong>锁后排兵再锁前排兵<\/strong>，抢线效率最大、补刀率高（@ 01:16）<\/li><\/ul>", "sum": "24 秒存一枪，两枪双珠一起戳（BV1DSPtz4EM9 @ 00:14）惩戒一定要先放再接强普，这样额外百分比伤害会更高（@ 00:28）刷野时留一枪赶路，能提高刷野速率和连贯性（BV1Rk…"}, {"id": "", "cat": "", "title": "5. 全局：错开时间，不正面碰", "self": "<h3>5. 全局：错开时间，不正面碰<\/h3>", "html": "<h3>5.1 三级过中，和对面打野错开野区刷新时间<\/h3>\n<p>BV1DSPtz4EM9 @ 00:28：<\/p>\n<blockquote><p>三级过中，和对面打野<strong>错开野区刷新时间<\/strong>，避免相同时间正面打架。利用时间差先手帮中过线，或者后手双边抓人。<\/p><\/blockquote>\n<p><strong>这是雅典娜的核心节奏观<\/strong>：她不是\"打得过才打\"，是\"<strong>永远在对面不在的时候吃他的资源<\/strong>\"。<\/p>\n<h3>5.2 优势时的滚雪球顺序<\/h3>\n<p>@ 04:09 给的顺序很清楚：<\/p>\n<pre><code>团战打赢 → 第一件事看哪边有线\n→ 有优势线就做推塔节奏 → 塔掉了挤出更多视野 → 有先手权 → 更好入侵野区 → 拉开经济差<\/code><\/pre>\n<h3>5.3 推塔不用推完<\/h3>\n<p>@ 03:10：<strong>推塔剩下一点血量可以让小兵磨掉<\/strong>，省下来的时间可以多刷一到两组野，跟对面拉开经济差。<\/p>\n<p>（<strong>注意<\/strong>：这条要看阵容。原话也说了\"建议没有优势的不要这么做，本来拿了经济没作用就要变成罪人\"。）<\/p>\n<h3>5.4 脚下的 Buff 会暴露你的野区<\/h3>\n<p>@ 03:24：<strong>对面可以根据你脚下的 Buff 判断你的野区<\/strong>。所以带线时要注意，必要时发信号让队友帮忙看红区。<\/p>\n<h3>5.5 三线不要同时漏<\/h3>\n<p>@ 07:18：要推进就得<strong>运三线<\/strong>。下路射手要<strong>等上路过完再去清线<\/strong>，<strong>千万不要三路线同时漏<\/strong>，否则容易被抓单。<\/p>", "sum": "BV1DSPtz4EM9 @ 00:28："}, {"id": "", "cat": "", "title": "6. 死后也在干活（这是雅典娜独一份）", "self": "<h3>6. 死后也在干活（这是雅典娜独一份）<\/h3>", "html": "<p>BV1DSPtz4EM9 @ 08:19 起：<\/p>\n<ul><li><strong>死后不要乱逛<\/strong>：要给队友视野、打最后一点伤害<\/li><li><strong>死后可以吃对面的血包<\/strong>（BV1Rkui6QExF @ 05:56）<\/li><li>靠被动给<strong>全程视野<\/strong>，可以卡死死对面射手的位置，甚至卡复活时间差<\/li><\/ul>", "sum": "BV1DSPtz4EM9 @ 08:19 起："}, {"id": "", "cat": "", "title": "7. 出装方向", "self": "<h3>7. 出装方向<\/h3>", "html": "<p>素材里只有方向，没有完整清单：<\/p>\n<ul><li><strong>刚入坑先出冰脉<\/strong>这类容错高的装备，熟悉英雄后再尝试纯输出（BV1Rkui6QExF @ 00:29）<\/li><li>后期纯输出装打脆皮，\"两枪一个\"（BV1DSPtz4EM9 @ 08:01）<\/li><\/ul>\n<p><strong>完整出装和铭文本次素材没有明确念出来，不编。<\/strong><\/p>", "sum": "素材里只有方向，没有完整清单："}, {"id": "", "cat": "", "title": "8. 版本实话（445 本人说的，值得先看）", "self": "<h3>8. 版本实话（445 本人说的，值得先看）<\/h3>", "html": "<p>BV1Rkui6QExF @ 00:00 是一段自嘲，但信息量很大：<\/p>\n<blockquote><p>雅典娜<strong>上限是低的<\/strong>，胜率是被<strong>献祭流<\/strong>带起来的，国榜分是不高的，<strong>强度是 T3<\/strong> 的，机制是落后的，是<strong>容易被打野对位<\/strong>的。<\/p><\/blockquote>\n<p><strong>读法<\/strong>：这段话是\"劝退\"式反讽（目的是防止国榜分被卷高），但它侧面确认了三件事：<\/p>\n<ol><li>雅典娜的<strong>上限不算高<\/strong>，靠的是节奏和信息差，不是硬实力<\/li><li>她的<strong>胜率数据被\"献祭流\"抬起来了<\/strong>，看数据时要区分打法<\/li><li>她<strong>怕被针对<\/strong>——打野对位是她的弱项<\/li><\/ol>\n<p><strong>这条与本库的规矩一致<\/strong>：强度判断必须挂来源和语气，不能直接当\"T3 别玩\"的结论用。<\/p>", "sum": "BV1Rkui6QExF @ 00:00 是一段自嘲，但信息量很大："}, {"id": "", "cat": "", "title": "9. 一句话", "self": "<h3>9. 一句话<\/h3>", "html": "<p><strong>雅典娜的每一个技巧都在做同一件事：把\"距离\"变成\"伤害\"——用踏板缩短距离，用推塔键延长距离，用护盾吃掉距离内的控制。<\/strong><\/p>", "sum": "雅典娜的每一个技巧都在做同一件事：把\"距离\"变成\"伤害\"——用踏板缩短距离，用推塔键延长距离，用护盾吃掉距离内的控制。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/183.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“兰陵王：雅典娜的一技能和三技能都可以提供护盾和免控，运用得当可以抵挡兰陵王二技能的二段伤…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>达摩<\/strong><\/td><td>对抗路<\/td><td>“达摩：雅典娜如果要打出完整的连招，需要冗长的操作，期间控制较少，并且大招是个固定不动的技…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>关羽<\/strong><\/td><td>对抗路<\/td><td>“关羽可以快速推开团战入场后的雅典娜”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>孙膑<\/strong><\/td><td>游走<\/td><td>“孙膑的大招沉默效果和控制很可能使得雅典娜进场后放不出技能，从而毫无作为”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：达摩、橘右京<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/183.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B19", "cat": "B", "title": "对吕布：能打，但拦不住他开大跑", "self": "<h3><a class=\"kref\" href=\"#K-B19\">K-B19<\/a> 对吕布：能打，但拦不住他开大跑<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：吕布<\/li><li><strong>克制层级<\/strong>：节奏克<\/li><li><strong>我该怎么做<\/strong>：对线期你是优势，问题是杀不掉。吕布一开大就能脱离，所以别把技能全交在追杀上——把他打退、拿线权、吃塔皮，比追人头划算。<\/li><li><strong>反向反制<\/strong>：吕布的大招落地能反打，你追进去反而可能被反杀。追到塔前就收。<\/li><li><strong>来源<\/strong>：BV15oxw6AEgV @ 00:02<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>雅典娜 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打雅典娜」「雅典娜怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：吕布克制层级：节奏克我该怎么做：对线期你是优势，问题是杀不掉。", "opp": "吕布"}], "lanes": ["jungle"], "tempo": "late", "job": "follow", "motto": "把距离变成伤害，两枪一个", "beats": ["兰陵王", "达摩"], "loses": ["关羽", "孙膑"], "main_lane": "jungle", "type": "战士", "unlisted": false, "n": 10, "b_n": 2, "vs": ["吕布"], "beats_n": 2, "loses_n": 2, "incoming": ["关羽", "孙膑"], "loses_all": ["关羽", "孙膑"], "lane_names": ["打野"]}, {"name": "刘备", "hue": 39, "a": [{"id": "", "cat": "", "title": "1. 机制内核：他要的不是人头，是\"经济差\"", "self": "<h3>1. 机制内核：他要的不是人头，是\"经济差\"<\/h3>", "html": "<p>刘备的操作难度不高，<strong>难度全在\"前期的打经济能力和意识\"<\/strong>（BV1mg4y1t7cn @ 03:10）。原因是他清野快、单体伤害高，但<strong>位移差、留人差<\/strong>——所以他没法像常规刺客那样靠抓人起节奏，只能靠<strong>刷得比你快<\/strong>，再用经济差去打必赢的团。<\/p>\n<p>由此得出刘备的第一条铁律：<\/p>\n<blockquote><p><strong>抓人必须建立在刷经济的路上，顺路抓。<\/strong> 喜欢抓人的打野绝对上不了高分段（BV12N411t7x5 @ 00:42）。太执着于抓人，会导致你没有足够经济掌控这局，这也是上不了王者的原因（@ 01:34）。<\/p><\/blockquote>", "sum": "刘备的操作难度不高，难度全在\"前期的打经济能力和意识\"（BV1mg4y1t7cn @ 03:10）。"}, {"id": "", "cat": "", "title": "2. 时间轴（打野通用，刘备尤其要背）", "self": "<h3>2. 时间轴（打野通用，刘备尤其要背）<\/h3>", "html": "<p>BV1fj411U7tr @ 02:01 直接把这张表念了出来：<\/p>\n<div class=\"tw\"><table><thead><tr><th>时间<\/th><th>事件<\/th><\/tr><\/thead><tbody><tr><td><strong>0:30<\/strong><\/td><td>河蟹（河道小资源）刷新<\/td><\/tr><tr><td><strong>1:30<\/strong><\/td><td>中路四级线交汇<\/td><\/tr><tr><td><strong>1:37<\/strong><\/td><td>对抗路四级线<\/td><\/tr><tr><td><strong>2:00<\/strong><\/td><td>首开野区再次刷新<\/td><\/tr><tr><td><strong>4:00<\/strong><\/td><td>小龙刷新<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>用法<\/strong>：所有节奏都围绕这张表打，\"打出属于自己的节奏\"（原话）。你自己算不出下一个资源点还有几秒，就别谈节奏。<\/p>", "sum": "BV1fj411U7tr @ 02:01 直接把这张表念了出来："}, {"id": "", "cat": "", "title": "3. 反野：先看辅助在哪，再决定反几组", "self": "<h3>3. 反野：先看辅助在哪，再决定反几组<\/h3>", "html": "<p>BV12N411t7x5 @ 02:08 给了一条很具体的阈值：<\/p>\n<ul><li>对面<strong>辅助（小明这类）没在下路漏视野<\/strong> → 只反<strong>两个小野<\/strong>，别贪<\/li><li>辅助位置明确、对面打野在另一侧 → 可以整片反<\/li><\/ul>\n<p><strong>为什么用\"辅助位置\"当判据<\/strong>：辅助是野区防守的第一双眼睛。他没漏 = 你不知道他在哪 = 你可能正踩在他的视野里。这条判据比\"看对面打野在哪\"更早、更保守。<\/p>", "sum": "BV12N411t7x5 @ 02:08 给了一条很具体的阈值："}, {"id": "", "cat": "", "title": "4. 拆塔 > 刷野：中塔一掉，对面野区就是你的", "self": "<h3>4. 拆塔 &gt; 刷野：中塔一掉，对面野区就是你的<\/h3>", "html": "<p>这是刘备最反直觉、也最值钱的一条：<\/p>\n<blockquote><p>\"你永远不知道<strong>一座中塔对（对面）打野的野区有多大影响<\/strong>\" —— 中塔一掉，对面野区就随便进（BV12N411t7x5 @ 03:41、@ 04:40）。<\/p><\/blockquote>\n<p>所以刘备的优先级不是\"刷完野再推塔\"，而是<strong>看到能拆的塔就放下手头任何事去拆<\/strong>（@ 03:41 原话：\"我可以放下手头任何的事情去拆塔\"）。<\/p>\n<p><strong>同一条逻辑的第二个推论<\/strong>：11 分半以后<strong>小野已经没用了<\/strong>，别再浪费时间清，<strong>把塔和兵线放在第一位<\/strong>（@ 06:40）。<\/p>", "sum": "这是刘备最反直觉、也最值钱的一条："}, {"id": "", "cat": "", "title": "5. 刘备的弊端：留不住人 → 只能打兵线运营", "self": "<h3>5. 刘备的弊端：留不住人 → 只能打兵线运营<\/h3>", "html": "<p><strong>这是选刘备前必须知道的<\/strong>（BV12N411t7x5 @ 05:58）：<\/p>\n<blockquote><p>刘备在这种情况下<strong>很难留住人<\/strong>，除非有队友帮你打个控制。<\/p><\/blockquote>\n<p>所以后期只有三条路可走：<\/p>\n<ol><li><strong>卡草 / 卡视野<\/strong>，等对面自己走进来<\/li><li><strong>兵线运营<\/strong>——带线创造拆塔机会<\/li><li><strong>等团已经打起来了，再打个出其不意<\/strong><\/li><\/ol>\n<p>到了 12 分钟，重点就变成\"兵线运营 + 尽可能让对方掉点\"（@ 06:40）。<\/p>", "sum": "这是选刘备前必须知道的（BV12N411t7x5 @ 05:58）："}, {"id": "", "cat": "", "title": "6. 出装与铭文（三套，按打法选）", "self": "<h3>6. 出装与铭文（三套，按打法选）<\/h3>", "html": "<p>来源：BV1d94y1i7Ct（三套出装铭文，注意这是 S32 时期的视频，<strong>装备名以游戏内为准，思路照用<\/strong>）<\/p>\n<div class=\"tw\"><table><thead><tr><th>套<\/th><th>顺序<\/th><th>适合谁<\/th><\/tr><\/thead><tbody><tr><td><strong>一（主流，容错高）<\/strong><\/td><td>血刀野刀 → 鞋子 → <strong>电刀<\/strong> → 荆棘护手 → <strong>冰脉<\/strong>（不出黑切）→ 大打野刀 → 末世 → 最后一件看阵容<\/td><td>节奏好、会打经济、想 12 分钟内结束的人<\/td><\/tr><tr><td><strong>二（跑图流）<\/strong><\/td><td>小野刀 → 疾步之靴 → 升级打野刀 → 电刀 → 黑切（<strong>先出陨星<\/strong>）→ 末世<\/td><td>偏向运营、跑图快、要卡视野蹲人<\/td><\/tr><tr><td><strong>三（黑切宗师流，老派）<\/strong><\/td><td>小野刀 → 鞋子 → 升级打野刀 → 电刀 → 陨星 → 黑切 → 末世 → 爆裂之甲 → 大打野刀<\/td><td>不喜欢电刀、习惯老手感的人<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关键细节<\/strong>：<\/p>\n<ul><li>不出黑切时<strong>先做冰脉<\/strong>，做冰脉前先补一个<strong>荆棘护手<\/strong>提高前期容错（前期掉点很伤）<\/li><li>大打野刀的目的是<strong>物理穿透<\/strong>，用来对付对面已经起来的坦度英雄<\/li><li>最后一件：两个以上法系 → 魔女/破魔刀；正常一个法系 → 爆裂之甲<\/li><li>换装节奏：<strong>14 分钟内用爆裂换复活/名刀，14 分钟后用鞋子换<\/strong><\/li><\/ul>\n<p><strong>铭文<\/strong>：<strong>4–5 个夺萃<\/strong>、5–6 个狩猎、10 个鹰眼、10 个异变（BV12N411t7x5 @ 06:19 也强调\"三夺萃吸血真的吸不上来，建议 4–5 个\"）。<\/p>", "sum": "来源：BV1d94y1i7Ct（三套出装铭文，注意这是 S32 时期的视频，装备名以游戏内为准，思路照用）"}, {"id": "", "cat": "", "title": "7. 选他之前先看阵容（BP 视角）", "self": "<h3>7. 选他之前先看阵容（BP 视角）<\/h3>", "html": "<p>BV1mg4y1t7cn 是一局 56 星的完整 BP 解析，其中三条判断可复用：<\/p>\n<ol><li><strong>对面是\"中后期打团体系\"（貂蝉 + 猪八戒这类高恢复高坦度 + 刘邦保 C）<\/strong> → 你只能打<strong>前 8 分钟<\/strong>，靠压制对面双 C 的发育拖慢成型，再打经济落差的团（@ 02:55、@ 03:10）。<\/li><li><strong>指望\"后期打团一波拿下\"基本不现实<\/strong>，除非对面双 C 不会玩——而你不能指望这个（@ 05:35）。<\/li><li><strong>有鬼谷子这类强开辅助时，一定要让他打先手<\/strong>，你随后跟上接 <code>双一<\/code> 或 <code>121<\/code>；别自己抢先去开（@ 08:05）。<\/li><\/ol>", "sum": "BV1mg4y1t7cn 是一局 56 星的完整 BP 解析，其中三条判断可复用："}, {"id": "", "cat": "", "title": "8. 一句话", "self": "<h3>8. 一句话<\/h3>", "html": "<p><strong>刘备不是\"抓人型打野\"，是\"用清野速度把经济差堆出来，然后用这个差去打不需要操作的团\"的英雄。<\/strong><\/p>", "sum": "刘备不是\"抓人型打野\"，是\"用清野速度把经济差堆出来，然后用这个差去打不需要操作的团\"的英雄。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/170.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（4）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>姬小满<\/strong><\/td><td>对抗路<\/td><td>“刘备的近战能力让小满较难发挥”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>宫本武藏<\/strong><\/td><td>打野<\/td><td>“宫本武藏：宫本武藏唯一的强控就是3技能落地击飞和开3技能后的1技能减速，双反对拼时，刘备…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>盘古<\/strong><\/td><td>对抗路／打野<\/td><td>“刘备大招能移除缴械效果，同时贴脸输出容易被高爆发迅速击杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>鲁班七号<\/strong><\/td><td>发育路<\/td><td>“鲁班七号：刘备的大招免控可以破掉鲁班唯一的保命技能，同时2技能的突然晕眩和1技能的追人爆…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>孙尚香<\/strong><\/td><td>发育路<\/td><td>“孙尚香的高射程优势能很好的风筝刘备”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>项羽<\/strong><\/td><td>对抗路／游走<\/td><td>“刘备在切入后排时可使用项羽将其推开作为保护”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：太乙真人、张良<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/170.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["jungle"], "tempo": "early", "job": "open", "motto": "抓人必须顺路，经济差才是他的伤害", "beats": ["姬小满", "宫本武藏", "盘古", "鲁班七号"], "loses": ["孙尚香", "项羽"], "main_lane": "jungle", "type": "战士", "unlisted": false, "n": 8, "b_n": 1, "vs": [], "beats_n": 4, "loses_n": 2, "incoming": ["孙尚香", "项羽"], "loses_all": ["孙尚香", "项羽"], "lane_names": ["打野"]}, {"name": "不知火舞", "hue": 331, "a": [{"id": "K-A11", "cat": "A", "title": "二技能是\"减魔抗\"，不是\"消耗\"", "self": "<h3><a class=\"kref\" href=\"#K-A11\">K-A11<\/a> 二技能是\"减魔抗\"，不是\"消耗\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何准备打伤害的瞬间<\/li><li><strong>判断依据<\/strong>：目标身上有没有被扇子标记（减魔抗 3 秒）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有标记 → 接一技能/大招，这时伤害才是满的<\/li><li>没标记 → <strong>先补扇子再谈输出<\/strong>，硬打等于把伤害打了个七折<\/li><li><strong>反例<\/strong>：「扇子是用来消耗血线的」——它同时是全套伤害的前置条件。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 00:05；@ 07:47<\/li><li><strong>可信度<\/strong>：高（机制数值与连招由多个视频一致给出）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：任何准备打伤害的瞬间判断依据：目标身上有没有被扇子标记（减魔抗 3 秒）决策分支：有标记 → 接一技能/大招，这时伤害才是满的没标记 → 先补扇子再谈输出，硬打等于把伤害打了个七折反…"}, {"id": "K-A12", "cat": "A", "title": "标准连招只有一条主线：扇子起手 → 一技能 → 接闪现", "self": "<h3><a class=\"kref\" href=\"#K-A12\">K-A12<\/a> 标准连招只有一条主线：扇子起手 → 一技能 → 接闪现<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要单杀落单目标，或一闪开团<\/li><li><strong>判断依据<\/strong>：目标离你的距离是否在\"一技能位移 + 闪现\"的覆盖内<\/li><li><strong>决策分支<\/strong>：<\/li><li>能一闪到 → 二技能 → 一技能 → <strong>在二技能释放过程中<\/strong>接闪现，打出\"一闪\"控制<\/li><li>到不了 → 不要硬上，先用强化普攻或兵线位移缩短距离<\/li><li><strong>反例<\/strong>：「连招要背熟」——火舞没有固定连招，扭扭蛇原话是\"火舞没有固定的连招，需要你自己灵活应变\"，主线之外全靠判断。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 07:47；BV1eg411z7u1 @ 08:20；BV1Fd4y1k7EY @ 01:57<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要单杀落单目标，或一闪开团判断依据：目标离你的距离是否在\"一技能位移 + 闪现\"的覆盖内决策分支：能一闪到 → 二技能 → 一技能 → 在二技能释放过程中接闪现，打出\"一闪\"控制到不…"}, {"id": "K-A13", "cat": "A", "title": "瞬秒连招：扇子 → 大招 → 强化普攻（减魔抗的窗口内把爆发打完）", "self": "<h3><a class=\"kref\" href=\"#K-A13\">K-A13<\/a> 瞬秒连招：扇子 → 大招 → 强化普攻（减魔抗的窗口内把爆发打完）<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：目标血量在你的爆发线内，且身上已有扇子标记<\/li><li><strong>判断依据<\/strong>：扇子命中后 3 秒内能不能接上大招<\/li><li><strong>决策分支<\/strong>：扇子出手 → <strong>在扇子飞行的过程中<\/strong>就按大招 → 减魔抗生效瞬间打出大招伤害 → 补强化普攻<\/li><li><strong>反例<\/strong>：「等扇子命中了再按大招」——等命中再按，窗口已经过去一半。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 09:29<\/li><li><strong>可信度<\/strong>：中高（单一来源，但步骤描述清晰可复现）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标血量在你的爆发线内，且身上已有扇子标记判断依据：扇子命中后 3 秒内能不能接上大招决策分支：扇子出手 → 在扇子飞行的过程中就按大招 → 减魔抗生效瞬间打出大招伤害 → 补强化普…"}, {"id": "K-A14", "cat": "A", "title": "一闪开团和大招开团是两个东西，别混", "self": "<h3><a class=\"kref\" href=\"#K-A14\">K-A14<\/a> 一闪开团和大招开团是两个东西，别混<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要开团时<\/li><li><strong>判断依据<\/strong>：己方是均势/逆风，还是己方有前排能跟<\/li><li><strong>决策分支<\/strong>：<\/li><li>势均力敌或逆风守高地 → <strong>一闪开团<\/strong>：进得去、控得住、还能退，打的是控制不是伤害<\/li><li>己方前排能先手接住 → <strong>大招开团<\/strong>：把人推回来交给队友<\/li><li><strong>反例<\/strong>：「有闪就一闪上去打伤害」——一闪的定位是控，用它当输出来源，等于把唯一的退路交了。<\/li><li><strong>来源<\/strong>：BV1v541187YZ @ 13:44、@ 14:02<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要开团时判断依据：己方是均势/逆风，还是己方有前排能跟决策分支：势均力敌或逆风守高地 → 一闪开团：进得去、控得住、还能退，打的是控制不是伤害己方前排能先手接住 → 大招开团：把人推…"}, {"id": "K-A15", "cat": "A", "title": "能量低于一条线就别进场", "self": "<h3><a class=\"kref\" href=\"#K-A15\">K-A15<\/a> 能量低于一条线就别进场<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备靠自己冲进人堆<\/li><li><strong>判断依据<\/strong>：当前能量是否够放满三段（视频给的门槛是 150）<\/li><li><strong>决策分支<\/strong>：<\/li><li>够 → 直接进，靠命中回能滚起来<\/li><li>不够 → 先扇子消耗/清线回能，或等强化普攻叠好再进<\/li><li><strong>反例<\/strong>：「我看别人进去就秒了」——别人进之前能量是满的。<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:26；BV1Fd4y1k7EY @ 03:02<\/li><li><strong>可信度<\/strong>：中（150 这个数值只有一处口播，机制方向多源一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：准备靠自己冲进人堆判断依据：当前能量是否够放满三段（视频给的门槛是 150）决策分支：够 → 直接进，靠命中回能滚起来不够 → 先扇子消耗/清线回能，或等强化普攻叠好再进反例：「我看…"}, {"id": "K-A16", "cat": "A", "title": "大招反拉：把她的大招当\"拉进塔\"的工具", "self": "<h3><a class=\"kref\" href=\"#K-A16\">K-A16<\/a> 大招反拉：把她的大招当\"拉进塔\"的工具<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：目标在塔的射程边缘，且你敢吃一发塔伤<\/li><li><strong>判断依据<\/strong>：大招的拉回方向能否把目标拉进塔下<\/li><li><strong>决策分支<\/strong>：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害<\/li><li><strong>反例<\/strong>：「大招是团控，留着打团」——单杀阶段把人大招拉进塔，是最省技能的杀法。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 04:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标在塔的射程边缘，且你敢吃一发塔伤判断依据：大招的拉回方向能否把目标拉进塔下决策分支：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害反例：「大招是团控，留着打团」——单杀阶…"}, {"id": "K-A17", "cat": "A", "title": "用扇子探草：命中会回能", "self": "<h3><a class=\"kref\" href=\"#K-A17\">K-A17<\/a> 用扇子探草：命中会回能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：进草前、支援路上<\/li><li><strong>判断依据<\/strong>：扇子出手后能量有没有涨<\/li><li><strong>决策分支<\/strong>：能量涨了 → 草里有人，别进去；没涨 → 可以走<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:10<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A18\">K-A18<\/a> 对线期第一波线别靠前（对面是钩子类辅助时）<\/h3>\n<p>这条是<strong>中路对线期的通用纪律<\/strong>，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L06\">K-L06<\/a><\/code>。火舞的特殊点在于她<strong>清线慢<\/strong>（抢不动也躲不开），所以对她来说这条不是\"建议\"而是\"必须\"。<\/p>\n<h2>5. 出装与铭文<\/h2>\n<p><strong>结论：暂不写入具体铭文组合。<\/strong><\/p>\n<p>原因：标题带\"出装铭文\"的两期，一期是 2020 年（BV1v541187YZ），一期是 2024-06（BV12b421H7sY，S36）；2026 年那条（BV1Td9EBKE9S）字幕里只有一句\"还有不知火舞的出装铭文\"就结束了，<strong>具体条目没有被 ASR 转录出来<\/strong>。ASR 对铭文名（梦魇/心眼/狩猎）的识别错误率高，硬写等于编。<\/p>\n<p><strong>能确认的只有一条思路<\/strong>：出装要围绕\"减魔抗 + 爆发\"，因为她的伤害模型就是扇子标记后一套带走；对面出了魔女斗篷时，原话是\"他现在这套装备就是秒他，但是他出了魔女咱们秒不掉\"——遇到魔女要改路线，不要硬堆法强。<\/p>\n<ul><li>来源：BV1v541187YZ @ 12:19（魔女斗篷的应对）<\/li><li>待补：S45 具体六件套顺序、铭文红蓝绿配置，需要一条 2026-09 之后、标题明确标\"出装铭文\"且<strong>有字幕<\/strong>的视频，或官网英雄页/助手数据核对。<\/li><\/ul>\n<h2>6. 最容易崩的三个地方<\/h2>\n<ol><li><strong>能量不够硬进团<\/strong> → 进去放不出三段，等于送。<\/li><li><strong>不会取消后摇<\/strong> → 一模一样的操作，别人打完能翻滚走，你还在原地收招。<\/li><li><strong>把一闪当输出用<\/strong> → 交完闪现又没杀掉，接下来 90 秒你没有开团手段。<\/li><\/ol>\n<h2>7. 待补<\/h2>\n<ul><li>各技能精确数值（CD、能量消耗、大招拉回距离）未从素材获得。<\/li><li>强势期/弱势期：素材多为顺风或均势局，逆风下限没有样本。<\/li><li>与具体英雄的对位结论见 <code>B_克制关系/<\/code>（目前无火舞条目）。<\/li><\/ul>", "sum": "这条是中路对线期的通用纪律，已迁到 L_分路/01_中路.md 的 K-L06。"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/157.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>云缨<\/strong><\/td><td>打野<\/td><td>“不知火舞的高爆发和持续控制让云缨容易被快速击杀，无法打出连招”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>关羽<\/strong><\/td><td>对抗路<\/td><td>“关羽：关羽比较依赖被动的冲锋，不知火舞的每个技能包括被动都能打断其冲锋状态，失去被动冲锋…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>高渐离<\/strong><\/td><td>中路<\/td><td>“高渐离：不知火舞与高渐离对线，前期可以用扇子无限消耗手短的高渐离。即使4级之后高渐离有一…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（3）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>花木兰<\/strong><\/td><td>对抗路<\/td><td>“花木兰的超高爆发输出能力能快速击杀走位不慎的不知火舞”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>莱西奥<\/strong><\/td><td>发育路<\/td><td>“导弹可以锁定灵活的英雄”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>韩信<\/strong><\/td><td>打野<\/td><td>“刺客的爆发输出很容易击杀不知火舞”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：达摩、虞姬<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/157.shtml，2026-11-01 抓取。", "opp": ""}], "lanes": ["mid"], "tempo": "mid", "job": "open", "motto": "四段位移找后排，一套没打死就退", "beats": ["云缨", "关羽", "高渐离"], "loses": ["花木兰", "莱西奥", "韩信"], "main_lane": "mid", "type": "刺客", "unlisted": false, "n": 7, "b_n": 1, "vs": [], "beats_n": 3, "loses_n": 3, "incoming": ["花木兰", "莱西奥", "韩信"], "loses_all": ["花木兰", "莱西奥", "韩信"], "lane_names": ["中路"]}, {"name": "伽罗", "hue": 288, "a": [{"id": "", "cat": "", "title": "1. 机制内核：只有一个变量——射程", "self": "<h3>1. 机制内核：只有一个变量——射程<\/h3>", "html": "<p>伽罗的所有优势都来自\"我打得到你，你打不到我\"。这推出三条操作纪律：<\/p>\n<ol><li><strong>平A后撤<\/strong>：每 A 一下就后撤半步，用射程差把对面拉死（@ 01:32、@ 07:01）<\/li><li><strong>平A穿插普攻<\/strong>：不要连按同一下，A 一下走一步再 A（原话反复强调的核心）<\/li><li><strong>不站在兵堆里<\/strong>：站在兵线斜后方，让小兵当掩体<\/li><\/ol>", "sum": "伽罗的所有优势都来自\"我打得到你，你打不到我\"。"}, {"id": "", "cat": "", "title": "2. 对线：状态 > 线权 > 补刀", "self": "<h3>2. 对线：状态 &gt; 线权 &gt; 补刀<\/h3>", "html": "<ul><li><strong>开局 29 秒看辅助<\/strong>：辅助连体就学一技能上去点人；被放养就学二技能，对方吃几个你吃几个（@ 00:15）<\/li><li><strong>一打一看手长<\/strong>：孙权这类短手，前期刷野斩杀线低，抢不过伽罗（@ 00:27）<\/li><li><strong>抢红隼要算容错<\/strong>：抢不到就<strong>直接跑，别被压到半血以下<\/strong>（@ 00:40）<\/li><li><strong>闪现是保状态的<\/strong>：半血吃血包 + 恢复刚好回满，这条比一层兵值钱（@ 00:40、@ 00:53）<\/li><li><strong>兵线残血不要急着补<\/strong>：先隐藏视野，最后一下再上，最大程度少掉血（@ 01:45）<\/li><li><strong>第三波兵 = 打野第一次出野区<\/strong>（1 分 37 秒），这时看小地图判断敢不敢压（@ 01:06）<\/li><\/ul>", "sum": "开局 29 秒看辅助：辅助连体就学一技能上去点人；"}, {"id": "", "cat": "", "title": "3. 四分钟以后：主动去中路，别等被越塔", "self": "<h3>3. 四分钟以后：主动去中路，别等被越塔<\/h3>", "html": "<ul><li>4 分钟塔保护消失，<strong>与其在下路被越，不如主动转中<\/strong>（@ 03:11）<\/li><li><strong>转中清线站\"有线权那一路\"的草丛<\/strong>（@ 03:23）——没优势就躲塔下，别出去<\/li><li>5 分钟后<strong>围绕中塔发育<\/strong>；家里中单掉点就直接转中，上路的兵可以不吃了（@ 04:26、@ 04:38）<\/li><li><strong>用二技能探草<\/strong>：专门防\"留一个残血塔阴你\"的对手（@ 04:38、@ 04:51）<\/li><\/ul>", "sum": "4 分钟塔保护消失，与其在下路被越，不如主动转中（@ 03:11）转中清线站\"有线权那一路\"的草丛（@ 03:23）——没优势就躲塔下，别出去5 分钟后围绕中塔发育；"}, {"id": "", "cat": "", "title": "4. 资源接管的顺位（伽罗的经济密码）", "self": "<h3>4. 资源接管的顺位（伽罗的经济密码）<\/h3>", "html": "<blockquote><p>原话：\"打野死了你就刷他野区，中路死了你就接管他的兵线。\"<\/p><\/blockquote>\n<ol><li><strong>队友掉点 = 你的资源窗口<\/strong>：不是去救，是去接管（@ 06:08）<\/li><li><strong>手上一直在平A的射手，经济不会低<\/strong>（@ 06:21）<\/li><li><strong>8 分钟第二件破晓<\/strong>：这是伽罗的第一个质变点（@ 07:14）<\/li><li><strong>9 分钟开始必须抱团<\/strong>，因为 10 分钟要拿龙（@ 07:28）<\/li><\/ol>", "sum": "原话：\"打野死了你就刷他野区，中路死了你就接管他的兵线。"}, {"id": "", "cat": "", "title": "5. 后期：一句话就够", "self": "<h3>5. 后期：一句话就够<\/h3>", "html": "<blockquote><p>拿红 + 和对面打；对面不打，就去压他的塔。（@ 08:24）<\/p><\/blockquote>\n<ul><li>后期团战<strong>抽前排状态<\/strong>，不追脆皮<\/li><li><strong>把队友护在身前<\/strong>：伽罗冲第一个，谁也保不住你（@ 09:15）<\/li><\/ul>", "sum": "拿红 + 和对面打；"}, {"id": "", "cat": "", "title": "6. 弱点", "self": "<h3>6. 弱点<\/h3>", "html": "<ol><li><strong>没有任何位移和自保<\/strong>：被切就是死，全靠站位和队友<\/li><li><strong>前期极弱<\/strong>：被放养时要接受\"漏刀、掉塔\"是日常（@ 01:06）<\/li><li><strong>怕强开硬辅<\/strong>：钩子类、突进类辅助是她的天敌（素材里被钟馗钩了两次，@ 01:58、@ 07:57 是队友的钩子，反面说明钩子对射手的威胁）<\/li><\/ol>", "sum": "没有任何位移和自保：被切就是死，全靠站位和队友前期极弱：被放养时要接受\"漏刀、掉塔\"是日常（@ 01:06）怕强开硬辅：钩子类、突进类辅助是她的天敌（素材里被钟馗钩了两次，@ 01:58、@ …"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/508.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（10）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>云中君<\/strong><\/td><td>打野<\/td><td>“云中君遇见站位良好的伽罗时，一旦无法找到角度从侧身突袭，就会被擅长拉打的伽罗射爆”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>关羽<\/strong><\/td><td>对抗路<\/td><td>“中后期的伽罗几乎每次攻击都会暴击并将敌人减速，关羽很难在伽罗面前驰骋起来”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>司空震<\/strong><\/td><td>对抗路／打野<\/td><td>“伽罗的长射程会让司空震贴近之前就受到大量伤害，且可以轻易击破司空震的护盾。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>嫦娥<\/strong><\/td><td>对抗路／打野<\/td><td>“伽罗拥有超远的射程和强势减速能力，这让嫦娥入场十分困难，并且在进入战斗前就会把嫦娥的蓝量…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>张飞<\/strong><\/td><td>游走<\/td><td>“凭借巨额护盾称霸的张飞被伽罗的被动特性完美克制，会迅速的被伽罗将护盾击破”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>海月<\/strong><\/td><td>中路<\/td><td>“利用海月的禁锢为伽罗创造输出环境，且海月的幻境可以把威胁到伽罗的目标隔离。伽罗的减速效果…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>瑶<\/strong><\/td><td>游走<\/td><td>“伽罗频繁的暴击减速软控制，让瑶的解控能力无法被触动，在加上破盾和超远距离输出能力，让瑶附…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>艾琳<\/strong><\/td><td>发育路<\/td><td>“伽罗的长射程使艾琳在对线中无法应对，且艾琳的灵活性受到伽罗减速的克制。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>赵怀真<\/strong><\/td><td>对抗路／打野<\/td><td>“伽罗的超远射程可以安全的消耗赵怀真。”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>鲁班大师<\/strong><\/td><td>游走<\/td><td>“手短并且没有位移技能的鲁班大师，面对长手英雄会进退两难”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（6）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>兰陵王<\/strong><\/td><td>打野<\/td><td>“暗中前来的兰陵王让伽罗的视野能力失去意义，突出的爆发能力更会直接将伽罗秒杀”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>弈星<\/strong><\/td><td>中路<\/td><td>“弈星的大招对于缺乏位移的射手，命中率较高，关住后容易配合队友进行击杀”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>澜<\/strong><\/td><td>打野<\/td><td>“无位移英雄，很容易被澜突脸输出，难以逃脱。”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>白起<\/strong><\/td><td>对抗路<\/td><td>“伽罗：射程较近且没有位移技能，面对白起的3技能难以挣脱”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>镜<\/strong><\/td><td>打野<\/td><td>“镜快速的接近能力，让远程站桩射手很难反抗”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>阿轲<\/strong><\/td><td>打野<\/td><td>“同样更加灵活的阿轲也能轻松收割伽罗”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：蔡文姬、太乙真人<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/508.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B17", "cat": "B", "title": "对李信：绝对优势，他满血带瑶也打不过你", "self": "<h3><a class=\"kref\" href=\"#K-B17\">K-B17<\/a> 对李信：绝对优势，他满血带瑶也打不过你<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：李信<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：站远打就行，别让他近身。视频里的原话是“满血加瑶的李信都打不过我们伽罗”，靠的是伽罗被动叠起来的伤害。他开大冲你的时候往侧后方退，退到射程边缘继续输出。<\/li><li><strong>反向反制<\/strong>：李信唯一的机会是绕后或者在窄地形贴脸。所以团战别站在没有退路的位置。<\/li><li><strong>来源<\/strong>：BV1bw48zmEJj @ 10:29<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>伽罗 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打伽罗」「伽罗怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：李信克制层级：数值克我该怎么做：站远打就行，别让他近身。", "opp": "李信"}], "lanes": ["adc"], "tempo": "late", "job": "hold", "motto": "平A穿插普攻，把队友护至身前", "beats": ["云中君", "关羽", "司空震", "嫦娥", "张飞", "海月", "瑶", "艾琳", "赵怀真", "鲁班大师"], "loses": ["兰陵王", "弈星", "澜", "白起", "镜", "阿轲"], "main_lane": "adc", "type": "射手", "unlisted": false, "n": 7, "b_n": 2, "vs": ["李信"], "beats_n": 10, "loses_n": 6, "incoming": ["兰陵王", "弈星", "澜", "白起", "镜", "阿轲"], "loses_all": ["兰陵王", "弈星", "澜", "白起", "镜", "阿轲"], "lane_names": ["发育路"]}, {"name": "嫦娥", "hue": 39, "a": [{"id": "", "cat": "", "title": "1. 机制内核", "self": "<h3>1. 机制内核<\/h3>", "html": "<ol><li><strong>一技能用于预判封路<\/strong>：平 A 减速到之后接一技能，\"一定要预判去封路，而不是对着人丢\"（BV1bH4y1S7Fx @ 03:41~03:47）<\/li><li><strong>一技能可定身留人<\/strong>：一技能定身把贴脸的狂铁留下（BV1WHZuBGEDb @ 02:11~02:15）；精准一技能收下露娜人头（BV1WHZuBGEDb @ 02:30~02:33）<\/li><li><strong>二技能能摆位做假象<\/strong>：把二技能摆到红 Buff 上，给对面\"我在打红\"的假象，再一技能对着人丢完成击杀（BV1bH4y1S7Fx @ 04:00~04:06）<\/li><li><strong>大招是持续按键输出，且会被打断<\/strong>：贴脸时\"不断点大招展示手法\"收人（BV1WHZuBGEDb @ 03:35~03:40、03:04~03:12）；大招按住露娜时被火舞一闪打断（BV1WHZuBGEDb @ 02:25~02:28）<\/li><li><strong>清野 / 抢野时一技能可变小野并给自己加速<\/strong>：对面反野时用一技能处理小野、加速贴近（BV1bH4y1S7Fx @ 04:49~04:53）<\/li><li><strong>本体没有位移，靠移速装补机动<\/strong>：\"嫦娥它本身没有位移\"，巫术法杖和大打野刀都加移速，让抓人更快（BV1bH4y1S7Fx @ 07:19~07:27）<\/li><\/ol>", "sum": "一技能用于预判封路：平 A 减速到之后接一技能，\"一定要预判去封路，而不是对着人丢\"（BV1bH4y1S7Fx @ 03:41~03:47）一技能可定身留人：一技能定身把贴脸的狂铁留下（BV1…"}, {"id": "", "cat": "", "title": "2. 对线 / 打法", "self": "<h3>2. 对线 / 打法<\/h3>", "html": "<p><strong>中路（BV1WHZuBGEDb）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>开局丢线权<\/strong><\/td><td>20 秒到线上就被火舞抽一扇子、打残，丧失中路线权，直接等后线<\/td><td>BV1WHZuBGEDb @ 00:42~00:49<\/td><\/tr><tr><td><strong>兵线被连体压制<\/strong><\/td><td>对面中辅连体，只能清后线，然后往上路靠<\/td><td>BV1WHZuBGEDb @ 01:14~01:18<\/td><\/tr><tr><td><strong>防假视野<\/strong><\/td><td>火舞清完线可能假视野回来 E 闪；小地图看到她骚扰一下打野就往下路走了，就不用往下路靠，反方向换节奏<\/td><td>BV1WHZuBGEDb @ 00:55~01:10<\/td><\/tr><tr><td><strong>野区被挤<\/strong><\/td><td>对面四个人往蓝区挤时往后靠，防被火舞闪开；人太多就直接走，\"不要葫芦娃救爷爷\"<\/td><td>BV1WHZuBGEDb @ 02:39~02:52<\/td><\/tr><tr><td><strong>经济分配<\/strong><\/td><td>三个人吃中经济最大化；没事去帮打野提速，顺便蹭野怪经济<\/td><td>BV1WHZuBGEDb @ 01:52~01:58<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>打野（BV1bH4y1S7Fx）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>做法<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>开局守蓝<\/strong><\/td><td>450 块买一本书，利用野区保护机制，不急着出去，耐心等对面打野来蓝区、等他交技能，213 直接秒<\/td><td>BV1bH4y1S7Fx @ 01:37~01:53<\/td><\/tr><tr><td><strong>收完 Buff 不贪<\/strong><\/td><td>惩戒收掉后再刷两个小野即可；上路对线打不过、对面射辅可能支援、下路李信可能包过来<\/td><td>BV1bH4y1S7Fx @ 01:57~02:12<\/td><\/tr><tr><td><strong>控下一个蓝<\/strong><\/td><td>在下一个蓝刷新之前，提前去对面野区布局<\/td><td>BV1bH4y1S7Fx @ 02:43~02:55<\/td><\/tr><tr><td><strong>反野别先秒 Buff<\/strong><\/td><td>反野时不要盲目把技能全交到 Buff 上，否则打起团来没技能<\/td><td>BV1bH4y1S7Fx @ 06:09~06:18<\/td><\/tr><tr><td><strong>打团拉扯<\/strong><\/td><td>先打容易打状态的人，把他打残他就不敢在这拉扯，走了这片野区就是你的<\/td><td>BV1bH4y1S7Fx @ 06:20~06:33<\/td><\/tr><tr><td><strong>法师挂边<\/strong><\/td><td>法师去挂边或抓人时，打野去帮他补中路这波线，因为他赶回来来不及<\/td><td>BV1bH4y1S7Fx @ 00:56~01:04<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "中路（BV1WHZuBGEDb）"}, {"id": "", "cat": "", "title": "3. 连招", "self": "<h3>3. 连招<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>场景<\/th><th>连招<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td><strong>蹲蓝 / 反打秒人<\/strong><\/td><td>213<\/td><td>BV1bH4y1S7Fx @ 01:52~01:53<\/td><\/tr><tr><td><strong>收落单<\/strong><\/td><td>大招刮一下 → 平 A 补伤害<\/td><td>BV1bH4y1S7Fx @ 03:15~03:19<\/td><\/tr><tr><td><strong>先手留人<\/strong><\/td><td>平 A 减速 → 一技能预判封路<\/td><td>BV1bH4y1S7Fx @ 03:41~03:47<\/td><\/tr><tr><td><strong>做假象<\/strong><\/td><td>二技能摆红 Buff → 一技能对人丢<\/td><td>BV1bH4y1S7Fx @ 04:00~04:06<\/td><\/tr><tr><td><strong>团战起手<\/strong><\/td><td>一技能起手 → 二技能 → 大闪<\/td><td>BV1WHZuBGEDb @ 03:47~03:51<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>大招的用法偏向\"持续按\"<\/strong>：贴脸时不是一次性甩完，而是不断点大招输出（BV1WHZuBGEDb @ 03:35~03:40）<\/li><li>素材未讲连招的帧序与技能间隔，只给到以上组合。<\/li><\/ul>", "sum": "场景连招依据蹲蓝 / 反打秒人213BV1bH4y1S7Fx @ 01:52~01:53收落单大招刮一下 → 平 A 补伤害BV1bH4y1S7Fx @ 03:15~03:19先手留人平 A …"}, {"id": "", "cat": "", "title": "4. 中后期 / 节奏", "self": "<h3>4. 中后期 / 节奏<\/h3>", "html": "<ul><li><strong>前期到中期的转换点在野区压制<\/strong>：打野对位压制住了，\"三条兵线上都可以放心大胆的推兵线\"，因为对面打野根本抓不了人（BV1bH4y1S7Fx @ 02:31~02:38）<\/li><li><strong>推塔与野区连着走<\/strong>：下塔推完推中塔，推完中塔直接过来把红 Buff 一收，整片野区对面一个野怪都刷不到（BV1bH4y1S7Fx @ 06:36~06:46）<\/li><li><strong>打完龙先打人<\/strong>：龙打完蓝也刷了，就先去蓝区打人，这个时间点是可以秒的（BV1bH4y1S7Fx @ 06:02~06:08）<\/li><li><strong>团战抓时机<\/strong>：对面起推进节奏但有人在下路露头，就直接夹过去打人数差（BV1WHZuBGEDb @ 02:52~02:59）；技能全在 CD 时先拉扯，等火舞残血再不断点大招收人（BV1WHZuBGEDb @ 03:01~03:12）<\/li><li><strong>收尾阶段<\/strong>：9 分 50 秒一技能起手、二技能接大闪，把敖影和曹操打残，再在水晶艰难收下（BV1WHZuBGEDb @ 03:44~03:57）<\/li><li><strong>逆风处理素材未覆盖<\/strong>，两份素材都是优势局的滚雪球过程（BV1bH4y1S7Fx @ 07:46~07:50）<\/li><\/ul>", "sum": "前期到中期的转换点在野区压制：打野对位压制住了，\"三条兵线上都可以放心大胆的推兵线\"，因为对面打野根本抓不了人（BV1bH4y1S7Fx @ 02:31~02:38）推塔与野区连着走：下塔推完…"}, {"id": "", "cat": "", "title": "5. 出装铭文", "self": "<h3>5. 出装铭文<\/h3>", "html": "<p><strong>打野线（BV1bH4y1S7Fx）<\/strong><\/p>\n<ul><li>铭文：五狩猎、五贪婪、十心眼、十梦魇（BV1bH4y1S7Fx @ 06:52~06:58）<\/li><li>出门：小打野刀 → 蓝宝石 → 鞋子 → 小蓝宝石 → 二级打野刀（BV1bH4y1S7Fx @ 06:59~07:04）<\/li><li>鞋：控制多出抵抗鞋，控制少出法穿鞋（BV1bH4y1S7Fx @ 07:05~07:09）<\/li><li>然后时之预言、巫术法杖，增加移速和伤害（BV1bH4y1S7Fx @ 07:10~07:13）<\/li><li>之后补法穿，再把大打野刀做出来（转写作\"大的单剪刀\"）——因为大打野刀也加移速，配合巫术能让嫦娥跑得很快、更好抓人（BV1bH4y1S7Fx @ 07:13~07:27）<\/li><li>最后一件吸血书；如果对面火甲（转写作\"活甲\"）增强、或者制裁与梦魇做得很早，就不再做吸血书（BV1bH4y1S7Fx @ 07:27~07:35）<\/li><li>打野嫦娥不出梦魇，任何情况下都不出，让辅助、射手、法师去出；只有打中路才考虑（BV1bH4y1S7Fx @ 07:37~07:46）<\/li><\/ul>\n<p><strong>中路（BV1WHZuBGEDb）<\/strong><\/p>\n<ul><li>铭文：十狩猎、十心眼、十梦魇（BV1WHZuBGEDb @ 00:35~00:37）<\/li><li>两套出装的分工：第一套适合熟练度高的玩家，伤害高、容错率低；第二套容错率高，适合打对面控制多的阵容；对面回血多，第三件补梦魇（BV1WHZuBGEDb @ 00:22~00:33）<\/li><li>中路两套的逐件顺序未展开，见待补。<\/li><\/ul>", "sum": "打野线（BV1bH4y1S7Fx）"}], "b": [{"id": "", "cat": "", "title": "官方口径（L0 · 未经实测）", "self": "<h3>官方口径（L0 · 未经实测）<\/h3>", "html": "<blockquote><p>来源：官方英雄详情页 <code>herodetail/515.shtml<\/code>，2026-11-01 抓取。 <strong>这一层只是线索，不是结论。<\/strong> 官方每个方向固定只列 2 个例子，实测 117 个页面里双向能对上的只有 5 条（2%），说明它不是全量配对。 表格里「怎么打」一栏是空的就代表<strong>本库还没有实测素材<\/strong>，空白比编造有用。<\/p><\/blockquote>\n<p><strong>我压制的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>上官婉儿<\/strong><\/td><td>中路<\/td><td>“上官婉儿的大招移动路径比较容易预判，嫦娥的1技能即使再缓慢还是能够逼退”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><tr><td><strong>李白<\/strong><\/td><td>打野<\/td><td>“李白可以给予后排法师极大的压力，嫦娥虽然也是法师，但具有坦克的属性，不会被李白的刺杀轻易…”<\/td><td>_待补_<\/td><td>L0 官方·直说<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>压制我的（2）<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>对手<\/th><th>对手分路<\/th><th>官方给的说法（摘录）<\/th><th>我该怎么打<\/th><th>证据<\/th><\/tr><\/thead><tbody><tr><td><strong>伽罗<\/strong><\/td><td>发育路<\/td><td>“伽罗拥有超远的射程和强势减速能力，这让嫦娥入场十分困难，并且在进入战斗前就会把嫦娥的蓝量…”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><tr><td><strong>吕布<\/strong><\/td><td>对抗路<\/td><td>“吕布真实伤害可以越过嫦娥的护盾直接削减嫦娥的血量，非常克制依赖护盾减伤的嫦娥”<\/td><td>_待补_<\/td><td>L0 官方·反列<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>和谁好搭（参考资料，不是克制）<\/strong>：鬼谷子、白起<\/p>\n<p>&lt;!-- AUTO:official:end --&gt;<\/p>", "sum": "来源：官方英雄详情页 herodetail/515.shtml，2026-11-01 抓取。", "opp": ""}, {"id": "K-B24", "cat": "B", "title": "对宫本武藏：强势期比他早，滚起雪球就是压制", "self": "<h3><a class=\"kref\" href=\"#K-B24\">K-B24<\/a> 对宫本武藏：强势期比他早，滚起雪球就是压制<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：宫本武藏<\/li><li><strong>克制层级<\/strong>：节奏克<\/li><li><strong>我该怎么做<\/strong>：嫦娥的强势期比宫本来得早。开局就把线推过去，用线权换他的野区和视野，不要给他平稳发育到四级的空间。视频里 3 分 56 秒那一波就是典型的“滚起来之后直接压”。<\/li><li><strong>反向反制<\/strong>：宫本到四之后有反打能力，你的蓝量是硬约束。蓝空了就必须回，别硬撑。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 05:13<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：宫本武藏克制层级：节奏克我该怎么做：嫦娥的强势期比宫本来得早。", "opp": "宫本武藏"}, {"id": "K-B44", "cat": "B", "title": "对司空震：上路打不过，但打嫦娥是合理选择", "self": "<h3><a class=\"kref\" href=\"#K-B44\">K-B44<\/a> 对司空震：上路打不过，但打嫦娥是合理选择<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：司空震<\/li><li><strong>克制层级<\/strong>：数值克<\/li><li><strong>我该怎么做<\/strong>：这条是从对面视角反推的：对面明确说“上路司空震我们是打不过的，去中路打嫦娥合理”。意思是<strong>嫦娥是比司空震更好抓的目标<\/strong>。所以你要做的是：清完线立刻回塔，不要在没有视野的情况下单独推线。<\/li><li><strong>反向反制<\/strong>：嫦娥的蓝量决定她能不能跑。留一段蓝用来脱离，别把蓝全花在清线上。<\/li><li><strong>来源<\/strong>：BV1reAfevEdf @ 04:56<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>嫦娥 的 4 条官方边逐条填「我该怎么打」（现在全是空的）<\/li><li>找「打嫦娥」「嫦娥怎么打」类视频做实测（B 类专用采集，见 <code>s16_pick.py<\/code>）<\/li><\/ul>", "sum": "适用版本：S45针对对手：司空震克制层级：数值克我该怎么做：这条是从对面视角反推的：对面明确说“上路司空震我们是打不过的，去中路打嫦娥合理”。", "opp": "司空震"}], "lanes": ["mid", "jungle"], "tempo": "mid", "job": "follow", "motto": "嫦娥是一个完全不需要操作的英雄", "beats": ["上官婉儿", "李白"], "loses": ["伽罗", "吕布"], "main_lane": "mid", "type": "法师", "unlisted": false, "n": 7, "b_n": 3, "vs": ["司空震", "宫本武藏"], "beats_n": 2, "loses_n": 2, "incoming": ["伽罗", "吕布"], "loses_all": ["伽罗", "吕布"], "lane_names": ["中路", "打野"]}, {"name": "狄仁杰", "hue": 327, "a": [{"id": "", "cat": "", "title": "1. 机制内核：免控 + 吸血 = 能一直站着 A", "self": "<h3>1. 机制内核：免控 + 吸血 = 能一直站着 A<\/h3>", "html": "<p>狄仁杰的强度不是爆发，是<strong>\"打不死\"<\/strong>：<\/p>\n<ol><li><strong>二技能免控/净化解控<\/strong>（@ 10:04、@ 17:00 两次靠它活下来）→ 有这个才敢站在原地输出<\/li><li><strong>边 A 边回血<\/strong>：普攻 + 吸血直接构成续航（@ 07:30，56% 物理吸血配置）<\/li><li><strong>大招命中后伤害极其爆炸<\/strong>（@ 02:31）→ 大招是\"增伤开关\"，不是主要输出<\/li><li><strong>一二技能可以免掉哪吒两层火焰<\/strong>（@ 12:31）→ 这是具体到对位的用法<\/li><\/ol>", "sum": "狄仁杰的强度不是爆发，是\"打不死\"："}, {"id": "", "cat": "", "title": "2. 出装（这条视频的核心，属\"暴击吸血\"流派）", "self": "<h3>2. 出装（这条视频的核心，属\"暴击吸血\"流派）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>位置<\/th><th>装备<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>鞋<\/td><td><strong>隐忍之足<\/strong><\/td><td>提供抗性（@ 07:57）<\/td><\/tr><tr><td>1<\/td><td><strong>吸血刀<\/strong><\/td><td>续航第一优先（@ 10:40）<\/td><\/tr><tr><td>2<\/td><td><strong>末世<\/strong><\/td><td>打肉 + 吸血叠加（@ 08:11）<\/td><\/tr><tr><td>3<\/td><td><strong>破晓<\/strong>（第二件大件）<\/td><td><strong>破晓这版多了 5% 暴击率，所以能第二件出<\/strong>；哪天这 5% 被拿走就不能这么出了（@ 13:48、@ 14:07）<\/td><\/tr><tr><td>4<\/td><td><strong>逐日之弓<\/strong><\/td><td>射程 = 输出环境（@ 17:00）<\/td><\/tr><tr><td>5<\/td><td><st
