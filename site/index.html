umn", "ref": "36721385", "ts": null, "q": "高渐离（甄姬，海月，妲己）", "url": "https://www.bilibili.com/read/cv36721385"}]}, "高渐离|西施": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "523.json", "ts": null, "q": "需要走进战场中心的高渐离遇见以Poke见长的西施时，非常难以找到入场空间，他甚至会被控制", "url": "https://pvp.qq.com/web201605/herodetail/523.shtml"}]}}}}, "cats": [{"key": "A", "name": "英雄教学", "desc": "这个英雄怎么玩、什么时候强", "n": 31}, {"key": "B", "name": "克制关系", "desc": "打谁舒服、被谁克、为什么", "n": 42}, {"key": "C", "name": "BP", "desc": "选人阶段该怎么定", "n": 28}, {"key": "D", "name": "对局内", "desc": "现在这一刻该干什么", "n": 89}, {"key": "L", "name": "分路", "desc": "这个位置该按什么顺序想事", "n": 58}], "overview": [{"title": "导航：五类内容，五种问法", "file": "00_导航.md", "html": "<p>知识库按<strong>内容类型<\/strong>分五类。先判断你问的是哪一类，再去那一类找。<\/p>\n<div class=\"tw\"><table><thead><tr><th>类<\/th><th>你问的是<\/th><th>目录<\/th><th>编号<\/th><th>规模<\/th><\/tr><\/thead><tbody><tr><td><strong>A 英雄教学<\/strong><\/td><td>\"这个英雄怎么玩\"<\/td><td><code>A_英雄教学/<\/code><\/td><td><code>K-Axx<\/code><\/td><td>54 张卡<\/td><\/tr><tr><td><strong>B 克制关系<\/strong><\/td><td>\"打谁舒服、被谁克\"<\/td><td><code>B_克制关系/<\/code><\/td><td><code>K-Bxx<\/code><\/td><td><strong>129 张卡<\/strong>（全英雄池）/ 42 条实测<\/td><\/tr><tr><td><strong>C BP<\/strong><\/td><td>\"选人阶段该怎么定\"<\/td><td><code>C_BP/<\/code><\/td><td><code>K-Cxx<\/code><\/td><td>骨架，无实证<\/td><\/tr><tr><td><strong>D 对局内<\/strong><\/td><td>\"现在这一刻该干什么\"<\/td><td><code>D_对局内/<\/code><\/td><td><code>K-Dxx<\/code><\/td><td>04 对线期 ✅<\/td><\/tr><tr><td><strong>L 分路<\/strong><\/td><td>\"这个位置该按什么顺序想事\"<\/td><td><code>L_分路/<\/code><\/td><td><code>K-Lxx<\/code><\/td><td>5 条路<\/td><\/tr><\/tbody><\/table><\/div>\n<p>还有两份底表：<code>94_英雄名录.md<\/code>（官方 129 个英雄 + 分路 + 卡缺口）、<code>30_index/relations.json<\/code>（官方 463 条克制边）。<\/p>\n<h2>五类的边界（别混）<\/h2>\n<ul><li><strong>A 讲\"这个英雄\"<\/strong>：机制、连招顺序、强势期、废的时候。<strong>不涉及对面是谁<\/strong>。<\/li><li><strong>B 讲\"两个英雄之间\"<\/strong>：必须有具体对手。同一条结论换个对手就不成立，才叫克制。<\/li><li><strong>C 讲\"选人之前\"<\/strong>：只跟阵容和版本有关，不跟具体对局局势有关。<\/li><li><strong>D 讲\"选人之后\"<\/strong>：必须带时间点（0:45 / 4 分钟 / 10 分钟），不带时间点的不是 D 类。<\/li><li><strong>L 讲\"这个位置\"<\/strong>：同一时间点五个位置该做的决定不一样，跟具体英雄无关。<\/li><\/ul>\n<p><strong>判定口诀<\/strong>：结论里出现\"对面是谁\"→ B；出现\"第几分钟\"→ D；只是\"这英雄\"→ A；只是\"这版本/这阵容\"→ C；只是\"这个位置\"→ L。<\/p>\n<h2>B 类要分两层读（重要）<\/h2>\n<p>B 卡里有两块，<strong>证据强度差一个量级，别混着用<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>层<\/th><th>内容<\/th><th>可信度<\/th><th>怎么用<\/th><\/tr><\/thead><tbody><tr><td><strong>官方口径 L0<\/strong><\/td><td>谁压谁，每个方向 2~6 个例子<\/td><td>低。官方不给条件，双向对账率只有 2%<\/td><td>当线索，知道\"大概怕谁\"<\/td><\/tr><tr><td><strong>实测条目 K-Bxx<\/strong><\/td><td>带 BV+秒数、带条件、带具体动作<\/td><td>中～高<\/td><td>当结论，照着做<\/td><\/tr><\/tbody><\/table><\/div>\n<p>129 张卡都有官方层，但只有 35 个英雄有实测条目。<strong>官方层空白的\"我该怎么打\"就是没素材，不是漏写。<\/strong><\/p>\n<h2>两条跨类的用法<\/h2>\n<ol><li><strong>A 和 B 是配套的<\/strong>：A 告诉你这英雄靠什么强，B 告诉你这个\"靠什么\"在谁面前失效。只看 A 不看 B，会在被克的对局里越打越崩。<\/li><li><strong>C 的输出是 D 的输入<\/strong>：BP 定了你能干什么，D 才谈得上\"这一刻该不该动\"。<\/li><\/ol>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<p>经济差只是战斗力差的一种来源。信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。 来源：<code>BV1i2n96AEvp @ 02:31<\/code>。<\/p>\n<h2>读法<\/h2>\n<ol><li>先按上表定位到类，再看那类的 <code>_说明.md<\/code> 了解它回答什么；<\/li><li>只读命中的那一条，<strong>不要通读<\/strong>；<\/li><li>条目里的「反例」比「结论」值钱——那是别人踩过的坑。<\/li><\/ol>"}, {"title": "教学信源名单（S45 实测，2026-10-31）", "file": "95_信源名单.md", "html": "<blockquote><p>这不是「关注列表」，是<strong>取用列表<\/strong>。按问题去取，不要全订。 名单会随赛季变，每 2 周复核一次（看 S45 更新数与平均时长有没有掉）。<\/p><\/blockquote>\n<hr>\n<h2>一、先定判据：凭什么说一个 UP「值得信任」<\/h2>\n<p>信任不来自粉丝量、也不来自播放量。按下面五条打分，缺两条以上就不进名单。<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>怎么验<\/th><th>反例特征<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>给判据，不给结论<\/strong><\/td><td>句子结构里有没有「如果/只要/除非/当…时」<\/td><td>全程「视情况而定」「看你怎么玩」<\/td><\/tr><tr><td>2<\/td><td><strong>讲机制，不只讲操作<\/strong><\/td><td>有没有「因为…所以」「原因是」，能不能解释<strong>为什么<\/strong>这样打<\/td><td>「记住这个连招就行」<\/td><\/tr><tr><td>3<\/td><td><strong>给可执行的阈值<\/strong><\/td><td>有没有秒数、经济差、码数、身位、次数<\/td><td>「差不多」「差一点」<\/td><\/tr><tr><td>4<\/td><td><strong>版本对得上<\/strong><\/td><td>标题/内容里的赛季号是否为当前 S45；S44 及更早当作过期<\/td><td>「S43 上路必看」今天还挂首页<\/td><\/tr><tr><td>5<\/td><td><strong>自证 + 不夹带<\/strong><\/td><td>有没有段位/国服/职业教练身份；签名里有没有「包标/上星/复盘××元」<\/td><td>全靠嘴说「我是国服」，且每条视频都在卖课<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这五条怎么量化<\/strong>：本次实测是把候选人的视频字幕抓下来，统计 条件句密度、因果句密度、数字密度、机制术语浓度、空话密度（无脑/记住就行）， 用样本内百分位合成质量分。播放量只占 5% 权重。<\/p>\n<p><strong>实测发现（值得记住）<\/strong>：<\/p>\n<ul><li>B 站「王者荣耀教学」关键词下，<strong>结构化解说型账号极少<\/strong>，高播放大多是直播切片、<\/li><\/ul>\n<p>实录、对喷、或流水线卖课。<\/p>\n<ul><li>抓了 26 个候选、约 100 条视频字幕，只有 <strong>10 个<\/strong>满足「至少 2 条字幕是人在讲而不是<\/li><\/ul>\n<p>游戏音效」。很多号的字幕轨全是「技能正在冷却」「请求集合」——那是 ASR 把游戏音效 当成说话转录了。<\/p>\n<ul><li>所以：<strong>字幕干净本身就是个质量信号<\/strong>，说明有旁白、有解说意图。<\/li><\/ul>\n<hr>\n<h2>二、S 档：跟着学「判断依据」（讲得清、还在更）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>为什么进 S<\/th><th>要打折扣的地方<\/th><\/tr><\/thead><tbody><tr><td><strong>王者荣耀晚风风<\/strong><\/td><td>481626368<\/td><td>打野·全局<\/td><td>视野与节奏讲成可执行步骤：「利用视野开节奏的两个关键点」；老虎那期给到 3 分 15 秒刷新交汇、7 分钟两倍经济差。术语浓度全场最高<\/td><td>均长仅 5.8 分钟，信息密度高但要反复看；签名有「wx 上星/商务」，业务与内容分开看<\/td><\/tr><tr><td><strong>白菜打野教学<\/strong><\/td><td>67244546<\/td><td>打野·分段突破<\/td><td>因果句密度全场最高，明确讲「你卡在 1900–2100 是因为前 4 分钟」，直接对着一个分段改动作<\/td><td>营销话术重（封神/反复观看）；卖复盘 88/次，注意把「他的服务」和「他说的方法」分开<\/td><\/tr><tr><td><strong>阿泽干货博主<\/strong><\/td><td>322640745<\/td><td>全英雄·国服共创<\/td><td>请国一/2w1 分玩家共创，给的是节点型判据：4 分钟圣杯、10 分钟三件套、10 分钟分均 6800 经济<\/td><td>他也做英雄联盟内容（样本里混进过 369 兰博），<strong>只取王者分区<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>三、A 档：单点很硬，按需取（不追全部，只取自己那一路）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>取什么<\/th><\/tr><\/thead><tbody><tr><td><strong>益达兄弟辅助教学<\/strong><\/td><td>298590209<\/td><td>辅助<\/td><td>巅峰最高 2667、总榜第五。出装判据实用（极影 vs 近卫按对面强度与阵容选），九大神辅系列可当辅助入门骨架<\/td><\/tr><tr><td><strong>老杨国服嫦娥<\/strong><\/td><td>1866098100<\/td><td>中路·嫦娥<\/td><td>目标置换讲得清楚：「这波不追求杀人，追求打掉状态、拖刘备到四」——这正是中路该有的思路。吐槽类视频跳过<\/td><\/tr><tr><td><strong>奥特曼zz国一刘备凯<\/strong><\/td><td>18909338<\/td><td>打野·刘备<\/td><td>实战细节密度高（记对面闪现、卡视野蹲人）。签名有上分业务，只取内容<\/td><\/tr><tr><td><strong>夜昧<\/strong><\/td><td>49993700<\/td><td>对抗路<\/td><td>粉丝少但讲得实在：对抗路稳线优先、宁可打不过也别被带节奏；马超存枪的版本差异<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>A 档的共同限制：<strong>覆盖窄<\/strong>。他们只对自己那一路负责，别拿打野的节奏逻辑去套中路。<\/p><\/blockquote>\n<h2>四、B 档：直播切片与职业选手（学操作与节奏，不学结论）<\/h2>\n<p>你说了切片也看，那这里要分清<strong>看什么<\/strong>：<\/p>\n<blockquote><p>切片天然删掉前提，只留结果。所以切片能用来<strong>验证你已经有的判断<\/strong>， 不能用来<strong>建立判断<\/strong>。看的时候问自己「他为什么这时候上」，而不是记「他这时候上了」。<\/p><\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>类型<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td><strong>赖神无所畏惧<\/strong><\/td><td>395931838<\/td><td>大主播·对抗路（230w）<\/td><td>S45 内 21 条但均长 1.7 分钟，是切片形态。适合看对抗路的对线处理与手感，不适合学体系<\/td><\/tr><tr><td><strong>哔哩哔哩王者荣耀赛事<\/strong><\/td><td>392836434<\/td><td>官方赛事（691w）<\/td><td>S45 内 38 条、均长 55 分钟。<strong>这是 BP 与运营的唯一一手素材<\/strong>，也是我们知识库 C 类（BP）目前唯一的可靠来源<\/td><\/tr><tr><td>职业选手本人号（如 AG 超玩会老帅、LGD 教练阿泰）<\/td><td>549922787 / 492870807<\/td><td>职业/教练认证<\/td><td>账号存在且有认证，但按名字检索近期投稿命中为 0，需进空间页确认更新情况；确认后再补进名单<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>切片号的坑<\/strong>：同一选手常有好几个「XX剪辑呺」「XX精彩集锦」。实测其中一个剪辑号 的字幕轨全是歌词和英雄语音，一条讲解都没有——那种号只能当集锦看。 <strong>认准认证标识和署名，不要认名字相似。<\/strong><\/p>\n<h2>五、不进名单的（按行为特征判断，不针对具体人）<\/h2>\n<ol><li><strong>签名 = 卖课目录<\/strong>：「包标」「上星」「加入我们××教」「复盘 ×× 元」，<\/li><\/ol>\n<p>且视频平均时长 &lt; 3 分钟 → 内容被切成钩子，判断链是断的。<\/p>\n<ol><li><strong>纯剪辑号<\/strong>：无旁白、字幕只有歌词/游戏语音。<\/li><li><strong>版本漂移号<\/strong>：标题还挂着 S43/S44，或内容里说「这个版本」但无法对应到 S45。<\/li><li><strong>只讲出装不讲为什么<\/strong>：给一套铭文出装就结束，遇到阵容变化无法迁移。<\/li><\/ol>\n<hr>\n<h2>六、按你的情况排的取用顺序<\/h2>\n<p>你主中辅、在练对抗、目标荣耀。所以不要五个都订，按这个顺序取：<\/p>\n<ol><li><strong>先修判断公式<\/strong>（解决「什么时候该干什么」）<\/li><\/ol>\n<p>→ 哔哩哔哩王者荣耀赛事 的 BP 段 + 晚风风的视野与节奏。 打野视角讲的是资源与到达，中路/游走可以直接迁移。<\/p>\n<ol><li><strong>再补本分路<\/strong>（解决「我这一路怎么打」）<\/li><\/ol>\n<p>→ 益达兄弟（辅助出装判据）→ 老杨（中路目标置换）。<\/p>\n<ol><li><strong>对抗路单练<\/strong>（解决「最近在练的那条路」）<\/li><\/ol>\n<p>→ 赖神切片看对线与手感 → 夜昧看稳线逻辑。<\/p>\n<ol><li><strong>每个新学的点，立刻落成知识库格式<\/strong>：触发条件 → 判据 → 阈值 → 反例。<\/li><\/ol>\n<p>写不成这个格式，说明还没学到手，只是记住了。<\/p>\n<h2>七、复核机制<\/h2>\n<ul><li>每 2 周跑一次 <code>s0_creators.py --stage all<\/code>，看「S45 更新数」和「平均时长」。<\/li><li>更新数掉到 0 或均长掉到 3 分钟以下 → 降档（大概率转成切片/直播形态）。<\/li><li>赛季切换（11-25 切 S46）后，旧名单全部降为「待复核」，重跑一遍再定档。<\/li><\/ul>\n<hr>\n<h2>八、2026-11-01 增补：用户点名的信源<\/h2>\n<blockquote><p>这一节是<strong>用户直接指定<\/strong>的，优先级高于前面按打分排的档位 —— 因为这是他的实际观看习惯。 但\"可信\"仍然按第一节的五条判据查，指定 ≠ 免检。<\/p><\/blockquote>\n<h3>8.1 建议<strong>细看<\/strong>（用户原话：这几个博主都推荐细看）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>方向<\/th><th>怎么用<\/th><th>可信度核查状态<\/th><\/tr><\/thead><tbody><tr><td><strong>益达（益达兄弟辅助教学）<\/strong><\/td><td>298590209<\/td><td><strong>辅助<\/strong><\/td><td>原名单 A 档，本次<strong>升为细看级<\/strong>。巅峰最高 2667、总榜第五；出装判据（极影 vs 近卫按对面强度与阵容选）可直接用；九大神辅系列是辅助位的入门骨架<\/td><td>已入库，字幕质量实测可用<\/td><\/tr><tr><td><strong>欺压ya<\/strong><\/td><td>116084124<\/td><td>版本向·实况<\/td><td>20/20 搜索命中都是本人号，更新活跃。适合跟版本改动与新英雄手感<\/td><td><strong>账号已核实<\/strong>；内容类型偏实况/整活，讲判断链的比例待抽样<\/td><\/tr><tr><td><strong>浅梦-Dream<\/strong><\/td><td>*待核实*<\/td><td>*待核实*<\/td><td>用户点名细看，但 B 站搜索（\"浅梦\"\"浅梦Dream\"\"浅梦QM\"\"QM-Dream\"）<strong>均未命中同名 UP 主<\/strong>，只搜到\"阿然不会孤独\"上传的 <code>浅梦QM-Dream<\/code> 录播切片<\/td><td><strong>未核实<\/strong>。可能是抖音/快手主阵地，或 B 站昵称不同。<strong>下次需要用户给主页链接<\/strong>，不要照名字猜<\/td><\/tr><tr><td><strong>故氏<\/strong><\/td><td>1156623856（王者荣耀故氏）<\/td><td><strong>发育路（射手）<\/strong><\/td><td>⚠️ 用户明确说\"教学偏少，建议看粉丝做的讲解视频\"。确实如此：本人号多是片段，<strong>成体系的讲解在粉丝/二创号里<\/strong>（如\"全国一射手咕咕\"3546876804598212、\"小耀巅峰赛\"407063104、\"小现的录播机\"234380337）<\/td><td>账号已核实；<strong>取用方式要改<\/strong>：先看二创讲解建立框架，再回本人号看实操<\/td><\/tr><tr><td><strong>职业选手的职业比赛讲解<\/strong><\/td><td>见 8.3<\/td><td>BP / 运营<\/td><td>用户点名细看。这是 C 类（BP）与 D 类（运营）唯一的一手素材<\/td><td>见 8.3<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>8.2 「粉丝讲解」这条渠道的用法（因故氏而新增）<\/h3>\n<p>用户这句话点出了一个通用规律：<strong>高分段选手常常只出片段，讲解在别人的频道里。<\/strong><\/p>\n<p>所以取用顺序要反过来：<\/p>\n<pre><code>① 先用粉丝/二创的\"解析\"建立判断框架（他们为了讲清楚，会把逻辑补全）\n② 再看本人号的实操片段，验证框架（这一段他为什么这么做）\n③ 两者冲突时，以本人实操为准 —— 二创会加自己的理解<\/code><\/pre>\n<p><strong>风险<\/strong>：二创号为了流量会加\"必学\"\"无敌\"这类判断，且经常搞错选手意图。<strong>只取他们\"复述的原话\"，不取他们\"自己的评价\"。<\/strong><\/p>\n<h3>8.3 职业选手 / 赛事讲解（用户点名细看）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>mid<\/th><th>类型<\/th><th>取什么<\/th><\/tr><\/thead><tbody><tr><td><strong>哔哩哔哩王者荣耀赛事<\/strong><\/td><td>392836434<\/td><td>官方赛事（691w 粉）<\/td><td>已在本名单 B 档。<strong>BP 与运营的唯一一手素材<\/strong>：S45 内 38 条、均长 55 分钟<\/td><\/tr><tr><td>职业选手本人号<\/td><td>见下<\/td><td>选手第一视角<\/td><td>需要逐个核实更新情况；核实一个补一个<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>看职业比赛讲解的方法<\/strong>（这条比名单本身重要）：<\/p>\n<ol><li><strong>只看 BP 阶段 + 前 4 分钟<\/strong>：这是职业与路人差距最大的地方，也是最能迁移的部分<\/li><li><strong>不要学操作<\/strong>：职业的操作前提是五个人都在执行同一套体系，路人局没有<\/li><li><strong>要学的是\"他们放弃了什么\"<\/strong>：职业队放龙、放塔、放一路，背后是资源置换的判断，这个能直接用<\/li><\/ol>\n<h3>8.4 辅助篇文档里推荐的 UP（第三方转荐，未经本库验证）<\/h3>\n<p>《冲击巅峰千强·辅助篇》的 UP 在片尾明确声明<strong>与这些博主无合作、无引流<\/strong>，纯属推荐。原话要点：<\/p>\n<div class=\"tw\"><table><thead><tr><th>账号<\/th><th>方向<\/th><th>他的评价<\/th><\/tr><\/thead><tbody><tr><td><strong>气压<\/strong><\/td><td>逐帧教学<\/td><td><strong>UP 最推荐的一个<\/strong><\/td><\/tr><tr><td><strong>鞋头<\/strong><\/td><td>心态与竞技状态<\/td><td>讲\"怎么不打崩自己\"<\/td><\/tr><tr><td><strong>双叶来宝 C<\/strong><\/td><td>全局与片段实战对照<\/td><td>全局思路 + 对应片段<\/td><\/tr><tr><td><strong>大帅训练营<\/strong><\/td><td>高分操作库<\/td><td>操作素材库<\/td><\/tr><tr><td>某辅助教学博主<\/td><td>新手 → 小国标以下<\/td><td>进阶操作<\/td><\/tr><tr><td>张良绝活哥<\/td><td>张良专项<\/td><td>单英雄<\/td><\/tr><tr><td>装备解析<\/td><td>坦克与功能装<\/td><td>装备理解<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>注意<\/strong>：这是\"别人的推荐\"，本库<strong>没有验证过这些账号的内容质量<\/strong>，只作为待查线索记录。入库前要走第一节的五条判据。<\/p>\n<p><strong>UP 自评的能力权重<\/strong>（也记下来，因为它决定你该练什么）：<\/p>\n<blockquote><p>意识 50% / 操作 30% / 心态 20% td><td>讲机制<\/td><td>标题多为克制/阵容原理<\/td><td>疑似符合<\/td><\/tr><tr><td>3<\/td><td>给阈值<\/td><td>标题少见具体数值<\/td><td>待正文核实<\/td><\/tr><tr><td>4<\/td><td>版本<\/td><td>提及 S40/S43，非全 S45<\/td><td>部分过期，需标注<\/td><\/tr><tr><td>5<\/td><td>自证<\/td><td>暨南大学 UP，无卖课签名<\/td><td>暂无夹带信号<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关键阻塞（必须如实记）<\/strong>：18/18 视频<strong>无任何可用字幕<\/strong>。<\/p>\n<ul><li><code>x/player/v2<\/code>（旧接口）返回 8 条「字幕」，内容却是<strong>与视频无关的错配<\/strong>（iPhone 16 评测、蔡徐坤、LCK 解说）——B 站对无字幕视频返回的「幽灵字幕」。<\/li><li><code>x/player/wbi/v2<\/code>（新接口）实测 <code>subtitle.subtitles=[]<\/code> 且 <code>ai_subtitle<\/code> 不存在——<strong>既无 CC 也无 AI 字幕<\/strong>。<\/li><li><code>s32<\/code> 清洗闸门因此把英雄相关字幕全判 <code>offtopic<\/code>（正文不出现英雄名）。<\/li><li>结论：<strong>单靠现有字幕管线无法消化此 UP<\/strong>，与 2026-11-03 轮 <code>梦奇.md<\/code> 已记载的「5 个候选字幕全部错配」是同一根因。<\/li><\/ul>\n<p><strong>本轮已落地的（不编造的）交付<\/strong>：<\/p>\n<ol><li><code>creators_scored.json<\/code> 追加该 UP（18 条真实视频元数据，含 <code>src<\/code> 与 <code>note<\/code> 说明字幕不可用）。<\/li><li><code>20_kb/D_对局内/梦辰溪视频索引.md<\/code>——18 条真实视频按主题索引（英雄专项 / BP 克制理论），每条带 BV 链接，<strong>明确标注未转写<\/strong>。<\/li><li>4 张英雄卡（大乔 / 狄仁杰 / 海诺 / 梦奇）补「扩展素材（候选·外部）」节，链他的相关视频作候选，不写任何未证实的原文。<\/li><li>本第十一节。<\/li><\/ol>\n<p><strong>要到「真正消化」的唯一路径<\/strong>：对视频做<strong>音频转写<\/strong>（whisper 等本地 ASR），绕过 B 站字幕接口。代价是需装环境 + 算力和 HoK 术语校对，属于另开一条管线，未在本轮执行。用户确认要再做。<\/p>"}, {"title": "素材缺口台账（2026-11-01）", "file": "96_素材缺口.md", "html": "<blockquote><p>这张表回答一个问题：<strong>现在这个库里，哪些东西是\"有结论但没实证\"、哪些是\"根本没写\"。<\/strong> 用处是防止把 seed 卡当完整卡用，也防止下次重复去采已经确认采不到的东西。<\/p><\/blockquote>\n<h2>一、A 类：英雄教学（2026-11-03 起全 129 覆盖，分三档）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>档<\/th><th>数<\/th><th>判据<\/th><th>status<\/th><\/tr><\/thead><tbody><tr><td>正式卡<\/td><td>64<\/td><td>≥3 份有效字幕，逐条带 BV+秒数<\/td><td>active<\/td><\/tr><tr><td>单素材 draft<\/td><td>7<\/td><td>只有 1~2 份可用字幕，覆盖不全且卡内声明<\/td><td>draft<\/td><\/tr><tr><td>薄卡<\/td><td>58<\/td><td>无有效字幕，只有官方口径 + 候选视频链接<\/td><td>draft<\/td><\/tr><\/tbody><\/table><\/div>\n<p>体检工具 <code>s28_card_audit.py<\/code>（过薄/通用思路/无证据三类）；旧 53 张全过。<\/p>\n<p><strong>本轮最大的坑：字幕串源。<\/strong> B 站对没有 CC 字幕的视频，player/v2 仍返回 一个 subtitle_url，内容是乱配的（德州靶场/歌词/短剧/iPhone 评测）。 第一批 23 张新卡里 11 张引用了这种垃圾字幕，全部报废重写。 修复：<code>s32_scrub_subs.py<\/code> 按英雄名（含 ASR 同音词「源流之子」）做相关性 闸门，清洗 107 条；薄卡生成 <code>s31_thin_cards.py<\/code> 兜底，杜绝硬编。<\/p>\n<p>另一个坑：s8_harvest 匿名搜索跑到第 18 个英雄触发风控（code=0 但 data 只剩 v_voucher），56 个英雄零结果。修复：<code>s30_search_browser.py<\/code> 登录态浏览器页面内 fetch，浏览器指纹绕过。23 个英雄仍零结果（风控窗口）， 等冷却后重跑 <code>s30 --from-file zero_heroes.txt<\/code>。<\/p>\n<h2>二、A 类：53 个英雄的完成度<\/h2>\n<div class=\"tw\"><table><thead><tr><th>等级<\/th><th>数量<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>完整卡<\/td><td>18<\/td><td>不知火舞、小乔、大乔、女娲、夏洛特、盾山、苏烈、鲁班大师、韩信、铠、刘备、雅典娜、元歌、王维、公孙离、伽罗、敖隐（+ 4 张原有卡的补充章节）<\/td><\/tr><tr><td><strong>seed 卡<\/strong><\/td><td><strong>35<\/strong><\/td><td>只有《冲击巅峰千强·辅助篇》一条来源，只有\"实战动作\"，<strong>没有技能数值、没有出装铭文<\/strong>；狄仁杰也记 seed（出装来自单个 UP 的科研流）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>王维<\/strong>（2026-11-01 补）：机制部分取自 S45 官方前瞻与技能面板，<strong>不是视频素材<\/strong>；对线处理有 1 条 B 站素材（BV15EJk6fEwX，讲\"弱势法师全局思路\"，王维是样本）。卡内 <code>status: seed<\/code>，出装只给胜率统计口径，没有实测。<\/p><\/blockquote>\n<p><strong>seed 卡清单<\/strong>（辅助篇覆盖）：钟馗、张飞、牛魔、东皇太一、大禹、刘邦、太乙真人、孙膑、鬼谷子、桑启、瑶、蔡文姬、明世隐、少司缘、空空儿、杨玉环、朵莉亚、元辅、安奈特、张良、墨子、廉颇、项羽、刘禅、庄周、夏侯惇、赵怀真、金蝉、姜子牙、王昭君、孙策、达摩、武则天、海月、白起（部分与完整卡重叠时是补充章节）。<\/p>\n<h3>中路英雄为什么少<\/h3>\n<p>用户主玩中路，但<strong>中路的干净字幕极难采<\/strong>。本次实测：<\/p>\n<div class=\"tw\"><table><thead><tr><th>英雄<\/th><th>抓取情况<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>甄姬<\/td><td>抓 3 条，3 条全污染（惠普笔记本维修、空镜头剪辑教程）<\/td><td>需重采<\/td><\/tr><tr><td>上官婉儿<\/td><td>抓 5 条，4 条污染 + 1 条混入足球解说<\/td><td>需重采<\/td><\/tr><tr><td>干将莫邪<\/td><td>抓 4 条，3 条污染；仅 BV1TFp96pEbp 可用，但内容是\"发育路干将\"的杂谈<\/td><td>素材等级不足<\/td><\/tr><tr><td>貂蝉<\/td><td>搜索返回 0 条（疑似短时限流）<\/td><td>需重采<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>所以中路现在只有 4 张卡<\/strong>（不知火舞、小乔、女娲、王维）+ 1 张 seed（王昭君）。其中王维的机制来自官方公告，不是教学视频。<\/p>\n<h2>三、B 类：对位（两条完全不同的路）<\/h2>\n<p>这一类比原来复杂了，因为<strong>「克制关系」有两套坐标系，混着说必然对不上账<\/strong>。<\/p>\n<h3>3.1 跨路对位卡（129 张，官方口径 + 实测条目）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>层<\/th><th>覆盖<\/th><th>可信度<\/th><th>从哪来<\/th><\/tr><\/thead><tbody><tr><td>官方口径 L0<\/td><td>129 / 129 英雄、463 条方向边<\/td><td>低（只说谁克谁，无条件下）<\/td><td><code>s18_official.py<\/code><\/td><\/tr><tr><td>实测条目 K-B<\/td><td>35 英雄、42 条<\/td><td>中～高（带 BV + 秒数）<\/td><td>视频字幕，<code>s20_duel_entries.py<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>官方每边固定只列 2 个例子，117 页里能双向对上的只有 5 条（2%），只能当线索池。<\/p>\n<h3>3.2 同路对位矩阵（新，<code>#duel:mid<\/code>）<\/h3>\n<p><strong>为什么单开一套<\/strong>：用户问的是「不知火舞和哪个中路五五开」。跨路对位卡回答不了 这个问题——官方 463 条边里只有 106 条是同路（23%），中路只有 18 条。 坐标系不对，采再多也不解渴。<\/p>\n<p>所以改成「同一路 N 个英雄两两配对，一格一格填」，N=31（<code>lanes<\/code> 含 mid 的全部英雄）， 共 930 格。五档 × 三态，判据与数据结构见 <code>30_index/duel/_schema.md<\/code>。<\/p>\n<p><strong>2026-11-01 实采结果<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>项<\/th><th>数<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>实测格<\/td><td><strong>122（13.1%）<\/strong><\/td><td>61 个无序对，每对都能点开原文<\/td><\/tr><tr><td>推演格<\/td><td>32<\/td><td>官方 L0 只给方向的那些<\/td><\/tr><tr><td>待补<\/td><td>776<\/td><td>没查到，<strong>不等于均势<\/strong><\/td><\/tr><tr><td>用到的专栏<\/td><td>10 篇 / 78 篇<\/td><td>其余 68 篇是英雄攻略或赛事新闻，拆不出方向<\/td><\/tr><tr><td>五五开<\/td><td><strong>0<\/strong><\/td><td>见下<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>五五开为什么是 0<\/strong>：没有任何一个 UP 会专门做「谁跟谁五五开」。 它只以「不算克制」的形式出现，而这恰恰是现有素材里最难被说出口的一句话。 本地 467 份字幕里提到「五五开」的只有 6 份，且全是射辅 / 边路对位。 <strong>宁可不填，也不用「排除法」倒推均势。<\/strong><\/p>\n<p><strong>七个解析分支的真实产出<\/strong>（<code>s23_parse_columns.py<\/code>）：<\/p>\n<div class=\"tw\"><table><thead><tr><th>分支<\/th><th>形状<\/th><th>产出边<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>B1 箭头行<\/td><td><code>铠&lt;-蒙恬、吕布<\/code><\/td><td>17<\/td><td>开，方向靠箭头<\/td><\/tr><tr><td>B2 句内动词<\/td><td><code>X克制Y<\/code> / <code>X打不过Y<\/code><\/td><td>6<\/td><td>开<\/td><\/tr><tr><td>B4 括号列表<\/td><td><code>女娲（不知火舞）<\/code><\/td><td>16<\/td><td>开<\/td><\/tr><tr><td>B5 分节列表<\/td><td><code>金蝉：<\/code> + <code>全局克制关系<\/code>/<code>反向克制思路<\/code> 两段<\/td><td>28<\/td><td>开，<strong>单篇最高产（一篇 44 条）<\/strong><\/td><\/tr><tr><td>B3 小标题聚合<\/td><td><code>克星三：兰陵王<\/code> + 正文<\/td><td>12<\/td><td><strong>关<\/strong>。12 条里 4 条与 B1/B2 直接矛盾，还有一篇自己跟自己打架<\/td><\/tr><tr><td>视频字幕<\/td><td>—<\/td><td>20（待并）<\/td><td>下一步<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 采集中踩到的坑（别重复踩）<\/h3>\n<ul><li><strong>-352 不是限流，是文章本身抓不到<\/strong>。同一篇隔 30 秒重试 3 次仍 -352，换 URL / 换 Referer /<\/li><\/ul>\n<p>去掉 wbi 签名都无效。失败率约 65%，<code>s22<\/code> 里 <code>tries=3<\/code> 就够，再多只是白等。<\/p>\n<ul><li><strong>-509 才是限流<\/strong>，间隔拉到 14 秒后基本消失。<\/li><li><strong>专栏全文字段是 nodes 树<\/strong>，不是字符串：<code>data.opus.content.paragraphs[].text.nodes[].word.words<\/code>。<\/li><\/ul>\n<p>按字符串取会直接 <code>TypeError<\/code>。<\/p>\n<ul><li><strong>分节标题必须用全 129 英雄判断<\/strong>，不能用本路英雄池。一篇辅助文里 <code>孙膑：<\/code> 识别不出来，<\/li><\/ul>\n<p><code>cur<\/code> 就停在上一个英雄身上，后面整段全算错——实测一篇里冒出 24 条「大乔克制XX」。<\/p>\n<ul><li><strong>「被克」类模式的档位不能取反<\/strong>。早期给 <code>X被Y克制<\/code> 写 <code>grade=\"被克\"<\/code> 再统一取反，<\/li><\/ul>\n<p>结果「克制X的是Y」这种赢家在后的模式也被取反，方向全反。<\/p>\n<ul><li><strong>配合 ≠ 克制<\/strong>。「米莱狄还能与大乔配合打速推流」曾产出一条「米莱狄克制大乔」。<\/li><\/ul>\n<h2>四、C 类：BP（10 条）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>有<\/th><th>五查顺序、组合补缺、组合速查表<\/th><\/tr><\/thead><tbody><tr><td>缺<\/td><td><strong>版本 T 度名单<\/strong>（必须带日期）、<strong>职业 BP 的一二手顺序<\/strong>、对抗路/打野视角的组合<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>五、D 类：对局内（主线 10 节，现在 5 节）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>有<\/th><th>00 主线地图、02 开局前 90 秒、03 前四分钟、04 对线期、05 资源点与推进<\/th><\/tr><\/thead><tbody><tr><td><strong>缺<\/strong><\/td><td>01（编号空）、<strong>06 中期资源、07 团战、08 顺风推进、09 逆风止损、10 终结比赛<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>00_主线地图.md<\/code> 里的依赖图已经画到 10，但只有 5 节有内容。<\/p>\n<h2>六、L 类：分路（49 条）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>条数<\/th><th>素材强度<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>6<\/td><td>中<\/td><\/tr><tr><td>游走<\/td><td>15<\/td><td><strong>强<\/strong>（辅助篇文档补了 7 条）<\/td><\/tr><tr><td>发育路<\/td><td>10<\/td><td><strong>弱<\/strong>（只有 1 条射手第一视角，其余是辅助视角）<\/td><\/tr><tr><td>对抗路<\/td><td>10<\/td><td>强<\/td><\/tr><tr><td>打野<\/td><td>10<\/td><td>中（镜、澜、马超各一条）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>七、下次采集的直接指令<\/h2>\n<pre><code># 1. 补中路（换关键词，逐批试，命中就停）\n\"$PY\" s8_harvest.py --hero 甄姬 --hero 上官婉儿 --hero 貂蝉 --hero 干将莫邪\n\"$PY\" subs_browser.py --bvid BVxxx ...\n\"$PY\" s12_check.py --lane mid          # 体检，术语密度 &lt; 3/千字直接扔\n\n# 2. 做 B 类（需要新脚本：只采「对位X／打X／怎么打X」标题）\n#    s11_duel.py 还没写，采法见 B_克制关系/_说明.md\n\n# 3. 补 D 类 06–10（关键词：中期运营 / 团战站位 / 顺风推进 / 逆风止损 / 结束比赛）<\/code><\/pre>\n<h2>八、规矩没变<\/h2>\n<p><strong>没有来源就不写。<\/strong> 宁可留一张\"待补\"，也不要把\"我觉得\"写进去 —— 因为这张库最后是给打排位用的，写错一条会比空着更糟。<\/p>\n<hr>\n<h2>七、2026-11-01 第二轮采集：发育路 + 打野（宽扫法）<\/h2>\n<h3>采集方法变了<\/h3>\n<p>第一轮是\"按英雄找视频\"（<code>s8_harvest.py<\/code>），命中率低。这一轮改成<strong>先扫人、再取料<\/strong>：<\/p>\n<ol><li><code>s15_roster.py<\/code> — 32 个关键词 × 2 页宽扫，518 条视频 → 聚合出 100+ 个教学 UP（结果进 <code>95_信源名单.md<\/code> 第九节）<\/li><li><code>s16_pick.py<\/code> — 按分路（adc / jungle / mid / solo / roam）从池里挑，同一 UP 最多 3 条，优先长视频<\/li><li><code>subs_browser.py<\/code> — 浏览器上下文抓字幕<\/li><li>体检：术语密度 ≥ 4/千字 且 噪音 &lt; 5% 才算可用（比 <code>s12_check.py<\/code> 的 3/千字稍严，因为这一轮素材量大，宁可错杀）<\/li><\/ol>\n<h3>这一轮的真实命中率<\/h3>\n<div class=\"tw\"><table><thead><tr><th>批次<\/th><th>抓到的字幕<\/th><th>通过体检<\/th><th>通过率<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>发育路<\/td><td>42<\/td><td>16<\/td><td><strong>38%<\/strong><\/td><td>比第一轮估的 30% 略好<\/td><\/tr><tr><td>打野<\/td><td>11<\/td><td>3<\/td><td><strong>27%<\/strong><\/td><td>打野素材本身就少，污染也重<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>污染样本长什么样<\/strong>（这次真实遇到的）：<\/p>\n<ul><li>「鲁班七号教学」（坤神）→ 字幕是<strong>代驾去新疆<\/strong>的 vlog<\/li><li>浅梦-Dream「万字发育路教科书」→ 字幕是 <strong>iPhone 16 评测<\/strong><\/li><li>「马可镜转吕布全局精讲」→ 字幕是<strong>王者万象棋<\/strong>（棋类玩法，不是 MOBA）<\/li><\/ul>\n<p><strong>结论<\/strong>：搜索标题和字幕内容<strong>完全没有相关性保证<\/strong>。所以\"看到标题靠谱就往库里写\"一定会出事，体检这一步不能省。<\/p>\n<h3>这一轮的净产出<\/h3>\n<div class=\"tw\"><table><thead><tr><th>产出<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>发育路英雄卡<\/td><td>公孙离、伽罗、敖隐（完整卡）、狄仁杰（seed）<\/td><\/tr><tr><td>发育路分路层<\/td><td>新增 <code><a class=\"kref\" href=\"#K-L58\">K-L58<\/a><\/code>（呆射/游射/技能型三分法）、<code><a class=\"kref\" href=\"#K-L59\">K-L59<\/a><\/code>（队友掉点=资源窗口）<\/td><\/tr><tr><td>打野分路层<\/td><td>新增 <code><a class=\"kref\" href=\"#K-L61\">K-L61<\/a><\/code>~<code><a class=\"kref\" href=\"#K-L64\">K-L64<\/a><\/code>（六拍节奏法 / 节拍从上一波开始 / 一轮只有两片野区 / 反野的要素是刷新时间）<\/td><\/tr><tr><td>克制<\/td><td><code><a class=\"kref\" href=\"#K-B13\">K-B13<\/a><\/code>（公孙离全时期怕戈娅）<\/td><\/tr><tr><td>信源<\/td><td>95 名单新增第九节：40 个 UP 的命中/分路/英雄分布表<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>仍然缺的（下一轮目标）<\/h3>\n<ul><li><strong>中路<\/strong>：4 张卡（不知火舞/小乔/女娲/王维），甄姬、上官婉儿、貂蝉、干将莫邪仍然采不到干净字幕<\/li><li><strong>对抗路<\/strong>：2 张卡（元歌、夏洛特），是全库第二大的洞<\/li><li><strong>打野<\/strong>：4 张卡（韩信/雅典娜/刘备/铠），且缺\"发育型打野\"样本<\/li><li><strong>射手<\/strong>：还缺马可波罗、孙尚香、虞姬、鲁班七号、戈娅、百里守约的独立卡（素材抓到了，但密度不够，只有实战切片）<\/li><\/ul>\n<hr>\n<h2>第八节 第三轮采集：克制关系专项（2026-11-01）<\/h2>\n<p>这一轮的目标不是补英雄卡，是把 B 类（克制关系）从\"只有官方举例\"做成\"有实测、有动作\"。<\/p>\n<h3>三层素材链，命中率差别很大<\/h3>\n<div class=\"tw\"><table><thead><tr><th>环节<\/th><th>输入<\/th><th>输出<\/th><th>通过率<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>官方详情页<\/td><td>129 个英雄<\/td><td>117 个页面 / 463 条方向边<\/td><td><strong>91%<\/strong><\/td><td>12 个新英雄官方没开关系页<\/td><\/tr><tr><td>搜「X怎么打」类视频<\/td><td>45 个英雄 × 2 模板<\/td><td>222 条候选<\/td><td>—<\/td><td>标题筛：要像讲对位，排除赛事/直播/皮肤/高光<\/td><\/tr><tr><td>取字幕<\/td><td>68 条目标<\/td><td>47 条有字幕<\/td><td><strong>69%<\/strong><\/td><td>比前两轮的 38% / 27% 高得多，因为标题就是对位视频<\/td><\/tr><tr><td>扫对位片段<\/td><td>467 份字幕<\/td><td>287 条候选<\/td><td>—<\/td><td>必须同时命中\"对位语义词 + 两个不同英雄名\"<\/td><\/tr><tr><td>人工筛<\/td><td>287 条<\/td><td>29 条<\/td><td><strong>10%<\/strong><\/td><td>大头被丢掉：局势播报、方向不明、ASR 污染<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关键结论<\/strong>：<strong>专项搜索的通过率（69%）远高于泛搜（38%/27%）<\/strong>。 以后补某个主题，先想清楚\"这类视频的标题长什么样\"，再搜。<\/p>\n<h3>丢掉的那 90% 长什么样（记下来免得以后又去捞）<\/h3>\n<ul><li>局势播报：「这波打完我们反个红」「他肯定没了」——讲那一局，不是这两个英雄<\/li><li>只有一个英雄名：「后羿丢完二我们清线就行」——没有对手，不成对位<\/li><li>方向不明：<strong>能留下的都有一句具体动作<\/strong>。比如「夏洛特打蒙恬不用怕」本身没用，<\/li><\/ul>\n<p>加上「学会扭腰躲他枪」才有用。这条标准是人工筛的唯一判据。<\/p>\n<ul><li>ASR 污染：「夏洛特打蒙恬<strong>七夕<\/strong>不用怕」——\"七夕\"是噪音，不能当技能名写进卡<\/li><\/ul>\n<h3>这一轮的净产出<\/h3>\n<div class=\"tw\"><table><thead><tr><th>产出<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>官方关系<\/td><td><code>30_index/relations.json<\/code>，463 条边，覆盖 117 英雄<\/td><\/tr><tr><td>B 卡<\/td><td>9 张 → <strong>129 张<\/strong>（全英雄池）<\/td><\/tr><tr><td>K-B 条目<\/td><td>13 条 → <strong>42 条<\/strong>，覆盖 35 个英雄，全部 9 字段齐全<\/td><\/tr><tr><td>站点<\/td><td>新增 <code>#matrix<\/code> 对位总表；英雄页加「克制速览」<\/td><\/tr><tr><td>新脚本<\/td><td><code>s18_official.py<\/code>（官方）/ <code>s17_write_b.py<\/code>（建卡）/ <code>s19_duel.py<\/code>（扫字幕）/ <code>s20_duel_entries.py<\/code>（写条目）/ <code>s21_duel_pick.py<\/code>（搜对位视频）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>仍然缺的<\/h3>\n<ul><li><strong>129 张卡里，「我该怎么打」绝大多数还是空的<\/strong>。这是诚实的状态——没素材就不填。<\/li><li>12 个新英雄（元流之子、王维、敖隐、少司缘、影、空空儿、孙权、蚩奼、大禹、卢雅那、大司命、心魔六耳）官方没开关系页，只能靠实测从零建。<\/li><li>对位视频还有 155 条候选没取字幕（222 里取了 68）。下一轮直接接着取，不用重新搜。<\/li><\/ul>\n<hr>\n<h2>幽灵字幕台账（2026-11-18 新增）<\/h2>\n<p>字幕缓存 <code>10_sources/creators_cache/subs/<\/code> 里混着<strong>串源文件<\/strong>：文件按 BV 命名、body 非空，但内容讲的根本不是这个英雄。凡派活时被码道判为\"素材不对口\"的，登记在此，避免重复投入。<\/p>\n<div class=\"tw\"><table><thead><tr><th>日期<\/th><th>素材 BV<\/th><th>声称对象<\/th><th>实际内容<\/th><th>判定方式<\/th><\/tr><\/thead><tbody><tr><td>2026-11-18<\/td><td><code>BV1Z44y1P7TT<\/code><\/td><td>甄姬（1.3 万字符）<\/td><td>2024 英雄联盟全球总决赛 T1 vs Gen.G 解说；\"甄姬\"系战队名 Gen.G 的 ASR 误写<\/td><td>码道逐条核对，甄姬 8 次出现全为战队名<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>处理原则<\/strong>：素材不对口 = 当没素材，<strong>不写卡、不编机制<\/strong>。已在 <code>40_scripts/zero_heroes.txt<\/code> 的 55 个零素材英雄中，甄姬仍在列。<\/p>\n<h3>第二轮待派素材预检（2026-11-19）<\/h3>\n<p>派活前用「英雄名命中 + 王者术语密度」预检了 17 条拟用素材，结果只有 3 条真内容：<\/p>\n<div class=\"tw\"><table><thead><tr><th>素材<\/th><th>声称<\/th><th>实际<\/th><th>判定<\/th><\/tr><\/thead><tbody><tr><td>BV12fp869EfY<\/td><td>芈月教学<\/td><td>分体水冷劝退指南（装机）<\/td><td>串源<\/td><\/tr><tr><td>BV1Dkxc6XEz4<\/td><td>故辞复盘亚瑟<\/td><td>王者术语密度仅 8.8/千字<\/td><td>疑似串源<\/td><\/tr><tr><td>BV1bv4y1e75a<\/td><td>李信教学<\/td><td>0.9/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1GDAHzzEV9<\/td><td>猪八戒全局<\/td><td>0.6/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1dMyhBWEA4<\/td><td>武则天精讲<\/td><td>6.2/千字、英雄名 0<\/td><td>串源<\/td><\/tr><tr><td>BV1Pk4d6KEvn<\/td><td>桑启教学<\/td><td>0.9/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1oCxT6jEnH<\/td><td>孙膑中单<\/td><td>0.1/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1pb2uB7EZ9<\/td><td>元歌辅助<\/td><td>0.9/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1qVaC6NEZx<\/td><td>白衣六辅助<\/td><td>0/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1nk7D6tEzj<\/td><td>打野指挥<\/td><td>0.2/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1vsHL6oETa<\/td><td>发育抓人两不误<\/td><td>0/千字<\/td><td>串源<\/td><\/tr><tr><td>BV1dkWJzZEQY<\/td><td>逆风翻盘<\/td><td>0/千字<\/td><td>串源<\/td><\/tr><tr><td><strong>BV1LiqVBdEXV<\/strong><\/td><td>司马懿精讲<\/td><td>已验证真实（首卡 ts=17）<\/td><td>✅<\/td><\/tr><tr><td><strong>BV1FFHz6AEbY<\/strong><\/td><td>钟馗<\/td><td>英雄名命中 21 次、术语 13.3/千字<\/td><td>✅<\/td><\/tr><tr><td><strong>BV17hgK6kEas<\/strong><\/td><td>益达九大神辅<\/td><td>辅助命中 6、术语 24.8/千字<\/td><td>✅<\/td><\/tr><tr><td><strong>BV1gqbK6VENM<\/strong><\/td><td>益达神辅配合<\/td><td>术语 15.1/千字<\/td><td>✅<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>结论<\/strong>：subs 缓存里「有标题但串源」的比例极高（这轮 14/17）。以后派活前必须先跑预检，别直接喂码道。预检脚本逻辑：字幕正文里英雄名出现次数 ≥2 或王者术语密度 ≥15/千字。<\/p>"}, {"title": "版本变更台账", "file": "90_版本变更台账.md", "html": "<p><strong>版本真值只认官方公告，不认任何\"版本答案\"。<\/strong> 每条 K 条目都必须写\"适用版本\"，跨赛季自动进复核队列。<\/p>\n<h2>赛季区间表（2026）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>赛季<\/th><th>名称<\/th><th>开始<\/th><th>结束<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>S42<\/td><td>神佑建木<\/td><td>2026-01-08<\/td><td>2026-04-01<\/td><td>官网公告 tid=791692<\/td><\/tr><tr><td>S43<\/td><td>陌上相逢<\/td><td>2026-04-01<\/td><td>2026-06-24<\/td><td>官网赛季公告<\/td><\/tr><tr><td>S44<\/td><td>—<\/td><td>2026-06-25<\/td><td>2026-09-23<\/td><td>官网赛季公告<\/td><\/tr><tr><td><strong>S45<\/strong><\/td><td><strong>月照长安（当前）<\/strong><\/td><td><strong>2026-09-23<\/strong><\/td><td><strong>2026-11-25<\/strong><\/td><td>官网赛季公告<\/td><\/tr><tr><td>S46<\/td><td>—<\/td><td>2026-11-25<\/td><td>—<\/td><td>官方预告（11-25 0:00–5:00 停服更新）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>注意：S45 只有约 63 天，比常规 85–95 天短。<strong>任何按\"三个月一赛季\"推算的结论都要重新核对。<\/strong><\/p><\/blockquote>\n<h2>S45 版本特征（影响内容取舍）<\/h2>\n<ul><li><strong>中野辅版本<\/strong>：打野与辅助的联动权重高于边路单带。<\/li><li>周年庆期间（10/24 前后）活动内容多、<strong>平衡性调整少<\/strong>，教学素材偏旧。<\/li><li>新英雄：王维、蚩奼、大司命、空空儿、孙权、苍、影等；<strong>刀锋宝贝仍在体验服<\/strong>。<\/li><\/ul>\n<h2>已发生的平衡调整（截至 2026-10-31）<\/h2>\n<div class=\"tw\"><table><thead><tr><th>日期<\/th><th>对象<\/th><th>改动<\/th><th>影响的知识点<\/th><\/tr><\/thead><tbody><tr><td>10-30（体验服）<\/td><td>镜<\/td><td>二技能 CD 9~7→10~8（全等级 +1s）；加速 50%→100(+20/Lv)；二技能伤害小幅上调；三技能充能 10→10~8<\/td><td>未入库（打野支线），暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>曜<\/td><td>三技能 CD 15~10→13.5~10<\/td><td>未入库，暂记<\/td><\/tr><tr><td>10-30（体验服）<\/td><td>刀锋宝贝<\/td><td>三技能追踪优化、强化普攻法球修复<\/td><td>未上线正式服，不采信为正式结论<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>体验服改动一律不作为正式服结论入库<\/strong>，只能进本表。<\/p>\n<h2>待办<\/h2>\n<ul><li>[ ] 抓到 S45 官方更新公告原文后，补全本表 9-23 至 10-31 的正式服调整<\/li><li>[ ] S46（11-25）上线后 7 天内，全库过一遍\"适用版本 = S45\"的条目<\/li><\/ul>"}], "meta": {"total": 248, "heroes": 131, "sub": "当前版本 S45 · 共 248 条 · 更新 2026-11-19"}}</script>
<script>
/* ══════════════════════════════════════════════════════════
   kog 站点交互 —— 英雄宫格 + 折叠卡
   数据来自 <script id="DATA" type="application/json">，构建时注入
   路由用 hash（要支持 file:// 直接打开，不能用 History API）：
     # / 空        → 英雄宫格
     #H:苏烈       → 英雄页
     #doc:xx.md    → 长文档（信源名单 / 版本台账 / 导航）
     #cat:A        → 某一类的全部条目
     #K-B01        → 直达条目并展开
   ══════════════════════════════════════════════════════════ */
(function () {
  const D = JSON.parse(document.getElementById('DATA').textContent);
  const view = document.getElementById('view');
  const qEl = document.getElementById('q');
  const root = document.documentElement;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 扁平分索引：搜索与直达用 ── */
  const IDX = [];
  D.heroes.forEach(h => {
    h.a.concat(h.b).forEach(e => IDX.push({ ...e, owner: h.name, kind: 'H:' + h.name }));
  });
  D.general.forEach(g => g.entries.forEach(e =>
    IDX.push({ ...e, owner: g.title, kind: 'doc:' + g.file })));
  (D.lanes || []).forEach(l => l.entries.forEach(e =>
    IDX.push({ ...e, owner: l.name, kind: 'lane:' + l.file })));

  const heroOf = n => D.heroes.find(h => h.name === n);
  const laneOf = f => (D.lanes || []).find(l => l.file === f);
  const byId = id => IDX.find(e => e.id === id);

  /* ── 条目折叠卡 ── */
  function entryCard(e, open) {
    const idAttr = e.id ? ` id="${esc(e.id)}"` : '';
    const idTag  = e.id ? `<span class="id">${esc(e.id)}</span>` : '';
    return `<details class="entry"${idAttr}${open ? ' open' : ''}>
      <summary>
        ${idTag}
        <span class="tt"><b>${esc(e.title)}</b>
          <span>${esc(e.sum || '')}</span></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>

  /* ── 大局观定位：强势期 / 节奏职责 / 一句话 ── */
  const TEMPO_CN = { early: '前期', mid: '中期', late: '后期', even: '全期' };
  const JOB_CN = { open: '开节奏', follow: '跟节奏', hold: '守节奏',
                   scout: '视野侦察', split: '带线牵制' };
  function planTags(h) {
    const out = [];
    if (h.tempo) out.push(`<span class="pill t-${esc(h.tempo)}">${esc(TEMPO_CN[h.tempo] || h.tempo)}</span>`);
    if (h.job) out.push(`<span class="pill j-${esc(h.job)}">${esc(JOB_CN[h.job] || h.job)}</span>`);
    return out.join('');
  }

  /* ── 英雄卡 ── */
  function heroCard(h) {
    const pills = [];
    if (h.a.length) pills.push(`<span class="pill a">怎么玩 ${h.a.length}</span>`);
    // 克制数来自官方口径（全英雄池都有），比"对位条目数"更能反映这张卡有多厚
    if (h.beats_n) pills.push(`<span class="pill kw">克 ${h.beats_n}</span>`);
    if (h.loses_n) pills.push(`<span class="pill kl">被克 ${h.loses_n}</span>`);
    if (!pills.length) pills.push('<span class="pill g">待补</span>');
    const plan = planTags(h);
    return `<a class="hcard" href="#H:${encodeURIComponent(h.name)}">
      <span class="avatar" style="--h:${h.hue}">${esc(h.name.slice(0, 1))}</span>
      <span class="hname">${esc(h.name)}${h.unlisted ? '<i class="unlisted" title="官方 129 英雄名录里没有这个名字">?</i>' : ''}</span>
      <span class="hmeta">${pills.join('')}</span>
      ${plan ? `<span class="hplan">${plan}</span>` : ''}
    </a>`;
  }

  /* ── 分路卡 ── */

    return `<a class="lcard" href="#lane:${encodeURIComponent(l.file)}">

  /* ── 对位总表：129 个英雄一张表 ── */
  function renderMatrix() {
    const LANES = [['solo', '对抗路'], ['jungle', '打野'], ['mid', '中路'],
                   ['adc', '发育路'], ['roam', '游走']];
    const chip = (n, cls) => `<a class="oppchip ${cls || ''}" href="#H:${encodeURIComponent(n)}">${esc(n)}</a>`;

        <span>英雄</span><span>他压制的</span><span>压制他的</span>
      </div>`;

    const blocks = LANES.map(([k, cn]) => {
      const list = D.heroes.filter(h => h.main_lane === k)
        .sort((a, b) => b.beats_n - a.beats_n || a.name.localeCompare(b.name, 'zh'));
      if (!list.length) return '';
      return `<section class="sec">
        <div class="sec-h"><h2>${cn}</h2><span>${list.length} 个</span></div>
        <div class="mtx">${head}${rowsOf(list)}</div>
      </section>`;
    }).join('');

    const noLane = D.heroes.filter(h => !LANES.some(([k]) => h.main_lane === k));
    const rest = noLane.length
      ? `<section class="sec"><div class="sec-h"><h2>分路未定</h2><span>${noLane.length} 个</span></div>
         <div class="mtx">${head}${rowsOf(noLane)}</div></section>` : '';

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hero-head">
        <p class="eyebrow">全英雄池</p>
        <h1>对位总表</h1>
        <p class="lede">名字全部可点。这一版是<b>官方口径（L0）</b>：
          官方每个英雄只给两个方向各 2~6 个例子，不是全量配对，也没给成立条件。
          要「在什么分段、什么出装下成立」，看英雄页里的 K-B 实测条目。</p>
      </div>
      ${duelHas() ? `<section class="sec">
        <div class="sec-h"><h2>同路五档矩阵</h2><span>只判同路，五档 + 证据三态</span></div>
        <div class="row">${Object.keys(D.duel).map(k => {
          const g = D.duel[k], cov = g.coverage || {};
          return `<a class="gcard" href="#duel:${encodeURIComponent(k)}">
            <span class="gicon">⇄</span>
            <span class="gtxt"><b>${esc(g.cn || k)} · ${g.heroes.length} 英雄</b>
              <span>${cov.measured || 0} 实测 / ${cov.total || 0} 格</span></span>
          </a>`;
        }).join('')}</div>

    `;
  }

  /* ══════════════════════════════════════════════════════════
     同路五档对位矩阵（30_index/duel/{lane}.grid.json）
     档位：克 / 小优 / 五五开 / 小劣 / 被克
     状态：measured 有人真讲过 · derived 有档位没实测 · empty 待补
     数据是位置数组，每格 6 个数字，见 build_site.duel_payload
     ══════════════════════════════════════════════════════════ */
  const DUEL_G = ['克', '小优', '五五开', '小劣', '被克'];
  const DUEL_SHORT = ['克', '优', '平', '劣', '被'];
  const DUEL_S_CN = ['待补', '推演', '实测'];
  const DUEL_LAYER = ['机制', '数值'];
  const DUEL_CONF = ['', '低', '中', '高'];
  const DUEL_BASIS = { column: '专栏', video: '视频',
                       official: '官方口径', mechanism: '机制推演' };
  const duelMode = {};
  let curDuel = '';

  const duelHas = () => !!(D.duel && Object.keys(D.duel).length);

  function duelCell(g, ia, ib) {
    const o = (ia * g.heroes.length + ib) * 6;
    return { grade: g.flat[o], status: g.flat[o + 1], conf: g.flat[o + 2],
             layer: g.flat[o + 3], ev: g.flat[o + 4], mirror: g.flat[o + 5] };
  }

  /* 某个英雄在这一路的所有对位 → 五个档位分桶 + 三态计数 */
  function duelBuckets(g, name) {
    const out = [[], [], [], [], []];
    const st = { empty: 0, derived: 0, measured: 0 };
    const ia = g.heroes.indexOf(name);
    if (ia < 0) return { out, st, n: 0 };
    g.heroes.forEach((b, ib) => {
      if (b === name) return;
      const c = duelCell(g, ia, ib);
      st[['empty', 'derived', 'measured'][c.status] || 'empty']++;
      if (c.grade >= 0) out[c.grade].push(b);
    });
    return { out, st, n: g.heroes.length - 1 };
  }

  /* ── 名单视图：一个英雄一行 ── */
  function duelRow(g, name, lane) {
    const b = duelBuckets(g, name);
    const h = heroOf(name);
    const groups = b.out.map((list, gi) => list.length
      ? `<span class="dgrp"><i class="dgk g${gi}">${DUEL_G[gi]}</i>${list.map(n =>
          `<button class="dchip g${gi}" data-lane="${esc(lane)}" data-a="${esc(name)}"
             data-b="${esc(n)}">${esc(n)}</button>`).join('')}</span>`
      : '').filter(Boolean).join('');
    const stat = [
      b.st.measured ? `<b class="dok">实测 ${b.st.measured}</b>` : '',
      b.st.derived ? `<b class="dder">推演 ${b.st.derived}</b>` : '',
      `<b class="demp">待补 ${b.st.empty}</b>`,
    ].join('');
    return `<div class="drow">
      <a class="drow-h" href="#H:${encodeURIComponent(name)}">
        <span class="avatar" style="--h:${h ? h.hue : 0}">${esc(name.slice(0, 1))}</span>
        <span class="drow-n">${esc(name)}</span>
      </a>
      <div class="drow-b">${groups || `<i class="dim">${b.n} 个对位全部待补</i>`}</div>
      <span class="drow-s">${stat}</span>
    </div>`;
  }

  /* ── 网格视图：24 × 24 ── */
  function duelGrid(g, lane) {
    const H = g.heroes;
    const head = `<tr><th class="dgx"></th>${H.map((b, i) =>
      `<th><span>${esc(b)}</span></th>`).join('')}</tr>`;
    const body = H.map((a, ia) => `<tr><th class="dgy">${esc(a)}</th>${H.map((b, ib) => {
      if (a === b) return '<td class="dself"></td>';
      const c = duelCell(g, ia, ib);
      const cls = c.grade >= 0 ? `g${c.grade} s${c.status}` : 'gx';
      const tip = `${a} vs ${b}` + (c.grade >= 0
        ? ` · ${DUEL_G[c.grade]} · ${DUEL_S_CN[c.status]}` : ' · 待补');
      return `<td><button class="dcell ${cls}" title="${esc(tip)}"
        data-lane="${esc(lane)}" data-a="${esc(a)}" data-b="${esc(b)}"
        aria-label="${esc(tip)}">${c.grade >= 0 ? DUEL_SHORT[c.grade] : ''}</button></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="dgwrap"><table class="dgrid">
      <thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  /* ── 详情弹层 ── */
  const mmss = s => {
    const v = Math.max(0, Math.round(Number(s) || 0));
    return `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`;
  };

  function openDuel(lane, a, b) {
    const g = (D.duel || {})[lane];
    if (!g) return;
    const ia = g.heroes.indexOf(a), ib = g.heroes.indexOf(b);
    if (ia < 0 || ib < 0) return;
    const c = duelCell(g, ia, ib);
    const d = (g.detail || {})[`${a}|${b}`] || null;

    const grade = c.grade >= 0
      ? `<span class="dgrade g${c.grade}">${DUEL_G[c.grade]}</span>`
      : `<span class="dgrade gx">待补</span>`;
    const pills = [
      `<span class="dpill s${c.status}">${DUEL_S_CN[c.status] || '待补'}</span>`,
      c.layer >= 0 ? `<span class="dpill">${DUEL_LAYER[c.layer]}差距</span>` : '',
      c.conf ? `<span class="dpill">可信度 ${DUEL_CONF[c.conf]}</span>` : '',
      c.ev ? `<span class="dpill">${c.ev} 条证据</span>` : '',
      d && d.basis ? `<span class="dpill">依据 ${esc(DUEL_BASIS[d.basis] || d.basis)}</span>` : '',
    ].filter(Boolean).join('');

    let note = '';
    if (c.status === 0) {
      note = `<p class="dnote">这一格还没有来源。官方关系页每边只列 2 个例子，
        同路对位覆盖率不到 5%，所以大部分格是空的——不猜、不凑。</p>`;
    } else if (c.status === 1) {
      note = `<p class="dnote">${d && d.basis === 'official'
        ? '官方口径只给了方向，没给强度和成立条件。这里按最保守的一档暂记，等实测覆盖。'
        : '按机制推的，没有视频或专栏实测过。可作参考，别当结论。'}</p>`;
    }
    if (c.mirror) {
      note += `<p class="dnote">这一格是反对偶：由「${esc(b)} vs ${esc(a)}」的结论取反得来，
        打法细节在对面那条里。</p>`;
    }

    const EV_KIND = { video: '视频', column: '专栏', official: '官方关系页' };
    const evList = (d && d.ev && d.ev.length)
      ? d.ev.map(e => {
          const tag = EV_KIND[e.k] || '出处';
          const when = (e.k === 'video' || e.k === 'column') && e.ts != null
            ? ` @ ${mmss(e.ts)}` : '';
          // 官方口径的 ref 是站点内部的文件名，对人没意义，只留可点的官方页面
          const shown = e.k === 'column' ? 'cv' + e.ref : e.ref;
          const tail = e.k === 'official' || !e.ref ? '' : ' · ' + esc(shown);
          const src = e.url
            ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(tag)}${tail}${when}</a>`
            : `<span class="devsrc">${esc(tag)}${tail}</span>`;
          return `<li>${src}${e.q ? `<q>${esc(e.q)}</q>` : ''}</li>`;
        }).join('')
      : '';

    const sec = (t, v) => v ? `<section class="dsec"><h4>${t}</h4><p>${esc(v)}</p></section>` : '';
    const body = `
      <div class="dhead">
        <div class="dvs">
          <a href="#H:${encodeURIComponent(a)}">${esc(a)}</a>
          <em>vs</em>
          <a href="#H:${encodeURIComponent(b)}">${esc(b)}</a>
        </div>
        <button class="dclose" aria-label="关闭">×</button>
      </div>
      <div class="dbadges">${grade}${pills}</div>
      ${d && d.cond ? `<p class="dcond">成立条件 · ${esc(d.cond)}</p>` : ''}
      ${sec('怎么打', d && d.how)}
      ${sec('他的破绽', d && d.counter)}
      ${evList ? `<section class="dsec"><h4>出处</h4><ul class="dev">${evList}</ul></section>` : ''}
      ${note}
      <p class="dfoot">${esc(g.cn || '')} · 对位矩阵</p>`;

    const el = duelModal();
    el.querySelector('.dbox').innerHTML = body;
    el.classList.add('on');
    document.body.style.overflow = 'hidden';
    el.querySelector('.dclose').addEventListener('click', closeDuel);
  }

  function duelModal() {
    let el = document.getElementById('dmodal');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'dmodal';
    el.className = 'dmodal';
    el.innerHTML = '<div class="dmask"></div><div class="dbox" role="dialog" aria-modal="true"></div>';
    el.querySelector('.dmask').addEventListener('click', closeDuel);
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && el.classList.contains('on')) closeDuel();
    });
    document.body.appendChild(el);
    return el;
  }

  function closeDuel() {
    const el = document.getElementById('dmodal');
    if (el) el.classList.remove('on');
    document.body.style.overflow = '';
  }

  /* 事件委托：所有 dchip / dcell 都走这一个入口 */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('.dchip, .dcell');
    if (!t) return;
    ev.preventDefault();
    openDuel(t.dataset.lane, t.dataset.a, t.dataset.b);
  });

  /* ── 对位矩阵页 ── */
  function renderDuel(lane, mode) {
    const g = (D.duel || {})[lane];
    if (!g) return renderHome();
    curDuel = lane;
    const m = mode || duelMode[lane] || 'list';
    duelMode[lane] = m;

    const cov = g.coverage || {};
    const tot = cov.total || g.heroes.length * (g.heroes.length - 1);
    const pct = x => (x || 0) / tot * 100;
    const otherLanes = Object.keys(D.duel || {}).filter(k => k !== lane);

    const legend = `<div class="dlegend">
      <span class="dlegend-t">档位</span>
      ${DUEL_G.map((n, i) => `<span class="dgrade g${i}">${n}</span>`).join('')}
      <span class="dlegend-t">状态</span>
      <span class="dpill s2">实测</span>
      <span class="dpill s1">推演</span>
      <span class="dpill s0">待补</span>
    </div>`;

    const listBody = m === 'list'
      ? `<div class="dlist">${g.heroes.map(n => duelRow(g, n, lane)).join('')}</div>`
      : duelGrid(g, lane);

    view.innerHTML = `
      <a class="back" href="#">← 返回</a>
      <div class="hero-head">
        <p class="eyebrow">${esc(g.version || D.version)} · 同路对位</p>
        <h1>${esc(g.cn || lane)} · ${g.heroes.length} × ${g.heroes.length - 1} 全矩阵</h1>
        <p class="lede">这一路<b>所有</b>英雄两两配对，谁克谁一格一格摆出来。
          五档是判断，三态是证据强弱：<b>实测</b>有人真讲过、点得开原文，
          <b>推演</b>只有方向没有验证，<b>待补</b>是还没人讲——<b>待补不等于五五开</b>，
          只是暂时查不到来源。点任意一格看依据、成立条件和出处。</p>
      </div>

      <section class="sec">
        <div class="dbar">
          <div class="dbar-n">
            <b>${cov.measured || 0}</b><span>实测</span>
          </div>
          <div class="dbar-n">
            <b>${cov.derived || 0}</b><span>推演</span>
          </div>
          <div class="dbar-n">
            <b>${cov.empty || 0}</b><span>待补</span>
          </div>
          <div class="dbar-b">
            <i class="dbar-m" style="width:${pct(cov.measured)}%"></i>
            <i class="dbar-d" style="width:${pct(cov.derived)}%"></i>
          </div>
          <div class="dbar-p">实测覆盖 ${pct(cov.measured).toFixed(1)}%</div>
        </div>
        ${legend}
        <div class="dswitch">
          <button class="dtab${m === 'list' ? ' on' : ''}" data-mode="list">名单</button>
          <button class="dtab${m === 'grid' ? ' on' : ''}" data-mode="grid">网格</button>
          <a class="dtab" href="#matrix">全英雄对位总表 →</a>
          ${otherLanes.map(k => `<a class="dtab" href="#duel:${encodeURIComponent(k)}">${esc(D.duel[k].cn || k)}</a>`).join('')}
        </div>
      </section>

      <section class="sec">${listBody}</section>

      <p class="dnofoot">为什么这么多格是空的：官方关系页每个方向固定只列 2 个例子，
        而且 77% 是跨路对位；同路对位只能一篇篇专栏、一条条字幕去挖。
        「待补」记录的是<b>没查到</b>，不是<b>均势</b>——这两件事在实战里差很远。
        补齐进度记在 <a href="#doc:96_素材缺口.md">素材缺口</a>里。</p>
      ${(cov.grades || {})['五五开'] === 0 ? `<p class="dnofoot">
        「五五开」这一档现在<b>是空的</b>，不是因为其余对位都分出了胜负，
        是因为没有一个 UP 会专门做「谁跟谁五五开」——它只会以「不算克制」的形式出现，
        而这恰恰是现有素材里最难被说出口的一句话。宁可不填。</p>` : ''}
    `;
    view.querySelectorAll('.dtab[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => renderDuel(lane, btn.dataset.mode));
    });
  }

  /* ── 英雄页上的对位块 ── */
  function duelBox(name) {
    if (!duelHas()) return '';
    const lanes = Object.keys(D.duel).filter(k => D.duel[k].heroes.includes(name));
    if (!lanes.length) return '';
    const lane = lanes[0];
    const g = D.duel[lane];
    const b = duelBuckets(g, name);
    const rows = b.out.map((list, gi) => list.length
      ? `<div class="opprow">
           <span class="oppk g${gi}">${DUEL_G[gi]}</span>
           <span class="oppv">${list.map(n =>
             `<button class="dchip g${gi}" data-lane="${esc(lane)}" data-a="${esc(name)}"
                data-b="${esc(n)}">${esc(n)}</button>`).join('')}</span>
         </div>`
      : '').join('');
    return `<section class="sec"><div class="sec-h"><h2>同路对位（${esc(g.cn || lane)}）</h2>
        <span>实测 ${b.st.measured} · 推演 ${b.st.derived} · 待补 ${b.st.empty}</span></div>
      ${rows ? `<div class="oppbox">${rows}</div>`
             : `<p class="lede">这一路 ${b.n} 个对位全部待补。</p>`}
      <p class="lede"><a href="#duel:${encodeURIComponent(lane)}">看${esc(g.cn || lane)}全矩阵 →</a></p>
    </section>`;
  }

  /* ── 路由 ── */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    qEl.value = '';
    if (!h) return renderHome();
    if (h === 'matrix') return renderMatrix();
    if (h.startsWith('duel:')) return renderDuel(h.slice(5));
    if (h.startsWith('H:')) return renderHero(h.slice(2));
    if (h.startsWith('lane:')) return renderLane(h.slice(5));
    if (h.startsWith('doc:')) return renderDoc(h.slice(4));
    if (h.startsWith('cat:')) return renderCat(h.slice(4));
    const e = byId(h);
    if (e) {
      if (e.kind.startsWith('H:')) renderHero(e.kind.slice(2));
      else if (e.kind.startsWith('lane:')) renderLane(e.kind.slice(5));
      else renderDoc(e.kind.slice(4));
      requestAnimationFrame(() => {
        const el = document.getElementById(h);
        if (el) {
          el.open = true;
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.querySelector('summary').style.background = 'var(--bg3)';
          setTimeout(() => { el.querySelector('summary').style.background = ''; }, 1600);
        }
      });
      return;
    }
    renderHome();
  }

  /* ── 搜索交互 ── */
  let t = null;
  qEl.addEventListener('input', () => {
    clearTimeout(t);
    const v = qEl.value;
    t = setTimeout(() => {
      if (v.trim()) renderSearch(v);
      else if (!location.hash) renderHome();
    }, 140);
  });
  qEl.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { qEl.value = ''; route(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== qEl) {
      ev.preventDefault(); qEl.focus();
    }
  });

  /* ── 主题 ── */
  const saved = localStorage.getItem('kog-theme');
  if (saved) root.dataset.theme = saved;
  document.getElementById('theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    localStorage.setItem('kog-theme', next);
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
