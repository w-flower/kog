<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王者荣耀实战知识库 · S45</title>
<meta name="description" content="按英雄查的王者荣耀决策手册：怎么玩、打谁舒服、被谁克、这一刻该干什么。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<style>
/* ══════════════════════════════════════════════════════════
   kog 站点样式 —— 英雄宫格 + 折叠卡
   改配色只改 :root 变量；组件规则一般不用动
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232d; --line:#28313d; --line2:#333e4c;
  --fg:#e8eef5; --fg2:#98a5b3; --fg3:#6d7887;
  --accent:#f0b429; --accent2:#5aa2ff; --ok:#3fb950; --bad:#f85149;
  --r:16px; --r-s:11px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef1f5; --line:#e2e7ee; --line2:#cfd7e2;
  --fg:#161b22; --fg2:#5a6672; --fg3:#8b98a6;
  --accent:#b57d00; --accent2:#1266d6;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 24px -14px rgba(16,24,40,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:15.5px; line-height:1.85; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono); font-size:.88em; padding:.1em .38em; border-radius:5px;
  background:var(--bg3); border:1px solid var(--line);
}

/* ─────────── 顶栏 ─────────── */
.top{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:12px clamp(16px,4vw,32px); background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; color:var(--fg); flex:none}
.brand:hover{text-decoration:none}
.logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#12161c;
  background:linear-gradient(145deg,#ffd76a,#e8a01c);
}
.bt{display:flex;align-items:baseline;gap:7px;font-size:15px;letter-spacing:.2px}
.bt b{font-weight:700}
.bt i{font-style:normal;font-size:11.5px;color:var(--fg3);border:1px solid var(--line2);
  padding:1px 6px;border-radius:20px}
.search{
  flex:1; display:flex; align-items:center; gap:8px; max-width:520px;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:0 12px; height:42px; transition:border-color .15s;
}
.search:focus-within{border-color:var(--accent2)}
.search svg{width:15px;height:15px;fill:var(--fg3);flex:none}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:var(--fg);
  font:inherit;font-size:14.5px;
}
.icon-btn{
  flex:none;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--fg2);
}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round}

/* ─────────── 版心 ─────────── */
.wrap{max-width:1080px;margin:0 auto;padding:clamp(26px,4vw,46px) clamp(16px,4vw,32px)}

.hero-head{margin:0 0 26px}
.eyebrow{font-size:12.5px;color:var(--fg3);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(25px,4.2vw,34px);line-height:1.3;margin:0 0 10px;letter-spacing:-.4px}
.lede{color:var(--fg2);margin:0;max-width:56ch;font-size:15px;line-height:1.8}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h h2{font-size:16px;margin:0;letter-spacing:.3px}
.sec-h span{font-size:12.5px;color:var(--fg3)}

/* ─────────── 英雄宫格 ─────────── */
.grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
.hcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.hcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.avatar{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:20px;letter-spacing:0;
  color:hsl(var(--h) 85% 80%);
  background:
    radial-gradient(circle at 32% 26%, hsl(var(--h) 60% 34%), hsl(var(--h) 70% 15%));
  border:1px solid hsl(var(--h) 55% 42% / .55);
  box-shadow:inset 0 0 14px hsl(var(--h) 80% 40% / .28);
}
html[data-theme="light"] .avatar{
  color:hsl(var(--h) 72% 30%);
  background:radial-gradient(circle at 32% 26%, hsl(var(--h) 80% 92%), hsl(var(--h) 70% 82%));
  border-color:hsl(var(--h) 60% 70%);
  box-shadow:none;
}
.hname{font-weight:650;font-size:15.5px;line-height:1.3}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pill{
  font-size:11.5px;padding:1.5px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg3);color:var(--fg2);line-height:1.6;white-space:nowrap;
}
.pill.a{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.b{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.l{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.g{color:var(--fg3)}

/* ─────────── 分路卡 ─────────── */
.lcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.lcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.lmotto{font-size:12px;color:var(--fg3);line-height:1.5}
.klink{
  display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--fg2);font-size:13.5px;
}
.klink:hover{text-decoration:none;border-color:var(--line2);color:var(--fg)}
html[data-theme="light"] .pill.l{color:#2f5c96;border-color:#c5d7ee;background:#eef4fb}

/* ─────────── 通用卡（对局内 / BP / 文档） ─────────── */
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gcard{
  display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);color:var(--fg);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s;
}
.gcard:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--line2)}
.gicon{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  font-size:20px;background:var(--bg3);border:1px solid var(--line);
}
.gtxt{min-width:0}
.gtxt b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.gtxt span{display:block;font-size:12.5px;color:var(--fg3);line-height:1.55}

/* ─────────── 折叠卡（条目） ─────────── */
.entry{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden;
}
.entry+.entry{margin-top:10px}
.entry>summary{
  list-style:none;cursor:pointer;padding:15px 18px;display:grid;
  grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary:hover{background:var(--bg3)}
.entry .id{
  font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:3px;
  letter-spacing:.02em;white-space:nowrap;
}
.entry .tt{min-width:0}
.entry .tt b{display:block;font-size:15.5px;font-weight:650;line-height:1.5}
.entry .tt span{
  display:block;font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.7;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.entry .chev{
  width:20px;height:20px;flex:none;margin-top:3px;color:var(--fg3);
  transition:transform .18s ease;
}
.entry[open] .chev{transform:rotate(90deg)}
.entry .body{
  padding:2px 20px 18px 20px;border-top:1px solid var(--line);margin-top:2px;
  font-size:15px;color:var(--fg);max-width:74ch;
}
.entry .body p{margin:.85em 0}
.entry .body ul,.entry .body ol{padding-left:1.25em;margin:.8em 0}
.entry .body li{margin:.35em 0}
.entry .body blockquote{
  margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);
  background:var(--bg3);border-radius:0 10px 10px 0;color:var(--fg2);font-size:14.5px;
}
.entry .body h4{font-size:14px;margin:1.2em 0 .5em;color:var(--fg2);letter-spacing:.3px}
.entry .body table{
  width:100%;border-collapse:collapse;margin:1em 0;font-size:14px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.entry .body th,.entry .body td{
  border:1px solid var(--line);padding:8px 12px;text-align:left;
}
.entry .body th{background:var(--bg3);font-weight:600;color:var(--fg2)}
.kref{font-family:var(--mono);font-size:.9em;padding:0 .3em;border-radius:4px;
  background:var(--bg3);border:1px solid var(--line);color:var(--accent2)}
.opp{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--fg2);background:var(--bg3);margin-left:8px;
  vertical-align:2px}

/* ─────────── 英雄详情头 ─────────── */
.hhead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex-wrap:wrap}
.hhead .avatar{width:74px;height:74px;font-size:30px;border-radius:24px}
.hhead h1{margin:0;font-size:clamp(23px,4vw,30px)}
.hhead .hmeta{margin-top:6px}
.back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg3);
  margin-bottom:14px;
}
.back:hover{color:var(--fg2);text-decoration:none}

/* ─────────── 文档页（长文） ─────────── */
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.doc-nav a{
  font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);
}
.doc-nav a:hover,.doc-nav a.on{border-color:var(--accent2);color:var(--fg);text-decoration:none}
.doc h2{font-size:19px;margin:2em 0 .8em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:1.8em 0 .6em}
.doc p{margin:.9em 0;max-width:74ch}
.doc ul,.doc ol{padding-left:1.3em;max-width:74ch}
.doc li{margin:.4em 0}
.doc blockquote{
  margin:1.2em 0;padding:.8em 1.1em;border-left:3px solid var(--accent);
  background:var(--bg2);border-radius:0 12px 12px 0;color:var(--fg2);
}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc table{
  width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px;
  display:block;overflow-x:auto;
}
.doc th,.doc td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
.doc th{background:var(--bg3);font-weight:600;color:var(--fg2);white-space:nowrap}
.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 60%,var(--bg))}

/* ─────────── 搜索结果 ─────────── */
.res-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);
}
.res-item .id{font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:4px;flex:none}
.res-item b{font-weight:650}
.res-item span{display:block;font-size:13px;color:var(--fg2)}
.empty{color:var(--fg3);padding:40px 0;text-align:center}

/* ─────────── 页脚 ─────────── */
.foot{
  max-width:1080px;margin:60px auto 0;padding:22px clamp(16px,4vw,32px) 0;
  border-top:1px solid var(--line);color:var(--fg3);font-size:12.5px;
}

/* ─────────── 响应式 ─────────── */
@media (max-width:720px){
  body{font-size:15px}
  .top{gap:8px;padding:10px 14px}
  .bt b{font-size:14px}
  .logo{width:29px;height:29px;font-size:14.5px}
  .search{height:38px}
  .search input{font-size:14px}
  .icon-btn{width:38px;height:38px}
  .wrap{padding:22px 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .hcard{padding:13px 10px 11px;align-items:center;text-align:center;gap:8px}
  .avatar{width:44px;height:44px;font-size:17.5px}
  .hname{font-size:13.5px}
  .hmeta{justify-content:center}
  .pill{font-size:10.5px;padding:1px 6px}
  .entry>summary{padding:13px 14px;gap:9px;grid-template-columns:1fr auto}
  .entry .id{display:none}
  .entry .body{padding:2px 14px 15px}
  .hhead .avatar{width:58px;height:58px;font-size:23px;border-radius:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.foot{display:none}.entry>summary{grid-template-columns:1fr}.entry .body{display:block!important}}

</style>
</head>

中把敌人拉回来 → 让防御塔补伤害<\/li><li><strong>反例<\/strong>：「大招是团控，留着打团」——单杀阶段把人大招拉进塔，是最省技能的杀法。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 04:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标在塔的射程边缘，且你敢吃一发塔伤判断依据：大招的拉回方向能否把目标拉进塔下决策分支：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害反例：「大招是团控，留着打团」——单杀阶…"}, {"id": "K-A17", "cat": "A", "title": "用扇子探草：命中会回能", "self": "<h3><a class=\"kref\" href=\"#K-A17\">K-A17<\/a> 用扇子探草：命中会回能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：进草前、支援路上<\/li><li><strong>判断依据<\/strong>：扇子出手后能量有没有涨<\/li><li><strong>决策分支<\/strong>：能量涨了 → 草里有人，别进去；没涨 → 可以走<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:10<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A18\">K-A18<\/a> 对线期第一波线别靠前（对面是钩子类辅助时）<\/h3>\n<p>这条是<strong>中路对线期的通用纪律<\/strong>，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L06\">K-L06<\/a><\/code>。火舞的特殊点在于她<strong>清线慢<\/strong>（抢不动也躲不开），所以对她来说这条不是\"建议\"而是\"必须\"。<\/p>\n<h2>5. 出装与铭文<\/h2>\n<p><strong>结论：暂不写入具体铭文组合。<\/strong><\/p>\n<p>原因：标题带\"出装铭文\"的两期，一期是 2020 年（BV1v541187YZ），一期是 2024-06（BV12b421H7sY，S36）；2026 年那条（BV1Td9EBKE9S）字幕里只有一句\"还有不知火舞的出装铭文\"就结束了，<strong>具体条目没有被 ASR 转录出来<\/strong>。ASR 对铭文名（梦魇/心眼/狩猎）的识别错误率高，硬写等于编。<\/p>\n<p><strong>能确认的只有一条思路<\/strong>：出装要围绕\"减魔抗 + 爆发\"，因为她的伤害模型就是扇子标记后一套带走；对面出了魔女斗篷时，原话是\"他现在这套装备就是秒他，但是他出了魔女咱们秒不掉\"——遇到魔女要改路线，不要硬堆法强。<\/p>\n<ul><li>来源：BV1v541187YZ @ 12:19（魔女斗篷的应对）<\/li><li>待补：S45 具体六件套顺序、铭文红蓝绿配置，需要一条 2026-09 之后、标题明确标\"出装铭文\"且<strong>有字幕<\/strong>的视频，或官网英雄页/助手数据核对。<\/li><\/ul>\n<h2>6. 最容易崩的三个地方<\/h2>\n<ol><li><strong>能量不够硬进团<\/strong> → 进去放不出三段，等于送。<\/li><li><strong>不会取消后摇<\/strong> → 一模一样的操作，别人打完能翻滚走，你还在原地收招。<\/li><li><strong>把一闪当输出用<\/strong> → 交完闪现又没杀掉，接下来 90 秒你没有开团手段。<\/li><\/ol>\n<h2>7. 待补<\/h2>\n<ul><li>各技能精确数值（CD、能量消耗、大招拉回距离）未从素材获得。<\/li><li>强势期/弱势期：素材多为顺风或均势局，逆风下限没有样本。<\/li><li>与具体英雄的对位结论见 <code>B_克制关系/<\/code>（目前无火舞条目）。<\/li><\/ul>", "sum": "这条是中路对线期的通用纪律，已迁到 L_分路/01_中路.md 的 K-L06。"}], "b": [], "lanes": ["mid"], "n": 7, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "苏烈", "hue": 273, "a": [{"id": "K-A01", "cat": "A", "title": "苏烈的核心是\"第三棍\"和\"二技能\"，不是大招", "self": "<h3><a class=\"kref\" href=\"#K-A01\">K-A01<\/a> 苏烈的核心是\"第三棍\"和\"二技能\"，不是大招<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何需要苏烈先手的局面<\/li><li><strong>判断依据<\/strong>：对面站位是否进入三段普攻的追击距离；二技能冷却是否可用<\/li><li><strong>决策分支<\/strong>：<\/li><li>二技能可用 → 优先用它把对面的开团手<strong>推离<\/strong>，或者把落单的人<strong>推回<\/strong>队友方向<\/li><li>二技能不可用 → 不要用大招硬开，改打三棍逼退<\/li><li><strong>反例<\/strong>：「辅助的大招就是用来开团的」——苏烈大招蓄力期间不能动，盲目蓄力等于把自己钉在原地等人集火。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:21；BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何需要苏烈先手的局面判断依据：对面站位是否进入三段普攻的追击距离；"}, {"id": "K-A02", "cat": "A", "title": "二技能有两个完全不同的用途，别只用一个", "self": "<h3><a class=\"kref\" href=\"#K-A02\">K-A02<\/a> 二技能有两个完全不同的用途，别只用一个<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：二技能可用时<\/li><li><strong>判断依据<\/strong>：对面有没有正在进行的位移/突进技能<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>挡<\/strong>：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间<\/li><li><strong>推<\/strong>：抓落单时把目标推向队友方向，不是推离<\/li><li><strong>反例<\/strong>：「二技能就是个位移」——它同时是<strong>拦截<\/strong>手段。挡下一次开团的价值，往往高于推一个人。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 02:21<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：二技能可用时判断依据：对面有没有正在进行的位移/突进技能决策分支：挡：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间推：抓落单时把目标推向队友方向…"}, {"id": "K-A03", "cat": "A", "title": "被动是资源，不是保命符", "self": "<h3><a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 被动是资源，不是保命符<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每次准备进场前<\/li><li><strong>判断依据<\/strong>：被动是否可用（有 / 无）；队友是否在附近能\"点灯\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有被动 → 可以硬吃一波伤害，打出被动后还能给附近的双 C 回血<\/li><li>无被动 → <strong>不许硬接<\/strong>，只能打边缘消耗<\/li><li><strong>反例<\/strong>：「我是肉辅，先冲进去扛」——没被动时苏烈就是一个普通近战，进去等于送人头。字幕里出现过\"没点到灯，不然可以二技能跑\"，说明<strong>被动依赖队友点亮<\/strong>，队友不在时它根本不算数。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:00；BV1yke26fEYB @ 04:14；BV1yke26fEYB @ 06:31<\/li><li><strong>可信度<\/strong>：中高（\"点灯\"细节来自实战解说，非二手攻略）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A04\">K-A04<\/a> 前期不要抢打野的尾刀<\/h3>\n<p>这条<strong>跟苏烈无关<\/strong>，是游走通用纪律，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code>。原来源 BV1yke26fEYB @ 02:28 一并带过去。<\/p>\n<h2>4. 出装与铭文（两套，按位置选）<\/h2>\n<p><strong>打对抗路（边路）<\/strong><\/p>\n<ul><li>铭文：<strong>10 狩猎 + 10 鹰眼 + 10 异变<\/strong>（\"百穿\"，狩猎是为了保攻速）<\/li><li>出装：对线强 → 先荆棘护手；对线不强 → 攻速鞋 → <strong>第二件必出暗影战斧<\/strong>（给 CD + 穿透 + 输出）→ 荆棘护手升反甲<\/li><li>来源：BV1BpdNYZEYj @ 04:54、@ 03:56、@ 04:11<\/li><\/ul>\n<p><strong>打游走（辅助）<\/strong><\/p>\n<ul><li>铭文：<strong>10 宿命 + 5 狩猎 + 5 调和 + 10 虚空<\/strong>（苏烈要兼顾开团，移速和坦度都得有）<\/li><li>出装：前期疾跑鞋（方便支援）→ 中后期换抵抗之靴（提高容错）；辅助装按对局选（射手需要主动上前时先做星泉）<\/li><li>来源：BV17Vp9zXEx2 @ 01:10、@ 01:17、@ 01:32<\/li><\/ul>\n<p><strong>两条共同点<\/strong>：都不是\"堆输出\"的思路，铭文都在补攻速/移速/坦度，因为苏烈的核心是<strong>把控制打出来<\/strong>，不是自己打伤害。<\/p>\n<ul><li>版本提示：两条素材都未标 S45（浩克是训练营通用向、云兽是解析 AG 大帅的职业打法），<strong>具体装备数值以游戏内为准<\/strong>，配置结构可直接照用。<\/li><\/ul>\n<h2>5. 全局思路（辅助位）<\/h2>\n<blockquote><p><strong>分路层面<\/strong>的通用做法（开局去哪、怎么帮中、怎么跟射手）已统一收进 <code>L_分路/02_游走.md<\/code>，这一节只留苏烈自己的东西。<\/p><\/blockquote>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A05\">K-A05<\/a> 开局：连人带兵一起消耗，而不是单纯抢线<\/h3>\n<p>这是<strong>游走通用动作<\/strong>（任何有消耗手段的辅助都该这么打），已迁到 <code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code>。<\/p>", "sum": "这条跟苏烈无关，是游走通用纪律，已迁到 L_分路/02_游走.md 的 K-L13。"}, {"id": "K-A06", "cat": "A", "title": "被动要主动用，别舍不得", "self": "<h3><a class=\"kref\" href=\"#K-A06\">K-A06<\/a> 被动要主动用，别舍不得<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：有被动且能吃一波关键伤害<\/li><li><strong>判断依据<\/strong>：这波吃了之后，队友能不能跟着打赢<\/li><li><strong>决策分支<\/strong>：该触就触；触发后给附近双 C 回血，是团队收益<\/li><li><strong>反例<\/strong>：「留着被动保命」——原话直接说\"很多苏烈会舍不得触发被动，这点是错误的\"。<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:32<\/li><li><strong>可信度<\/strong>：高（与原 <a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 一致，互为印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：有被动且能吃一波关键伤害判断依据：这波吃了之后，队友能不能跟着打赢决策分支：该触就触；"}, {"id": "K-A07", "cat": "A", "title": "开团前必须和队友沟通好\"帮你踩灯\"", "self": "<h3><a class=\"kref\" href=\"#K-A07\">K-A07<\/a> 开团前必须和队友沟通好\"帮你踩灯\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备先手开团<\/li><li><strong>判断依据<\/strong>：周围有没有队友能点亮你的被动<\/li><li><strong>决策分支<\/strong>：先打字/信号确认，再开团；没人踩灯就不要主动吃伤害<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:07<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 新手最容易崩在哪一步<\/h2>\n<ul><li><strong>在第 0 步（确认被动）上<\/strong>：忘记看被动，进场被判死一次之后整局都不敢开团，从\"开节奏\"退化成\"挂机跟团\"。<\/li><li><strong>在第 3 步（三棍）上<\/strong>：打两棍就急着交二技能，第三段击飞永远打不出来——苏烈的控制全在第三棍上。<\/li><\/ul>\n<h2>5. 待补<\/h2>\n<ul><li>具体数值（被动冷却、大招蓄力时长、二技能距离）<strong>未从素材中获得<\/strong>，需官网英雄页核对后补。<\/li><li>对抗路/辅助两套配置已补（见第 4 节），但都未标 S45，数值需游戏内核对。<\/li><li>强势期/弱势期缺素材（该视频是顺风局，看不出逆风时苏烈的下限）。<\/li><\/ul>", "sum": "触发条件：准备先手开团判断依据：周围有没有队友能点亮你的被动决策分支：先打字/信号确认，再开团；"}], "b": [{"id": "K-B01", "cat": "B", "title": "对孙策：机制克——二技能能挡下他的船", "self": "<h3><a class=\"kref\" href=\"#K-B01\">K-B01<\/a> 对孙策：机制克——二技能能挡下他的船<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：孙策（开大冲脸）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong><\/li><li><strong>我该怎么做<\/strong>：孙策开大的一瞬间，把二技能放在<strong>他和自家 C 位之间<\/strong>，用身位当墙。挡下来之后不要追，退回 C 位旁边。<\/li><li><strong>反向反制<\/strong>：孙策可以等你二技能交完再开船；所以<strong>二技能不要提前交在别的地方<\/strong>。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中（单来源实战解说）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：孙策（开大冲脸）克制层级：机制克我该怎么做：孙策开大的一瞬间，把二技能放在他和自家 C 位之间，用身位当墙。", "opp": "孙策"}, {"id": "K-B02", "cat": "B", "title": "对云缨：她的霸体期间你什么都做不了，等结束再推", "self": "<h3><a class=\"kref\" href=\"#K-B02\">K-B02<\/a> 对云缨：她的霸体期间你什么都做不了，等结束再推<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：云缨（大招霸体）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>苏烈被克<\/strong>，不是克别人<\/li><li><strong>我该怎么做<\/strong>：云缨开大期间不要试图控制她，<strong>等霸体结束<\/strong>再往队友方向推。<\/li><li><strong>反例<\/strong>：「我是硬辅，控住就行」——霸体期间控制无效，你的三棍和大招全部白交，还把自己留在她身边。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:55；BV1yke26fEYB @ 04:57<\/li><li><strong>可信度<\/strong>：中高（解说里明确说了\"他的大招有霸体，插不了火，等他结束往宫本那边推\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>苏烈怕哪些远程消耗型辅助（无素材）<\/li><li>苏烈对软辅（大乔、蔡文姬类）的压制关系（无素材）<\/li><li>以上两条需要专门的\"对位\"视频，<code>B_克制关系/_说明.md<\/code> 已记门槛<\/li><\/ul>", "sum": "适用版本：S45针对对手：云缨（大招霸体）克制层级：机制克（反向）——这条是苏烈被克，不是克别人我该怎么做：云缨开大期间不要试图控制她，等霸体结束再往队友方向推。", "opp": "云缨"}], "lanes": ["roam"], "n": 7, "b_n": 2, "vs": ["云缨", "孙策"], "incoming": [], "lane_names": ["游走"]}, {"name": "女娲", "hue": 123, "a": [{"id": "K-A71", "cat": "A", "title": "女娲前期没有线权，别抢", "self": "<h3><a class=\"kref\" href=\"#K-A71\">K-A71<\/a> 女娲前期没有线权，别抢<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：开局对线<\/li><li><strong>判断依据<\/strong>：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）<\/li><li><strong>决策分支<\/strong>：<\/li><li>抢不过 → 一技能丢四个兵就往后走，<strong>保血线<\/strong><\/li><li>抢得过 → 正常推，但别越塔<\/li><li><strong>反例<\/strong>：「中单必须抢线」——女娲前期 CD 长、伤害低，被打掉状态后连野区防守都参与不了。<\/li><li><strong>通用面<\/strong>：「线权看对面清线速度」本身是中路通用判据，见 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。这条留在英雄卡里的部分只有<strong>女娲自己的强度曲线<\/strong>（前期 CD 长、伤害低）。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 02:41<\/li><li><strong>可信度<\/strong>：高（原话直接给了判断与后果）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：开局对线判断依据：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）决策分支：抢不过 → 一技能丢四个兵就往后走，保血线抢得过 → 正常推，但别越塔反例：「中单必须抢线」——女娲前…"}, {"id": "K-A72", "cat": "A", "title": "支援靠三技能，但传送会被打断", "self": "<h3><a class=\"kref\" href=\"#K-A72\">K-A72<\/a> 支援靠三技能，但传送会被打断<\/h3>", "ht ong>：女娲最强的用法是\"传侧面打后排\"，站正面输出等于浪费被动。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>完整六件套顺序。<\/li><li>S45 版本是否调整过被动/施法距离成长。<\/li><li>对位结论（现无 <code>B_克制关系/女娲.md<\/code>；已有海月视角一条，可补反向）。<\/li><\/ul>", "sum": "触发条件：任何要打控制链的时刻判断依据：当前场上还有几个方块（可存 3 个）决策分支：有 2 个 → 合长方形夹人有 4 个 → 合大正方形封路反例：「方块丢出去就行」——不会合的方块只是占位…"}], "b": [{"id": "K-B04", "cat": "B", "title": "对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来", "self": "<h3><a class=\"kref\" href=\"#K-B04\">K-B04<\/a> 对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月（中路对线）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>女娲被克<\/strong>。国服海月原话：<strong>「海月对线女娲八二开」<\/strong>。<\/li><li><strong>为什么是机制克<\/strong>（三层，缺一层这条就不成立）：<\/li><\/ul>\n<ol><li><strong>线权差<\/strong>：海月三个一技能光速清掉第一波兵，女娲前期清线慢，<strong>先手权在她手上<\/strong>。<\/li><li><strong>你的控制被免疫<\/strong>：海月有免控，能直接躲掉女娲一技能的击退（<code>BV1K8gDzwEho @ 02:00<\/code>）。<\/li><li><strong>你的保命被废<\/strong>：女娲唯一的位移是三技能传送，<strong>读条中被打断就走不掉<\/strong>（见 A 卡第 2 节）；海月大招把人拉走单挑，女娲在幻境里没有位移可用。<\/li><\/ol>\n<ul><li><strong>我该怎么做<\/strong>（可执行，不是「小心点」）：<\/li><li><strong>不在正面单走<\/strong>。中期海月不站正面、专门找「意想不到的位置」单杀落单的人（<code>@ 02:10<\/code>、<code>@ 02:17<\/code>）。女娲清线、补刀都要贴着队友或塔。<\/li><li><strong>一技能别当唯一控制用<\/strong>。她免控能吃掉你的击退，指望「一推→大」这套接死海月是错的——推不到，大招就是空。<\/li><li><strong>记她大招<\/strong>。她大招拉到谁都是赚（<code>@ 02:41<\/code>「只要能打出持续掉点，拉谁都是一样的」）。她大交了，才是女娲进场的窗口。<\/li><li>自己的大招是<strong>全图<\/strong>的：她要单杀你就得脱离阵型，这时候用大招支援被拉走/被追的队友，比跟她对拼划算。<\/li><li><strong>反向反制（她的破绽）<\/strong>：海月单杀依赖大招，<strong>大招 CD 期间她只是一个有线权的法师<\/strong>，没有硬控逃生；女娲可以趁这段用二技能墙封她退路，配合打野抓。<\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:00；BV1K8gDzwEho @ 02:00；BV1K8gDzwEho @ 02:10；BV1K8gDzwEho @ 02:41<\/li><li><strong>可信度<\/strong>：中高（对手视角的原话 + 实战演示，两段互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月（中路对线）克制层级：机制克（反向）——这条是女娲被克。", "opp": "海月"}, {"id": "K-B05", "cat": "B", "title": "对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判", "self": "<h3><a class=\"kref\" href=\"#K-B05\">K-B05< /li><li><strong>大招空拉<\/strong>：1.25 秒吟唱期间对面只要走两步就空，所以没有先手控就别开。<\/li><li><strong>不带射手转线<\/strong>：只在中路晃，等于把二技能最强的用法扔了。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>出装铭文（见上）。<\/li><li>弹弓流等组合技的具体搭档与条件。<\/li><li>对位结论（现无 <code>B_克制关系/鲁班大师.md<\/code>）。<\/li><\/ul>", "sum": "未取到干净数据。"}], "b": [], "lanes": ["roam"], "n": 3, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}, {"name": "小乔", "hue": 293, "a": [{"id": "K-A21", "cat": "A", "title": "二技能要放到\"他要去的地方\"，不是\"他在的地方\"", "self": "<h3><a class=\"kref\" href=\"#K-A21\">K-A21<\/a> 二技能要放到\"他要去的地方\"，不是\"他在的地方\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何要交二技能的瞬间<\/li><li><strong>判断依据<\/strong>：目标当前是否在朝某个方向移动（追击、后撤、绕塔）<\/li><li><strong>决策分支<\/strong>：<\/li><li>在移动 → 落点放到他行进路线前端一个身位<\/li><li>原地站桩输出 → 直接放脚下<\/li><li><strong>反例<\/strong>：「二技能空放是手残」——多数空放是\"瞄当前位置\"导致的，不是手残。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:51<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：任何要交二技能的瞬间判断依据：目标当前是否在朝某个方向移动（追击、后撤、绕塔）决策分支：在移动 → 落点放到他行进路线前端一个身位原地站桩输出 → 直接放脚下反例：「二技能空放是手残…"}, {"id": "K-A22", "cat": "A", "title": "打野先手开团时，小乔的大招是\"必中\"的", "self": "<h3><a class=\"kref\" href=\"#K-A22\">K-A22<\/a> 打野先手开团时，小乔的大招是\"必中\"的<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方打野先手切入（尤其是有减速/控制的打野）<\/li><li><strong>判断依据<\/strong>：对面是否正在集火己方打野（站位会聚成一团）<\/li><li><strong>决策分支<\/strong>：直接大招进场压伤害 → 接一技能压状态<\/li><li><strong>反例<\/strong>：「法师要站后排安全输出」——这一波对面已经聚在一起，你的大招收益远大于你多站两秒。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 05:13（\"打野如果开先手……我们直接大招跑过去，技能是必中的\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A23\">K-A23<\/a> 中路有没有线权，看的是\"对面清线速度\"，不是你的血线<\/h3>\n<p>这是<strong>中路通用判据<\/strong>，换任何法师都成立，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。<\/p>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A24\">K-A24<\/a> 一技能蹭野怪：中路顺路的经济，别用普攻<\/h3>\n<p>这是<strong>中路通用动作<\/strong>（\"顺路蹭、别站桩\"），已迁到 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>。小乔的特殊点只有\"一技能边缘能摸到野怪\"这种手感层面，不构成独立判断。<\/p>\n<h2>4. 出装与铭文<\/h2>\n<p><strong>具体铭文组合：未取到干净数据。<\/strong><\/p>\n<p>原因写清楚，免得下次重复踩：标题带\"铭文出装\"的视频（BV1vA411v7C5、BV17s411h76U 等）<strong>字幕轨是错的内容<\/strong>——有的是职场访谈，有的是 LoL 局，说明 ASR 对这类视频根本没有可用语音轨；简介里也没写具体搭配。按规矩，没有原文就不写。<\/p>\n<p><strong>能确认的只有思路层面<\/strong>：小乔是标准 AP 消耗型法师，出装要围绕\"法强 + 法术穿透 + 少量移速\"，对面魔抗堆起来之前先做法穿，魔抗堆起来之后再补穿透类装备。<\/p>\n<ul><li>待补：S45 六件套顺序、铭文红蓝绿配置。补法见本文件末尾。<\/li><\/ul>\n<h2>5. 最容易崩的地方<\/h2>\n<ol><li><strong>把二技能当输出<\/strong>：它只有很短的控制，伤害靠一技能和大招。二技能用空了不可怕，用它换掉对面的关键位移才值。<\/li><li><strong>没线权硬推线<\/strong>：被卡在中路，两边都支援不了，这是小乔最常见的死法。<\/li><li><strong>大招当保命<\/strong>：大招位移很短，交出去之后你就是个站桩法师。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li>出装铭文（见上，需要看画面帧或官网核对）。<\/li><li>与具体英雄的对位结论（现无 <code>B_克制关系/小乔.md<\/code>）。<\/li><\/ul>", "sum": "这是中路通用判据，换任何法师都成立，已迁到 L_分路/01_中路.md 的 K-L01。"}], "b": [], "lanes": ["mid"], "n": 2, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "王维", "hue": 273, "a": [], "b": [{"id": "K-B03", "cat": "B", "title": "对嫦娥：一级打不过，别抢线", "self": "<h3><a class=\"kref\" href=\"#K-B03\">K-B03<\/a> 对嫦娥：一级打不过，别抢线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嫦娥（中路）<\/li><li><strong>克制层级<\/strong>：<strong>节奏克<\/strong>（王维一级弱势，嫦娥一级能压）<\/li><li><strong>我该怎么做<\/strong>：<\/li><li>一技能<strong>只打后排兵<\/strong>，不打人<\/li><li>目的不是消耗，是<strong>防止被卡线掉状态<\/strong><\/li><li>一旦掉状态就退回塔后，交给 <code>D_对局内/04_对线期.md<\/code> 的 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 处理<\/li><li><strong>反向反制<\/strong>：这条只在一级成立。王维是\"弱前期强后期\"型，<strong>撑过前期后对位关系会反转<\/strong>——不要在 3 级后还按\"打不过\"处理。<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:23；BV15EJk6fEwX @ 00:27；BV15EJk6fEwX @ 00:30<\/li><li><strong>可信度<\/strong>：中（单来源，且 UP 主只给了\"对面是嫦娥\"这一个样本）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>王维克谁（素材只讲了对嫦娥被压这一侧）<\/li><li>王维对其他强势中路（如不知火舞类突进）的表现<\/li><\/ul>", "sum": "适用版本：S45针对对手：嫦娥（中路）克制层级：节奏克（王维一级弱势，嫦娥一级能压）我该怎么做：一技能只打后排兵，不打人目的不是消耗，是防止被卡线掉状态一旦掉状态就退回塔后，交给 D_对局内/…", "opp": "嫦娥"}], "lanes": [], "n": 1, "b_n": 1, "vs": ["嫦娥"], "incoming": [], "lane_names": []}, {"name": "盾山", "hue": 59, "a": [{"id": "K-A52", "cat": "A", "title": "修塔是被低估的技能", "self": "<h3><a class=\"kref\" href=\"#K-A52\">K-A52<\/a> 修塔是被低估的技能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：己方塔被磨、需要拖时间<\/li><li><strong>判断依据<\/strong>：塔的血量与对面推进速度<\/li><li><strong>决策分支<\/strong>：修塔给塔加护盾（约 600 点量级），换取一波兵线时间<\/li><li><strong>来源<\/strong>：BV13E411p7HY @ 07:06<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A53\">K-A53<\/a> 盾山吃\"沟通\"，不吃操作上限<\/h3>\n<p>开团前确认队友跟不跟，是<strong>所有开团型游走的通用纪律<\/strong>，已迁到 <code><a class=\"kref\" href=\"#K-L17\">K-L17<\/a><\/code>。原句里\"盾山胜率不高是因为队友不了解他\"属于英雄普及度问题，不构成判断。<\/p>\n<h2>6. 待补<\/h2>\n<ul><li>S45 攻速阈值是否变化（铭文那套是 2020 年的）。<\/li><li>完整六件套顺序（素材只给了分场景的出装原则，没有完整列表）。<\/li><li>盾山与鲁班/黄忠/嬴政的对位结论，应整理进 <code>B_克制关系/盾山.md<\/code>。<\/li><\/ul>", "sum": "开团前确认队友跟不跟，是所有开团型游走的通用纪律，已迁到 K-L17。"}], "b": [], "lanes": ["roam"], "n": 1, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["游走"]}], "general": [{"key": "D", "cat": "对局内", "title": "主线地图", "file": "00_主线地图.md", "intro": "<p>读完这一页，你应该知道<strong>这局该按什么顺序想事<\/strong>，而不是\"有多少个知识点\"。<\/p>\n<h2>决策主线（节间依赖）<\/h2>\n<pre><code>01 选人 ──► 02 开局前90秒 ──► 03 前四分钟 ──► 04 对线期 ──► 05 第一波转线\n                                                              │\n05 ──► 06 中期资源 ──► 07 团战 ──┬──► 08 顺风推进 ──┐\n              ▲                  └──► 09 逆风止损 ──┴──► 10 终结比赛\n              │\n     04 ─(无对线权且持续到4分钟，直接跳 09)─┘<\/code><\/pre>\n<p>实线是正常推进；<strong>04 → 09 这条斜边是\"跳节\"路径<\/strong>——对线期就崩了的话，05、06、07 全部不成立，要直接进止损逻辑。清单式知识库给不出这条边。<\/p>\n<h2>每节回答的问题<\/h2>\n<div class=\"tw\"><table><thead><tr><th>节<\/th><th>只回答这一个决定<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>01 选人<\/td><td>我拿什么英雄，取决于对面已经选了什么<\/td><td>待写（前提\"中野辅版本\"已写进 02）<\/td><\/tr><tr><td><strong>02 开局前90秒<\/strong><\/td><td><strong>第一步我站在哪<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>03 前四分钟<\/strong><\/td><td><strong>第一条龙我争不争<\/strong><\/td><td>✅ 已完成（5 条）<\/td><\/tr><tr><td><strong>04 对线期<\/strong><\/td><td><strong>这波线清完，我该往哪走<\/strong><\/td><td>✅ 已完成<\/td><\/tr><tr><td>05 第一波转线<\/td><td>我动起来之后，先去哪一路<\/td><td>待写<\/td><\/tr><tr><td>06 中期资源<\/td><td>下一个资源点该不该争<\/td><td>待写<\/td><\/tr><tr><td>07 团战<\/td><td>这波团我该站在哪、什么时候进<\/td><td>待写<\/td><\/tr><tr><td>08 顺风推进<\/td><td>拿到优势后，先推塔还是先控野<\/td><td>待写<\/td><\/tr><tr><td>09 逆风止损<\/td><td>打不过的时候，损失怎么止住<\/td><td>待写<\/td><\/tr><tr><td>10 终结比赛<\/td><td>怎么把优势变成水晶<\/td><td>待写<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>编号说明<\/strong>：<code>K-Dxx<\/code> 按<strong>入库顺序<\/strong>排，不按节号。所以 04 的条目是 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a>~D08，02 的条目是 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>~D13，03 的是 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>~D18——查条目时不要按节号推编号。<\/p>\n<h2>全库底层判据（压过所有技巧性结论）<\/h2>\n<p><strong>判断\"能不能打\"，看的是「战斗力差 × 能不能及时到达」，不是经济差。<\/strong><\/p>\n<ul><li>经济差只是战斗力差的一种来源，不是唯一来源。<\/li><li>信息不足时，先问\"我到得了吗\"，再问\"我打得过吗\"。<\/li><li>这条来自 <code>BV1i2n96AEvp @ 02:31<\/code>，原文：\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/li><\/ul>\n<h2>读这套东西的正确姿势<\/h2>\n<ol><li>先看当前局的<strong>时间点<\/strong>，定位到哪一节；<\/li><li>读那节的\"判断树\"，找自己正卡在哪个判据上；<\/li><li>只看那个判据对应的 K 条目，不要通读；<\/li><li>条目里的\"反例\"比\"结论\"更值钱——那是别人踩过的坑。<\/li><\/ol>\n<h2>三条写作硬规矩（新增内容必须遵守）<\/h2>\n<ol><li><strong>文件名是一个\"决定\"，不是话题。<\/strong> 不许出现\"英雄\"\"铭文\"\"出装\"这类名词短语。<\/li><li><strong>每节第一节必须是\"上一节留下的问题\"<\/strong>，且点名上一节哪个分支留下了它。断链的节不许存在。<\/li><li><strong>易错点按环节归位，不单列。<\/strong> 禁止\"本节易错点：①②③\"，错必须挂在它所属的判断节点下。<\/li><\/ol>", "entries": []}, {"key": "D", "cat": "对局内", "title": "02 开局前90秒：第一步我站在哪", "file": "02_开局前90秒.md", "intro": "<blockquote><p><strong>依赖<\/strong>：01 选人（尚未写）——它要交出的是\"这局前期以谁为核心\" <strong>被依赖<\/strong>：03 前四分钟（本节产出的\"第一步站位\"决定了第一波线谁先到、谁先有线权）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>01 选人还没写成条目，但它必须回答的问题是：<strong>这局前期该围绕谁打？<\/strong><\/p>\n<p>这一节不等 01 写完就先给出当前版本的主流答案——素材里的原话是：<\/p>\n<blockquote><p>「双方中路小乔和嫦娥……在这个中野辅的版本，我们这局前期要以野中为合，保证宫本的野区节奏以及小乔的中线权。」<\/p><\/blockquote>\n<p>也就是说，<strong>S45 的默认答案是\"野 + 中\"<\/strong>，不是任何一个单独的人。这个默认值有两个例外（见判断树），例外只看一件事：<strong>我方打野一级能不能动对面野区<\/strong>。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>读条结束那 20 秒，我第一步往哪走？<\/strong><\/p>\n<p>不是\"我要不要反野\"（那是打野的事），是<strong>\"我这一步走出去，会不会让本局的核心（野或中）多出一次机会\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>读条结束前，先答一个问题：我方打野一级能不能动对面野区？\n│\n├─ 能（打野是强反型 / 有惩戒优势 / 对面打野一级弱）\n│   → 本局核心 = 打野的野区节奏\n│   ├─ 我是辅助 → 去对抗路抢线权，抢完直接协同进野区   【K-D10】\n│   ├─ 我是中路 → 兵线交汇立刻清，清完帮看另一片野区   【K-D11】\n│   └─ 我是对抗路 → 一级先上手，把对面边路钉在线上     【K-D13】\n│\n└─ 不能（打野一级弱 / 对面打野压制）\n    → 本局核心 = 中路线权\n    ├─ 我是辅助 → 回中帮清，把中线权保住               【K-D10 分支 B】\n    ├─ 我是中路 → 不硬抢 2v2，改成\"清完就走\"           【K-D11 分支 B】\n    └─ 我是边路 → 只做安全对线，不主动换血             【K-D13】\n\n无论哪支：一级出现击杀窗口（对面边路走位冒进）→ 先拿一血，拿不到立刻转野区 【K-D13】<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>我方打野一级强度<\/td><td>英雄本身（能否强反/双惩戒）<\/td><td>能与不能<\/td><td>根的第一次分叉<\/td><\/tr><tr><td>对面打野一级强度<\/td><td>同上<\/td><td>比我方弱 → 能反<\/td><td>同上<\/td><\/tr><tr><td>中路 2v2 强度<\/td><td>双方中单+辅助的清线速度<\/td><td>明显打不过<\/td><td><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 分支 B<\/td><\/tr><tr><td>对面边路是否\"皮\"（敢出塔）<\/td><td>一级 30 秒内的站位<\/td><td>出塔且我方有控制<\/td><td><a class=\"kref\" href=\"#K-D13\">K-D13<\/a><\/td><\/tr><tr><td>打野是否已出野刀<\/td><td>装备栏<\/td><td>未出 → 尾刀让<\/td><td><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 的细节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D09", "cat": "D", "title": "开局的默认核心是「野 + 中」，不是任何一个人", "self": "<h3><a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 开局的默认核心是「野 + 中」，不是任何一个人<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）；S46 待复核<\/li><li><strong>触发条件<\/strong>：读条结束，全队要定第一步<\/li><li><strong>判断依据<\/strong>：版本节奏（中野辅）+ 双方阵容<\/li><li><strong>决策分支<\/strong>：<\/li><li>默认 → 所有开局动作服务于两件事：<strong>打野的野区节奏 + 中单的中线权<\/strong><\/li><li>只有当打野一级完全动不了野区时（见判断树），核心才切到\"中路线权\"单点<\/li><li><strong>反例<\/strong>：「开局各走各的，辅助跟射手、边路自己发育」——这类打法在\"中野辅\"版本里等于主动放弃前两条资源。素材原话把这条定为<strong>开局分析的第一句<\/strong>，位置在\"谁拿一血\"之前。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D10\">K-D10<\/a>、<a class=\"kref\" href=\"#K-D11\">K-D11<\/a>、<a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:34；BV1yke26fEYB @ 00:38；BV1yke26fEYB @ 00:40<\/li><li><strong>可信度<\/strong>：中高（职业向全局教学的定调句，且后续所有动作都与它自洽）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）；"}, {"id": "K-D10", "cat": "D", "title": "打野要偷野时，辅助去的是对抗路，不是中路也不是发育路", "self": "<h3><a class=\"kref\" href=\"#K-D10\">K-D10<\/a> 打野要偷野时，辅助去的是对抗路，不是中路也不是发育路<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局确认打野要偷对面野区<\/li><li><strong>判断依据<\/strong>：打野进草等对面动向（能不能偷成）；对抗路我方是否有先手<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷 → <strong>去对抗路抢线权<\/strong>，抢完带着边路一起进野区<\/li><li>打野不偷 → 回中帮清（分支 B）<\/li><li><strong>反例<\/strong>：「辅助开局跟射手」——这是四个判据里排第三的一条（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>），不是第一条。开局直接去发育路，等于放弃野区节奏。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>（核心是野区）；与 <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code> 是同一条判据的位置级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:52；BV1yke26fEYB @ 00:54；BV1yke26fEYB @ 01:29<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局确认打野要偷对面野区判断依据：打野进草等对面动向（能不能偷成）；"}, {"id": "K-D11", "cat": "D", "title": "中路 2v2 打不过就不要抢，改去帮看野区", "self": "<h3><a class=\"kref\" href=\"#K-D11\">K-D11<\/a> 中路 2v2 打不过就不要抢，改去帮看野区<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级中路 2v2，我方清线明显慢<\/li><li><strong>判断依据<\/strong>：双方中单+辅助的清线速度差（一个技能能不能清完一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>打不过 → <strong>不硬抢<\/strong>，把中线放掉，转去另一片野区看一眼（对面打野动不动我们的红/蓝）<\/li><li>抢得过 → 立刻清完，清完立刻走（<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢不过还去抢，是把自己钉在中路挨打，同时野区被反了也没人看。素材里这一波的处理就是\"中路抢线 2V2 打不过对面的组合 → 要协同打野的反野，就得去另外一边拿线权\"。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；与 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code> 互为位置级/环节级版本<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:31；BV1yke26fEYB @ 01:33；BV1yke26fEYB @ 01:34<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级中路 2v2，我方清线明显慢判断依据：双方中单+辅助的清线速度差（一个技能能不能清完一波）决策分支：打不过 → 不硬抢，把中线放掉，转去另一片野区看一眼（对面打野…"}, {"id": "K-D12", "cat": "D", "title": "反完野的 30 秒，是给打野提速的窗口", "self": "<h3><a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 反完野的 30 秒，是给打野提速的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：我方反野成功、对面野区清完<\/li><li><strong>判断依据<\/strong>：打野野区里还剩几组野；打野有没有出野刀<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野野区里有剩 → <strong>立刻过去帮打<\/strong>（三组小野一起提速），尾刀不抢<\/li><li>打野已清空 → 回中线，不要陪他蹲<\/li><li><strong>反例<\/strong>：「反完野就去帮下路」——反野换来的经济优势只有在他把自家野也吃完时才成立。你走了，他一个人清三组野，优势就摊薄了。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；尾刀细节见 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code><\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:16；BV1yke26fEYB @ 02:25；BV1yke26fEYB @ 02:27；BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：我方反野成功、对面野区清完判断依据：打野野区里还剩几组野；"}, {"id": "K-D13", "cat": "D", "title": "一级的一血窗口只看一件事：对面边路敢不敢出塔", "self": "<h3><a class=\"kref\" href=\"#K-D13\">K-D13<\/a> 一级的一血窗口只看一件事：对面边路敢不敢出塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局 0–60 秒，边路第一次兵线交汇<\/li><li><strong>判断依据<\/strong>：对面边路站位是否越过自家塔前；我方有没有硬控（如带晕眩的边路）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他出塔且我方有控 → <strong>打<\/strong>，这是开局性价比最高的一次击杀<\/li><li>他稳在塔后 → 立刻转\"快速抢线 + 进野区\"，不要在线上磨<\/li><li>偷野被对面发现 → <strong>不打了，直接快速抢线转进野区<\/strong>（原话：被发现了，那就直接快速抢线，带着队友去进对面野区）<\/li><li><strong>反例<\/strong>：「一级要稳」——一级恰恰是唯一\"对面还没有技能\"的窗口，稳到二级，这个机会就永久消失。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D09\">K-D09<\/a>；被 <a class=\"kref\" href=\"#K-D12\">K-D12<\/a> 依赖（一血拿不到 → 转反野）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:59；BV1yke26fEYB @ 01:01；BV1yke26fEYB @ 01:40；BV1yke26fEYB @ 01:42<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「核心定给谁」上<\/strong>：人会跳过这一步，直接按自己的习惯走位（辅助跟射手、边路单带），结果前 90 秒全队四条线各打各的，一个资源都没拿到。<\/li><li><strong>在节点「打野能不能动野区」上<\/strong>：人会默认\"我的打野很强\"，不去看双方一级强弱，于是辅助白跑一趟对抗路，野区还是没反成。<\/li><li><strong>在节点「一血窗口」上<\/strong>：人会因为\"这波不一定杀得掉\"而放弃，转而去清兵——但清兵的收益是确定的、随时都有的，一血窗口不是。<\/li><li><strong>在节点「被发现了怎么办」上<\/strong>：人会继续蹲，怕浪费这一趟。原话的处理是立刻转\"抢线 + 进野区\"，把偷换成明抢。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><strong>\"中野辅版本\"这个前提本身没有版本号<\/strong>。素材是 S45 区间录的，但 UP 主说的是\"这个中野辅的版本\"，属于体感表述。S46 若节奏改动，<a class=\"kref\" href=\"#K-D09\">K-D09<\/a> 要重审。<\/li><li><strong>射手视角缺失<\/strong>：本节五路里，发育路的分支（\"边路只做安全对线\"）是从辅助视角反推的，没有射手第一视角素材验证（见 <code>L_分路/03_发育路.md<\/code> 的缺口说明）。<\/li><li>一级一血窗口的判据只有一条边路样本（孙策 vs 关羽），换阵容是否成立未验证。<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局 0–60 秒，边路第一次兵线交汇判断依据：对面边路站位是否越过自家塔前；"}]}, {"key": "D", "cat": "对局内", "title": "03 前四分钟：第一条龙我争不争", "file": "03_前四分钟.md", "intro": "<blockquote><p><strong>依赖<\/strong>：02 开局前90秒（结论：第一步站位由\"本局核心是野还是中\"决定） <strong>被依赖<\/strong>：04 对线期（本节产出的\"我还在不在场上、状态够不够\"是 04 判断树里 A2 分支的输入）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>02 只解决了\"第一步站哪\"，它留下的是：<strong>如果第一步没换到东西（一血没拿到、野没反成），接下来这三分钟怎么过？<\/strong><\/p>\n<p>答案不是\"补回来\"，而是先把一个事实接住：<strong>前四分钟逆风是常态，不是失误。<\/strong> 素材里这一局在 3 分钟就已经 3v4 团灭过一次，原话是\"前期逆风很正常\"。<\/p>\n<p>这一节要回答的，就是逆风之后第一个资源点该怎么处理。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>4 分钟第一个资源点刷新，我这一波是去打，还是放？<\/strong><\/p>\n<p>不是\"怎么打赢这波团\"，是<strong>\"我这波有没有资格站进去\"<\/strong>。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>资源点（4 分钟）刷新前 15 秒，清点自己这一侧的家底\n│\n├─ 我的\"一次性资源\"还在吗？（被动 / 大招 / 闪现）\n│   ├─ 不在 → 【K-D15】放。别硬接，用这 40 秒去换别的东西\n│   └─ 在 → 进下一判据\n│\n├─ 我方场上人数够吗？（刚复活的人能不能赶上）\n│   ├─ 少人 → 【K-D15】放。少一个人不是\"勉强能打\"，是\"必定打输\"\n│   └─ 齐 → 进下一判据\n│\n├─ 我方站位先到吗？（谁先占住龙坑侧的草）\n│   ├─ 我方先到 → 【K-D16】争。先到的人决定这波团的形状\n│   └─ 对面先到 → 不硬冲，改成\"等他们打完/换另一侧资源\"【K-D17】\n│\n└─ 以上任一条判\"放\"→ 复活/回线后的第一步，不要回自己的线\n    → 【K-D18】先看小地图：谁在哪、谁状态不好<\/code><\/pre>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>一次性资源<\/td><td>被动图标 / 大招 CD / 闪现<\/td><td>有 / 无<\/td><td>第一个分叉<\/td><\/tr><tr><td>场上人数<\/td><td>复活计时 + 小地图<\/td><td>我方 &lt; 对面<\/td><td>第二个分叉<\/td><\/tr><tr><td>龙坑侧草的归属<\/td><td>小地图视野<\/td><td>我方先占<\/td><td>第三个分叉<\/td><\/tr><tr><td>对面清完中线后的转向<\/td><td>兵线位置 + 小地图<\/td><td>大概率转向资源点<\/td><td><a class=\"kref\" href=\"#K-D17\">K-D17<\/a><\/td><\/tr><tr><td>自己复活后的位置<\/td><td>小地图<\/td><td>谁在附近、谁状态差<\/td><td><a class=\"kref\" href=\"#K-D18\">K-D18<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D14", "cat": "D", "title": "前四分钟的逆风是常态，不要在落后时硬接团", "self": "<h3><a class=\"kref\" href=\"#K-D14\">K-D14<\/a> 前四分钟的逆风是常态，不要在落后时硬接团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：前四分钟内我方被团灭过一次 / 经济落后<\/li><li><strong>判断依据<\/strong>：落后量（一个人头以内算正常）+ 我方一次性资源是否还在<\/li><li><strong>决策分支<\/strong>：<\/li><li>落后但资源在 → 只打\"对面先交技能\"的团，不主动开<\/li><li>落后且资源不在 → 完全不打，先发育<\/li><li><strong>反例<\/strong>：「落后就要打回来」——前四分钟的经济差通常不到 500，硬接一次团灭会直接变成 2000，这才是真正拉开差距的地方。<\/li><li><strong>依赖<\/strong>：无；被 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:06；BV1yke26fEYB @ 03:08；BV1yke26fEYB @ 04:17<\/li><li><strong>可信度<\/strong>：中高（UP 主在团灭后立刻给出这句定调，并用自己的后续处理验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：前四分钟内我方被团灭过一次 / 经济落后判断依据：落后量（一个人头以内算正常）+ 我方一次性资源是否还在决策分支：落后但资源在 → 只打\"对面先交技能\"的团，不主动开…"}, {"id": "K-D15", "cat": "D", "title": "资源点争不争，先看自己有没有\"一次性资源\"", "self": "<h3><a class=\"kref\" href=\"#K-D15\">K-D15<\/a> 资源点争不争，先看自己有没有\"一次性资源\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟资源点刷新前<\/li><li><strong>判断依据<\/strong>：被动/大招/闪现是否可用；我方是否有人阵亡<\/li><li><strong>决策分支<\/strong>：<\/li><li>资源在且人齐 → 可以争（见 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>）<\/li><li>资源不在（如苏烈被动没装好）→ <strong>放<\/strong>，原话：\"没被动的时候就不要去硬接\"<\/li><li><strong>反例<\/strong>：「龙不能放」——4 分钟的龙价值约等于一波半兵线，而一次团灭的价值远大于它。<strong>放龙换 40 秒发育，是赚的。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D14\">K-D14<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:11；BV1yke26fEYB @ 04:13；BV1yke26fEYB @ 04:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟资源点刷新前判断依据：被动/大招/闪现是否可用；"}, {"id": "K-D16", "cat": "D", "title": "谁先占住龙坑侧的草，谁决定这波团的形状", "self": "<h3><a class=\"kref\" href=\"#K-D16\">K-D16<\/a> 谁先占住龙坑侧的草，谁决定这波团的形状<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要争这个资源点<\/li><li><strong>判断依据<\/strong>：龙坑侧草的视野归属；我方是否有人能先手控<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方先占 → 让对面来冲，我们打反手（先到的人不用先交技能）<\/li><li>对面先占 → 不要正面挤进去，改成拉边/等对面出来<\/li><li><strong>反例<\/strong>：「龙刷了五个人一起上」——五个人挤进一个口，等于把先手权交给对面。<strong>先到不等于先打，先到是为了让别人先打你。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>；被 <a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 依赖<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:47；BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 03:51<\/li><li><strong>可信度<\/strong>：中（素材是\"蹲草反打\"的实战，结论方向明确但表述较口语）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要争这个资源点判断依据：龙坑侧草的视野归属；"}, {"id": "K-D17", "cat": "D", "title": "争不到就换：对面全员在龙坑时，另一侧一定空着", "self": "<h3><a class=\"kref\" href=\"#K-D17\">K-D17<\/a> 争不到就换：对面全员在龙坑时，另一侧一定空着<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：资源点被对面先占住，且我方人不齐/资源不在<\/li><li><strong>判断依据<\/strong>：对面几个人在龙坑附近；另一侧兵线在哪<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面 4 人以上在龙坑 → <strong>不争<\/strong>，去另一侧吃线/推塔/反野<\/li><li>对面只有 2–3 人在 → 可以抢视野、逼他们分人<\/li><li><strong>反例<\/strong>：「他们打龙我们就去骚扰」——骚扰的收益是\"可能抢到\"，成本是\"整队站位散在龙坑口\"。换成另一侧的确定收益更划算。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D16\">K-D16<\/a>；与 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>（反方向拿资源）是同一条判据的不同时间尺度<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:13（\"到时候可以看情况选择放龙\"）；BV1yke26fEYB @ 04:33<\/li><li><strong>可信度<\/strong>：中（\"放\"的动作有原话，\"换什么\"是从 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的框架推的，标中）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：资源点被对面先占住，且我方人不齐/资源不在判断依据：对面几个人在龙坑附近；"}, {"id": "K-D18", "cat": "D", "title": "复活后的第一步不是回自己的线，是先读图", "self": "<h3><a class=\"kref\" href=\"#K-D18\">K-D18<\/a> 复活后的第一步不是回自己的线，是先读图<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：阵亡后复活（前四分钟内最常发生）<\/li><li><strong>判断依据<\/strong>：小地图上 ① 谁在哪 ② 谁状态不好 ③ 哪条线正在被推<\/li><li><strong>决策分支<\/strong>：<\/li><li>某一路我方有人且对面状态差 → <strong>直接过去<\/strong>，不要先回线<\/li><li>全线都在安全位置 → 回自己的线，路过野区顺一下（不绕路才顺，见 <code><a class=\"kref\" href=\"#K-L05\">K-L05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「复活先回自己线补经济」——复活那 5 秒是你唯一\"能选位置\"的时刻，回线等于把这个选择权浪费掉。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D15\">K-D15<\/a>（放资源点之后的时间怎么用）<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:17；BV1yke26fEYB @ 04:20；BV1yke26fEYB @ 04:23；BV1yke26fEYB @ 04:29<\/li><li><strong>可信度<\/strong>：中高（原话给了完整推理：\"小乔在下路、打野在野区、并且他状态不好，这时我们下一步一定是去下路\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂）<\/h2>\n<ul><li><strong>在节点「一次性资源」上<\/strong>：人会把\"我血是满的\"当成\"我能打\"，忽略被动/大招是否是这波的前提。苏烈没被动就是普通近战，盾山没能量就是一块木板。<\/li><li><strong>在节点「人数」上<\/strong>：人会用\"他马上复活了\"给自己找理由。差 3 秒也是少一个人。<\/li><li><strong>在节点「先到」上<\/strong>：人以为先到就要先开，于是把反手机会打成了正面硬冲。<\/li><li><strong>在节点「放」上<\/strong>：人放了龙却不知道去换什么，40 秒全队在中路晃——这是\"放\"最常见的执行失败。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<h3>冲突 1：第一个资源点到底是 2 分钟还是 4 分钟<\/h3>\n<p>两条素材对不上，<strong>必须挂在这里，不许挑一条当结论<\/strong>：<\/p>\n<div class=\"tw\"><table><thead><tr><th>来源<\/th><th>说法<\/th><th>时间<\/th><\/tr><\/thead><tbody><tr><td>BV1yke26fEYB @ 04:17（苏烈全局，S45 区间）<\/td><td>「暴君刷新了」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1X2jV6KEiP @ 03:47（射手教学）<\/td><td>「马上也要来到我们的暴君团……4 分钟这个暴君」<\/td><td><strong>4 分钟<\/strong><\/td><\/tr><tr><td>BV1fp4y1D7Wd @ 02:01（干货教练，五位置节奏）<\/td><td>「2 分钟刷新的两条远古生物」<\/td><td><strong>2 分钟<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>两条 6 月内的实战素材都说 4 分钟，只有那条理论框架视频说 2 分钟。<strong>倾向按 4 分钟用<\/strong>，但那条理论视频可能拍得更早（S44 或之前）。本节的所有判据与\"几分钟\"无关——它问的是\"我有资格站进去吗\"，所以结论不受影响。<\/p>\n<h3>干货教练给的\"前期时间轴\"（未与版本对齐，仅作参照）<\/h3>\n<p>BV1fp4y1D7Wd @ 01:44 起给了一串节点：中路第一波兵 → 30 秒第一轮野区 + 边路河蟹 → 第二波兵 + 1 分钟中路河道之灵 → 第三波兵 → 2 分钟远古生物 + 第四波兵。<\/p>\n<p><strong>这套轴如果按\"远古生物 2 分钟\"成立，那么上文所有\"4 分钟\"的判断都要整体前移 2 分钟。<\/strong> 用之前先在游戏里对一次刷新时间。<\/p>\n<h3>其他<\/h3>\n<ul><li><strong>4 分钟资源点的类型与数值<\/strong>没有素材，本节只处理\"争不争\"的判断，不涉及打龙操作。<\/li><li>素材来自一局逆风局，<strong>顺风局的前四分钟<\/strong>（该不该加速、该不该越塔）没有样本。<\/li><li>\"对面先到就不冲\"这条在强开团阵容下可能不成立（盾山/苏烈可以硬顶进去），需补一条阵容相关的分支。<\/li><\/ul>", "sum": "两条素材对不上，必须挂在这里，不许挑一条当结论："}]}, {"key": "D", "cat": "对局内", "title": "04 对线期：这波线清完，我该往哪走", "file": "04_对线期.md", "intro": "<blockquote><p><strong>依赖<\/strong>：03 前四分钟（结论：线权来自第一波谁先清完） <strong>被依赖<\/strong>：05 第一波转线（本节产出的「可动窗口」是 05 的输入）；09 逆风止损（本节判定\"没线权\"且持续到 4 分钟，直接跳 09）<\/p><\/blockquote>\n<h2>0. 上一节留下的问题<\/h2>\n<p>03 结尾留下的是：<strong>\"你先到 2 级了，然后呢？\"<\/strong><\/p>\n<p>先到 2 级只说明你<strong>有了一次清线优势<\/strong>，不等于你能走。这一节要回答的，是这次优势能不能换成地图上的东西——换不成，优势会在 90 秒内自己蒸发。<\/p>\n<h2>1. 本节只回答一个决定<\/h2>\n<p><strong>这一波线清完之后，我是往河道走、往边路走，还是退回塔后等下一波？<\/strong><\/p>\n<p>不是\"怎么打得更好\"，是\"这一步该不该动\"。操作的差距在这个决定面前是次要的。<\/p>\n<h2>2. 判断树<\/h2>\n<pre><code>中线清完 / 即将清完（判断起点）\n│\n├─ 判据 A：我有没有线权？（看谁的小兵更多、谁先推过去）\n│   ├─ 没有（我方兵线被压回塔前，或我每波都在塔下补刀）\n│   │   ├─ 判据 A1：对面法师是否已经离开中线？（小地图 8 秒内无其视野）\n│   │   │   ├─ 是 → 【K-D01】不尾随，往反方向去拿资源\n│   │   │   └─ 否 → 【K-D02】塔后过线，同时给边路打信号\n│   │   └─ 判据 A2：我这一波掉了多少状态？（血量 &lt;60% 且无闪现）\n│   │       ├─ 是 → 【K-D03】回城，不要为了保线硬撑\n│   │       └─ 否 → 留在塔后等下一波\n│   └─ 有（我方小兵更多，或对面被迫交技能补刀）\n│       ├─ 判据 B：下一波兵到线还需多久？\n│       │   ├─ &gt;8 秒 → 够一次短游，进判据 C\n│       │   └─ ≤8 秒 → 【K-D04】不动，把线再推一波更赚\n│       └─ 判据 C：我方打野在哪？\n│           ├─ 在我方半区/河道 → 【K-D05】跟他走同一侧，去做视野或反野\n│           └─ 位置未知/在对面半区 → 【K-D06】只占中轴草，不深入\n└─ 判据 D：这波我死了或刚复活\n    └─ 【K-D07】先回中线过线，不要先参团<\/code><\/pre>\n<p>每个叶子都对应下面一个 K 条目。<strong>树里没有\"视情况而定\"这种分支<\/strong>——出现这三个字说明判据没写清。<\/p>\n<h2>3. 判断依据<\/h2>\n<div class=\"tw\"><table><thead><tr><th>变量<\/th><th>在哪看<\/th><th>阈值 / 取值<\/th><th>影响哪个分支<\/th><\/tr><\/thead><tbody><tr><td>线权<\/td><td>双方小兵数量与位置<\/td><td>我方小兵 ≥ 对方且未进塔<\/td><td>判据 A<\/td><\/tr><tr><td>对面法师视野<\/td><td>小地图<\/td><td>消失 &gt;8 秒<\/td><td>A1<\/td><\/tr><tr><td>自身血量 / 召唤师技能<\/td><td>血条 + 技能栏<\/td><td>血量 &lt;60% 且无闪现<\/td><td>A2<\/td><\/tr><tr><td>下一波兵到线时间<\/td><td>兵线节奏（约 30 秒一波）<\/td><td>&gt;8 秒<\/td><td>B<\/td><\/tr><tr><td>我方打野位置<\/td><td>小地图<\/td><td>己方半区 / 未知<\/td><td>C<\/td><\/tr><tr><td>是否刚复活<\/td><td>复活计时<\/td><td>—<\/td><td>D<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>底层判据（适用于全库）<\/strong>：判断\"能不能打\"看的不是经济差，是<strong>战斗力差 × 能不能及时到达<\/strong>。信息不足时这条压过一切技巧性结论——这条来自 <code>BV1i2n96AEvp<\/code> 的框架，原文是\"速度的真正含义就是看战斗力的影响是否能够及时达到目标区域\"。<\/p>\n<h2>4. 分支说明<\/h2>", "entries": [{"id": "K-D01", "cat": "D", "title": "没线权，对面法师走了——我不跟，去反方向", "self": "<h3><a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 没线权，对面法师走了——我不跟，去反方向<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（2026-09-23 起）；S46 待复核<\/li><li><strong>触发条件<\/strong>：我方中路无线权（兵线被压回塔前）；对面法师小地图消失 &gt;8 秒<\/li><li><strong>判断依据<\/strong>：对面法师的消失方向（看小地图最后视野朝向哪一路）；我方另一路是否有可拿资源<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面法师去上 → <strong>我去下路<\/strong>，拿河蟹/兵线/野区小资源<\/li><li>对面法师去下 → <strong>我去上路<\/strong>，同理<\/li><li>完全看不出方向 → 不动，塔后过线<\/li><li><strong>反例<\/strong>：「对面法师去支援了，我赶紧跟过去」——你没有线权，走过去比他慢 5 秒以上，到了正好接他一套技能，还把中线白送。<strong>尾随强势法师作用不大，不如反方向拿资源。<\/strong><\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a>（先要能安全过线）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:38；BV15EJk6fEwX @ 00:41<\/li><li><strong>可信度<\/strong>：高（全局思路复盘，非剪辑集锦；与《一野二边三射四中》的开局逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（2026-09-23 起）；"}, {"id": "K-D02", "cat": "D", "title": "没线权时的过线方式：塔后过，不打信号就完事", "self": "<h3><a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 没线权时的过线方式：塔后过，不打信号就完事<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：判定为无线权状态，且需要继续吃中线经济<\/li><li><strong>判断依据<\/strong>：对面法师的消耗距离；我方塔的血量<\/li><li><strong>决策分支<\/strong>：<\/li><li>站在<strong>塔后<\/strong>过线（不是塔前补刀），同时观察对面法师动向<\/li><li>给边路打信号，说明\"我这路被压，你们注意对面中单可能来\"<\/li><li><strong>反例<\/strong>：「我打个信号让队友别打就行了」——这条被明确否掉了：对面法师+打野一起进你们野区，或者四包二越你们下路，一个信号拦不住。<strong>打信号不能替代你到场<\/strong>。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:03；BV15EJk6fEwX @ 01:10<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：判定为无线权状态，且需要继续吃中线经济判断依据：对面法师的消耗距离；"}, {"id": "K-D03", "cat": "D", "title": "血线被打到 60% 以下且没闪现——回家，别保线", "self": "<h3><a class=\"kref\" href=\"#K-D03\">K-D03<\/a> 血线被打到 60% 以下且没闪现——回家，别保线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中路对线期，血量 &lt;60%，闪现已交或在冷却<\/li><li><strong>判断依据<\/strong>：对面法师的技能冷却与斩杀线；我方塔下是否安全<\/li><li><strong>决策分支<\/strong>：<\/li><li>直接回城，接受掉 1–2 个兵<\/li><li>若对面法师蓝量也不健康且无法越塔 → 可以再撑一波，但要站在塔后<\/li><li><strong>反例<\/strong>：「我血少但不能掉线，硬吃一波」——<strong>掉状态之后轻则被单杀、丢闪现，重则丢野区<\/strong>。这是\"为了一波兵输掉整条线\"的典型。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:30；BV15EJk6fEwX @ 00:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中路对线期，血量 &lt;60%，闪现已交或在冷却判断依据：对面法师的技能冷却与斩杀线；"}, {"id": "K-D04", "cat": "D", "title": "有线权但下一波兵 8 秒内到——别走，再推一波", "self": "<h3><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 有线权但下一波兵 8 秒内到——别走，再推一波<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有明确线权；下一波兵线到线时间 ≤8 秒<\/li><li><strong>判断依据<\/strong>：兵线节奏（约 30 秒一波）；当前小兵数量<\/li><li><strong>决策分支<\/strong>：留在线上再推一波，把兵线送进对面塔，让对面疲于补塔刀<\/li><li><strong>反例<\/strong>：「有线权就立刻游走」——走到一半兵线回来，你既没拿到资源也没吃到线，两头空。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:53<\/li><li><strong>可信度<\/strong>：中（阈值为 8 秒的推算值，UP 主未给具体秒数，需实战校准）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有明确线权；"}, {"id": "K-D05", "cat": "D", "title": "有线权且打野在同侧——跟他走，别自己单走", "self": "<h3><a class=\"kref\" href=\"#K-D05\">K-D05<\/a> 有线权且打野在同侧——跟他走，别自己单走<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权；我方打野位于己方半区或河道<\/li><li><strong>判断依据<\/strong>：打野位置与行进方向；对面打野是否已在小地图暴露<\/li><li><strong>决策分支<\/strong>：与打野走同一侧，做视野或反野；两人一起才有交换价值<\/li><li><strong>反例<\/strong>：「我自己先去探一下」——单人进野区在无视野情况下大概率被抓，而这次被抓会把刚拿到的线权一起吐出去。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a>（先确认可动窗口）<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 02:11；BV15EJk6fEwX @ 02:14<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权；"}, {"id": "K-D06", "cat": "D", "title": "打野位置不明——只占中轴草，不深入", "self": "<h3><a class=\"kref\" href=\"#K-D06\">K-D06<\/a> 打野位置不明——只占中轴草，不深入<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：有线权，但打野位置未知或在对面上半区<\/li><li><strong>判断依据<\/strong>：小地图打野最后出现位置与时间<\/li><li><strong>决策分支<\/strong>：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场<\/li><li><strong>反例<\/strong>：「反正有线权，去对面野区找个机会」——打野位置不明时进对面野区，等于把命交给概率。<\/li><li><strong>依赖<\/strong>：依赖 <a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 01:43；BV15EJk6fEwX @ 01:47<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：有线权，但打野位置未知或在对面上半区判断依据：小地图打野最后出现位置与时间决策分支：站在中路两侧草丛占视野（UP 主原话\"一般是站在这个草\"），只做视野不进场反例：「…"}, {"id": "K-D07", "cat": "D", "title": "死了刚复活——先回中线过线，不要先参团", "self": "<h3><a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 死了刚复活——先回中线过线，不要先参团<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：复活后场上正在发生团战或资源争夺<\/li><li><strong>判断依据<\/strong>：兵线位置；团战距离；自身大招冷却<\/li><li><strong>决策分支<\/strong>：<\/li><li>中线有兵且没人清 → <strong>先过线<\/strong>，再决定是否进场<\/li><li>中线已空 → 直接进场<\/li><li><strong>反例<\/strong>：「团战开始了必须去」——线不过，你到场也是白给经济，而且下一波还要被压。<strong>兵线大于团战<\/strong>这条在低分段尤其反直觉。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 03:24；BV15EJk6fEwX @ 03:26<\/li><li><strong>可信度<\/strong>：中（\"兵线大于团战\"是 UP 主的口号式结论，需在 06/07 用其他来源交叉验证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：复活后场上正在发生团战或资源争夺判断依据：兵线位置；"}, {"id": "K-D08", "cat": "D", "title": "对线期的辅助：按「野→边→射→中」的顺序决定第一步", "self": "<h3><a class=\"kref\" href=\"#K-D08\">K-D08<\/a> 对线期的辅助：按「野→边→射→中」的顺序决定第一步<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，辅助决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>反例<\/strong>：「辅助就该跟着射手」——这是四个判据里排第三的一条，不是第一条。开局直接去发育路，等于放弃了野区节奏。<\/li><li><strong>依赖<\/strong>：无<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 00:47；BV1yke26fEYB @ 00:52<\/li><li><strong>可信度<\/strong>：中（该公式为 UP 主自创命名\"一野二边三射四中\"，非官方；顺序逻辑与 <a class=\"kref\" href=\"#K-D01\">K-D01<\/a> 的反方向拿资源一致，故采信）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>5. 本节的连锁错误（按节点挂，不单列）<\/h2>\n<ul><li><strong>在节点「判据 A 线权」上<\/strong>：把\"我先到 2 级\"当成\"我有线权\"。到 2 级只是一次，线权是持续状态，看的是<strong>这一波谁的小兵更多<\/strong>。<\/li><li><strong>在节点「判据 A1 对面法师消失」上<\/strong>：把\"小地图没有他\"当成\"他走了\"。消失 8 秒内可能只是在草丛里，直接跟过去会撞脸。<\/li><li><strong>在节点「判据 C 打野位置」上<\/strong>：把\"打野刚露头\"当成\"打野在附近\"。露头的位置决定他能不能到，不能到就等于不在。<\/li><li><strong>在节点「判据 D 刚复活」上<\/strong>：默认\"团战优先级最高\"。低分段最常见的死法就是复活后直奔团战，回来发现自己中线已经掉两波。<\/li><\/ul>\n<h2>6. 待验证 / 冲突<\/h2>\n<ul><li><a class=\"kref\" href=\"#K-D04\">K-D04<\/a> 的 8 秒阈值、<a class=\"kref\" href=\"#K-D07\">K-D07<\/a> 的\"兵线大于团战\"均为单一来源，缺第二个 UP 主交叉验证 → <code>30_index/stale.md<\/code> 已登记。<\/li><li>本节的\"线权\"定义在中路成立，<strong>对抗路不适用<\/strong>（对抗路优势要控线，中路优势要推线）→ 对抗路支线待 P2 单独写，不要套用本节。<\/li><li>版本风险：王维为 S45 新英雄，若 S46 调整其一级强度，<a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 的\"塔后过线\"前提需重估。<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，辅助决定第一波去哪判断依据：① 我方打野是否要进攻/防守野区 ② 边路是否有线权可拿 ③ 发育路对线强度 ④ 中路是否需要帮清决策分支…"}]}], "lanes": [{"key": "mid", "name": "中路", "icon": "中", "motto": "清完这波线往哪走", "file": "01_中路.md", "title": "中路：清完这波线，我往哪个方向走", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论，不是某个英雄的。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/<\/code>。<\/p><\/blockquote>\n<h2>1. 中路的位置特权：转线成本最低<\/h2>\n<p>中路是地图中心，<strong>到三条路的距离最短<\/strong>。所以中路的产出不是\"我打了多少伤害\"，而是<strong>\"我能在几个地方出现\"<\/strong>。<\/p>\n<p>这条决定了中路的判断顺序：<strong>先算线权（能不能走），再算方向（往哪走），最后才算操作（怎么打）<\/strong>。顺序反了就会出现\"我在中路打得很凶，但地图上什么都没发生\"。<\/p>\n<h2>2. 判断顺序（不能跳步）<\/h2>\n<pre><code>第 1 步：这波线，我有没有线权？        → K-L01\n   ↓ 有\n第 2 步：清完立刻走，还是再推一波？    → K-L02（判据：下一波兵到线时间）\n   ↓ 走\n第 3 步：往哪个方向走？                → K-L03（判据：对面中单消失方向 / 我方打野位置）\n   ↓ 顺路\n第 4 步：路过野区，蹭不蹭？            → K-L05（判据：能不能 3 秒内扫完）\n   ↓\n例外：打野差一级到四 → 中线让给他      → K-L04<\/code><\/pre>", "entries": [{"id": "K-L01", "cat": "L", "title": "线权不是\"我血多\"，是\"对面多快能清完这一波\"", "self": "<h3><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> 线权不是\"我血多\"，是\"对面多快能清完这一波\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每波兵线交汇前（判断自己能不能走）<\/li><li><strong>判断依据<\/strong>：对面中路（含辅助）<strong>一波兵需要几个技能<\/strong>。一个技能清完 = 你无线权；要三个技能以上 = 你有线权<\/li><li><strong>决策分支<\/strong>：<\/li><li>没线权 → 不硬抢，塔前接兵，改走\"反方向拿资源\"或等打野（见 <code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code>）<\/li><li>有线权 → 清完立刻产生一个\"可动窗口\"，详见 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/li><li><strong>反例<\/strong>：「我血比对面多，所以我有线权」——血线是打架结果，不是线权来源。满血但清不动兵，照样是被压在塔下。<\/li><li><strong>分路差异<\/strong>：这条在对抗路也成立（<code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>），但中路的判据要多看一个人——<strong>对面辅助会不会来帮清<\/strong>，辅助一来清线速度直接翻倍。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:19（\"大乔一技能直接秒兵线，我只有一个人……这波没有线权\"）<\/li><li><strong>可信度<\/strong>：高（多英雄素材一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每波兵线交汇前（判断自己能不能走）判断依据：对面中路（含辅助）一波兵需要几个技能。"}, {"id": "K-L02", "cat": "L", "title": "有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口", "self": "<h3><a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 有线权就立刻走，别在中路站着——站着的每一秒都是白送的窗口<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：刚清完一波兵，下一波兵还没到<\/li><li><strong>判断依据<\/strong>：下一波兵到线还要多久（正常约 30 秒一波）<\/li><li><strong>决策分支<\/strong>：<\/li><li>到线 &gt; 8 秒 → 够一次短游，按 <a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 选方向<\/li><li>到线 ≤ 8 秒 → 不动，把线再推一波更赚（见 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「清完线在中路等下一波，顺便看有没有机会单杀」——单杀是低概率事件，转线是确定收益。<strong>有线权却不走，等于把线权浪费掉。<\/strong><\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:19（\"玩海月这种有线权的中单法师，一定要想办法在四级前多去控一两个中立资源\"）<\/li><li><strong>可信度<\/strong>：高（与 <code><a class=\"kref\" href=\"#K-D04\">K-D04<\/a><\/code> 的 8 秒阈值互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：刚清完一波兵，下一波兵还没到判断依据：下一波兵到线还要多久（正常约 30 秒一波）决策分支：到线 &gt; 8 秒 → 够一次短游，按 K-L03 选方向到线 ≤ 8…"}, {"id": "K-L03", "cat": "L", "title": "方向选\"反方向\"，不是\"跟着走\"", "self": "<h3><a class=\"kref\" href=\"#K-L03\">K-L03<\/a> 方向选\"反方向\"，不是\"跟着走\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：决定要转线了，选往哪一路<\/li><li><strong>判断依据<\/strong>：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面中单往上 → <strong>我往下<\/strong>（拿河蟹、兵线、野区小资源）<\/li><li>对面中单往下 → 我往上<\/li><li>看不出方向 → 只占中轴草，不深入（<code><a class=\"kref\" href=\"#K-D06\">K-D06<\/a><\/code>）<\/li><li>我方打野在同侧 → 跟他走同一侧（<code><a class=\"kref\" href=\"#K-D05\">K-D05<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「对面去支援了，我赶紧跟」——你没有线权时跟过去比他慢，有线权时跟过去也是<strong>同向撞车<\/strong>，两边都打不出东西。反方向才有空位。<\/li><li><strong>来源<\/strong>：BV1xEFGzoEYA @ 00:38；<code><a class=\"kref\" href=\"#K-D01\">K-D01<\/a><\/code> 的判据（BV1i2n96AEvp @ 02:31 底层框架）<\/li><li><strong>可信度<\/strong>：高（D 类已独立验证过同一条）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：决定要转线了，选往哪一路判断依据：① 对面中单小地图消失的方向 ② 我方打野当前所在的半区决策分支：对面中单往上 → 我往下（拿河蟹、兵线、野区小资源）对面中单往下 …"}, {"id": "K-L04", "cat": "L", "title": "中线归谁：打野差一级到四，中线让他", "self": "<h3><a class=\"kref\" href=\"#K-L04\">K-L04<\/a> 中线归谁：打野差一级到四，中线让他<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：打野走到中线想吃这波兵<\/li><li><strong>判断依据<\/strong>：打野当前等级离四级差多少<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野差一级到四 → <strong>让<\/strong>。他升四才有反打/进野区的能力，这一波线的收益远大于你自己多几十块<\/li><li>打野已四级以上 → 不让，按 <a class=\"kref\" href=\"#K-L02\">K-L02<\/a> 自己清完转线<\/li><li><strong>反例<\/strong>：「我的线凭什么给他」——四级前的打野和四级后是两个英雄，这一波让出去，换的是他接下来 3 分钟的节奏权。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（\"此时一定要先选择速推中线……利用中线升四级，才可能有反打的机会\"）<\/li><li><strong>可信度<\/strong>：中高（打野视角的职业级素材，明确把中线当\"升四资源\"用）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：打野走到中线想吃这波兵判断依据：打野当前等级离四级差多少决策分支：打野差一级到四 → 让。"}, {"id": "K-L05", "cat": "L", "title": "顺路蹭野：用技能边缘扫一下就走，别站野区打完", "self": "<h3><a class=\"kref\" href=\"#K-L05\">K-L05<\/a> 顺路蹭野：用技能边缘扫一下就走，别站野区打完<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：清完线、等下一波兵的间隙，路过野区<\/li><li><strong>判断依据<\/strong>：这组野还剩多少血、你打完要几秒<\/li><li><strong>决策分支<\/strong>：只有一个技能的时间 → 边缘扫一下立刻走；要站桩打完 → 不打，回线<\/li><li><strong>反例<\/strong>：「顺手把野清干净」——你多待 5 秒，中线就丢了，中塔掉一半血。<strong>蹭野的收益上限是\"顺路\"，一旦需要绕路就不成立。<\/strong><\/li><li><strong>分路差异<\/strong>：对抗路也有\"顺路刷野\"，但对抗路可以合法地多待（见 <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>）；中路不行，中塔是全图最重要的塔。<\/li><li><strong>来源<\/strong>：BV1g44y1F7aN @ 01:07（一技能边缘摸小猪，与直接转向相差约 0.3 秒）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：清完线、等下一波兵的间隙，路过野区判断依据：这组野还剩多少血、你打完要几秒决策分支：只有一个技能的时间 → 边缘扫一下立刻走；"}, {"id": "K-L06", "cat": "L", "title": "第一波线遇到钩子类辅助（钟馗），退到塔前接", "self": "<h3><a class=\"kref\" href=\"#K-L06\">K-L06<\/a> 第一波线遇到钩子类辅助（钟馗），退到塔前接<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面辅助是钟馗这类强制位移，且你在第一波线上<\/li><li><strong>判断依据<\/strong>：自己是否站在对方钩子的射程内<\/li><li><strong>决策分支<\/strong>：<strong>退到塔前接兵<\/strong>，不要站在兵线前沿；被勾进塔下等于直接脱节<\/li><li><strong>反例<\/strong>：「中单必须抢线权」——抢线权的前提是你能安全清完。被钩一次，掉的不只是血，还有整波线的经验。<\/li><li><strong>分路差异<\/strong>：这条对<strong>清线慢的法师<\/strong>尤其致命（抢不动又躲不开），清线快的法师可以用一波技能换掉这个风险。<\/li><li><strong>来源<\/strong>：BV1Fd4y1k7EY @ 00:24；@ 01:09（清线慢所以先拿河蟹）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把线权当血量<\/strong>（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>）→ 明明清不动兵还站前面，被压到塔下，然后怪打野不来。<\/li><li><strong>有线权但不走<\/strong>（<a class=\"kref\" href=\"#K-L02\">K-L02<\/a>）→ 全场最贵的资源是\"能动的中单\"，站着等于放弃它。<\/li><li><strong>转线跟着对面走<\/strong>（<a class=\"kref\" href=\"#K-L03\">K-L03<\/a>）→ 同向撞车，两个人的收益都变成零。<\/li><\/ol>\n<h2>4. 交叉：中路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局第一波谁帮清中<\/td><td><code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（游走排序里中线排第四）/ <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>你转线过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>对面辅助一级来帮清中<\/strong>时，中单该不该抢——素材里出现过（BV1xEFGzoEYA 提到大乔一技能秒兵线），但没有明确结论。<\/li><li>中路对\"炮台 vs 法刺\"两类英雄的转线时机差异，只有零散片段。<\/li><li>S46 版本中路兵线节奏是否变化（S45 按 30 秒/波算）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面辅助是钟馗这类强制位移，且你在第一波线上判断依据：自己是否站在对方钩子的射程内决策分支：退到塔前接兵，不要站在兵线前沿；"}], "hue": 216, "heroes": ["不知火舞", "女娲", "小乔"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "cross": ["游走", "发育路", "对抗路", "打野"]}, {"key": "roam", "name": "游走", "icon": "游", "motto": "第一步去哪", "file": "02_游走.md", "title": "游走：第一步去哪", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/04_对线期.md<\/code>（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>）。<\/p><\/blockquote>\n<h2>1. 游走没有自己的线，靠别人的线吃饭<\/h2>\n<p>这是游走和另外四路最根本的区别：<strong>你没有一条自己清的线，所以你的\"活动资格\"完全来自队友的线权<\/strong>。队友被压在塔下，你就只能蹲在旁边；队友有压制力，你才有机会去野区、去别的路。<\/p>\n<p>由此推出游走唯一的核心指标：<strong>你这一波能不能让某个点上从 N 打 N 变成 N+1 打 N<\/strong>。做不到，你在哪都是多余的。<\/p>\n<p>这也是为什么\"跟着射手走\"是最常见的错误——<strong>跟人不产生人数差，只有\"到得比对面快\"才产生人数差<\/strong>。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：开局第一波去哪？          → K-L12（排「野→边→射→中」，中线排第四）\n第 2 步：帮打野时，手要放在哪？    → K-L13（不抢尾刀）\n第 3 步：帮中路抢线时，打谁？      → K-L14（连人带兵一起打）\n第 4 步：中期，跟谁？              → K-L15（跟射手转线，不是围中路）\n第 5 步：对面有强开团/钩子，站哪？ → K-L16（吃钩子是你的活）\n第 6 步：要开团了，开不开？        → K-L17（队友不跟就不开）<\/code><\/pre>", "entries": [{"id": "K-L11", "cat": "L", "title": "游走唯一的产出是\"人数差\"，不是\"保护\"", "self": "<h3><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> 游走唯一的产出是\"人数差\"，不是\"保护\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何时刻，当你不知道自己去哪<\/li><li><strong>判断依据<\/strong>：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N<\/li><li><strong>决策分支<\/strong>：<\/li><li>会变成多打少 → 去，哪怕只是站在那吃伤害<\/li><li>不会变 → 不去。这一趟的收益是零，还白送视野给对面<\/li><li><strong>反例<\/strong>：「辅助的职责是保护 C 位」——保护是一个<strong>结果<\/strong>，不是动作。真正的动作是\"让这个点上我们的人比他们多\"。跟着 C 位走一整局，人数差一次都没造出来，等于没打。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 06:14（\"用大招把队友传过来打一个人数差团战，这就是大乔\"）<\/li><li><strong>可信度<\/strong>：中高（这是大乔的结论，但\"人数差\"本身是位置级的判据，不依赖传送这个技能）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何时刻，当你不知道自己去哪判断依据：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N决策分支：会变成多打少 → 去，哪怕只是站在那吃伤害不会变 …"}, {"id": "K-L12", "cat": "L", "title": "开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列", "self": "<h3><a class=\"kref\" href=\"#K-L12\">K-L12<\/a> 开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>发育路排在第三位<\/strong>：只有前两条都不成立、且对面 2v2 压制明显时才直接去下<\/li><li><strong>反例<\/strong>：「辅助就该保射手」——按这个排序，开局直接去发育路等于放弃了野区节奏和边路一血，两条都比\"保一个还没成型的射手\"值钱。<\/li><li><strong>判据来源<\/strong>：<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（BV1yke26fEYB @ 00:47、@ 00:52，UP 主自创命名\"一野二边三射四中\"）<\/li><li><strong>分路差异<\/strong>：这条只对游走成立。中路/对抗路没有\"选一个点去\"的自由，他们被自己的线钉住了。<\/li><li><strong>来源<\/strong>：BV1M81kYpEPE @ 01:01、@ 01:51（大乔开局跟中路抢线，不跟射手）<\/li><li><strong>可信度<\/strong>：高（D 类独立写过同一判据，两个不同 UP 一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，决定第一波去哪判断依据：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清决策分支：打野要偷…"}, {"id": "K-L13", "cat": "L", "title": "帮打野刷野：不补最后一刀", "self": "<h3><a class=\"kref\" href=\"#K-L13\">K-L13<\/a> 帮打野刷野：不补最后一刀<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局帮打野清第一个野<\/li><li><strong>判断依据<\/strong>：打野是否已出打野刀、这组野是不是他的叠层来源<\/li><li><strong>决策分支<\/strong>：<strong>只打不补<\/strong>，最后一刀留给打野；自己拿助攻经验就走<\/li><li><strong>反例<\/strong>：「帮打野就是帮他打快」——抢了尾刀，他少一层、你多几十块。这笔账在四级前是亏的，因为打野的等级直接决定他能不能进野区。<\/li><li><strong>分路差异<\/strong>：这条<strong>五路通用<\/strong>，但收益最大的是游走（因为只有游走会主动站在野怪旁边）。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中（口播一句话，但与\"打野要靠等级进野区\"的 <a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局帮打野清第一个野判断依据：打野是否已出打野刀、这组野是不是他的叠层来源决策分支：只打不补，最后一刀留给打野；"}, {"id": "K-L14", "cat": "L", "title": "帮中路抢线：连人带兵一起打，不要只清兵", "self": "<h3><a class=\"kref\" href=\"#K-L14\">K-L14<\/a> 帮中路抢线：连人带兵一起打，不要只清兵<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级帮中路抢线<\/li><li><strong>判断依据<\/strong>：己方中单能不能跟上（有没有远程消耗手段）<\/li><li><strong>决策分支<\/strong>：不急着补兵，<strong>先连人带兵一起打<\/strong>，把对面中单磨成残血——即使他抢到线权，也打不动了<\/li><li><strong>反例<\/strong>：「帮中就是帮他把线清完」——线清完了但对面满血，下一波他照样压你家中单。<strong>抢线权的目的是让对面失去打架能力，不只是让兵线过去。<\/strong><\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 01:47（职业选手\"大帅\"的打法解析）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级帮中路抢线判断依据：己方中单能不能跟上（有没有远程消耗手段）决策分支：不急着补兵，先连人带兵一起打，把对面中单磨成残血——即使他抢到线权，也打不动了反例：「帮中就…"}, {"id": "K-L15", "cat": "L", "title": "中期跟射手转线，不是围着中路转", "self": "<h3><a class=\"kref\" href=\"#K-L15\">K-L15<\/a> 中期跟射手转线，不是围着中路转<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：进入中期（约 10 分钟后）<\/li><li><strong>判断依据<\/strong>：射手是否已经能独立吃线、有没有被越塔风险<\/li><li><strong>决策分支<\/strong>：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏<\/li><li><strong>反例<\/strong>：「辅助要跟团」——中期最值钱的动作是<strong>帮射手把线吃满 + 把视野推过去<\/strong>，在中路蹲着既不吃线也不做视野。<\/li><li><strong>分路差异<\/strong>：这条的前提是你的英雄有\"带人移动\"的能力（大乔的传送、鲁班大师的链子）。纯坦辅只能\"跟着走\"，收益减半（见 <code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 07:26、@ 06:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：进入中期（约 10 分钟后）判断依据：射手是否已经能独立吃线、有没有被越塔风险决策分支：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏反例：「辅助要跟团」——中…"}, {"id": "K-L16", "cat": "L", "title": "对面有钟馗这类钩子：**吃钩子是你的活**", "self": "<h3><a class=\"kref\" href=\"#K-L16\">K-L16<\/a> 对面有钟馗这类钩子：<strong>吃钩子是你的活<\/strong><\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面选出强制位移型辅助（钟馗为代表）<\/li><li><strong>判断依据<\/strong>：己方谁站在能被勾到的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>由辅助去吃钩<\/strong>，不要让它勾到 C 位；辅助被勾是\"可以接受的结果\"，C 位被勾是\"这波没了\"<\/li><li>团战前<strong>跟着钩子走<\/strong>：他去哪你跟到哪，防他勾自家野区 Buff<\/li><li>站位避开\"中左\"这类视野盲区的正面入口<\/li><li><strong>反例<\/strong>：「辅助要保护 C 位」——保护的具体动作就是<strong>站在他和钩子之间<\/strong>。躲在后面不叫保护。<\/li><li><strong>来源<\/strong>：BV1DGHx61EHn @ 11:08、@ 11:51、@ 14:35（\"你辅助要去挡钟馗钩子呀\"）；@ 03:37（\"你跟着钟馗走就可以防止钟馗勾野了\"）<\/li><li><strong>可信度<\/strong>：中高（这是一局实录里的指挥，说话人位置未确认，但内容是<strong>明确对辅助下的指令<\/strong>，可直接采）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面选出强制位移型辅助（钟馗为代表）判断依据：己方谁站在能被勾到的位置决策分支：由辅助去吃钩，不要让它勾到 C 位；"}, {"id": "K-L17", "cat": "L", "title": "开团前先确认队友跟不跟，不跟就不开", "self": "<h3><a class=\"kref\" href=\"#K-L17\">K-L17<\/a> 开团前先确认队友跟不跟，不跟就不开<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何要主动开团的时刻<\/li><li><strong>判断依据<\/strong>：队友是否知道你要开（信号/语音）、是否有输出位在射程内<\/li><li><strong>决策分支<\/strong>：先打信号确认；确认不到就不开，改打消耗<\/li><li><strong>为什么这条属于游走<\/strong>：另外四路开团失败最多是\"死一个人\"，游走开团失败是\"全队没了\"——因为游走是唯一\"用控制换队友输出\"的位置，队友没跟上，你的控制就是白交。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 13:09（\"如果队友能很好配合，盾山 T0 强度是有的\"）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何要主动开团的时刻判断依据：队友是否知道你要开（信号/语音）、是否有输出位在射程内决策分支：先打信号确认；"}, {"id": "K-L18", "cat": "L", "title": "打连体（2v2）：卡线压位置，别急着换血", "self": "<h3><a class=\"kref\" href=\"#K-L18\">K-L18<\/a> 打连体（2v2）：卡线压位置，别急着换血<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线<\/li><li><strong>判断依据<\/strong>：己方 2v2 能不能打过、对面射手敢不敢压<\/li><li><strong>决策分支<\/strong>：<\/li><li>打得过 → <strong>卡线压位置<\/strong>：对面过来就打状态，不过来就掉兵<\/li><li>打不过 → 退塔下接，别硬换<\/li><li><strong>反例<\/strong>：「打不过就消耗」——打不过的时候消耗等于送，退塔下让对方\"吃掉这波兵但不拿人头\"才是最小损失。<\/li><li><strong>交叉<\/strong>：这条和发育路共用（<code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code>），判据重心不同——<strong>辅助看的是\"能不能卡住位置\"，射手看的是\"敢不敢吃这波兵\"<\/strong>。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39、@ 03:00<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"跟人\"当\"保护\"<\/strong>（<a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L15\">K-L15<\/a>）→ 跟人不产生人数差，站位才产生。<\/li><li><strong>帮打野时手贱补尾刀<\/strong>（<a class=\"kref\" href=\"#K-L13\">K-L13<\/a>）→ 你赚 40 块，换他晚 30 秒到四。<\/li><li><strong>开团不看队友位置<\/strong>（<a class=\"kref\" href=\"#K-L17\">K-L17<\/a>）→ 控制交出去了，队友还在清线。<\/li><\/ol>\n<h2>4. 交叉：游走和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>开局第一波帮不帮清中<\/td><td><code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code> / <code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code><\/td><\/tr><tr><td>发育路<\/td><td>开局跟不跟射手、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code><\/td><\/tr><tr><td>打野<\/td><td>野区要不要跟<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>（打野的野区速率约束）<\/td><\/tr><tr><td>对抗路<\/td><td>边路一血要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>（他能不能给你创造机会）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>软辅 vs 硬辅的大局观差异<\/strong>：现在所有结论都偏硬辅（能吃钩、能开团）。大乔/鲁班大师这类功能辅的\"不吃钩\"版本没有素材。<\/li><li>逆风局的游走该怎么打（断线？保塔？）——只有大乔一条（<code><a class=\"kref\" href=\"#K-A32\">K-A32<\/a><\/code>），是英雄级不是分路级。<\/li><li>中期\"跟射手\"和\"跟打野\"的取舍阈值（多少经济差该换人）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线判断依据：己方 2v2 能不能打过、对面射手敢不敢压决策分支：打得过 → 卡线压位置：对面过来就打状态，不过来就掉兵打不过 → 退塔下接，别硬换反例…"}], "hue": 358, "heroes": ["苏烈", "大乔", "鲁班大师", "盾山"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}], "cross": ["中路", "发育路", "对抗路", "打野"]}, {"key": "adc", "name": "发育路", "icon": "射", "motto": "这波兵敢不敢吃", "file": "03_发育路.md", "title": "发育路：这波兵我敢不敢吃", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。 2026-11-01 补入 <strong>射手第一视角<\/strong>素材（BV1X2jV6KEiP，巅峰万强局 13 分钟推进公式），原来\"只有辅助视角\"的缺口已补上。<\/p><\/blockquote>\n<h2>1. 射手的位置特征：唯一能把经济变成塔的位置<\/h2>\n<p><strong>射手是全场唯一有持续推进能力的位置。<\/strong> 这不是夸射手强，是说明职责错位有多严重：<\/p>\n<blockquote><p>原话：「唯一有推进能力的射手不去压塔，是没有人会想着去推塔的。」<\/p><\/blockquote>\n<p>所以射手的核心矛盾不是\"怎么刷得更快\"，而是<strong>\"我什么时候能把这段经济换成塔\"<\/strong>。一个分均 800 还一直输的射手，问题不在经济，在于把所有时间都花在了\"继续刷\"上——低分段节奏之所以慢，就是因为五个人都在发育，没人推塔。<\/p>\n<p>第二个特征：<strong>射手的机动性和保命技能是同一件事<\/strong>。位移/闪现既是你追人的手段，也是你活命的唯一手段。这条推出后面好几条判据。<\/p>\n<h2>2. 判断顺序（一局的主线）<\/h2>\n<pre><code>开局（0–2 分钟）   → 对线三段：前两波看中辅，第三波看打野      K-L22\n   ↓\n2–4 分钟          → 卡不卡线？看队友能不能先到                K-L23\n   ↓ 卡线\n                  → 卡线的目的不是吃兵，是逼他跟你打一套        K-L24\n   ↓ 4 分钟以后\n                  → 这波线能不能吃，取决于自家中路有没有线权    K-L26\n   ↓ 7 分钟前\n                  → 不转线不推塔，一组兵线 + 一只小野的循环      K-L28\n   ↓ 中期\n                  → 团战只打\"前排互相缠斗\"的那种团              K-L27<\/code><\/pre>\n<h2>3. 分条判断<\/h2>", "entries": [{"id": "K-L21", "cat": "L", "title": "射手的经济不是\"刷得多\"，是\"推到塔\"——你不压塔，全队都不会推塔", "self": "<h3><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> 射手的经济不是\"刷得多\"，是\"推到塔\"——你不压塔，全队都不会推塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何\"经济领先但赢不了\"的局面<\/li><li><strong>判断依据<\/strong>：这 3 分钟里，你有没有把兵线送到对面塔下并开始拆<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济领先且有安全窗口 → <strong>去压塔/拆塔<\/strong>，这才是把经济兑现<\/li><li>经济领先但没有安全窗口 → 继续吃线，但每次吃完都要问\"这波能不能顺势推一下\"<\/li><li><strong>反例<\/strong>：「我经济最高，等装备成型再说」——装备成型的时间点是<strong>由拆塔进度决定的<\/strong>，不是由分钟数决定的。对面塔还在，你永远在对手视野里刷钱。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 00:23；BV1X2jV6KEiP @ 00:26；BV1X2jV6KEiP @ 00:28<\/li><li><strong>可信度<\/strong>：高（UP 主用一整局演示\"分均 800 还输\"的思维误区，结论与操作一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何\"经济领先但赢不了\"的局面判断依据：这 3 分钟里，你有没有把兵线送到对面塔下并开始拆决策分支：经济领先且有安全窗口 → 去压塔/拆塔，这才是把经济兑现经济领先但…"}, {"id": "K-L22", "cat": "L", "title": "开局对线分三段看：前两波看中辅，第三波看打野", "self": "<h3><a class=\"kref\" href=\"#K-L22\">K-L22<\/a> 开局对线分三段看：前两波看中辅，第三波看打野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：0–2 分钟，发育路对线<\/li><li><strong>判断依据<\/strong>：① 头两波兵时双方中单/辅助的支援意愿 ② 第三波兵时双方打野的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li>前两波 → 不指望打野，只看自家辅助在不在；中辅都不来就纯保状态<\/li><li>第三波 → 打野位置决定这波敢不敢压（打野在我方半区 → 可压）<\/li><li><strong>反例<\/strong>：「开局就该硬刚」——前两波的火力全部来自中辅，打野这时在刷第一轮，这时候换血是拿自己的血去换对方的耐心。<\/li><li><strong>分路差异<\/strong>：这条只有发育路成立。中路前两波看的是\"对面清线速度\"（<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>），对抗路看的是\"谁能卡住线\"（<code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>），打野看的是\"谁能反野\"（<code><a class=\"kref\" href=\"#K-L42\">K-L42<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 00:42；BV1X2jV6KEiP @ 00:43<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：0–2 分钟，发育路对线判断依据：① 头两波兵时双方中单/辅助的支援意愿 ② 第三波兵时双方打野的位置决策分支：前两波 → 不指望打野，只看自家辅助在不在；"}, {"id": "K-L23", "cat": "L", "title": "卡不卡线，唯一判据是「队友能不能先到」", "self": "<h3><a class=\"kref\" href=\"#K-L23\">K-L23<\/a> 卡不卡线，唯一判据是「队友能不能先到」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：兵线交汇，决定卡在塔外清还是直接推掉<\/li><li><strong>判断依据<\/strong>：① 我方中野能不能比对面先支援到 ② 对手水平（会不会看小地图）<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友能先到 → <strong>卡线<\/strong>，让对面\"想吃这波线就必须跟你打一套\"<\/li><li>队友被压在塔前、来不了 → <strong>不卡，直接推掉<\/strong>，别在塔外站着挨打<\/li><li>前期续航不够 → 不卡（<code>@ 03:40<\/code>：小兵伤害会把你打到半血以上）<\/li><li><strong>反例<\/strong>：「卡线才是高手」——原话很直白：如果这把是低分段，这波线他根本不会去卡，而是直接推掉。<strong>卡线不是技术，是\"我这边有人、你那边没人\"的判断结果。<\/strong><\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 02:05；BV1X2jV6KEiP @ 02:07；BV1X2jV6KEiP @ 02:10；BV1X2jV6KEiP @ 02:13<\/li><li>
