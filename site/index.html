一个人看对面吃线（@ 00:39 / @ 00:40）<\/li><li><strong>没线权就老老实实塔后过线<\/strong>，别站兵线前沿（@ 01:04）<\/li><li><strong>过完线不急着乱跑<\/strong>：先占中轴视野（一般是中路边草），给下路打信号，再决定去哪（@ 01:43）<\/li><\/ol>\n<ul><li><strong>判据一句话<\/strong>：弱势法<strong>能和对面换状态就不算亏，让对面做不了事就是赚<\/strong>（@ 00:47）。这是\"弱势法\"的收益公式，和强势法的\"抢节奏\"公式不一样。<\/li><li><strong>反例<\/strong>：「有线权才配游走」——这条对弱势法反着用：<strong>正因为没线权，才更要往反方向拿资源<\/strong>，否则整局只有挨压。<\/li><li><strong>分路差异<\/strong>：这条只在<strong>中路<\/strong>成立。对抗路的弱势方不能\"反方向拿资源\"，因为对抗路没有第二条资源线可换（对照 <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:25；@ 00:27；@ 00:39；@ 00:40；@ 01:04；@ 01:43；@ 03:37<\/li><li><strong>可信度<\/strong>：中（单来源，全局思路局，非英雄专精）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<blockquote><p>关于来源里的英雄名：原视频字幕写作「王维」，经核对 <strong>S45「月照长安」新英雄王维（中路法师）<\/strong>，字幕没听错。这条按\"弱势法师\"这一类写，王维只是样本之一；他的机制细节见 <code>A_英雄教学/王维.md<\/code>。同一条视频里对手是嫦娥，可作为\"对面有强线权中单\"的样本。<\/p><\/blockquote>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把线权当血量<\/strong>（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>）→ 明明清不动兵还站前面，被压到塔下，然后怪打野不来。<\/li><li><strong>有线权但不走<\/strong>（<a class=\"kref\" href=\"#K-L02\">K-L02<\/a>）→ 全场最贵的资源是\"能动的中单\"，站着等于放弃它。<\/li><li><strong>转线跟着对面走<\/strong>（<a class=\"kref\" href=\"#K-L03\">K-L03<\/a>）→ 同向撞车，两个人的收益都变成零。<\/li><\/ol>\n<h2>4. 交叉：中路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局第一波谁帮清中<\/td><td><code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（游走排序里中线排第四）/ <code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>你转线过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>对面辅助一级来帮清中<\/strong>时，中单该不该抢——素材里出现过（BV1xEFGzoEYA 提到大乔一技能秒兵线），但没有明确结论。<\/li><li>中路对\"炮台 vs 法刺\"两类英雄的转线时机差异，只有零散片段。<\/li><li>S46 版本中路兵线节奏是否变化（S45 按 30 秒/波算）。<\/li><\/ul>", "sum": "关于来源里的英雄名：原视频字幕写作「王维」，经核对 S45「月照长安」新英雄王维（中路法师），字幕没听错。"}], "hue": 216, "heroes": ["不知火舞", "女娲", "王维", "嫦娥", "小乔", "扁鹊", "西施", "貂蝉", "上官婉儿", "元流之子", "司马懿", "周瑜", "妲己", "嬴政", "安琪拉", "干将莫邪", "弈星", "沈梦溪", "海诺", "甄姬", "米莱狄", "诸葛亮", "高渐离"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "cross": ["游走", "发育路", "对抗路", "打野"]}, {"key": "roam", "name": "游走", "icon": "游", "motto": "第一步去哪", "file": "02_游走.md", "title": "游走：第一步去哪", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>；第几分钟看 <code>D_对局内/04_对线期.md<\/code>（<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>）。<\/p><\/blockquote>\n<h2>1. 游走没有自己的线，靠别人的线吃饭<\/h2>\n<p>这是游走和另外四路最根本的区别：<strong>你没有一条自己清的线，所以你的\"活动资格\"完全来自队友的线权<\/strong>。队友被压在塔下，你就只能蹲在旁边；队友有压制力，你才有机会去野区、去别的路。<\/p>\n<p>由此推出游走唯一的核心指标：<strong>你这一波能不能让某个点上从 N 打 N 变成 N+1 打 N<\/strong>。做不到，你在哪都是多余的。<\/p>\n<p>这也是为什么\"跟着射手走\"是最常见的错误——<strong>跟人不产生人数差，只有\"到得比对面快\"才产生人数差<\/strong>。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 1 步：开局第一波去哪？          → K-L12（排「野→边→射→中」，中线排第四）\n第 2 步：帮打野时，手要放在哪？    → K-L13（不抢尾刀）\n第 3 步：帮中路抢线时，打谁？      → K-L14（连人带兵一起打）\n第 4 步：中期，跟谁？              → K-L15（跟射手转线，不是围中路）\n第 5 步：对面有强开团/钩子，站哪？ → K-L16（吃钩子是你的活）\n第 6 步：要开团了，开不开？        → K-L17（队友不跟就不开）<\/code><\/pre>", "entries": [{"id": "K-L11", "cat": "L", "title": "游走唯一的产出是\"人数差\"，不是\"保护\"", "self": "<h3><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> 游走唯一的产出是\"人数差\"，不是\"保护\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何时刻，当你不知道自己去哪<\/li><li><strong>判断依据<\/strong>：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N<\/li><li><strong>决策分支<\/strong>：<\/li><li>会变成多打少 → 去，哪怕只是站在那吃伤害<\/li><li>不会变 → 不去。这一趟的收益是零，还白送视野给对面<\/li><li><strong>反例<\/strong>：「辅助的职责是保护 C 位」——保护是一个<strong>结果<\/strong>，不是动作。真正的动作是\"让这个点上我们的人比他们多\"。跟着 C 位走一整局，人数差一次都没造出来，等于没打。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 06:14（\"用大招把队友传过来打一个人数差团战，这就是大乔\"）<\/li><li><strong>可信度<\/strong>：中高（这是大乔的结论，但\"人数差\"本身是位置级的判据，不依赖传送这个技能）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何时刻，当你不知道自己去哪判断依据：你到那个点之后，那边的战斗会不会从 N 打 N 变成 N+1 打 N决策分支：会变成多打少 → 去，哪怕只是站在那吃伤害不会变 …"}, {"id": "K-L12", "cat": "L", "title": "开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列", "self": "<h3><a class=\"kref\" href=\"#K-L12\">K-L12<\/a> 开局别默认跟射手——「野 → 边 → 射 → 中」是排序，不是并列<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45（中野辅版本）<\/li><li><strong>触发条件<\/strong>：开局到 1 分钟，决定第一波去哪<\/li><li><strong>判断依据<\/strong>：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野要偷野 → 去<strong>对抗路<\/strong>拿线权，再协同进野区<\/li><li>打野不偷野 → 去边路尝试一血<\/li><li>都不成立 → 回中帮清线<\/li><li><strong>发育路排在第三位<\/strong>：只有前两条都不成立、且对面 2v2 压制明显时才直接去下<\/li><li><strong>反例<\/strong>：「辅助就该保射手」——按这个排序，开局直接去发育路等于放弃了野区节奏和边路一血，两条都比\"保一个还没成型的射手\"值钱。<\/li><li><strong>判据来源<\/strong>：<code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code>（BV1yke26fEYB @ 00:47、@ 00:52，UP 主自创命名\"一野二边三射四中\"）<\/li><li><strong>分路差异<\/strong>：这条只对游走成立。中路/对抗路没有\"选一个点去\"的自由，他们被自己的线钉住了。<\/li><li><strong>来源<\/strong>：BV1M81kYpEPE @ 01:01、@ 01:51（大乔开局跟中路抢线，不跟射手）<\/li><li><strong>可信度<\/strong>：高（D 类独立写过同一判据，两个不同 UP 一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45（中野辅版本）触发条件：开局到 1 分钟，决定第一波去哪判断依据：① 打野要不要进攻/防守野区 ② 边路有没有线权可拿 ③ 发育路对线强度 ④ 中路要不要帮清决策分支：打野要偷…"}, {"id": "K-L13", "cat": "L", "title": "帮打野刷野：不补最后一刀", "self": "<h3><a class=\"kref\" href=\"#K-L13\">K-L13<\/a> 帮打野刷野：不补最后一刀<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局帮打野清第一个野<\/li><li><strong>判断依据<\/strong>：打野是否已出打野刀、这组野是不是他的叠层来源<\/li><li><strong>决策分支<\/strong>：<strong>只打不补<\/strong>，最后一刀留给打野；自己拿助攻经验就走<\/li><li><strong>反例<\/strong>：「帮打野就是帮他打快」——抢了尾刀，他少一层、你多几十块。这笔账在四级前是亏的，因为打野的等级直接决定他能不能进野区。<\/li><li><strong>分路差异<\/strong>：这条<strong>五路通用<\/strong>，但收益最大的是游走（因为只有游走会主动站在野怪旁边）。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:28<\/li><li><strong>可信度<\/strong>：中（口播一句话，但与\"打野要靠等级进野区\"的 <a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 逻辑一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局帮打野清第一个野判断依据：打野是否已出打野刀、这组野是不是他的叠层来源决策分支：只打不补，最后一刀留给打野；"}, {"id": "K-L14", "cat": "L", "title": "帮中路抢线：连人带兵一起打，不要只清兵", "self": "<h3><a class=\"kref\" href=\"#K-L14\">K-L14<\/a> 帮中路抢线：连人带兵一起打，不要只清兵<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：一级帮中路抢线<\/li><li><strong>判断依据<\/strong>：己方中单能不能跟上（有没有远程消耗手段）<\/li><li><strong>决策分支<\/strong>：不急着补兵，<strong>先连人带兵一起打<\/strong>，把对面中单磨成残血——即使他抢到线权，也打不动了<\/li><li><strong>反例<\/strong>：「帮中就是帮他把线清完」——线清完了但对面满血，下一波他照样压你家中单。<strong>抢线权的目的是让对面失去打架能力，不只是让兵线过去。<\/strong><\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 01:47（职业选手\"大帅\"的打法解析）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：一级帮中路抢线判断依据：己方中单能不能跟上（有没有远程消耗手段）决策分支：不急着补兵，先连人带兵一起打，把对面中单磨成残血——即使他抢到线权，也打不动了反例：「帮中就…"}, {"id": "K-L15", "cat": "L", "title": "中期跟射手转线，不是围着中路转", "self": "<h3><a class=\"kref\" href=\"#K-L15\">K-L15<\/a> 中期跟射手转线，不是围着中路转<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：进入中期（约 10 分钟后）<\/li><li><strong>判断依据<\/strong>：射手是否已经能独立吃线、有没有被越塔风险<\/li><li><strong>决策分支<\/strong>：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏<\/li><li><strong>反例<\/strong>：「辅助要跟团」——中期最值钱的动作是<strong>帮射手把线吃满 + 把视野推过去<\/strong>，在中路蹲着既不吃线也不做视野。<\/li><li><strong>分路差异<\/strong>：这条的前提是你的英雄有\"带人移动\"的能力（大乔的传送、鲁班大师的链子）。纯坦辅只能\"跟着走\"，收益减半（见 <code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV1eSTx6nEnY @ 07:26、@ 06:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：进入中期（约 10 分钟后）判断依据：射手是否已经能独立吃线、有没有被越塔风险决策分支：带射手快速转线发育 → 占上半图视野 → 龙坑草埋伏反例：「辅助要跟团」——中…"}, {"id": "K-L16", "cat": "L", "title": "对面有钟馗这类钩子：**吃钩子是你的活**", "self": "<h3><a class=\"kref\" href=\"#K-L16\">K-L16<\/a> 对面有钟馗这类钩子：<strong>吃钩子是你的活<\/strong><\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面选出强制位移型辅助（钟馗为代表）<\/li><li><strong>判断依据<\/strong>：己方谁站在能被勾到的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>由辅助去吃钩<\/strong>，不要让它勾到 C 位；辅助被勾是\"可以接受的结果\"，C 位被勾是\"这波没了\"<\/li><li>团战前<strong>跟着钩子走<\/strong>：他去哪你跟到哪，防他勾自家野区 Buff<\/li><li>站位避开\"中左\"这类视野盲区的正面入口<\/li><li><strong>反例<\/strong>：「辅助要保护 C 位」——保护的具体动作就是<strong>站在他和钩子之间<\/strong>。躲在后面不叫保护。<\/li><li><strong>来源<\/strong>：BV1DGHx61EHn @ 11:08、@ 11:51、@ 14:35（\"你辅助要去挡钟馗钩子呀\"）；@ 03:37（\"你跟着钟馗走就可以防止钟馗勾野了\"）<\/li><li><strong>可信度<\/strong>：中高（这是一局实录里的指挥，说话人位置未确认，但内容是<strong>明确对辅助下的指令<\/strong>，可直接采）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面选出强制位移型辅助（钟馗为代表）判断依据：己方谁站在能被勾到的位置决策分支：由辅助去吃钩，不要让它勾到 C 位；"}, {"id": "K-L17", "cat": "L", "title": "开团前先确认队友跟不跟，不跟就不开", "self": "<h3><a class=\"kref\" href=\"#K-L17\">K-L17<\/a> 开团前先确认队友跟不跟，不跟就不开<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何要主动开团的时刻<\/li><li><strong>判断依据<\/strong>：队友是否知道你要开（信号/语音）、是否有输出位在射程内<\/li><li><strong>决策分支<\/strong>：先打信号确认；确认不到就不开，改打消耗<\/li><li><strong>为什么这条属于游走<\/strong>：另外四路开团失败最多是\"死一个人\"，游走开团失败是\"全队没了\"——因为游走是唯一\"用控制换队友输出\"的位置，队友没跟上，你的控制就是白交。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 13:09（\"如果队友能很好配合，盾山 T0 强度是有的\"）<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何要主动开团的时刻判断依据：队友是否知道你要开（信号/语音）、是否有输出位在射程内决策分支：先打信号确认；"}, {"id": "K-L18", "cat": "L", "title": "打连体（2v2）：卡线压位置，别急着换血", "self": "<h3><a class=\"kref\" href=\"#K-L18\">K-L18<\/a> 打连体（2v2）：卡线压位置，别急着换血<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线<\/li><li><strong>判断依据<\/strong>：己方 2v2 能不能打过、对面射手敢不敢压<\/li><li><strong>决策分支<\/strong>：<\/li><li>打得过 → <strong>卡线压位置<\/strong>：对面过来就打状态，不过来就掉兵<\/li><li>打不过 → 退塔下接，别硬换<\/li><li><strong>反例<\/strong>：「打不过就消耗」——打不过的时候消耗等于送，退塔下让对方\"吃掉这波兵但不拿人头\"才是最小损失。<\/li><li><strong>交叉<\/strong>：这条和发育路共用（<code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code>），判据重心不同——<strong>辅助看的是\"能不能卡住位置\"，射手看的是\"敢不敢吃这波兵\"<\/strong>。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39、@ 03:00<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线判断依据：己方 2v2 能不能打过、对面射手敢不敢压决策分支：打得过 → 卡线压位置：对面过来就打状态，不过来就掉兵打不过 → 退塔下接，别硬换反例…"}, {"id": "K-L51", "cat": "L", "title": "偷小野的四个窗口：5 秒 vs 10 秒这笔账", "self": "<h3><a class=\"kref\" href=\"#K-L51\">K-L51<\/a> 偷小野的四个窗口：5 秒 vs 10 秒这笔账<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你想去对面野区偷一组小野<\/li><li><strong>判断依据<\/strong>：<strong>这一组野值 5 秒，对面回来要 10 秒<\/strong>。反一组小野约 5 秒；敌方从线上赶回自家野区约 10 秒起（无位移还要绕墙，加时间）<\/li><li><strong>四个成立的窗口<\/strong>：<\/li><\/ul>\n<ol><li>敌方<strong>掉点<\/strong>（刚死）<\/li><li>敌方打野<strong>在线上露头<\/strong>（小地图上看得见他）<\/li><li>打野<strong>回城补状态<\/strong><\/li><li>残血打野躲在自家野区偷偷刷小野补状态（这时候反而要抓他，不是偷）<\/li><\/ol>\n<ul><li><strong>决策分支<\/strong>：<\/li><li>四个窗口任成立 → 反，且<strong>只反一组就走<\/strong>（多反一组，对面的 10 秒就追平你了）<\/li><li>都不成立 → 别去。你在对面野区的时间，比对面回防的时间还长<\/li><li><strong>反例<\/strong>：为了偷一组野放弃中线 —— 5 秒的收益换掉一波线的窗口，亏（见 <code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code> 的 8 秒阈值）<\/li><li><strong>交叉<\/strong>：这条和打野共用（<code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> 讲的是\"进野区要领先两个野怪\"，讲的是打野的资格；本条讲辅助的<strong>短窗口<\/strong>，门槛低得多）<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（时间数字是口播估计，但\"5 秒 vs 10 秒\"这个量级关系可靠）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你想去对面野区偷一组小野判断依据：这一组野值 5 秒，对面回来要 10 秒。"}, {"id": "K-L52", "cat": "L", "title": "开局站位：走自家打野同侧的草，不是\"跟着打野\"", "self": "<h3><a class=\"kref\" href=\"#K-L52\">K-L52<\/a> 开局站位：走自家打野同侧的草，不是\"跟着打野\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局 0:00–0:40<\/li><li><strong>判断依据<\/strong>：自家打野在哪半边开<\/li><li><strong>决策分支<\/strong>：<\/li><li>站<strong>和自家打野同侧<\/strong>的草丛 → 对面来偷另一侧 Buff 时，你这一眼就能看见<\/li><li>不确定该站哪 → <strong>进红区<\/strong>，站到能覆盖\"对面卡视野偷野位\"的那个点<\/li><li>站好之后<strong>再看一眼中路草丛<\/strong>，顺手参与第一波中线<\/li><li><strong>反例<\/strong>：「开局跟着打野一起刷」——同侧站草的价值是<strong>视野<\/strong>，不是帮打。你贴着野怪站着，反而是最没信息量的位置<\/li><li><strong>和 <a class=\"kref\" href=\"#K-L12\">K-L12<\/a> 的关系<\/strong>：L12 回答\"先去哪一路\"，本条回答\"<strong>在去之前，第一步站哪<\/strong>\"。两条不冲突，是先后关系<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局 0:00–0:40判断依据：自家打野在哪半边开决策分支：站和自家打野同侧的草丛 → 对面来偷另一侧 Buff 时，你这一眼就能看见不确定该站哪 → 进红区，站到…"}, {"id": "K-L53", "cat": "L", "title": "红隼博弈：判断链是「射辅强度 → 中射辅强度 → 中路线权」", "self": "<h3><a class=\"kref\" href=\"#K-L53\">K-L53<\/a> 红隼博弈：判断链是「射辅强度 → 中射辅强度 → 中路线权」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局红隼（发育路资源点）刷了，双方都在争<\/li><li><strong>判断依据（按顺序过）<\/strong>：<\/li><\/ul>\n<ol><li>己方<strong>射辅 2v2<\/strong> 打不打得过<\/li><li>打不过 → 对面<strong>辅助在哪<\/strong>（在中路还是在发育路）<\/li><li>都算完 → <strong>中路线权<\/strong>在谁手里（决定谁支援更快）<\/li><\/ol>\n<ul><li><strong>决策分支<\/strong>：<\/li><li>射辅弱于对面、但对面辅助在中路 → <strong>拖着对面辅助不让他支援<\/strong>，让自家强势射手单挑<\/li><li>对面辅助已经下路 → <strong>去二打一<\/strong>，并且<strong>顶着敌方射手伤害抢<\/strong>（因为对面中路有线权，支援比你快，你不抢就没了）<\/li><li>换不来 → <strong>用赤甲换节奏<\/strong>（放弃红隼，去拿对抗路的赤甲，别空手）<\/li><li><strong>反例<\/strong>：「资源点都要争」——红隼争不到是常态，关键是<strong>争不到的时候有没有替代收益<\/strong>。换赤甲就是替代收益<\/li><li><strong>交叉<\/strong>：这条是发育路（<code><a class=\"kref\" href=\"#K-L21\">K-L21<\/a><\/code>~<code><a class=\"kref\" href=\"#K-L30\">K-L30<\/a><\/code>）和游走共用的判断，但<strong>执行的人不同<\/strong>：射手负责打，辅助负责判断和卡位<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（三段判断链是本条最有价值的部分，比\"去抢红隼\"这种结论实用）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局红隼（发育路资源点）刷了，双方都在争判断依据（按顺序过）：己方射辅 2v2 打不打得过打不过 → 对面辅助在哪（在中路还是在发育路）都算完 → 中路线权在谁手里（…"}, {"id": "K-L54", "cat": "L", "title": "河灵只需要多一个人：辅助卡线，中路去抢", "self": "<h3><a class=\"kref\" href=\"#K-L54\">K-L54<\/a> 河灵只需要多一个人：辅助卡线，中路去抢<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对抗路河灵（正常刷 3 只）刷新，双方都在争<\/li><li><strong>判断依据<\/strong>：人数差 + 谁能抬斩杀线<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>三打二就够，不要两个都扑上去<\/strong><\/li><li><strong>辅助去卡线<\/strong>（挡对面过来的人），<strong>中路去抢<\/strong>（中路有伤害、能抬斩杀线）<\/li><li>打野在帮对抗路抢四级线时 → 辅助<strong>必须拉开经验区<\/strong>（见 <code><a class=\"kref\" href=\"#K-L55\">K-L55<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「人多抢得快」——两个人都扑到河灵上，对面一个人过来就能把你们俩都赶走，因为没人卡位<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对抗路河灵（正常刷 3 只）刷新，双方都在争判断依据：人数差 + 谁能抬斩杀线决策分支：三打二就够，不要两个都扑上去辅助去卡线（挡对面过来的人），中路去抢（中路有伤害…"}, {"id": "K-L55", "cat": "L", "title": "打野帮对抗路抢四级线时，辅助必须让开经验区", "self": "<h3><a class=\"kref\" href=\"#K-L55\">K-L55<\/a> 打野帮对抗路抢四级线时，辅助必须让开经验区<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：打野到对抗路帮抢四级线，你也在旁边<\/li><li><strong>判断依据<\/strong>：<strong>打野刀会分经验<\/strong><\/li><li><strong>决策分支<\/strong>：<strong>拉开距离，退出经验区<\/strong>。你的作用只剩\"卡位/防抓\"，不是\"一起打\"<\/li><li><strong>反例<\/strong>：三个人挤在一条线上打同一波兵 —— 自家对抗路上不了四，这一波帮了等于没帮，还把打野的时间搭进去了<\/li><li><strong>为什么这条容易被忽略<\/strong>：辅助的直觉是\"人多力量大\"，但<strong>经验是零和的<\/strong>。多一个人分摊，对抗路的四级就晚一波，而四级线正是这一波的全部意义<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：中高（机制层判断：经验分配规则）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：打野到对抗路帮抢四级线，你也在旁边判断依据：打野刀会分经验决策分支：拉开距离，退出经验区。"}, {"id": "K-L56", "cat": "L", "title": "支援优先级：解线 > 抓压得深的 > 帮大哥 > 卡回援 > 帮打野提速", "self": "<h3><a class=\"kref\" href=\"#K-L56\">K-L56<\/a> 支援优先级：解线 &gt; 抓压得深的 &gt; 帮大哥 &gt; 卡回援 &gt; 帮打野提速<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你手上没有明确任务，不知道下一步去哪<\/li><li><strong>判断依据<\/strong>：按下面五级顺序，<strong>从高到低<\/strong>，命中第一条就走<\/li><\/ul>\n<ol><li><strong>解线<\/strong>（百分百不亏：兵线进塔你去清，塔不掉、线不亏）<\/li><li><strong>抓压得深的<\/strong>（先给假视野再绕）<\/li><li><strong>按阵容强度帮\"大哥\"<\/strong>（<strong>大哥不一定是射手<\/strong>）<\/li><li><strong>去卡对面回援位置<\/strong>，抢下一波线权<\/li><li>都没事 → <strong>帮打野提速<\/strong><\/li><\/ol>\n<ul><li><strong>节奏约束<\/strong>：资源一般<strong>两波中线刷一次<\/strong>，所以平均<strong>每两波只需要去一次<\/strong>。不用每波都动<\/li><li><strong>反例<\/strong>：「跟着射手走一整局」——如果射手不是大哥（比如这局中路是干将、射手是后手位），你的\"保护\"就是在给错误的人加班<\/li><li><strong>和 <a class=\"kref\" href=\"#K-L15\">K-L15<\/a> 的关系<\/strong>：L15 说\"中期跟射手转线\"，本条说\"<strong>先确认射手是不是大哥<\/strong>\"。两条一起读：跟的是\"大哥\"，不是\"射手\"这个位置<\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（五级排序 + \"大哥不一定是射手\"这句是本条的核心，纠正了 L15 的盲区）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你手上没有明确任务，不知道下一步去哪判断依据：按下面五级顺序，从高到低，命中第一条就走解线（百分百不亏：兵线进塔你去清，塔不掉、线不亏）抓压得深的（先给假视野再绕）按…"}, {"id": "K-L57", "cat": "L", "title": "三条纪律：不同时干两件事 / 半途平衡 / 统一决策", "self": "<h3><a class=\"kref\" href=\"#K-L57\">K-L57<\/a> 三条纪律：不同时干两件事 / 半途平衡 / 统一决策<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何一波决策<\/li><li><strong>三条纪律<\/strong>：<\/li><\/ul>\n<ol><li><strong>不同时干两件事<\/strong>——要入侵就别让射手同时去拿红隼。分兵 = 两边都不够人<\/li><li><strong>半途平衡<\/strong>——另半张地图人多，你这半图就得缩。<strong>宁可不吃线，也别被四人越塔<\/strong><\/li><li><strong>统一决策<\/strong>——队友白起空大两波，第三波他说开，<strong>你也要跟<\/strong>。你不跟，他开到了也是白输<\/li><\/ol>\n<ul><li><strong>为什么第三条反直觉<\/strong>：因为它不是\"最优决策\"，是\"<strong>最优的执行<\/strong>\"。一个错误的决定被五个人执行，比五个正确的决定各执行一半强<\/li><li><strong>反例<\/strong>：「他空了两波大，这波我不跟」——你对了，但这波团输了。辅助的价值在\"让队伍只做一个决定\"，不在\"每次都做对的决定\"<\/li><li><strong>推广<\/strong>：第 2 条（半途平衡）和 <code><a class=\"kref\" href=\"#K-L11\">K-L11<\/a><\/code>（人数差）是同一条原理的两面：<strong>永远不要让自己这一半地图上的人数处于劣势<\/strong><\/li><li><strong>来源<\/strong>：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><li><strong>可信度<\/strong>：高（三条都被原 UP 反复强调，且第 2 条与 <a class=\"kref\" href=\"#K-L11\">K-L11<\/a> 互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"跟人\"当\"保护\"<\/strong>（<a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L15\">K-L15<\/a>）→ 跟人不产生人数差，站位才产生。<\/li><li><strong>帮打野时手贱补尾刀<\/strong>（<a class=\"kref\" href=\"#K-L13\">K-L13<\/a>）→ 你赚 40 块，换他晚 30 秒到四。<\/li><li><strong>开团不看队友位置<\/strong>（<a class=\"kref\" href=\"#K-L17\">K-L17<\/a>）→ 控制交出去了，队友还在清线。<\/li><\/ol>\n<h2>4. 交叉：游走和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>开局第一波帮不帮清中<\/td><td><code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code> / <code><a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/code><\/td><\/tr><tr><td>发育路<\/td><td>开局跟不跟射手、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/code><\/td><\/tr><tr><td>打野<\/td><td>野区要不要跟<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>（打野的野区速率约束）<\/td><\/tr><tr><td>对抗路<\/td><td>边路一血要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code>（他能不能给你创造机会）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>软辅 vs 硬辅的大局观差异<\/strong>：现在所有结论都偏硬辅（能吃钩、能开团）。大乔/鲁班大师这类功能辅的\"不吃钩\"版本没有素材。<\/li><li>逆风局的游走该怎么打（断线？保塔？）——只有大乔一条（<code><a class=\"kref\" href=\"#K-A32\">K-A32<\/a><\/code>），是英雄级不是分路级。<\/li><li>中期\"跟射手\"和\"跟打野\"的取舍阈值（多少经济差该换人）。<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何一波决策三条纪律：不同时干两件事——要入侵就别让射手同时去拿红隼。"}], "hue": 358, "heroes": ["苏烈", "大乔", "张良", "刘禅", "墨子", "太乙真人", "孙策", "孙膑", "庄周", "廉颇", "武则天", "钟馗", "项羽", "鬼谷子", "鲁班大师", "东皇太一", "元辅", "刘邦", "夏侯惇", "大禹", "姜子牙", "安奈特", "少司缘", "张飞", "明世隐", "朵莉亚", "杨玉环", "桑启", "海月", "牛魔", "王昭君", "瑶", "白起", "空空儿", "蔡文姬", "赵怀真", "达摩", "金蝉", "盾山", "元流之子", "卢雅那"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "cross": ["中路", "发育路", "对抗路", "打野"]}, {"key": "adc", "name": "发育路", "icon": "射", "motto": "这波兵敢不敢吃", "file": "03_发育路.md", "title": "发育路：这波兵我敢不敢吃", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。 2026-11-01 补入 <strong>射手第一视角<\/strong>素材（BV1X2jV6KEiP，巅峰万强局 13 分钟推进公式），原来\"只有辅助视角\"的缺口已补上。<\/p><\/blockquote>\n<h2>1. 射手的位置特征：唯一能把经济变成塔的位置<\/h2>\n<p><strong>射手是全场唯一有持续推进能力的位置。<\/strong> 这不是夸射手强，是说明职责错位有多严重：<\/p>\n<blockquote><p>原话：「唯一有推进能力的射手不去压塔，是没有人会想着去推塔的。」<\/p><\/blockquote>\n<p>所以射手的核心矛盾不是\"怎么刷得更快\"，而是<strong>\"我什么时候能把这段经济换成塔\"<\/strong>。一个分均 800 还一直输的射手，问题不在经济，在于把所有时间都花在了\"继续刷\"上——低分段节奏之所以慢，就是因为五个人都在发育，没人推塔。<\/p>\n<p>第二个特征：<strong>射手的机动性和保命技能是同一件事<\/strong>。位移/闪现既是你追人的手段，也是你活命的唯一手段。这条推出后面好几条判据。<\/p>\n<h2>2. 判断顺序（一局的主线）<\/h2>\n<pre><code>开局（0–2 分钟）   → 对线三段：前两波看中辅，第三波看打野      K-L22\n   ↓\n2–4 分钟          → 卡不卡线？看队友能不能先到                K-L23\n   ↓ 卡线\n                  → 卡线的目的不是吃兵，是逼他跟你打一套        K-L24\n   ↓ 4 分钟以后\n                  → 这波线能不能吃，取决于自家中路有没有线权    K-L26\n   ↓ 7 分钟前\n                  → 不转线不推塔，一组兵线 + 一只小野的循环      K-L28\n   ↓ 中期\n                  → 团战只打\"前排互相缠斗\"的那种团              K-L27<\/code><\/pre>\n<h2>3. 分条判断<\/h2>", "entries": [{"id": "K-L21", "cat": "L", "title": "射手的经济不是\"刷得多\"，是\"推到塔\"——你不压塔，全队都不会推塔", "self": "<h3><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> 射手的经济不是\"刷得多\"，是\"推到塔\"——你不压塔，全队都不会推塔<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何\"经济领先但赢不了\"的局面<\/li><li><strong>判断依据<\/strong>：这 3 分钟里，你有没有把兵线送到对面塔下并开始拆<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济领先且有安全窗口 → <strong>去压塔/拆塔<\/strong>，这才是把经济兑现<\/li><li>经济领先但没有安全窗口 → 继续吃线，但每次吃完都要问\"这波能不能顺势推一下\"<\/li><li><strong>反例<\/strong>：「我经济最高，等装备成型再说」——装备成型的时间点是<strong>由拆塔进度决定的<\/strong>，不是由分钟数决定的。对面塔还在，你永远在对手视野里刷钱。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 00:23；BV1X2jV6KEiP @ 00:26；BV1X2jV6KEiP @ 00:28<\/li><li><strong>可信度<\/strong>：高（UP 主用一整局演示\"分均 800 还输\"的思维误区，结论与操作一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何\"经济领先但赢不了\"的局面判断依据：这 3 分钟里，你有没有把兵线送到对面塔下并开始拆决策分支：经济领先且有安全窗口 → 去压塔/拆塔，这才是把经济兑现经济领先但…"}, {"id": "K-L22", "cat": "L", "title": "开局对线分三段看：前两波看中辅，第三波看打野", "self": "<h3><a class=\"kref\" href=\"#K-L22\">K-L22<\/a> 开局对线分三段看：前两波看中辅，第三波看打野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：0–2 分钟，发育路对线<\/li><li><strong>判断依据<\/strong>：① 头两波兵时双方中单/辅助的支援意愿 ② 第三波兵时双方打野的位置<\/li><li><strong>决策分支<\/strong>：<\/li><li>前两波 → 不指望打野，只看自家辅助在不在；中辅都不来就纯保状态<\/li><li>第三波 → 打野位置决定这波敢不敢压（打野在我方半区 → 可压）<\/li><li><strong>反例<\/strong>：「开局就该硬刚」——前两波的火力全部来自中辅，打野这时在刷第一轮，这时候换血是拿自己的血去换对方的耐心。<\/li><li><strong>分路差异<\/strong>：这条只有发育路成立。中路前两波看的是\"对面清线速度\"（<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>），对抗路看的是\"谁能卡住线\"（<code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>），打野看的是\"谁能反野\"（<code><a class=\"kref\" href=\"#K-L42\">K-L42<\/a><\/code>）。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 00:42；BV1X2jV6KEiP @ 00:43<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：0–2 分钟，发育路对线判断依据：① 头两波兵时双方中单/辅助的支援意愿 ② 第三波兵时双方打野的位置决策分支：前两波 → 不指望打野，只看自家辅助在不在；"}, {"id": "K-L23", "cat": "L", "title": "卡不卡线，唯一判据是「队友能不能先到」", "self": "<h3><a class=\"kref\" href=\"#K-L23\">K-L23<\/a> 卡不卡线，唯一判据是「队友能不能先到」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：兵线交汇，决定卡在塔外清还是直接推掉<\/li><li><strong>判断依据<\/strong>：① 我方中野能不能比对面先支援到 ② 对手水平（会不会看小地图）<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友能先到 → <strong>卡线<\/strong>，让对面\"想吃这波线就必须跟你打一套\"<\/li><li>队友被压在塔前、来不了 → <strong>不卡，直接推掉<\/strong>，别在塔外站着挨打<\/li><li>前期续航不够 → 不卡（<code>@ 03:40<\/code>：小兵伤害会把你打到半血以上）<\/li><li><strong>反例<\/strong>：「卡线才是高手」——原话很直白：如果这把是低分段，这波线他根本不会去卡，而是直接推掉。<strong>卡线不是技术，是\"我这边有人、你那边没人\"的判断结果。<\/strong><\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 02:05；BV1X2jV6KEiP @ 02:07；BV1X2jV6KEiP @ 02:10；BV1X2jV6KEiP @ 02:13<\/li><li><strong>可信度<\/strong>：高（同一条视频给了\"卡\"和\"不卡\"两种处理的完整理由）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：兵线交汇，决定卡在塔外清还是直接推掉判断依据：① 我方中野能不能比对面先支援到 ② 对手水平（会不会看小地图）决策分支：队友能先到 → 卡线，让对面\"想吃这波线就必须…"}, {"id": "K-L24", "cat": "L", "title": "卡线的目的不是吃兵，是逼他跟你打——打人比推线值", "self": "<h3><a class=\"kref\" href=\"#K-L24\">K-L24<\/a> 卡线的目的不是吃兵，是逼他跟你打——打人比推线值<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：已经把线卡在塔外，对面射手还想吃这波兵<\/li><li><strong>判断依据<\/strong>：对面是否必须上前（不吃这波线就掉经济）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他上前 → <strong>优先打人<\/strong>，打得越凶，队友的收割机会越多<\/li><li>他放弃这波线 → 你也别推，继续卡着（推掉等于把线送给他）<\/li><li><strong>反例<\/strong>：「卡线就是为了自己安稳补刀」——那样你只是把兵线挪了个位置。卡线的价值在于<strong>强迫对面进入你的攻击范围<\/strong>，让他用血换兵。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 02:15；BV1X2jV6KEiP @ 02:17；BV1X2jV6KEiP @ 02:19<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：已经把线卡在塔外，对面射手还想吃这波兵判断依据：对面是否必须上前（不吃这波线就掉经济）决策分支：他上前 → 优先打人，打得越凶，队友的收割机会越多他放弃这波线 → 你…"}, {"id": "K-L25", "cat": "L", "title": "保状态 > 保命：闪现是用来保血线的，不是保人头的", "self": "<h3><a class=\"kref\" href=\"#K-L25\">K-L25<\/a> 保状态 &gt; 保命：闪现是用来保血线的，不是保人头的<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期血量被打掉一半以上<\/li><li><strong>判断依据<\/strong>：接下来 60 秒，你会不会被越塔<\/li><li><strong>决策分支<\/strong>：<\/li><li>血量偏低且对面中野位置不明 → <strong>把状态补满<\/strong>，宁可丢一波兵<\/li><li>有明确击杀机会但会掉血 → 放弃击杀，保状态<\/li><li><strong>反例<\/strong>：「残血人头/炮车不能放，交闪现也要拿」——原话把这件事说透了：低分射手是用闪现<strong>保命<\/strong>，高分射手是用闪现<strong>保状态<\/strong>。前者的结果就是\"经常在对线期间被多人越塔\"。<\/li><li><strong>为什么这条属于发育路<\/strong>：只有射手会被\"越塔\"直接判死（没位移、血少、位置固定），其他位置残血可以靠逃进野区活下来。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:11；BV1X2jV6KEiP @ 04:26；BV1X2jV6KEiP @ 04:29；BV1X2jV6KEiP @ 04:31<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期血量被打掉一半以上判断依据：接下来 60 秒，你会不会被越塔决策分支：血量偏低且对面中野位置不明 → 把状态补满，宁可丢一波兵有明确击杀机会但会掉血 → 放弃击…"}, {"id": "K-L26", "cat": "L", "title": "4 分钟以后，能不能吃这波线取决于「自家中路有没有线权」", "self": "<h3><a class=\"kref\" href=\"#K-L26\">K-L26<\/a> 4 分钟以后，能不能吃这波线取决于「自家中路有没有线权」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：4 分钟之后，每一波兵线进塔前<\/li><li><strong>判断依据<\/strong>：自家中路有没有线权；对方中单/辅助的小地图动向<\/li><li><strong>决策分支<\/strong>：<\/li><li>自家中路有线权 → 中线推过去，对面中单被钉住 → 这波线可以吃<\/li><li>自家中路无线权 → 对面中单随时能下来 → <strong>这波线进塔就会被越<\/strong>，提前撤<\/li><li><strong>反例<\/strong>：「我被越塔是因为队友不来帮」——原话反过来了：<strong>不是队友不愿意来，而是他们同样被压在塔前<\/strong>。你被越塔的根因在中路。<\/li><li><strong>交叉<\/strong>：这是<strong>中路和发育路之间最硬的一条因果<\/strong>。<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>/<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code> 决定中线权，中线权决定发育路敢不敢吃线；反过来发育路有线权时也能反哺中路（<code><a class=\"kref\" href=\"#K-L03\">K-L03<\/a><\/code> 的\"打野在同侧\"分支）。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 04:38；BV1X2jV6KEiP @ 04:40；BV1X2jV6KEiP @ 05:01<\/li><li><strong>可信度<\/strong>：高（素材用一整波被三包一的死亡做反证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：4 分钟之后，每一波兵线进塔前判断依据：自家中路有没有线权；"}, {"id": "K-L27", "cat": "L", "title": "只打\"前排互相缠斗\"的团，追逐战一律不跟", "self": "<h3><a class=\"kref\" href=\"#K-L27\">K-L27<\/a> 只打\"前排互相缠斗\"的团，追逐战一律不跟<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中期团战打起来，你要不要进场<\/li><li><strong>判断依据<\/strong>：① 双方前排/开团手是否在缠斗 ② 我方是在追人还是在打阵地<\/li><li><strong>决策分支<\/strong>：<\/li><li>前排互相咬住 → <strong>进<\/strong>，这是射手唯一有输出空间的团<\/li><li>我方在追人（对面在跑）→ <strong>不进<\/strong>，射手的追击能力=保命技能，追人等于自杀<\/li><li><strong>反例<\/strong>：「队友在打，我不去要被骂」——原话：射手不擅长追击，喜欢追人的射手死亡率一定极高。不去比去了送好。<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 07:39；BV1X2jV6KEiP @ 07:44；BV1X2jV6KEiP @ 07:47；BV1X2jV6KEiP @ 07:53<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中期团战打起来，你要不要进场判断依据：① 双方前排/开团手是否在缠斗 ② 我方是在追人还是在打阵地决策分支：前排互相咬住 → 进，这是射手唯一有输出空间的团我方在追人…"}, {"id": "K-L28", "cat": "L", "title": "7 分钟前别转线：一组兵线 + 一只小野的循环就够", "self": "<h3><a class=\"kref\" href=\"#K-L28\">K-L28<\/a> 7 分钟前别转线：一组兵线 + 一只小野的循环就够<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：小野刷完了，\"没事做\"想转线<\/li><li><strong>判断依据<\/strong>：下路塔还在不在；转线会不会比对面射手晚到<\/li><li><strong>决策分支<\/strong>：<\/li><li>下塔还在、队友没来帮拆 → <strong>不转线<\/strong>，守\"一组兵线 + 一只小野\"的循环，等队友来拔塔<\/li><li>要转线 → 先做风险判定：<strong>没抢到线权就转中，你比对面射手晚到<\/strong>，这波团你接不上<\/li><li><strong>反例<\/strong>：「转线能吃到更多经济」——可以，但风险同步上升。原话：\"机遇和风险永远是并存的，你的转线真的提高了你的收益吗？\"<\/li><li><strong>来源<\/strong>：BV1X2jV6KEiP @ 05:06；BV1X2jV6KEiP @ 05:10；BV1X2jV6KEiP @ 05:39；BV1X2jV6KEiP @ 05:41<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：小野刷完了，\"没事做\"想转线判断依据：下路塔还在不在；"}, {"id": "K-L29", "cat": "L", "title": "2v2 的线权看辅助，不看射手（换任何射手都不变）", "self": "<h3><a class=\"kref\" href=\"#K-L29\">K-L29<\/a> 2v2 的线权看辅助，不看射手（换任何射手都不变）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路 2v2 对线期<\/li><li><strong>判断依据<\/strong>：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方辅助强 → 敢压，按 <a class=\"kref\" href=\"#K-L23\">K-L23<\/a>/<a class=\"kref\" href=\"#K-L24\">K-L24<\/a> 卡线打人<\/li><li>我方辅助弱 → 退塔下接，接受\"掉几个兵换不掉人头\"<\/li><li><strong>反例<\/strong>：「我伤害比他高，应该压」——2v2 的强度由辅助的先手/承伤能力决定，射手前期的伤害差距远小于\"谁能先控住\"。<\/li><li><strong>来源<\/strong>：BV1i6n9z7EWH @ 02:39；BV1i6n9z7EWH @ 03:00<\/li><li><strong>可信度<\/strong>：中高（盾山视角，把 2v2 胜负明确归因到辅助身上）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路 2v2 对线期判断依据：双方辅助的强度（能不能卡位、能不能吃伤害），而不是双方射手的伤害决策分支：我方辅助强 → 敢压，按 K-L23/K-L24 卡线打人我方…"}, {"id": "K-L30", "cat": "L", "title": "射手是\"被调度去安全线\"的位置，不是\"守着下路\"的位置", "self": "<h3><a class=\"kref\" href=\"#K-L30\">K-L30<\/a> 射手是\"被调度去安全线\"的位置，不是\"守着下路\"的位置<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：下路被压、下塔已掉、或中线空出来<\/li><li><strong>判断依据<\/strong>：哪条线的兵线位置安全（能吃到、不被越）<\/li><li><strong>决策分支<\/strong>：下路被压 → 去中路补线（中单转线的空档）；上路空出 → 也可以去，但要有队友接应<\/li><li><strong>反例<\/strong>：「射手就该待在下路」——素材里的指挥原话是\"我们就叫射手去中路补线\"\"把射手跟中单摇过来\"。<\/li><li><strong>来源<\/strong>：BV14VuVzWEBE @ 03:09；BV14VuVzWEBE @ 03:26；BV14VuVzWEBE @ 03:35<\/li><li><strong>可信度<\/strong>：中（<strong>辅助/指挥视角<\/strong>，看到的是\"怎么安排射手\"，不是射手自己的判断）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：下路被压、下塔已掉、或中线空出来判断依据：哪条线的兵线位置安全（能吃到、不被越）决策分支：下路被压 → 去中路补线（中单转线的空档）；"}, {"id": "K-L58", "cat": "L", "title": "射手分三类：呆射 / 游射 / 技能型——先分清自己是哪一类，再谈怎么打", "self": "<h3><a class=\"kref\" href=\"#K-L58\">K-L58<\/a> 射手分三类：呆射 / 游射 / 技能型——先分清自己是哪一类，再谈怎么打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：选人后、或对线被压制却不知道为什么<\/li><li><strong>判断依据<\/strong>：<strong>你能不能在没有技能的时候站着输出<\/strong><\/li><li><strong>呆射<\/strong>（伽罗、后羿、鲁班七号、黄忠）：全程靠普攻，没技能也能打 → <strong>怕被切，不怕对拼<\/strong><\/li><li><strong>游射<\/strong>（公孙离、马可波罗）：伤害靠技能段位移 + 被动，<strong>技能交完就是呆射<\/strong>（BV1Qxd8BGEW5 @ 04:05）<\/li><li><strong>技能型<\/strong>（敖隐）：伤害全在技能里，<strong>没技能不能站撸<\/strong>（BV1ngLQ6HED4 @ 01:13）<\/li><li><strong>决策分支<\/strong>：<\/li><li>呆射 vs 游射 → <strong>打一波<\/strong>：双方技能交完后剩下的平A时间，游射点不过呆射（BV1X2jV6KEiP @ 01:18）<\/li><li>游射 vs 呆射 → <strong>不要对拼到底<\/strong>，用位移拉身位、分段消耗，把战斗拆成 3 次小换血<\/li><li>技能型 vs 任何人 → <strong>留一个技能用于撤退<\/strong>，永远不要三技能全交<\/li><li><strong>反例<\/strong>：「我练的是操作型的英雄，所以他打不过我」——类型决定的是<strong>交换方式<\/strong>，不是强度。游射对呆射打一整波必输，打三次小换血才可能赢。<\/li><li><strong>分路差异<\/strong>：只有发育路有这种\"同一位置、三种战斗形态\"的分化。中路法师也分炮台/法刺，但差异在射程与进场，不在\"能不能站撸\"。<\/li><li><strong>来源<\/strong>：BV1Qxd8BGEW5 @ 04:05；BV1ngLQ6HED4 @ 01:13；BV1X2jV6KEiP @ 01:18；BV1WzbR6KEfX @ 00:38（把射手按\"有没有自保能力\"分类）<\/li><li><strong>可信度<\/strong>：中高（三位 UP 各自从自己的英雄视角给出同一分类逻辑）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：选人后、或对线被压制却不知道为什么判断依据：你能不能在没有技能的时候站着输出呆射（伽罗、后羿、鲁班七号、黄忠）：全程靠普攻，没技能也能打 → 怕被切，不怕对拼游射（公…"}, {"id": "K-L59", "cat": "L", "title": "队友掉点 = 你的资源窗口：接管，不是去救", "self": "<h3><a class=\"kref\" href=\"#K-L59\">K-L59<\/a> 队友掉点 = 你的资源窗口：接管，不是去救<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：打野/中单阵亡<\/li><li><strong>判断依据<\/strong>：他掉点后留下的资源（半边野区 / 一条线）你能不能在复活时间内吃完<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野死了 → <strong>刷他的野区<\/strong>（伽罗原话：打野死了你就刷他野区，中路死了你就接管他的兵线，BV1hBut6WE5k @ 06:08）<\/li><li>中单死了 → <strong>接管中线<\/strong>，同时上路可以放（@ 04:38）<\/li><li>别去救人：你去救只会让对面多一个人头（<code><a class=\"kref\" href=\"#K-L27\">K-L27<\/a><\/code> 的反面）<\/li><li><strong>反例<\/strong>：「队友死了我要去补位」——补位是\"站到他的位置上挨打\"，接管是\"吃掉他留下的资源\"。发育路要的是后者。<\/li><li><strong>为什么这条属于射手<\/strong>：射手的收益曲线最依赖经济，而队友掉点时的资源是<strong>有明确时间窗的<\/strong>（复活时间），过期就归对面。<\/li><li><strong>来源<\/strong>：BV1hBut6WE5k @ 06:08；BV1hBut6WE5k @ 06:21；BV1hBut6WE5k @ 04:38<\/li><li><strong>可信度<\/strong>：中（单来源，但同一个 UP 在两局里都执行了这条）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>4. 交叉：发育路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td><strong>中路<\/strong><\/td><td><strong>中线权决定发育路敢不敢吃线<\/strong>（最硬的一条因果）<\/td><td><code><a class=\"kref\" href=\"#K-L26\">K-L26<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L02\">K-L02<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>开局跟不跟我、2v2 谁卡线<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L29\">K-L29<\/a><\/code><\/td><\/tr><tr><td>打野<\/td><td>下路打起来他来不来；我先推塔还是先跟团<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>、<code><a class=\"kref\" href=\"#K-L41\">K-L41<\/a><\/code><\/td><\/tr><tr><td>对抗路<\/td><td>我把线推过去，他这波线让不让<\/td><td><code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>只刷不推<\/strong>（<a class=\"kref\" href=\"#K-L21\">K-L21<\/a>）→ 分均 800 还输，因为塔一座没掉。<\/li><li><strong>把闪现用来抢人头<\/strong>（<a class=\"kref\" href=\"#K-L25\">K-L25<\/a>）→ 交完闪现的 90 秒，你就是那个被三包一的人。<\/li><li><strong>追人<\/strong>（<a class=\"kref\" href=\"#K-L27\">K-L27<\/a>）→ 射手的追击能力就是保命能力，追一次少一条命。<\/li><\/ol>\n<h2>6. 待补<\/h2>\n<ul><li><strong>不同类型射手的具体对线强度表<\/strong>：三分法已写进 <code><a class=\"kref\" href=\"#K-L58\">K-L58<\/a><\/code>，但\"伽罗打戈娅\"\"公孙离打狄仁杰\"这种逐对明细还只有零散几条（见 <code>B_克制关系/公孙离.md<\/code>）。<\/li><li><strong>被越塔的预警阈值<\/strong>：什么阵容/什么时间点会被二包一，现在只有\"看中线权\"这一条判据。<\/li><li><strong>射手什么时候开始跟团<\/strong>（从吃线切到参团的经济/时间阈值），素材给了两条下界：7 分钟前不转线（<code><a class=\"kref\" href=\"#K-L28\">K-L28<\/a><\/code>）、9 分钟必须抱团（伽罗 @ 07:28），中间的空档没有明确判据。<\/li><\/ul>", "sum": "适用版本：S45触发条件：打野/中单阵亡判断依据：他掉点后留下的资源（半边野区 / 一条线）你能不能在复活时间内吃完决策分支：打野死了 → 刷他的野区（伽罗原话：打野死了你就刷他野区，中路死了…"}], "hue": 256, "heroes": ["伽罗", "公孙离", "敖隐", "狄仁杰", "后羿", "阿古朵", "元流之子", "孙尚香", "孙权", "戈娅", "李元芳", "百里守约", "艾琳", "苍", "莱西奥", "蒙犽", "虞姬", "马可波罗", "鲁班七号", "黄忠"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "cross": ["中路", "游走", "对抗路", "打野"]}, {"key": "solo", "name": "对抗路", "icon": "抗", "motto": "压线还是放线", "file": "04_对抗路.md", "title": "对抗路：这一波我压线还是放线", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 对抗路的位置特权：可以合法地不参团<\/h2>\n<p>对抗路离主战场最远，<strong>跑一趟的成本最高<\/strong>。所以这一路的核心不是\"我什么时候去支援\"，而是反过来——<strong>\"我能不能用不去支援，换到更多东西\"<\/strong>。<\/p>\n<p>这让对抗路成了五路里<strong>自主权最高<\/strong>的位置：中路必须转线、游走必须到点、射手必须跟辅助，只有对抗路可以说\"这波我不去，我把线带穿\"。<\/p>\n<p>代价也很清楚：<strong>你不在，团战就是 4v5<\/strong>。所以每一次\"不去\"都必须换来对等的东西——一座塔、两个野怪、或者对面一条线的经济。<\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 0 步：把收益分成两层——主要收益 / 额外收益    → K-L35\n第 1 步：这一波，我要不要压线？                  → K-L31（判据：压完能不能安全撤）\n第 2 步：压线的收益是什么？                      → K-L32（对面打野来不了 / 对面边路升不到四）\n第 3 步：线权换来的钱，怎么花？                  → K-L33（立刻走，别刷上头）\n第 4 步：额外收益要不要去拿？                    → K-L36（判据：会不会影响主要收益）\n第 5 步：4 分半了，我达标了吗？                  → K-L37（一件成品装 + 鞋 / 0-0-0）\n第 6 步：3:50 的暴君去不去？                     → K-L39（判据：有没有被抢的风险）\n第 7 步：4 分钟之后，带哪条线？                  → K-L40（判据：对面打野位置）\n   ↓\n打不过怎么办？                                 → K-L34（闷头发育也是赢法）\n   ↓\n想放龙换别的东西？                             → K-L38（野区刷新同步的算法）<\/code><\/pre>", "entries": [{"id": "K-L31", "cat": "L", "title": "对抗路可以把线权直接换成钱——但必须先算好怎么撤", "self": "<h3><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> 对抗路可以把线权直接换成钱——但必须先算好怎么撤<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：拿到线权、把兵线推到对面塔前<\/li><li><strong>判断依据<\/strong>：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到<\/li><li><strong>决策分支<\/strong>：<\/li><li>有撤离手段 → <strong>推完立刻走<\/strong>，去中路吃一波线、或进野区刷钱，不要在自家线上原地站着<\/li><li>没有撤离手段 → 只推到河道，不深入<\/li><li><strong>反例<\/strong>：「推完线回城补给」——回城是最亏的选项：你花了 8 秒什么都不做。推完线去做下一件事，才是把线权变现。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:52、@ 04:06、@ 04:08（\"没传送的时候一波清兵线吃野怪刷钱；有传送的时候，清完兵线就传送阵传送开西，保证自己用最快的速度刷最多的钱\"）<\/li><li><strong>可信度<\/strong>：中高（司空震视角的完整一局，动作与口播一致）<\/li><li><strong>分路差异<\/strong>：中路也能推完线走，但<strong>中路走的方向是\"支援\"<\/strong>；对抗路走的方向是\"再吃一份钱\"。同一动作，目的不同。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：拿到线权、把兵线推到对面塔前判断依据：① 你的撤离手段（传送/位移/疾跑）是否可用 ② 对面打野小地图能不能看到决策分支：有撤离手段 → 推完立刻走，去中路吃一波线、…"}, {"id": "K-L32", "cat": "L", "title": "卡线的双重收益：对面打野不敢来 + 对面边路升不到四", "self": "<h3><a class=\"kref\" href=\"#K-L32\">K-L32<\/a> 卡线的双重收益：对面打野不敢来 + 对面边路升不到四<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你在线权上压制对面边路<\/li><li><strong>判断依据<\/strong>：兵线位置（能否卡在自家塔前）与对面打野的开局路线<\/li><li><strong>决策分支<\/strong>：把兵线<strong>卡在我方塔前<\/strong>——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了也抓不到人）<\/li><li><strong>反例<\/strong>：「压线就是把兵推过去」——推到对面塔下等于把兵线送给对方，他还是能吃到经验。<strong>卡线和推线是两个相反的动作。<\/strong><\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 02:47（\"因为我们的卡线，导致对面打野第一时间不敢来，哪吒也没升四，搞得对面一点战斗力都没有\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>交叉<\/strong>：这条直接决定<strong>打野能不能进对面野区<\/strong>（<code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code>）——我方边路卡住线，对面打野才不敢反蹲。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你在线权上压制对面边路判断依据：兵线位置（能否卡在自家塔前）与对面打野的开局路线决策分支：把兵线卡在我方塔前——对面边路吃不到经验，同时对面打野第一波不敢来（因为来了…"}, {"id": "K-L33", "cat": "L", "title": "别刷上头：刷钱是为了能去支援，不是为了刷钱", "self": "<h3><a class=\"kref\" href=\"#K-L33\">K-L33<\/a> 别刷上头：刷钱是为了能去支援，不是为了刷钱<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你已经经济领先，正在连续刷钱<\/li><li><strong>判断依据<\/strong>：地图上有没有正在打的团/即将刷新的资源点<\/li><li><strong>决策分支<\/strong>：<\/li><li>队友在打 → <strong>立刻传送/走过去<\/strong>，能用传送就不用跑的（省赶路时间）<\/li><li>没有事发生 → 继续带线刷钱，带完线顺手入侵野区<\/li><li><strong>反例<\/strong>：「我经济领先，先刷满再说」——原话是\"千万不要一直刷钱，刷上头了\"。经济领先的唯一用途是<strong>在关键团里碾压<\/strong>，不参团的领先是纸面数字。<\/li><li><strong>来源<\/strong>：BV12wtr6cEMR @ 05:30、@ 05:37、@ 06:24<\/li><li><strong>可信度<\/strong>：中高（UP 主自己在同一局里既示范了刷钱也示范了节制）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你已经经济领先，正在连续刷钱判断依据：地图上有没有正在打的团/即将刷新的资源点决策分支：队友在打 → 立刻传送/走过去，能用传送就不用跑的（省赶路时间）没有事发生 →…"}, {"id": "K-L34", "cat": "L", "title": "打不过就闷头发育——经济领先也是一种赢法", "self": "<h3><a class=\"kref\" href=\"#K-L34\">K-L34<\/a> 打不过就闷头发育——经济领先也是一种赢法<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对线期被压制、支援不出去<\/li><li><strong>判断依据<\/strong>：能不能稳定吃到兵线；对面是否已经开始转线<\/li><li><strong>决策分支<\/strong>：放弃支援，专注吃线 + 刷自家野区，把经济差控制在可接受范围；等对面走位失误再打<\/li><li><strong>反例<\/strong>：「打不过也要去支援，不然队友骂」——去支援等于送第二个人头。<strong>对抗路最合法的止损就是\"不去\"。<\/strong><\/li><li><strong>来源<\/strong>：BV156QfBQEDd @ 01:14、@ 01:28（\"支援不了就闷头发育，经济领先对面边路\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对线期被压制、支援不出去判断依据：能不能稳定吃到兵线；"}, {"id": "K-L35", "cat": "L", "title": "对抗路前期的收益分两层：兵线+野怪是\"主要收益\"，其余全是\"额外收益\"", "self": "<h3><a class=\"kref\" href=\"#K-L35\">K-L35<\/a> 对抗路前期的收益分两层：兵线+野怪是\"主要收益\"，其余全是\"额外收益\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局到 4 分钟，决定这一分钟做什么<\/li><li><strong>判断依据<\/strong>：这件事属于哪一层<\/li><li><strong>主要收益<\/strong>：一波兵线 + 一组野怪（自家赤甲/小鸟这类）<\/li><li><strong>额外收益<\/strong>：对面的人头/助攻、对面野怪、中立资源（空间之灵）、中路兵线<\/li><li><strong>决策分支<\/strong>：<\/li><li>主要收益没拿 → 先拿主要收益，其他全部推后<\/li><li>主要收益已拿 → 再考虑额外收益（<a class=\"kref\" href=\"#K-L36\">K-L36<\/a>）<\/li><li><strong>反例<\/strong>：「哪里有东西就去哪」——对抗路最典型的崩法是追着额外收益跑，结果自己那波兵没吃到，4 分钟经济落后 800。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 00:16；BV1kVAfzbEBj @ 00:20；BV1kVAfzbEBj @ 00:50<\/li><li><strong>可信度<\/strong>：高（这条是整局打法的骨架，全程都在按它执行）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局到 4 分钟，决定这一分钟做什么判断依据：这件事属于哪一层主要收益：一波兵线 + 一组野怪（自家赤甲/小鸟这类）额外收益：对面的人头/助攻、对面野怪、中立资源（空…"}, {"id": "K-L36", "cat": "L", "title": "拿额外收益的前提：不影响主要收益", "self": "<h3><a class=\"kref\" href=\"#K-L36\">K-L36<\/a> 拿额外收益的前提：不影响主要收益<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：看到一个额外收益（反小鸟、吃中线、抢空间之灵）<\/li><li><strong>判断依据<\/strong>：去拿它会不会让你错过下一波兵线/自家野怪<\/li><li><strong>决策分支<\/strong>：<\/li><li>不影响 → 去拿<\/li><li>会影响 → <strong>先拿完主要收益再回头<\/strong>，或者直接放弃<\/li><li><strong>反例<\/strong>：「顺手就去了」——原话把顺序说死了：拿额外收益的前提，应该是不影响主要收益，<strong>或者拿完主要收益之后再去<\/strong>。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 01:59；BV1kVAfzbEBj @ 02:00；BV1kVAfzbEBj @ 02:03；BV1kVAfzbEBj @ 02:06<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：看到一个额外收益（反小鸟、吃中线、抢空间之灵）判断依据：去拿它会不会让你错过下一波兵线/自家野怪决策分支：不影响 → 去拿会影响 → 先拿完主要收益再回头，或者直接放…"}, {"id": "K-L37", "cat": "L", "title": "4 分半的自我校验线：一件成品装 + 一双鞋、0-0-0", "self": "<h3><a class=\"kref\" href=\"#K-L37\">K-L37<\/a> 4 分半的自我校验线：一件成品装 + 一双鞋、0-0-0<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：约 4:30<\/li><li><strong>判断依据<\/strong>：装备栏 + 战绩<\/li><li><strong>决策分支<\/strong>：<\/li><li>达到 → 说明主要收益全吃到了，可以进入\"看小地图带线\"的阶段（<a class=\"kref\" href=\"#K-L40\">K-L40<\/a>）<\/li><li>没达到 → 说明前面漏了主要收益，接下来补发育，别急着参团<\/li><li><strong>反例<\/strong>：「4 分钟该去参团了」——团战不看你到没到时间，看<strong>你的装备到没到线<\/strong>。0-0-0 也能达标，说明击杀不是这条线的考核项。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 04:26；BV1kVAfzbEBj @ 04:29；BV1kVAfzbEBj @ 04:30<\/li><li><strong>可信度<\/strong>：中高（UP 主明确把它当\"标准\"给出，但具体装备名随版本变，只取\"一件成品装 + 鞋\"这个量级）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：约 4:30判断依据：装备栏 + 战绩决策分支：达到 → 说明主要收益全吃到了，可以进入\"看小地图带线\"的阶段（K-L40）没达到 → 说明前面漏了主要收益，接下来补…"}, {"id": "K-L38", "cat": "L", "title": "对面打野从对抗路野区开 → 他的对抗路野区和暴君同时刷新", "self": "<h3><a class=\"kref\" href=\"#K-L38\">K-L38<\/a> 对面打野从对抗路野区开 → 他的对抗路野区和暴君同时刷新<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局判断出对面打野的开野侧<\/li><li><strong>判断依据<\/strong>：对面打野第一个 Buff 在哪（红开/蓝开）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面从<strong>对抗路侧<\/strong>野区开 → 他的对抗路野区和暴君同时刷新；我方红区刷新时，他的红也快刷新了<\/li><li>掌握这个时间差 → 暴君被抢风险低时，可以去反他的红<strong>换节奏<\/strong><\/li><li><strong>反例<\/strong>：「反野靠猜」——野区刷新是可以用开野侧推出来的，不用猜。不知道刷新时间就去反野，等于送。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 03:10；BV1kVAfzbEBj @ 03:12；BV1kVAfzbEBj @ 03:21；BV1kVAfzbEBj @ 03:24<\/li><li><strong>可信度<\/strong>：中高（这条是全库少见的\"可计算\"判据）<\/li><li><strong>交叉<\/strong>：和打野的 <code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> 是一对——打野算\"我领先几个野\"，边路算\"他的野什么时候刷\"。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局判断出对面打野的开野侧判断依据：对面打野第一个 Buff 在哪（红开/蓝开）决策分支：对面从对抗路侧野区开 → 他的对抗路野区和暴君同时刷新；"}, {"id": "K-L39", "cat": "L", "title": "3:50 的暴君去不去，只看\"有没有被抢的风险\"", "self": "<h3><a class=\"kref\" href=\"#K-L39\">K-L39<\/a> 3:50 的暴君去不去，只看\"有没有被抢的风险\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：3:50 左右，我方打野在打龙<\/li><li><strong>判断依据<\/strong>：对面打野在不在附近；我方上路有没有线权；对面阵容强度<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野能安稳拿 → <strong>不去<\/strong>，继续清线/吃野<\/li><li>有被抢风险（对面打野在附近、我方没线权、对面强度高）→ 去，或者干脆<strong>放龙去反他的红<\/strong><\/li><li><strong>反例<\/strong>：「龙团必须全员到」——原话：因为我们家打野是安稳拿龙的，对面打野没有去暴君，所以\"我们也不用过去\"。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 03:38；BV1kVAfzbEBj @ 03:40；BV1kVAfzbEBj @ 03:48；BV1kVAfzbEBj @ 03:50；BV1kVAfzbEBj @ 03:57<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>交叉<\/strong>：和 D 类 <code><a class=\"kref\" href=\"#K-D15\">K-D15<\/a><\/code>（没一次性资源就别硬接）方向一致，但视角不同：D 类问\"我够不够资格\"，这里问\"这波有没有风险\"。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：3:50 左右，我方打野在打龙判断依据：对面打野在不在附近；"}, {"id": "K-L40", "cat": "L", "title": "4 分钟之后，注意力从兵线转到小地图：看打野位置决定带哪条线", "self": "<h3><a class=\"kref\" href=\"#K-L40\">K-L40<\/a> 4 分钟之后，注意力从兵线转到小地图：看打野位置决定带哪条线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：过了 4 分钟，进入中期<\/li><li><strong>判断依据<\/strong>：小地图上对面打野的位置 + 哪条线的兵线正在过来<\/li><li><strong>决策分支<\/strong>：<\/li><li>打野在下半区 → 带<strong>上路/对抗路线<\/strong>（安全侧）<\/li><li>打野在上半区且视野可见 → 带下半区线，或者干脆去中路吃线<\/li><li>打野位置不明 → 只带\"能立刻退回塔下\"的那一段<\/li><li><strong>反例<\/strong>：「中期就是一直带线」——中期带线的安全性完全由对面打野的位置决定，不看他就是盲带。<\/li><li><strong>来源<\/strong>：BV1kVAfzbEBj @ 04:49；BV1kVAfzbEBj @ 04:52；BV1kVAfzbEBj @ 04:55；BV1kVAfzbEBj @ 05:00<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>压线不会撤<\/strong>（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>）→ 推完站在对面塔前，等对面打野来收。<\/li><li><strong>把卡线做成推线<\/strong>（<a class=\"kref\" href=\"#K-L32\">K-L32<\/a>）→ 想让对面难受，结果把兵线送过去让他舒服。<\/li><li><strong>刷钱刷到不参团<\/strong>（<a class=\"kref\" href=\"#K-L33\">K-L33<\/a>）→ 经济第一，团战 4v5，输了怪队友。<\/li><\/ol>\n<h2>4. 交叉：对抗路和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>打野<\/td><td>我卡线，你能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code><\/td><\/tr><tr><td>中路<\/td><td>你转线过来，这波线谁吃<\/td><td><code><a class=\"kref\" href=\"#K-L03\">K-L03<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/code><\/td><\/tr><tr><td>游走<\/td><td>边路一血要不要来帮<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li><strong>传送/传送阵的 CD 与距离<\/strong>没有素材，只能确定\"优先用传送、少跑路\"这个方向。<\/li><li>对抗路与打野的\"二包一\"配合（谁先手、怎么卡位）——无素材（打野视角的 <code><a class=\"kref\" href=\"#K-L48\">K-L48<\/a><\/code> 只讲了蹲回头点）。<\/li><li>坦克型边路 vs 战士型边路的大局观差异（现在所有结论都偏\"能带线能刷钱\"的战士/半肉）。<\/li><li><strong>\"额外收益\"的取舍在逆风局是否反过来<\/strong>（逆风可能需要主动抢额外收益搏一下）——无样本。<\/li><\/ul>", "sum": "适用版本：S45触发条件：过了 4 分钟，进入中期判断依据：小地图上对面打野的位置 + 哪条线的兵线正在过来决策分支：打野在下半区 → 带上路/对抗路线（安全侧）打野在上半区且视野可见 → 带…"}], "hue": 313, "heroes": ["夏洛特", "元歌", "嫦娥", "吕布", "大司命", "李信", "杨戬", "貂蝉", "亚瑟", "亚连", "元流之子", "关羽", "司空震", "哪吒", "姬小满", "影", "心魔六耳", "曜", "曹操", "梦奇", "橘右京", "海诺", "狂铁", "猪八戒", "盘古", "程咬金", "老夫子", "芈月", "花木兰", "蒙恬", "蚩奼", "钟无艳", "马超"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "cross": ["中路", "游走", "发育路", "打野"]}, {"key": "jungle", "name": "打野", "icon": "野", "motto": "该刷还是该抓", "file": "05_打野.md", "title": "打野：现在该刷还是该抓", "intro": "<blockquote><p>这是<strong>位置<\/strong>的结论。英雄怎么玩看 <code>A_英雄教学/<\/code>。<\/p><\/blockquote>\n<h2>1. 打野是唯一按「时间差」算账的位置<\/h2>\n<p>另外四路的资源是<strong>线<\/strong>（有固定节奏，一波接一波），打野的资源是<strong>野<\/strong>（有刷新间隔，可以被\"抢时间差\"）。所以打野的核心概念不是\"抓了几个人\"，而是：<\/p>\n<blockquote><p><strong>野区速率<\/strong>——你清完自己野区的速度，决定你能不能\"多出一次机会\"。<\/p><\/blockquote>\n<p>原话：「很多人不理解野区速率这个概念。当双方野区刷新间隔比较短时，是很难直接进野区的，<strong>进野区起码要领先对方两个野怪的时间差<\/strong>。」<\/p>\n<p>这条一旦立住，打野的所有判断都变成同一道算术题：<strong>我这一趟出去，回来的时候会不会落后节奏？<\/strong><\/p>\n<h2>2. 判断顺序<\/h2>\n<pre><code>第 0 步：这一局我是\"抢节奏\"还是\"错位\"？    → K-L46（判据：双方一级强弱）\n第 1 步：这局我一级能不能反野？            → K-L42（不能 → 决定开局刷野路线）\n第 2 步：第一轮刷完，先吃满还是先抓？      → K-L47\n第 3 步：我要不要蹭中线升四？              → K-L43（蹭了会拖野区速率，必须换来反打）\n第 4 步：这波能不能进对面野区？            → K-L44（判据：领先两个野怪 + 视野）\n第 5 步：对面打野刚露头，我去蹲哪？        → K-L48（蹲他的\"回头点\"）\n第 6 步：什么时候放弃自家野区去跟团？      → K-L45（判据：边路是否打出关键技能）<\/code><\/pre>", "entries": [{"id": "K-L41", "cat": "L", "title": "打野的 KPI 是「时间差」，不是「抓了几个人」", "self": "<h3><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> 打野的 KPI 是「时间差」，不是「抓了几个人」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每一次决定\"现在去哪\"<\/li><li><strong>判断依据<\/strong>：你这一趟出去，回来时会不会落后对面的野区节奏<\/li><li><strong>决策分支<\/strong>：<\/li><li>这一趟不亏速率 → 可以抓<\/li><li>这一趟要绕远/要蹲很久 → 不抓，保住速率<\/li><li><strong>反例<\/strong>：「打野不抓人就废了」——抓不到人的一趟，亏的是<strong>两三个野怪的时间<\/strong>，而这段时间对面打野正好在做事。抓人失败不是\"没收益\"，是\"负收益\"。<\/li><li><strong>为什么是这一路的核心<\/strong>：另外四路的资源是线（有固定节奏，不走就浪费），只有打野的资源是野（可以抢时间差）。这条判据在其他四路没有对应物。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"很多人不理解野区速率这个概念……进野区起码要领先对方两个野怪的时间差\"）<\/li><li><strong>可信度<\/strong>：高（唯一的完整打野视角素材，且它自己就在用这个概念算账）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：每一次决定\"现在去哪\"判断依据：你这一趟出去，回来时会不会落后对面的野区节奏决策分支：这一趟不亏速率 → 可以抓这一趟要绕远/要蹲很久 → 不抓，保住速率反例：「打野…"}, {"id": "K-L42", "cat": "L", "title": "开局路线由「一级能不能反野」决定，不是背固定路线", "self": "<h3><a class=\"kref\" href=\"#K-L42\">K-L42<\/a> 开局路线由「一级能不能反野」决定，不是背固定路线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：开局读条结束前<\/li><li><strong>判断依据<\/strong>：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）<\/li><li><strong>决策分支<\/strong>：<\/li><li>一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区<\/li><li>一级不好反 → <strong>从发育路野区开，往对抗路刷<\/strong>（把路线拉成一条单向线，刷完正好到能出节奏的位置）<\/li><li><strong>反例<\/strong>：「打野就按固定路线刷」——路线是<strong>为了配合一级强弱<\/strong>而存在的。一级反野失败的情况下还硬走入侵路线，等于把节奏送出去。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 03:09、@ 03:12（\"一级不好反野，这把就可以选择直接发育路野区开往对抗路\"）<\/li><li><strong>可信度<\/strong>：中高（职业级对局拆解，明确给了\"因为 A 所以 B\"的因果关系）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：开局读条结束前判断依据：① 一级对拼/惩戒能力（能否强反）② 对面打野是什么英雄（谁一级更强）决策分支：一级能反（有惩戒优势或对面一级弱）→ 直接进对面野区一级不好反…"}, {"id": "K-L43", "cat": "L", "title": "蹭中线是「投资」，不是「顺手」——必须换来升四或反打", "self": "<h3><a class=\"kref\" href=\"#K-L43\">K-L43<\/a> 蹭中线是「投资」，不是「顺手」——必须换来升四或反打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：路过中路，中单有线权/中单不在<\/li><li><strong>判断依据<\/strong>：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>差一级到四 → <strong>蹭，且优先速推中线<\/strong>（升四之后才有反打能力）<\/li><li>已经四级以上 → 不蹭，继续刷野保速率<\/li><li><strong>反例<\/strong>：「路过就吃一口」——原话紧接着就是\"因为这波蹭中线耽误了片刻的野区速率\"。<strong>蹭线的成本是看得见的（速率），收益必须能兑现，否则纯亏。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 04:31、@ 04:39（升四才有反打机会）；@ 06:01（蹭中线拖慢速率）<\/li><li><strong>可信度<\/strong>：高（同一条视频里同时给了收益和成本，是全库最完整的一组权衡）<\/li><li><strong>交叉<\/strong>：这条要和 <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code> 对着看——<strong>中单让不让，看的是打野差几级到四<\/strong>。两边判据一致，才不会互相抢。<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：路过中路，中单有线权/中单不在判断依据：① 自己离四级差多少 ② 蹭完这波能不能立刻做一件\"四级才能做的事\"决策分支：差一级到四 → 蹭，且优先速推中线（升四之后才有…"}, {"id": "K-L44", "cat": "L", "title": "进对面野区：至少领先两个野怪的时间差，并且卡住视野", "self": "<h3><a class=\"kref\" href=\"#K-L44\">K-L44<\/a> 进对面野区：至少领先两个野怪的时间差，并且卡住视野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：想反对面野区<\/li><li><strong>判断依据<\/strong>：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）<\/li><li><strong>决策分支<\/strong>：<\/li><li>领先 ≥2 个野怪 → 可以进，且<strong>边打边卡视野<\/strong>（先探草再动野怪）<\/li><li>领先不足 → 不进，稳稳刷完自家野区再出来找节奏<\/li><li><strong>反例<\/strong>：「对面打野在下路，我去反他蓝」——他去下路不代表他回不来，你的判断依据应该是<strong>时间差<\/strong>，不是\"他刚露过视野\"。<\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:36、@ 07:47（\"进野区起码要领先对方两个野怪的时间差\"）；@ 09:45、@ 09:53（\"卡好视野……全身而退\"）<\/li><li><strong>可信度<\/strong>：高（这条是全库最硬的分路判据，有明确阈值）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：想反对面野区判断依据：① 你比对面打野多刷了几个野（时间差）② 对面线上有没有人能支援过来（视野）决策分支：领先 ≥2 个野怪 → 可以进，且边打边卡视野（先探草再动…"}, {"id": "K-L45", "cat": "L", "title": "放弃自家野区去跟团的条件：边路打出了关键技能", "self": "<h3><a class=\"kref\" href=\"#K-L45\">K-L45<\/a> 放弃自家野区去跟团的条件：边路打出了关键技能<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：正在刷野，边路/中路打起来了<\/li><li><strong>判断依据<\/strong>：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）<\/li><li><strong>决策分支<\/strong>：<\/li><li>对面关键技能已交 → <strong>立刻放弃野区去跟<\/strong>（这时候的团是\"低风险高收益\"）<\/li><li>只是互相消耗 → 继续刷，别被\"打起来了\"骗过去<\/li><li><strong>反例<\/strong>：「哪边打起来就去哪边」——没有关键技能交换的团，打野去了也只能蹭点伤害，回来还落后节奏。<strong>打野参团的理由是对面交了什么，不是队友喊了什么。<\/strong><\/li><li><strong>来源<\/strong>：BV14kiYB8E7R @ 07:08、@ 07:24（\"拉视野观察到影被夏洛特打出大招……我们就可以直接放弃中线来跟团\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：正在刷野，边路/中路打起来了判断依据：那边有没有\"已经交掉的关键技能\"（大招、闪现、控制）决策分支：对面关键技能已交 → 立刻放弃野区去跟（这时候的团是\"低风险高收益…"}, {"id": "K-L46", "cat": "L", "title": "对方打野一级比你强时，开局不是\"对抗\"，是「错位」", "self": "<h3><a class=\"kref\" href=\"#K-L46\">K-L46<\/a> 对方打野一级比你强时，开局不是\"对抗\"，是「错位」<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：读条结束前，判断双方打野一级强弱<\/li><li><strong>判断依据<\/strong>：① 双方一级对拼/刷野速度 ② 双方边路的线权（能不能来帮）<\/li><li><strong>决策分支<\/strong>：<\/li><li>我方强 → 正常抢节奏，可以进对面野区（<code><a class=\"kref\" href=\"#K-L42\">K-L42<\/a><\/code>）<\/li><li>对方强 → <strong>创造错位<\/strong>：红开转上半区发育，避开他，不在开局抢节奏；等双边打开局面、经济领先后再回去<\/li><li><strong>反例<\/strong>：「打野就该刚正面，谁强谁进野区」——原话：\"我们如果和他同时出野区并不占优势。\" 明知道同步出野区打不过，还去抢，等于把开局送给对面。<\/li><li><strong>分路差异<\/strong>：这条只有打野成立。其他位置\"避开\"的代价是掉线权，打野\"避开\"的代价只是少抓一次人，账完全不同。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 01:55；BV1pU8y6VEhP @ 02:00；BV1pU8y6VEhP @ 02:01；BV1pU8y6VEhP @ 02:09<\/li><li><strong>可信度<\/strong>：中高（澜 vs 宫本的开局拆解，因果讲得很清楚）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：读条结束前，判断双方打野一级强弱判断依据：① 双方一级对拼/刷野速度 ② 双方边路的线权（能不能来帮）决策分支：我方强 → 正常抢节奏，可以进对面野区（K-L42）对…"}, {"id": "K-L47", "cat": "L", "title": "第一轮野区刷完，先把经济吃满再转中——不要提前抢节奏", "self": "<h3><a class=\"kref\" href=\"#K-L47\">K-L47<\/a> 第一轮野区刷完，先把经济吃满再转中——不要提前抢节奏<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第一轮野区清完，想去中路做事<\/li><li><strong>判断依据<\/strong>：自己当前经济/等级是否能支撑一次越塔或反蹲<\/li><li><strong>决策分支<\/strong>：<\/li><li>经济没吃满 → <strong>先吃满<\/strong>（自家剩余野 + 安全线），再转中<\/li><li>已经领先 → 转中开节奏<\/li><li><strong>反例<\/strong>：「打野要早抓才有存在感」——原话：\"这就是经济一直刷不起来的原因……所以先把经济吃满再转中。\" 半血半经济去抓，抓不到就两头亏。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 04:36；BV1pU8y6VEhP @ 04:43<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：第一轮野区清完，想去中路做事判断依据：自己当前经济/等级是否能支撑一次越塔或反蹲决策分支：经济没吃满 → 先吃满（自家剩余野 + 安全线），再转中已经领先 → 转中开…"}, {"id": "K-L48", "cat": "L", "title": "预判对面打野的\"回头点\"：他抓完人一定要回中路吃线", "self": "<h3><a class=\"kref\" href=\"#K-L48\">K-L48<\/a> 预判对面打野的\"回头点\"：他抓完人一定要回中路吃线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：对面打野刚在边路露头抓人<\/li><li><strong>判断依据<\/strong>：他抓完之后的必经路线（回中路吃兵线/回自家野区）<\/li><li><strong>决策分支<\/strong>：<\/li><li>他抓完必回中 → <strong>提前去中路线侧或他野区入口蹲<\/strong>（反小猪、卡他的回程）<\/li><li>他不回中（去另一侧）→ 直接反他刚离开的那片野区<\/li><li><strong>反例<\/strong>：「他露头了我赶紧去反野」——他去抓人不代表他的野区空着，但他的<strong>回头点<\/strong>是可预测的。抓\"回头点\"比抓\"空野区\"稳定。<\/li><li><strong>来源<\/strong>：BV1pU8y6VEhP @ 05:39；BV1pU8y6VEhP @ 05:43<\/li><li><strong>可信度<\/strong>：中（单来源，但是明确的因果表述）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：对面打野刚在边路露头抓人判断依据：他抓完之后的必经路线（回中路吃兵线/回自家野区）决策分支：他抓完必回中 → 提前去中路线侧或他野区入口蹲（反小猪、卡他的回程）他不回…"}, {"id": "K-L49", "cat": "L", "title": "反野是「团队收益」：反几只，就得放几只自家小野", "self": "<h3><a class=\"kref\" href=\"#K-L49\">K-L49<\/a> 反野是「团队收益」：反几只，就得放几只自家小野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你反了对面野区的小野<\/li><li><strong>判断依据<\/strong>：<strong>你的时间只有一份<\/strong>。拿去反野，就没有时间刷自家小野<\/li><li><strong>决策分支<\/strong>：<\/li><li>反了 N 只对面小野 → <strong>放 N 只自家小野给队友<\/strong>（这就是\"反几只放几只\"）<\/li><li>不放的后果：出野区比对面慢 → <strong>对面线上比你早到 → 队友线上劣势<\/strong><\/li><li><strong>反例<\/strong>：「反野是我的收益，自家野当然也是我的」——你两头都要，结果是对面打野出野区比你快，他不难受，难受的是你的队友<\/li><li><strong>正确表述<\/strong>（原话）：\"反野本身就是团队收益。如果你不相信你的队友，你可以一只野也不放，但同样你的队友也会很难受。\"<\/li><li><strong>推论<\/strong>：<strong>你反对面的野，只会让对面打野难受；对面线上难不难受，取决于你抓不抓他。<\/strong> 这两件事不能混为一谈<\/li><li><strong>来源<\/strong>：BV1tPbk6rEVH @ 03:09、@ 03:37<\/li><li><strong>可信度<\/strong>：高（这条纠正了一个很常见的\"反野 = 收益\"的错觉）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你反了对面野区的小野判断依据：你的时间只有一份。"}, {"id": "K-L50", "cat": "L", "title": "中期最好的打法是「放掉自家一片野区」，换时间去反野", "self": "<h3><a class=\"kref\" href=\"#K-L50\">K-L50<\/a> 中期最好的打法是「放掉自家一片野区」，换时间去反野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：中期顺风，但你发现自己兵线压力大、队友跟不上<\/li><li><strong>判断依据<\/strong>：<strong>你在野区待的时间越长，你在线上待的时间就越短<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>放掉自家一片野区（让队友收）→ 腾出的时间去反野 + 去线上找机会<\/li><li>来不及刷的野<strong>一定要让队友收掉<\/strong>，否则会被对面收走，队友还发育不起来<\/li><li><strong>反例<\/strong>：「经济高就能一打五」——不能。而且因为你大部分时间在刷野，队友经济跟对面差不了多少，等于你的高经济是<strong>无效经济<\/strong><\/li><li><strong>配套判断<\/strong>：为什么\"反野 + 让队友刷自家野\"能推塔？因为你把对面打野反了、把自家野让给队友，<strong>队友在对位上就碾压了<\/strong>，塔是他自己推掉的，你都不用指挥（@ 06:55）<\/li><li><strong>来源<\/strong>：BV1tPbk6rEVH @ 04:14、@ 04:56、@ 06:41<\/li><li><strong>可信度<\/strong>：高（与 <code><a class=\"kref\" href=\"#K-L41\">K-L41<\/a><\/code> 的\"时间差\"同源，但这条给了可执行的分配方案）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：中期顺风，但你发现自己兵线压力大、队友跟不上判断依据：你在野区待的时间越长，你在线上待的时间就越短决策分支：放掉自家一片野区（让队友收）→ 腾出的时间去反野 + 去线…"}, {"id": "K-L61", "cat": "L", "title": "节奏 = 90 秒里填 6 个节拍，不是\"刷完蓝去吃中、吃完中去打红\"", "self": "<h3><a class=\"kref\" href=\"#K-L61\">K-L61<\/a> 节奏 = 90 秒里填 6 个节拍，不是\"刷完蓝去吃中、吃完中去打红\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何一轮野区循环（90 秒）<\/li><li><strong>判断依据<\/strong>：<strong>Buff 刷新是 90 秒<\/strong>，这 90 秒里你能做的事大约 6 个\"节拍\"<\/li><li>一片野区 = 2 拍；一座塔 = 2 拍；蹭线/抢线 = 1 拍；控龙、抢河蟹各按 1 拍算<\/li><li><strong>决策分支<\/strong>：一轮循环里<strong>填什么词都行，只要总拍数不超<\/strong>——刷野、蹭线、开龙、推塔、反野是<strong>可以互相置换<\/strong>的<\/li><li>想多反一片野 → 就必须少填一个蹭线或推塔的拍<\/li><li>想多开一条节奏线（多控一片野区）→ 必须放弃小野（<code><a class=\"kref\" href=\"#K-L63\">K-L63<\/a><\/code>）<\/li><li><strong>反例<\/strong>：「背固定顺序（蓝→中→红→抓人）」——那叫重复的公式，不叫节奏。<strong>顺序一被队友/对手打断，你的公式就废了<\/strong>，而节奏只要拍数对就不会乱。<\/li><li><strong>原话<\/strong>：节奏是\"有一定规律地做事，知道做一件事对规律的影响\"；\"规律不是重复\"（BV1NLHsexEPi @ 01:34）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 01:48；@ 02:01；@ 02:30；@ 08:53<\/li><li><strong>可信度<\/strong>：高（40 分钟纯理论 + 4 局实战复盘逐拍拆解，是本库目前打野层最完整的一套框架）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何一轮野区循环（90 秒）判断依据：Buff 刷新是 90 秒，这 90 秒里你能做的事大约 6 个\"节拍\"一片野区 = 2 拍；"}, {"id": "K-L62", "cat": "L", "title": "节拍从「上一波」开始：第二轮刷野节奏是被第一轮决定的", "self": "<h3><a class=\"kref\" href=\"#K-L62\">K-L62<\/a> 节拍从「上一波」开始：第二轮刷野节奏是被第一轮决定的<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：第二轮野区即将刷新<\/li><li><strong>判断依据<\/strong>：<strong>第一轮你在哪个 Buff 上花了额外时间（比如蹭中），第二轮两个半区的刷新就会错开<\/strong><\/li><li><strong>决策分支<\/strong>：<\/li><li>有错开 → 错开的那段时间就是<strong>反野窗口<\/strong>：你刷完自己这半区，对面那半区正好刷<\/li><li>没错开 → 老实各刷各的，别硬反<\/li><li><strong>关键推论<\/strong>：<strong>你反野不是\"多做一件事\"，是把\"刷自家某片野区\"这个节拍换成\"刷对面那片\"<\/strong>——节拍数没变，所以节奏不会断（BV1NLHsexEPi @ 05:16）<\/li><li><strong>反例<\/strong>：「反到 Buff 就一定赚」——原话点破了这个错觉：<strong>反到了却没感觉到优势，反而思路乱了<\/strong>，因为你把它当成了\"额外收益\"，于是下一拍就挤爆了。<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 04:21；@ 04:33；@ 04:49；@ 05:03<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：第二轮野区即将刷新判断依据：第一轮你在哪个 Buff 上花了额外时间（比如蹭中），第二轮两个半区的刷新就会错开决策分支：有错开 → 错开的那段时间就是反野窗口：你刷完…"}, {"id": "K-L63", "cat": "L", "title": "一轮只可能同时拥有两片野区；要三片就必须放小野", "self": "<h3><a class=\"kref\" href=\"#K-L63\">K-L63<\/a> 一轮只可能同时拥有两片野区；要三片就必须放小野<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：你想\"正方形打野\"（同时控四片野区）<\/li><li><strong>判断依据<\/strong>：<strong>身上最多同时存在两个 Buff<\/strong>；小野刷新 70 秒，比 Buff 的 90 秒更碎<\/li><li><strong>决策分支<\/strong>：<\/li><li>想控三片野区 → <strong>路上必须放掉小野<\/strong>（0.5 拍的东西会吃掉你 1 拍的余量）<\/li><li>想控四片 → 拆成<strong>两条节奏线交叉走<\/strong>，随时可以放弃一条而不影响另一条（@ 07:24）<\/li><li><strong>反例<\/strong>：「我全都要，小野也是钱」——原话：\"很多人打不出野区连续压制力，就是因为不懂得放掉小野占用的节拍\"，贪一只小野，节奏直接断裂（@ 06:32、@ 06:44）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 05:43；@ 06:20；@ 06:44；@ 07:38<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：你想\"正方形打野\"（同时控四片野区）判断依据：身上最多同时存在两个 Buff；"}, {"id": "K-L64", "cat": "L", "title": "反野的第一要素是\"野怪正好在你到的时候刷新\"", "self": "<h3><a class=\"kref\" href=\"#K-L64\">K-L64<\/a> 反野的第一要素是\"野怪正好在你到的时候刷新\"<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：准备进对面野区<\/li><li><strong>判断依据<\/strong>：<strong>不是\"我想反\"，而是\"我到的时候它刚好刷\"<\/strong>。野怪不刷，你进去只能空手而归，还暴露位置<\/li><li><strong>决策分支<\/strong>：<\/li><li>知道对面刷新时间（从\"他上一次刷的时间 + 90 秒\"推）→ 卡着刷新点进<\/li><li>不知道 → 先控拍（做点别的拖时间），等刷新窗口，而不是硬进<\/li><li><strong>配套技巧<\/strong>：<strong>故意延迟自己的 Buff 刷新时间<\/strong>，可以在下一次循环里制造出新的错位（@ 14:45）<\/li><li><strong>反例<\/strong>：「记不住时间就多打几把」——重点是<strong>掌握规律<\/strong>而不是背秒表：只要你按固定路线走，走到哪野怪就刷到哪（@ 09:28、@ 09:42）<\/li><li><strong>来源<\/strong>：BV1NLHsexEPi @ 09:42；@ 14:45；@ 15:42；@ 19:02<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>3. 本路最容易犯的三个错<\/h2>\n<ol><li><strong>把\"抓人\"当 KPI<\/strong>（<a class=\"kref\" href=\"#K-L44\">K-L44<\/a>）→ 抓不到人的时候你在亏速率，亏两次就再也进不去对面野区。<\/li><li><strong>蹭线不兑现<\/strong>（<a class=\"kref\" href=\"#K-L43\">K-L43<\/a>）→ 蹭了线、没升四、没打成反打，纯亏速率。<\/li><li><strong>看到打架就去<\/strong>（<a class=\"kref\" href=\"#K-L45\">K-L45<\/a>）→ 没有关键技能交换的团，去了就是陪打。<\/li><\/ol>\n<h2>4. 交叉：打野和谁会在同一件事上打架<\/h2>\n<div class=\"tw\"><table><thead><tr><th>对手方<\/th><th>争什么<\/th><th>去看<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>中线归谁<\/td><td><code><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L04\">K-L04<\/a><\/code>（两边判据必须一致）<\/td><\/tr><tr><td>对抗路<\/td><td>我能不能进对面野区<\/td><td><code><a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/code> / <code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>（他卡住线我才敢进）<\/td><\/tr><tr><td>游走<\/td><td>开局野区要不要人跟<\/td><td><code><a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/code>（游走第一顺位是野区）<\/td><\/tr><tr><td>发育路<\/td><td>下路打起来要不要去<\/td><td><code><a class=\"kref\" href=\"#K-L45\">K-L45<\/a><\/code>（看对面交了什么）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 待补<\/h2>\n<ul><li>~~野怪刷新间隔的具体秒数~~ <strong>已补<\/strong>：Buff 90 秒、小野 70 秒（BV1NLHsexEPi @ 01:48、@ 06:44）。<\/li><li>不同打野类型的路线差异：现有两条（镜的速率框架、澜的错位开局），<strong>发育型打野（李白/公孙离类）没有样本<\/strong>。<\/li><li>打野的\"逆风局\"怎么打（野区被反穿之后的重启方式）——只有一条刘备逆风局的候选视频，但那条<strong>没有可用字幕<\/strong>。<\/li><li>六拍框架与<strong>具体英雄<\/strong>的对应（哪些英雄天生拍数不够、需要放弃什么），目前只有老虎/露娜/韩信/玄策/阿轲的实战样本，没有横向对照表。<\/li><\/ul>", "sum": "适用版本：S45触发条件：准备进对面野区判断依据：不是\"我想反\"，而是\"我到的时候它刚好刷\"。"}], "hue": 159, "heroes": ["韩信", "雅典娜", "刘备", "铠", "嫦娥", "云缨", "大司命", "杨戬", "澜", "阿古朵", "云中君", "亚瑟", "元流之子", "兰陵王", "典韦", "司空震", "司马懿", "哪吒", "娜可露露", "孙悟空", "宫本武藏", "影", "心魔六耳", "暃", "曜", "曹操", "李元芳", "李白", "梦奇", "橘右京", "猪八戒", "百里玄策", "盘古", "芈月", "苍", "蚩奼", "裴擒虎", "诸葛亮", "赵云", "钟无艳", "镜", "阿轲", "露娜", "马超"], "stages": [{"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "cross": ["中路", "游走", "发育路", "对抗路"]}], "stages": [{"file": "00_主线地图.md", "title": "主线地图", "roles": [], "id": "00"}, {"file": "02_开局前90秒.md", "title": "02 开局前90秒：第一步我站在哪", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "02"}, {"file": "03_前四分钟.md", "title": "03 前四分钟：第一条龙我争不争", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "03"}, {"file": "04_对线期.md", "title": "04 对线期：这波线清完，我该往哪走", "roles": ["mid", "roam"], "id": "04"}, {"file": "05_资源点与推进.md", "title": "05 资源点与推进", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "05"}, {"file": "06_中期.md", "title": "06 中期：为 10 分钟强化龙做准备", "roles": ["mid", "roam", "solo", "jungle", "adc"], "id": "06"}], "lane_about": "<h2>这一类回答什么<\/h2>\n<p><strong>\"我这个位置，该按什么顺序想事？\"<\/strong><\/p>\n<p>不是\"这个英雄怎么玩\"（A 类），也不是\"现在第几分钟\"（D 类），而是<strong>同一个时间点，五个位置看到的东西不一样、要做的决定也不一样<\/strong>。<\/p>\n<p>典型问法：「我中路清完线了该走哪」「我辅助开局去哪」「打野这波该刷还是该抓」——这些问题的答案跟你玩哪个英雄关系不大，跟你站哪个位置关系极大。<\/p>\n<h2>为什么必须单列一类<\/h2>\n<p>英雄卡是按\"英雄\"切的，但它天然会把<strong>分路共有的东西<\/strong>重复 N 遍：五个中路英雄，就写五遍\"线权看对面清线速度\"。这类内容放在英雄卡里是<strong>错位<\/strong>的——它不稳定（换个英雄照样成立），也很难维护（改一处要改五处）。<\/p>\n<p>所以规矩是：<\/p>\n<blockquote><p><strong>分路通用的判断 → 放 L 类，只写一遍；英雄卡只留\"这个英雄有什么不同\"。<\/strong><\/p><\/blockquote>\n<h2>五路对照：共享什么、差在哪<\/h2>\n<h3>共享的四条底层判据（五路全部成立）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>判据<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>能不能打，看的是<strong>战斗力差 × 能不能及时到达<\/strong>，不是经济差<\/td><td><code>K-D<\/code> 主线地图（BV1i2n96AEvp @ 02:31）<\/td><\/tr><tr><td>2<\/td><td><strong>线权 = 可动窗口<\/strong>。有线权才有\"走\"的资格，没线权动一步都是亏<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><tr><td>3<\/td><td><strong>视野是决策输入<\/strong>，不是\"顺手做的\"。看不见就不动<\/td><td><a class=\"kref\" href=\"#K-L44\">K-L44<\/a>、<a class=\"kref\" href=\"#K-L12\">K-L12<\/a><\/td><\/tr><tr><td>4<\/td><td><strong>人数差 &gt; 个人操作<\/strong>。五个人同时到一个点，比任何人秀都值钱<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a>、<a class=\"kref\" href=\"#K-L31\">K-L31<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>五路各自的\"唯一决定\"<\/h3>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>只回答这一个决定<\/th><th>别人替不了你的地方<\/th><th>详见<\/th><\/tr><\/thead><tbody><tr><td><strong>中路<\/strong><\/td><td>这波线清完，我往哪个方向走<\/td><td>唯一能<strong>同时<\/strong>够到三条路的位置，转线成本最低<\/td><td><code>01_中路.md<\/code><\/td><\/tr><tr><td><strong>对抗路<\/strong><\/td><td>这一波我压线还是放线<\/td><td>离团战最远，<strong>可以合法地不参团<\/strong>去换钱<\/td><td><code>04_对抗路.md<\/code><\/td><\/tr><tr><td><strong>打野<\/strong><\/td><td>现在该刷还是该抓<\/td><td>唯一按<strong>时间差<\/strong>算账的位置，不走线只走野区<\/td><td><code>05_打野.md<\/code><\/td><\/tr><tr><td><strong>发育路<\/strong><\/td><td>这波兵我敢不敢吃<\/td><td>全场最贵的经济来源，也是全场最容易被开的位置<\/td><td><code>03_发育路.md<\/code><\/td><\/tr><tr><td><strong>游走<\/strong><\/td><td>第一步去哪<\/td><td>唯一<strong>没有自己线权<\/strong>的位置，靠别人的线权吃饭<\/td><td><code>02_游走.md<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>交叉点：哪两路会在同一件事上打架<\/h3>\n<p>这张表是这类内容真正的价值——<strong>冲突发生的地方，才是需要判断的地方<\/strong>。<\/p>\n<div class=\"tw\"><table><thead><tr><th>交叉<\/th><th>争的是什么<\/th><th>判据（谁让）<\/th><th>条目<\/th><\/tr><\/thead><tbody><tr><td>中路 × 打野<\/td><td><strong>中线归谁<\/strong><\/td><td>打野差一级到四 → 中线让他；否则中线归中单转线<\/td><td><a class=\"kref\" href=\"#K-L04\">K-L04<\/a>、<a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><tr><td>中路 × 游走<\/td><td>开局第一波谁帮清中<\/td><td>游走按「野→边→射→中」排，中路排第四<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-D08\">K-D08<\/a><\/td><\/tr><tr><td>游走 × 发育路<\/td><td>开局跟不跟射手<\/td><td>默认<strong>不跟<\/strong>，除非对面 2v2 压制且我方射手会被越<\/td><td><a class=\"kref\" href=\"#K-L12\">K-L12<\/a>、<a class=\"kref\" href=\"#K-L22\">K-L22<\/a><\/td><\/tr><tr><td>对抗路 × 打野<\/td><td>对抗路线权换不换对面野区<\/td><td>我方边路有线权压制 → 打野才敢进对面野区<\/td><td><a class=\"kref\" href=\"#K-L32\">K-L32<\/a>、<a class=\"kref\" href=\"#K-L44\">K-L44<\/a><\/td><\/tr><tr><td>发育路 × 游走<\/td><td>2v2 卡不卡线<\/td><td>看辅助强度，不看射手强度<\/td><td><a class=\"kref\" href=\"#K-L22\">K-L22<\/a>、<a class=\"kref\" href=\"#K-L18\">K-L18<\/a><\/td><\/tr><tr><td>打野 × 全队<\/td><td>蹭线拖慢野区速率<\/td><td>蹭线是投资，必须换来\"升四/反打\"，否则不蹭<\/td><td><a class=\"kref\" href=\"#K-L43\">K-L43<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>读法<\/strong>：先按\"我是哪个位置\"进对应文档，再遇到交叉点的决定时跳到对方那一路看他的约束。两边都看完，才知道谁该让。<\/p>\n<h2>归属规则（写新条目时的判定）<\/h2>\n<pre><code>这条结论，换一个英雄还成立吗？\n├─ 不成立（只在某英雄的技能组里才有意义） → A 类，写进英雄卡\n└─ 成立\n   ├─ 只有某一个位置成立（换位置就不成立） → L 类，写进那个分路\n   └─ 五个位置都成立                        → D 类主线地图的\"底层判据\"<\/code><\/pre>\n<p>反例自查：「打野开先手时法师跟进放大」——换任何法师都成立，但换成分路就不成立（射手不会跟进放大），所以它属于<strong>中路<\/strong>的 L 类，不属于某个英雄。<\/p>\n<h2>编号<\/h2>\n<p><code>K-Lxx<\/code>，全局唯一，按分路段预分配号段：<\/p>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>号段<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td><a class=\"kref\" href=\"#K-L01\">K-L01<\/a> ~ <a class=\"kref\" href=\"#K-L10\">K-L10<\/a><\/td><\/tr><tr><td>游走<\/td><td><a class=\"kref\" href=\"#K-L11\">K-L11<\/a> ~ <a class=\"kref\" href=\"#K-L20\">K-L20<\/a><\/td><\/tr><tr><td>发育路<\/td><td><a class=\"kref\" href=\"#K-L21\">K-L21<\/a> ~ <a class=\"kref\" href=\"#K-L30\">K-L30<\/a><\/td><\/tr><tr><td>对抗路<\/td><td><a class=\"kref\" href=\"#K-L31\">K-L31<\/a> ~ <a class=\"kref\" href=\"#K-L40\">K-L40<\/a><\/td><\/tr><tr><td>打野<\/td><td><a class=\"kref\" href=\"#K-L41\">K-L41<\/a> ~ <a class=\"kref\" href=\"#K-L50\">K-L50<\/a><\/td><\/tr><tr><td>游走进阶（追加）<\/td><td><a class=\"kref\" href=\"#K-L51\">K-L51<\/a> ~ <a class=\"kref\" href=\"#K-L60\">K-L60<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>当前状态<\/h2>\n<div class=\"tw\"><table><thead><tr><th>分路<\/th><th>条目<\/th><th>素材厚薄<\/th><\/tr><\/thead><tbody><tr><td>中路<\/td><td>6 条（<a class=\"kref\" href=\"#K-L01\">K-L01<\/a>~06）<\/td><td>够用（小乔/女娲/海月/火舞多源）<\/td><\/tr><tr><td>游走<\/td><td>8 条（<a class=\"kref\" href=\"#K-L11\">K-L11<\/a>~18）<\/td><td>够用（大乔/鲁班/盾山/苏烈）<\/td><\/tr><tr><td>发育路<\/td><td>10 条（<a class=\"kref\" href=\"#K-L21\">K-L21<\/a>~30）<\/td><td><strong>已补齐<\/strong>：2026-11-01 补入射手第一视角（BV1X2jV6KEiP 巅峰万强局）<\/td><\/tr><tr><td>对抗路<\/td><td>10 条（<a class=\"kref\" href=\"#K-L31\">K-L31<\/a>~40）<\/td><td>已补：2026-11-01 补入\"主要收益/额外收益\"框架（BV1kVAfzbEBj）<\/td><\/tr><tr><td>打野<\/td><td>8 条（<a class=\"kref\" href=\"#K-L41\">K-L41<\/a>~48）<\/td><td>够用（镜的速率框架 + 澜的错位开局）<\/td><\/tr><tr><td>游走（进阶）<\/td><td>7 条（<a class=\"kref\" href=\"#K-L51\">K-L51<\/a>~57）<\/td><td>2026-11-01 补入：偷野窗口、开局站位、红隼博弈链、河灵人数、经验区、支援优先级、三条纪律（BV1ydMZ6bE8n）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>两条容易搞混的同类判据，已明确分工<\/strong>：<\/p>\n<ul><li>「卡线」在对抗路叫<strong>卡对面<\/strong>（<code><a class=\"kref\" href=\"#K-L32\">K-L32<\/a><\/code>，目的是让对面打野不敢来、对面边路升不到四）；在发育路叫<strong>卡自己这波线在塔外<\/strong>（<code><a class=\"kref\" href=\"#K-L23\">K-L23<\/a><\/code>，目的是逼对面进你的攻击范围）。两个动作方向相反，不要混用。<\/li><li>「中线权」在中路是<strong>自己的产出<\/strong>（<code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>），在发育路是<strong>别人的前提<\/strong>（<code><a class=\"kref\" href=\"#K-L26\">K-L26<\/a><\/code>）——发育路吃不吃得下这波线，由中路决定。<\/li><\/ul>\n<h3>素材体检这件事<\/h3>\n<p>2026-11-01 新增 <code>s12_check.py<\/code>：抓完字幕先跑一遍，看<strong>分路术语密度<\/strong>和<strong>噪音密度<\/strong>。当天实测 14 条候选里只有 4 条可用——B 站字幕轨经常是别的视频的（iPhone 评测、职场访谈、LoL 局）。不体检直接写卡，就是拿别人的稿子当王者素材。<\/p>", "duel": {"mid": {"lane": "mid", "cn": "中路", "version": "S45", "updated": "2026-11-01", "heroes": ["上官婉儿", "不知火舞", "周瑜", "墨子", "大乔", "女娲", "妲己", "姜子牙", "嬴政", "安琪拉", "小乔", "干将莫邪", "弈星", "张良", "扁鹊", "武则天", "沈梦溪", "海月", "王昭君", "甄姬", "米莱狄", "西施", "金蝉", "高渐离"], "coverage": {"total": 552, "measured": 8, "derived": 36, "empty": 508, "grades": {"小劣": 21, "小优": 21, "被克": 1, "克": 1}}, "f ://pvp.qq.com/web201605/herodetail/513.shtml"}]}, "不知火舞|高渐离": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "seed", "ev": [{"k": "official", "ref": "157.json", "ts": null, "q": "高渐离：不知火舞与高渐离对线，前期可以用扇子无限消耗手短的高渐离。即使4级之后高渐离有一", "url": "https://pvp.qq.com/web201605/herodetail/157.shtml"}]}, "墨子|大乔": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "mirror", "ev": [{"k": "official", "ref": "191.json", "ts": null, "q": "墨子：墨子释放关键大招时，大乔可以用1技能和3技能进行打断，配合队友集火击杀。墨子是消耗", "url": "https://pvp.qq.com/web201605/herodetail/191.shtml"}]}, "大乔|墨子": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "seed", "ev": [{"k": "official", "ref": "191.json", "ts": null, "q": "墨子：墨子释放关键大招时，大乔可以用1技能和3技能进行打断，配合队友集火击杀。墨子是消耗", "url": "https://pvp.qq.com/web201605/herodetail/191.shtml"}]}, "女娲|嬴政": {"cond": "S45 · 对线期 · 换血按「先躲→再夹→最后预判」的顺序", "how": "四步不能换序：二技能先往后挪出身位 → 他跟进时二技能夹一下 → 一技能瞄他的落点不是当前站位 → 前三步成立才交 1+3。一起手就丢一技能必输。", "counter": "嬴政没位移，被二技能夹住逃不掉；他的破绽是清线时身位固定，那时候夹最准。", "basis": "video", "by": "human", "ev": [{"k": "video", "ref": "BV1WkKzzUEtq", "ts": 1231, "q": "换血顺序错了必输：先躲、再夹、最后才用一技能预判", "url": "https://www.bilibili.com/video/BV1WkKzzUEtq?t=1231"}]}, "女娲|海月": {"cond": "S45 · 全程 · 海月免控在场且大招可用", "how": "别跟她拼线权：她三个一技能光速清第一波，先手权在她手上。你的击退被她免控躲掉，你的三技能传送读条会被打断，大招幻境里你没有位移可用。正确做法是放弃线权、卡塔前吃兵，等队友来。", "counter": "海月的免控和大招都有 CD。她大招交掉之后就是你唯一能压她的窗口，那一段时间要主动推线换血。", "basis": "video", "by": "human", "ev": [{"k": "video", "ref": "BV1K8gDzwEho", "ts": 0, "q": "海月对线女娲八二开（国服海月原话）", "url": "https://www.bilibili.com/video/BV1K8gDzwEho"}, {"k": "video", "ref": "BV1K8gDzwEho", "ts": 120, "q": "海月有免控，能直接躲掉女娲一技能的击退", "url": "https://www.bilibili.com/video/BV1K8gDzwEho?t=120"}]}, "女娲|王昭君": {"cond": "", "how": "", "counter": "", "basis": "official", "by": "seed", "ev": [{"k": "official", "ref": "179.json", "ts": null, "q": "女娲的施法距离，可以轻松针对王昭君", "url": "https://pvp.qq.com/web201605/herodetail/179.shtml"}]}, "妲己|姜子牙": {"cond": "", "how": "", "counter": "", "basis": "officia
