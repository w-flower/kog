<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王者荣耀实战知识库 · S45</title>
<meta name="description" content="按英雄查的王者荣耀决策手册：怎么玩、打谁舒服、被谁克、这一刻该干什么。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<style>
/* ══════════════════════════════════════════════════════════
   kog 站点样式 —— 英雄宫格 + 折叠卡
   改配色只改 :root 变量；组件规则一般不用动
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232d; --line:#28313d; --line2:#333e4c;
  --fg:#e8eef5; --fg2:#98a5b3; --fg3:#6d7887;
  --accent:#f0b429; --accent2:#5aa2ff; --ok:#3fb950; --bad:#f85149;
  --r:16px; --r-s:11px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef1f5; --line:#e2e7ee; --line2:#cfd7e2;
  --fg:#161b22; --fg2:#5a6672; --fg3:#8b98a6;
  --accent:#b57d00; --accent2:#1266d6;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 24px -14px rgba(16,24,40,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:15.5px; line-height:1.85; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono); font-size:.88em; padding:.1em .38em; border-radius:5px;
  background:var(--bg3); border:1px solid var(--line);
}

/* ─────────── 顶栏 ─────────── */
.top{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:12px clamp(16px,4vw,32px); background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; color:var(--fg); flex:none}
.brand:hover{text-decoration:none}
.logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#12161c;
  background:linear-gradient(145deg,#ffd76a,#e8a01c);
}
.bt{display:flex;align-items:baseline;gap:7px;font-size:15px;letter-spacing:.2px}
.bt b{font-weight:700}
.bt i{font-style:normal;font-size:11.5px;color:var(--fg3);border:1px solid var(--line2);
  padding:1px 6px;border-radius:20px}
.search{
  flex:1; display:flex; align-items:center; gap:8px; max-width:520px;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:0 12px; height:42px; transition:border-color .15s;
}
.search:focus-within{border-color:var(--accent2)}
.search svg{width:15px;height:15px;fill:var(--fg3);flex:none}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:var(--fg);
  font:inherit;font-size:14.5px;
}
.icon-btn{
  flex:none;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--fg2);
}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round}

/* ─────────── 版心 ─────────── */
.wrap{max-width:1080px;margin:0 auto;padding:clamp(26px,4vw,46px) clamp(16px,4vw,32px)}

.hero-head{margin:0 0 26px}
.eyebrow{font-size:12.5px;color:var(--fg3);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(25px,4.2vw,34px);line-height:1.3;margin:0 0 10px;letter-spacing:-.4px}
.lede{color:var(--fg2);margin:0;max-width:56ch;font-size:15px;line-height:1.8}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h h2{font-size:16px;margin:0;letter-spacing:.3px}
.sec-h span{font-size:12.5px;color:var(--fg3)}

/* ─────────── 英雄宫格 ─────────── */
.grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
.hcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.hcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.avatar{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:20px;letter-spacing:0;
  color:hsl(var(--h) 85% 80%);
  background:
    radial-gradient(circle at 32% 26%, hsl(var(--h) 60% 34%), hsl(var(--h) 70% 15%));
  border:1px solid hsl(var(--h) 55% 42% / .55);
  box-shadow:inset 0 0 14px hsl(var(--h) 80% 40% / .28);
}
html[data-theme="light"] .avatar{
  color:hsl(var(--h) 72% 30%);
  background:radial-gradient(circle at 32% 26%, hsl(var(--h) 80% 92%), hsl(var(--h) 70% 82%));
  border-color:hsl(var(--h) 60% 70%);
  box-shadow:none;
}
.hname{font-weight:650;font-size:15.5px;line-height:1.3}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pill{
  font-size:11.5px;padding:1.5px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg3);color:var(--fg2);line-height:1.6;white-space:nowrap;
}
.pill.a{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.b{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.l{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.g{color:var(--fg3)}

/* 大局观定位：强势期 / 节奏职责 */
.hplan{display:flex;flex-wrap:wrap;gap:5px;margin-top:-2px}
.pill[class*="t-"]{font-size:10.5px;padding:1px 7px;border-radius:6px}
.pill[class*="j-"]{font-size:10.5px;padding:1px 7px;border-radius:6px}
.pill.t-early{color:#f3c98b;border-color:#5a4526;background:#241d10}
.pill.t-mid{color:#8fd9cf;border-color:#275149;background:#12211f}
.pill.t-late{color:#c5b0f0;border-color:#42325e;background:#1d1729}
.pill.t-even{color:#b6d1a8;border-color:#3d5233;background:#182015}
.pill.j-open{color:#f0a9a0;border-color:#5a2b28;background:#261715}
.pill.j-follow{color:#8fd18a;border-color:#2f5233;background:#16241a}
.pill.j-hold{color:#9fc4f5;border-color:#2c4560;background:#151f2b}
.pill.j-scout{color:#d7c489;border-color:#4d4326;background:#1f1b12}
.pill.j-split{color:#c9a9d8;border-color:#4b2f56;background:#1d1420}
html[data-theme="light"] .pill[class*="t-"],
html[data-theme="light"] .pill[class*="j-"]{background:#fff;border-color:var(--line);color:var(--fg2)}

/* 英雄页顶部的大局观三栏 */
.planbox{
  display:grid;gap:1px;grid-template-columns:auto auto 1fr;
  margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--line);overflow:hidden;
}
.pb-cell{display:flex;flex-direction:column;gap:3px;padding:12px 16px;background:var(--bg2)}
.pb-cell.wide{min-width:0}
.pb-k{font-size:11px;color:var(--fg3);letter-spacing:.04em}
.pb-cell b{font-size:14.5px;font-weight:600;line-height:1.45}
@media (max-width:640px){
  .planbox{grid-template-columns:1fr 1fr}
  .pb-cell.wide{grid-column:1 / -1}
}

/* ─────────── 分路卡 ─────────── */
.lcard{
  position:relative; display:flex; flex-direction:column; gap:10px; padding:16px 14px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease;
}
.lcard:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line2)}
.lmotto{font-size:12px;color:var(--fg3);line-height:1.5}
.klink{
  display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--fg2);font-size:13.5px;
}
.klink:hover{text-decoration:none;border-color:var(--line2);color:var(--fg)}
html[data-theme="light"] .pill.l{color:#2f5c96;border-color:#c5d7ee;background:#eef4fb}

/* ─────────── 通用卡（对局内 / BP / 文档） ─────────── */
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gcard{
  display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);color:var(--fg);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s;
}
.gcard:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--line2)}
.gicon{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  font-size:20px;background:var(--bg3);border:1px solid var(--line);
}
.gtxt{min-width:0}
.gtxt b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.gtxt span{display:block;font-size:12.5px;color:var(--fg3);line-height:1.55}

/* ─────────── 折叠卡（条目） ─────────── */
.entry{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden;
}
.entry+.entry{margin-top:10px}
.entry>summary{
  list-style:none;cursor:pointer;padding:15px 18px;display:grid;
  grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary:hover{background:var(--bg3)}
.entry .id{
  font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:3px;
  letter-spacing:.02em;white-space:nowrap;
}
.entry .tt{min-width:0}
.entry .tt b{display:block;font-size:15.5px;font-weight:650;line-height:1.5}
.entry .tt span{
  display:block;font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.7;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.entry .chev{
  width:20px;height:20px;flex:none;margin-top:3px;color:var(--fg3);
  transition:transform .18s ease;
}
.entry[open] .chev{transform:rotate(90deg)}
.entry .body{
  padding:2px 20px 18px 20px;border-top:1px solid var(--line);margin-top:2px;
  font-size:15px;color:var(--fg);max-width:74ch;
}
.entry .body p{margin:.85em 0}
.entry .body ul,.entry .body ol{padding-left:1.25em;margin:.8em 0}
.entry .body li{margin:.35em 0}
.entry .body blockquote{
  margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);
  background:var(--bg3);border-radius:0 10px 10px 0;color:var(--fg2);font-size:14.5px;
}
.entry .body h4{font-size:14px;margin:1.2em 0 .5em;color:var(--fg2);letter-spacing:.3px}
.entry .body table{
  width:100%;border-collapse:collapse;margin:1em 0;font-size:14px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.entry .body th,.entry .body td{
  border:1px solid var(--line);padding:8px 12px;text-align:left;
}
.entry .body th{background:var(--bg3);font-weight:600;color:var(--fg2)}
.kref{font-family:var(--mono);font-size:.9em;padding:0 .3em;border-radius:4px;
  background:var(--bg3);border:1px solid var(--line);color:var(--accent2)}
.opp{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--fg2);background:var(--bg3);margin-left:8px;
  vertical-align:2px}

/* ─────────── 英雄详情头 ─────────── */
.hhead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex-wrap:wrap}
.hhead .avatar{width:74px;height:74px;font-size:30px;border-radius:24px}
.hhead h1{margin:0;font-size:clamp(23px,4vw,30px)}
.hhead .hmeta{margin-top:6px}
.back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg3);
  margin-bottom:14px;
}
.back:hover{color:var(--fg2);text-decoration:none}

/* ─────────── 文档页（长文） ─────────── */
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.doc-nav a{
  font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);
}
.doc-nav a:hover,.doc-nav a.on{border-color:var(--accent2);color:var(--fg);text-decoration:none}
.doc h2{font-size:19px;margin:2em 0 .8em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:1.8em 0 .6em}
.doc p{margin:.9em 0;max-width:74ch}
.doc ul,.doc ol{padding-left:1.3em;max-width:74ch}
.doc li{margin:.4em 0}
.doc blockquote{
  margin:1.2em 0;padding:.8em 1.1em;border-left:3px solid var(--accent);
  background:var(--bg2);border-radius:0 12px 12px 0;color:var(--fg2);
}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc table{
  width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px;
  display:block;overflow-x:auto;
}
.doc th,.doc td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
.doc th{background:var(--bg3);font-weight:600;color:var(--fg2);white-space:nowrap}
.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 60%,var(--bg))}

/* ─────────── 搜索结果 ─────────── */
.res-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);
}
.res-item .id{font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding-top:4px;flex:none}
.res-item b{font-weight:650}
.res-item span{display:block;font-size:13px;color:var(--fg2)}
.empty{color:var(--fg3);padding:40px 0;text-align:center}

/* ─────────── 页脚 ─────────── */
.foot{
  max-width:1080px;margin:60px auto 0;padding:22px clamp(16px,4vw,32px) 0;
  border-top:1px solid var(--line);color:var(--fg3);font-size:12.5px;
}

/* ─────────── 响应式 ─────────── */
@media (max-width:720px){
  body{font-size:15px}
  .top{gap:8px;padding:10px 14px}
  .bt b{font-size:14px}
  .logo{width:29px;height:29px;font-size:14.5px}
  .search{height:38px}
  .search input{font-size:14px}
  .icon-btn{width:38px;height:38px}
  .wrap{padding:22px 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .hcard{padding:13px 10px 11px;align-items:center;text-align:center;gap:8px}
  .avatar{width:44px;height:44px;font-size:17.5px}
  .hname{font-size:13.5px}
  .hmeta{justify-content:center}
  .pill{font-size:10.5px;padding:1px 6px}
  .entry>summary{padding:13px 14px;gap:9px;grid-template-columns:1fr auto}
  .entry .id{display:none}
  .entry .body{padding:2px 14px 15px}
  .hhead .avatar{width:58px;height:58px;font-size:23px;border-radius:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.foot{display:none}.entry>summary{grid-template-columns:1fr}.entry .body{display:block!important}}

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#">
    <span class="logo">王</span>
    <span class="bt"><b>实战知识库</b><i>S45</i></span>
  </a>
  <label class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.3 3.3 1.4-1.4-3.3-3.3zM6.5 10a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    <input id="q" type="search" placeholder="搜英雄或关键词" autocomplete="off">
  </label>
  <button id="theme" class="icon-btn" aria-label="切换主题">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2.1M12 18.7v2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M3.2 12h2.1M18.7 12h2.1M5.8 18.2l1.5-1.5M16.7 7.3l1.5-1.5"/></svg>
  </button>
</header>

<main id="view" class="wrap"></main>

<footer class="foot">

<script type="application/json" id="DATA">{"version": "S45", "heroes": [{"name": "韩信", "hue": 26, "a": [{"id": "", "cat": "", "title": "1. 机制内核：他是\"买时间\"的英雄", "self": "<h3>1. 机制内核：他是\"买时间\"的英雄<\/h3>", "html": "<p>韩信不是靠伤害赢的，是靠<strong>位移次数<\/strong>赢的。他的全部收益来自同一个公式：<\/p>\n<pre><code>多一段位移 → 多一次野区穿梭 → 对面少一次发育 → 你多一次经济领先<\/code><\/pre>\n<p>所以韩信的核心 KPI 不是人头，是<strong>\"对面打野这一轮的野区，有几组是你的\"<\/strong>。这条贯穿整张卡。<\/p>", "sum": "韩信不是靠伤害赢的，是靠位移次数赢的。"}, {"id": "", "cat": "", "title": "2. 开局反野：慢一步就全废", "self": "<h3>2. 开局反野：慢一步就全废<\/h3>", "html": "<p>BV1jd4y1373j @ 00:00 讲得很具体：<\/p>\n<ul><li><strong>反蓝就直接一技能跳过去<\/strong>，不要走过去<\/li><li>关键在<strong>一技能 CD 的卡点<\/strong>：走到某个固定位置时，刚好能\"无影步\"卡过去<\/li><li><strong>走得慢的后果<\/strong>：被对面辅助或中单发现 → 对面提前反应 → 这一波从\"反野\"变成\"送头\"<\/li><li>对面打野如果在自家蓝开或红开，暂时不用管，先把蓝 Buff 拿下<\/li><\/ul>\n<p><strong>这条的可迁移点<\/strong>：反野不是\"我去了就行\"，是\"<strong>我在对面还没反应过来的那 3 秒内到那里<\/strong>\"。所有反野教程里最难复制的东西就是这个时间窗。<\/p>", "sum": "BV1jd4y1373j @ 00:00 讲得很具体："}, {"id": "", "cat": "", "title": "3. 打不过的类型：拉开距离，不正面", "self": "<h3>3. 打不过的类型：拉开距离，不正面<\/h3>", "html": "<p><strong>韩信打刘备前期一点优势都没有<\/strong>——伤害不如他高，抓人不如他强（BV1jd4y1373j @ 00:31）。<\/p>\n<p>处理方式不是\"小心点\"，是<strong>换半区<\/strong>：<\/p>\n<blockquote><p>他去下路，我就去上路。<strong>离他远一点<\/strong>，不要和他正面交战。（@ 00:49）<\/p><\/blockquote>\n<p>同类的还有兰陵王这类前期强势英雄。<strong>判据<\/strong>：一级/二级能不能打过。打不过就换图，别硬碰。<\/p>", "sum": "韩信打刘备前期一点优势都没有——伤害不如他高，抓人不如他强（BV1jd4y1373j @ 00:31）。"}, {"id": "", "cat": "", "title": "4. 压制链：一个蓝 Buff 能滚到什么程度", "self": "<h3>4. 压制链：一个蓝 Buff 能滚到什么程度<\/h3>", "html": "<p>这是本卡最值得学的一段（@ 01:07 起）：<\/p>\n<pre><code>反掉他的蓝 → 他没有蓝，必须回家/回城\n→ 对面辅助没法跟着他（打野没蓝，辅助跟也没用）\n→ 河蟹变成你的\n→ 你开龙，他去拉扯 → 龙开完，他的红 Buff 刚好刷新 → 直接把红也控下来\n→ 他整片野区都拿不到\n→ 10 分钟，一路高地<\/code><\/pre>\n<p>原话收尾：\"<strong>节奏从哪里来的？其实节奏就是从那一个蓝 Buff 开始的。<\/strong>\"（@ 07:12）<\/p>\n<p><strong>关键认知<\/strong>：反野的收益<strong>不只是那组野怪<\/strong>。真正的收益是\"<strong>对面打野的行动被限定了<\/strong>\"——他必须回家，他必须补发育，他的辅助跟不了，这些\"他不能做的事\"才是雪球的起点。<\/p>\n<p>甚至有一波 UP 自己承认\"红蓝 Buff 一个没打着\"（@ 02:12），但他的结论是：<\/p>\n<blockquote><p>\"虽然野区并没有空下来，反野并没有反到，<strong>但是你节奏把握住了<\/strong>。\"<\/p><\/blockquote>\n<p><strong>这句话把反野的价值说透了<\/strong>：反的是\"节奏权\"，不是\"野怪\"。<\/p>", "sum": "这是本卡最值得学的一段（@ 01:07 起）："}, {"id": "", "cat": "", "title": "5. 不要去线上抓人", "self": "<h3>5. 不要去线上抓人<\/h3>", "html": "<p>@ 03:04 的原话：<\/p>\n<blockquote><p>\"你不要没事就跑到线上去抓人。你抓到了有什么用啊？被我们后手带走之后，<strong>他的野区也没有了<\/strong>。\"<\/p><\/blockquote>\n<p>逻辑链：你去线上抓人 → 你自己的野区空着 → 对面反你的野 → 你抓到一个人头，丢了一片野区，净亏。<\/p>\n<p><strong>这条和韩信的机制直接相关<\/strong>：韩信的经济来自野区穿梭，一旦离开野区节奏，他就变成一个\"伤害不高、又不敢正面\"的普通英雄。<\/p>", "sum": "@ 03:04 的原话："}, {"id": "", "cat": "", "title": "6. 阿森的防守视野布局（打强势打野时）", "self": "<h3>6. 阿森的防守视野布局（打强势打野时）<\/h3>", "html": "<p>对面是 1.87 万战力的裴擒虎（BV1bWnv6KEPw @ 00:17），开局的布置是：<\/p>\n<ol><li>让队友<strong>上半图去开蓝区视野<\/strong><\/li><li><strong>自己带辅助去红背<\/strong><\/li><li>目的：<strong>他不管是偷上半图还是强入侵下半图，你都防得住<\/strong>（@ 00:34）<\/li><\/ol>\n<p><strong>这套布局的判据<\/strong>：对面打野比你强时，第一件事不是\"我要不要反他\"，而是\"<strong>他反我，我能不能看见<\/strong>\"。<\/p>", "sum": "对面是 1.87 万战力的裴擒虎（BV1bWnv6KEPw @ 00:17），开局的布置是："}, {"id": "", "cat": "", "title": "7. 反野时机的第二个判据：双方 Buff 的刷新是否同向", "self": "<h3>7. 反野时机的第二个判据：双方 Buff 的刷新是否同向<\/h3>", "html": "<p>@ 02:09 的推演很干货：<\/p>\n<blockquote><p>对面打野红开，我也是红开，双方反向刷。所以<strong>我的次开 Buff（蓝）和他的首开 Buff（红）是同时刷新的<\/strong>。<\/p><\/blockquote>\n<p>由此推出：<\/p>\n<ul><li><strong>我的蓝区和他的红区同时刷新<\/strong> → 有窗口去他的红区（@ 03:31）<\/li><li>进野区时<strong>不要交惩戒<\/strong>，带着惩戒去，<strong>先找人打，不摸 Buff 不拼惩戒<\/strong>——因为队友第一时间还没到位（@ 03:47）<\/li><\/ul>", "sum": "@ 02:09 的推演很干货："}, {"id": "", "cat": "", "title": "8. 一句话", "self": "<h3>8. 一句话<\/h3>", "html": "<p><strong>韩信赢的方式不是\"打赢对面\"，是\"让对面这一轮少拿两组野\"，然后把这两组野变成一路高地。<\/strong><\/p>", "sum": "韩信赢的方式不是\"打赢对面\"，是\"让对面这一轮少拿两组野\"，然后把这两组野变成一路高地。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>韩信的具体连招（挑飞、越塔、二段跳的细节）—— 本次素材全是全局思路，<strong>没有一条讲连招<\/strong><\/li><li>韩信逆风怎么打（素材都是顺风压制局）<\/li><li>韩信 vs 各打野的对位表（目前只有\"打不过刘备\"一条，见 <code>B_克制关系/<\/code>）<\/li><\/ul>", "sum": "韩信的具体连招（挑飞、越塔、二段跳的细节）—— 本次素材全是全局思路，没有一条讲连招韩信逆风怎么打（素材都是顺风压制局）韩信 vs 各打野的对位表（目前只有\"打不过刘备\"一条，见 B_克制关系…"}], "b": [{"id": "K-B11", "cat": "B", "title": "对刘备：前期一点优势都没有（数值 + 节奏双输）", "self": "<h3><a class=\"kref\" href=\"#K-B11\">K-B11<\/a> 对刘备：前期一点优势都没有（数值 + 节奏双输）<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：刘备（前期强势野核）<\/li><li><strong>克制层级<\/strong>：<strong>数值克 + 节奏克<\/strong>（两者同时成立，所以最难受）<\/li><li>数值上：<strong>伤害没有他高<\/strong><\/li><li>节奏上：<strong>抓人没有他强<\/strong><\/li><li><strong>我该怎么做<\/strong>：<strong>换半区<\/strong>，不是\"小心点\"。他去下路，我就去上路；离他远一点，不正面交战<\/li><li><strong>反向反制<\/strong>：韩信的优势是位移次数和野区穿梭。所以正确的打法不是\"打赢他\"，是<strong>在他在的地方不去，在不在的地方吃满<\/strong>——他清野慢、位移差，越到中后期越追不上你<\/li><li><strong>同类的还有<\/strong>：兰陵王这类前期强势打野，处理方式一样（BV1jd4y1373j @ 00:49）<\/li><li><strong>来源<\/strong>：BV1jd4y1373j @ 00:31、@ 00:49<\/li><li><strong>可信度<\/strong>：高（两个 UP 独立说到\"韩信的伤害没到、结果输了，但思路是对的\"这类对位感受）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：刘备（前期强势野核）克制层级：数值克 + 节奏克（两者同时成立，所以最难受）数值上：伤害没有他高节奏上：抓人没有他强我该怎么做：换半区，不是\"小心点\"。", "opp": "刘备"}, {"id": "K-B12", "cat": "B", "title": "被马超打：他专打「脱节的人」，所以你不脱节他就没法打", "self": "<h3><a class=\"kref\" href=\"#K-B12\">K-B12<\/a> 被马超打：他专打「脱节的人」，所以你不脱节他就没法打<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：马超（打野）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong>——克的是\"韩信喜欢单走\"这个习惯，不是克韩信这个英雄<\/li><li><strong>为什么成立<\/strong>：马超的打架优势是<strong>找脱节的能力非常强<\/strong>。原话：\"我们只要看谁脱节就打谁，<strong>千万不要去打对面没脱节的人<\/strong>。对面没脱节，就意味着你是一打二或一打三。\"（BV1tPbk6rEVH @ 00:50、@ 01:03）<\/li><li><strong>我该怎么做<\/strong>：<\/li><li><strong>不单走<\/strong>：韩信吃野时离队友/塔近一点，脱节的窗口就没了<\/li><li><strong>他来找你时不要接<\/strong>：马超的强势是<strong>一对一<\/strong>，所以只要你不是一个人，他就不会来<\/li><li>反过来讲：<strong>韩信的一对一不占优，二对二更不占优<\/strong>（@ 01:16），所以你的赢法只有\"不给他一对一的机会\"<\/li><li><strong>反向反制（马超视角的软肋）<\/strong>：马超<strong>必须先占住视野<\/strong>才有优先动手权（@ 00:35）。所以韩信可以靠\"不让他看见\"来拖——但这是被动打法，等于放弃节奏<\/li><li><strong>推广<\/strong>：这条是本库少见的\"<strong>克制的是行为，不是英雄<\/strong>\"的案例。判断自己被不被克时，先问一句：他克的是我的数值，还是我的习惯？<\/li><li><strong>来源<\/strong>：BV1tPbk6rEVH @ 00:35、@ 00:50、@ 01:03、@ 01:16<\/li><li><strong>可信度<\/strong>：中高（单来源，但讲的是机制不是数值，稳定性好）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>韩信克谁（对慢速、无位移打野的压制）—— <strong>目前没有一条素材正面讲\"韩信克谁\"<\/strong>，暂不写<\/li><li>韩信对中路/发育路的抓人成功率（无素材）<\/li><\/ul>", "sum": "适用版本：S45针对对手：马超（打野）克制层级：机制克——克的是\"韩信喜欢单走\"这个习惯，不是克韩信这个英雄为什么成立：马超的打架优势是找脱节的能力非常强。", "opp": ""}], "lanes": ["jungle"], "tempo": "early", "job": "open", "motto": "反的是节奏权，不是野怪", "n": 11, "b_n": 2, "vs": ["刘备"], "incoming": [], "lane_names": ["打野"]}, {"name": "雅典娜", "hue": 277, "a": [{"id": "", "cat": "", "title": "1. 机制内核：三个信息差", "self": "<h3>1. 机制内核：三个信息差<\/h3>", "html": "<p>雅典娜的强度全在这三条\"技能说明里没写清楚\"的地方：<\/p>\n<h3>1.1 一技能：1 秒护盾 + 免控，命中刷新二技能并击退<\/h3>\n<ul><li><strong>能吃掉的控<\/strong>：孙策大招、苏烈大招、钟馗钩子、老夫子大招（BV1ip4EzeEZC @ 00:14）<\/li><li><strong>生效范围比指示器远<\/strong>：二技能的<strong>大圆<\/strong>和英雄<strong>脚下的小圆<\/strong>相交就命中——<strong>相切不行<\/strong>（@ 00:32）<\/li><li>残血时<strong>优先放一技能<\/strong>（护盾能补血、能反杀，BV1Rkui6QExF @ 05:41）<\/li><\/ul>\n<h3>1.2 二技能：位移 + 强化普攻，戳到敌人身后，血量越低伤害越高<\/h3>\n<ul><li><strong>强普触发后，无论闪现还是位移都会跟过去<\/strong>（BV1ip4EzeEZC @ 01:14）<\/li><li><strong>二技能是无影步，不暴露视野<\/strong> → 可以用来卡视野、当踏板（@ 01:14）<\/li><\/ul>\n<h3>1.3 大招：受的攻击越多，炸得越快越疼<\/h3>\n<ul><li>开大期间受到的攻击会增加爆炸伤害、并<strong>减少所需时间<\/strong>，<strong>最高 5 层<\/strong>（BV1Rkui6QExF @ 00:45、BV1ip4EzeEZC @ 05:05）<\/li><li>所以大招要<strong>在敌人攻击频率高的时候开<\/strong>，才容易创造奇迹<\/li><\/ul>\n<p><strong>由此直接推出一个克制关系<\/strong>：雅典娜<strong>克制戈雅<\/strong>这类攻击频率高的英雄（BV1Rkui6QExF @ 00:45）——他打得越猛，你的大炸得越早越疼。这条已记入 <code>B_克制关系/<\/code> 待补。<\/p>", "sum": "雅典娜的强度全在这三条\"技能说明里没写清楚\"的地方："}, {"id": "", "cat": "", "title": "2. 操作设置（先调，再练）", "self": "<h3>2. 操作设置（先调，再练）<\/h3>", "html": "<p>BV1ip4EzeEZC @ 01:31：<\/p>\n<div class=\"tw\"><table><thead><tr><th>项<\/th><th>设置<\/th><\/tr><\/thead><tbody><tr><td><strong>补刀推塔键<\/strong><\/td><td><strong>一定要开<\/strong>（核心，见第 3 节）<\/td><\/tr><tr><td>自动普攻<\/td><td><strong>最好关掉<\/strong><\/td><\/tr><tr><td>攻击目标<\/td><td><strong>绝对血量最少<\/strong><\/td><\/tr><tr><td>追击距离<\/td><td><strong>标准<\/strong><\/td><\/tr><tr><td>精准普攻<\/td><td>2300 分以下可以关掉，能降低很多练习成本<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "BV1ip4EzeEZC @ 01:31："}, {"id": "", "cat": "", "title": "3. 核心连招：一切围绕\"推塔键\"和\"踏板\"", "self": "<h3>3. 核心连招：一切围绕\"推塔键\"和\"踏板\"<\/h3>", "html": "<h3>3.1 五个步骤（所有连招的母版）<\/h3>\n<p>BV1ip4EzeEZC @ 02:27 把它标准化了：<\/p>\n<pre><code>① 存枪 → ② 拉视野 → ③ 找目标 → ④ 选踏板 → ⑤ 等 CD\n→ 完成后点【推塔普攻】或【补刀键】→ 接二一 → 戳 → 二戳<\/code><\/pre>\n<p><strong>\"踏板\"是雅典娜独有的概念<\/strong>：野怪、小兵、防御塔都可以当踏板，用来刷新二技能、缩短距离、或让自己安全脱身。<\/p>\n<h3>3.2 三个常用变体<\/h3>\n<div class=\"tw\"><table><thead><tr><th>连招<\/th><th>做法<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td><strong>二戳一（撕咬）<\/strong><\/td><td>二技能戳 → 等一技能好 → 再戳，反复<\/td><td>对面有闪现/位移且<strong>没有踏板<\/strong>时，无限追击（@ 01:49）<\/td><\/tr><tr><td><strong>蹲草连招<\/strong><\/td><td>只点一二技能，出伤最快<\/td><td>反过来，<strong>不能点太快<\/strong>（@ 02:27）<\/td><\/tr><tr><td><strong>踏板连招<\/strong><\/td><td>存枪 → 用野怪当踏板 → 戳脆皮<\/td><td>脆皮常在小猪那回血，直接踏板戳过去（@ 02:10）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 防御塔技巧：戳进去，再戳回来<\/h3>\n<p>目标在防御塔左边时，可以做到<strong>完美撤离<\/strong>：<\/p>\n<pre><code>先点推塔键 → 二一戳 → 最后接补刀键<\/code><\/pre>\n<p>只要在防御塔范围内，<strong>二技能接戳都能戳得到<\/strong>，所以能\"用防御塔再戳回来\"（@ 03:11）。<strong>越塔时多用一技能和大招规避防御塔伤害<\/strong>（BV1DSPtz4EM9 @ 06:34）。<\/p>", "sum": "BV1ip4EzeEZC @ 02:27 把它标准化了："}, {"id": "", "cat": "", "title": "4. 刷野与发育：24 秒存枪，惩戒先放", "self": "<h3>4. 刷野与发育：24 秒存枪，惩戒先放<\/h3>", "html": "<ul><li><strong>24 秒存一枪<\/strong>，两枪双珠一起戳（BV1DSPtz4EM9 @ 00:14）<\/li><li><strong>惩戒一定要先放再接强普<\/strong>，这样额外百分比伤害会更高（@ 00:28）<\/li><li>刷野时<strong>留一枪赶路<\/strong>，能提高刷野速率和连贯性（BV1Rkui6QExF @ 01:50）<\/li><li><strong>锁后排兵再锁前排兵<\/strong>，抢线效率最大、补刀率高（@ 01:16）<\/li><\/ul>", "sum": "24 秒存一枪，两枪双珠一起戳（BV1DSPtz4EM9 @ 00:14）惩戒一定要先放再接强普，这样额外百分比伤害会更高（@ 00:28）刷野时留一枪赶路，能提高刷野速率和连贯性（BV1Rk…"}, {"id": "", "cat": "", "title": "5. 全局：错开时间，不正面碰", "self": "<h3>5. 全局：错开时间，不正面碰<\/h3>", "html": "<h3>5.1 三级过中，和对面打野错开野区刷新时间<\/h3>\n<p>BV1DSPtz4EM9 @ 00:28：<\/p>\n<blockquote><p>三级过中，和对面打野<strong>错开野区刷新时间<\/strong>，避免相同时间正面打架。利用时间差先手帮中过线，或者后手双边抓人。<\/p><\/blockquote>\n<p><strong>这是雅典娜的核心节奏观<\/strong>：她不是\"打得过才打\"，是\"<strong>永远在对面不在的时候吃他的资源<\/strong>\"。<\/p>\n<h3>5.2 优势时的滚雪球顺序<\/h3>\n<p>@ 04:09 给的顺序很清楚：<\/p>\n<pre><code>团战打赢 → 第一件事看哪边有线\n→ 有优势线就做推塔节奏 → 塔掉了挤出更多视野 → 有先手权 → 更好入侵野区 → 拉开经济差<\/code><\/pre>\n<h3>5.3 推塔不用推完<\/h3>\n<p>@ 03:10：<strong>推塔剩下一点血量可以让小兵磨掉<\/strong>，省下来的时间可以多刷一到两组野，跟对面拉开经济差。<\/p>\n<p>（<strong>注意<\/strong>：这条要看阵容。原话也说了\"建议没有优势的不要这么做，本来拿了经济没作用就要变成罪人\"。）<\/p>\n<h3>5.4 脚下的 Buff 会暴露你的野区<\/h3>\n<p>@ 03:24：<strong>对面可以根据你脚下的 Buff 判断你的野区<\/strong>。所以带线时要注意，必要时发信号让队友帮忙看红区。<\/p>\n<h3>5.5 三线不要同时漏<\/h3>\n<p>@ 07:18：要推进就得<strong>运三线<\/strong>。下路射手要<strong>等上路过完再去清线<\/strong>，<strong>千万不要三路线同时漏<\/strong>，否则容易被抓单。<\/p>", "sum": "BV1DSPtz4EM9 @ 00:28："}, {"id": "", "cat": "", "title": "6. 死后也在干活（这是雅典娜独一份）", "self": "<h3>6. 死后也在干活（这是雅典娜独一份）<\/h3>", "html": "<p>BV1DSPtz4EM9 @ 08:19 起：<\/p>\n<ul><li><strong>死后不要乱逛<\/strong>：要给队友视野、打最后一点伤害<\/li><li><strong>死后可以吃对面的血包<\/strong>（BV1Rkui6QExF @ 05:56）<\/li><li>靠被动给<strong>全程视野<\/strong>，可以卡死死对面射手的位置，甚至卡复活时间差<\/li><\/ul>", "sum": "BV1DSPtz4EM9 @ 08:19 起："}, {"id": "", "cat": "", "title": "7. 出装方向", "self": "<h3>7. 出装方向<\/h3>", "html": "<p>素材里只有方向，没有完整清单：<\/p>\n<ul><li><strong>刚入坑先出冰脉<\/strong>这类容错高的装备，熟悉英雄后再尝试纯输出（BV1Rkui6QExF @ 00:29）<\/li><li>后期纯输出装打脆皮，\"两枪一个\"（BV1DSPtz4EM9 @ 08:01）<\/li><\/ul>\n<p><strong>完整出装和铭文本次素材没有明确念出来，不编。<\/strong><\/p>", "sum": "素材里只有方向，没有完整清单："}, {"id": "", "cat": "", "title": "8. 版本实话（445 本人说的，值得先看）", "self": "<h3>8. 版本实话（445 本人说的，值得先看）<\/h3>", "html": "<p>BV1Rkui6QExF @ 00:00 是一段自嘲，但信息量很大：<\/p>\n<blockquote><p>雅典娜<strong>上限是低的<\/strong>，胜率是被<strong>献祭流<\/strong>带起来的，国榜分是不高的，<strong>强度是 T3<\/strong> 的，机制是落后的，是<strong>容易被打野对位<\/strong>的。<\/p><\/blockquote>\n<p><strong>读法<\/strong>：这段话是\"劝退\"式反讽（目的是防止国榜分被卷高），但它侧面确认了三件事：<\/p>\n<ol><li>雅典娜的<strong>上限不算高<\/strong>，靠的是节奏和信息差，不是硬实力<\/li><li>她的<strong>胜率数据被\"献祭流\"抬起来了<\/strong>，看数据时要区分打法<\/li><li>她<strong>怕被针对<\/strong>——打野对位是她的弱项<\/li><\/ol>\n<p><strong>这条与本库的规矩一致<\/strong>：强度判断必须挂来源和语气，不能直接当\"T3 别玩\"的结论用。<\/p>", "sum": "BV1Rkui6QExF @ 00:00 是一段自嘲，但信息量很大："}, {"id": "", "cat": "", "title": "9. 一句话", "self": "<h3>9. 一句话<\/h3>", "html": "<p><strong>雅典娜的每一个技巧都在做同一件事：把\"距离\"变成\"伤害\"——用踏板缩短距离，用推塔键延长距离，用护盾吃掉距离内的控制。<\/strong><\/p>", "sum": "雅典娜的每一个技巧都在做同一件事：把\"距离\"变成\"伤害\"——用踏板缩短距离，用推塔键延长距离，用护盾吃掉距离内的控制。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>完整出装铭文（本次素材缺失，需另采一条出装专项）<\/li><li>献祭流的具体打法（BV1EAWyzYEty 是边路雅典娜，字幕含音乐干扰，未整理）<\/li><li>雅典娜怕谁（445 说\"容易被打野对位\"，但没点名）<\/li><\/ul>", "sum": "完整出装铭文（本次素材缺失，需另采一条出装专项）献祭流的具体打法（BV1EAWyzYEty 是边路雅典娜，字幕含音乐干扰，未整理）雅典娜怕谁（445 说\"容易被打野对位\"，但没点名）"}], "b": [], "lanes": ["jungle"], "tempo": "late", "job": "follow", "motto": "把距离变成伤害，两枪一个", "n": 10, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["打野"]}, {"name": "刘备", "hue": 39, "a": [{"id": "", "cat": "", "title": "1. 机制内核：他要的不是人头，是\"经济差\"", "self": "<h3>1. 机制内核：他要的不是人头，是\"经济差\"<\/h3>", "html": "<p>刘备的操作难度不高，<strong>难度全在\"前期的打经济能力和意识\"<\/strong>（BV1mg4y1t7cn @ 03:10）。原因是他清野快、单体伤害高，但<strong>位移差、留人差<\/strong>——所以他没法像常规刺客那样靠抓人起节奏，只能靠<strong>刷得比你快<\/strong>，再用经济差去打必赢的团。<\/p>\n<p>由此得出刘备的第一条铁律：<\/p>\n<blockquote><p><strong>抓人必须建立在刷经济的路上，顺路抓。<\/strong> 喜欢抓人的打野绝对上不了高分段（BV12N411t7x5 @ 00:42）。太执着于抓人，会导致你没有足够经济掌控这局，这也是上不了王者的原因（@ 01:34）。<\/p><\/blockquote>", "sum": "刘备的操作难度不高，难度全在\"前期的打经济能力和意识\"（BV1mg4y1t7cn @ 03:10）。"}, {"id": "", "cat": "", "title": "2. 时间轴（打野通用，刘备尤其要背）", "self": "<h3>2. 时间轴（打野通用，刘备尤其要背）<\/h3>", "html": "<p>BV1fj411U7tr @ 02:01 直接把这张表念了出来：<\/p>\n<div class=\"tw\"><table><thead><tr><th>时间<\/th><th>事件<\/th><\/tr><\/thead><tbody><tr><td><strong>0:30<\/strong><\/td><td>河蟹（河道小资源）刷新<\/td><\/tr><tr><td><strong>1:30<\/strong><\/td><td>中路四级线交汇<\/td><\/tr><tr><td><strong>1:37<\/strong><\/td><td>对抗路四级线<\/td><\/tr><tr><td><strong>2:00<\/strong><\/td><td>首开野区再次刷新<\/td><\/tr><tr><td><strong>4:00<\/strong><\/td><td>小龙刷新<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>用法<\/strong>：所有节奏都围绕这张表打，\"打出属于自己的节奏\"（原话）。你自己算不出下一个资源点还有几秒，就别谈节奏。<\/p>", "sum": "BV1fj411U7tr @ 02:01 直接把这张表念了出来："}, {"id": "", "cat": "", "title": "3. 反野：先看辅助在哪，再决定反几组", "self": "<h3>3. 反野：先看辅助在哪，再决定反几组<\/h3>", "html": "<p>BV12N411t7x5 @ 02:08 给了一条很具体的阈值：<\/p>\n<ul><li>对面<strong>辅助（小明这类）没在下路漏视野<\/strong> → 只反<strong>两个小野<\/strong>，别贪<\/li><li>辅助位置明确、对面打野在另一侧 → 可以整片反<\/li><\/ul>\n<p><strong>为什么用\"辅助位置\"当判据<\/strong>：辅助是野区防守的第一双眼睛。他没漏 = 你不知道他在哪 = 你可能正踩在他的视野里。这条判据比\"看对面打野在哪\"更早、更保守。<\/p>", "sum": "BV12N411t7x5 @ 02:08 给了一条很具体的阈值："}, {"id": "", "cat": "", "title": "4. 拆塔 > 刷野：中塔一掉，对面野区就是你的", "self": "<h3>4. 拆塔 &gt; 刷野：中塔一掉，对面野区就是你的<\/h3>", "html": "<p>这是刘备最反直觉、也最值钱的一条：<\/p>\n<blockquote><p>\"你永远不知道<strong>一座中塔对（对面）打野的野区有多大影响<\/strong>\" —— 中塔一掉，对面野区就随便进（BV12N411t7x5 @ 03:41、@ 04:40）。<\/p><\/blockquote>\n<p>所以刘备的优先级不是\"刷完野再推塔\"，而是<strong>看到能拆的塔就放下手头任何事去拆<\/strong>（@ 03:41 原话：\"我可以放下手头任何的事情去拆塔\"）。<\/p>\n<p><strong>同一条逻辑的第二个推论<\/strong>：11 分半以后<strong>小野已经没用了<\/strong>，别再浪费时间清，<strong>把塔和兵线放在第一位<\/strong>（@ 06:40）。<\/p>", "sum": "这是刘备最反直觉、也最值钱的一条："}, {"id": "", "cat": "", "title": "5. 刘备的弊端：留不住人 → 只能打兵线运营", "self": "<h3>5. 刘备的弊端：留不住人 → 只能打兵线运营<\/h3>", "html": "<p><strong>这是选刘备前必须知道的<\/strong>（BV12N411t7x5 @ 05:58）：<\/p>\n<blockquote><p>刘备在这种情况下<strong>很难留住人<\/strong>，除非有队友帮你打个控制。<\/p><\/blockquote>\n<p>所以后期只有三条路可走：<\/p>\n<ol><li><strong>卡草 / 卡视野<\/strong>，等对面自己走进来<\/li><li><strong>兵线运营<\/strong>——带线创造拆塔机会<\/li><li><strong>等团已经打起来了，再打个出其不意<\/strong><\/li><\/ol>\n<p>到了 12 分钟，重点就变成\"兵线运营 + 尽可能让对方掉点\"（@ 06:40）。<\/p>", "sum": "这是选刘备前必须知道的（BV12N411t7x5 @ 05:58）："}, {"id": "", "cat": "", "title": "6. 出装与铭文（三套，按打法选）", "self": "<h3>6. 出装与铭文（三套，按打法选）<\/h3>", "html": "<p>来源：BV1d94y1i7Ct（三套出装铭文，注意这是 S32 时期的视频，<strong>装备名以游戏内为准，思路照用<\/strong>）<\/p>\n<div class=\"tw\"><table><thead><tr><th>套<\/th><th>顺序<\/th><th>适合谁<\/th><\/tr><\/thead><tbody><tr><td><strong>一（主流，容错高）<\/strong><\/td><td>血刀野刀 → 鞋子 → <strong>电刀<\/strong> → 荆棘护手 → <strong>冰脉<\/strong>（不出黑切）→ 大打野刀 → 末世 → 最后一件看阵容<\/td><td>节奏好、会打经济、想 12 分钟内结束的人<\/td><\/tr><tr><td><strong>二（跑图流）<\/strong><\/td><td>小野刀 → 疾步之靴 → 升级打野刀 → 电刀 → 黑切（<strong>先出陨星<\/strong>）→ 末世<\/td><td>偏向运营、跑图快、要卡视野蹲人<\/td><\/tr><tr><td><strong>三（黑切宗师流，老派）<\/strong><\/td><td>小野刀 → 鞋子 → 升级打野刀 → 电刀 → 陨星 → 黑切 → 末世 → 爆裂之甲 → 大打野刀<\/td><td>不喜欢电刀、习惯老手感的人<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关键细节<\/strong>：<\/p>\n<ul><li>不出黑切时<strong>先做冰脉<\/strong>，做冰脉前先补一个<strong>荆棘护手<\/strong>提高前期容错（前期掉点很伤）<\/li><li>大打野刀的目的是<strong>物理穿透<\/strong>，用来对付对面已经起来的坦度英雄<\/li><li>最后一件：两个以上法系 → 魔女/破魔刀；正常一个法系 → 爆裂之甲<\/li><li>换装节奏：<strong>14 分钟内用爆裂换复活/名刀，14 分钟后用鞋子换<\/strong><\/li><\/ul>\n<p><strong>铭文<\/strong>：<strong>4–5 个夺萃<\/strong>、5–6 个狩猎、10 个鹰眼、10 个异变（BV12N411t7x5 @ 06:19 也强调\"三夺萃吸血真的吸不上来，建议 4–5 个\"）。<\/p>", "sum": "来源：BV1d94y1i7Ct（三套出装铭文，注意这是 S32 时期的视频，装备名以游戏内为准，思路照用）"}, {"id": "", "cat": "", "title": "7. 选他之前先看阵容（BP 视角）", "self": "<h3>7. 选他之前先看阵容（BP 视角）<\/h3>", "html": "<p>BV1mg4y1t7cn 是一局 56 星的完整 BP 解析，其中三条判断可复用：<\/p>\n<ol><li><strong>对面是\"中后期打团体系\"（貂蝉 + 猪八戒这类高恢复高坦度 + 刘邦保 C）<\/strong> → 你只能打<strong>前 8 分钟<\/strong>，靠压制对面双 C 的发育拖慢成型，再打经济落差的团（@ 02:55、@ 03:10）。<\/li><li><strong>指望\"后期打团一波拿下\"基本不现实<\/strong>，除非对面双 C 不会玩——而你不能指望这个（@ 05:35）。<\/li><li><strong>有鬼谷子这类强开辅助时，一定要让他打先手<\/strong>，你随后跟上接 <code>双一<\/code> 或 <code>121<\/code>；别自己抢先去开（@ 08:05）。<\/li><\/ol>", "sum": "BV1mg4y1t7cn 是一局 56 星的完整 BP 解析，其中三条判断可复用："}, {"id": "", "cat": "", "title": "8. 一句话", "self": "<h3>8. 一句话<\/h3>", "html": "<p><strong>刘备不是\"抓人型打野\"，是\"用清野速度把经济差堆出来，然后用这个差去打不需要操作的团\"的英雄。<\/strong><\/p>", "sum": "刘备不是\"抓人型打野\"，是\"用清野速度把经济差堆出来，然后用这个差去打不需要操作的团\"的英雄。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>刘备的克制关系（怕谁、克谁）—— 目前只有\"韩信打刘备前期零优势\"（BV1jd4y1373j @ 00:31），可整理进 <code>B_克制关系/<\/code><\/li><li>刘备打盾山（\"小盾能撞、大盾别撞\"，BV1fj411U7tr @ 03:45）—— 单条操作细节，暂未单独成条<\/li><\/ul>", "sum": "刘备的克制关系（怕谁、克谁）—— 目前只有\"韩信打刘备前期零优势\"（BV1jd4y1373j @ 00:31），可整理进 B_克制关系/刘备打盾山（\"小盾能撞、大盾别撞\"，BV1fj411U7…"}], "b": [], "lanes": ["jungle"], "tempo": "early", "job": "open", "motto": "抓人必须顺路，经济差才是他的伤害", "n": 9, "b_n": 0, "vs": [], "incoming": ["韩信"], "lane_names": ["打野"]}, {"name": "不知火舞", "hue": 331, "a": [{"id": "K-A11", "cat": "A", "title": "二技能是\"减魔抗\"，不是\"消耗\"", "self": "<h3><a class=\"kref\" href=\"#K-A11\">K-A11<\/a> 二技能是\"减魔抗\"，不是\"消耗\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何准备打伤害的瞬间<\/li><li><strong>判断依据<\/strong>：目标身上有没有被扇子标记（减魔抗 3 秒）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有标记 → 接一技能/大招，这时伤害才是满的<\/li><li>没标记 → <strong>先补扇子再谈输出<\/strong>，硬打等于把伤害打了个七折<\/li><li><strong>反例<\/strong>：「扇子是用来消耗血线的」——它同时是全套伤害的前置条件。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 00:05；@ 07:47<\/li><li><strong>可信度<\/strong>：高（机制数值与连招由多个视频一致给出）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：任何准备打伤害的瞬间判断依据：目标身上有没有被扇子标记（减魔抗 3 秒）决策分支：有标记 → 接一技能/大招，这时伤害才是满的没标记 → 先补扇子再谈输出，硬打等于把伤害打了个七折反…"}, {"id": "K-A12", "cat": "A", "title": "标准连招只有一条主线：扇子起手 → 一技能 → 接闪现", "self": "<h3><a class=\"kref\" href=\"#K-A12\">K-A12<\/a> 标准连招只有一条主线：扇子起手 → 一技能 → 接闪现<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要单杀落单目标，或一闪开团<\/li><li><strong>判断依据<\/strong>：目标离你的距离是否在\"一技能位移 + 闪现\"的覆盖内<\/li><li><strong>决策分支<\/strong>：<\/li><li>能一闪到 → 二技能 → 一技能 → <strong>在二技能释放过程中<\/strong>接闪现，打出\"一闪\"控制<\/li><li>到不了 → 不要硬上，先用强化普攻或兵线位移缩短距离<\/li><li><strong>反例<\/strong>：「连招要背熟」——火舞没有固定连招，扭扭蛇原话是\"火舞没有固定的连招，需要你自己灵活应变\"，主线之外全靠判断。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 07:47；BV1eg411z7u1 @ 08:20；BV1Fd4y1k7EY @ 01:57<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要单杀落单目标，或一闪开团判断依据：目标离你的距离是否在\"一技能位移 + 闪现\"的覆盖内决策分支：能一闪到 → 二技能 → 一技能 → 在二技能释放过程中接闪现，打出\"一闪\"控制到不…"}, {"id": "K-A13", "cat": "A", "title": "瞬秒连招：扇子 → 大招 → 强化普攻（减魔抗的窗口内把爆发打完）", "self": "<h3><a class=\"kref\" href=\"#K-A13\">K-A13<\/a> 瞬秒连招：扇子 → 大招 → 强化普攻（减魔抗的窗口内把爆发打完）<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：目标血量在你的爆发线内，且身上已有扇子标记<\/li><li><strong>判断依据<\/strong>：扇子命中后 3 秒内能不能接上大招<\/li><li><strong>决策分支<\/strong>：扇子出手 → <strong>在扇子飞行的过程中<\/strong>就按大招 → 减魔抗生效瞬间打出大招伤害 → 补强化普攻<\/li><li><strong>反例<\/strong>：「等扇子命中了再按大招」——等命中再按，窗口已经过去一半。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 09:29<\/li><li><strong>可信度<\/strong>：中高（单一来源，但步骤描述清晰可复现）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标血量在你的爆发线内，且身上已有扇子标记判断依据：扇子命中后 3 秒内能不能接上大招决策分支：扇子出手 → 在扇子飞行的过程中就按大招 → 减魔抗生效瞬间打出大招伤害 → 补强化普…"}, {"id": "K-A14", "cat": "A", "title": "一闪开团和大招开团是两个东西，别混", "self": "<h3><a class=\"kref\" href=\"#K-A14\">K-A14<\/a> 一闪开团和大招开团是两个东西，别混<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：要开团时<\/li><li><strong>判断依据<\/strong>：己方是均势/逆风，还是己方有前排能跟<\/li><li><strong>决策分支<\/strong>：<\/li><li>势均力敌或逆风守高地 → <strong>一闪开团<\/strong>：进得去、控得住、还能退，打的是控制不是伤害<\/li><li>己方前排能先手接住 → <strong>大招开团<\/strong>：把人推回来交给队友<\/li><li><strong>反例<\/strong>：「有闪就一闪上去打伤害」——一闪的定位是控，用它当输出来源，等于把唯一的退路交了。<\/li><li><strong>来源<\/strong>：BV1v541187YZ @ 13:44、@ 14:02<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：要开团时判断依据：己方是均势/逆风，还是己方有前排能跟决策分支：势均力敌或逆风守高地 → 一闪开团：进得去、控得住、还能退，打的是控制不是伤害己方前排能先手接住 → 大招开团：把人推…"}, {"id": "K-A15", "cat": "A", "title": "能量低于一条线就别进场", "self": "<h3><a class=\"kref\" href=\"#K-A15\">K-A15<\/a> 能量低于一条线就别进场<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备靠自己冲进人堆<\/li><li><strong>判断依据<\/strong>：当前能量是否够放满三段（视频给的门槛是 150）<\/li><li><strong>决策分支<\/strong>：<\/li><li>够 → 直接进，靠命中回能滚起来<\/li><li>不够 → 先扇子消耗/清线回能，或等强化普攻叠好再进<\/li><li><strong>反例<\/strong>：「我看别人进去就秒了」——别人进之前能量是满的。<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:26；BV1Fd4y1k7EY @ 03:02<\/li><li><strong>可信度<\/strong>：中（150 这个数值只有一处口播，机制方向多源一致）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：准备靠自己冲进人堆判断依据：当前能量是否够放满三段（视频给的门槛是 150）决策分支：够 → 直接进，靠命中回能滚起来不够 → 先扇子消耗/清线回能，或等强化普攻叠好再进反例：「我看…"}, {"id": "K-A16", "cat": "A", "title": "大招反拉：把她的大招当\"拉进塔\"的工具", "self": "<h3><a class=\"kref\" href=\"#K-A16\">K-A16<\/a> 大招反拉：把她的大招当\"拉进塔\"的工具<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：目标在塔的射程边缘，且你敢吃一发塔伤<\/li><li><strong>判断依据<\/strong>：大招的拉回方向能否把目标拉进塔下<\/li><li><strong>决策分支<\/strong>：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害<\/li><li><strong>反例<\/strong>：「大招是团控，留着打团」——单杀阶段把人大招拉进塔，是最省技能的杀法。<\/li><li><strong>来源<\/strong>：BV1eg411z7u1 @ 04:40<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：目标在塔的射程边缘，且你敢吃一发塔伤判断依据：大招的拉回方向能否把目标拉进塔下决策分支：贴塔站位 → 大招命中把敌人拉回来 → 让防御塔补伤害反例：「大招是团控，留着打团」——单杀阶…"}, {"id": "K-A17", "cat": "A", "title": "用扇子探草：命中会回能", "self": "<h3><a class=\"kref\" href=\"#K-A17\">K-A17<\/a> 用扇子探草：命中会回能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：进草前、支援路上<\/li><li><strong>判断依据<\/strong>：扇子出手后能量有没有涨<\/li><li><strong>决策分支<\/strong>：能量涨了 → 草里有人，别进去；没涨 → 可以走<\/li><li><strong>来源<\/strong>：BV1Td9EBKE9S @ 00:10<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A18\">K-A18<\/a> 对线期第一波线别靠前（对面是钩子类辅助时）<\/h3>\n<p>这条是<strong>中路对线期的通用纪律<\/strong>，已迁到 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L06\">K-L06<\/a><\/code>。火舞的特殊点在于她<strong>清线慢<\/strong>（抢不动也躲不开），所以对她来说这条不是\"建议\"而是\"必须\"。<\/p>\n<h2>5. 出装与铭文<\/h2>\n<p><strong>结论：暂不写入具体铭文组合。<\/strong><\/p>\n<p>原因：标题带\"出装铭文\"的两期，一期是 2020 年（BV1v541187YZ），一期是 2024-06（BV12b421H7sY，S36）；2026 年那条（BV1Td9EBKE9S）字幕里只有一句\"还有不知火舞的出装铭文\"就结束了，<strong>具体条目没有被 ASR 转录出来<\/strong>。ASR 对铭文名（梦魇/心眼/狩猎）的识别错误率高，硬写等于编。<\/p>\n<p><strong>能确认的只有一条思路<\/strong>：出装要围绕\"减魔抗 + 爆发\"，因为她的伤害模型就是扇子标记后一套带走；对面出了魔女斗篷时，原话是\"他现在这套装备就是秒他，但是他出了魔女咱们秒不掉\"——遇到魔女要改路线，不要硬堆法强。<\/p>\n<ul><li>来源：BV1v541187YZ @ 12:19（魔女斗篷的应对）<\/li><li>待补：S45 具体六件套顺序、铭文红蓝绿配置，需要一条 2026-09 之后、标题明确标\"出装铭文\"且<strong>有字幕<\/strong>的视频，或官网英雄页/助手数据核对。<\/li><\/ul>\n<h2>6. 最容易崩的三个地方<\/h2>\n<ol><li><strong>能量不够硬进团<\/strong> → 进去放不出三段，等于送。<\/li><li><strong>不会取消后摇<\/strong> → 一模一样的操作，别人打完能翻滚走，你还在原地收招。<\/li><li><strong>把一闪当输出用<\/strong> → 交完闪现又没杀掉，接下来 90 秒你没有开团手段。<\/li><\/ol>\n<h2>7. 待补<\/h2>\n<ul><li>各技能精确数值（CD、能量消耗、大招拉回距离）未从素材获得。<\/li><li>强势期/弱势期：素材多为顺风或均势局，逆风下限没有样本。<\/li><li>与具体英雄的对位结论见 <code>B_克制关系/<\/code>（目前无火舞条目）。<\/li><\/ul>", "sum": "这条是中路对线期的通用纪律，已迁到 L_分路/01_中路.md 的 K-L06。"}], "b": [], "lanes": ["mid"], "tempo": "mid", "job": "open", "motto": "四段位移找后排，一套没打死就退", "n": 7, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["中路"]}, {"name": "王维", "hue": 273, "a": [{"id": "", "cat": "", "title": "1. 机制内核：三层，缺一层就废", "self": "<h3>1. 机制内核：三层，缺一层就废<\/h3>", "html": "<h3>1.1 被动「雾我无相」：每 5~4 秒叠 1 层，5 层闪避一次伤害<\/h3>\n<ul><li>闪避<strong>按伤害量扣层<\/strong>，最多闪避 <code>250 + 50% 法强<\/code> 的伤害<\/li><li>关键推论：<strong>这是一个\"防爆发\"被动，不是\"防消耗\"被动<\/strong>。对面一套打死你时它救你，对面慢慢磨你时它一层层被抠掉<\/li><li>所以王维<strong>怕的是持续消耗型（干将、小乔这类先手磨血再收割），不怕一套爆发型<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.2 一技能「空山入障」：站在自己的圈里，被动回得飞快<\/h3>\n<ul><li>持续伤害 + 20%~40% 减速，1.5 秒后引爆<\/li><li><strong>王维自己在范围内 → 进入\"空山状态\" → 快速回复被动层数<\/strong><\/li><li>这是王维的全部续航来源。<strong>掉出圈 = 失去闪避 = 变成普通脆皮法师<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.3 二技能「江流渺渺」：击退 + 分叉，穿过空山会引爆<\/h3>\n<ul><li>主水流击退 0.75 秒，命中后分出最多 2 道支流追人（50% 伤害 + 减速）<\/li><li><strong>水流经过空山会绕山而行，把敌人卷进山里，并提前引爆空山<\/strong><\/li><li>这是连招的真正核心：<strong>二技能不是起手，是\"把对面按进我的圈里\"<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>\n<h3>1.4 大招「天地一念」：本体留在原地，雾气穿墙走<\/h3>\n<ul><li>第一段：本体不动，雾气化身飞行 9 秒，<strong>无视地形、不可选中<\/strong>，飞行中可放一二技能（替换成「乘雾」加速 /「回岚」转向）<\/li><li>第二段：瞬移到雾的位置，落地范围伤害 + 3 秒锁定多段伤害，期间<strong>持续空山状态<\/strong><\/li><li>这是位移 + 保命 + 进场三合一，<strong>也是王维唯一能主动开团的手段<\/strong><\/li><li><strong>来源<\/strong>：官方技能面板（S45）<\/li><\/ul>", "sum": "1.1 被动「雾我无相」：每 5~4 秒叠 1 层，5 层闪避一次伤害闪避按伤害量扣层，最多闪避 250 + 50% 法强 的伤害关键推论：这是一个\"防爆发\"被动，不是\"防消耗\"被动。"}, {"id": "", "cat": "", "title": "2. 对线：一级就是打不过，别硬抢", "self": "<h3>2. 对线：一级就是打不过，别硬抢<\/h3>", "html": "<ul><li>对<strong>嫦娥<\/strong>这类一级强线权中单：<strong>一技能只打后排兵，不打人<\/strong>（BV15EJk6fEwX @ 00:27）<\/li><li>目的不是消耗，是<strong>别被卡线<\/strong>。被卡线 → 掉状态 → 丢闪现甚至丢整片野区（@ 00:28）<\/li><li>对面去支援时<strong>不跟<\/strong>，往<strong>反方向<\/strong>去下路拿资源（@ 00:39 / @ 00:40）<\/li><li>判断流程完整版见 <code>L_分路/01_中路.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L07\">K-L07<\/a><\/code><\/li><\/ul>", "sum": "对嫦娥这类一级强线权中单：一技能只打后排兵，不打人（BV15EJk6fEwX @ 00:27）目的不是消耗，是别被卡线。"}, {"id": "", "cat": "", "title": "3. 连招：先把圈铺好，再谈伤害", "self": "<h3>3. 连招：先把圈铺好，再谈伤害<\/h3>", "html": "<p><strong>基础三连（对线换血）<\/strong><\/p>\n<pre><code>一技能落在自己脚下偏前 → 走进去回被动 → 二技能把对面卷进圈 → 引爆 → 出圈<\/code><\/pre>\n<p><strong>反打（被突进时）<\/strong><\/p>\n<pre><code>一技能落脚下 → 等对面进来 → 二技能击退（把人推出圈/推进圈） → 大招第一段拉开<\/code><\/pre>\n<p><strong>核心纪律<\/strong>：<strong>不要在没圈的地方和人对拼。<\/strong> 王维的伤害和续航都在圈里，圈外他就是一个没有位移的脆皮。素材里那句\"空山\"状态是他唯一能站住的原因，本库据此把它定为<strong>\"空山 = 血包\"<\/strong>，而不是输出手段。<\/p>", "sum": "基础三连（对线换血）"}, {"id": "", "cat": "", "title": "4. 出装 / 铭文（按 S45 胜率与出场率取的主流方案，非教学结论）", "self": "<h3>4. 出装 / 铭文（按 S45 胜率与出场率取的主流方案，非教学结论）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>类别<\/th><th>推荐<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>鞋<\/td><td><strong>秘法之靴<\/strong><\/td><td>法穿 + 回蓝，可 5 分钟免费换鞋<\/td><\/tr><tr><td>大件 1<\/td><td><strong>回响之杖<\/strong><\/td><td>技能命中触发范围爆炸，配合王维多段伤害<\/td><\/tr><tr><td>大件 2<\/td><td><strong>博学者之怒<\/strong><\/td><td>法强乘数，被动闪避上限也随之抬高（闪避量吃 50% 法强）<\/td><\/tr><tr><td>铭文<\/td><td><strong>梦魇 ×10 / 狩猎 ×10 / 心眼 ×10<\/strong><\/td><td>法强 + 移速 + 法穿，胜率与出场率都是第一<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p>数据来源：S45 王维英雄数据页（胜率 50.67%，出场率 3.6%，禁用率 4.12%）。<strong>这是统计口径，不是\"版本答案\"<\/strong>，版本一动就要重估。<\/p><\/blockquote>", "sum": "数据来源：S45 王维英雄数据页（胜率 50.67%，出场率 3.6%，禁用率 4.12%）。"}, {"id": "", "cat": "", "title": "5. 弱点：三条，都是\"掉出圈\"的变体", "self": "<h3>5. 弱点：三条，都是\"掉出圈\"的变体<\/h3>", "html": "<ol><li><strong>失去空山 = 失去一切<\/strong>：被击退、被强制位移推出圈，被动回不上，直接变成普通法师<\/li><li><strong>弱前期被卡线后滚雪球<\/strong>：一级清不动线，一旦被压到塔下，河蟹/河灵/自家红区全让出去<\/li><li><strong>大招是保命牌，交掉后极脆<\/strong>：9 秒飞行结束回来后如果没圈，等于站在对面脸上<\/li><\/ol>", "sum": "失去空山 = 失去一切：被击退、被强制位移推出圈，被动回不上，直接变成普通法师弱前期被卡线后滚雪球：一级清不动线，一旦被压到塔下，河蟹/河灵/自家红区全让出去大招是保命牌，交掉后极脆：9 秒飞…"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>王维的<strong>具体连招帧序<\/strong>（二技能分叉的命中判定、大招二段落点锁定规则）——现有素材只有官方描述，没有实测视频<\/li><li>对位细节：被镜、元流之子（刺客）、海月克制的原因（官方给的是统计口径，缺机制解释）<\/li><li>与打野的配合节奏（大招可跳视野，理论上适合抓边，但没有素材）<\/li><\/ul>", "sum": "王维的具体连招帧序（二技能分叉的命中判定、大招二段落点锁定规则）——现有素材只有官方描述，没有实测视频对位细节：被镜、元流之子（刺客）、海月克制的原因（官方给的是统计口径，缺机制解释）与打野的…"}], "b": [{"id": "K-B03", "cat": "B", "title": "对嫦娥：一级打不过，别抢线", "self": "<h3><a class=\"kref\" href=\"#K-B03\">K-B03<\/a> 对嫦娥：一级打不过，别抢线<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嫦娥（中路）<\/li><li><strong>克制层级<\/strong>：<strong>节奏克<\/strong>（王维一级弱势，嫦娥一级能压）<\/li><li><strong>我该怎么做<\/strong>：<\/li><li>一技能<strong>只打后排兵<\/strong>，不打人<\/li><li>目的不是消耗，是<strong>防止被卡线掉状态<\/strong><\/li><li>一旦掉状态就退回塔后，交给 <code>D_对局内/04_对线期.md<\/code> 的 <a class=\"kref\" href=\"#K-D02\">K-D02<\/a> 处理<\/li><li><strong>反向反制<\/strong>：这条只在一级成立。王维是\"弱前期强后期\"型，<strong>撑过前期后对位关系会反转<\/strong>——不要在 3 级后还按\"打不过\"处理。<\/li><li><strong>来源<\/strong>：BV15EJk6fEwX @ 00:23；BV15EJk6fEwX @ 00:27；BV15EJk6fEwX @ 00:30<\/li><li><strong>可信度<\/strong>：中（单来源，且 UP 主只给了\"对面是嫦娥\"这一个样本）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>王维克谁（素材只讲了对嫦娥被压这一侧）<\/li><li>王维对其他强势中路（如不知火舞类突进）的表现<\/li><\/ul>", "sum": "适用版本：S45针对对手：嫦娥（中路）克制层级：节奏克（王维一级弱势，嫦娥一级能压）我该怎么做：一技能只打后排兵，不打人目的不是消耗，是防止被卡线掉状态一旦掉状态就退回塔后，交给 D_对局内/…", "opp": "嫦娥"}], "lanes": ["mid"], "tempo": "late", "job": "hold", "motto": "空山是我的血包，不是我的输出位", "n": 7, "b_n": 1, "vs": ["嫦娥"], "incoming": [], "lane_names": ["中路"]}, {"name": "苏烈", "hue": 273, "a": [{"id": "K-A01", "cat": "A", "title": "苏烈的核心是\"第三棍\"和\"二技能\"，不是大招", "self": "<h3><a class=\"kref\" href=\"#K-A01\">K-A01<\/a> 苏烈的核心是\"第三棍\"和\"二技能\"，不是大招<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：任何需要苏烈先手的局面<\/li><li><strong>判断依据<\/strong>：对面站位是否进入三段普攻的追击距离；二技能冷却是否可用<\/li><li><strong>决策分支<\/strong>：<\/li><li>二技能可用 → 优先用它把对面的开团手<strong>推离<\/strong>，或者把落单的人<strong>推回<\/strong>队友方向<\/li><li>二技能不可用 → 不要用大招硬开，改打三棍逼退<\/li><li><strong>反例<\/strong>：「辅助的大招就是用来开团的」——苏烈大招蓄力期间不能动，盲目蓄力等于把自己钉在原地等人集火。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 02:21；BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：任何需要苏烈先手的局面判断依据：对面站位是否进入三段普攻的追击距离；"}, {"id": "K-A02", "cat": "A", "title": "二技能有两个完全不同的用途，别只用一个", "self": "<h3><a class=\"kref\" href=\"#K-A02\">K-A02<\/a> 二技能有两个完全不同的用途，别只用一个<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：二技能可用时<\/li><li><strong>判断依据<\/strong>：对面有没有正在进行的位移/突进技能<\/li><li><strong>决策分支<\/strong>：<\/li><li><strong>挡<\/strong>：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间<\/li><li><strong>推<\/strong>：抓落单时把目标推向队友方向，不是推离<\/li><li><strong>反例<\/strong>：「二技能就是个位移」——它同时是<strong>拦截<\/strong>手段。挡下一次开团的价值，往往高于推一个人。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48；BV1yke26fEYB @ 02:21<\/li><li><strong>可信度<\/strong>：中<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45触发条件：二技能可用时判断依据：对面有没有正在进行的位移/突进技能决策分支：挡：对面开团手（如孙策开大）冲过来时，用二技能挡在他和自己 C 位之间推：抓落单时把目标推向队友方向…"}, {"id": "K-A03", "cat": "A", "title": "被动是资源，不是保命符", "self": "<h3><a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 被动是资源，不是保命符<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>触发条件<\/strong>：每次准备进场前<\/li><li><strong>判断依据<\/strong>：被动是否可用（有 / 无）；队友是否在附近能\"点灯\"<\/li><li><strong>决策分支<\/strong>：<\/li><li>有被动 → 可以硬吃一波伤害，打出被动后还能给附近的双 C 回血<\/li><li>无被动 → <strong>不许硬接<\/strong>，只能打边缘消耗<\/li><li><strong>反例<\/strong>：「我是肉辅，先冲进去扛」——没被动时苏烈就是一个普通近战，进去等于送人头。字幕里出现过\"没点到灯，不然可以二技能跑\"，说明<strong>被动依赖队友点亮<\/strong>，队友不在时它根本不算数。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:00；BV1yke26fEYB @ 04:14；BV1yke26fEYB @ 06:31<\/li><li><strong>可信度<\/strong>：中高（\"点灯\"细节来自实战解说，非二手攻略）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A04\">K-A04<\/a> 前期不要抢打野的尾刀<\/h3>\n<p>这条<strong>跟苏烈无关<\/strong>，是游走通用纪律，已迁到 <code>L_分路/02_游走.md<\/code> 的 <code><a class=\"kref\" href=\"#K-L13\">K-L13<\/a><\/code>。原来源 BV1yke26fEYB @ 02:28 一并带过去。<\/p>\n<h2>4. 出装与铭文（两套，按位置选）<\/h2>\n<p><strong>打对抗路（边路）<\/strong><\/p>\n<ul><li>铭文：<strong>10 狩猎 + 10 鹰眼 + 10 异变<\/strong>（\"百穿\"，狩猎是为了保攻速）<\/li><li>出装：对线强 → 先荆棘护手；对线不强 → 攻速鞋 → <strong>第二件必出暗影战斧<\/strong>（给 CD + 穿透 + 输出）→ 荆棘护手升反甲<\/li><li>来源：BV1BpdNYZEYj @ 04:54、@ 03:56、@ 04:11<\/li><\/ul>\n<p><strong>打游走（辅助）<\/strong><\/p>\n<ul><li>铭文：<strong>10 宿命 + 5 狩猎 + 5 调和 + 10 虚空<\/strong>（苏烈要兼顾开团，移速和坦度都得有）<\/li><li>出装：前期疾跑鞋（方便支援）→ 中后期换抵抗之靴（提高容错）；辅助装按对局选（射手需要主动上前时先做星泉）<\/li><li>来源：BV17Vp9zXEx2 @ 01:10、@ 01:17、@ 01:32<\/li><\/ul>\n<p><strong>两条共同点<\/strong>：都不是\"堆输出\"的思路，铭文都在补攻速/移速/坦度，因为苏烈的核心是<strong>把控制打出来<\/strong>，不是自己打伤害。<\/p>\n<ul><li>版本提示：两条素材都未标 S45（浩克是训练营通用向、云兽是解析 AG 大帅的职业打法），<strong>具体装备数值以游戏内为准<\/strong>，配置结构可直接照用。<\/li><\/ul>\n<h2>5. 全局思路（辅助位）<\/h2>\n<blockquote><p><strong>分路层面<\/strong>的通用做法（开局去哪、怎么帮中、怎么跟射手）已统一收进 <code>L_分路/02_游走.md<\/code>，这一节只留苏烈自己的东西。<\/p><\/blockquote>\n<h3>（已移出）<a class=\"kref\" href=\"#K-A05\">K-A05<\/a> 开局：连人带兵一起消耗，而不是单纯抢线<\/h3>\n<p>这是<strong>游走通用动作<\/strong>（任何有消耗手段的辅助都该这么打），已迁到 <code><a class=\"kref\" href=\"#K-L14\">K-L14<\/a><\/code>。<\/p>", "sum": "这条跟苏烈无关，是游走通用纪律，已迁到 L_分路/02_游走.md 的 K-L13。"}, {"id": "K-A06", "cat": "A", "title": "被动要主动用，别舍不得", "self": "<h3><a class=\"kref\" href=\"#K-A06\">K-A06<\/a> 被动要主动用，别舍不得<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：有被动且能吃一波关键伤害<\/li><li><strong>判断依据<\/strong>：这波吃了之后，队友能不能跟着打赢<\/li><li><strong>决策分支<\/strong>：该触就触；触发后给附近双 C 回血，是团队收益<\/li><li><strong>反例<\/strong>：「留着被动保命」——原话直接说\"很多苏烈会舍不得触发被动，这点是错误的\"。<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:32<\/li><li><strong>可信度<\/strong>：高（与原 <a class=\"kref\" href=\"#K-A03\">K-A03<\/a> 一致，互为印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：有被动且能吃一波关键伤害判断依据：这波吃了之后，队友能不能跟着打赢决策分支：该触就触；"}, {"id": "K-A07", "cat": "A", "title": "开团前必须和队友沟通好\"帮你踩灯\"", "self": "<h3><a class=\"kref\" href=\"#K-A07\">K-A07<\/a> 开团前必须和队友沟通好\"帮你踩灯\"<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：准备先手开团<\/li><li><strong>判断依据<\/strong>：周围有没有队友能点亮你的被动<\/li><li><strong>决策分支<\/strong>：先打字/信号确认，再开团；没人踩灯就不要主动吃伤害<\/li><li><strong>来源<\/strong>：BV17Vp9zXEx2 @ 03:07<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 新手最容易崩在哪一步<\/h2>\n<ul><li><strong>在第 0 步（确认被动）上<\/strong>：忘记看被动，进场被判死一次之后整局都不敢开团，从\"开节奏\"退化成\"挂机跟团\"。<\/li><li><strong>在第 3 步（三棍）上<\/strong>：打两棍就急着交二技能，第三段击飞永远打不出来——苏烈的控制全在第三棍上。<\/li><\/ul>\n<h2>5. 待补<\/h2>\n<ul><li>具体数值（被动冷却、大招蓄力时长、二技能距离）<strong>未从素材中获得<\/strong>，需官网英雄页核对后补。<\/li><li>对抗路/辅助两套配置已补（见第 4 节），但都未标 S45，数值需游戏内核对。<\/li><li>强势期/弱势期缺素材（该视频是顺风局，看不出逆风时苏烈的下限）。<\/li><\/ul>\n<h2>冲击巅峰千强补充（seed）<\/h2>\n<ul><li><strong>大闪开团<\/strong>：大闪是起手式。熟练之后可以<strong>反向着大<\/strong>——大招有偏心判定，对面会误判打不到。<\/li><li><strong>一技能强化 A 的前后摇能被大招取消<\/strong>：所以连招里大招不只是伤害，是<strong>取消器<\/strong>。<\/li><li><strong>二技能只要边缘擦到脚下红圈就能推到<\/strong>：前摇带<strong>假霸体<\/strong>，可以顶着控制推。<\/li><li><strong>蓄大时把手指按在取消键上<\/strong>：被打断不会自动放出去。<\/li><li><strong>残血别贴墙<\/strong>：灯会卡墙里，队友点不到。<\/li><li><strong>怕大司命、甄姬造出来的墙<\/strong>：撤退撞墙会直接停住。<\/li><\/ul>\n<ul><li>来源：冲击巅峰千强-辅助篇-总结.docx（BV1ydMZ6bE8n）<\/li><\/ul>", "sum": "触发条件：准备先手开团判断依据：周围有没有队友能点亮你的被动决策分支：先打字/信号确认，再开团；"}], "b": [{"id": "K-B01", "cat": "B", "title": "对孙策：机制克——二技能能挡下他的船", "self": "<h3><a class=\"kref\" href=\"#K-B01\">K-B01<\/a> 对孙策：机制克——二技能能挡下他的船<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：孙策（开大冲脸）<\/li><li><strong>克制层级<\/strong>：<strong>机制克<\/strong><\/li><li><strong>我该怎么做<\/strong>：孙策开大的一瞬间，把二技能放在<strong>他和自家 C 位之间<\/strong>，用身位当墙。挡下来之后不要追，退回 C 位旁边。<\/li><li><strong>反向反制<\/strong>：孙策可以等你二技能交完再开船；所以<strong>二技能不要提前交在别的地方<\/strong>。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 03:48<\/li><li><strong>可信度<\/strong>：中（单来源实战解说）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：孙策（开大冲脸）克制层级：机制克我该怎么做：孙策开大的一瞬间，把二技能放在他和自家 C 位之间，用身位当墙。", "opp": "孙策"}, {"id": "K-B02", "cat": "B", "title": "对云缨：她的霸体期间你什么都做不了，等结束再推", "self": "<h3><a class=\"kref\" href=\"#K-B02\">K-B02<\/a> 对云缨：她的霸体期间你什么都做不了，等结束再推<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：云缨（大招霸体）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>苏烈被克<\/strong>，不是克别人<\/li><li><strong>我该怎么做<\/strong>：云缨开大期间不要试图控制她，<strong>等霸体结束<\/strong>再往队友方向推。<\/li><li><strong>反例<\/strong>：「我是硬辅，控住就行」——霸体期间控制无效，你的三棍和大招全部白交，还把自己留在她身边。<\/li><li><strong>来源<\/strong>：BV1yke26fEYB @ 04:55；BV1yke26fEYB @ 04:57<\/li><li><strong>可信度<\/strong>：中高（解说里明确说了\"他的大招有霸体，插不了火，等他结束往宫本那边推\"）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>苏烈怕哪些远程消耗型辅助（无素材）<\/li><li>苏烈对软辅（大乔、蔡文姬类）的压制关系（无素材）<\/li><li>以上两条需要专门的\"对位\"视频，<code>B_克制关系/_说明.md<\/code> 已记门槛<\/li><\/ul>", "sum": "适用版本：S45针对对手：云缨（大招霸体）克制层级：机制克（反向）——这条是苏烈被克，不是克别人我该怎么做：云缨开大期间不要试图控制她，等霸体结束再往队友方向推。", "opp": "云缨"}], "lanes": ["roam"], "tempo": "even", "job": "open", "motto": "大闪开团，蓄大时手指按在取消键上", "n": 7, "b_n": 2, "vs": ["云缨", "孙策"], "incoming": [], "lane_names": ["游走"]}, {"name": "铠", "hue": 214, "a": [{"id": "", "cat": "", "title": "1. 机制内核：大招给的不是伤害，是\"每段减伤\"", "self": "<h3>1. 机制内核：大招给的不是伤害，是\"每段减伤\"<\/h3>", "html": "<p>三段机制要分开看：<\/p>\n<div class=\"tw\"><table><thead><tr><th>机制<\/th><th>内容<\/th><th>带来什么<\/th><\/tr><\/thead><tbody><tr><td><strong>大招<\/strong><\/td><td>巨额物理攻击加成 + <strong>每一段攻击格挡固定伤害<\/strong><\/td><td>不是\"变肉\"，是\"<strong>多段伤害打不进来<\/strong>\"<\/td><\/tr><tr><td><strong>二技能<\/strong><\/td><td>位移 + 强化普攻，<strong>强普持续 5 秒<\/strong><\/td><td>可以<strong>提前存<\/strong>，所以铠能\"手里常备一发\"<\/td><\/tr><tr><td><strong>一技能<\/strong><\/td><td>命中给自己加速/攻速，命中敌人给减速<\/td><td>留人靠这个，不靠平 A<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>由此推出铠真正的强度来源：<\/strong><\/p>\n<ul><li>因为大招是<strong>每段<\/strong>格挡 → 铠极度克制<strong>高频多段伤害<\/strong>：澜、后羿的强化平A、嬴政大招（BV1rZLv65EhP @ 03:24）<\/li><li>因为大招给巨额攻击力 → <strong>全肉只有一把红刀也能切后排<\/strong>（全肉 + 红刀血量约 1.2–1.3 万，同时还能给自己减速/加速/百分比回血/加攻速/群体控制，BV1rZLv65EhP @ 04:40）<\/li><li>因为强普能存 5 秒 → 铠的爆发是\"两段强普叠在一起\"，不是一段<\/li><\/ul>", "sum": "三段机制要分开看："}, {"id": "", "cat": "", "title": "2. 三个必须练成肌肉记忆的细节", "self": "<h3>2. 三个必须练成肌肉记忆的细节<\/h3>", "html": "<h3>2.1 双强普：有二技能就放，手里永远留一发<\/h3>\n<p>强普持续 5 秒，有蓝 Buff 时二技能 CD 很短。所以正确做法是<strong>二技能有了就按<\/strong>，让自己手里始终挂着一次强普；靠近目标后 <strong>2A<\/strong> 连打两次强普（BV1VTdGBaEXg @ 02:20）。<\/p>\n<p>清野时也一样，双强普能让清野更快。<strong>这不是花活，是铠唯一的\"爆发窗口\"构造方式。<\/strong><\/p>\n<h3>2.2 一技能可以扔野怪和小兵<\/h3>\n<p>一技能不好标人时，<strong>扔旁边的野怪或小兵<\/strong>，一样能吃到移速和攻速（BV1VTdGBaEXg @ 02:32）。<\/p>\n<p>进阶：像蔡文姬弹弹弹一样，<strong>通过小兵把减速传到人身上<\/strong>——同一句话里 UP 给的两个用法，第二个需要小兵和人在一条线上。<\/p>\n<h3>2.3 两个操作设置（直接影响上限）<\/h3>\n<ul><li><strong>普攻近距离优先选\"主要\"<\/strong>：用来送方向盘穿墙（BV1VTdGBaEXg @ 00:45）<\/li><li><strong>技能中断方式改成\"拖动\"<\/strong>：这样团战里乱点也不会把大招提前取消（BV1VTdGBaEXg @ 00:45）<\/li><\/ul>", "sum": "强普持续 5 秒，有蓝 Buff 时二技能 CD 很短。"}, {"id": "", "cat": "", "title": "3. 出装与铭文", "self": "<h3>3. 出装与铭文<\/h3>", "html": "<p><strong>顺序（阿泽/浩宇版）<\/strong>：<\/p>\n<pre><code>野刀 → 二级野刀 → CD 鞋 → 暗影战斧 → 荆棘护手 → 反甲 → 宗师之力 → 破魔刀/魔女<\/code><\/pre>\n<p>逐件的理由（BV1VTdGBaEXg @ 00:57–01:52）：<\/p>\n<div class=\"tw\"><table><thead><tr><th>件<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>二级野刀 → <strong>CD 鞋<\/strong><\/td><td>冷却鞋 + 蓝 Buff 直接凑满 35% CD，大招好得特别快，前期打架能力更强<\/td><\/tr><tr><td><strong>暗影战斧<\/strong><\/td><td>核心装备。对面有猴子/机小满这种高爆发物伤 → <strong>换护甲鞋<\/strong>；法伤高或控制多 → <strong>换抵抗鞋<\/strong>；前期大逆风可先换鞋抗压<\/td><\/tr><tr><td><strong>荆棘护手<\/strong>（前期先出）<\/td><td>加护甲，做完再升大打野刀发育<\/td><\/tr><tr><td><strong>反甲<\/strong><\/td><td>护手合成<\/td><\/tr><tr><td><strong>宗师之力<\/strong><\/td><td>提爆发<\/td><\/tr><tr><td><strong>破魔刀 / 魔女斗篷<\/strong><\/td><td>想伤害高选破魔刀；对面有炸弹猫这种消耗强的做法系，出魔女<\/td><\/tr><tr><td><strong>名刀<\/strong>（预购）<\/td><td>大后期卖鞋换名刀 → 再换复活<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>铭文<\/strong>：蓝色 10 狩猎 / 绿色 10 鹰眼 / 红色 10 祸源（移速暴击铭文，BV1VTdGBaEXg @ 02:07）。<\/p>\n<blockquote><p><strong>核心心法<\/strong>：铠是\"<strong>每出一件新装备就是一个新的强度<\/strong>\"的英雄（BV1rZLv65EhP @ 01:44）。所以它不怕阵容——不适合做输出就直接做半肉，对面秒伤高就只留一把红刀。这也是为什么铠\"几乎可以不看任何阵容直接拿\"。<\/p><\/blockquote>", "sum": "顺序（阿泽/浩宇版）："}, {"id": "", "cat": "", "title": "4. 全局思路：一条时间轴", "self": "<h3>4. 全局思路：一条时间轴<\/h3>", "html": "<p>这条轴来自 2200 分逆风翻盘局（BV1VTdGBaEXg @ 02:46 起），<strong>注意它是逆风局<\/strong>，所以节奏偏保守。<\/p>\n<h3>4.0 开局先分析阵容，再决定帮哪路<\/h3>\n<p>常规是\"前期帮对抗路\"，但这一把<strong>中路边路强度都不如对面<\/strong>，于是改成<strong>帮发育路<\/strong>（@ 02:46）。<\/p>\n<p><strong>判据<\/strong>：不是\"打野该帮哪路\"，是\"<strong>哪路打得过<\/strong>\"。打不过的路去了只是送。<\/p>\n<h3>4.1 0:00–0:30 占位与存刀<\/h3>\n<ol><li>开局<strong>鞋子换野刀<\/strong>，增加出门速度（@ 02:59）<\/li><li><strong>先占红背草<\/strong>，防对面野辅入侵<\/li><li><strong>26 秒存第一刀强普<\/strong> → 30 秒红 Buff 刷新，直接穿墙 A 过来开红<\/li><\/ol>\n<p>开野路线：<strong>红 Buff + 小猪 + 猴子 → 蓝区双狼 + 蓝 Buff + 蜥蜴<\/strong>（红开刷六野，@ 03:13）。<\/p>\n<h3>4.2 刷完第一轮：能抓就抓，抓不到就蹭线<\/h3>\n<p>帮发育路尝试抓人，抓不到就<strong>蹭一波兵线<\/strong>，然后回中路帮抢线（@ 03:25）。<\/p>\n<p><strong>这条是打野的通用心法<\/strong>：支援的收益不是\"必须拿到人头\"，是\"<strong>追到有人头，追不到有兵线<\/strong>\"，不管结果如何都有钱拿（@ 04:01）。<\/p>\n<h3>4.3 4 分钟前：一波野区一波线<\/h3>\n<p>以快速发育为绝对优先。<strong>一波野区 + 一波线，经济高于连着刷两片野区<\/strong>，而且耗时更短（@ 04:13、@ 07:21）。<\/p>\n<h3>4.4 抢线权的连锁：这是本卡最值得学的一段<\/h3>\n<p>@ 05:04 的完整链条：<\/p>\n<pre><code>盯小地图 → 中路视野没漏就绝不出去\n→ 敌方中路在下路露头的瞬间，果断出来抢线\n→ 中路二打一拿到线权 → 自家中单解放，提前动起来\n→ 敌方打野只能后手清线\n→ 抓住这个窗口入侵他的红区\n→ 对面中路就算传送过来，也不可能比自家中路来得快<\/code><\/pre>\n<p><strong>这条链的核心<\/strong>：抢线权不是为了兵线，是为了<strong>制造一个 5 秒的窗口，让你的入侵合法<\/strong>。单看\"抢中线\"没有意义，看\"抢完能做什么\"才有。<\/p>\n<h3>4.5 4–7 分钟：加速发育 + 推进反野<\/h3>\n<ul><li>有优势就<strong>先压边塔<\/strong>——边塔掉了才有更多入侵机会（@ 06:06）<\/li><li>优势时<strong>带队友吃对面野区<\/strong>，滚雪球（@ 07:09）<\/li><li><strong>不超过半图的团战都要跟<\/strong>，且是<strong>后手入场<\/strong>（对面技能交得差不多了，@ 06:57）<\/li><\/ul>\n<h3>4.6 让红的判断（很多人做错）<\/h3>\n<p>铠<strong>不太吃红 Buff<\/strong>：留人主要靠一技能减速，很少有机会直接 A 到人，所以中后期有没有红区别不大（@ 06:19）。<\/p>\n<p><strong>让红的时间点取决于射手水平<\/strong>：<\/p>\n<ul><li>射手会玩 → <strong>5–6 分钟后就可以让<\/strong><\/li><li>射手一般 → <strong>9–10 分钟再让<\/strong><\/li><\/ul>\n<h3>4.7 7–10 分钟：为强化龙团做准备<\/h3>\n<ul><li>主要任务是<strong>抓掉点 + 加快推进<\/strong>（@ 07:57）<\/li><li>没机会就<strong>去边路带线<\/strong>——铠单挑基本无敌，而且\"一组兵线一片野\"比刷两片野经济更高、耗时更少（@ 08:10）<\/li><\/ul>\n<h3>4.8 10 分钟龙团：必须藏视野绕后<\/h3>\n<p><strong>这是铠最容易送的一波。<\/strong> 铠不算灵活，打正面很容易被对面中射消耗掉状态，之后想参团就进不去了（@ 09:11）。<\/p>\n<p>标准流程（@ 09:35）：<\/p>\n<pre><code>先藏好视野 → 等辅助/边路把团开起来 → 立刻绕后切 C\n→ 打掉点形成人数差 → 再稳稳拿龙<\/code><\/pre>\n<h3>4.9 顺风逆风的资源选择<\/h3>\n<p><strong>顺风优先拿暴君，逆风优先拿主宰<\/strong>（@ 08:58）。<\/p>", "sum": "这条轴来自 2200 分逆风翻盘局（BV1VTdGBaEXg @ 02:46 起），注意它是逆风局，所以节奏偏保守。"}, {"id": "", "cat": "", "title": "5. 铠弱在哪（要提前知道）", "self": "<h3>5. 铠弱在哪（要提前知道）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>弱点<\/th><th>表现<\/th><th>应对<\/th><\/tr><\/thead><tbody><tr><td><strong>逆风纠结<\/strong><\/td><td>出肉扛不住，出输出又切不到人（BV1rZLv65EhP @ 02:53）<\/td><td>多憋两件装备，别在只有一件成品时就强开<\/td><\/tr><tr><td><strong>怕灵活后排<\/strong><\/td><td>对面\"牛魔 + 马可\"、\"孙尚香 + 张飞\"这类组合，切后排极难（@ 03:08）<\/td><td>改打\"保护 + 拆火\"：和自家中路一起蹲对面打野切 C 的时机（BV1VTdGBaEXg @ 08:45）<\/td><\/tr><tr><td><strong>装备太多挑花眼<\/strong><\/td><td>同一个局面有三四种能出的装<\/td><td>先定\"这局我是切 C 还是吃伤害\"，再选装<\/td><\/tr><\/tbody><\/table><\/div>", "sum": "弱点表现应对逆风纠结出肉扛不住，出输出又切不到人（BV1rZLv65EhP @ 02:53）多憋两件装备，别在只有一件成品时就强开怕灵活后排对面\"牛魔 + 马可\"、\"孙尚香 + 张飞\"这类组合…"}, {"id": "", "cat": "", "title": "6. 一句话", "self": "<h3>6. 一句话<\/h3>", "html": "<p><strong>铠的强度不在操作，在\"你什么时候存下那两发强普\"和\"你绕后之前有没有藏住视野\"。<\/strong><\/p>", "sum": "铠的强度不在操作，在\"你什么时候存下那两发强普\"和\"你绕后之前有没有藏住视野\"。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li>边路铠（现在不推荐，但有人在玩）—— 无素材<\/li><li>铠的具体对位（打谁好打、怕谁）—— 见 <code>B_克制关系/<\/code>，目前只有\"刘备怎么打铠\"一条线索（BV1fj411U7tr），还没整理成条<\/li><\/ul>", "sum": "边路铠（现在不推荐，但有人在玩）—— 无素材铠的具体对位（打谁好打、怕谁）—— 见 B_克制关系/，目前只有\"刘备怎么打铠\"一条线索（BV1fj411U7tr），还没整理成条"}], "b": [], "lanes": ["jungle"], "tempo": "late", "job": "split", "motto": "存两发强普，绕后之前先藏住视野", "n": 7, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["打野"]}, {"name": "元歌", "hue": 177, "a": [{"id": "", "cat": "", "title": "1. 被动与傀儡：三条必须先背的规则", "self": "<h3>1. 被动与傀儡：三条必须先背的规则<\/h3>", "html": "<h3>1.1 碎片：普攻/技能命中敌方英雄就收集，50 个变一次敌方英雄<\/h3>\n<ul><li>背包最多 <strong>150 个<\/strong><\/li><li>每消耗 <strong>50 个<\/strong>可以变成<strong>任意敌方英雄<\/strong><\/li><li>元歌的\"恢复\"技能被换成了碎片（不是回血键）<\/li><li><strong>来源<\/strong>：BV1G8etzKEKV @ 00:17、@ 00:34<\/li><\/ul>\n<h3>1.2 变身只能持续 10 秒，但可以卡最后一秒延长<\/h3>\n<ul><li>屏幕<strong>变暗<\/strong>说明只剩最后 2 秒<\/li><li><strong>卡最后一秒接持续技能<\/strong>可以延长变身时间：孙策的开船、马可的一三技能、嬴政的大招<\/li><li><strong>来源<\/strong>：@ 00:52<\/li><\/ul>\n<h3>1.3 傀儡被打死 = 本体眩晕 2 秒 + 20 秒不能再召唤（最致命的一条）<\/h3>\n<ul><li>眩晕 2 秒且<strong>不能用四技能解除<\/strong><\/li><li>20 秒内<strong>禁止召唤傀儡<\/strong><\/li><li><strong>补救<\/strong>：傀儡即将死亡时<strong>秒按四技能位移<\/strong>，或用 <strong>332 连招<\/strong>，可以免疫眩晕<\/li><li><strong>来源<\/strong>：@ 02:17、@ 02:33<\/li><\/ul>", "sum": "1.1 碎片：普攻/技能命中敌方英雄就收集，50 个变一次敌方英雄背包最多 150 个每消耗 50 个可以变成任意敌方英雄元歌的\"恢复\"技能被换成了碎片（不是回血键）来源：BV1G8etzKE…"}, {"id": "", "cat": "", "title": "2. 技能细节（每条都是\"说明里没写\"的）", "self": "<h3>2. 技能细节（每条都是\"说明里没写\"的）<\/h3>", "html": "<h3>2.1 一技能（丢/收傀儡）<\/h3>\n<div class=\"tw\"><table><thead><tr><th>细节<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>回收收益<\/td><td>回收傀儡会加<strong>护盾 + 最高 80% 移速<\/strong><\/td><\/tr><tr><td>击飞<\/td><td>丢出和回收<strong>都对路径上的敌人造成击飞<\/strong><\/td><\/tr><tr><td>身后判定<\/td><td>丢和收都有<strong>一个身位左右的身后判定<\/strong><\/td><\/tr><tr><td><strong>塔下消耗<\/strong><\/td><td><strong>傀儡攻击塔下的敌人，防御塔不会攻击傀儡<\/strong> —— 越塔消耗的免费手段<\/td><\/tr><tr><td>傀儡能干嘛<\/td><td>吃经济经验、<strong>继承本体的 Buff 效果<\/strong><\/td><\/tr><tr><td><strong>自动普攻<\/strong><\/td><td>放出傀儡后身边有三个圈：<strong>最内圈有攻击单位、且傀儡不出第二圈<\/strong>，本体就会<strong>自动普攻那个目标<\/strong>（本体和傀儡同时输出）<\/td><\/tr><tr><td>傀儡消失<\/td><td>傀儡出最大圈后脚下出现箭头，<strong>攒到五个箭头傀儡直接消失<\/strong>；走回圈内箭头归零<\/td><\/tr><tr><td><strong>解控<\/strong><\/td><td>本体被控制时，<strong>收回傀儡即可瞬间解除<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>来源<\/strong>：@ 01:09、@ 01:25、@ 01:43、@ 02:00、@ 02:17<\/li><\/ul>\n<h3>2.2 二技能（四枚暗器）<\/h3>\n<ul><li><strong>二技能瞬间马上接一技能<\/strong>：取消后摇，还能瞬间打出伤害和控制（一二都有严重前后摇）<\/li><li><strong>指示器不准<\/strong>：实际攻击距离比指示器<strong>远一个身位<\/strong><\/li><li><strong>不需要贴脸<\/strong>：与敌人保持<strong>半个闪现左右<\/strong>的距离，四枚暗器才能全中、爆发拉满<\/li><li><strong>可以二闪<\/strong>：但闪现<strong>只改释放位置，不改攻击方向<\/strong><\/li><li><strong>来源<\/strong>：@ 02:33、@ 02:53、@ 03:09<\/li><\/ul>\n<h3>2.3 三技能（十字斩）<\/h3>\n<ul><li><strong>两条线的中心斩中<\/strong>：伤害翻倍 + 有斩杀效果 + 减速<\/li><li><strong>前摇很长，但代码是瞬发<\/strong>：即使前摇时元歌被击杀，<strong>三技能还是会打出来<\/strong> → 极限反杀<\/li><li><strong>本体往后撤退<\/strong>：所以 <strong>二三连招<\/strong>是元歌最基础的高爆发连招<\/li><li><strong>可穿墙 + 无影步<\/strong>：卡视野反蹲、拉扯风筝都能用<\/li><li><strong>侧斩<\/strong>：单用一条线的末端攻击，<strong>能延长双倍攻击距离<\/strong> → 抢野怪、收割残血、远距离补刀<\/li><li><strong>来源<\/strong>：@ 03:26、@ 03:43、@ 04:02<\/li><\/ul>\n<h3>2.4 四技能<\/h3>\n<ul><li>释放时<strong>无法被选中<\/strong>，可躲伤害、穿墙逃跑，<strong>吃到控制也能直接解除<\/strong><\/li><li><strong>缺点<\/strong>：不能像净化一样清除负面效果（扁鹊的毒、李元芳的标记）<\/li><li><strong>来源<\/strong>：@ 04:21<\/li><\/ul>\n<h3>2.5 傀儡形态的三个技能<\/h3>\n<div class=\"tw\"><table><thead><tr><th>技能<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>傀儡二技能<\/td><td><strong>本体和傀儡互换位置<\/strong><\/td><\/tr><tr><td>傀儡三技能<\/td><td>两段：一段<strong>减速<\/strong>，三秒内可放第二段<strong>持续眩晕<\/strong> → <strong>133 是元歌最强的控制连招<\/strong><\/td><\/tr><tr><td>傀儡四技能<\/td><td><strong>带着本体一起位移<\/strong>；本体位移时<strong>像貂蝉二技能一样免疫伤害和控制<\/strong>；<strong>三三控制后接二技能换位也能卡出无敌和霸体<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>后摇取消<\/strong>：傀儡三技能第一段施法后摇严重，<strong>秒接平A 或收回傀儡<\/strong>都能取消 → 中后期进场能防傀儡被秒<\/li><li><strong>远程消耗<\/strong>：<strong>3A1<\/strong> 可以瞬间打出高额消耗<\/li><li><strong>来源<\/strong>：@ 04:38、@ 04:56、@ 05:13、@ 05:31<\/li><\/ul>", "sum": "2.1 一技能（丢/收傀儡）细节内容回收收益回收傀儡会加护盾 + 最高 80% 移速击飞丢出和回收都对路径上的敌人造成击飞身后判定丢和收都有一个身位左右的身后判定塔下消耗傀儡攻击塔下的敌人，防…"}, {"id": "", "cat": "", "title": "3. 三套连招（他明确说\"元歌真正的精髓只有三套\"）", "self": "<h3>3. 三套连招（他明确说\"元歌真正的精髓只有三套\"）<\/h3>", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>连招<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td><strong>1<\/strong><\/td><td>一（放傀儡）→ 四（突脸）→ 三三（减速+控制）→ 二（换回本体）→ 二三（打爆发）<\/td><td>前中期<strong>打消耗 + 秒脆皮<\/strong><\/td><\/tr><tr><td><strong>2<\/strong><\/td><td>一 → 四突脸 → 三一段（挂减速）→ 二换位 → 一收回傀儡（打出控制）→ 三二（打满爆发）<\/td><td>后期<strong>秒脆皮、越塔<\/strong>，速度极快<\/td><\/tr><tr><td><strong>3<\/strong><\/td><td>二一（起手控制）→ 挂减速 → 瞬间换位 → 收回傀儡（控制）→ 三（斩杀收割）<\/td><td><strong>蹲草 / 被贴脸反打<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>来源<\/strong>：@ 05:50、@ 06:10、@ 06:29<\/li><\/ul>\n<p><strong>共同结构<\/strong>：都是\"<strong>先挂控制 → 再打伤害<\/strong>\"。元歌的伤害全在\"对方动不了\"的那一秒里，所以顺序错了一整套就废。<\/p>", "sum": "共同结构：都是\"先挂控制 → 再打伤害\"。"}, {"id": "", "cat": "", "title": "4. 出装与铭文", "self": "<h3>4. 出装与铭文<\/h3>", "html": "<p><strong>铭文<\/strong>：10 异变 / 10 隐匿 / 10 鹰眼（@ 06:46）<\/p>\n<p><strong>出装顺序<\/strong>：<\/p>\n<pre><code>护手 → 布甲鞋 → 暗影战斧 → 苍穹 → 破军 → 冰痕 + 碎星锤<\/code><\/pre>\n<div class=\"tw\"><table><thead><tr><th>件<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>护手 + 布甲鞋<\/td><td>大幅提升<strong>前期对拼能力<\/strong><\/td><\/tr><tr><td>暗影战斧 + 苍穹<\/td><td><strong>爆发和容错同时拉满<\/strong><\/td><\/tr><tr><td>破军<\/td><td>大幅提高爆发<\/td><\/tr><tr><td>冰痕 + 碎星锤<\/td><td>常规收尾<\/td><\/tr><tr><td><strong>对面爆发高<\/strong><\/td><td><strong>冰痕换成防御装保命<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>原话批评了两种常见错法：冷缩不够（极其难受）、身板太脆（一碰就碎）。<\/p>", "sum": "铭文：10 异变 / 10 隐匿 / 10 鹰眼（@ 06:46）"}, {"id": "", "cat": "", "title": "5. 一句话", "self": "<h3>5. 一句话<\/h3>", "html": "<p><strong>元歌不是\"操作英雄\"，是\"信息英雄\"——你之所以打不出伤害，通常不是手速不够，是傀儡没先把对面按住。<\/strong><\/p>", "sum": "元歌不是\"操作英雄\"，是\"信息英雄\"——你之所以打不出伤害，通常不是手速不够，是傀儡没先把对面按住。"}, {"id": "", "cat": "", "title": "待补", "self": "<h3>待补<\/h3>", "html": "<ul><li><strong>全局节奏与分路细节<\/strong>（这张卡只有机制和连招）：元歌什么时候该带线、什么时候该蹲、逆风怎么打 —— <strong>本次唯一可用素材没讲<\/strong><\/li><li><strong>对位关系<\/strong>：已知线索\"元歌对云缨\"（BV14kiYB8E7R）但说话人主玩英雄未确认，未入库<\/li><li>侧斩、三角杀等进阶手法的逐帧说明（文字无法承载，建议看原片）<\/li><\/ul>", "sum": "全局节奏与分路细节（这张卡只有机制和连招）：元歌什么时候该带线、什么时候该蹲、逆风怎么打 —— 本次唯一可用素材没讲对位关系：已知线索\"元歌对云缨\"（BV14kiYB8E7R）但说话人主玩英雄…"}], "b": [], "lanes": ["solo"], "tempo": "mid", "job": "scout", "motto": "傀儡是眼睛，本体是刀", "n": 6, "b_n": 0, "vs": [], "incoming": [], "lane_names": ["对抗路"]}, {"name": "女娲", "hue": 123, "a": [{"id": "K-A71", "cat": "A", "title": "女娲前期没有线权，别抢", "self": "<h3><a class=\"kref\" href=\"#K-A71\">K-A71<\/a> 女娲前期没有线权，别抢<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：开局对线<\/li><li><strong>判断依据<\/strong>：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）<\/li><li><strong>决策分支<\/strong>：<\/li><li>抢不过 → 一技能丢四个兵就往后走，<strong>保血线<\/strong><\/li><li>抢得过 → 正常推，但别越塔<\/li><li><strong>反例<\/strong>：「中单必须抢线」——女娲前期 CD 长、伤害低，被打掉状态后连野区防守都参与不了。<\/li><li><strong>通用面<\/strong>：「线权看对面清线速度」本身是中路通用判据，见 <code><a class=\"kref\" href=\"#K-L01\">K-L01<\/a><\/code>。这条留在英雄卡里的部分只有<strong>女娲自己的强度曲线<\/strong>（前期 CD 长、伤害低）。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 02:41<\/li><li><strong>可信度<\/strong>：高（原话直接给了判断与后果）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：开局对线判断依据：对面中单是不是\"一技能就能清完线\"的类型（如安琪拉）决策分支：抢不过 → 一技能丢四个兵就往后走，保血线抢得过 → 正常推，但别越塔反例：「中单必须抢线」——女娲前…"}, {"id": "K-A72", "cat": "A", "title": "支援靠三技能，但传送会被打断", "self": "<h3><a class=\"kref\" href=\"#K-A72\">K-A72<\/a> 支援靠三技能，但传送会被打断<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：边路打起来、需要支援<\/li><li><strong>判断依据<\/strong>：传送落点是否安全、自己是否会被打断<\/li><li><strong>决策分支<\/strong>：<\/li><li>安全 → 三技能坐过去，落地一推二控<\/li><li>有风险 → 走过去或用大招远程补伤害<\/li><li><strong>反例<\/strong>：「三技能当闪现用」——传送期间不能动，被看到就是一个活靶子。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 01:04、@ 03:58<\/li><li><strong>可信度<\/strong>：高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：边路打起来、需要支援判断依据：传送落点是否安全、自己是否会被打断决策分支：安全 → 三技能坐过去，落地一推二控有风险 → 走过去或用大招远程补伤害反例：「三技能当闪现用」——传送期间…"}, {"id": "K-A73", "cat": "A", "title": "多看小地图，绕后切射手比打正面团收益高", "self": "<h3><a class=\"kref\" href=\"#K-A73\">K-A73<\/a> 多看小地图，绕后切射手比打正面团收益高<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：中路团战僵持<\/li><li><strong>判断依据<\/strong>：小地图上有没有落单的射手/后排<\/li><li><strong>决策分支<\/strong>：三技能传送到侧面 → 一推 → 二技能控制 → 平A/大招收掉<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 05:02（\"女娲不要一直盯着正面的团战，多看小地图\"）<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：中路团战僵持判断依据：小地图上有没有落单的射手/后排决策分支：三技能传送到侧面 → 一推 → 二技能控制 → 平A/大招收掉来源：BV18ns8zmE6j @ 05:02（\"女娲不要…"}, {"id": "K-A74", "cat": "A", "title": "二技能是\"墙 + 控制\"，不是伤害技能", "self": "<h3><a class=\"kref\" href=\"#K-A74\">K-A74<\/a> 二技能是\"墙 + 控制\"，不是伤害技能<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：任何要打控制链的时刻<\/li><li><strong>判断依据<\/strong>：当前场上还有几个方块（可存 3 个）<\/li><li><strong>决策分支<\/strong>：<\/li><li>有 2 个 → 合长方形夹人<\/li><li>有 4 个 → 合大正方形封路<\/li><li><strong>反例<\/strong>：「方块丢出去就行」——不会合的方块只是占位，合起来才有控制。<\/li><li><strong>来源<\/strong>：BV18ns8zmE6j @ 00:39<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>6. 对位情报（来自对手视角）<\/h2>\n<ul><li><strong>海月 vs 女娲<\/strong>：海月的说法是\"对线女娲八二开\"，理由是海月三个一技能秒掉第一波兵线拿到线权，然后立刻进野区做事。反过来说：<strong>女娲遇到能秒线的法师，前期基本没线权，只能后手清线<\/strong>。<\/li><li>来源：BV1K8gDzwEho @ 00:00、@ 00:03<\/li><li>可信度：中（单一来源，且是对手视角）<\/li><\/ul>\n<h2>7. 最容易崩的地方<\/h2>\n<ol><li><strong>前期硬抢线<\/strong>：被打掉状态，野区防不了，节奏全丢。<\/li><li><strong>三技能传送到人堆<\/strong>：传送中不能动，落地就是死。<\/li><li><strong>只顾正面团<\/strong>：女娲最强的用法是\"传侧面打后排\"，站正面输出等于浪费被动。<\/li><\/ol>\n<h2>8. 待补<\/h2>\n<ul><li>完整六件套顺序。<\/li><li>S45 版本是否调整过被动/施法距离成长。<\/li><li>对位结论（现无 <code>B_克制关系/女娲.md<\/code>；已有海月视角一条，可补反向）。<\/li><\/ul>", "sum": "触发条件：任何要打控制链的时刻判断依据：当前场上还有几个方块（可存 3 个）决策分支：有 2 个 → 合长方形夹人有 4 个 → 合大正方形封路反例：「方块丢出去就行」——不会合的方块只是占位…"}], "b": [{"id": "K-B04", "cat": "B", "title": "对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来", "self": "<h3><a class=\"kref\" href=\"#K-B04\">K-B04<\/a> 对海月：机制克（她克你）——你的击退对她无效，她的幻境你出不来<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：海月（中路对线）<\/li><li><strong>克制层级<\/strong>：<strong>机制克（反向）<\/strong>——这条是<strong>女娲被克<\/strong>。国服海月原话：<strong>「海月对线女娲八二开」<\/strong>。<\/li><li><strong>为什么是机制克<\/strong>（三层，缺一层这条就不成立）：<\/li><\/ul>\n<ol><li><strong>线权差<\/strong>：海月三个一技能光速清掉第一波兵，女娲前期清线慢，<strong>先手权在她手上<\/strong>。<\/li><li><strong>你的控制被免疫<\/strong>：海月有免控，能直接躲掉女娲一技能的击退（<code>BV1K8gDzwEho @ 02:00<\/code>）。<\/li><li><strong>你的保命被废<\/strong>：女娲唯一的位移是三技能传送，<strong>读条中被打断就走不掉<\/strong>（见 A 卡第 2 节）；海月大招把人拉走单挑，女娲在幻境里没有位移可用。<\/li><\/ol>\n<ul><li><strong>我该怎么做<\/strong>（可执行，不是「小心点」）：<\/li><li><strong>不在正面单走<\/strong>。中期海月不站正面、专门找「意想不到的位置」单杀落单的人（<code>@ 02:10<\/code>、<code>@ 02:17<\/code>）。女娲清线、补刀都要贴着队友或塔。<\/li><li><strong>一技能别当唯一控制用<\/strong>。她免控能吃掉你的击退，指望「一推→大」这套接死海月是错的——推不到，大招就是空。<\/li><li><strong>记她大招<\/strong>。她大招拉到谁都是赚（<code>@ 02:41<\/code>「只要能打出持续掉点，拉谁都是一样的」）。她大交了，才是女娲进场的窗口。<\/li><li>自己的大招是<strong>全图<\/strong>的：她要单杀你就得脱离阵型，这时候用大招支援被拉走/被追的队友，比跟她对拼划算。<\/li><li><strong>反向反制（她的破绽）<\/strong>：海月单杀依赖大招，<strong>大招 CD 期间她只是一个有线权的法师<\/strong>，没有硬控逃生；女娲可以趁这段用二技能墙封她退路，配合打野抓。<\/li><li><strong>来源<\/strong>：BV1K8gDzwEho @ 00:00；BV1K8gDzwEho @ 02:00；BV1K8gDzwEho @ 02:10；BV1K8gDzwEho @ 02:41<\/li><li><strong>可信度<\/strong>：中高（对手视角的原话 + 实战演示，两段互相印证）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "适用版本：S45针对对手：海月（中路对线）克制层级：机制克（反向）——这条是女娲被克。", "opp": "海月"}, {"id": "K-B05", "cat": "B", "title": "对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判", "self": "<h3><a class=\"kref\" href=\"#K-B05\">K-B05<\/a> 对嬴政：换血顺序错了必输——先躲，再夹，最后才用一技能预判<\/h3>", "html": "<ul><li><strong>适用版本<\/strong>：S45<\/li><li><strong>针对对手<\/strong>：嬴政（远程高伤 poke）<\/li><li><strong>克制层级<\/strong>：<strong>数值克<\/strong>——同一套换血流程，顺序错就被他先手打残<\/li><li><strong>我该怎么做<\/strong>：一次完整的对拼是<strong>四步<\/strong>，顺序不能换：<\/li><\/ul>\n<ol><li><strong>二技能先往后挪<\/strong>，把身位拉出他的伤害范围（<code>@ 20:31<\/code>）；<\/li><li>他跟进/回头时，<strong>二技能夹住他一下<\/strong>（<code>@ 20:32<\/code>）；<\/li><li><strong>一技能预瞄他的落点<\/strong>，不要瞄他当前站位（<code>@ 20:35<\/code>）；<\/li><li>前面三步都成立，<strong>1+3 才打得满<\/strong>（<code>@ 20:37<\/code>）。<\/li><\/ol>\n<ul><li><strong>反例<\/strong>：一起手就丢一技能——他手比你长，你的前摇在换血里就是白给，一技能空了后面全是挨打。<\/li><li><strong>反向反制<\/strong>：嬴政没有位移，被二技能夹住之后<strong>逃不掉<\/strong>；他的破绽在<strong>清线时身位固定<\/strong>，那时候夹最准。<\/li><li><strong>来源<\/strong>：BV1WkKzzUEtq @ 20:31；BV1WkKzzUEtq @ 20:32；BV1WkKzzUEtq @ 20:35；BV1WkKzzUEtq @ 20:37<\/li><li><strong>可信度<\/strong>：中（单来源实战解说，且该段字幕为 ASR 转写，「嬴政拉回来」一句语义有歧义，只取其余四步）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>\n<h2>待补<\/h2>\n<ul><li>女娲怕谁：突进型刺客（兰陵王、镜）的实际应对——无素材<\/li><li>女娲对炮台法师（干将、嬴政之外的）线权判断——仅嬴政一段，样本不足<\/li><\/ul>", "sum": "适用版本：S45针对对手：嬴政（远程高伤 poke）克制层级：数值克——同一套换血流程，顺序错就被他先手打残我该怎么做：一次完整的对拼是四步，顺序不能换：二技能先往后挪，把身位拉出他的伤害范围…", "opp": "嬴政"}], "lanes": ["mid"], "tempo": "late", "job": "hold", "motto": "用石头和传送把战场切开，不追人", "n": 6, "b_n": 2, "vs": ["嬴政", "海月"], "incoming": [], "lane_names": ["中路"]}, {"name": "夏洛特", "hue": 165, "a": [{"id": "K-A41", "cat": "A", "title": "一技能起手，不要大招/二技能起手", "self": "<h3><a class=\"kref\" href=\"#K-A41\">K-A41<\/a> 一技能起手，不要大招/二技能起手<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：每次进入连招<\/li><li><strong>判断依据<\/strong>：二技能是否还留着\"绿色\"（可用）<\/li><li><strong>决策分支<\/strong>：一技能起手 → 二技能 → 一技能……让二技能的位移始终握在手里<\/li><li><strong>反例<\/strong>：「先手大招开团」——大招交了，你的位移和霸体都没了，只剩站桩。<\/li><li><strong>来源<\/strong>：BV156QfBQEDd @ 01:58<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：每次进入连招判断依据：二技能是否还留着\"绿色\"（可用）决策分支：一技能起手 → 二技能 → 一技能……让二技能的位移始终握在手里反例：「先手大招开团」——大招交了，你的位移和霸体都没…"}, {"id": "K-A42", "cat": "A", "title": "打不到人时，斜着放", "self": "<h3><a class=\"kref\" href=\"#K-A42\">K-A42<\/a> 打不到人时，斜着放<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：一技能/强化普攻直线打空<\/li><li><strong>判断依据<\/strong>：目标是否在你的正前方移动<\/li><li><strong>决策分支<\/strong>：调整方向斜着放，靠范围边缘命中<\/li><li><strong>来源<\/strong>：BV1DL411h7Ui @ 00:50<\/li><li><strong>可信度<\/strong>：中高<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：一技能/强化普攻直线打空判断依据：目标是否在你的正前方移动决策分支：调整方向斜着放，靠范围边缘命中来源：BV1DL411h7Ui @ 00:50可信度：中高状态：active"}, {"id": "K-A43", "cat": "A", "title": "用\"闪烁\"穿过对面的技能（李白二技能这类）", "self": "<h3><a class=\"kref\" href=\"#K-A43\">K-A43<\/a> 用\"闪烁\"穿过对面的技能（李白二技能这类）<\/h3>", "html": "<ul><li><strong>触发条件<\/strong>：对面交出判定型范围技能（如李白二技能）<\/li><li><strong>判断依据<\/strong>：你是否有强化普攻/闪现可用<\/li><li><strong>决策分支<\/strong>：锁头像 → 强化普攻前冲穿过技能 → 不吃伤害也不吃负面<\/li><li><strong>反例<\/strong>：「绕着走」——绕路就丢了输出窗口。<\/li><li><strong>来源<\/strong>：BV1DL411h7Ui @ 02:23、@ 02:43<\/li><li><strong>可信度<\/strong>：中（单一来源演示）<\/li><li><strong>状态<\/strong>：active<\/li><\/ul>", "sum": "触发条件：对面交出判定型范围技能（如李白二技能）判断依据：你是否有强化普攻/闪现可用决策分支：锁头像 → 强化普攻前冲穿过技能 → 不吃伤害也不吃负面
